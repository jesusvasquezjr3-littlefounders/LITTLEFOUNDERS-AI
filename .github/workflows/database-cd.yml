name: database CD

# APPLIES ADDITIVE MIGRATIONS TO PRODUCTION. NOTHING ELSE, EVER.
#
# The scope is the whole design. Of the 49 migrations in this repository, 38 are
# purely additive: they add or widen, and nothing already deployed can break on
# them, so applying one before or after the code that uses it is equally safe.
# Those are worth automating, because the alternative is a human remembering.
#
# The other 11 remove or narrow something a running deploy could still be using.
# Applying one of those early takes the column away while an older service still
# names it and PostgREST rejects every write that does — which is exactly the
# mistake made by hand on 2026-08-26. Those are NOT automated here and must not
# be: `0049` deletes stored personal data irreversibly, and that deserves a
# person who has read the dry-run.
#
# The decision is `gate-auto-apply.mjs`, which refuses on every path that is not
# "I read the pending list and all of it is additive" — an unfinished dry-run,
# a file this checkout does not have, a missing phase header, a declaration that
# disagrees with the SQL. It has nine self-tests, one of which asserts that the
# real tree's pending `0049` blocks this workflow.

on:
  workflow_run:
    workflows: ['database CI']
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  apply:
    # Never on a red CI. The migrations that would be applied are the ones CI
    # just judged, and applying them anyway makes CI decorative.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Railway CLI
        run: npm i -g @railway/cli@5.43.1

      - name: Write SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.RAILWAY_SSH_PRIVATE_KEY }}" > ~/.ssh/railway_key
          chmod 600 ~/.ssh/railway_key
          # Railway's SSH proxy host is ephemeral per session, so there is no
          # fixed host key to pin and a fresh runner has none cached.
          # LogLevel ERROR is NOT optional here, and vault-backup.yml not having
          # it is why: that workflow only pipes a dump and never reads stdout.
          # `railway-migrate.sh` PARSES stdout, and ssh prints "Warning:
          # Permanently added 'ssh.railway.com' ..." on a runner with no cached
          # host key. The script merges that into psql's output and reads the
          # warning as a query result - recorded in its own source, observed on
          # 2026-08-21 as `FAIL: unexpected remote ledger state: Warning: ...`.
          # tutor-deploy.yml, the proven migrate path, silences it at the
          # source. So does this now.
          cat <<'CONFIG' >> ~/.ssh/config
          Host *
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            LogLevel ERROR
          CONFIG
          chmod 600 ~/.ssh/config

      # READ-ONLY. `--dry-run` inspects the remote ledger, lists pending files,
      # and writes nothing. `--confirm-production` appears exactly once in this
      # file, below, behind the gate.
      - name: Read the production ledger
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SSH_KEY_PATH: /home/runner/.ssh/railway_key
        run: |
          # `pipefail` because `tee` returns 0 whatever the script did. Without
          # it a FAILED probe produced an empty probe.txt, the gate correctly
          # answered "the dry-run did not complete", and the workflow reported
          # SUCCESS having learned nothing - a broken probe wearing the same
          # green tick as a healthy refusal (/AGENTS.md §1.14: failure must be
          # distinguishable from emptiness). Observed on run #1.
          set -euo pipefail
          bash database/scripts/railway-migrate.sh --dry-run | tee probe.txt

      - name: May this run apply on its own?
        id: gate
        run: |
          set -euo pipefail
          node database/scripts/gate-auto-apply.mjs probe.txt | tee decision.txt
          grep '^apply=' decision.txt >> "$GITHUB_OUTPUT"
          {
            echo "### database CD"
            echo ""
            sed -n 's/^reason=/**Decision:** /p' decision.txt
            echo ""
            echo '```'
            cat probe.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # A refusal is a successful run that did nothing, not a failure. Failing
      # here would page someone every time a contraction is waiting for its
      # release, and a job that cries wolf is a job people disable.
      - name: Stop — this batch needs a person
        if: steps.gate.outputs.apply != 'true'
        run: |
          sed -n 's/^reason=/Not applying: /p' decision.txt
          echo "Dispatch tutor-deploy.yml with step: migrate once the release it names is live."

      # A RESTORE POINT TAKEN NOW, not up to 24 hours ago. These are
      # vault-backup.yml's own commands: `railway ssh` exits 0 even when the
      # REMOTE command fails, so the `test -s` on the pulled file is the only
      # thing that actually proves a dump exists. Reporting a restore point that
      # was never taken is the worst lie to tell before touching a schema.
      - name: Pre-migration dump
        if: steps.gate.outputs.apply == 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail
          FILE="pre-migration-$(date -u +%Y%m%d-%H%M%S).dump"
          railway ssh --service db -i ~/.ssh/railway_key -- \
            pg_dump -U supabase_admin -d postgres -Fc -f /tmp/premig.dump
          railway ssh --service db -i ~/.ssh/railway_key -- \
            cat /tmp/premig.dump > "$FILE"
          test -s "$FILE"
          cat "$FILE" | railway ssh --service filebase -i ~/.ssh/railway_key -- \
            sh -c "cat > /data/backups/$FILE"
          railway ssh --service db -i ~/.ssh/railway_key -- rm -f /tmp/premig.dump
          echo "Restore point: /data/backups/$FILE ($(wc -c < "$FILE") bytes)"

      - name: Apply
        if: steps.gate.outputs.apply == 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SSH_KEY_PATH: /home/runner/.ssh/railway_key
        run: bash database/scripts/railway-migrate.sh --confirm-production

      # The migrator already ends each apply transaction with
      # `NOTIFY pgrst, 'reload schema'`, so this is not the reload — it is the
      # proof that the ledger moved and the API is answering afterwards. A
      # migration that leaves Core unable to serve is not a migration that
      # succeeded, whatever the exit code said.
      - name: Verify
        if: steps.gate.outputs.apply == 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SSH_KEY_PATH: /home/runner/.ssh/railway_key
        run: |
          set -euo pipefail
          bash database/scripts/railway-migrate.sh --dry-run | tee after.txt
          if grep -q '^pending ' after.txt; then
            echo "FAIL: migrations are still pending after applying"
            exit 1
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 https://api-b2c.littlefounders.ai/health)
          echo "Core /health -> $code"
          [ "$code" = "200" ] || { echo "FAIL: Core is not healthy after the migration"; exit 1; }
