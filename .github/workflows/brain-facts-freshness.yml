name: Brain Facts Freshness

# Heartbeat mensual de FRESCURA de la tabla canónica (_meta/facts.yaml).
# El bug del "reloj congelado" hacía que ningún fact venciera nunca; update_facts ahora usa wall-clock.
# Este cron lo ejecuta sin intervención y AVISA cuando hay cifras vencidas (sin auto-editar: SME aprueba).
#   · Siempre: corre `--due` (sin red, sin keys) y abre un issue si hay vencidos.
#   · Opcional: si están configurados los secrets (ZAI_API_KEY/ZAI_BASE_URL), corre `--verify` (búsqueda
#     en fuente primaria) y sube el reporte como artefacto para revisión humana.

on:
  schedule:
    - cron: '0 9 1 * *'        # día 1 de cada mes, 09:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  freshness:
    runs-on: ubuntu-latest
    env:
      ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
      ZAI_BASE_URL: ${{ secrets.ZAI_BASE_URL }}
    defaults:
      run:
        working-directory: littlefounders_brain/rag-llm-brain
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: pip install pyyaml

      - name: Hechos vencidos (wall-clock, sin red)
        id: due
        run: |
          python3 knowledge/tools/update_facts.py --due | tee /tmp/due.txt
          echo "count=$(grep -c '·' /tmp/due.txt || true)" >> "$GITHUB_OUTPUT"

      - name: Verificación atómica en fuente primaria (solo si hay secrets)
        if: ${{ env.ZAI_API_KEY != '' }}
        run: |
          printf 'ZAI_API_KEY=%s\nZAI_BASE_URL=%s\n' "$ZAI_API_KEY" "${ZAI_BASE_URL:-https://api.z.ai/api/paas/v4}" > .env
          python3 knowledge/tools/update_facts.py --verify || true
          rm -f .env

      - name: Subir reporte de frescura (si existe)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: facts-update-report
          path: littlefounders_brain/rag-llm-brain/index/facts_update_report.json
          if-no-files-found: ignore

      - name: Abrir issue si hay cifras vencidas
        if: ${{ steps.due.outputs.count != '0' && steps.due.outputs.count != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "El heartbeat mensual detectó cifras canónicas VENCIDAS en \`facts.yaml\`."
            echo ""
            echo '```'
            cat /tmp/due.txt
            echo '```'
            echo ""
            echo "Acción: correr \`update_facts.py --verify\` (con keys), actualizar value+last_verified en"
            echo "\`facts.yaml\` con aprobación SME, y regenerar los docs afectados (\`--retry-drafts\`)."
          } > /tmp/issue_body.md
          gh issue create \
            --title "Frescura del cerebro: cifras vencidas ($(date +%Y-%m))" \
            --body-file /tmp/issue_body.md || true
