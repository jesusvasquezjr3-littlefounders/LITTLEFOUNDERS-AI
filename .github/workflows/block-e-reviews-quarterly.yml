name: Quarterly Block E review

# Appendix J Part 1.4 (Threshold Recalibration Log: "every threshold reviewed
# at least once per defined cadence (proposed: quarterly for the first
# year)"), Part 3 Stage 7 (the Safety/Trust Lead, on the cadence in the log)
# and E.7 (the moving regulation is re-checked against current sources).
#
# Two triggers, as for the Block A, B, C and D reviews:
#   - per release: agent/tools/release-readiness.sh runs
#     block-e-review-cadence.mjs --strict, which fails while a threshold or a
#     regulatory watch-list item in docs/rebuild/policies/SOCIAL-GOVERNANCE.md
#     (sections 1.2 and 1.3) is past its due date, or the log is malformed;
#   - per calendar quarter (THIS workflow): on 1 January, April, July and
#     October it opens the quarter's issue, labelled `block-e-review`, for the
#     Safety/Trust Lead: every threshold with its value, enforcing function,
#     last review and next due date, and every watch-list item to re-check.
#
# Nothing is read from Core or production: the schedule lives in the repo's
# policy. A malformed log still opens the issue (the review is due regardless)
# and turns the run red.
#
# agent/tools/block-e-reviews-quarterly.test.mjs pins the schedule, the tool
# call and the notification.

on:
  schedule:
    - cron: '0 9 1 1,4,7,10 *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  open-review:
    name: Open the quarter's Block E review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Write the review issue
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node agent/tools/block-e-reviews-quarterly.mjs --issue-file issue.md --title-file title.txt

      - name: Open the review issue for the Safety/Trust Lead
        if: always() && hashFiles('issue.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          title=$(cat title.txt)
          existing=$(gh issue list --state open --label block-e-review --search "\"$title\" in:title" --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "${existing:-}" ]; then
            gh issue comment "$existing" --body-file issue.md
          else
            gh label create block-e-review --color 0E8A16 --description 'Appendix J quarterly Block E review' 2>/dev/null || true
            gh issue create --title "$title" --label block-e-review --body-file issue.md
          fi
