name: pulse CD

# Deploys all five Pulse services after pulse CI passes on main. Builds are
# near-no-ops (FROM a pinned image + config COPYs), so redeploying the whole
# stack on any pulse/ change is simpler and safer than diffing per-service.
# Same gating pattern as every other *-cd.yml (workflow_run on CI success).

on:
  workflow_run:
    workflows: ["pulse CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    # Only a push to this repository's main deploys. `workflow_run` also fires for the CI run of a pull
    # request, and its `branches` filter matches the name of a fork's branch, so without these two
    # checks a fork's branch called "main" would be built and deployed with the deploy token.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    name: Deploy Pulse to Railway
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [plausible, clickhouse, db, umami, kuma]
      # Deploy sequentially: databases and their dependents share a stack;
      # parallel `railway up` calls have raced on project locks before.
      max-parallel: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Install Railway CLI
        run: npm i -g @railway/cli@5.43.1
      - name: Deploy pulse-${{ matrix.service }}
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway up pulse/railway/${{ matrix.service }} --path-as-root \
            --service pulse-${{ matrix.service }} --ci
