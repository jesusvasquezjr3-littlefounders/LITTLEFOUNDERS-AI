name: email-server CI

on:
  push:
    branches: [main, littlefounders_v2]
    paths:
      - 'email-server/**'
      - '.github/workflows/email-server-ci.yml'
  pull_request:
    paths:
      - 'email-server/**'
      - '.github/workflows/email-server-ci.yml'

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: email-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: email-server/package-lock.json
      - run: npm ci
      - run: npm run type-check
      - run: npm run lint
      - run: npm test
