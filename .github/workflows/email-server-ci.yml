name: email-server CI

on:
  push:
    branches: [main, littlefounders_v2]
    paths:
      - 'email-server/**'
      - '.github/workflows/email-server-ci.yml'
  pull_request:
    paths:
      - 'email-server/**'
      - '.github/workflows/email-server-ci.yml'

# Least privilege: these jobs only read the code.
permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: email-server
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: email-server/package-lock.json
      - run: npm ci
      - run: npm run type-check
      - run: npm run lint
      - run: npm run build
