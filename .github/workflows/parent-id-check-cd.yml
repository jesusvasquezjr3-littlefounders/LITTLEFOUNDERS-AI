name: parent-id-check CD

on:
  workflow_run:
    workflows: ["parent-id-check CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    name: Deploy parent-id-check (Guardian) to Railway
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Install Railway CLI
        run: npm i -g @railway/cli@5.43.1
      - name: Deploy parent-id-check to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up parent-id-check --path-as-root --service parent-id-check --ci
