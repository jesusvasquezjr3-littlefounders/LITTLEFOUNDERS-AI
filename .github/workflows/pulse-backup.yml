name: Pulse backup

# Daily pg_dump of pulse-db (Plausible app data + Umami data), stored on
# filebase's (Depot) Railway volume next to the Vault dumps — same rationale
# and mechanism as vault-backup.yml (separate disk & service from the live
# volume; `railway ssh` writes straight to the container filesystem).
# ClickHouse events are deliberately NOT dumped here: the raw analytics
# store is loss-tolerant by decision (RUNBOOK.md § Pulse) and a ClickHouse
# logical dump at this size isn't worth a daily cron.

on:
  schedule:
    - cron: '30 8 * * *' # 08:30 UTC daily (after the 08:00 Vault dump)
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install Railway CLI
        run: npm i -g @railway/cli@5.43.1

      - name: Write SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.RAILWAY_SSH_PRIVATE_KEY }}" > ~/.ssh/railway_backup_key
          chmod 600 ~/.ssh/railway_backup_key
          # Railway's SSH proxy host is ephemeral per-session (see
          # vault-backup.yml for why strict host checking can't work here).
          cat <<'CONFIG' >> ~/.ssh/config
          Host *
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
          CONFIG
          chmod 600 ~/.ssh/config

      - name: Dump Pulse Postgres and store on the Depot volume
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail
          TS=$(date -u +%Y%m%d-%H%M%S)
          FILE="pulse-${TS}.dump"
          KEY=~/.ssh/railway_backup_key

          # Railway's SSH key-verification service intermittently returns
          # "verification service was unreachable" — a Railway-side blip (not our
          # key) that fails every `railway ssh` account-wide while it lasts.
          # Retry each call so a transient outage doesn't fail the daily backup.
          retry() {
            local n=1
            until "$@"; do
              if [ "$n" -ge 5 ]; then echo "giving up after $n attempts: $*" >&2; return 1; fi
              echo "attempt $n failed, retrying in 20s: $*" >&2
              n=$((n + 1)); sleep 20
            done
          }

          # Each step is a SEPARATE `railway ssh` call with the command passed as
          # distinct argv tokens (the vault-backup pattern). Do NOT collapse them
          # into one `railway ssh -- sh -c '<multi-flag script>'`: the SSH command
          # is space-joined and re-parsed on the remote, so a quoted multi-word
          # script gets word-split — `sh -c pg_dump …` then runs pg_dump with NO
          # flags, connecting as OS user `root` (FATAL: role "root" does not exist).
          retry railway ssh --service pulse-db -i "$KEY" -- \
            pg_dump -U postgres -d plausible -Fc -f /tmp/plausible.dump

          retry railway ssh --service pulse-db -i "$KEY" -- \
            pg_dump -U postgres -d umami -Fc -f /tmp/umami.dump

          retry railway ssh --service pulse-db -i "$KEY" -- \
            tar -C /tmp -cf /tmp/backup.tar plausible.dump umami.dump

          # Redirect lives INSIDE the loop so every retry re-truncates the file.
          n=1
          until railway ssh --service pulse-db -i "$KEY" -- cat /tmp/backup.tar > "$FILE"; do
            if [ "$n" -ge 5 ]; then echo "giving up capturing the dump" >&2; exit 1; fi
            echo "capture attempt $n failed, retrying in 20s" >&2
            n=$((n + 1)); sleep 20
          done

          test -s "$FILE"

          n=1
          until cat "$FILE" | railway ssh --service filebase -i "$KEY" -- sh -c "cat > /data/backups/$FILE"; do
            if [ "$n" -ge 5 ]; then echo "giving up uploading to filebase" >&2; exit 1; fi
            echo "upload attempt $n failed, retrying in 20s" >&2
            n=$((n + 1)); sleep 20
          done

          retry railway ssh --service pulse-db -i "$KEY" -- \
            rm -f /tmp/backup.tar /tmp/plausible.dump /tmp/umami.dump

          echo "Backed up $(wc -c < "$FILE") bytes to /data/backups/$FILE on filebase"

      - name: Prune backups older than 30 days
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail
          n=1
          until railway ssh --service filebase -i ~/.ssh/railway_backup_key -- \
            find /data/backups -name 'pulse-*.dump' -mtime +30 -delete; do
            if [ "$n" -ge 5 ]; then echo "giving up pruning old backups" >&2; exit 1; fi
            echo "prune attempt $n failed, retrying in 20s" >&2
            n=$((n + 1)); sleep 20
          done
