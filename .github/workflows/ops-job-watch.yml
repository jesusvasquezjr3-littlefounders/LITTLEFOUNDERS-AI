name: Operations job watch

# H.4 / Appendix O 1.3 and 2.3: THE WATCHDOG-PLUS-NOTIFICATION PATTERN of
# tutor-retention-watch.yml, extended to the daily Vault backup, the daily
# Pulse backup and the schema drift probe.
#
# Each of those jobs ends by recording a heartbeat in Core's audit trail
# (scripts/ops-heartbeat.sh -> POST /api/v1/internal/ops/heartbeat). What a
# scheduled job cannot do is report its own ABSENCE: disabled, its schedule
# dropped after repository inactivity, its secrets rotated. So this job asks
# Core what the database saw (GET /api/v1/internal/ops/job-status) and fails
# when any job is stale.
#
# THE STALENESS RULE HAS ONE HOME: OPS_JOB_STALE_HOURS in
# backend/src/services/opsJobs.ts. This job reads Core's `stale` booleans
# through agent/tools/ops-job-watch.mjs, which refuses a reply without them.
#
# A HUMAN IS TOLD. A failed scheduled run alone is something nobody is
# subscribed to, so on failure this job opens (or comments on) one GitHub
# issue labelled `ops-watchdog`, which notifies the repository's watchers.
# The same notice is proven locally by the simulated-failure drill
# (backend: npm run ops:drill).
#
# GAP-FIX-R3: Appendix O 1.3 names three jobs that each need a watchdog AND
# an external notification: the Mentor retention sweep, the backup and the
# drift probe. The retention sweep is the fourth watched job here: Core's
# status carries it as `tutorRetention`, built from getTutorRetentionStatus()
# (its 36-hour window keeps its one home in backend/src/services/tutorData.ts),
# so a stale sweep opens or comments on the same `ops-watchdog` issue.
# tutor-retention-watch.yml still fails its own run at 06:00; this is the path
# that reaches a human.
#
# The same reply carries two more conditions a human must act on:
# `contentRetroChecks.overdue` (G.2, a retroactive release check past its 30
# days) and `accessReviews.due` (G.4, an elevated staff grant past the 90-day
# access review, so the staff/access owner is told without first opening
# Roles & Access). Any of them fails this run and is named in the notice.
#
# 10:00 UTC: after the retention sweep (03:00), the drift probe (07:30), the
# Vault backup (08:00) and the Pulse backup (08:30) have had time to finish
# and record themselves.

on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watch:
    name: Fail and notify if a backup, the drift probe or the retention sweep has gone quiet, or an access review is due
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Railway CLI
        run: npm i -g @railway/cli@5.43.1

      - name: Write SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.RAILWAY_SSH_PRIVATE_KEY }}" > ~/.ssh/railway_key
          chmod 600 ~/.ssh/railway_key
          cat <<'CONFIG' >> ~/.ssh/config
          Host *
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            LogLevel ERROR
          CONFIG
          chmod 600 ~/.ssh/config

      - name: Ask Core when each job last ran
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail
          # Same single-argument base64 route into the container as
          # tutor-retention-watch.yml: $INTERNAL_API_KEY and $PORT expand
          # THERE, never on this runner.
          script='curl -sS'
          script="$script"' -H "x-internal-api-key: $INTERNAL_API_KEY"'
          script="$script"' "http://127.0.0.1:${PORT:-4000}/api/v1/internal/ops/job-status"'
          b64=$(printf '%s' "$script" | base64 | tr -d '\n')
          body=''
          for attempt in 1 2 3; do
            if body=$(railway ssh --service littlefounders-backend -i ~/.ssh/railway_key -- sh -c "echo $b64 | base64 -d | sh" 2>&1); then break; fi
            echo "attempt ${attempt} failed:" >&2
            printf '%s\n' "$body" | head -5 >&2
            body=''
            sleep 20
          done
          # An empty or foreign reply is written as-is: the watcher refuses it
          # (UNKNOWN is not healthy) and the notice says so.
          printf '%s' "$body" > status.json
          printf 'ops-job-status: %s\n' "$body"

      - name: Judge the status
        id: judge
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node agent/tools/ops-job-watch.mjs --status-file status.json --notify-file notice.md

      - name: Notify a human
        if: failure() && hashFiles('notice.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          title='Operations watchdog: a scheduled job has gone quiet'
          existing=$(gh issue list --state open --label ops-watchdog --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "${existing:-}" ]; then
            gh issue comment "$existing" --body-file notice.md
          else
            gh label create ops-watchdog --color B60205 --description 'H.4 operations watchdog' 2>/dev/null || true
            gh issue create --title "$title" --label ops-watchdog --body-file notice.md
          fi
