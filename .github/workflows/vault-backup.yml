name: Vault backup

# Daily pg_dump of the production Vault (Supabase self-hosted) database,
# stored on filebase's (Depot) Railway volume — a genuinely separate disk
# and service from the live `db` volume, so a `db`-volume incident doesn't
# take out its own backups. Reached via `railway ssh` directly (not
# filebase's HTTP API, which only accepts audio/image/JSON mime types —
# this writes straight to the container filesystem, bypassing that
# whitelist by design, since a backup dump isn't "media").
#
# Why not a dedicated backup volume/service: Railway only allows one volume
# per service (`db` already uses its one for PGDATA), and creating a new
# service was blocked by an expired Railway trial at rollout time
# (2026-07-17, see RUNBOOK.md). Revisit once billing/plan allows a properly
# separate, dedicated backup volume.

on:
  schedule:
    - cron: '0 8 * * *' # 08:00 UTC daily
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # H.5 (Appendix O 1.2): the dump is encrypted on the runner before it is
      # stored anywhere, with the tested OD-9 backup tool (AES-256-GCM, a
      # manifest with the key fingerprint, the plaintext deleted). Only the
      # encryption tool is checked out.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: database/migration-od9
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Write backup encryption key
        run: |
          set -euo pipefail
          printf '%s' "${{ secrets.BACKUP_ENCRYPTION_KEY }}" > "$RUNNER_TEMP/backup.key"
          chmod 600 "$RUNNER_TEMP/backup.key"
          # No key, no backup: an unencrypted dump is never stored.
          test -s "$RUNNER_TEMP/backup.key"

      - name: Install Railway CLI
        run: npm i -g @railway/cli@5.43.1

      - name: Write SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.RAILWAY_SSH_PRIVATE_KEY }}" > ~/.ssh/railway_backup_key
          chmod 600 ~/.ssh/railway_backup_key
          # Railway's SSH proxy host is ephemeral per-session, not a fixed
          # host worth pinning — a fresh runner has no cached host key, so
          # strict checking would always fail here.
          cat <<'CONFIG' >> ~/.ssh/config
          Host *
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
          CONFIG
          chmod 600 ~/.ssh/config

      - name: Dump Postgres and store on the Depot volume
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail
          TS=$(date -u +%Y%m%d-%H%M%S)
          FILE="vault-${TS}.dump"

          railway ssh --service db -i ~/.ssh/railway_backup_key -- \
            pg_dump -U supabase_admin -d postgres -Fc -f /tmp/backup.dump

          railway ssh --service db -i ~/.ssh/railway_backup_key -- \
            cat /tmp/backup.dump > "$FILE"

          # Fail loudly on an empty/truncated dump rather than uploading garbage.
          test -s "$FILE"

          # Encrypt before the dump leaves the runner; the tool deletes the
          # plaintext. Fail on an empty ciphertext or a surviving plaintext.
          node database/migration-od9/backup-crypto.mjs encrypt --in "$FILE" --out "$FILE.lfbk" --key-file "$RUNNER_TEMP/backup.key"
          test -s "$FILE.lfbk"
          test -s "$FILE.lfbk.manifest.json"
          test ! -e "$FILE"

          for PART in "$FILE.lfbk" "$FILE.lfbk.manifest.json"; do
            cat "$PART" | railway ssh --service filebase -i ~/.ssh/railway_backup_key -- \
              sh -c "cat > /data/backups/$PART"
          done

          railway ssh --service db -i ~/.ssh/railway_backup_key -- rm -f /tmp/backup.dump

          echo "Backed up $(wc -c < "$FILE.lfbk") encrypted bytes to /data/backups/$FILE.lfbk on filebase"

      - name: Prune backups older than 30 days
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          # Encrypted backups and their manifests; the last line ages out the
          # plaintext dumps written before H.5 was closed.
          railway ssh --service filebase -i ~/.ssh/railway_backup_key -- \
            find /data/backups -name 'vault-*.dump.lfbk' -mtime +30 -delete
          railway ssh --service filebase -i ~/.ssh/railway_backup_key -- \
            find /data/backups -name 'vault-*.dump.lfbk.manifest.json' -mtime +30 -delete
          railway ssh --service filebase -i ~/.ssh/railway_backup_key -- \
            find /data/backups -name 'vault-*.dump' -mtime +30 -delete

      - name: Remove the backup key and any local dump
        if: always()
        run: rm -f "$RUNNER_TEMP/backup.key" ./*.dump ./*.dump.lfbk ./*.dump.lfbk.manifest.json
