name: repo gates

# The repo-wide invariants — deliberately WITHOUT a `paths:` filter.
#
# These used to live only in database-ci.yml, which fires on `database/**`.
# That made them unreachable for the exact commits they exist to catch: a
# secret hardcoded in backend/ changes nothing under database/ and so ran no
# gate at all.
#
# Per-service CI still owns type-check/lint/test/build; this job owns the
# checks that are about the repository as a whole.

on:
  push:
    branches: [main, littlefounders_v2]
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    name: secrets + i18n parity + marketing paths + provider parity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # check-secrets.sh uses `git grep` over tracked files, so it needs the
      # working tree — a blobless/partial checkout would silently scan nothing.
      - uses: actions/checkout@v4

      - name: No credential patterns in tracked files
        run: bash agent/tools/check-secrets.sh

      - name: Binding product specification and rebuild boundary
        run: npm run spec:check

      # G.6 / Appendix N 1.3: no staff route reaches a Mentor transcript or a
      # per-account wallet table, and no impersonation or login-as capability
      # exists. Also inside spec:check; named here so a red is legible.
      - name: Staff standing constraints (no transcripts, no wallet reads, no impersonation)
        run: npm run staff-constraints:check

      # i18n parity is also enforced inside frontend CI, but only when
      # frontend/** changes. A locale file edited on its own still has to pass.
      - name: i18n 3-locale key parity + hardcoded-string scan
        run: bash agent/tools/check-i18n.sh

      # OD-21 / D.5: every declared Family Hub lifecycle state keeps a
      # producing and a consuming flow. Its evidence spans backend, frontend
      # and migrations, so it runs here, unfiltered, not only in database CI.
      - name: Family Hub lifecycle states each have a producer and a consumer
        run: node database/scripts/check-family-lifecycle.mjs

      # Appendix H (Block D threshold log): every threshold in
      # docs/operations/BLOCK-D-THRESHOLD-LOG.md equals the Core constant and
      # the migration that enforce it. The three live in different packages,
      # so a doc-only or migration-only change is checked here, unfiltered.
      - name: Block D thresholds agree across the log, Core and the migrations
        run: node agent/tools/check-block-d-thresholds.mjs

      # S07.6 (D.7): no control a family sees may imply a guarantee the system
      # does not enforce. docs/operations/block-d-controls.json names each
      # control's enforcing SQL and its adversarial proof; the gate fails when
      # the latest definition of an enforcing function drops its guard, when
      # the freeze holds the UI lists differ from Core's or the registry's, or
      # when a payment SDK appears. Evidence spans database, backend, frontend
      # and docs, so it runs here, unfiltered.
      - name: No Family Hub or banking control implies an unbacked guarantee
        run: node agent/tools/check-no-unbacked-guarantee.mjs

      # S07.6 (D.8): speak like a mentor, never like a bank. Every Family Hub
      # and banking string in three locales against the bank-register,
      # guarantee, glossary and shouting lexicon; prints Appendix H's
      # Tone-Gate Pass Rate. A locale file can change alone, hence unfiltered.
      - name: Family Hub and banking copy passes the tone gate
        run: node agent/tools/check-family-copy-tone.mjs

      # S07.6 (D.6): the staff family-engagement insight's keys are written in
      # four places (the database function, its probe, Core, the console);
      # D.6 was exactly those drifting apart.
      - name: Family-engagement insight keys agree across the database, Core and the console
        run: node agent/tools/check-family-engagement-contract.mjs

      # S07.7 (D.9): every Block D choice traced to Appendix G with its evidence
      # strength and metric; no parent-facing string (app or marketing, three
      # locales) claims proof (Block D Part 4); no experiment column on a Block
      # D table (OD-23). An overdue recalibration only warns here; release
      # readiness runs it with --strict.
      - name: Block D research foundation, claims boundary and experiment rule hold
        run: node agent/tools/check-block-d-research.mjs

      # S07.7 (D.20): the scope statement names credit, debt, compound interest
      # and risk as not taught, every "practises" line keeps its backing code,
      # it stays mounted, and no lending or interest mechanic enters the schema
      # without the statement changing first.
      - name: Block D scope statement stays true
        run: node agent/tools/check-block-d-scope.mjs

      # S07.7 (D.21): every Block D table has a retention class, and the
      # periods agree across the policy, the migration, Core, the copy and the
      # nightly jobs; no Block D field reaches the Mentor's context.
      - name: Block D retention policy agrees with what the system does
        run: node agent/tools/check-block-d-retention.mjs

      # S07.7 (D.23): a monthly tip reaches a Tutor only after the Pedagogical
      # Lead's review, bound to its exact copy in three locales.
      - name: Parent coaching tips are sent only after review
        run: node agent/tools/check-parent-coaching-tips.mjs

      # The acquisition surface is declared in frontend/ AND backend/ (no
      # workspaces, so no shared import). Either file can change alone, which
      # is why this belongs in the unfiltered job rather than either CI.
      - name: Marketing paths agree across packages
        run: node agent/tools/check-marketing-paths.mjs

      # Forge and Oracle call the SAME two provider accounts, and each declares
      # how in its own env schema — no workspaces, so no shared import, so
      # either can drift alone. Oracle shipped with a base URL missing the /v1
      # that coursegen has always had, which 404'd every tutor turn while the
      # service stayed healthy and every test stayed green. Unfiltered for the
      # same reason as marketing paths: the drift lives in the GAP between two
      # packages, so no per-package filter can see it.
      - name: Forge and Oracle agree on their provider settings
        run: node agent/tools/check-provider-parity.mjs

      # Every whiteboard instrument is written out by hand in FIVE places
      # across three services that deliberately share no types. When a copy is
      # forgotten nothing throws: `compare` and `marked_line` both shipped
      # without Core's POST /turns branch, so a live board failed the persist
      # and was LOST SILENTLY on replay and in the guardian transcript viewer.
      # Both were found by adversarial review, months apart, by no gate. Same
      # unfiltered job as the two above, and for the same reason: the drift
      # lives in the GAP between packages.
      - name: Whiteboard instruments agree across every copy
        run: node agent/tools/check-instrument-parity.mjs

      # The same class of gap one layer up: `segmentRequest.preferredTypes` is
      # ALSO hand-mirrored between oracle and backend (widened together
      # 2026-09-02, /TUTOR_INSTRUMENTS.md Sprint 1), and a drift here degrades
      # silently — the hint just stops working for whichever type fell out of
      # sync, with no error anywhere.
      - name: Preferred segment types agree between oracle and core
        run: node agent/tools/check-preferred-types-parity.mjs

      # A THIRD instance of the same gap, one layer deeper: a `demonstrate`
      # step's `{ kind, denomination?, ms?, item?, bucket?, left?, right?,
      # value? }` shape is hand-mirrored SIX times (oracle's model schema,
      # oracle's wire type, Core's body validator, Core's TS interface, Core's
      # OWN separate read-time revalidator, and the frontend's wire type) —
      # widened from 3 verbs to 7 2026-09-02/03 (/TUTOR_INSTRUMENTS.md
      # Sprint 2). A step naming a dropped verb or field is a silent no-op in
      # the frontend adapter, never an error, so nothing else would catch it.
      - name: Demonstrate steps agree across every copy
        run: node agent/tools/check-demo-step-parity.mjs

      # S05.4c: Forge's gates (coursegen), the attestation verify:course writes
      # and the gate ids Vault's release preflight requires (migrations) are
      # three hand-kept lists in two packages. A Forge gate missing from the
      # preflight ships content it would refuse; a database requirement Forge
      # never records makes every release impossible. Unfiltered because the
      # drift lives in the gap between packages.
      - name: Every Forge gate is required by the release preflight
        run: node agent/tools/check-forge-release-gate-parity.mjs

      # Product C.18: the per-turn Mentor-honesty record (answer-reveal and
      # anti-sycophancy instrumentation) is hand-mirrored in Oracle, Core's
      # strict body validator, Core's writer and the migration's CHECK lists.
      # A drift makes Core refuse the honesty object and the reveal rate is
      # silently computed over fewer turns — this fails first.
      - name: Mentor honesty record agrees across every copy
        run: node agent/tools/check-mentor-honesty-parity.mjs

      # Product C.16 + C.8/C.12: the closing scripts, openings and the session-end
      # signal record are hand-mirrored across Oracle, Core, the migration and the
      # client. A drift makes Core refuse the close (400) or measures closing-script
      # accuracy against a different table than the one Oracle closes with.
      - name: Session-end record agrees across every copy
        run: node agent/tools/check-session-end-parity.mjs

      # Product C.9 + C.19: the Behavioral Telemetry Layer's channels, firing
      # record, check-in outcomes, context fields and socket frames are
      # hand-mirrored across Oracle, Core, the migration and the client. A drift
      # makes Core refuse the close (400), files a strength under the wrong
      # channel, or sends a context field an Oracle cannot parse.
      - name: Behavioral telemetry record agrees across every copy
        run: node agent/tools/check-behavioral-telemetry-parity.mjs

      # Product C.15 + C.14 + C.7: the Alliance Controller record, the
      # self-explanation events, the disposition profile, the bond-proxy answers
      # and the goal frames are hand-mirrored across Oracle, Core, the migration
      # and the client. A drift makes Core refuse the close (400), a CHECK refuse
      # a row, or a projection field an Oracle cannot parse refuse every session.
      - name: Alliance / self-explanation / disposition record agrees across every copy
        run: node agent/tools/check-alliance-parity.mjs

      # Product C.11 + C.17: the spaced-review routing rule (mirrored in Core so
      # every recorded decision can be re-evaluated), its record, and the
      # dialogue register are hand-mirrored across Oracle, Core and the
      # migration. A drift makes Core refuse the close, a CHECK refuse a row, or
      # the Routing Accuracy audit judge Oracle by a different rule. It also
      # holds the OD-23 guard: the C.17 experiment stays adults-only by default.
      - name: Spaced-review routing / dialogue register agree across every copy (OD-23 guard)
        run: node agent/tools/check-review-calibration-parity.mjs

      # C.5 + C.6: Oracle and Core must classify a live-generated item with the
      # same content-risk lexicon, the migration CHECKs must accept every row
      # the governed live claim writes, and the Appendix E §3.1.1 floors (15%
      # standard / 50% sensitive staff sampling) and the judge-calibration
      # minimums may never be lowered without a Tier 1 review.
      - name: Live-content governance / curated packs agree across every copy (Appendix E floors guard)
        run: node agent/tools/check-live-content-parity.mjs

      # C.21 + C.24: the transcript rubric, the score outcomes, the owner roles
      # and the flag vocabularies are hand-mirrored across Core, Oracle's judge
      # harness, the rebuilt staff client and the migration. It also holds two
      # guards: no judge-written scores until a judge is calibrated (C.23), and
      # the Appendix F §1.4 service levels (24-hour freshness, weekly review).
      - name: Evaluation loop / quality dashboard agree across every copy (C.23 fence, Appendix F SLAs)
        run: node agent/tools/check-evaluation-loop-parity.mjs

      # C.23: the judge-calibration standard (judges, questions, strata, failure
      # reasons) is hand-mirrored across Core, Oracle's harnesses and the
      # migration, and its Tier 1 floors (panel agreement and kappa, judge
      # agreement per stratum and kappa, the verbosity gap, the per-judge
      # minimum strata, the monthly cadence) may never be lowered here.
      - name: Judge calibration standard agrees across every copy (Tier 1 floors guard)
        run: node agent/tools/check-judge-calibration-parity.mjs

      # The agent/tools/*.test.mjs suite existed but ran in NO workflow, so it
      # rotted unnoticed. A gate nobody runs is documentation, not enforcement.
      - name: Repo tool self-tests
        run: npm run tools:test

  # C.22: the tiered self-improvement governance model (Appendix E §3.1,
  # Appendix F Part 3). Its own job because two of its checks read history:
  # the Tier 1 change record and the decisions are append-only against the
  # base, and no commit of automated origin may touch a Tier 1 or live-content
  # file (or any governed file without a cleared proposal record). The static
  # checks (every Mentor file classified, every Tier 1 change recorded, Tier 2
  # bounds, declared pipelines, tier statements) run here too. The release
  # audit (--release, sign-offs required) runs in release:readiness.
  mentor-governance:
    name: Mentor self-improvement governance (C.22)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tier classification, Tier 1 change record and the automated-origin fence
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            BASE="origin/$BASE_REF"
            RANGE="$BASE..HEAD"
          elif [ -n "${BEFORE:-}" ] && ! echo "$BEFORE" | grep -Eq '^0+$' && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            BASE="$BEFORE"
            RANGE="$BEFORE..$AFTER"
          else
            BASE=""
            RANGE=""
          fi
          ARGS=()
          if [ -n "$BASE" ]; then ARGS+=("--base=$BASE" "--range=$RANGE"); fi
          node agent/tools/check-mentor-governance.mjs "${ARGS[@]}" --report=tier-compliance.json

      - name: Keep the audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tier-compliance-audit
          path: tier-compliance.json
          if-no-files-found: ignore

  # Appendix H 2.2 D.1(d) (GAP-FIX-R3): the Freeze-Enforcement Verification is
  # "green in CI on every build", and Appendix H 1.3 re-proves it and the
  # Unauthorized State-Transition check per release. A Core-only release
  # changes nothing under database/, so database-ci.yml would not run; this
  # unfiltered job re-proves every Block D database guarantee over the whole
  # migration chain on every push and pull request. (database-ci.yml runs the
  # same job, where a red proof also stops a migration from auto-applying.)
  family-db-verify:
    name: Block D database proofs (freeze, state machine, wallet) over the full chain
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Block D database proofs
        env:
          LF_PG_PORT: '5432'
          LF_PG_USER: postgres
          LF_PG_PSQL: psql
          LF_PG_DATA: /var/lib/postgresql/data
          LF_PG_VERIFY_JOBS: '3'
        run: node database/scripts/family-db-verify.mjs
