name: repo gates

# The repo-wide invariants — deliberately WITHOUT a `paths:` filter.
#
# These used to live only in database-ci.yml, which fires on `database/**`.
# That made them unreachable for the exact commits they exist to catch: a
# secret hardcoded in backend/ changes nothing under database/ and so ran no
# gate at all.
#
# Per-service CI still owns type-check/lint/test/build; this job owns the
# checks that are about the repository as a whole.

on:
  push:
    branches: [main, littlefounders_v2]
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    name: secrets + i18n parity + marketing paths + provider parity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # check-secrets.sh uses `git grep` over tracked files, so it needs the
      # working tree — a blobless/partial checkout would silently scan nothing.
      - uses: actions/checkout@v4

      - name: No credential patterns in tracked files
        run: bash agent/tools/check-secrets.sh

      - name: Binding product specification and rebuild boundary
        run: npm run spec:check

      # i18n parity is also enforced inside frontend CI, but only when
      # frontend/** changes. A locale file edited on its own still has to pass.
      - name: i18n 3-locale key parity + hardcoded-string scan
        run: bash agent/tools/check-i18n.sh

      # OD-21 / D.5: every declared Family Hub lifecycle state keeps a
      # producing and a consuming flow. Its evidence spans backend, frontend
      # and migrations, so it runs here, unfiltered, not only in database CI.
      - name: Family Hub lifecycle states each have a producer and a consumer
        run: node database/scripts/check-family-lifecycle.mjs

      # The acquisition surface is declared in frontend/ AND backend/ (no
      # workspaces, so no shared import). Either file can change alone, which
      # is why this belongs in the unfiltered job rather than either CI.
      - name: Marketing paths agree across packages
        run: node agent/tools/check-marketing-paths.mjs

      # Forge and Oracle call the SAME two provider accounts, and each declares
      # how in its own env schema — no workspaces, so no shared import, so
      # either can drift alone. Oracle shipped with a base URL missing the /v1
      # that coursegen has always had, which 404'd every tutor turn while the
      # service stayed healthy and every test stayed green. Unfiltered for the
      # same reason as marketing paths: the drift lives in the GAP between two
      # packages, so no per-package filter can see it.
      - name: Forge and Oracle agree on their provider settings
        run: node agent/tools/check-provider-parity.mjs

      # Every whiteboard instrument is written out by hand in FIVE places
      # across three services that deliberately share no types. When a copy is
      # forgotten nothing throws: `compare` and `marked_line` both shipped
      # without Core's POST /turns branch, so a live board failed the persist
      # and was LOST SILENTLY on replay and in the guardian transcript viewer.
      # Both were found by adversarial review, months apart, by no gate. Same
      # unfiltered job as the two above, and for the same reason: the drift
      # lives in the GAP between packages.
      - name: Whiteboard instruments agree across every copy
        run: node agent/tools/check-instrument-parity.mjs

      # The same class of gap one layer up: `segmentRequest.preferredTypes` is
      # ALSO hand-mirrored between oracle and backend (widened together
      # 2026-09-02, /TUTOR_INSTRUMENTS.md Sprint 1), and a drift here degrades
      # silently — the hint just stops working for whichever type fell out of
      # sync, with no error anywhere.
      - name: Preferred segment types agree between oracle and core
        run: node agent/tools/check-preferred-types-parity.mjs

      # A THIRD instance of the same gap, one layer deeper: a `demonstrate`
      # step's `{ kind, denomination?, ms?, item?, bucket?, left?, right?,
      # value? }` shape is hand-mirrored SIX times (oracle's model schema,
      # oracle's wire type, Core's body validator, Core's TS interface, Core's
      # OWN separate read-time revalidator, and the frontend's wire type) —
      # widened from 3 verbs to 7 2026-09-02/03 (/TUTOR_INSTRUMENTS.md
      # Sprint 2). A step naming a dropped verb or field is a silent no-op in
      # the frontend adapter, never an error, so nothing else would catch it.
      - name: Demonstrate steps agree across every copy
        run: node agent/tools/check-demo-step-parity.mjs

      # The agent/tools/*.test.mjs suite existed but ran in NO workflow, so it
      # rotted unnoticed. A gate nobody runs is documentation, not enforcement.
      - name: Repo tool self-tests
        run: npm run tools:test
