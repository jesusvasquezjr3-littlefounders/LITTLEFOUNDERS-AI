name: Mentor live-content governance monitor

# PRODUCT C.5 + C.6: THE LIVE-GENERATION CONTENT JUDGE, WATCHED BY SOMEBODY.
#
# Appendix E §3.1.1 makes live per-item content judging its own tier: a judge
# approves each generated activity for one child, staff review a sample after
# the fact at no less than 15% (standard) / 50% (sensitive topics), the rate
# rises automatically after a staff-found issue, and Appendix F Part 3 Stage 7
# suspends live generation for a category when the judge's concordance with
# staff falls below 90% or staff review falls below the floor. Core enforces
# all of that at request time (backend/src/services/pedagogy/
# liveContentGovernance.ts); this weekly run is the Dashboard Data-Freshness
# half: it puts the state in front of a human every week.
#
# `tutor:live-content-report` prints, per content-risk category, the current
# sampling rate, any suspension and its reason, the concordance, the review
# coverage and the backlog past the 7-day review SLA; the judge's calibration
# (monthly re-check, Appendix F §1.3); the content-ladder shares, the weekly
# live share (C.6: it must fall as curated packs land) and the unmet demand
# ranked by request pattern (the next packs to author); and the Kill-Switch
# Trigger Log.
#
# RED MEANS A HUMAN IS NEEDED: an uncalibrated or stale judge (live generation
# is suspended until the owner runs the calibration, OD-23), a suspension in
# force, a backlog past the SLA, or a row sampled below the floor.
#
# READ-ONLY. Only the operator's explicit `--record-calibration` and
# `--resolve` flags write, and they are never passed here. No model call;
# costs nothing (OD-23).

on:
  schedule:
    # 09:50 UTC every Monday, clear of the other Mentor monitors.
    - cron: '50 9 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read

env:
  ENVIRONMENT: production

jobs:
  monitor:
    name: Report the live-content judge and the content ladder
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install the Railway CLI
        run: npm i -g @railway/cli@5.43.1

      # All six variables: importing anything under backend/src/services pulls
      # in backend/src/config.ts, whose schema validates the whole env.
      - name: Read production credentials and run the report
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail
          read_var() {
            railway variable list --service littlefounders-backend --environment "$ENVIRONMENT" --json 2>/dev/null \
              | jq -r --arg k "$1" '.[$k] // ""'
          }
          export SUPABASE_URL="$(read_var SUPABASE_URL)"
          export SUPABASE_ANON_KEY="$(read_var SUPABASE_ANON_KEY)"
          export SUPABASE_SERVICE_ROLE_KEY="$(read_var SUPABASE_SERVICE_ROLE_KEY)"
          export SUPABASE_JWT_SECRET="$(read_var SUPABASE_JWT_SECRET)"
          export INTERNAL_API_KEY="$(read_var INTERNAL_API_KEY)"
          export TUTOR_SESSION_SECRET="$(read_var TUTOR_SESSION_SECRET)"
          for v in SUPABASE_URL SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY SUPABASE_JWT_SECRET INTERNAL_API_KEY TUTOR_SESSION_SECRET; do
            [ -n "${!v}" ] || { echo "::error::backend variable $v is empty"; exit 1; }
          done
          npm ci --prefix backend --no-audit --no-fund >/dev/null
          npm run --prefix backend --silent tutor:live-content-report | tee live-content.md

      - name: Publish the report
        if: always()
        run: |
          {
            echo "### Mentor live-content governance (C.5 / C.6)"
            echo ""
            echo '```'
            cat live-content.md 2>/dev/null || echo "The report produced no output — see the step above for why."
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
