name: Insights maintenance

# Nightly rollup refresh + retention prune for the insights layer
# (/INSIGHTS.md §6). Two jobs that MUST actually run, not merely be
# documented:
#
#  1. refresh_insights_rollups() — rewrites the trailing 7 days of the
#     accumulating rollup tables. The admin console reads the ROLLUP, not the
#     raw table, so a skipped refresh shows stale numbers rather than slow
#     ones. Only the recent window is rewritten; older rows are frozen.
#  2. prune_learning_events(400) — deletes raw events beyond the retention
#     window in genuinely committed batches (a PROCEDURE, hence CALL: a
#     function cannot COMMIT), plus unconverted anonymous visitors with no
#     remaining events. Rollup rows are never recomputed from pruned data, so
#     day-grained history outlives the raw events it came from.
#
# ORDER MATTERS ONLY IN ONE DIRECTION: refresh first, so anything that aged
# out today is rolled up before it is deleted.
#
# WATCHED (H.4, GAP-FIX-R6): the prune IS H.2's 400-day raw-event window, so
# the last step records a heartbeat (`insights_prune`) and ops-job-watch.yml
# notifies a human when no successful run lands within 36 hours.
#
# Mechanics mirror vault-backup.yml, including the lessons recorded there:
# one `railway ssh` per command with args as DISTINCT TOKENS (never a quoted
# script string — Railway space-joins and the remote re-parses), and a retry
# around each call because Railway's SSH key-verification service has
# transient account-wide outages.

on:
  schedule:
    - cron: '30 7 * * *' # 07:30 UTC daily, an hour before the Vault backup
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  maintain:
    name: Refresh rollups and prune beyond retention
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # The checkout carries scripts/ops-heartbeat.sh (H.4).
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm i -g @railway/cli@5.43.1

      - name: Write SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.RAILWAY_SSH_PRIVATE_KEY }}" > ~/.ssh/railway_key
          chmod 600 ~/.ssh/railway_key
          # LogLevel ERROR because $out merges stderr into what this job
          # PRINTS AS THE QUERY RESULT: without it every answer is preceded by
          # "Warning: Permanently added ...", which reads as data.
          # Railway's SSH proxy host is ephemeral per session, not a fixed
          # host worth pinning — a fresh runner has no cached host key.
          cat <<'CONFIG' >> ~/.ssh/config
          Host *
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            LogLevel ERROR
          CONFIG
          chmod 600 ~/.ssh/config

      - name: Refresh rollups + prune
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail

          # SQL travels base64-encoded as a SINGLE argument: `railway ssh`
          # space-joins its args and the remote shell re-parses them, so any
          # statement containing spaces would be word-split into garbage.
          #
          # ── FIXED 2026-08-23, AFTER TWELVE CONSECUTIVE SILENT NIGHTS ──
          #
          # This job last succeeded on 2026-08-07 and failed every night after,
          # so the Insights rollups have been stale ever since and the console
          # has been showing an empty product. Nothing alerted — and the part
          # that actually cost the fortnight is that the retry loop CAPTURED
          # the error and then threw it away, printing only "attempt N failed".
          # Twelve nights of evidence, deleted on arrival. That is /AGENTS.md
          # §1.14 and §1.0 rule 5 in a single line of shell.
          #
          # TWO CHANGES.
          #
          # 1. The invocation now matches `database/scripts/railway-migrate.sh`,
          #    which this repository already calls "the proven-working shape":
          #    the pipeline is ONE POSITIONAL argument. The old form was
          #    `-- sh -c "'echo ... | psql ...'"` — the command wrapped in
          #    single quotes INSIDE the double quotes — so the remote `sh -c`
          #    received one argument beginning with a literal quote and tried
          #    to run it as a command name. It also omitted `-f -`, so psql was
          #    never told to read the decoded SQL as a script.
          #
          #    The inner quotes are the defect, and the comparison proves it:
          #    `tutor-deploy.yml` uses `-- sh -c "echo $b64 | base64 -d | sh"`
          #    WITHOUT them and ran green today. What changed on 2026-08-07 is
          #    still unknown — no CLI version was published between 2026-08-07
          #    and 2026-08-13, so a release is NOT the trigger, and nothing in
          #    this repository touched the file. That question is now
          #    answerable rather than guessed at, because change 2 prints the
          #    error the next run produces.
          #
          # 2. The failure is PRINTED. A retry that hides what it is retrying
          #    turns a five-minute fix into two weeks of blind flight.
          run_sql() {
            local sql="$1" label="$2" b64 out status
            b64=$(printf '%s' "$sql" | base64 | tr -d '\n')
            for attempt in 1 2 3 4 5; do
              status=0
              out="$(railway ssh --service db -i ~/.ssh/railway_key \
                    "echo $b64 | base64 -d | psql -U supabase_admin -d postgres -t -A -v ON_ERROR_STOP=1 -f -" 2>&1)" || status=$?
              if [ "$status" -eq 0 ]; then
                echo "$label: $out"
                return 0
              fi
              echo "$label: attempt $attempt failed (exit $status):" >&2
              printf '%s\n' "$out" | sed 's/^/    /' >&2
              if [ "$attempt" -lt 5 ]; then sleep 20; fi
            done
            echo "::error::$label FAILED after 5 attempts — the Insights rollups are now STALE. The last attempt's output is above." >&2
            return 1
          }

          run_sql 'SELECT refresh_insights_rollups();' 'rollup'
          run_sql 'CALL prune_learning_events(400);' 'prune'
          # S07.4 (D.13, D.15; the D.21 bound): the consent-gated Block D
          # behaviour stream keeps 400 days, like learning_events. Guarded so
          # it is a no-op until the migration that creates it is applied.
          run_sql "DO \$prune\$ BEGIN IF to_regprocedure('public.prune_family_money_events(integer)') IS NOT NULL THEN PERFORM public.prune_family_money_events(400); END IF; END \$prune\$;" 'prune_family_money'
          # S07.5 (D.17): a birthday can open a child's next independence level
          # without any decision; the nightly sweep records the first eligible
          # day for Appendix H's Independence-Tier Progression Rate. Guarded so
          # it is a no-op until the migration that creates it is applied.
          run_sql "DO \$sweep\$ BEGIN IF to_regprocedure('public.record_family_autonomy_eligibility_all()') IS NOT NULL THEN PERFORM public.record_family_autonomy_eligibility_all(); END IF; END \$sweep\$;" 'autonomy_eligibility'
          # S07.6 (D.6): Appendix H's Staff Family-Engagement Insight Uptime is
          # measured every night, not only when someone opens the console. The
          # probe calls the same function the staff endpoint serves, records
          # ok / unavailable / shape_mismatch, and keeps 400 days of checks.
          # Guarded so it is a no-op until the migration that creates it is applied.
          run_sql "DO \$probe\$ BEGIN IF to_regprocedure('public.probe_family_engagement_insight(integer)') IS NOT NULL THEN PERFORM public.probe_family_engagement_insight(400); END IF; END \$probe\$;" 'engagement_probe'
          # S07.7 (D.22): the research instrumentation's monthly snapshot for the
          # previous complete month, only for participants whose research
          # consent stands (observational; OD-23: no experiment on a minor).
          # Idempotent, so running it every night fills a month once. Guarded
          # so it is a no-op until the migration that creates it is applied.
          run_sql "DO \$snap\$ BEGIN IF to_regprocedure('public.record_family_research_snapshots(date)') IS NOT NULL THEN PERFORM public.record_family_research_snapshots(); END IF; END \$snap\$;" 'research_snapshots'
          run_sql 'SELECT removed FROM insights_maintenance_log ORDER BY id DESC LIMIT 1;' 'pruned_rows'
          run_sql 'SELECT count(*) FROM insights_daily_activity;' 'rollup_rows'
          # S05.3c (B.13): closed family-bridge prompts leave after the same 400-day window.
          run_sql 'SELECT public.purge_closed_learning_bridge_prompts(400);' 'bridge_prompts_purged'

      # H.4 (GAP-FIX-R6): leave the run in Core's audit trail
      # (scripts/ops-heartbeat.sh); ops-job-watch.yml notifies a human when
      # this job goes quiet.
      - name: Record the heartbeat
        if: success()
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: RAILWAY_SSH_KEY_PATH="$HOME/.ssh/railway_key" bash scripts/ops-heartbeat.sh insights_prune true

      - name: Record the failed run
        if: failure()
        continue-on-error: true
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: RAILWAY_SSH_KEY_PATH="$HOME/.ssh/railway_key" bash scripts/ops-heartbeat.sh insights_prune false
