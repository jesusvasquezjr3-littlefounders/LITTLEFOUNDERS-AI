name: database CI

on:
  push:
    branches: [main, littlefounders_v2]
    paths:
      - 'database/**'
      - '.github/workflows/database-ci.yml'
  pull_request:
    paths:
      - 'database/**'
      - '.github/workflows/database-ci.yml'

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: database
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # No dependencies — the migration gates are stdlib-only.
      - run: npm test
      - name: secrets gate
        working-directory: .
        run: bash agent/tools/check-secrets.sh

  # Appendix J 1.3 / DoD 2.1(2): a migration re-proves the social data-gateway
  # gate. Every verify-social-*.py (plus teen discoverable, cooperative goals
  # and account erasure) runs against the full chain on a PostgreSQL 17
  # service container; each verifier creates and drops its own database.
  social-db-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: social data-gateway verifiers
        env:
          LF_PG_PORT: '5432'
          LF_PG_USER: postgres
          LF_PG_PSQL: psql
          LF_PG_DATA: /var/lib/postgresql/data
          LF_PG_VERIFY_JOBS: '3'
        run: node database/scripts/social-db-verify.mjs

  # A migration cannot auto-apply (database-cd.yml) past a red freeze proof.
  # Appendix H 2.2 D.1(d) / 1.3 / Part 3 Stage 2 (GAP-FIX-R3): the Block D
  # database proofs (the freeze, the Family Hub state machine, the teen wallet,
  # chores and bonus, money habits, autonomy and decisions, presentation,
  # governance, research re-consent, teen deletion notices, the teen bridge
  # goal) run over the WHOLE migration chain on a PostgreSQL 17 service
  # container. The runner and its self-test: database/scripts/family-db-verify*.mjs.
  family-db-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Block D database proofs
        env:
          LF_PG_PORT: '5432'
          LF_PG_USER: postgres
          LF_PG_PSQL: psql
          LF_PG_DATA: /var/lib/postgresql/data
          LF_PG_VERIFY_JOBS: '3'
        run: node database/scripts/family-db-verify.mjs

  # Appendix C 2.2 B.1 and 2.1 (GAP-FIX-R4): the learning database proofs
  # (placement commit for all four methods, v2 grading and completion, the
  # learning signals of rounds 2-4, the OD-25 pathway, atomic lesson completion,
  # the course release gate) run over the WHOLE migration chain on a
  # PostgreSQL 17 service container. The runner and its self-test:
  # database/scripts/learning-db-verify*.mjs.
  learning-db-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: learning database proofs
        env:
          LF_PG_PORT: '5432'
          LF_PG_USER: postgres
          LF_PG_PSQL: psql
          LF_PG_DATA: /var/lib/postgresql/data
          LF_PG_VERIFY_JOBS: '3'
        run: node database/scripts/learning-db-verify.mjs
