name: database CI

on:
  push:
    branches: [main, littlefounders_v2]
    paths:
      - 'database/**'
      - '.github/workflows/database-ci.yml'
  pull_request:
    paths:
      - 'database/**'
      - '.github/workflows/database-ci.yml'

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test
        working-directory: database
      - name: secrets scan
        run: bash agent/tools/check-secrets.sh
