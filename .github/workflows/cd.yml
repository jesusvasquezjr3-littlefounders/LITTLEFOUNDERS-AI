name: CD — Deploy
on:
  workflow_run:
    workflows: ["Frontend CI", "Backend CI"]
    types: [completed]
    branches: [main]

# Mínimo privilegio: ambos jobs solo necesitan leer el repo (checkout). El deploy
# se autentica con VERCEL_TOKEN / RAILWAY_TOKEN, no con GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  deploy-vercel:
    # Solo despliega frontend cuando el que pasó fue Frontend CI.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.name == 'Frontend CI'
    name: Deploy Frontend to Vercel
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      # Desplegar el commit exacto que pasó Frontend CI, no el HEAD actual de main.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      # vercel build corre el buildCommand de vercel.json (cd frontend && npm install
      # && npm run build) y usa las env vars VITE_* de Production traídas por vercel pull.
      - name: Pull Vercel environment (production)
        run: npx vercel@latest pull --yes --environment=production --token=$VERCEL_TOKEN
      - name: Build with Vercel
        run: npx vercel@latest build --prod --token=$VERCEL_TOKEN
      - name: Deploy prebuilt to production
        run: npx vercel@latest deploy --prebuilt --prod --token=$VERCEL_TOKEN

  deploy-railway:
    # Solo despliega backend cuando el que pasó fue Backend CI (evita
    # rebuilds innecesarios del backend en cambios solo de frontend).
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.name == 'Backend CI'
    name: Deploy Backend to Railway
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Railway CLI
        run: npm i -g @railway/cli
      - name: Deploy backend to Railway
        working-directory: ./backend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service littlefounders-backend --ci
