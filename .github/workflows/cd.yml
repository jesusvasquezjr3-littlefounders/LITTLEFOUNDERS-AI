name: CD — Deploy
on:
  workflow_run:
    workflows: ["Frontend CI", "Backend CI"]
    types: [completed]
    branches: [main]

jobs:
  deploy-vercel:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    name: Trigger Vercel Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Deploy webhook
        run: |
          curl -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}" \
            --fail-with-body || echo "⚠️ Vercel deploy hook not configured"

  deploy-railway:
    # Solo despliega backend cuando el que pasó fue Backend CI (evita
    # rebuilds innecesarios del backend en cambios solo de frontend).
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.name == 'Backend CI' }}
    name: Trigger Railway Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Railway CLI
        run: npm i -g @railway/cli
      - name: Deploy backend to Railway
        working-directory: ./backend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service littlefounders-backend --ci
