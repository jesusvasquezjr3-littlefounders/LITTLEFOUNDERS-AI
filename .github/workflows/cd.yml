name: CD — Deploy
on:
  workflow_run:
    workflows: ["Frontend CI", "Backend CI"]
    types: [completed]
    branches: [main]

jobs:
  deploy-vercel:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    name: Trigger Vercel Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Deploy webhook
        run: |
          curl -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}" \
            --fail-with-body || echo "⚠️ Vercel deploy hook not configured"

  deploy-render:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    name: Trigger Render Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Deploy webhook
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" \
            --fail-with-body || echo "⚠️ Render deploy hook not configured"
