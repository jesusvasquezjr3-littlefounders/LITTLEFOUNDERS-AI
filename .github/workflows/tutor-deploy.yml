name: Tutor deploy (operator)

# One-shot operator steps for bringing the AI Tutor (Oracle) online.
# RUNBOOK.md "Deploying the AI Tutor (Oracle)" is the narrative; this is the
# hands.
#
# WHY A WORKFLOW AND NOT A LAPTOP. The Railway credentials for this project
# live as repository secrets and nowhere else, which is correct — but it means
# every production step has to run on a runner. Same mechanism
# insights-maintenance.yml and vault-backup.yml already use.
#
# READ-ONLY UNLESS ASKED. `inspect` is the default and mutates nothing. Each
# mutating step is separate and idempotent, so a half-finished run is resumed
# by re-dispatching the step that failed rather than by starting over.
#
# NO SECRET VALUE IS EVER PRINTED. The two shared secrets are generated ON THE
# RUNNER and written straight into Railway, so they never exist on anyone's
# machine, in any log, or in any file. Every command that touches one is
# silenced.
#
# CLI SURFACE, verified against railway 5.41.2 rather than assumed:
#   railway variable list --service S --environment E --json
#   railway variable set  --service S --environment E  KEY=VALUE
#   railway status --environment E --json
#   railway add --service NAME
#   railway domain --service NAME

on:
  workflow_dispatch:
    inputs:
      step:
        description: 'Which step to run'
        required: true
        default: inspect
        type: choice
        options:
          - inspect
          - probe
          - migrate
          - seed-kc
          - probe-models
          - provision
          - domain
          - verify
      model_name:
        description: >-
          provision only. The pedagogical model Oracle calls. `keep` never
          touches it. Oracle needs a NON-reasoning model: deepseek-v4-pro spends
          the whole completion budget on reasoning_content and returns empty
          content, which reaches a learner as the scripted "my thoughts got
          tangled" line on every single turn.
        required: false
        default: keep
        type: string
      voice_provider:
        description: >-
          provision only. Changing whether the tutor can SPEAK. `keep` never
          touches it — an explicit choice is never overwritten by a routine
          deploy. Choose inworld or none to change it on purpose.
        required: false
        default: keep
        type: choice
        options:
          - keep
          - inworld
          - none

permissions:
  contents: read

jobs:
  run:
    name: 'Tutor deploy — ${{ inputs.step }}'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      ENVIRONMENT: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install the Railway CLI
        run: |
          npm i -g @railway/cli@5.43.1
          railway --version
          jq --version

      - name: Write the Railway SSH key
        if: inputs.step == 'inspect' || inputs.step == 'migrate' || inputs.step == 'verify'
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.RAILWAY_SSH_PRIVATE_KEY }}" > ~/.ssh/railway_key
          chmod 600 ~/.ssh/railway_key
          # Railway's SSH proxy host is ephemeral per session, not a fixed host
          # worth pinning — a fresh runner has no cached host key.
          # LogLevel ERROR because the host key is deliberately not cached:
          # ssh would otherwise print "Warning: Permanently added ..." on
          # stderr, which the migration script merges into psql's stdout and
          # reads as a query result. The script filters that line too — this is
          # the other half, silencing it at the source rather than after.
          cat <<'CONFIG' >> ~/.ssh/config
          Host *
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            LogLevel ERROR
          CONFIG
          chmod 600 ~/.ssh/config

      # ── INSPECT — mutates nothing ────────────────────────────────────────
      - name: Inspect production
        if: inputs.step == 'inspect'
        run: |
          set -uo pipefail

          echo "== Which project does this token reach? =="
          railway status --environment "$ENVIRONMENT" --json > status.json 2>status.err \
            && jq -r '{project: .name} | .project' status.json \
            || { echo "status failed:"; cat status.err; }

          echo ""
          echo "== Production services and instance states =="
          jq -r --arg env "$ENVIRONMENT" '
            .environments.edges[]? | select(.node.name == $env)
            | .node.serviceInstances.edges[]?.node
            | .serviceName + "  " + ((.activeDeployments // [])
                | map((.instances // []) | map(.status) | join(","))
                | join(",") | if . == "" then "no-active-deployment" else . end)
          ' status.json | sort || echo "could not enumerate services"

          echo ""
          echo "== Does the oracle service already exist? =="
          if jq -e --arg env "$ENVIRONMENT" '
              [.environments.edges[]? | select(.node.name == $env)
               | .node.serviceInstances.edges[]?.node
               | select(.serviceName == "oracle")] | length > 0' status.json >/dev/null 2>&1; then
            echo "YES — provision will only update variables"
          else
            echo "NO — provision must create it"
          fi

          echo ""
          echo "== Migration ledger (read-only dry run) =="
          bash database/scripts/railway-migrate.sh --dry-run || echo "(dry run reported a problem — read it above)"

          echo ""
          echo "== Provider keys: presence and shape only, never a value =="
          # Without DeepSeek the tutor is live and cannot teach; without Qwen no
          # minor's session starts at all (/ORACLE.md §16).
          for svc in coursegen littlefounders-backend; do
            echo "-- $svc"
            railway variable list --service "$svc" --environment "$ENVIRONMENT" --json 2>/dev/null \
              | jq -r 'to_entries
                       | map(select(.key | test("DEEPSEEK_API_KEY|QWEN_API_KEY|INTERNAL_API_KEY|REDIS_URL|ORACLE_|TUTOR_|FILEBASE_")))
                       | sort_by(.key)
                       | map("   \(.key): " + (
                           if ((.value // "") | length) == 0 then "EMPTY"
                           elif (.value | test("replace|placeholder|example|fake";"i")) then "PLACEHOLDER"
                           else "configured" end))
                       | .[]' \
              || echo "   could not read variables"
          done

      # ── PROBE — what this token is actually allowed to do ────────────────
      # `railway add` failed with "Project not found" while `railway status`
      # and `railway variable list` worked in the same job, which means the
      # question is not connectivity but AUTHORITY: a Railway project token
      # carries a project context for reading and deploying, and creating a
      # service may simply not be within it. Guessing costs a dispatch each
      # time, so this step asks the CLI directly and prints nothing secret.
      - name: Probe the CLI's authority
        if: inputs.step == 'probe'
        run: |
          set -uo pipefail

          echo "== whoami =="
          railway whoami 2>&1 | head -5 || true

          echo ""
          echo "== project identity (ids are not secrets; tokens are) =="
          railway status --environment "$ENVIRONMENT" --json > status.json 2>status.err || cat status.err
          jq -r '{id, name} | "project \(.name)  id=\(.id)"' status.json 2>/dev/null || echo "no id in payload"
          jq -r '.environments.edges[]?.node | "environment \(.name)  id=\(.id)"' status.json 2>/dev/null || true

          echo ""
          echo '== what does railway add actually accept in this version? =='
          railway add --help 2>&1 | head -40 || true

          echo ""
          echo '== and railway link? =='
          railway link --help 2>&1 | head -30 || true

          echo ""
          echo "== may the token create a service? =="
          # Probed with the REAL name on purpose. If the answer is yes, the
          # probe IS the provision and nothing is left behind to clean up; if
          # it is no, we learn exactly that. </dev/null so the CLI cannot fall
          # back to its prompt and hang the job waiting for a human.
          railway add --service oracle </dev/null 2>&1 | head -20 || true

          echo ""
          echo "== did it appear? =="
          railway status --environment "$ENVIRONMENT" --json 2>/dev/null \
            | jq -r --arg env "$ENVIRONMENT" '
                [.environments.edges[]? | select(.node.name == $env)
                 | .node.serviceInstances.edges[]?.node.serviceName]
                | if index("oracle") then "YES — oracle exists now" else "NO — oracle still absent" end' \
            || echo "could not re-read status"

      # ── MIGRATE — mutates the production database ────────────────────────
      #
      # A PRE-FLIGHT DUMP, TAKEN NOW. `vault-backup.yml` runs daily at 08:00
      # UTC, so a migration at 20:00 was separated from its most recent restore
      # point by up to twelve hours of real family data. That is the wrong
      # exposure for the one operation in this repository that can destroy a
      # column, and it costs one pg_dump to remove.
      #
      # These are `vault-backup.yml`'s own commands, deliberately: `railway ssh`
      # exits 0 even when the REMOTE command fails, so the `test -s` on the
      # pulled file is what actually proves a dump exists. A restore point
      # reported but not taken is the worst possible lie to tell immediately
      # before a destructive migration.
      - name: Pre-migration dump
        if: inputs.step == 'migrate'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail
          TS=$(date -u +%Y%m%d-%H%M%S)
          FILE="pre-migration-${TS}.dump"

          railway ssh --service db -i ~/.ssh/railway_key --             pg_dump -U supabase_admin -d postgres -Fc -f /tmp/premig.dump
          railway ssh --service db -i ~/.ssh/railway_key --             cat /tmp/premig.dump > "$FILE"
          test -s "$FILE"

          cat "$FILE" | railway ssh --service filebase -i ~/.ssh/railway_key --             sh -c "cat > /data/backups/$FILE"
          railway ssh --service db -i ~/.ssh/railway_key -- rm -f /tmp/premig.dump
          echo "Restore point: /data/backups/$FILE ($(wc -c < "$FILE") bytes)"

      - name: Apply pending migrations
        if: inputs.step == 'migrate'
        run: |
          set -euo pipefail
          # A contraction applied before its release is live is the failure
          # mode this gate exists for: the column goes while an older deploy
          # still names it, and PostgREST rejects every write that does.
          echo "== Phase declarations, and which pending migrations are contractions =="
          node database/scripts/check-migration-phase.mjs
          echo ""
          echo "== Dry run first: the pending list must be exactly what is expected =="
          bash database/scripts/railway-migrate.sh --dry-run
          echo ""
          echo "== Applying =="
          bash database/scripts/railway-migrate.sh --confirm-production

      # ── SEED-KC — loads the Tutor v3 knowledge-component graph ───────────
      #
      # Content, not schema: migration 0052 creates the tables and this fills
      # them from database/seeds/kc_graph.v1.json through the backend's own
      # loader — idempotent upsert by kc.key, cycle-checked, so re-dispatching
      # is always safe (/ORACLE.md §19). It runs HERE for the same reason
      # migrate does: the credentials live as Railway service variables and
      # nowhere else. The five env values are read straight into the
      # environment and never printed; SUPABASE_URL is the public gateway
      # (database/DEPLOYMENT.md), which is what makes a runner able to reach
      # PostgREST at all.
      - name: Seed the KC graph
        if: inputs.step == 'seed-kc'
        run: |
          set -euo pipefail
          read_var() {
            railway variable list --service littlefounders-backend --environment "$ENVIRONMENT" --json 2>/dev/null \
              | jq -r --arg k "$1" '.[$k] // ""'
          }
          export SUPABASE_URL="$(read_var SUPABASE_URL)"
          export SUPABASE_ANON_KEY="$(read_var SUPABASE_ANON_KEY)"
          export SUPABASE_SERVICE_ROLE_KEY="$(read_var SUPABASE_SERVICE_ROLE_KEY)"
          export SUPABASE_JWT_SECRET="$(read_var SUPABASE_JWT_SECRET)"
          export INTERNAL_API_KEY="$(read_var INTERNAL_API_KEY)"
          for v in SUPABASE_URL SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY SUPABASE_JWT_SECRET INTERNAL_API_KEY; do
            [ -n "${!v}" ] || { echo "::error::backend variable $v is empty"; exit 1; }
          done
          echo "Seeding the KC graph against $SUPABASE_URL"
          npm ci --prefix backend --no-audit --no-fund >/dev/null
          npm run --prefix backend seed:kc

      # ── PROBE-MODELS — read-only, answers "then which model?" ────────────
      #
      # `provision`'s own model_name description states the requirement: Oracle
      # needs a NON-reasoning model, because one that spends its completion
      # budget on reasoning_content hands back an empty answer and the learner
      # gets the scripted "my thoughts got tangled" line. Production was
      # nevertheless running one — `deepseek-v4-flash`, measured on 2026-08-29
      # spending 577 of 666 completion tokens thinking, returning empty content
      # on two of four probes, and taking 38 s on a turn that needed its retry
      # against a client that stops waiting at 25 s.
      #
      # The requirement was written down and violated for one reason: nobody
      # could answer "then which one?" without guessing, and a wrong guess
      # costs a deploy cycle and a tutor that cannot teach. This asks the
      # provider — it lists what the account can reach and puts each candidate
      # through one real turn — and CHANGES NOTHING. Adopting the answer stays
      # a separate, deliberate `provision`.
      - name: Probe candidate models
        if: inputs.step == 'probe-models'
        run: |
          set -euo pipefail
          read_var() {
            railway variable list --service oracle --environment "$ENVIRONMENT" --json 2>/dev/null \
              | jq -r --arg k "$1" '.[$k] // ""'
          }
          export MODEL_API_KEY="$(read_var MODEL_API_KEY)"
          export MODEL_API_BASE="$(read_var MODEL_API_BASE)"
          export MODEL_NAME="$(read_var MODEL_NAME)"
          export INTERNAL_API_KEY="$(read_var INTERNAL_API_KEY)"
          export TUTOR_SESSION_SECRET="$(read_var TUTOR_SESSION_SECRET)"
          export CORE_URL="$(read_var CORE_URL)"
          export CORE_INTERNAL_KEY="$(read_var CORE_INTERNAL_KEY)"
          [ -n "$MODEL_API_KEY" ] || { echo "::error::oracle MODEL_API_KEY is empty"; exit 1; }
          npm ci --prefix oracle --no-audit --no-fund >/dev/null
          npm run --prefix oracle model:probe

      # ── PROVISION — creates the service and sets variables ───────────────
      #
      # IDEMPOTENT IN THE STRONG SENSE: running it twice must not change
      # anything that is already correct. That matters most for the two shared
      # secrets. Regenerating them on every run would rotate a live pairing,
      # and because variables are staged with --skip-deploys, Core and Oracle
      # would pick up the new value at whatever moment each next redeploys —
      # so every tutor session between those two moments fails on a signature
      # that does not verify. They are therefore generated ONLY when absent.
      - name: Provision the oracle service
        if: inputs.step == 'provision'
        env:
          # Masked by GitHub in every log line, and never written to a file.
          INWORLD_KEY: ${{ secrets.INWORLD_API_KEY }}
        run: |
          set -uo pipefail
          # GitHub runs `bash -e` whatever the script says, so an expected
          # non-zero — `railway add` on a service that already exists, or a
          # `[ -n "$X" ] && …` guard that is simply false — would abandon the
          # step halfway through, leaving the service configured in part. That
          # is exactly how the first attempt at this step created `oracle` and
          # then set none of its variables. Failures are collected explicitly
          # below instead.
          set +e

          FAILED=0

          service_exists() {
            railway status --environment "$ENVIRONMENT" --json 2>/dev/null \
              | jq -e --arg env "$ENVIRONMENT" '
                  [.environments.edges[]? | select(.node.name == $env)
                   | .node.serviceInstances.edges[]?.node.serviceName]
                  | index("oracle") != null' >/dev/null 2>&1
          }

          if service_exists; then
            echo "oracle already exists — updating variables only"
          else
            echo "Creating the oracle service"
            # </dev/null: `railway add` falls back to an interactive picker and
            # would otherwise read the job's own arguments as answers to it.
            railway add --service oracle </dev/null 2>&1 | sed 's/^/   /'
            # Trust the project, not the exit code. `railway add` reports
            # failure for reasons that include "it worked, and then something
            # else did not" — which is how the service came to exist at all,
            # created by a run that ended in error.
            if service_exists; then
              echo "   oracle exists now"
            else
              echo "::error::could not create the oracle service"
              exit 1
            fi
          fi

          read_var() {
            railway variable list --service "$1" --environment "$ENVIRONMENT" --json 2>/dev/null \
              | jq -r --arg k "$2" '.[$k] // ""'
          }

          set_var() {
            if railway variable set --service "$1" --environment "$ENVIRONMENT" --skip-deploys "$2=$3" >/dev/null 2>&1; then
              echo "   set $1/$2"
            else
              echo "::error::failed to set $1/$2"
              FAILED=$((FAILED + 1))
            fi
          }

          CORE_KEY="$(read_var littlefounders-backend INTERNAL_API_KEY)"
          DEPOT_KEY="$(read_var filebase INTERNAL_API_KEY)"
          REDIS="$(read_var littlefounders-backend REDIS_URL)"

          # The provider keys are NOT a manual step. `step=inspect` confirmed on
          # 2026-08-21 that coursegen already holds a real DEEPSEEK_API_KEY and a
          # real QWEN_API_KEY, and Oracle wants the same two accounts Forge uses
          # — same vendor, same billing, same rotation. Copying them is what an
          # operator would do by hand, minus the trip through a clipboard.
          MODEL_KEY="$(read_var coursegen DEEPSEEK_API_KEY)"
          JUDGE_KEY="$(read_var coursegen QWEN_API_KEY)"

          # THE ENDPOINT AND THE MODEL TRAVEL WITH THE KEY. Copying only the
          # credential and leaving Oracle on its own defaults is how the tutor
          # shipped calling https://api.deepseek.com/chat/completions — no /v1,
          # because neither service uses an SDK that appends it — and 404'd on
          # every turn while /health said `model: up` and every test passed.
          # Fall back to Forge's own defaults when the variable is unset there,
          # since an unset variable means Forge is running on those defaults too.
          MODEL_BASE="$(read_var coursegen DEEPSEEK_BASE_URL)"
          JUDGE_BASE="$(read_var coursegen QWEN_BASE_URL)"
          JUDGE_MODEL_V="$(read_var coursegen QWEN_JUDGE_MODEL)"
          [ -n "$MODEL_BASE" ]    || MODEL_BASE='https://api.deepseek.com/v1'
          [ -n "$JUDGE_BASE" ]    || JUDGE_BASE='https://dashscope-intl.aliyuncs.com/compatible-mode/v1'
          [ -n "$JUDGE_MODEL_V" ] || JUDGE_MODEL_V='qwen3-max'

          # THE MODEL NAME IS THE ONE THING NOT COPIED. Forge's DEEPSEEK_MODEL
          # is deepseek-v4-pro, a REASONING model: asked for a tutor turn it
          # spends the whole completion budget on reasoning_content and returns
          # empty content. Right for authoring a course offline, wrong with a
          # learner waiting. Copying it here would silently undo the fix every
          # time someone re-ran provision — the worst kind of regression,
          # because re-running provision is what you do when something is wrong.
          # agent/tools/check-provider-parity.mjs records the divergence.
          # Same shape as voice_provider, and for the same reason: the guard
          # below correctly preserves an explicit choice, and the choice it is
          # preserving was written by the earlier run that copied Forge's
          # reasoning model. A guard cannot tell a decision from a mistake, so
          # correcting one takes a dispatch input rather than a silent default.
          WANT_MODEL='${{ inputs.model_name }}'
          MODEL_NAME_V="$(read_var oracle MODEL_NAME)"
          if [ "$WANT_MODEL" != "keep" ] && [ -n "$WANT_MODEL" ]; then
            echo "   model: deliberately set to '$WANT_MODEL' (was '${MODEL_NAME_V:-unset}')"
            MODEL_NAME_V="$WANT_MODEL"
          elif [ -z "$MODEL_NAME_V" ]; then
            MODEL_NAME_V='deepseek-v4-flash'
            echo "   model: was unset, defaulted to '$MODEL_NAME_V'"
          else
            echo "   model: '$MODEL_NAME_V' already chosen, left alone"
          fi

          if [ -z "$CORE_KEY" ]; then
            echo "::error::could not read Core's INTERNAL_API_KEY — Oracle cannot call Core without it"
            exit 1
          fi

          # ── the two shared secrets ────────────────────────────────────────
          # Each is ONE value that must be identical on both services. Reuse
          # whatever is already there, generate only what is missing, and if
          # the two sides disagree regenerate both — a mismatched pair is not
          # a state worth preserving.
          #
          # GENERATED HERE, ON PURPOSE: straight from /dev/urandom into
          # Railway, never touching a machine, a log or a file. `tr -d` strips
          # base64 padding and the newline so the value is safe as a KEY=VALUE
          # argument and needs no quoting downstream.
          ORACLE_SVC_KEY="$(read_var oracle INTERNAL_API_KEY)"
          CORE_SVC_KEY="$(read_var littlefounders-backend ORACLE_INTERNAL_KEY)"
          if [ -n "$ORACLE_SVC_KEY" ] && [ "$ORACLE_SVC_KEY" = "$CORE_SVC_KEY" ]; then
            SERVICE_KEY="$ORACLE_SVC_KEY"
            echo "service key: already paired, left alone"
          else
            SERVICE_KEY="$(openssl rand -base64 32 | tr -d '\n=+/')"
            if [ -n "$ORACLE_SVC_KEY$CORE_SVC_KEY" ]; then
              echo "::warning::the Core and Oracle service keys did not match — regenerating both"
            fi
            echo "service key: generated"
          fi

          ORACLE_SESSION="$(read_var oracle TUTOR_SESSION_SECRET)"
          CORE_SESSION="$(read_var littlefounders-backend TUTOR_SESSION_SECRET)"
          if [ -n "$ORACLE_SESSION" ] && [ "$ORACLE_SESSION" = "$CORE_SESSION" ]; then
            SESSION_SECRET="$ORACLE_SESSION"
            echo "session secret: already paired, left alone"
          else
            SESSION_SECRET="$(openssl rand -base64 48 | tr -d '\n=+/')"
            if [ -n "$ORACLE_SESSION$CORE_SESSION" ]; then
              echo "::warning::the Core and Oracle session secrets did not match — regenerating both"
            fi
            echo "session secret: generated"
          fi

          echo "-- oracle"
          set_var oracle INTERNAL_API_KEY "$SERVICE_KEY"
          set_var oracle TUTOR_SESSION_SECRET "$SESSION_SECRET"
          set_var oracle CORE_URL "http://littlefounders-backend.railway.internal:4000"
          set_var oracle CORE_INTERNAL_KEY "$CORE_KEY"
          set_var oracle DEPOT_URL "http://filebase.railway.internal:4006"
          set_var oracle NODE_ENV "production"
          set_var oracle PORT "4009"
          # VOICE IS THE PRODUCT, and this step used to pin it OFF.
          #
          # `set_var oracle VOICE_PROVIDER "none"` ran on every provision, so it
          # would have silently reverted the owner's own change on the next
          # deploy — the worst kind of configuration bug, because the symptom
          # (the tutor went quiet again) appears hours later and points at
          # nothing. The DPA gate it was enforcing is about MINORS, and there is
          # already a separate, explicit flag for exactly that. Conflating the
          # two silenced adults who were never in question, which is how the
          # microphone came to be missing from the product entirely.
          #
          # Now: read what is there and leave a deliberate choice alone. Only an
          # UNSET provider is defaulted, and defaulted to the product's intent.
          # `keep` is the default and does exactly nothing to an existing
          # choice. Turning the tutor's voice on or off is a decision, so it
          # takes a decision: dispatch with voice_provider=inworld or =none.
          ORACLE_VOICE="$(read_var oracle VOICE_PROVIDER)"
          WANT_VOICE='${{ inputs.voice_provider }}'
          if [ "$WANT_VOICE" != "keep" ] && [ -n "$WANT_VOICE" ]; then
            set_var oracle VOICE_PROVIDER "$WANT_VOICE"
            echo "   voice provider: deliberately set to '$WANT_VOICE' (was '${ORACLE_VOICE:-unset}')"
          elif [ -n "$ORACLE_VOICE" ]; then
            echo "   voice provider: '$ORACLE_VOICE' already chosen, left alone"
          else
            set_var oracle VOICE_PROVIDER "inworld"
            echo "   voice provider: was unset, defaulted to 'inworld'"
          fi

          # The minor gate stays exactly as strict, and stays SEPARATE. It is
          # false until a data-processing agreement covering children's audio
          # exists (/LEGAL/AI_TUTOR_LEGAL_REVIEW.md §6); flipping it is an owner
          # decision to record in /ORACLE.md §16, never a side effect of a
          # deploy. Same rule: an explicit choice is never overwritten.
          MINOR_VOICE="$(read_var oracle TUTOR_VOICE_FOR_MINORS)"
          if [ -n "$MINOR_VOICE" ]; then
            echo "   minors' microphone: '$MINOR_VOICE' already chosen, left alone"
          else
            set_var oracle TUTOR_VOICE_FOR_MINORS "false"
          fi

          # The Inworld credential travels from a repository secret, so it is
          # masked in every log and never lives in a file. Absent, the tutor is
          # captioned and silent rather than broken.
          if [ -n "${INWORLD_KEY:-}" ]; then
            set_var oracle INWORLD_API_KEY "$INWORLD_KEY"
          else
            echo "::warning::no INWORLD_API_KEY secret — every character will be captioned and SILENT"
          fi

          # THE CAST'S OWN VOICES, from tracked config rather than from memory.
          #
          # oracle/voices.enrolled.json maps character x locale to the voice id
          # produced by `npm run voices:clone`, which clones from the SAME
          # reference recordings Echo narrates lessons with. That is the whole
          # point: a child who knows Dr. Rho from a lesson must meet the same
          # Dr. Rho in the tutor, not a stranger wearing his name.
          #
          # Ids, not secrets — useless without the key above — so they are
          # tracked, and a re-enrolment is a reviewable diff instead of twelve
          # values pasted into a dashboard by hand. A MISSING entry means that
          # character is SILENT in that locale, deliberately and by design.
          echo "-- character voices"
          if [ -f oracle/voices.enrolled.json ]; then
            enrolled=0
            while IFS='=' read -r vkey vid; do
              [ -z "$vkey" ] && continue
              set_var oracle "$vkey" "$vid"
              enrolled=$((enrolled + 1))
            done <<< "$(jq -r '
              .voices | to_entries[] as $c
              | $c.value | to_entries[]
              | "INWORLD_VOICE_" + ($c.key | ascii_upcase)
                + "_" + (.key | ascii_upcase | gsub("-"; "_"))
                + "=" + .value
            ' oracle/voices.enrolled.json)"
            echo "   $enrolled character voice(s) mapped"
            # Twelve is four canonical characters across three locales. Fewer is
            # not an error — it is a cast with silent members, and worth saying
            # out loud rather than discovering when a child picks one.
            [ "$enrolled" -eq 12 ] || echo "::warning::only $enrolled/12 character voices are enrolled; the rest stay silent"
          else
            echo "::warning::oracle/voices.enrolled.json is missing — every character will be captioned and SILENT"
          fi

          # NOT A WARNING. Without both DEPOT_URL and DEPOT_INTERNAL_KEY,
          # `storeTurnAudio` returns null immediately and every `audioUrl` is
          # null — a fully successful, fully PAID-FOR text-to-speech call whose
          # audio never reaches the browser. From the outside that is
          # indistinguishable from an unenrolled character, so nobody would look
          # at Depot. Voice can no longer be on and unstorable at the same time.
          if [ -n "$DEPOT_KEY" ]; then
            set_var oracle DEPOT_INTERNAL_KEY "$DEPOT_KEY"
          else
            echo "::error::filebase has no INTERNAL_API_KEY to copy — every spoken turn would be synthesised, billed, and silently discarded"
            FAILED=$((FAILED + 1))
          fi
          if [ -n "$REDIS" ]; then
            set_var oracle REDIS_URL "$REDIS"
          else
            echo "::warning::no REDIS_URL to copy — Oracle falls back to its in-memory rate limiter"
          fi

          # Each of these has a distinct, stated consequence if absent, so each
          # gets its own error rather than a shared "some keys are missing".
          set_var oracle MODEL_API_BASE "$MODEL_BASE"
          set_var oracle MODEL_NAME "$MODEL_NAME_V"
          set_var oracle JUDGE_API_BASE "$JUDGE_BASE"
          set_var oracle JUDGE_MODEL_NAME "$JUDGE_MODEL_V"

          if [ -n "$MODEL_KEY" ]; then
            set_var oracle MODEL_API_KEY "$MODEL_KEY"
          else
            echo "::error::coursegen has no DEEPSEEK_API_KEY to copy — Oracle would come up live and unable to teach"
            FAILED=$((FAILED + 1))
          fi
          if [ -n "$JUDGE_KEY" ]; then
            set_var oracle JUDGE_API_KEY "$JUDGE_KEY"
          else
            echo "::error::coursegen has no QWEN_API_KEY to copy — no minor's session can start without the moderation judge"
            FAILED=$((FAILED + 1))
          fi

          echo "-- littlefounders-backend"
          set_var littlefounders-backend ORACLE_URL "http://oracle.railway.internal:4009"
          set_var littlefounders-backend ORACLE_INTERNAL_KEY "$SERVICE_KEY"
          set_var littlefounders-backend TUTOR_SESSION_SECRET "$SESSION_SECRET"
          set_var littlefounders-backend FILEBASE_URL "http://filebase.railway.internal:4006"
          if [ -n "$DEPOT_KEY" ]; then
            set_var littlefounders-backend FILEBASE_INTERNAL_KEY "$DEPOT_KEY"
          fi

          echo ""
          if [ "$FAILED" -gt 0 ]; then
            echo "::error::$FAILED variable(s) could not be set — re-dispatch step=provision once the cause is fixed"
            exit 1
          fi
          echo "provision OK"
          echo ""
          echo "NEXT: merge the tutor PR so oracle CI -> oracle CD gives the"
          echo "service its first deployment, then dispatch step=domain."
          echo ""
          echo "REMEMBER: variables are staged with --skip-deploys, so the"
          echo "RUNNING container still holds the old ones. Oracle caches its"
          echo "config AND its voice provider at module scope, so nothing above"
          echo "takes effect until the service restarts."
          echo ""
          echo "STILL AN OWNER DECISION, never a deploy side effect:"
          echo "  oracle/TUTOR_VOICE_FOR_MINORS  false until a data-processing"
          echo "  agreement covering children's audio exists"
          echo "  (/LEGAL/AI_TUTOR_LEGAL_REVIEW.md §6, recorded in /ORACLE.md §16)"

      # ── DOMAIN — the browser opens a websocket straight to Oracle ────────
      - name: Give oracle a public domain
        if: inputs.step == 'domain'
        run: |
          set -uo pipefail
          # Same reason as the provision step: GitHub runs `bash -e` whatever
          # this says, and half of what follows is allowed to fail. A `grep`
          # that finds nothing is the ordinary "no domain yet" answer, not a
          # reason to abandon the job before it can report that.
          set +e

          echo "== Existing domains =="
          # </dev/null so the CLI cannot drop into its prompt and hold the job
          # open until the 25-minute timeout.
          railway domain list --service oracle </dev/null 2>&1 | tee domains.txt | head -30

          # Only GENERATE one if there is nothing at all. Bare `railway domain`
          # creates a *.up.railway.app host, and calling it on a service that
          # already has domains is how a project accumulates addresses nobody
          # meant to publish.
          if ! grep -qE '[a-z0-9.-]+\.(up\.railway\.app|littlefounders\.ai)' domains.txt; then
            echo ""
            echo "== No domain yet — generating one =="
            railway domain --service oracle </dev/null 2>&1 | tee -a domains.txt
          fi

          # PREFER THE CUSTOM DOMAIN. Both can exist at once and both work, but
          # this is the address handed to every learner's browser, and it ends
          # up in transcripts, logs, support screenshots and a child's URL bar.
          # `oracle-production-e82a.up.railway.app` also silently ties the
          # product to one vendor's hostname — moving off Railway later would
          # change an address the frontend has been told to trust.
          #
          # `|| true` INSIDE each substitution: without it a grep that matches
          # nothing makes the assignment itself non-zero, and the step dies on
          # the one branch it exists to report.
          HOST="$(grep -oE '[a-z0-9-]+\.littlefounders\.ai' domains.txt | head -1 || true)"
          if [ -n "$HOST" ]; then
            echo ""
            echo "Using the custom domain: $HOST"
          else
            HOST="$(grep -oE '[a-z0-9-]+\.up\.railway\.app' domains.txt | head -1 || true)"
            [ -n "$HOST" ] && echo "" && echo "Using the Railway-provided domain: $HOST"
          fi

          if [ -z "$HOST" ]; then
            echo "::error::no domain host parsed — Oracle has no public address and the tutor cannot open a socket"
            exit 1
          fi

          if railway variable set --service littlefounders-backend --environment "$ENVIRONMENT" \
               --skip-deploys "ORACLE_PUBLIC_URL=https://$HOST" >/dev/null 2>&1; then
            echo "   set littlefounders-backend/ORACLE_PUBLIC_URL=https://$HOST"
          else
            echo "::error::could not set ORACLE_PUBLIC_URL — the browser would be told to open a websocket to localhost"
            exit 1
          fi

          # THE VARIABLE IS NOT THE DEPLOY. --skip-deploys is the right flag —
          # nobody wants a rolling restart per variable — but it means the
          # RUNNING Core still holds the old value and keeps handing it out.
          # That gap is invisible: no error, no warning, every healthcheck
          # green, and simply the wrong address for every learner who asks.
          # Observed on 2026-08-21, when Core served the localhost default for
          # two minutes after the merge. So the step that changes the address
          # is the step that makes Core read it.
          echo ""
          echo "== Redeploying Core so it actually reads the new value =="
          if railway redeploy --service littlefounders-backend --environment "$ENVIRONMENT" --yes </dev/null 2>&1 | tail -5; then
            echo "   redeploy requested"
          else
            echo "::warning::could not request a redeploy — re-run backend CD, or Core will keep serving the previous ORACLE_PUBLIC_URL"
          fi

          echo ""
          echo "== Is it answering? =="
          # A fresh custom domain waits on certificate issuance, which took
          # about two minutes for tutor-b2c. This reports and never gates —
          # `step=verify` is the gate, and a step that both acts and judges
          # tends to do neither well.
          for attempt in 1 2 3 4 5 6 7 8; do
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "https://$HOST/health" || true)"
            echo "   attempt $attempt: HTTP $code"
            [ "$code" = "200" ] && break
            sleep 20
          done
          curl -s --max-time 10 "https://$HOST/health" || true
          echo ""

      # ── VERIFY — read-only ───────────────────────────────────────────────
      - name: Preflight
        if: ${{ !cancelled() && inputs.step == 'verify' }}
        run: bash agent/tools/railway-preflight.sh "$ENVIRONMENT"

      - name: Reach Oracle the way Core reaches it
        if: ${{ !cancelled() && inputs.step == 'verify' }}
        run: |
          set -uo pipefail
          set +e

          # The preflight above proves the two services are CONFIGURED to find
          # each other. It cannot prove they can. ORACLE_URL points at Railway
          # private networking, which is a different network from the public
          # domain the browser uses and is reachable from nowhere else — so the
          # only honest test is to stand inside Core and call.
          #
          # This matters because the failure is invisible from outside: both
          # services stay healthy on their own /health, the learner presses the
          # button, and Core reports that the tutor is unavailable with nothing
          # anywhere naming a network as the reason.
          echo "== From inside Core: GET http://oracle.railway.internal:4009/health =="
          out="$(railway ssh --service littlefounders-backend -i ~/.ssh/railway_key -- \
                  curl -s --max-time 10 http://oracle.railway.internal:4009/health 2>&1)"
          echo "$out" | sed 's/^/   /'

          if printf '%s' "$out" | grep -q '"service":"oracle"'; then
            echo "OK: Core can reach Oracle over private networking"
          else
            echo "::error::Core cannot reach Oracle at ORACLE_URL — every tutor session would fail at the door"
            exit 1
          fi

          echo ""
          echo "== And the public address the BROWSER is handed =="
          # Read back what Core will actually send to the client, rather than
          # what this workflow believes it set.
          PUBLIC="$(railway variable list --service littlefounders-backend --environment "$ENVIRONMENT" --json 2>/dev/null \
                    | jq -r '.ORACLE_PUBLIC_URL // ""')"
          if [ -z "$PUBLIC" ]; then
            echo "::error::ORACLE_PUBLIC_URL is unset — the browser would be told to open a websocket to localhost"
            exit 1
          fi
          case "$PUBLIC" in
            *localhost*|*127.0.0.1*)
              echo "::error::ORACLE_PUBLIC_URL is $PUBLIC — that is this container, not the tutor"
              exit 1
              ;;
          esac
          echo "   $PUBLIC"
          code="$(curl -s -o body.txt -w '%{http_code}' --max-time 15 "$PUBLIC/health" || true)"
          echo "   HTTP $code"
          sed 's/^/   /' body.txt
          echo ""
          [ "$code" = "200" ] || { echo "::error::the public tutor address does not answer"; exit 1; }

          echo ""
          echo "== The internal API must refuse an unauthenticated caller =="
          # A public domain on an internal-key service is the fourth §1.5
          # exception, granted for the learner's websocket ONLY. If the REST
          # surface behind that same domain answered without a key, the
          # exception would have quietly become an open door.
          code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 -X POST "$PUBLIC/api/v1/tutor/sessions" || true)"
          echo "   POST /api/v1/tutor/sessions with no key -> HTTP $code"
          case "$code" in
            401|403) echo "OK: refused" ;;
            *) echo "::error::expected 401/403, got $code — the internal API is answering strangers"; exit 1 ;;
          esac

          echo ""
          echo "verify OK"

      - name: Ask the providers, from inside Oracle
        if: ${{ !cancelled() && inputs.step == 'verify' }}
        run: |
          set -uo pipefail
          set +e

          # `/health` reports `model: up` when a KEY IS PRESENT. That is not the
          # same fact as "the provider answers", and the difference cost a day:
          # Oracle went live with a base URL missing the /v1 that coursegen has
          # always had, so every single turn 404'd while `/health` stayed green,
          # the preflight passed all thirty of its checks, and the only symptom
          # was that every learner was told "my thoughts got tangled" instead of
          # being taught. Nothing in the deploy pipeline could see it, because
          # nothing in the deploy pipeline had ever made a real call.
          #
          # So this makes one. From INSIDE the container, using the endpoint,
          # key and model name that container actually holds — not the ones this
          # workflow believes it set — and it reports the HTTP status, which is
          # the number that distinguishes "wrong URL" (404) from "wrong key"
          # (401) from "working" (200). Two tokens of output; the cost is
          # rounding error against a day of a silently broken tutor.
          probe() {
            local svc="$1" script="$2" b64
            b64=$(printf '%s' "$script" | base64 | tr -d '\n')
            railway ssh --service "$svc" -i ~/.ssh/railway_key -- \
              sh -c "echo $b64 | base64 -d | sh" 2>&1
          }

          FAILED=0
          check() {
            local label="$1" code="$2" advice="$3"
            case "$code" in
              200) echo "OK: $label answered 200" ;;
              404) echo "::error::$label returned 404 — the base URL is wrong. $advice"; FAILED=$((FAILED + 1)) ;;
              401|403) echo "::error::$label returned $code — the key is wrong or the account is suspended"; FAILED=$((FAILED + 1)) ;;
              400) echo "::error::$label returned 400 — endpoint reachable, request rejected (usually a retired model name)"; FAILED=$((FAILED + 1)) ;;
              402) echo "::error::$label returned 402 — the provider account is out of credit"; FAILED=$((FAILED + 1)) ;;
              *)   echo "::error::$label returned '$code' — no answer at all"; FAILED=$((FAILED + 1)) ;;
            esac
          }

          # Single-quoted on the way out so every $VAR expands THERE, against
          # the container's own environment, and nothing secret is ever built,
          # printed or held on this runner. Only the status code comes back.
          MODEL_PROBE='curl -sS -o /dev/null -w "%{http_code}" --max-time 30 -X POST'
          MODEL_PROBE="$MODEL_PROBE"' -H "Content-Type: application/json"'
          MODEL_PROBE="$MODEL_PROBE"' -H "Authorization: Bearer $MODEL_API_KEY"'
          MODEL_PROBE="$MODEL_PROBE"' -d "{\"model\":\"$MODEL_NAME\",\"messages\":[{\"role\":\"user\",\"content\":\"ping\"}],\"max_tokens\":1}"'
          MODEL_PROBE="$MODEL_PROBE"' "$MODEL_API_BASE/chat/completions"'

          JUDGE_PROBE='curl -sS -o /dev/null -w "%{http_code}" --max-time 30 -X POST'
          JUDGE_PROBE="$JUDGE_PROBE"' -H "Content-Type: application/json"'
          JUDGE_PROBE="$JUDGE_PROBE"' -H "Authorization: Bearer $JUDGE_API_KEY"'
          JUDGE_PROBE="$JUDGE_PROBE"' -d "{\"model\":\"$JUDGE_MODEL_NAME\",\"messages\":[{\"role\":\"user\",\"content\":\"ping\"}],\"max_tokens\":1}"'
          JUDGE_PROBE="$JUDGE_PROBE"' "$JUDGE_API_BASE/chat/completions"'

          echo "== The pedagogical model (DeepSeek) =="
          echo "   without it the tutor is live and cannot teach"
          code="$(probe oracle "$MODEL_PROBE" | tail -1 | tr -dc '0-9')"
          echo "   HTTP $code"
          check 'the pedagogical model' "$code" 'It must end in /v1 — we build ${BASE}/chat/completions by hand.'

          echo ""
          echo "== The moderation judge (Qwen) =="
          echo "   without it no minor's session starts at all"
          code="$(probe oracle "$JUDGE_PROBE" | tail -1 | tr -dc '0-9')"
          echo "   HTTP $code"
          check 'the moderation judge' "$code" 'Check JUDGE_API_BASE.'

          # WHICH MODELS THIS ACCOUNT MAY ACTUALLY CALL. Cheap, and it is the
          # answer to the question a bad MODEL_NAME raises. Model ids are not
          # secrets; the key stays in the container as always.
          echo ""
          echo "== Models this account can call =="
          LIST='curl -sS --max-time 30 -H "Authorization: Bearer $MODEL_API_KEY" "$MODEL_API_BASE/models"'
          probe oracle "$LIST" \
            | tr ',' '\n' \
            | grep -o '"id":"[^"]*"' \
            | sed 's/"id":"/   /; s/"$//' \
            | sort -u

          echo ""
          if [ "$FAILED" -gt 0 ]; then
            echo "::error::$FAILED provider(s) unreachable — the tutor would answer every learner with its degraded line"
            exit 1
          fi
          echo "providers OK — both answered a real request"

      - name: Teach one turn, from inside Oracle
        if: ${{ !cancelled() && inputs.step == 'verify' }}
        run: |
          set -uo pipefail
          set +e

          # The probe above proves the PROVIDER answers. This proves ORACLE can
          # teach, which is a different question with four failure modes between
          # them: the privacy seal, our own request shape (including
          # response_format: json_object, which a model-name change can silently
          # drop), the closed turn schema, and the independent judge.
          #
          # `oracle/scripts/verify-model.ts` drives the real code — sealContext,
          # the real system prompt, the real client, parseTurn, moderation — so
          # what passes here is what a learner would get. It starts no session,
          # writes no row, and needs no learner: the context is synthetic and
          # carries exactly what the schema allows.
          #
          # It runs INSIDE the container because that is where the keys are, and
          # they are never going anywhere else.
          SCRIPT='cd /app && npx --no-install tsx scripts/verify-model.ts'
          b64=$(printf '%s' "$SCRIPT" | base64 | tr -d '\n')
          out="$(railway ssh --service oracle -i ~/.ssh/railway_key -- \
                  sh -c "echo $b64 | base64 -d | sh" 2>&1)"
          status=$?
          printf '%s\n' "$out" | sed 's/^/   /'

          if printf '%s' "$out" | grep -q 'model:verify OK'; then
            echo ""
            echo "OK: Oracle can teach — sealed, answered, parsed, judged"
            exit 0
          fi

          echo ""
          if printf '%s' "$out" | grep -qiE 'tsx: not found|could not determine executable|npm ERR'; then
            # A pruned production image has no tsx. That is a tooling gap, not a
            # broken tutor, and saying so beats an alarming red X — the provider
            # probe above already covered the part that matters most.
            echo "::warning::tsx is not available in the container, so the teaching path could not be exercised here. Run 'npm run model:verify' against a machine with oracle/.env, or build the script into dist/."
            exit 0
          fi
          echo "::error::Oracle could not produce a valid turn (exit $status) — read the stages above; the first FAIL is the cause"
          exit 1

      - name: Be HEARD FROM — the microphone, from inside Oracle
        if: ${{ !cancelled() && inputs.step == 'verify' }}
        run: |
          set -uo pipefail
          set +e

          # THE STEP WHOSE ABSENCE COST THE WHOLE FEATURE.
          #
          # `verify-speaks` proves the tutor can be HEARD. Nothing proved the
          # tutor could HEAR — and for six days it could not. Every Chrome, Edge
          # and Android microphone turn arrived as WebM, was labelled `OGG_OPUS`
          # by the adapter, and came back 500. Meanwhile the only round trip
          # anyone ran transcribed the TTS response using its own mimeType,
          # `audio/mpeg`, so the sole container ever exercised was MP3 — which no
          # browser records and which worked fine.
          #
          # `verify-inworld.ts` now replays committed fixtures recorded in the
          # containers browsers really produce: WebM/Opus and M4A. A FAIL here
          # means the microphone is down for whichever browser owns the fixture,
          # and the message says which.
          SCRIPT='cd /app && npx --no-install tsx scripts/verify-inworld.ts'
          b64=$(printf '%s' "$SCRIPT" | base64 | tr -d '\n')
          out="$(railway ssh --service oracle -i ~/.ssh/railway_key -- \
                  sh -c "echo $b64 | base64 -d | sh" 2>&1)"
          printf '%s\n' "$out" | sed 's/^/   /'

          if printf '%s' "$out" | grep -q 'voices:verify OK'; then
            echo ""
            echo "OK: the microphone works — WebM/Opus and M4A both transcribed"
            exit 0
          fi

          echo ""
          if printf '%s' "$out" | grep -qiE 'tsx: not found|could not determine executable|npm ERR'; then
            echo "::warning::tsx is not available in the container, so the microphone could not be exercised here."
            exit 0
          fi
          if printf '%s' "$out" | grep -q 'provider reports unavailable'; then
            echo "::warning::VOICE_PROVIDER is none — there is no microphone to test."
            exit 0
          fi
          echo "::error::the microphone could not transcribe a real browser container — read the stages above; the first FAIL names the affected browsers"
          exit 1

      - name: Be heard, from inside Oracle
        if: ${{ !cancelled() && inputs.step == 'verify' }}
        run: |
          set -uo pipefail
          set +e

          # `voices:verify` proves TRANSPORT and enrolment. Both can be green
          # while every learner sits in silence, because between "Inworld
          # returned audio" and "a child hears it" sits storeTurnAudio(), which
          # returns null the instant DEPOT_URL or DEPOT_INTERNAL_KEY is missing.
          # The turn is then emitted captioned and silent, exactly as designed,
          # after a text-to-speech call that succeeded and was BILLED — and from
          # outside that is indistinguishable from an unenrolled character, so
          # nobody thinks to look at Depot.
          #
          # This walks the whole chain for a real character: enrolled, spoken in
          # their OWN cloned voice, stored, and then fetched back over plain
          # HTTP with no credentials at all, the way a browser will ask.
          SCRIPT='cd /app && npx --no-install tsx scripts/verify-speaks.ts'
          b64=$(printf '%s' "$SCRIPT" | base64 | tr -d '\n')
          out="$(railway ssh --service oracle -i ~/.ssh/railway_key -- \
                  sh -c "echo $b64 | base64 -d | sh" 2>&1)"
          printf '%s\n' "$out" | sed 's/^/   /'

          if printf '%s' "$out" | grep -q 'speaks:verify OK'; then
            echo ""
            echo "OK: the cast can be heard — enrolled, synthesized, stored, fetchable"
            exit 0
          fi

          echo ""
          if printf '%s' "$out" | grep -qiE 'tsx: not found|could not determine executable|npm ERR'; then
            echo "::warning::tsx is not available in the container, so the audio chain could not be walked here."
            exit 0
          fi
          if printf '%s' "$out" | grep -q 'provider reports unavailable'; then
            echo "::warning::VOICE_PROVIDER is none — every character is captioned and silent BY DESIGN, so there is nothing here to hear."
            exit 0
          fi
          echo "::error::a character could not be heard — read the stages above; the first FAIL is the cause"
          exit 1
