name: Tutor deploy (operator)

# One-shot operator steps for bringing the AI Tutor (Oracle) online.
# RUNBOOK.md "Deploying the AI Tutor (Oracle)" is the narrative; this is the
# hands.
#
# WHY A WORKFLOW AND NOT A LAPTOP. The Railway credentials for this project
# live as repository secrets and nowhere else, which is correct — but it means
# every production step has to run on a runner. Same mechanism
# insights-maintenance.yml and vault-backup.yml already use.
#
# READ-ONLY UNLESS ASKED. `inspect` is the default and mutates nothing. Each
# mutating step is separate and idempotent, so a half-finished run is resumed
# by re-dispatching the step that failed rather than by starting over.
#
# NO SECRET VALUE IS EVER PRINTED. The two shared secrets are generated ON THE
# RUNNER and written straight into Railway, so they never exist on anyone's
# machine, in any log, or in any file. Every command that touches one is
# silenced.
#
# CLI SURFACE, verified against railway 5.41.2 rather than assumed:
#   railway variable list --service S --environment E --json
#   railway variable set  --service S --environment E  KEY=VALUE
#   railway status --environment E --json
#   railway add --service NAME
#   railway domain --service NAME

on:
  workflow_dispatch:
    inputs:
      step:
        description: 'Which step to run'
        required: true
        default: inspect
        type: choice
        options:
          - inspect
          - probe
          - migrate
          - provision
          - domain
          - verify

permissions:
  contents: read

jobs:
  run:
    name: 'Tutor deploy — ${{ inputs.step }}'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      ENVIRONMENT: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install the Railway CLI
        run: |
          npm i -g @railway/cli
          railway --version
          jq --version

      - name: Write the Railway SSH key
        if: inputs.step == 'inspect' || inputs.step == 'migrate' || inputs.step == 'verify'
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.RAILWAY_SSH_PRIVATE_KEY }}" > ~/.ssh/railway_key
          chmod 600 ~/.ssh/railway_key
          # Railway's SSH proxy host is ephemeral per session, not a fixed host
          # worth pinning — a fresh runner has no cached host key.
          # LogLevel ERROR because the host key is deliberately not cached:
          # ssh would otherwise print "Warning: Permanently added ..." on
          # stderr, which the migration script merges into psql's stdout and
          # reads as a query result. The script filters that line too — this is
          # the other half, silencing it at the source rather than after.
          cat <<'CONFIG' >> ~/.ssh/config
          Host *
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            LogLevel ERROR
          CONFIG
          chmod 600 ~/.ssh/config

      # ── INSPECT — mutates nothing ────────────────────────────────────────
      - name: Inspect production
        if: inputs.step == 'inspect'
        run: |
          set -uo pipefail

          echo "== Which project does this token reach? =="
          railway status --environment "$ENVIRONMENT" --json > status.json 2>status.err \
            && jq -r '{project: .name} | .project' status.json \
            || { echo "status failed:"; cat status.err; }

          echo ""
          echo "== Production services and instance states =="
          jq -r --arg env "$ENVIRONMENT" '
            .environments.edges[]? | select(.node.name == $env)
            | .node.serviceInstances.edges[]?.node
            | .serviceName + "  " + ((.activeDeployments // [])
                | map((.instances // []) | map(.status) | join(","))
                | join(",") | if . == "" then "no-active-deployment" else . end)
          ' status.json | sort || echo "could not enumerate services"

          echo ""
          echo "== Does the oracle service already exist? =="
          if jq -e --arg env "$ENVIRONMENT" '
              [.environments.edges[]? | select(.node.name == $env)
               | .node.serviceInstances.edges[]?.node
               | select(.serviceName == "oracle")] | length > 0' status.json >/dev/null 2>&1; then
            echo "YES — provision will only update variables"
          else
            echo "NO — provision must create it"
          fi

          echo ""
          echo "== Migration ledger (read-only dry run) =="
          bash database/scripts/railway-migrate.sh --dry-run || echo "(dry run reported a problem — read it above)"

          echo ""
          echo "== Provider keys: presence and shape only, never a value =="
          # Without DeepSeek the tutor is live and cannot teach; without Qwen no
          # minor's session starts at all (/ORACLE.md §16).
          for svc in coursegen littlefounders-backend; do
            echo "-- $svc"
            railway variable list --service "$svc" --environment "$ENVIRONMENT" --json 2>/dev/null \
              | jq -r 'to_entries
                       | map(select(.key | test("DEEPSEEK_API_KEY|QWEN_API_KEY|INTERNAL_API_KEY|REDIS_URL|ORACLE_|TUTOR_|FILEBASE_")))
                       | sort_by(.key)
                       | map("   \(.key): " + (
                           if ((.value // "") | length) == 0 then "EMPTY"
                           elif (.value | test("replace|placeholder|example|fake";"i")) then "PLACEHOLDER"
                           else "configured" end))
                       | .[]' \
              || echo "   could not read variables"
          done

      # ── PROBE — what this token is actually allowed to do ────────────────
      # `railway add` failed with "Project not found" while `railway status`
      # and `railway variable list` worked in the same job, which means the
      # question is not connectivity but AUTHORITY: a Railway project token
      # carries a project context for reading and deploying, and creating a
      # service may simply not be within it. Guessing costs a dispatch each
      # time, so this step asks the CLI directly and prints nothing secret.
      - name: Probe the CLI's authority
        if: inputs.step == 'probe'
        run: |
          set -uo pipefail

          echo "== whoami =="
          railway whoami 2>&1 | head -5 || true

          echo ""
          echo "== project identity (ids are not secrets; tokens are) =="
          railway status --environment "$ENVIRONMENT" --json > status.json 2>status.err || cat status.err
          jq -r '{id, name} | "project \(.name)  id=\(.id)"' status.json 2>/dev/null || echo "no id in payload"
          jq -r '.environments.edges[]?.node | "environment \(.name)  id=\(.id)"' status.json 2>/dev/null || true

          echo ""
          echo '== what does railway add actually accept in this version? =='
          railway add --help 2>&1 | head -40 || true

          echo ""
          echo '== and railway link? =='
          railway link --help 2>&1 | head -30 || true

          echo ""
          echo "== may the token create a service? =="
          # Probed with the REAL name on purpose. If the answer is yes, the
          # probe IS the provision and nothing is left behind to clean up; if
          # it is no, we learn exactly that. </dev/null so the CLI cannot fall
          # back to its prompt and hang the job waiting for a human.
          railway add --service oracle </dev/null 2>&1 | head -20 || true

          echo ""
          echo "== did it appear? =="
          railway status --environment "$ENVIRONMENT" --json 2>/dev/null \
            | jq -r --arg env "$ENVIRONMENT" '
                [.environments.edges[]? | select(.node.name == $env)
                 | .node.serviceInstances.edges[]?.node.serviceName]
                | if index("oracle") then "YES — oracle exists now" else "NO — oracle still absent" end' \
            || echo "could not re-read status"

      # ── MIGRATE — mutates the production database ────────────────────────
      - name: Apply pending migrations
        if: inputs.step == 'migrate'
        run: |
          set -euo pipefail
          echo "== Dry run first: the pending list must be exactly what is expected =="
          bash database/scripts/railway-migrate.sh --dry-run
          echo ""
          echo "== Applying =="
          bash database/scripts/railway-migrate.sh --confirm-production

      # ── PROVISION — creates the service and sets variables ───────────────
      #
      # IDEMPOTENT IN THE STRONG SENSE: running it twice must not change
      # anything that is already correct. That matters most for the two shared
      # secrets. Regenerating them on every run would rotate a live pairing,
      # and because variables are staged with --skip-deploys, Core and Oracle
      # would pick up the new value at whatever moment each next redeploys —
      # so every tutor session between those two moments fails on a signature
      # that does not verify. They are therefore generated ONLY when absent.
      - name: Provision the oracle service
        if: inputs.step == 'provision'
        run: |
          set -uo pipefail
          # GitHub runs `bash -e` whatever the script says, so an expected
          # non-zero — `railway add` on a service that already exists, or a
          # `[ -n "$X" ] && …` guard that is simply false — would abandon the
          # step halfway through, leaving the service configured in part. That
          # is exactly how the first attempt at this step created `oracle` and
          # then set none of its variables. Failures are collected explicitly
          # below instead.
          set +e

          FAILED=0

          service_exists() {
            railway status --environment "$ENVIRONMENT" --json 2>/dev/null \
              | jq -e --arg env "$ENVIRONMENT" '
                  [.environments.edges[]? | select(.node.name == $env)
                   | .node.serviceInstances.edges[]?.node.serviceName]
                  | index("oracle") != null' >/dev/null 2>&1
          }

          if service_exists; then
            echo "oracle already exists — updating variables only"
          else
            echo "Creating the oracle service"
            # </dev/null: `railway add` falls back to an interactive picker and
            # would otherwise read the job's own arguments as answers to it.
            railway add --service oracle </dev/null 2>&1 | sed 's/^/   /'
            # Trust the project, not the exit code. `railway add` reports
            # failure for reasons that include "it worked, and then something
            # else did not" — which is how the service came to exist at all,
            # created by a run that ended in error.
            if service_exists; then
              echo "   oracle exists now"
            else
              echo "::error::could not create the oracle service"
              exit 1
            fi
          fi

          read_var() {
            railway variable list --service "$1" --environment "$ENVIRONMENT" --json 2>/dev/null \
              | jq -r --arg k "$2" '.[$k] // ""'
          }

          set_var() {
            if railway variable set --service "$1" --environment "$ENVIRONMENT" --skip-deploys "$2=$3" >/dev/null 2>&1; then
              echo "   set $1/$2"
            else
              echo "::error::failed to set $1/$2"
              FAILED=$((FAILED + 1))
            fi
          }

          CORE_KEY="$(read_var littlefounders-backend INTERNAL_API_KEY)"
          DEPOT_KEY="$(read_var filebase INTERNAL_API_KEY)"
          REDIS="$(read_var littlefounders-backend REDIS_URL)"

          # The provider keys are NOT a manual step. `step=inspect` confirmed on
          # 2026-08-21 that coursegen already holds a real DEEPSEEK_API_KEY and a
          # real QWEN_API_KEY, and Oracle wants the same two accounts Forge uses
          # — same vendor, same billing, same rotation. Copying them is what an
          # operator would do by hand, minus the trip through a clipboard.
          MODEL_KEY="$(read_var coursegen DEEPSEEK_API_KEY)"
          JUDGE_KEY="$(read_var coursegen QWEN_API_KEY)"

          if [ -z "$CORE_KEY" ]; then
            echo "::error::could not read Core's INTERNAL_API_KEY — Oracle cannot call Core without it"
            exit 1
          fi

          # ── the two shared secrets ────────────────────────────────────────
          # Each is ONE value that must be identical on both services. Reuse
          # whatever is already there, generate only what is missing, and if
          # the two sides disagree regenerate both — a mismatched pair is not
          # a state worth preserving.
          #
          # GENERATED HERE, ON PURPOSE: straight from /dev/urandom into
          # Railway, never touching a machine, a log or a file. `tr -d` strips
          # base64 padding and the newline so the value is safe as a KEY=VALUE
          # argument and needs no quoting downstream.
          ORACLE_SVC_KEY="$(read_var oracle INTERNAL_API_KEY)"
          CORE_SVC_KEY="$(read_var littlefounders-backend ORACLE_INTERNAL_KEY)"
          if [ -n "$ORACLE_SVC_KEY" ] && [ "$ORACLE_SVC_KEY" = "$CORE_SVC_KEY" ]; then
            SERVICE_KEY="$ORACLE_SVC_KEY"
            echo "service key: already paired, left alone"
          else
            SERVICE_KEY="$(openssl rand -base64 32 | tr -d '\n=+/')"
            if [ -n "$ORACLE_SVC_KEY$CORE_SVC_KEY" ]; then
              echo "::warning::the Core and Oracle service keys did not match — regenerating both"
            fi
            echo "service key: generated"
          fi

          ORACLE_SESSION="$(read_var oracle TUTOR_SESSION_SECRET)"
          CORE_SESSION="$(read_var littlefounders-backend TUTOR_SESSION_SECRET)"
          if [ -n "$ORACLE_SESSION" ] && [ "$ORACLE_SESSION" = "$CORE_SESSION" ]; then
            SESSION_SECRET="$ORACLE_SESSION"
            echo "session secret: already paired, left alone"
          else
            SESSION_SECRET="$(openssl rand -base64 48 | tr -d '\n=+/')"
            if [ -n "$ORACLE_SESSION$CORE_SESSION" ]; then
              echo "::warning::the Core and Oracle session secrets did not match — regenerating both"
            fi
            echo "session secret: generated"
          fi

          echo "-- oracle"
          set_var oracle INTERNAL_API_KEY "$SERVICE_KEY"
          set_var oracle TUTOR_SESSION_SECRET "$SESSION_SECRET"
          set_var oracle CORE_URL "http://littlefounders-backend.railway.internal:4000"
          set_var oracle CORE_INTERNAL_KEY "$CORE_KEY"
          set_var oracle DEPOT_URL "http://filebase.railway.internal:4006"
          set_var oracle NODE_ENV "production"
          set_var oracle PORT "4009"
          # Voice stays OFF until the data-processing agreement exists
          # (/LEGAL/AI_TUTOR_LEGAL_REVIEW.md §6). The tutor is complete without
          # it: captioned, typed, graded, replayable.
          set_var oracle VOICE_PROVIDER "none"
          set_var oracle TUTOR_VOICE_FOR_MINORS "false"

          if [ -n "$DEPOT_KEY" ]; then
            set_var oracle DEPOT_INTERNAL_KEY "$DEPOT_KEY"
          else
            echo "::warning::filebase has no INTERNAL_API_KEY to copy — Oracle cannot store session audio"
          fi
          if [ -n "$REDIS" ]; then
            set_var oracle REDIS_URL "$REDIS"
          else
            echo "::warning::no REDIS_URL to copy — Oracle falls back to its in-memory rate limiter"
          fi

          # Each of these has a distinct, stated consequence if absent, so each
          # gets its own error rather than a shared "some keys are missing".
          if [ -n "$MODEL_KEY" ]; then
            set_var oracle MODEL_API_KEY "$MODEL_KEY"
          else
            echo "::error::coursegen has no DEEPSEEK_API_KEY to copy — Oracle would come up live and unable to teach"
            FAILED=$((FAILED + 1))
          fi
          if [ -n "$JUDGE_KEY" ]; then
            set_var oracle JUDGE_API_KEY "$JUDGE_KEY"
          else
            echo "::error::coursegen has no QWEN_API_KEY to copy — no minor's session can start without the moderation judge"
            FAILED=$((FAILED + 1))
          fi

          echo "-- littlefounders-backend"
          set_var littlefounders-backend ORACLE_URL "http://oracle.railway.internal:4009"
          set_var littlefounders-backend ORACLE_INTERNAL_KEY "$SERVICE_KEY"
          set_var littlefounders-backend TUTOR_SESSION_SECRET "$SESSION_SECRET"
          set_var littlefounders-backend FILEBASE_URL "http://filebase.railway.internal:4006"
          if [ -n "$DEPOT_KEY" ]; then
            set_var littlefounders-backend FILEBASE_INTERNAL_KEY "$DEPOT_KEY"
          fi

          echo ""
          if [ "$FAILED" -gt 0 ]; then
            echo "::error::$FAILED variable(s) could not be set — re-dispatch step=provision once the cause is fixed"
            exit 1
          fi
          echo "provision OK"
          echo ""
          echo "NEXT: merge the tutor PR so oracle CI -> oracle CD gives the"
          echo "service its first deployment, then dispatch step=domain."
          echo ""
          echo "STILL NEEDED BY HAND — this workflow cannot invent them, and"
          echo "each is an owner decision rather than a missing value:"
          echo "  oracle/INWORLD_API_KEY        the production Inworld credential"
          echo "  oracle/VOICE_PROVIDER=inworld flip only once the DPA is signed"
          echo "  the twelve INWORLD_VOICE_<CHARACTER>_<LOCALE> ids, from"
          echo "  'npm run voices:clone' against audiogen/src/samples (owner-held)"

      # ── DOMAIN — the browser opens a websocket straight to Oracle ────────
      - name: Give oracle a public domain
        if: inputs.step == 'domain'
        run: |
          set -uo pipefail
          # Same reason as the provision step: GitHub runs `bash -e` whatever
          # this says, and half of what follows is allowed to fail. A `grep`
          # that finds nothing is the ordinary "no domain yet" answer, not a
          # reason to abandon the job before it can report that.
          set +e

          echo "== Existing domains =="
          railway domain list --service oracle </dev/null 2>&1 | head -20

          echo ""
          echo "== Ensuring a Railway-provided domain =="
          # </dev/null so the CLI cannot drop into its prompt and hold the job
          # open until the 25-minute timeout.
          railway domain --service oracle </dev/null 2>&1 | tee domain.txt

          # `|| true` INSIDE the substitution: without it a grep that matches
          # nothing makes the assignment itself non-zero, and the step dies on
          # the one branch it exists to report.
          HOST="$(grep -oE '[a-z0-9-]+\.up\.railway\.app' domain.txt | head -1 || true)"
          if [ -n "$HOST" ]; then
            echo ""
            echo "Public host: $HOST"
            if railway variable set --service littlefounders-backend --environment "$ENVIRONMENT" \
                 --skip-deploys "ORACLE_PUBLIC_URL=https://$HOST" >/dev/null 2>&1; then
              echo "   set littlefounders-backend/ORACLE_PUBLIC_URL"
            else
              echo "::error::could not set ORACLE_PUBLIC_URL — the browser would be told to open a websocket to localhost"
              exit 1
            fi

            echo ""
            echo "== Is it answering? =="
            # The first deploy can still be starting; this is a report, not a
            # gate, so it never fails the step. `step=verify` is the gate.
            for attempt in 1 2 3 4 5 6; do
              code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "https://$HOST/health" || true)"
              echo "   attempt $attempt: HTTP $code"
              [ "$code" = "200" ] && break
              sleep 10
            done
            curl -s --max-time 10 "https://$HOST/health" || true
            echo ""
          else
            echo "::error::no domain host parsed — Oracle has no public address and the tutor cannot open a socket"
            exit 1
          fi

          echo ""
          echo "The convention for a custom domain is tutor-b2c.littlefounders.ai;"
          echo "add it in the dashboard and update ORACLE_PUBLIC_URL to match."

      # ── VERIFY — read-only ───────────────────────────────────────────────
      - name: Preflight
        if: inputs.step == 'verify'
        run: bash agent/tools/railway-preflight.sh "$ENVIRONMENT"

      - name: Reach Oracle the way Core reaches it
        if: inputs.step == 'verify'
        run: |
          set -uo pipefail
          set +e

          # The preflight above proves the two services are CONFIGURED to find
          # each other. It cannot prove they can. ORACLE_URL points at Railway
          # private networking, which is a different network from the public
          # domain the browser uses and is reachable from nowhere else — so the
          # only honest test is to stand inside Core and call.
          #
          # This matters because the failure is invisible from outside: both
          # services stay healthy on their own /health, the learner presses the
          # button, and Core reports that the tutor is unavailable with nothing
          # anywhere naming a network as the reason.
          echo "== From inside Core: GET http://oracle.railway.internal:4009/health =="
          out="$(railway ssh --service littlefounders-backend -i ~/.ssh/railway_key -- \
                  curl -s --max-time 10 http://oracle.railway.internal:4009/health 2>&1)"
          echo "$out" | sed 's/^/   /'

          if printf '%s' "$out" | grep -q '"service":"oracle"'; then
            echo "OK: Core can reach Oracle over private networking"
          else
            echo "::error::Core cannot reach Oracle at ORACLE_URL — every tutor session would fail at the door"
            exit 1
          fi

          echo ""
          echo "== And the public address the BROWSER is handed =="
          # Read back what Core will actually send to the client, rather than
          # what this workflow believes it set.
          PUBLIC="$(railway variable list --service littlefounders-backend --environment "$ENVIRONMENT" --json 2>/dev/null \
                    | jq -r '.ORACLE_PUBLIC_URL // ""')"
          if [ -z "$PUBLIC" ]; then
            echo "::error::ORACLE_PUBLIC_URL is unset — the browser would be told to open a websocket to localhost"
            exit 1
          fi
          case "$PUBLIC" in
            *localhost*|*127.0.0.1*)
              echo "::error::ORACLE_PUBLIC_URL is $PUBLIC — that is this container, not the tutor"
              exit 1
              ;;
          esac
          echo "   $PUBLIC"
          code="$(curl -s -o body.txt -w '%{http_code}' --max-time 15 "$PUBLIC/health" || true)"
          echo "   HTTP $code"
          sed 's/^/   /' body.txt
          echo ""
          [ "$code" = "200" ] || { echo "::error::the public tutor address does not answer"; exit 1; }

          echo ""
          echo "== The internal API must refuse an unauthenticated caller =="
          # A public domain on an internal-key service is the fourth §1.5
          # exception, granted for the learner's websocket ONLY. If the REST
          # surface behind that same domain answered without a key, the
          # exception would have quietly become an open door.
          code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 -X POST "$PUBLIC/api/v1/tutor/sessions" || true)"
          echo "   POST /api/v1/tutor/sessions with no key -> HTTP $code"
          case "$code" in
            401|403) echo "OK: refused" ;;
            *) echo "::error::expected 401/403, got $code — the internal API is answering strangers"; exit 1 ;;
          esac

          echo ""
          echo "verify OK"
