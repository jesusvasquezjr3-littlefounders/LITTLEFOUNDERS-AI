name: Docs CI

on:
  pull_request:
    paths: ['docs/**', '*.md', 'scripts/check-docs.mjs']
  push:
    branches: [main]
    paths: ['docs/**', '*.md', 'scripts/check-docs.mjs']

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/check-docs.mjs
