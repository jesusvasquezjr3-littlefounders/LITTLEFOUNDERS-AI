name: Lesson Factory CI

# Gate determinista del Lesson Factory v2.
# BLOQUEA contenido NUEVO/generado que falle los hard-fails (esquema, abstracción,
# vocabulario, content_quality). El corpus legado se reporta como advisory (tiene
# defectos conocidos que se corrigen en la regeneración).

on:
  push:
    paths:
      - 'backend/lesson_factory/**'
      - '.github/workflows/lesson-factory-ci.yml'
  pull_request:
    paths:
      - 'backend/lesson_factory/**'

jobs:
  factory-gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/lesson_factory
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: pip install "pydantic>=2"

      - name: Taxonomía de conceptos es un DAG válido
        run: python3 schema/check_taxonomy.py

      - name: Esquema LessonV2 importa y exporta JSON Schema
        run: python3 schema/lesson_v2.py --export-schema /tmp/lesson_v2.schema.json

      - name: GATE (bloqueante) sobre contenido generado/de prueba
        run: python3 gate.py "pilot_v2/*.json" "test_lessons/*.json"

      - name: Tipos TS del frontend están sincronizados con el registro
        run: |
          python3 schema/gen_frontend_types.py
          if ! git diff --quiet -- ../../frontend/src/components/lessons/engine/generated/; then
            echo "::error::Los tipos TS generados están desincronizados. Corre: python3 backend/lesson_factory/schema/gen_frontend_types.py"
            git --no-pager diff -- ../../frontend/src/components/lessons/engine/generated/
            exit 1
          fi

      - name: Corpus legado (advisory, no bloquea)
        continue-on-error: true
        run: python3 schema/lesson_v2.py --validate-corpus
