name: frontend CI

on:
  push:
    branches: [main, littlefounders_v2]
    paths:
      - 'frontend/**'
      - 'database/types/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - 'database/types/**'
      - '.github/workflows/frontend-ci.yml'

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run type-check
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: i18n key parity
        working-directory: .
        run: bash agent/tools/check-i18n.sh
      # Asset gates — no browser, seconds each, so they belong in the fast job.
      # verify:rig proves no animation clip drags a character out of its own
      # stance; verify:placement proves every character stands on walkable
      # ground, inside the rim, facing the learner. Both were honour-system.
      #
      # verify:placement reads the island and character .glb files out of
      # public/scenes/, which is gitignored — so it needs hydrating first. Depot
      # already serves exactly those files world-readable and CONTENT-ADDRESSED,
      # so scenes:fetch downloads the 5.7 MB the committed manifest names and
      # checks each body's sha256 against the filename it was served under. That
      # is also the more honest subject than a local export: these are the bytes
      # a learner's browser actually downloads.
      #
      # verify:rig is NOT here, and that is deliberate — `scripts/verify-rig.mjs`
      # says so twice in its own source. It reads the ~173 MB of uncompressed
      # artist exports in /glb/, which live outside the repo by design and are
      # published nowhere fetchable. It was wired into this job once anyway and
      # could only ever fail: it refused ("never reports success on an empty
      # run", which is the right instinct) and took the frontend deploy down
      # with it. It stays a LOCAL gate; README's testing table is where a
      # contributor is told to run it.
      - run: npm run scenes:fetch
      - run: npm run verify:placement

  # ── The browser gates ───────────────────────────────────────────────────────
  #
  # THE REASON THIS JOB EXISTS. On 2026-09-04 a single wrong `to=` in the /learn
  # chapter list pointed every lesson at a route that does not exist. React
  # Router matched nothing, rendered nothing, and the owner's main screen was a
  # blank page for SEVEN DAYS — through type-check, lint, 1,800 unit tests and a
  # green build, because none of them opens the app and presses anything.
  #
  # verify:lesson-engine does: 57 fixtures driven with real pointer events, every
  # control hit-tested with elementFromPoint (element.click() does no hit-testing,
  # which is how a full-viewport canvas once swallowed the whole product while
  # every audit stayed green). It is the only gate that would have caught it.
  #
  # verify:tutor-ui is here for the same reason on the Tutor's side: it sweeps
  # every whiteboard instrument and affordance for reachability, and it was
  # equally honour-system.
  #
  # Their own job because together they take ~38 minutes, and `needs: ci` so a
  # push that fails type-check does not also pay for them.
  browser-gates:
    needs: ci
    runs-on: ubuntu-latest
    # ~20 min for lesson-engine, ~8 for tutor-ui, ~10 for a11y, measured on a
    # developer machine; runners are slower and a timeout kill reads as a
    # product failure rather than a slow one.
    timeout-minutes: 60
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # ubuntu-latest ships Chrome at /usr/bin/google-chrome, which is already
      # in browser.mjs's candidate list; naming it makes a runner image change
      # fail loudly here instead of somewhere deep in the run.
      - name: Lesson Engine — every control reachable, every lesson starts
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: npm run verify:lesson-engine
      - name: Tutor UI — every instrument and affordance reachable
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: npm run verify:tutor-ui
      # WCAG A/AA across all 8 stage phases, both themes, desktop and mobile.
      # A kid using a screen reader is the one learner who cannot tell us the
      # product is broken, so this is the gate with the quietest failure mode.
      - name: Tutor a11y — zero WCAG A/AA violations
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: npm run verify:tutor-a11y
