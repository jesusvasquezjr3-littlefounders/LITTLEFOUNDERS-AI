name: Quarterly Block B reviews

# Appendix C Part 1.3 (Threshold Recalibration Log: "every threshold reviewed
# at least once per defined cadence (proposed: quarterly for the first year,
# then per major release)"; Age-Band Register Differentiation Audit:
# "scheduled manual audit (quarterly, proposed)") and Part 3 Stage 6
# (Post-Launch Recalibration, on the log's cadence).
#
# Two triggers, as for the Block D reviews:
#   - per release: agent/tools/release-readiness.sh runs
#     check-block-b-thresholds.mjs --strict, which fails while either review
#     is past the due date docs/operations/BLOCK-B-THRESHOLD-LOG.md states
#     (agent/tools/block-b-review-cadence.mjs; the register audit also counts
#     a signed release audit that judged MN-03 in the dark-pattern record);
#   - per calendar quarter (THIS workflow): on 1 January, April, July and
#     October it opens the quarter's issue, labelled `block-b-review`, listing
#     both reviews with their owners (the Pedagogical Lead with Product and
#     the content team; the Pedagogical Lead with Product), the last human
#     review and the next due date.
#
# Nothing is read from Core or production: the schedule lives in the repo's
# records. A malformed record still opens the issue (the reviews are due
# regardless) and turns the run red.
#
# agent/tools/block-b-reviews-quarterly.test.mjs pins the schedule, the tool
# call and the notification.

on:
  schedule:
    - cron: '0 9 1 1,4,7,10 *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  open-reviews:
    name: Open the quarter's Block B reviews
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Write the review issue
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node agent/tools/block-b-reviews-quarterly.mjs --issue-file issue.md --title-file title.txt

      - name: Open the review issue for the owners
        if: always() && hashFiles('issue.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          title=$(cat title.txt)
          existing=$(gh issue list --state open --label block-b-review --search "\"$title\" in:title" --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "${existing:-}" ]; then
            gh issue comment "$existing" --body-file issue.md
          else
            gh label create block-b-review --color 0E8A16 --description 'Appendix C quarterly Block B reviews' 2>/dev/null || true
            gh issue create --title "$title" --label block-b-review --body-file issue.md
          fi
