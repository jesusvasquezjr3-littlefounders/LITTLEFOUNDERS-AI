name: oracle CI

on:
  push:
    branches: [main, littlefounders_v2]
    paths:
      - 'oracle/**'
      - '.github/workflows/oracle-ci.yml'
  pull_request:
    paths:
      - 'oracle/**'
      - '.github/workflows/oracle-ci.yml'


jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: oracle
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: oracle/package-lock.json
      - run: npm ci
      - run: npm run type-check
      - run: npm run lint
      - run: npm run build
