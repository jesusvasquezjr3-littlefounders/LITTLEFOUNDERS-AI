name: email-server CD

# Token-based deploy (no native GitHub↔Railway connection), mirroring the other
# services. Fires after "email-server CI" succeeds on main.
#
# GATED: the deploy job only runs when the repository variable
# EMAIL_SERVER_LIVE == 'true'. Until Courier's Railway service exists and its
# SMTP relay credentials (Brevo) are set (the "wiring" step), the job is SKIPPED (neutral,
# not failed), so this workflow never red-flags main before the service is ready. Flip the variable to
# 'true' as the last wiring step to activate continuous deploys.
on:
  workflow_run:
    workflows: ["email-server CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    # Only a push to this repository's main deploys. `workflow_run` also fires for the CI run of a pull
    # request, and its `branches` filter matches the name of a fork's branch, so without these two
    # checks a fork's branch called "main" would be built and deployed with the deploy token.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      vars.EMAIL_SERVER_LIVE == 'true'
    name: Deploy email-server (Courier) to Railway
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Install Railway CLI
        run: npm i -g @railway/cli@5.43.1
      - name: Deploy email-server to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up email-server --path-as-root --service email-server --ci
