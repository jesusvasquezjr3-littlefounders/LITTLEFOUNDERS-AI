version: '3.8'

services:
  # Base de datos PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: littlefounders-db
    environment:
      POSTGRES_USER: ${DB_USER:-littlefounders}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      POSTGRES_DB: ${DB_NAME:-littlefounders_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - littlefounders-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U littlefounders"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: littlefounders-backend
    environment:
      DATABASE_URL: postgresql://${DB_USER:-littlefounders}:${DB_PASSWORD:-changeme}@db:5432/${DB_NAME:-littlefounders_db}
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-here-change-in-production}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - littlefounders-network
    volumes:
      - ./backend:/app/backend
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # Frontend (Nginx sirviendo los archivos estáticos)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: littlefounders-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - littlefounders-network

networks:
  littlefounders-network:
    driver: bridge

volumes:
  postgres_data:

