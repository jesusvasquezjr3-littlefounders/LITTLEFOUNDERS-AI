<style>
        /* Claymorphism Base Classes */
        .clay-card {
            background-color: #f7f9fb; /* surface */
            border-radius: 1.75rem; /* 3xl */
            box-shadow: 
                16px 16px 32px rgba(53, 37, 205, 0.05), /* Outer Shadow */
                inset 4px 4px 8px rgba(255, 255, 255, 0.8), /* Inner Highlight */
                inset -6px -6px 12px rgba(0, 0, 0, 0.04); /* Inner Shadow */
            transition: all 0.2s ease;
        }

        .clay-button-primary {
            background-color: #3525cd; /* primary */
            border-radius: 9999px; /* full */
            color: #ffffff; /* on-primary */
            border-bottom: 4px solid #0f0069; /* on-primary-fixed */
            box-shadow: 
                8px 8px 16px rgba(53, 37, 205, 0.2), /* Outer Shadow */
                inset 2px 2px 4px rgba(255, 255, 255, 0.3), /* Inner Highlight */
                inset -4px -4px 8px rgba(0, 0, 0, 0.2); /* Inner Shadow */
            transition: all 0.1s ease;
        }
        
        .clay-button-primary:hover {
            box-shadow: 
                12px 12px 24px rgba(53, 37, 205, 0.25), /* Outer Shadow */
                inset 2px 2px 4px rgba(255, 255, 255, 0.4), /* Inner Highlight */
                inset -4px -4px 8px rgba(0, 0, 0, 0.25); /* Inner Shadow */
            transform: translateY(-2px);
        }

        .clay-button-primary:active {
            border-bottom-width: 0px;
            transform: translateY(4px);
            box-shadow: 
                4px 4px 8px rgba(53, 37, 205, 0.1), /* Outer Shadow */
                inset 4px 4px 8px rgba(0, 0, 0, 0.3); /* Inner Shadow */
        }

        .clay-button-secondary {
            background-color: #eceef0; /* surface-container */
            border-radius: 9999px; /* full */
            color: #191c1e; /* on-surface */
            border-bottom: 4px solid #d8dadc; /* surface-dim */
            box-shadow: 
                8px 8px 16px rgba(0, 0, 0, 0.05),
                inset 2px 2px 4px rgba(255, 255, 255, 0.8),
                inset -4px -4px 8px rgba(0, 0, 0, 0.05);
            transition: all 0.1s ease;
        }

        .clay-button-secondary:active {
            border-bottom-width: 0px;
            transform: translateY(4px);
            box-shadow: 
                4px 4px 8px rgba(0, 0, 0, 0.02),
                inset 4px 4px 8px rgba(0, 0, 0, 0.1);
        }

        .clay-input {
            background-color: #f7f9fb; /* surface */
            border-radius: 1rem;
            box-shadow: 
                inset 6px 6px 12px rgba(0, 0, 0, 0.06),
                inset -4px -4px 8px rgba(255, 255, 255, 0.8);
            border: none;
        }
        
        .clay-input:focus {
             outline: none;
             box-shadow: 
                inset 8px 8px 16px rgba(53, 37, 205, 0.1),
                inset -4px -4px 8px rgba(255, 255, 255, 0.8);
        }

        .clay-option {
            background-color: #ffffff; /* surface-container-lowest */
            border-radius: 1.25rem;
            box-shadow: 
                8px 8px 16px rgba(0, 0, 0, 0.03),
                inset 2px 2px 4px rgba(255, 255, 255, 1),
                inset -4px -4px 8px rgba(0, 0, 0, 0.02);
            transition: all 0.2s ease;
            border: 2px solid transparent;
            cursor: pointer;
        }
        
        .clay-option:hover {
            transform: translateY(-2px);
            box-shadow: 
                12px 12px 24px rgba(0, 0, 0, 0.05),
                inset 2px 2px 4px rgba(255, 255, 255, 1),
                inset -4px -4px 8px rgba(0, 0, 0, 0.02);
        }

        .clay-option.selected {
            background-color: #e2dfff; /* primary-fixed */
            border-color: #3525cd; /* primary */
            box-shadow: 
                inset 4px 4px 8px rgba(255, 255, 255, 0.6),
                inset -4px -4px 8px rgba(53, 37, 205, 0.1);
            transform: translateY(2px);
        }
        
        .clay-dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background-color: #eceef0;
            box-shadow: 
                inset 2px 2px 4px rgba(0,0,0,0.1),
                inset -2px -2px 4px rgba(255,255,255,0.8);
        }
        
        .clay-dot.answered {
            background-color: #c3c0ff; /* inverse-primary */
        }
        
        .clay-dot.current {
            background-color: #3525cd; /* primary */
            transform: scale(1.2);
            box-shadow: 
                4px 4px 8px rgba(53,37,205,0.3),
                inset 2px 2px 4px rgba(255,255,255,0.4);
        }
        
        .clay-dot.flagged {
            background-color: #ffb695; /* tertiary-fixed-dim */
        }

    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md text-body-md overflow-x-hidden selection:bg-primary-fixed selection:text-on-primary-fixed">

<!-- Action Buttons -->
<div class="w-full flex justify-between items-center px-2">

            </button>

                <span class="material-symbols-outlined">chevron_right</span>
</button>

<script>
        // Simple timer logic for demonstration
        let timeRemaining = 24 * 60 + 35; // 24:35 in seconds
        const timerDisplay = document.getElementById('timer-display');

        setInterval(() => {
            if (timeRemaining > 0) {
                timeRemaining--;
                const minutes = Math.floor(timeRemaining / 60);
                const seconds = timeRemaining % 60;
                timerDisplay.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
            }
        }, 1000);
    </script>
