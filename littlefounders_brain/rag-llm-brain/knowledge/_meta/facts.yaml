# facts.yaml — TABLA CANÓNICA DE HECHOS (verdad de base estructurada).  schema: kb-facts-1.0
# ─────────────────────────────────────────────────────────────────────────────
# Ésta es la ÚNICA verdad de las CIFRAS volátiles del cerebro. El LLM NO inventa
# números: los TOMA de aquí (el autor recibe esta tabla inyectada) y el GATE
# (tools/gate_kb.py) COMPARA cada @fact cuyo id exista aquí contra este valor —
# si difiere ⇒ HARD-FAIL. Así la corrección de cifras es DETERMINISTA, no depende
# del consenso de dos LLMs (ver ARCHITECTURE_V3.md §"Ancla de verdad").
#
# CAMPOS DE CONTROL:
#   verified: true|false  → solo los `true` se inyectan al autor y se exigen.
#       false = placeholder/objetivo, en espera de confirmación (update_facts.py / SME).
#   enforce: true|false   → si true (default) el gate COMPARA el valor del @fact contra éste.
#       false = valor compuesto/descriptivo (rangos, condiciones) que el gate NO compara
#       carácter-a-carácter, pero que SÍ se inyecta al autor como información canónica.
#
# FRESCURA: cada hecho lleva volatility + last_verified + effective_to. review_due se deriva
#   de volatility (volatility_policy.yaml). El agente tools/update_facts.py re-verifica SOLO
#   los hechos vencidos con UNA consulta ATÓMICA por hecho y marca para regeneración los
#   docs afectados. Un humano (contador/fiscalista) valida antes de marcar verified.
#
# Esta tabla fue sembrada y verificada el 2026-06-21 con verificación adversarial contra
# fuentes PRIMARIAS (DOF, SAT, LISR/LIVA, INEGI, CONASAMI, Banxico, IRS Rev.Proc/IRB, SSA, Fed).
