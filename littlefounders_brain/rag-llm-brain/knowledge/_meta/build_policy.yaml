# build_policy.yaml — política del pipeline AUTÓNOMO v3 (fact-anchored, Qwen+GLM, breadth-first).
# Ver ARCHITECTURE_V3.md y PLAN_V3_EXECUTION.md. El "stop" global es una CONJUNCIÓN.
#
# CAMBIOS v3 vs v2:
#  · VERDAD DE BASE: _meta/facts.yaml (tabla canónica). El gate compara cifras contra ella.
#  · JUEZ con BÚSQUEDA: GLM (z.ai) — proveedor independiente del autor (Qwen) → errores no
#    correlacionados; SÍ tiene búsqueda web (DeepSeek no la tenía → retirado del rol juez).
#  · BREADTH-FIRST: cubrir TODO el espectro (todas las celdas país×dominio×subdominio) con un
#    baseline ANTES de profundizar. El cerebro vale por su AMPLITUD, no por la profundidad de un tema.
#  · USO SABIO de la API: caché de respuestas, búsqueda solo cuando hace falta, cifras canónicas
#    validadas por código (no se gastan tokens preguntando al juez lo que ya está en facts.yaml).
schema_version: kb-1.0

# ── Metas globales (stop = se cumplen TODAS) ─────────────────────────────────
targets:
  stop_on: coverage           # coverage = parar cuando se cubra TODA la taxonomía a profundidad (NO por MB).
                              #            'size' = parar al alcanzar total_size_mb (modo anterior).
  total_size_mb: 10           # referencia; en modo 'coverage' NO frena la corrida (solo informativo).
  size_safety_cap_mb: 0       # tope DURO de seguridad en MB (0 = sin tope). Evita runaways en coverage.
  require_full_breadth: true  # NO declarar "hecho" mientras queden celdas (país,dominio,subdominio) sin baseline.

# ── BREADTH-FIRST: amplitud antes que profundidad (el corazón de la estrategia v3) ──
breadth:
  enabled: true
  baseline_docs_per_subdomain: 2   # PASS 1: cubrir CADA celda con N docs core (qué es + mecánica/ángulo).
  passes: [2, 4, 8]                # cap de docs/subdominio por pasada; sube SOLO tras cubrir todo el espectro.
  # Interpretación: pasada 1 cubre todo a 2 docs; pasada 2 profundiza a 4 donde haya señal; etc.
  # El stop de tamaño puede cortar en cualquier pasada: primero ancho, luego hondo.

# ── Profundidad por subdominio (techo de la última pasada) ───────────────────
depth:
  min_docs_per_subdomain: 8   # objetivo de profundidad máxima (última pasada)
  min_words_per_doc: 700
  min_cited_facts_per_doc: 4
  min_primary_sources_per_doc: 1
  require_all_applicable_tiers: true

# ── Crítico de completitud (loop-until-dry dentro de cada subdominio/pasada) ──
completeness:
  dry_rounds_to_stop: 2
  max_expansion_rounds: 3
  critic_prompt_hint: >
    Enumera los subtemas, casos, procedimientos y comparativas IMPORTANTES y ENSEÑABLES que falten
    para una buena cobertura de este subdominio (casos borde, trámites paso a paso, errores comunes,
    cambios recientes). Mantente en temas REALMENTE útiles para educación financiera 5-18+; evita
    micro-nichos. Prioriza AMPLITUD y claridad sobre exhaustividad de un solo tema.

# ── Barra de calidad (juez GLM con búsqueda; por debajo => revisar) ──────────
quality_bar:
  factual_accuracy: 5
  country_correctness: 5      # cero fuga de jurisdicción
  pedagogical_scaffolding: 4
  translation_fidelity: 4
  engagement: 4
  max_revise_rounds: 3

# ── Modelos por rol (Qwen autor + GLM juez; ver llm_qwen.py provider_for) ─────
models:
  planner: deepseek-v4-flash  # PLANNER+CRÍTICO = DeepSeek V4 (3er PROVEEDOR indep.) — diseña el currículo
                              # (clave para la AMPLITUD); pool de cuota separado de Qwen/GLM → más velocidad.
  author: qwen-plus-latest    # AUTOR = Qwen-Plus + enable_search (funda en evidencia + web)
  judge: glm-4.6              # JUEZ = GLM (z.ai), PROVEEDOR INDEPENDIENTE + búsqueda web
  verifier: glm-4.6           # mismo cliente que el juez (q_judge usa MODELS['judge'])
  grounding_search: true      # activa búsqueda en autor (qwen) y juez (glm web_search)

# Precios estimados por modelo (USD / 1M tokens) — para el presupuesto en $ (wise_use.budget_usd).
pricing_usd_per_mtok:
  deepseek-v4-flash: { in: 0.28, out: 0.42 }
  deepseek-v4-pro:   { in: 0.55, out: 2.19 }
  qwen-flash:        { in: 0.05, out: 0.40 }
  qwen-plus-latest:  { in: 0.40, out: 1.20 }
  glm-4.6:           { in: 0.60, out: 2.20 }
  glm-5.2:           { in: 1.20, out: 4.10 }

# ── USO SABIO de la API (no consultas tontas) ────────────────────────────────
wise_use:
  cache_llm: true                       # caché content-addressed de respuestas (resume gratis, no re-pagar)
  author_search_when_evidence: false    # si hay evidencia curada, el autor NO busca (ahorra); busca si falta
  facts_table_first: true               # cifras en facts.yaml: las valida el GATE (código), NO el juez
  judge_only_uncanonical_facts: true    # el juez/verificador solo investiga cifras que NO están en facts.yaml
  budget_output_tokens: 0               # 0 = sin tope; >0 = corta al alcanzar ese gasto de salida (autor)
  budget_usd: 0                         # 0 = sin tope; >0 = corta la corrida al alcanzar ese gasto estimado (USD, todos los proveedores)
  alert_usd_remaining: 3                # imprime ALERTA cuando (budget_usd - gasto estimado) < este valor (recarga las APIs)

# ── Cobertura (los dominios/subdominios salen de taxonomy.yaml) ──────────────
coverage:
  countries: [mx, us, shared]   # orden de prioridad para intercalar (jurisdiccional primero)
  shared_domains: [taxes, personal_finance, accounting, economics, investing, entrepreneurship]

# ── Convención de contenido ──────────────────────────────────────────────────
content_conventions:
  require_numeric_example: true
  es_canonical: true
  date_anchor: "2026-06-21"       # fecha "as of" de esta corrida (= last_verified de facts.yaml)

# ── Robustez de la corrida (resume + manejo de errores) ──────────────────────
run:
  checkpoint_every: 1           # persistir estado tras cada doc (reanudable)
  state_file: index/build_state.json   # manifiesto de progreso (resume); index/ está gitignored
  atomic_writes: true           # escribir .tmp y renombrar (un corte no corrompe un doc a medias)
  grounding_backend: hybrid     # evidencia curada (NotebookLM) + qwen_search de respaldo
  notebooklm_optional: true     # si falta evidencia, el autor cae a búsqueda
  continue_on_subdomain_error: true    # un subdominio que falle NO tumba la corrida
