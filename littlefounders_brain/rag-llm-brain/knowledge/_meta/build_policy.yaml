# build_policy.yaml — política del pipeline AUTÓNOMO v4 (RAG-to-write + verificación atómica;
# fact-anchored, DeepSeek planner + Qwen autor + GLM juez/verificador, breadth-first).
# Diseño CANÓNICO: ARCHITECTURE_V4.md · corrida masiva: RUNBOOK_V4.md. El "stop" global es una CONJUNCIÓN.
#
# CAMBIOS v4 vs v3 (claves nuevas): run.rag_to_write + run.evidence_top_k (autor escribe DESDE evidencia
#   recuperada POR-TEMA); quality_bar.atomic_verify + min_factscore + max_unverifiable_rate +
#   min_checkable_for_factscore + atomic_*_blocking (verificación NLI afirmación-por-afirmación, anti-lavado);
#   models.verifier (verificador atómico, cliente con presupuesto contabilizado).
#
# CAMBIOS v3 vs v2:
#  · VERDAD DE BASE: _meta/facts.yaml (tabla canónica). El gate compara cifras contra ella.
#  · JUEZ con BÚSQUEDA: GLM (z.ai) — proveedor independiente del autor (Qwen) → errores no
#    correlacionados; SÍ tiene búsqueda web (DeepSeek no la tenía → retirado del rol juez).
#  · BREADTH-FIRST: cubrir TODO el espectro (todas las celdas país×dominio×subdominio) con un
#    baseline ANTES de profundizar. El cerebro vale por su AMPLITUD, no por la profundidad de un tema.
#  · USO SABIO de la API: caché de respuestas, búsqueda solo cuando hace falta, cifras canónicas
#    validadas por código (no se gastan tokens preguntando al juez lo que ya está en facts.yaml).
schema_version: kb-1.0

# ── Metas globales (stop = se cumplen TODAS) ─────────────────────────────────
targets:
  stop_on: coverage           # coverage = parar cuando se cubra TODA la taxonomía a profundidad (NO por MB).
                              #            'size' = parar al alcanzar total_size_mb (modo anterior).
  total_size_mb: 10           # referencia; en modo 'coverage' NO frena la corrida (solo informativo).
  size_safety_cap_mb: 0       # tope DURO de seguridad en MB (0 = sin tope). Evita runaways en coverage.
  require_full_breadth: true  # NO declarar "hecho" mientras queden celdas (país,dominio,subdominio) sin baseline.

# ── BREADTH-FIRST: amplitud antes que profundidad (el corazón de la estrategia v3) ──
breadth:
  enabled: true
  baseline_docs_per_subdomain: 2   # PASS 1: cubrir CADA celda con N docs core (qué es + mecánica/ángulo).
  passes: [2, 5, 0]                # cap de docs/subdominio por pasada; 0 = SIN tope = cubrir TODO el
                                   # concept_map de la celda (enciclopedia). Primero ancho, luego completo.
  full_step: 8                     # el cap 0 (todo el mapa) se EXPANDE en incrementos de este tamaño
                                   # (p.ej. 13,21,29,37) para checkpointear cobertura/budget entre pasadas.
  # Interpretación: pasada 1 cubre todo a 2 docs; pasada 2 a 5; pasada 3 genera TODOS los temas del mapa
  # (cobertura enciclopédica). El presupuesto $ corta donde toque; lo construido es de calidad plena.

# ── Profundidad por subdominio (techo de la última pasada) ───────────────────
depth:
  min_docs_per_subdomain: 8   # objetivo de profundidad máxima (última pasada)
  min_words_per_doc: 500      # piso de profundidad (validado vs corpus real 444-618 palabras ES; 700 era
                              # infeasible y disparaba revise-loops "doc corto" sobre docs ya buenos)
  min_cited_facts_per_doc: 4
  min_primary_sources_per_doc: 1
  require_all_applicable_tiers: true
  require_fact_when_high_volatility: true   # doc de volatilidad ALTA sin ningún @fact anclado → draft
                                            # (revisión humana): una cifra que cambia cada trimestre
                                            # DEBE estar taggeada, no narrada sin ancla.

# ── Crítico de completitud (loop-until-dry dentro de cada subdominio/pasada) ──
completeness:
  dry_rounds_to_stop: 2
  max_expansion_rounds: 3
  critic_prompt_hint: >
    Enumera los subtemas, casos, procedimientos y comparativas IMPORTANTES y ENSEÑABLES que falten
    para una buena cobertura de este subdominio (casos borde, trámites paso a paso, errores comunes,
    cambios recientes). Mantente en temas REALMENTE útiles para educación financiera 5-18+; evita
    micro-nichos. Prioriza AMPLITUD y claridad sobre exhaustividad de un solo tema.

# ── Barra de calidad (juez GLM con búsqueda; por debajo => revisar) ──────────
quality_bar:
  factual_accuracy: 5
  country_correctness: 5      # cero fuga de jurisdicción
  pedagogical_scaffolding: 4
  translation_fidelity: 4
  engagement: 4
  completeness: 4            # cubre subtemas (qué/cómo/quién/cuándo/excepciones), no solo definición
  worked_example: 4         # ejemplo TRABAJADO con actor nombrado + resultado numérico resuelto
  citation_quality: 4       # cifras apoyadas en fuentes PRIMARIAS rastreables y fechadas
  max_revise_rounds: 3
  # ── v4: VERIFICACIÓN ATÓMICA (anti-lavado) — cada afirmación se verifica por NLI contra la evidencia.
  atomic_verify: true            # activa la etapa atómica en build_topic (añade 1 llamada NLI/verificador por doc)
  min_factscore: 0.80            # fracción mínima de afirmaciones VERIFICABLES que deben estar 'supported'
  max_unverifiable_rate: 0.50    # tasa de afirmaciones (NO ilustrativas) no halladas en la evidencia
  # ── CALIBRACIÓN (Fase 1, RUNBOOK_V4): el ÚNICO disparo DURO por defecto es contradicted>0 (señal FIABLE:
  # la evidencia dice OTRA cosa). factscore y la tasa de no-verificables son RUIDOSAS sobre evidencia top-k
  # léxica (una paráfrasis pedagógica fiel sale 'unverifiable' aunque sea correcta) → bloquean SÓLO con estos
  # flags. Así el gate NO degrada TODO el corpus a draft antes de medir factscore en datos v4 reales; tras la
  # Fase 1 se suben los umbrales/flags con evidencia. Los ejemplos ILUSTRATIVOS no cuentan (atomic_verify.py).
  # ── FASE 1 SMOKE (2026-06-22): factscore MEDIDO = 1.0 (3/3 supported, 0 contradicted) en 1 doc. Tasa de
  # no-verificables = 89% (advisory, esperada por §2.3). NO subir umbrales hasta medir varianza (2-3 docs más).
  min_checkable_for_factscore: 4   # no exigir min_factscore si hay <N afirmaciones verificables (denominador inestable)
  atomic_factscore_blocking: true  # factscore<min bloquea SÓLO si checkable>=min_checkable_for_factscore
  atomic_unverifiable_blocking: false  # tasa de no-verificables = ADVISORY hasta calibrar con datos v4 reales

# ── Modelos por rol (Qwen autor + GLM juez; ver llm_qwen.py provider_for) ─────
models:
  planner: deepseek-v4-flash  # PLANNER+CRÍTICO = DeepSeek V4 (3er PROVEEDOR indep.) — diseña el currículo
                              # (clave para la AMPLITUD); pool de cuota separado de Qwen/GLM → más velocidad.
  author: qwen-plus-latest    # AUTOR = Qwen-Plus + enable_search (funda en evidencia + web)
  judge: glm-4.6              # JUEZ = GLM (z.ai), PROVEEDOR INDEPENDIENTE + búsqueda web
  verifier: glm-4.6           # VERIFICADOR atómico (NLI). HONRADO por build_dataset (_verifier_client) con
                              # cliente PROPIO y presupuesto contabilizado. Por defecto == juez; ponlo en otra
                              # familia (p.ej. deepseek-v4-flash) para independencia real autor≠juez≠verificador.
  grounding_search: true      # activa búsqueda en autor (qwen) y juez (glm web_search)

# Precios estimados por modelo (USD / 1M tokens) — para el presupuesto en $ (wise_use.budget_usd).
pricing_usd_per_mtok:
  deepseek-v4-flash: { in: 0.28, out: 0.42 }
  deepseek-v4-pro:   { in: 0.55, out: 2.19 }
  qwen-flash:        { in: 0.05, out: 0.40 }
  qwen-plus-latest:  { in: 0.40, out: 1.20 }
  glm-4.6:           { in: 0.60, out: 2.20 }
  glm-5.2:           { in: 1.20, out: 4.10 }

# Sobrecargo estimado de BÚSQUEDA WEB por llamada (USD) — se SUMA al costo de tokens (el juez/autor
# pagan por búsqueda además de tokens). Estimación conservadora; ajustar con la factura real.
search_usd_per_call:
  glm: 0.01       # z.ai web_search (search-prime)
  qwen: 0.0       # Alibaba enable_search: incluido/despreciable
  deepseek: 0.0   # sin búsqueda nativa

# ── USO SABIO de la API (no consultas tontas) ────────────────────────────────
wise_use:
  cache_llm: true                       # caché content-addressed de respuestas (resume gratis, no re-pagar)
  author_search_when_evidence: false    # si hay evidencia curada, el autor NO busca (ahorra); busca si falta
  facts_table_first: true               # cifras en facts.yaml: las valida el GATE (código), NO el juez
  judge_only_uncanonical_facts: true    # el juez/verificador solo investiga cifras que NO están en facts.yaml
  verify_source_liveness: true          # verifica que una URL citada RESUELVE antes de darle tier alto
                                        # (anti-fabricación de citas); si no resuelve → tier:tertiary
  budget_output_tokens: 0               # 0 = sin tope; >0 = corta al alcanzar ese gasto de salida (autor)
  # TOPE de gasto estimado POR PROVEEDOR (USD) = RAÍL DE SEGURIDAD, no la condición de STOP (esa es
  # 'coverage'). La corrida se detiene LIMPIA y reanudable cuando CUALQUIER proveedor toca su tope.
  # IMPORTANTE: el autor (qwen) es pay-as-you-go y FACTURA A TARJETA → DEBE tener tope (un runaway sin
  # tope cobra directo). Para un --run de corpus COMPLETO, recarga las 3 APIs y SUBE estos topes a la
  # proyección de costo total (ver DATASET_BUILD_RUNBOOK.md §costos). null = sin tope (lo rechaza --run
  # salvo --i-accept-unbounded-author).
  budget_usd:
    deepseek: 7.5                       # saldo real 8.13 (planner; barato → sobra de margen)
    glm: 9.0                            # saldo real 9.96 (juez+frescura; el proveedor CUELLO DE BOTELLA)
    qwen: 60                            # Alibaba pay-as-you-go (sin saldo prepago): RAÍL anti-runaway sobre
                                        # tarjeta. Súbelo conscientemente para un corpus completo.
  alert_usd_remaining: 3                # ALERTA por proveedor cuando (tope - gasto estimado) < este valor

# ── Embeddings (índice RAG servible) ─────────────────────────────────────────
embedding:
  # Modelo MULTILINGÜE (el corpus es ES+EN). VERIFICADO contra fastembed 0.8.0 (TextEmbedding):
  # 'BAAI/bge-m3' NO está soportado por fastembed dense → fallaba en la primera ejecución real.
  # DEFAULT = mpnet-multilingual (768d, 1GB): SERVIBLE, robusto ES+EN, simétrico (sin prefijos
  # query:/passage: como e5). Fallback ligero si falta disco: '...MiniLM-L12-v2' (384d, 220MB).
  # UPGRADE de mayor techo: 'intfloat/multilingual-e5-large' (1024d, 2.2GB, requiere prefijos
  # query/passage en embed_input/encode_one). NUNCA 'hash' en producción.
  fastembed_model: "sentence-transformers/paraphrase-multilingual-mpnet-base-v2"

# ── Cobertura (los dominios/subdominios salen de taxonomy.yaml) ──────────────
coverage:
  countries: [mx, us, shared]   # orden de prioridad para intercalar (jurisdiccional primero)
  shared_domains: [taxes, personal_finance, accounting, economics, investing, entrepreneurship]

# ── Convención de contenido ──────────────────────────────────────────────────
content_conventions:
  require_numeric_example: true
  es_canonical: true
  date_anchor: "2026-06-21"       # fecha "as of" de esta corrida (= last_verified de facts.yaml)

# ── Robustez de la corrida (resume + manejo de errores) ──────────────────────
run:
  checkpoint_every: 1           # persistir estado tras cada doc (reanudable)
  state_file: index/build_state.json   # manifiesto de progreso (resume); index/ está gitignored
  atomic_writes: true           # escribir .tmp y renombrar (un corte no corrompe un doc a medias)
  grounding_backend: hybrid     # evidencia curada (NotebookLM) + qwen_search de respaldo
  notebooklm_optional: true     # si falta evidencia, el autor cae a búsqueda
  continue_on_subdomain_error: true    # un subdominio que falle NO tumba la corrida
  # ── v4 RAG-to-write: el autor recibe evidencia recuperada POR-TEMA (top-k coseno), no el blob por-dominio.
  rag_to_write: true            # recuperación por-tema (evidence_rag.py); false = blob por-dominio (v3)
  evidence_top_k: 8             # nº de pasajes de evidencia recuperados e inyectados al autor
