# Docker Compose para desarrollo local con PostgreSQL
version: '3.8'

services:
  # Base de datos PostgreSQL para desarrollo
  postgres:
    image: postgres:15
    container_name: littlefounders_postgres
    environment:
      POSTGRES_DB: littlefounders_db
      POSTGRES_USER: littlefounders_user
      POSTGRES_PASSWORD: password123
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - littlefounders_network

  # Adminer para administrar la base de datos
  adminer:
    image: adminer
    container_name: littlefounders_adminer
    ports:
      - "8080:8080"
    networks:
      - littlefounders_network
    depends_on:
      - postgres

volumes:
  postgres_data:

networks:
  littlefounders_network:
    driver: bridge
