[project]
name = "littlefounders-api"
version = "1.0.0"
description = "LittleFounders AI - Plataforma educativa de alfabetización financiera"
requires-python = ">=3.11"

# ── Ruff (Linter) ───────────────────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [".venv", ".git", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E402", "E501", "E701", "E722", "E741", "F402", "N806", "N811", "UP007"]

[tool.ruff.format]
quote-style = "double"

# ── Pytest ──────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# Agrega backend/ (rootdir) a sys.path para que los tests importen `main`,
# `config`, etc. igual que en runtime (uvicorn main:app corre desde backend/).
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "slow: tests that are slow (e.g., external API calls)",
    "smoke: quick health-check tests",
]

# ── Mypy (opcional) ─────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
warn_unused_ignores = true
