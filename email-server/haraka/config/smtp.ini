; Courier (Haraka) listener config.
;
; listen:
;   127.0.0.1:2525  — this machine only. The one sender is the Courier HTTP API
;                     in the same container (SmtpAdapter, nodemailer), which
;                     builds every email from its own templates.
;
; There is NO listener on the private network. Nothing submits mail over SMTP
; from another service: the authentication service hands its codes to Core,
; which asks the HTTP API (signed hook, docs/features/F-002-emails.md). A
; network listener would let any service on the private network send any
; words, from our domain, to anybody, without the internal key. Do not add one.
listen=127.0.0.1:2525

; nodes: number of worker processes. Pin to 1 — Haraka, like Kong's nginx,
; defaults to one worker PER CPU, which is what ballooned the Railway memory
; bill (commit f018f47). Low-volume relay needs exactly one.
nodes=1

; Do not background — the container supervisor owns the process lifecycle.
daemonize=false
