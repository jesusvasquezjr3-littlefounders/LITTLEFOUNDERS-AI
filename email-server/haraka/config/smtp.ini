; Courier (Haraka) listener config.
;
; listen:
;   [::]:587        — IPv6 wildcard on the SMTP submission port. Railway's
;                     private network is IPv6 (<service>.railway.internal), so
;                     this is the address GoTrue (Supabase auth) connects to.
;   127.0.0.1:2525  — localhost only, for the co-located Courier HTTP API's
;                     SmtpAdapter (nodemailer) to submit our own transactional mail.
;
; Both are on the trusted side; outbound is authenticated+encrypted to SES.
listen=[::]:587,127.0.0.1:2525

; nodes: number of worker processes. Pin to 1 — Haraka, like Kong's nginx,
; defaults to one worker PER CPU, which is what ballooned the Railway memory
; bill (RUNBOOK.md, commit f018f47). Low-volume relay needs exactly one.
nodes=1

; Do not background — the container supervisor owns the process lifecycle.
daemonize=false
