; Courier connection config.
;
; Haraka reads this from the `-c` config dir and does NOT fall back to its
; install defaults for it, so it MUST exist here: the connect greeting path
; (connection.js connect_respond) reads the [message] and [uuid] sections and
; crashes if they are absent.

[main]

[headers]
max_lines=1000
max_received=100

[max]
; Max message size (bytes). Auth emails are tiny; 25 MB is generous headroom.
bytes=26214400
mime_parts=1000
line_length=512
data_line_length=992

[message]
; greeting[] left unset → default "<host> ESMTP <info> ready".
helo=Courier at your service.
close=closing connection.

[uuid]
banner_chars=6
deny_chars=0
