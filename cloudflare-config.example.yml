# Cloudflare Tunnel Configuration Example
# Copia este archivo a cloudflare-config.yml y actualiza los valores

# Tu Tunnel ID (obtenlo con: cloudflared tunnel create littlefounders)
tunnel: YOUR-TUNNEL-ID-HERE

# Ruta al archivo de credenciales (se genera automáticamente al crear el túnel)
# Por defecto está en: C:\Users\<TU_USUARIO>\.cloudflared\<TUNNEL-ID>.json
credentials-file: C:\Users\Aetio\.cloudflared\YOUR-TUNNEL-ID.json

# Configuración de ingress - Define qué servicios exponer
ingress:
  # Frontend principal
  # Reemplaza "littlefounders.tudominio.com" con tu dominio real
  - hostname: littlefounders.tudominio.com
    service: http://localhost:80
    originRequest:
      noTLSVerify: true
  
  # API Backend en subdominio
  # Reemplaza "api.tudominio.com" con tu dominio real
  - hostname: api.tudominio.com
    service: http://localhost:8000
    originRequest:
      noTLSVerify: true
  
  # Regla catch-all (OBLIGATORIA - debe ser la última)
  - service: http_status:404

# Configuración opcional de logging
# loglevel: info  # debug | info | warn | error

# NOTAS:
# 1. Después de crear este archivo, configura los registros DNS en Cloudflare:
#    - Tipo: CNAME
#    - Nombre: littlefounders (o el subdominio que uses)
#    - Destino: <TUNNEL-ID>.cfargotunnel.com
#    - Proxy: Activado (naranja)
#
# 2. Para iniciar el túnel con esta configuración:
#    .\cloudflared-windows-amd64.exe tunnel --config cloudflare-config.yml run littlefounders
#
# 3. Para más información:
#    https://developers.cloudflare.com/cloudflare-one/connections/connect-apps/

