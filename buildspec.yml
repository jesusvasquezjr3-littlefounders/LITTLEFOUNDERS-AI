version: 0.2

# Runtime estándar de AWS CodeBuild (Amazon Linux 2)
phases:
  install:
    runtime-versions:
      nodejs: 18
      python: 3.11
    commands:
      - echo "Verificando versiones instaladas..."
      - node --version
      - npm --version
      - python3 --version
      
  pre_build:
    commands:
      - echo "Iniciando pre-build phase..."
      - echo "Build started on `date`"
      
      - echo "Instalando dependencias del frontend..."
      - npm ci
      
      - echo "Instalando dependencias del backend..."
      - cd backend
      - pip3 install --upgrade pip
      - pip3 install -r requirements.txt
      - cd ..
      
  build:
    commands:
      - echo "Iniciando build phase..."
      
      # Build del frontend
      - echo "Construyendo frontend con Vite..."
      - npm run build
      
      # Verificar que el build del frontend fue exitoso
      - |
        if [ ! -d "dist" ]; then
          echo "Error: El directorio dist no fue creado"
          exit 1
        fi
      
      - echo "Frontend construido exitosamente"
      
      # Preparar backend
      - echo "Preparando backend..."
      - cd backend
      
      # Crear archivo de inicio para el backend
      - |
        cat > start.sh << 'EOF'
        #!/bin/bash
        cd backend
        uvicorn main:app --host 0.0.0.0 --port 8000
        EOF
      
      - chmod +x start.sh
      - cd ..
      
      - echo "Build completed on `date`"
      
  post_build:
    commands:
      - echo "Iniciando post-build phase..."
      
      # Crear estructura de artefactos
      - echo "Preparando artefactos para deployment..."
      
      # Copiar archivos necesarios
      - mkdir -p deploy/frontend
      - mkdir -p deploy/backend
      
      - cp -r dist/* deploy/frontend/
      - cp -r backend/* deploy/backend/
      - cp backend/start.sh deploy/ 2>/dev/null || true
      
      # Crear appspec.yml para CodeDeploy (si lo usas)
      - |
        cat > deploy/appspec.yml << 'EOF'
        version: 0.0
        os: linux
        files:
          - source: /
            destination: /var/www/littlefounders
        hooks:
          BeforeInstall:
            - location: scripts/install_dependencies.sh
              timeout: 300
              runas: root
          ApplicationStart:
            - location: scripts/start_application.sh
              timeout: 300
              runas: root
          ApplicationStop:
            - location: scripts/stop_application.sh
              timeout: 300
              runas: root
        EOF
      
      # Crear scripts de deployment
      - mkdir -p deploy/scripts
      
      - |
        cat > deploy/scripts/install_dependencies.sh << 'EOF'
        #!/bin/bash
        set -e
        
        echo "Instalando dependencias del sistema..."
        yum update -y
        yum install -y python3 python3-pip nginx
        
        echo "Instalando dependencias de Python..."
        cd /var/www/littlefounders/backend
        pip3 install -r requirements.txt
        EOF
      
      - |
        cat > deploy/scripts/start_application.sh << 'EOF'
        #!/bin/bash
        set -e
        
        echo "Iniciando aplicación..."
        
        # Configurar Nginx para servir el frontend
        cat > /etc/nginx/conf.d/littlefounders.conf << 'NGINX_CONF'
        server {
            listen 80;
            server_name _;
            
            # Frontend
            location / {
                root /var/www/littlefounders/frontend;
                try_files $uri $uri/ /index.html;
            }
            
            # Backend API
            location /api {
                proxy_pass http://localhost:8000;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection 'upgrade';
                proxy_set_header Host $host;
                proxy_cache_bypass $http_upgrade;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }
        }
        NGINX_CONF
        
        nginx -t
        systemctl restart nginx
        
        # Iniciar backend con systemd
        cat > /etc/systemd/system/littlefounders-backend.service << 'SERVICE_CONF'
        [Unit]
        Description=Little Founders Backend API
        After=network.target
        
        [Service]
        Type=simple
        User=root
        WorkingDirectory=/var/www/littlefounders/backend
        Environment="PATH=/usr/local/bin:/usr/bin:/bin"
        ExecStart=/usr/local/bin/uvicorn main:app --host 0.0.0.0 --port 8000
        Restart=always
        RestartSec=10
        
        [Install]
        WantedBy=multi-user.target
        SERVICE_CONF
        
        systemctl daemon-reload
        systemctl enable littlefounders-backend
        systemctl restart littlefounders-backend
        
        echo "Aplicación iniciada exitosamente"
        EOF
      
      - |
        cat > deploy/scripts/stop_application.sh << 'EOF'
        #!/bin/bash
        set -e
        
        echo "Deteniendo aplicación..."
        systemctl stop littlefounders-backend || true
        systemctl stop nginx || true
        echo "Aplicación detenida"
        EOF
      
      - chmod +x deploy/scripts/*.sh
      
      - echo "Post-build completed on `date`"

artifacts:
  files:
    - '**/*'
  base-directory: deploy
  name: littlefounders-$(date +%Y%m%d-%H%M%S)

cache:
  paths:
    - 'node_modules/**/*'
    - '/root/.npm/**/*'
    - '/root/.cache/pip/**/*'

env:
  variables:
    NODE_ENV: "production"
