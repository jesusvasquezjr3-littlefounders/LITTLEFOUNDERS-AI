schema_version: 1

# Closed vocabulary for the investing course catalog (COURSE_ENGINE.md §3,
# §3.1b). Consumed by Forge (coursegen) as a HARD-FAIL gate: the
# forbidden-vocabulary lists are checked against every generated string
# (titles, concepts, objectives, prompts) for the matching age tier + locale.
#
# PIVOT (WALKTHROUGH 2026-08-12): this course dropped tier2/tier3 (8-12)
# entirely and now targets a single tier4 (12-18) audience — matured
# language, real analogies (contentPlaybook.ts tierReasoningGuidance
# ('tier4')), fewer/longer lessons. The tier3 hard vocabulary ceiling carries
# forward UNCHANGED into tier4 by explicit owner decision: this is a §1.9
# product-safety posture (simulations only, never transactional), not a
# Piaget/age gate — it does not relax for the 16-18 end of the band.

themes: [archipelago, forest, city, valley, kingdom, cosmos]

age_tiers:
  # tier4 (12-18): inversión, interés (simple y compuesto), acciones ("un
  # pedacito de una empresa"), fondo/canasta, índice, riesgo, diversificar,
  # inflación are all fully teachable with real vocabulary — no Piaget
  # ceiling on ordinary investing terms at this age. The words below stay
  # banned regardless of age within the tier: they name techniques with no
  # safe simulation for a minor (borrowed-money exposure, derivatives, short
  # selling, margin, day trading, forex, crypto-as-investment) — a hard
  # ceiling, carried forward unchanged from this course's original tier3.
  #
  # JUDGMENT CALL (documented per AGENTS.md §1.12.6, carried forward from the
  # tier1-3 catalog): "esquema ponzi/pirámide como oportunidad" is
  # deliberately NOT in forbidden_vocabulary — a lexical list can only ban
  # WORDS, not a framing ("presented as an opportunity"). The actual
  # fraud-safety requirement — pirámides/esquemas Ponzi must be NAMEABLE as a
  # danger (the fraud-literacy adventure) but never presented as investable —
  # is enforced by content review (COURSE_ENGINE.md §4 review stage,
  # kid_safety dimension), not by banning the word "pirámide"/"Ponzi"
  # outright, which fraud-literacy lessons must be free to use.
  #
  # A second judgment call, also carried forward: four entries below use a
  # slightly more specific compound phrase than the short form named in the
  # original design brief ("opciones financieras" not bare "opciones";
  # "margen de crédito" not bare "margen") — the bare forms are ordinary
  # words this course's own exercise UI text needs constantly ("elige una
  # opción" in every choice-family segment; "margen" in measurement/layout
  # narration), so banning them outright would make every generated lesson a
  # false-positive vocabulary-gate failure.
  tier4:
    ages: "12-18"
    forbidden_vocabulary:
      es-MX:
        - apalancamiento
        - derivados
        - opciones financieras
        - venta en corto
        - margen de crédito
        - trading intradía
        - forex
        - criptomonedas
      en-US:
        - leverage
        - derivatives
        - financial options
        - short selling
        - margin trading
        - day trading
        - forex
        - cryptocurrency
      pt-BR:
        - alavancagem
        - derivativos
        - opções financeiras
        - venda a descoberto
        - margem de crédito
        - day trade
        - forex
        - criptomoedas

families: [story, choice, input, arrange, money, analyze, storyplay, maker]

# tier4 gets the full 8-family palette — same set tier2/tier3 already used,
# there is nothing left to unlock at an older tier.
family_allowlist_by_tier:
  tier4: [story, choice, input, arrange, money, analyze, storyplay, maker]

type_exceptions:
  # JUDGMENT CALL: `interest_peek` (LESSON_ENGINE.md §5.5, `money` family) is
  # not actually gated out of tier4 anywhere — `money` is already in tier4's
  # family_allowlist above. Named here explicitly (belt-and-suspenders
  # documentation, not a functional unlock) because this course leans on
  # interest_peek's predict-then-watch-it-grow flow as a core mechanic for
  # teaching simple/compound interest concretely.
  tier4_extra_allowed:
    - interest_peek # simple/compound-interest predict->reveal is a core tier4 mechanic

  # tier4 bans no TYPES at all — the only ceiling is the lexical
  # forbidden_vocabulary above (leverage/derivatives/options/short-
  # selling/margin/day-trading/forex/crypto) and the simulations-only,
  # never-transactional posture (COURSE_ENGINE.md §3.1b / AGENTS.md §1.9),
  # which is a pipeline/product invariant, not a catalog vocabulary gate.
  tier4_banned_types: []
