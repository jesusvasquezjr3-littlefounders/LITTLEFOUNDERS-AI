schema_version: 1
adventure:
  position: 8
  slug: el-cosmos-del-inversionista
  theme: cosmos
  age_tier: tier3
  title:
    en-US: The Investor's Cosmos
    es-MX: El Cosmos del Inversionista
    pt-BR: O Cosmos do Investidor
  description:
    en-US: 'The final voyage: Dina and Liruf build their own simulated long-term plan, learn to stay calm when the basket dips, and graduate by teaching their family everything they learned.'
    es-MX: 'El viaje final: Dina y Liruf arman su propio plan simulado de largo plazo, aprenden a mantener la calma cuando la canasta baja, y se gradúan enseñando a su familia todo lo aprendido.'
    pt-BR: 'A viagem final: Dina e Liruf montam seu próprio plano simulado de longo prazo, aprendem a manter a calma quando a cesta cai, e se formam ensinando à família tudo o que aprenderam.'
  narrative_arc: Dina y Liruf llegan al cosmos, el mundo final de su viaje de inversión, donde Dr. Rho los recibe como su mentor de toda la travesía para ayudarles a armar su propio plan de largo plazo, con una meta clara, un plan de cinco pasos, y la calma para no entrar en pánico cuando algo baja. Zara Vex regresa para poner a prueba ese plan con sorpresas simuladas, mientras las canastas del reino, el bosque del interés compuesto y el faro de los fraudes brillan como recuerdos de todo el camino recorrido. El viaje termina con la mayor alegría de todas -- enseñarle a la familia lo aprendido -- y una gran graduación bajo las estrellas.
sagas:
- position: 1
  slug: mi-meta-de-inversion
  icon: flag
  title:
    en-US: My Investing Goal
    es-MX: Mi Meta de Inversión
    pt-BR: Minha Meta de Investimento
  description:
    en-US: Learn to set a clear, realistic investing goal with a timeframe.
    es-MX: Aprende a fijar una meta de inversión clara y realista, con un plazo definido.
    pt-BR: Aprenda a definir uma meta de investimento clara e realista, com um prazo definido.
  topics:
  - position: 1
    slug: que-quiero-lograr-con-el-tiempo
    title_es: Qué quiero lograr con el tiempo
    concept: Una meta de inversión es algo grande y lejano que una persona quiere lograr, dejando que el tiempo y la constancia trabajen para conseguirlo.
    learning_objective: Al final, el niño puede describir con sus palabras algo que le gustaría lograr con el tiempo.
    key_vocabulary:
    - meta
    - lograr
    - lejano
    - tiempo
    prior_knowledge: Conoce el Reino de las Canastas, el Bosque del Interés Compuesto y el Faro de los Fraudes (aventuras 5 a 7).
    parent_check: "¿{{name}} puede contarte algo grande que le gustaría lograr con tiempo y constancia?"
    fact_refs: []
    lessons:
    - position: 1
      slug: el-observatorio-del-cosmos
      micro_objective: Conocer el observatorio del cosmos, donde Dr. Rho ayuda a los viajeros a imaginar metas grandes y lejanas.
      narrative_beat: Dr. Rho recibe a Dina y Liruf en un observatorio brillante del cosmos, donde ayuda a los viajeros a imaginar sus metas más grandes.
      difficulty: 1
      suggested_families:
      - story
      - choice
    - position: 2
      slug: metas-grandes-y-lejanas
      micro_objective: Reconocer que una meta de inversión suele ser algo grande, que toma tiempo en lograrse.
      narrative_beat: Zara Vex muestra estrellas del cosmos, cada una representando una meta grande que alguien logró con tiempo y constancia.
      difficulty: 2
      suggested_families:
      - story
      - choice
    - position: 3
      slug: mi-propia-estrella
      micro_objective: Imaginar una meta propia grande y lejana que le gustaría lograr con tiempo.
      narrative_beat: Dr. Rho invita a Dina a imaginar su propia estrella en el observatorio, representando algo grande que le gustaría lograr.
      difficulty: 2
      suggested_families:
      - choice
      - storyplay
    - position: 4
      slug: mi-explicacion-de-que-es-una-meta
      micro_objective: Explicar, con sus propias palabras, qué es una meta de inversión y por qué toma tiempo en lograrse.
      narrative_beat: Dina le explica a un aprendiz nuevo del cosmos qué es una meta de inversión, señalando su propia estrella en el observatorio.
      difficulty: 3
      suggested_families:
      - choice
      - story
  - position: 2
    slug: una-meta-necesita-un-plazo
    title_es: Una meta necesita un plazo
    concept: Una meta de inversión necesita un plazo claro, una idea de en cuánto tiempo se espera lograrla, para poder planear cómo llegar.
    learning_objective: Al final, el niño puede explicar por qué una meta de inversión necesita un plazo.
    key_vocabulary:
    - plazo
    - planear
    - cuánto tiempo
    - claro
    prior_knowledge: Puede describir algo que le gustaría lograr con el tiempo (tema anterior).
    parent_check: "¿{{name}} puede explicarte por qué una meta necesita un plazo, una idea de en cuánto tiempo espera lograrla?"
    fact_refs: []
    lessons:
    - position: 1
      slug: una-estrella-sin-fecha
      micro_objective: Observar una estrella del cosmos sin ningún plazo definido, y notar que es difícil planear sin uno.
      narrative_beat: Dr. Rho muestra una estrella del cosmos sin ningún plazo escrito, y pregunta a Liruf qué se le hace difícil de planear así.
      difficulty: 2
      suggested_families:
      - story
      - choice
    - position: 2
      slug: comparar-una-meta-con-plazo-y-sin-plazo
      micro_objective: Comparar una meta con un plazo claro frente a una meta sin ningún plazo definido.
      narrative_beat: Zara Vex compara dos estrellas del cosmos, una con plazo claro y otra sin ningún plazo, y pide a Dina notar la diferencia.
      difficulty: 2
      suggested_families:
      - analyze
      - choice
    - position: 3
      slug: elegir-un-plazo-para-mi-estrella
      micro_objective: Elegir un plazo aproximado y realista para la meta propia imaginada en el observatorio.
      narrative_beat: Dr. Rho ayuda a Dina a elegir un plazo aproximado y realista para la estrella que imaginó en el observatorio.
      difficulty: 3
      suggested_families:
      - choice
      - input
    - position: 4
      slug: mi-explicacion-del-plazo
      micro_objective: Explicar, con sus propias palabras, por qué el plazo elegido ayuda a planear mejor su meta.
      narrative_beat: Dina le explica a Liruf por qué el plazo que eligió para su estrella le ayuda a planear con más claridad.
      difficulty: 3
      suggested_families:
      - choice
      - story
  - position: 3
    slug: metas-cercanas-vs-metas-lejanas
    title_es: Metas cercanas frente a metas lejanas
    concept: Una meta cercana, como ahorrar para algo pronto, y una meta lejana, como invertir para algo en muchos años, se planean de forma distinta.
    learning_objective: Al final, el niño puede comparar una meta cercana con una meta lejana y explicar la diferencia.
    key_vocabulary:
    - cercana
    - lejana
    - ahorrar
    - invertir
    prior_knowledge: Sabe por qué una meta necesita un plazo claro (tema anterior).
    parent_check: "¿{{name}} puede explicarte la diferencia entre una meta cercana, como ahorrar, y una meta lejana, como invertir?"
    fact_refs: []
    lessons:
    - position: 1
      slug: la-estrella-cercana-y-la-estrella-lejana
      micro_objective: Observar dos estrellas del cosmos, una muy cercana y otra muy lejana, representando dos tipos de meta.
      narrative_beat: Dr. Rho señala dos estrellas del cosmos, una muy cercana y brillante, otra muy lejana y apenas visible.
      difficulty: 2
      suggested_families:
      - story
      - choice
    - position: 2
      slug: ahorrar-para-la-estrella-cercana
      micro_objective: Recordar que ahorrar, como se aprendió en Educación Financiera, funciona bien para una meta cercana.
      narrative_beat: Zara Vex recuerda a Liruf que ahorrar en un frasco, como aprendió hace tiempo, funciona bien para alcanzar la estrella más cercana.
      difficulty: 2
      suggested_families:
      - choice
      - story
    - position: 3
      slug: invertir-para-la-estrella-lejana
      micro_objective: Reconocer que invertir, con canastas variadas y tiempo, funciona bien para una meta lejana.
      narrative_beat: 'Dr. Rho explica que la estrella lejana necesita algo distinto al frasco de ahorro: una canasta variada y mucho tiempo.'
      difficulty: 3
      suggested_families:
      - choice
      - analyze
    - position: 4
      slug: mi-comparacion-de-metas
      micro_objective: Explicar, con un ejemplo propio, cuándo conviene ahorrar y cuándo conviene invertir según la cercanía de la meta.
      narrative_beat: Dina le explica a un aprendiz nuevo cuándo conviene ahorrar y cuándo conviene invertir, según qué tan cercana o lejana sea la meta.
      difficulty: 3
      suggested_families:
      - choice
      - storyplay
  - position: 4
    slug: escribir-mi-meta-con-claridad
    title_es: Escribir mi meta con claridad
    concept: Escribir una meta de inversión con claridad, incluyendo qué se quiere lograr y en cuánto tiempo, la hace más fácil de seguir.
    learning_objective: Al final, el niño puede escribir, en un escenario simulado, una meta de inversión clara y concreta.
    key_vocabulary:
    - escribir
    - claridad
    - concreta
    - seguir
    prior_knowledge: Puede comparar una meta cercana con una meta lejana (tema anterior).
    parent_check: "¿{{name}} puede mostrarte cómo escribiría su meta de inversión de forma clara y concreta?"
    fact_refs: []
    lessons:
    - position: 1
      slug: el-pergamino-de-las-metas
      micro_objective: Conocer el pergamino del observatorio donde los viajeros escriben sus metas con claridad.
      narrative_beat: Dr. Rho muestra a Dina el pergamino del observatorio, donde los viajeros del cosmos escriben sus metas con toda claridad.
      difficulty: 2
      suggested_families:
      - story
      - choice
    - position: 2
      slug: que-partes-tiene-una-meta-clara
      micro_objective: 'Identificar las partes que hacen clara una meta escrita: qué se quiere lograr y en cuánto tiempo.'
      narrative_beat: 'Zara Vex señala las dos partes que hacen clara una meta escrita en el pergamino: qué se quiere y en cuánto tiempo.'
      difficulty: 3
      suggested_families:
      - choice
      - analyze
    - position: 3
      slug: practicar-escribir-una-meta-de-ejemplo
      micro_objective: 'Practicar escribir una meta de ejemplo con las dos partes claras: qué se quiere lograr y el plazo.'
      narrative_beat: Liruf practica escribir una meta de ejemplo en el pergamino, con las dos partes claras que le enseñó Zara Vex.
      difficulty: 3
      suggested_families:
      - input
      - choice
    - position: 4
      slug: mi-meta-escrita-con-claridad
      micro_objective: Aplicar con seguridad, sin ayuda, la escritura de una meta clara y concreta propia.
      narrative_beat: Dina escribe su propia meta en el pergamino del observatorio, con toda la claridad que practicó en esta saga.
      difficulty: 3
      suggested_families:
      - input
      - storyplay
  - position: 5
    slug: cuanto-necesito-y-cuanto-tengo
    title_es: Cuánto necesito y cuánto tengo
    concept: Comparar cuánto se necesita para una meta con cuánto se tiene hoy ayuda a entender qué tan lejos está y qué camino falta por recorrer.
    learning_objective: Al final, el niño puede comparar cuánto necesita para su meta con cuánto tiene hoy.
    key_vocabulary:
    - necesito
    - tengo
    - comparar
    - camino
    prior_knowledge: Puede escribir una meta de inversión clara y concreta (tema anterior).
    prerequisites:
    - path: el-reino-de-las-canastas/un-fondo-es-una-canasta-compartida/que-es-un-fondo
      strength: soft
      reason: "Saber que un fondo reparte el riesgo ayuda a estimar cuánto necesito para una meta de inversión."
    parent_check: "¿{{name}} puede explicarte, con números simples, cuánto necesita para su meta y cuánto tiene hoy?"
    fact_refs: []
    lessons:
    - position: 1
      slug: cuanto-vale-mi-estrella
      micro_objective: Observar cuánto vale, en monedas simuladas, alcanzar la estrella elegida como meta.
      narrative_beat: Dr. Rho muestra a Dina cuántas monedas simuladas del cosmos costaría alcanzar la estrella que eligió como meta.
      difficulty: 2
      suggested_families:
      - money
      - story
    - position: 2
      slug: cuanto-tengo-guardado-hoy
      micro_objective: Contar cuántas monedas simuladas tiene guardadas hoy, como punto de partida hacia la meta.
      narrative_beat: Zara Vex ayuda a Liruf a contar cuántas monedas simuladas tiene guardadas hoy, como punto de partida hacia su estrella.
      difficulty: 2
      suggested_families:
      - money
      - input
    - position: 3
      slug: cuanto-falta-por-recorrer
      micro_objective: Calcular cuánto falta entre lo que se tiene hoy y lo que se necesita para la meta.
      narrative_beat: Dr. Rho ayuda a Dina a calcular cuánto falta entre las monedas que tiene hoy y las que necesita para su estrella.
      difficulty: 3
      suggested_families:
      - money
      - input
    - position: 4
      slug: mi-comparacion-de-necesito-y-tengo
      micro_objective: Explicar, con los números propios calculados, qué tan lejos está de su meta y qué camino le falta.
      narrative_beat: Dina le explica a un aprendiz nuevo, con sus propios números, qué tan lejos está de su estrella y qué camino le falta.
      difficulty: 3
      suggested_families:
      - choice
      - money
  - position: 6
    slug: una-meta-realista-para-mi-edad
    title_es: Una meta realista para practicar hoy
    concept: Reconocer una meta realista y de tamaño adecuado para practicar hoy ayuda a empezar sin esperar a ser mayor.
    learning_objective: Al final, el niño puede reconocer una meta simulada realista para practicar hoy, según su edad.
    key_vocabulary:
    - realista
    - practicar
    - adecuado
    - hoy
    prior_knowledge: Puede comparar cuánto necesita para su meta con cuánto tiene hoy (tema anterior).
    parent_check: "¿{{name}} puede explicarte por qué eligió una meta de tamaño realista para practicar desde hoy?"
    fact_refs: []
    lessons:
    - position: 1
      slug: una-estrella-demasiado-lejana
      micro_objective: Observar una estrella tan lejana que sería difícil de practicar de forma simulada hoy.
      narrative_beat: Dr. Rho muestra una estrella tan lejana en el cosmos que sería difícil practicar su plan de forma simulada hoy.
      difficulty: 2
      suggested_families:
      - story
      - choice
    - position: 2
      slug: una-estrella-de-tamano-adecuado
      micro_objective: Comparar esa estrella demasiado lejana con una estrella de tamaño más adecuado para practicar hoy.
      narrative_beat: Zara Vex compara la estrella demasiado lejana con una estrella más cercana, de tamaño adecuado para empezar a practicar hoy.
      difficulty: 3
      suggested_families:
      - analyze
      - choice
    - position: 3
      slug: ajustar-mi-meta-si-hace-falta
      micro_objective: Practicar ajustar la meta propia a un tamaño más realista, si hacía falta, sin sentirlo como un fracaso.
      narrative_beat: Dr. Rho ayuda a Dina a ajustar su meta a un tamaño más realista, explicando que ajustar no es fracasar, es planear mejor.
      difficulty: 3
      suggested_families:
      - choice
      - story
    - position: 4
      slug: mi-meta-realista-elegida
      micro_objective: Aplicar con seguridad, sin ayuda, la elección de una meta realista para practicar desde hoy.
      narrative_beat: Dina elige, sin ayuda de Dr. Rho, una meta realista de tamaño adecuado para empezar a practicar desde hoy mismo.
      difficulty: 3
      suggested_families:
      - choice
      - storyplay
  - position: 7
    slug: practicar-elegir-una-meta
    title_es: Practicar elegir entre varias metas
    concept: Elegir entre varias metas simuladas, decidiendo cuál conviene empezar primero, junta todo lo aprendido en la saga sobre metas de inversión.
    learning_objective: Al final, el niño puede elegir, entre varias metas simuladas, cuál conviene empezar primero y explicar por qué.
    key_vocabulary:
    - elegir
    - varias
    - primero
    - explicar
    prior_knowledge: Puede reconocer una meta realista para practicar hoy (tema anterior).
    parent_check: "¿{{name}} puede explicarte cómo elegiría, entre varias metas, cuál empezar primero?"
    fact_refs: []
    lessons:
    - position: 1
      slug: tres-estrellas-para-elegir
      micro_objective: Observar tres estrellas distintas del cosmos, cada una representando una meta diferente para elegir.
      narrative_beat: Dr. Rho muestra a Dina tres estrellas distintas del cosmos, cada una representando una meta diferente que podría elegir.
      difficulty: 2
      suggested_families:
      - story
      - choice
    - position: 2
      slug: comparar-las-tres-estrellas
      micro_objective: Comparar las tres estrellas según su plazo, su tamaño y qué tan realista es cada una.
      narrative_beat: Zara Vex reta a Liruf a comparar las tres estrellas según su plazo, su tamaño y qué tan realista es cada una.
      difficulty: 3
      suggested_families:
      - analyze
      - choice
    - position: 3
      slug: elegir-cual-empezar-primero
      micro_objective: Elegir, con razones propias, cuál de las tres estrellas conviene empezar a perseguir primero.
      narrative_beat: Dina elige, con sus propias razones, cuál de las tres estrellas del cosmos conviene empezar a perseguir primero.
      difficulty: 3
      suggested_families:
      - choice
      - analyze
    - position: 4
      slug: mi-eleccion-explicada
      micro_objective: Explicar, con sus propias palabras, por qué eligió esa estrella para empezar primero.
      narrative_beat: Dina le explica a un aprendiz nuevo del cosmos por qué eligió esa estrella en particular para empezar primero.
      difficulty: 3
      suggested_families:
      - choice
      - story
  - position: 8
    slug: mi-meta-personal-de-inversion
    title_es: Mi meta personal de inversión
    concept: Escribir la propia meta de inversión simulada, con plazo y monto, junta todo lo aprendido en la saga y abre el camino hacia el plan completo.
    learning_objective: Al final, el niño puede escribir su propia meta de inversión simulada, con plazo y monto claros.
    key_vocabulary:
    - personal
    - plazo
    - monto
    - claro
    prior_knowledge: Ha practicado elegir entre varias metas simuladas (tema anterior).
    parent_check: "¿{{name}} puede mostrarte su meta personal de inversión, con plazo y monto claros?"
    fact_refs: []
    lessons:
    - position: 1
      slug: mi-estrella-elegida-para-siempre
      micro_objective: Elegir, con seguridad y sin ayuda, la estrella final que representará su meta personal de inversión.
      narrative_beat: Dina elige, sin ayuda de Dr. Rho, la estrella final que representará su propia meta de inversión en todo este viaje.
      difficulty: 2
      suggested_families:
      - story
      - choice
    - position: 2
      slug: escribir-el-plazo-y-el-monto
      micro_objective: Escribir, en el pergamino del observatorio, el plazo y el monto de su meta personal.
      narrative_beat: Dina escribe en el pergamino del observatorio el plazo y el monto simulado de su propia meta de inversión.
      difficulty: 3
      suggested_families:
      - input
      - choice
    - position: 3
      slug: revisar-mi-meta-con-dr-rho
      micro_objective: Revisar la meta personal escrita junto a Dr. Rho, verificando que sea clara y realista.
      narrative_beat: Dr. Rho revisa junto a Dina su meta escrita, confirmando que es clara, realista y tiene un plazo definido.
      difficulty: 3
      suggested_families:
      - choice
      - story
    - position: 4
      slug: mi-meta-lista-para-el-plan
      micro_objective: Aplicar con seguridad, sin ayuda, la meta personal completa como punto de partida para el plan de la siguiente saga.
      narrative_beat: Con su meta personal ya escrita y revisada, Dina se prepara para armar el plan completo que la llevará hasta su estrella.
      difficulty: 3
      suggested_families:
      - choice
      - storyplay
  - position: 9
    slug: el-cofre-del-repaso
    kind: review_spaced
    title_es: El Cofre del Repaso
    concept: Dr. Rho abre el cofre del observatorio para poner a prueba, sin enseñar nada nuevo, todo lo aprendido en la saga Mi Meta de Inversión.
    learning_objective: Al final, el niño puede recordar y aplicar, sin ayuda nueva, los conceptos principales de la saga Mi Meta de Inversión.
    key_vocabulary:
    - meta
    - plazo
    - realista
    - escribir
    prior_knowledge: Ha completado los ocho temas de la saga Mi Meta de Inversión (aventura 8, saga 1).
    fact_refs: []
    review_of:
    - el-cosmos-del-inversionista/mi-meta-de-inversion/que-quiero-lograr-con-el-tiempo
    - el-cosmos-del-inversionista/mi-meta-de-inversion/una-meta-necesita-un-plazo
    - el-cosmos-del-inversionista/mi-meta-de-inversion/metas-cercanas-vs-metas-lejanas
    - el-cosmos-del-inversionista/mi-meta-de-inversion/escribir-mi-meta-con-claridad
    - el-cosmos-del-inversionista/mi-meta-de-inversion/cuanto-necesito-y-cuanto-tengo
    - el-cosmos-del-inversionista/mi-meta-de-inversion/una-meta-realista-para-mi-edad
    - el-cosmos-del-inversionista/mi-meta-de-inversion/practicar-elegir-una-meta
    - el-cosmos-del-inversionista/mi-meta-de-inversion/mi-meta-personal-de-inversion
    lessons:
    - position: 1
      slug: el-cofre-del-observatorio-se-abre
      micro_objective: Recordar, sin ayuda nueva, qué es una meta de inversión y por qué necesita un plazo.
      narrative_beat: Dr. Rho abre el cofre del observatorio y reta a Dina a recordar, estrella por estrella, lo primero que aprendió en esta saga.
      difficulty: 1
      suggested_families:
      - story
      - choice
    - position: 2
      slug: recordar-en-orden-la-meta
      micro_objective: Recordar y ordenar de nuevo la diferencia entre una meta cercana y una lejana.
      narrative_beat: Liruf saca del cofre las tarjetas mezcladas de la saga y las ordena de memoria, sin que Dr. Rho le dé ninguna pista nueva.
      difficulty: 1
      suggested_families:
      - arrange
      - choice
    - position: 3
      slug: aplicar-lo-guardado-de-la-meta
      micro_objective: Aplicar de nuevo, en una escena distinta, lo aprendido sobre comparar cuánto necesita y cuánto tiene.
      narrative_beat: Dr. Rho presenta una escena nueva del cosmos y pregunta a Dina si recuerda, sin repasar la lección, qué haría en ese caso.
      difficulty: 2
      suggested_families:
      - choice
      - money
    - position: 4
      slug: cerrar-el-cofre-del-observatorio
      micro_objective: Aplicar en conjunto todo lo repasado de la saga, incluyendo escribir una meta personal, para cerrar el cofre.
      narrative_beat: Antes de cerrar el cofre, Dina demuestra que recuerda toda la saga uniendo cada tarjeta con la lección que le corresponde.
      difficulty: 2
      suggested_families:
      - choice
      - storyplay
  - position: 10
    slug: reto-entrelazado
    kind: review_interleaved
    title_es: Reto Entrelazado
    concept: Zara Vex mezcla lo aprendido en Mi Meta de Inversión con la diversificación del Reino de las Canastas en un reto que combina ambos mundos.
    learning_objective: Al final, el niño puede recordar y combinar el concepto de diversificar con el concepto de fijar una meta clara.
    key_vocabulary:
    - recordar
    - combinar
    - aplicar
