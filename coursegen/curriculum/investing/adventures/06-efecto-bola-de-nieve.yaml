              narrative_beat: "Con el patrón claro, Liruf predice que la cuenta acelerada le va a ganar por mucho a la pareja, aunque al principio parecía casi lo mismo."
              difficulty: 4
              suggested_families: [choice, analyze]
        - position: 5
