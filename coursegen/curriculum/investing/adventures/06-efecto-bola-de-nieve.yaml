schema_version: 1

adventure:
  position: 6
  slug: efecto-bola-de-nieve
  theme: forest
  age_tier: tier4
  title:
    en-US: "The Snowball Effect"
    es-MX: "El Efecto Bola de Nieve"
    pt-BR: "O Efeito Bola de Neve"
  description:
    en-US: "In the Growing Forest, the team studies how a following that snowballs shares the exact same shape as money left to compound for decades - and why starting a few years earlier changes everything."
    es-MX: "En el Bosque que Crece, el equipo estudia cómo una cuenta de seguidores que se vuelve viral tiene exactamente la misma forma que un dinero que se deja crecer por décadas - y por qué empezar unos años antes lo cambia todo."
    pt-BR: "No Bosque que Cresce, a equipe estuda como uma conta de seguidores que viraliza tem exatamente a mesma forma de um dinheiro deixado para crescer por decadas - e por que comecar alguns anos antes muda tudo."
  narrative_arc: "Dina, Liruf, Rho y Zara suben al Bosque que Crece, donde observan primero cómo una cuenta de seguidores crece lento al inicio y luego se acelera - el mismo patrón que un ahorro que deja crecer su premio adentro. Formalizan la idea con una bola de nieve real que rueda cuesta abajo, simulan muchas vueltas (años) para ver el tamaño acelerarse, y descubren que unos pocos años de diferencia al empezar generan un resultado final enorme. Terminan combinando canasta diversificada, plazo largo y protección contra interrupciones en un plan de bola de nieve personal, que defienden frente al consejo del bosque."

sagas:
  - position: 1
    slug: como-crecen-los-seguidores
    icon: trending_up
    title:
      en-US: "How Followers Grow"
      es-MX: "Cómo Crecen los Seguidores"
      pt-BR: "Como os Seguidores Crescem"
    description:
      en-US: "A following that snowballs and money left to compound share the exact same accelerating shape."
      es-MX: "Una cuenta de seguidores que se vuelve viral y un dinero que se deja crecer comparten exactamente la misma forma acelerada."
      pt-BR: "Uma conta de seguidores que viraliza e um dinheiro deixado para crescer compartilham exatamente a mesma forma acelerada."
    topics:
        - position: 1
          slug: un-seguidor-trae-a-otro
          title_es: "Un seguidor trae a otro"
          concept: "Cada seguidor nuevo puede contarle a otros y traer más seguidores, como una bola de nieve que crece rodando cuesta abajo."
          learning_objective: "El aprendiz reconoce, con la metáfora de la bola de nieve, que cada seguidor nuevo puede traer más seguidores."
          key_vocabulary: [seguidor, traer más seguidores, bola de nieve]
          prior_knowledge: "Ninguno - es el punto de partida de esta aventura."
          fact_refs: [risk.follower_growth_metaphor]
          parent_check: "Preguntale a {{name}} si sabe cómo una cuenta con pocos seguidores puede terminar con muchos más con el tiempo."
          lessons:
            - position: 1
              slug: zara-explica-la-bola-de-nieve
              micro_objective: "Reconoce, con la metáfora de la bola de nieve, que cada seguidor nuevo puede contarle a otros y traer más seguidores."
              narrative_beat: "Zara le explica a Liruf: 'cada seguidor nuevo le puede contar a sus amigos, y esos amigos a los suyos - como una bola de nieve que crece rodando'."
              difficulty: 1
              suggested_families: [story, choice]
            - position: 2
              slug: explico-como-trae-mas-seguidores
              micro_objective: "Explica, con sus palabras, por qué un seguidor nuevo puede traer más seguidores de los que parece a simple vista."
              narrative_beat: "Liruf explica con sus palabras cómo un solo seguidor nuevo puede terminar trayendo varios más."
              difficulty: 2
              suggested_families: [choice, analyze]
        - position: 2
          slug: crece-lento-al-principio
          title_es: "Crece lento al principio"
          concept: "Una cuenta nueva crece lento al principio, porque hay pocos seguidores para contarle a otros."
          learning_objective: "El aprendiz reconoce que el crecimiento inicial es lento y lo compara contra el de una cuenta ya grande."
          key_vocabulary: [crecimiento inicial, lento]
          prior_knowledge: "Reconoce que un seguidor nuevo puede traer más (tema anterior)."
          fact_refs: []
          parent_check: "Preguntale a {{name}} por qué cree que una cuenta nueva crece más lento que una cuenta que ya es grande."
          lessons:
            - position: 1
              slug: la-cuenta-nueva-de-rho
              micro_objective: "Reconoce que una cuenta nueva crece lento al principio, porque hay pocos seguidores para contarle a otros."
              narrative_beat: "Rho ve que su cuenta nueva del bosque casi no crece la primera semana - apenas tiene seguidores que puedan contarle a alguien más."
              difficulty: 2
              suggested_families: [story, analyze]
            - position: 2
              slug: comparo-cuenta-nueva-y-grande
              micro_objective: "Compara el crecimiento de la primera semana contra el de una cuenta que ya tiene muchos seguidores."
              narrative_beat: "Zara compara: su cuenta nueva ganó 2 seguidores esta semana; una cuenta grande del bosque ganó cientos en el mismo tiempo."
              difficulty: 3
              suggested_families: [analyze, choice]
        - position: 3
          slug: crece-rapido-despues
          title_es: "Crece rápido después"
          concept: "Entre más seguidores tiene una cuenta, más rápido puede seguir creciendo, porque hay más gente contando a más gente."
          learning_objective: "El aprendiz reconoce que el ritmo de crecimiento aumenta con el tamaño de la cuenta y ordena momentos del crecimiento por velocidad."
          key_vocabulary: [ritmo de crecimiento, aumentar]
          prior_knowledge: "Compara el crecimiento de una cuenta nueva contra una grande (tema anterior)."
          fact_refs: []
          parent_check: "Pidele a {{name}} que ordene tres momentos de una cuenta (inicio, medio, después) según qué tan rápido creció en cada uno."
          lessons:
            - position: 1
              slug: la-cuenta-de-rho-por-fin-acelera
              micro_objective: "Reconoce que entre más seguidores tiene una cuenta, más rápido puede seguir creciendo."
              narrative_beat: "Después de varias semanas, la cuenta de Rho por fin tiene suficientes seguidores como para que el crecimiento se sienta más rápido."
              difficulty: 3
              suggested_families: [story, analyze]
            - position: 2
              slug: ordeno-tres-momentos-del-crecimiento
              micro_objective: "Ordena tres momentos del crecimiento de una cuenta (inicio, medio, después) según qué tan rápido creció en cada uno."
              narrative_beat: "Zara ordena tres capturas de la cuenta de Rho: al inicio, a la mitad, y después - y ve cómo el ritmo cambia."
              difficulty: 3
              suggested_families: [arrange, analyze]
        - position: 4
          slug: comparo-crecimiento-parejo-y-acelerado
          title_es: "Comparo crecimiento parejo y acelerado"
          concept: "Comparar un crecimiento parejo (mismo número cada semana) contra uno acelerado (cada vez más) muestra que, a la larga, no terminan igual."
          learning_objective: "El aprendiz compara crecimiento parejo contra acelerado y predice cuál tendrá más seguidores tras muchas semanas."
          key_vocabulary: [crecimiento parejo, crecimiento acelerado]
          prior_knowledge: "Ordena momentos del crecimiento por velocidad (tema anterior)."
          fact_refs: []
          parent_check: "Preguntale a {{name}} cuál cree que gana a la larga: una cuenta que crece siempre igual, o una que crece cada vez más rápido."
          lessons:
            - position: 1
              slug: dos-cuentas-distinto-patron
