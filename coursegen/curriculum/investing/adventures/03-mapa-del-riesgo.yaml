schema_version: 1

adventure:
  position: 3
  slug: mapa-del-riesgo
  theme: archipelago
  age_tier: tier4
  title:
    en-US: "The Risk Map"
    es-MX: "El Mapa del Riesgo"
    pt-BR: "O Mapa do Risco"
  description:
    en-US: "Sailing the Archipelago of Decisions, four navigators learn that more reward almost always comes with more risk - and that a promise of safe, huge and fast all at once is never real."
    es-MX: "Navegando el Archipiélago de Decisiones, cuatro navegantes aprenden que más premio casi siempre viene con más riesgo - y que una promesa de seguro, grande y rápido a la vez nunca es real."
    pt-BR: "Navegando o Arquipelago de Decisoes, quatro navegadores aprendem que mais premio quase sempre vem com mais risco - e que uma promessa de seguro, grande e rápido ao mesmo tempo nunca e real."
  narrative_arc: "Dina, Liruf, Rho y Zara navegan el Archipiélago de Decisiones, un grupo de islas donde cada ruta esconde un nivel distinto de riesgo. Descubren que más premio posible casi siempre viene junto con más riesgo de perder, usan las cajas de recompensa de un videojuego para entender el valor esperado antes de zarpar, aprenden a desconfiar de cualquier oferta que prometa todo perfecto a la vez, y terminan combinando su propio plazo y tolerancia al riesgo para elegir y defender una ruta final frente al consejo de capitanes."

sagas:
  - position: 1
    slug: el-espectro-de-riesgo
    icon: sailing
    title:
      en-US: "The Risk Spectrum"
      es-MX: "El Espectro de Riesgo"
      pt-BR: "O Espectro de Risco"
    description:
      en-US: "From nearly-guaranteed to wildly uncertain - learn to read where a route sits on the risk spectrum."
      es-MX: "De casi garantizado a muy incierto - aprende a leer dónde se ubica una ruta en el espectro de riesgo."
      pt-BR: "De quase garantido a muito incerto - aprenda a ler onde uma rota se situa no espectro de risco."
    topics:
        - position: 1
          slug: que-es-el-riesgo
          title_es: "Qué es el riesgo"
          concept: "Riesgo es la posibilidad de que algo no salga como esperabas, incluyendo perder parte o todo lo que arriesgaste."
          learning_objective: "El aprendiz reconoce el riesgo como la posibilidad de un resultado distinto al esperado, incluyendo una pérdida."
          key_vocabulary: [riesgo, resultado esperado, pérdida]
          prior_knowledge: "Ninguno - es el punto de partida de esta aventura."
          fact_refs: []
          parent_check: "Preguntale a {{name}} qué significa 'riesgo' para él o ella, con sus propias palabras."
          lessons:
            - position: 1
              slug: antes-de-zarpar
              micro_objective: "Reconoce que el riesgo es la posibilidad de que algo no salga como esperabas, incluyendo perder parte de lo que arriesgaste."
              narrative_beat: "Rho le explica a Liruf antes de zarpar: 'riesgo' significa que la ruta podría no salir como esperamos - a veces se pierde algo."
              difficulty: 1
              suggested_families: [story, choice]
            - position: 2
              slug: seguro-o-arriesgado
              micro_objective: "Explica, con sus palabras, la diferencia entre un resultado seguro y uno arriesgado en un caso simple."
              narrative_beat: "Liruf compara dos rutas del muelle: una siempre llega, la otra a veces no - ahora entiende cuál es la arriesgada."
              difficulty: 2
              suggested_families: [choice, analyze]
        - position: 2
          slug: rutas-seguras-y-rutas-riesgosas
          title_es: "Rutas seguras y rutas riesgosas"
          concept: "Unas rutas casi siempre llegan bien pero con premio modesto; otras rutas prometen más premio pero también más posibilidad de perder."
          learning_objective: "El aprendiz identifica y compara el premio típico y el riesgo típico de dos rutas descritas."
          key_vocabulary: [premio típico, riesgo típico, trade-off]
          prior_knowledge: "Reconoce qué es el riesgo (tema anterior)."
          fact_refs: []
          parent_check: "Preguntale a {{name}} si conoce un ejemplo de 'ganar poco casi siempre' contra 'ganar mucho a veces'."
          lessons:
            - position: 1
              slug: dos-capitanes-dos-rutas
              micro_objective: "Identifica, entre dos rutas descritas, cuál es la más segura y cuál la más riesgosa según sus resultados típicos."
              narrative_beat: "Zara escucha a dos capitanes del archipiélago describir sus rutas: una casi siempre llega con poco premio, la otra a veces no llega, pero paga mucho más."
              difficulty: 2
              suggested_families: [story, analyze]
            - position: 2
              slug: comparo-premio-y-riesgo-tipico
              micro_objective: "Compara el premio típico y el riesgo típico de dos rutas y explica el trade-off entre ambas."
              narrative_beat: "Dina compara las dos rutas en su libreta: nombra qué gana cada una en promedio y qué tan seguido falla."
              difficulty: 3
              suggested_families: [analyze, choice]
        - position: 3
          slug: ordeno-rutas-por-riesgo
          title_es: "Ordeno rutas por riesgo"
          concept: "Ordenar varias rutas de menor a mayor riesgo requiere pistas concretas del caso, no solo una impresión."
          learning_objective: "El aprendiz ordena 4 rutas por nivel de riesgo usando pistas concretas y justifica el orden elegido."
          key_vocabulary: [ordenar, pistas concretas, justificar]
          prior_knowledge: "Compara el premio y el riesgo típico de dos rutas (tema anterior)."
          fact_refs: []
          parent_check: "Pidele a {{name}} que ordene 3 decisiones de su semana de la más segura a la más arriesgada."
          lessons:
            - position: 1
              slug: ordeno-cuatro-rutas
              micro_objective: "Ordena 4 rutas de menor a mayor riesgo usando pistas concretas del caso (qué tan seguido fallan, qué tanto se pierde si fallan)."
              narrative_beat: "Rho ordena cuatro rutas del muelle de la más segura a la más riesgosa, usando los reportes de los capitanes."
              difficulty: 3
              suggested_families: [arrange, analyze]
            - position: 2
              slug: justifico-mi-orden
              micro_objective: "Justifica, para una ruta específica, por qué la clasificó como más o menos riesgosa que otra."
              narrative_beat: "Zara defiende su orden: la ruta del Faro Norte es más riesgosa que la del Puerto Sur porque falla el doble de seguido."
              difficulty: 3
              suggested_families: [choice, analyze]
        - position: 4
          slug: mas-premio-casi-siempre-mas-riesgo
          title_es: "Más premio, casi siempre más riesgo"
          concept: "En general, más premio posible viene junto con más riesgo de perder - esa es la relación riesgo-recompensa."
          learning_objective: "El aprendiz reconoce y aplica el patrón riesgo-recompensa para predecir el riesgo aproximado de una ruta nueva."
          key_vocabulary: [relación riesgo-recompensa, patrón, predecir]
          prior_knowledge: "Ordena rutas por nivel de riesgo (tema anterior)."
          fact_refs: [risk.reward_tradeoff_pairs]
          parent_check: "Preguntale a {{name}} si una oferta que promete mucho premio probablemente también trae más riesgo - y por qué."
          lessons:
            - position: 1
              slug: el-patron-en-el-mapa
              micro_objective: "Reconoce, en varios casos, que más premio posible casi siempre viene junto con más riesgo de perder."
              narrative_beat: "Liruf nota un patrón: las rutas con más premio en el mapa del archipiélago son casi siempre las que también fallan más seguido."
              difficulty: 3
              suggested_families: [story, analyze]
            - position: 2
              slug: predigo-el-riesgo-de-una-ruta-nueva
              micro_objective: "Predice el nivel de riesgo aproximado de una ruta nueva, dado solo su premio prometido, usando el patrón riesgo-recompensa."
              narrative_beat: "Con el patrón claro, Rho predice que una nueva ruta con premio enorme probablemente también arriesga mucho, antes de ver los detalles."
              difficulty: 4
              suggested_families: [choice, analyze]
        - position: 5
          slug: el-riesgo-no-es-malo-en-si-mismo
          title_es: "El riesgo no es malo en sí mismo"
          concept: "El riesgo no es 'malo' per se; el problema es tomar más riesgo del que puedes permitirte perder."
          learning_objective: "El aprendiz distingue tomar riesgo prudente de tomar riesgo imprudente, según cuánto tiene la persona para perder."
          key_vocabulary: [prudente, imprudente, permitirse perder]
          prior_knowledge: "Reconoce y aplica el patrón riesgo-recompensa (tema anterior)."
          fact_refs: []
          parent_check: "Preguntale a {{name}} si arriesgar dinero siempre es 'malo', o si depende de cuánto se puede permitir perder."
          lessons:
            - position: 1
              slug: el-riesgo-no-es-el-enemigo
              micro_objective: "Reconoce que el riesgo no es 'malo' en sí mismo; el problema es tomar más riesgo del que puedes permitirte perder."
              narrative_beat: "Dina aclara: 'el riesgo no es el enemigo - tomar más riesgo del que puedes perder, sí lo es'."
              difficulty: 4
              suggested_families: [story, choice]
            - position: 2
              slug: mismo-riesgo-distinta-imprudencia
              micro_objective: "Distingue, en dos casos con el mismo nivel de riesgo, cuál es imprudente según cuánto tiene esa persona para perder."
              narrative_beat: "Zara compara dos capitanes que toman la misma ruta riesgosa: uno arriesga una moneda de sobra, el otro arriesga todo lo que tiene - no es la misma decisión."
              difficulty: 4
              suggested_families: [choice, analyze]
        - position: 6
          slug: cuanto-puedo-permitirme-perder
          title_es: "Cuánto puedo permitirme perder"
          concept: "Antes de tomar una ruta riesgosa, calcula cuánto realmente puedes permitirte perder sin que te haga daño real."
          learning_objective: "El aprendiz calcula, para un caso propio, cuánto puede permitirse perder antes de tomar una decisión riesgosa."
          key_vocabulary: [límite de pérdida, daño real]
          prior_knowledge: "Distingue riesgo prudente de imprudente (tema anterior)."
          fact_refs: []
          parent_check: "Pidele a {{name}} que calcule cuánto podría permitirse perder, sin que le haga daño real, en una decisión de riesgo pequeña."
          lessons:
            - position: 1
              slug: armamos-la-regla-del-limite
              micro_objective: "Con apoyo, calcula cuánto puede permitirse perder sin que le haga daño real, antes de tomar una ruta riesgosa."
              narrative_beat: "El equipo arma una regla: antes de zarpar, calculan cuánto podrían perder sin que arruine sus planes de la semana."
              difficulty: 4
              suggested_families: [storyplay, money]
            - position: 2
              slug: calculo-mi-propio-limite
              micro_objective: "Aplica, sin ayuda, el cálculo de cuánto puede permitirse perder a una decisión de riesgo propia."
              narrative_beat: "Rho calcula solo, sin ayuda, cuánto de su propio ahorro podría arriesgar en una ruta nueva sin que le duela de verdad."
              difficulty: 5
              suggested_families: [money, choice]
        - position: 7
          slug: repaso-el-espectro-de-riesgo
          kind: review_spaced
          title_es: "Repaso: El Espectro de Riesgo"
          concept: "El equipo repasa cómo ordenar rutas por riesgo y calcular un límite personal de pérdida antes de zarpar hacia la siguiente saga."
          learning_objective: "El aprendiz recuerda y aplica, sin nueva enseñanza, cómo ordenar rutas por riesgo y calcular cuánto puede perder."
          key_vocabulary: [espectro de riesgo, límite de pérdida]
          prior_knowledge: "Completo los 6 temas de El Espectro de Riesgo."
          fact_refs: []
          review_of:
            - mapa-del-riesgo/el-espectro-de-riesgo/que-es-el-riesgo
            - mapa-del-riesgo/el-espectro-de-riesgo/rutas-seguras-y-rutas-riesgosas
            - mapa-del-riesgo/el-espectro-de-riesgo/ordeno-rutas-por-riesgo
            - mapa-del-riesgo/el-espectro-de-riesgo/mas-premio-casi-siempre-mas-riesgo
            - mapa-del-riesgo/el-espectro-de-riesgo/el-riesgo-no-es-malo-en-si-mismo
            - mapa-del-riesgo/el-espectro-de-riesgo/cuanto-puedo-permitirme-perder
          lessons:
            - position: 1
              slug: repaso-ordeno-rutas-de-nuevo
              micro_objective: "Recuerda y aplica, sin ayuda, cómo ordenar rutas de menor a mayor riesgo."
              narrative_beat: "El equipo repasa el mapa del muelle y vuelve a ordenar las rutas de riesgo, sin ayuda."
              difficulty: 3
              suggested_families: [arrange, analyze]
            - position: 2
              slug: repaso-calculo-mi-limite
              micro_objective: "Aplica sin ayuda todo lo repasado: calcula cuánto puede permitirse perder en una ruta nueva del archipiélago."
              narrative_beat: "Zara calcula, sin ayuda de nadie, cuánto puede arriesgar en una ruta nueva que acaba de aparecer en el mapa."
              difficulty: 4
              suggested_families: [money, choice]
        - position: 8
          slug: cruce-riesgo-y-limite-personal
          kind: review_interleaved
          title_es: "Cruce: Riesgo y Límite Personal"
          concept: "Mezclamos el patrón riesgo-recompensa con el límite personal de pérdida para evaluar una ruta de una sola vez."
          learning_objective: "El aprendiz combina, sin nueva enseñanza, al menos dos señales de esta saga para evaluar una ruta nueva."
          key_vocabulary: [riesgo-recompensa, límite personal]
          prior_knowledge: "Completo el repaso de El Espectro de Riesgo (tema anterior)."
          fact_refs: []
          review_of:
            - mapa-del-riesgo/el-espectro-de-riesgo/mas-premio-casi-siempre-mas-riesgo
            - mapa-del-riesgo/el-espectro-de-riesgo/el-riesgo-no-es-malo-en-si-mismo
            - mapa-del-riesgo/el-espectro-de-riesgo/cuanto-puedo-permitirme-perder
          lessons:
            - position: 1
              slug: junto-patron-y-limite
              micro_objective: "Combina el patrón riesgo-recompensa con el límite personal de cuánto se puede perder para evaluar una ruta nueva."
              narrative_beat: "Rho junta dos ideas: qué tanto premio-riesgo promete la ruta Y cuánto puede permitirse perder - antes de decidir."
              difficulty: 4
              suggested_families: [analyze, choice]
            - position: 2
              slug: evaluo-una-ruta-completa
              micro_objective: "Evalúa, sin ayuda, una ruta nueva combinando su nivel de riesgo con el límite personal de pérdida aceptable."
              narrative_beat: "Zara decide en segundos si una ruta nueva le conviene, cruzando su riesgo típico con lo que puede permitirse perder."
              difficulty: 5
              suggested_families: [choice, analyze]
  - position: 2
    slug: cajas-de-recompensa
    icon: casino
    title:
      en-US: "Reward Boxes"
      es-MX: "Cajas de Recompensa"
      pt-BR: "Caixas de Recompensa"
    description:
      en-US: "A familiar video-game mechanic hides a real lesson: judge a bet by how often it pays, not just by how much."
      es-MX: "Una mecánica de videojuego conocida esconde una lección real: juzga una apuesta por qué tan seguido paga, no solo por cuánto paga."
      pt-BR: "Uma mecanica de videogame conhecida esconde uma licao real: julgue uma aposta por quao frequentemente ela paga, nao apenas por quanto paga."
    topics:
        - position: 1
          slug: la-caja-rara-y-la-caja-comun
          title_es: "La caja rara y la caja común"
          concept: "Una caja de recompensa rara paga mucho pero muy pocas veces; una caja común paga poco pero casi siempre."
          learning_objective: "El aprendiz distingue el patrón de una caja de recompensa rara (paga mucho, poco frecuente) de una común (paga poco, muy frecuente)."
          key_vocabulary: [caja rara, caja común, frecuencia]
          prior_knowledge: "Completo El Espectro de Riesgo (saga anterior)."
          fact_refs: [risk.loot_box_odds_metaphor]
          parent_check: "Preguntale a {{name}} si conoce la diferencia entre una recompensa rara de un videojuego y una recompensa común."
          lessons:
            - position: 1
              slug: dos-cajas-en-el-puesto
              micro_objective: "Reconoce que una caja de recompensa rara paga mucho pero muy pocas veces, y una caja común paga poco pero casi siempre."
              narrative_beat: "En un puesto del archipiélago, Liruf ve dos cajas de recompensa de un videojuego: la rara promete un premio enorme, la común uno chiquito pero casi seguro."
              difficulty: 1
              suggested_families: [story, choice]
            - position: 2
              slug: explico-la-diferencia-de-las-cajas
              micro_objective: "Compara las dos cajas y explica, con sus palabras, la diferencia entre 'paga mucho pero casi nunca' y 'paga poco pero casi siempre'."
              narrative_beat: "Liruf explica la diferencia a Zara usando sus propias palabras, comparando las dos cajas del puesto."
              difficulty: 2
              suggested_families: [choice, analyze]
        - position: 2
          slug: cuentas-las-veces-que-paga
          title_es: "Cuentas las veces que paga"
          concept: "Para juzgar si una caja 'vale la pena', hay que fijarse en qué tan seguido paga, no solo en cuánto paga cuando sí paga."
          learning_objective: "El aprendiz registra la frecuencia de pago de dos cajas en varios intentos y reconoce que el premio grande solo cuenta parte de la historia."
          key_vocabulary: [registro, frecuencia de pago]
          prior_knowledge: "Distingue el patrón de una caja rara de una común (tema anterior)."
          fact_refs: []
          parent_check: "Pidele a {{name}} que te explique por qué fijarse solo en 'cuánto paga' una recompensa, sin ver qué tan seguido paga, es una vista incompleta."
          lessons:
            - position: 1
              slug: registro-diez-intentos
              micro_objective: "Cuenta, en un registro de 10 intentos, cuántas veces pagó cada tipo de caja."
              narrative_beat: "Rho lleva un registro de 10 aperturas de cada caja: la común pagó 8 veces, la rara solo pagó 1 - pero esa vez pagó mucho más."
              difficulty: 2
              suggested_families: [arrange, input]
            - position: 2
              slug: la-mitad-de-la-historia
              micro_objective: "Reconoce que juzgar una caja solo por 'cuánto paga cuando sí paga' es incompleto sin ver qué tan seguido paga."
              narrative_beat: "Zara señala: fijarse solo en el premio grande de la caja rara, sin ver que casi nunca paga, es ver solo la mitad de la historia."
              difficulty: 3
              suggested_families: [choice, analyze]
        - position: 3
          slug: el-valor-esperado-en-palabras-simples
          title_es: "El valor esperado, en palabras simples"
          concept: "Multiplicar qué tan seguido pasa por cuánto paga da una idea de qué tanto 'vale' una apuesta en promedio."
          learning_objective: "El aprendiz calcula el valor promedio aproximado de una apuesta combinando frecuencia y premio."
          key_vocabulary: [valor promedio, en promedio]
          prior_knowledge: "Registra la frecuencia de pago de dos cajas (tema anterior)."
          fact_refs: []
          parent_check: "Pidele a {{name}} que calcule, con números sencillos, cuánto 'vale' en promedio una caja que paga poco pero casi siempre."
          lessons:
            - position: 1
              slug: multiplico-frecuencia-por-premio
              micro_objective: "Multiplica qué tan seguido paga una caja por cuánto paga, para estimar qué tanto 'vale' en promedio."
              narrative_beat: "Dina hace la cuenta simple: la caja común paga poco pero casi siempre, así que en promedio, por intento, deja más de lo que parece."
              difficulty: 3
              suggested_families: [input, analyze]
            - position: 2
              slug: comparo-el-valor-promedio
              micro_objective: "Compara el valor promedio estimado de dos cajas y decide cuál conviene más a largo plazo."
              narrative_beat: "Con las cuentas hechas, Rho decide cuál caja conviene más si se abre muchas veces, no solo una vez con suerte."
              difficulty: 3
              suggested_families: [choice, analyze]
        - position: 4
          slug: comparo-dos-cajas
          title_es: "Comparo dos cajas"
          concept: "Comparar dos cajas de recompensa con frecuencia y premio permite ordenar cuál conviene más en promedio."
          learning_objective: "El aprendiz compara y ordena cajas de recompensa usando frecuencia y premio, y decide dado un número fijo de intentos."
          key_vocabulary: [comparar cajas, número de intentos]
          prior_knowledge: "Calcula el valor promedio de una caja (tema anterior)."
          fact_refs: []
          parent_check: "Preguntale a {{name}} qué elegiría con solo 5 intentos disponibles: la caja rara o la común, y por qué."
          lessons:
            - position: 1
              slug: ordeno-cajas-por-valor
              micro_objective: "Compara dos cajas de recompensa usando frecuencia y premio, y ordena cuál 'vale' más en promedio."
              narrative_beat: "Zara compara dos cajas nuevas del puesto: frecuencia y premio de cada una, para decidir cuál abrir con su moneda extra."
              difficulty: 3
              suggested_families: [analyze, choice]
            - position: 2
              slug: decido-con-intentos-limitados
              micro_objective: "Decide, entre tres cajas, cuál elegir dado un número fijo de intentos disponibles."
              narrative_beat: "Con solo 5 monedas disponibles, Liruf decide entre tres cajas cuál le conviene más abrir, usando lo que aprendió del valor promedio."
              difficulty: 4
              suggested_families: [choice, analyze]
        - position: 5
          slug: ganar-una-vez-no-prueba-nada
          title_es: "Ganar una vez no prueba nada"
          concept: "Ganar una vez con una apuesta riesgosa no prueba que la apuesta sea buena - hay que ver el patrón repetido."
          learning_objective: "El aprendiz distingue una decisión basada en un patrón repetido de una basada en un solo resultado con suerte."
          key_vocabulary: [patrón repetido, resultado único, suerte]
          prior_knowledge: "Decide entre cajas con intentos limitados (tema anterior)."
          fact_refs: []
          parent_check: "Preguntale a {{name}} si ganar una vez en algo riesgoso significa que siempre va a funcionar - y por qué no."
          lessons:
            - position: 1
              slug: liruf-gana-la-primera-vez
              micro_objective: "Reconoce que ganar una vez con una apuesta riesgosa no prueba que la apuesta sea buena en promedio."
              narrative_beat: "Liruf gana el premio grande de la caja rara en su primer intento y quiere seguir abriendo - Rho le recuerda que una vez no es un patrón."
              difficulty: 4
              suggested_families: [story, choice]
            - position: 2
              slug: patron-o-suerte
              micro_objective: "Distingue, entre dos personajes, cuál está decidiendo con base en un patrón repetido y cuál con base en un solo resultado suerte."
              narrative_beat: "Zara compara: ella decide con el registro de 20 intentos, Liruf decide solo con su única victoria - no es la misma evidencia."
              difficulty: 4
              suggested_families: [choice, analyze]
        - position: 6
          slug: aplico-el-valor-esperado-a-una-decision-real
          title_es: "Aplico el valor esperado a una decisión real"
          concept: "Aplica la misma lógica de las cajas de recompensa a una decisión de riesgo real, no solo a un videojuego."
          learning_objective: "El aprendiz traduce la lógica de frecuencia y premio de las cajas a una decisión de riesgo real, fuera del videojuego."
          key_vocabulary: [decisión real, traducir la lógica]
          prior_knowledge: "Distingue patrón repetido de un resultado de suerte (tema anterior)."
          fact_refs: []
          parent_check: "Pidele a {{name}} que use la lógica de las cajas de recompensa para evaluar una decisión de riesgo real que tenga pendiente."
          lessons:
            - position: 1
              slug: traduzco-la-logica-de-las-cajas
