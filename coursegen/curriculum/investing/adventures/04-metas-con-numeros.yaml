              micro_objective: "Calcula el monto de un colchón simple (un porcentaje extra) sobre el precio actual de una meta."
              narrative_beat: "Zara calcula un colchón del 10% extra sobre el precio actual de su meta, para protegerse de una posible subida."
              difficulty: 4
              suggested_families: [money, input]
        - position: 5
          slug: comparo-meta-sin-colchon-y-con-colchon
