schema_version: 1

adventure:
  position: 4
  slug: metas-con-numeros
  theme: valley
  age_tier: tier4
  title:
    en-US: "Goals With Numbers"
    es-MX: "Metas con Números"
    pt-BR: "Metas com Numeros"
  description:
    en-US: "In the Valley of Goals, the team turns a vague want into a real numeric goal - amount, deadline, weekly plan - and learns that prices don't hold still while you save."
    es-MX: "En el Valle de las Metas, el equipo convierte un deseo vago en una meta numérica real - monto, fecha, plan semanal - y aprende que los precios no se quedan quietos mientras ahorras."
    pt-BR: "No Vale das Metas, a equipe transforma um desejo vago em uma meta numerica real - valor, prazo, plano semanal - e aprende que os precos nao ficam parados enquanto voce economiza."
  narrative_arc: "Dina, Liruf, Rho y Zara acampan en el Valle de las Metas, donde aprenden a convertir un 'quiero algo' en una meta real con monto exacto y fecha. Descubren que los precios pueden subir mientras ahorran, y que un colchón extra protege una meta de esa subida. Después dividen su meta en un plan semana a semana con números reales, y cuando un plan no alcanza, aprenden las tres formas de ajustarlo: ahorrar más, esperar más, o elegir algo más barato. Terminan armando y defendiendo un plan financiero completo frente al consejo del valle."

sagas:
  - position: 1
    slug: de-quiero-algo-a-una-meta-real
    icon: flag
    title:
      en-US: "From 'I Want Something' to a Real Goal"
      es-MX: "De Quiero Algo a Una Meta Real"
      pt-BR: "De Quero Algo a Uma Meta Real"
    description:
      en-US: "'I want new headphones' is not a goal yet - a real goal needs an exact amount and a date."
      es-MX: "'Quiero unos audífonos nuevos' todavía no es una meta - una meta real necesita un monto exacto y una fecha."
      pt-BR: "'Quero um fone novo' ainda nao e uma meta - uma meta real precisa de um valor exato e uma data."
    topics:
        - position: 1
          slug: quiero-algo-no-es-una-meta
          title_es: "Quiero algo no es una meta"
          concept: "Un deseo como 'quiero unos audífonos nuevos' no es una meta todavía - una meta real necesita un monto exacto y una fecha."
          learning_objective: "El aprendiz distingue un deseo vago de una meta real, identificando qué le falta (monto, fecha, o ambos)."
          key_vocabulary: [deseo vago, meta real, monto, fecha]
          prior_knowledge: "Ninguno - es el punto de partida de esta aventura."
          fact_refs: []
          parent_check: "Preguntale a {{name}} qué es lo que más quiere ahorrar ahora mismo, y si ya sabe el monto exacto y la fecha."
          lessons:
            - position: 1
              slug: liruf-no-sabe-cuanto-ni-cuando
              micro_objective: "Reconoce que un deseo vago ('quiero unos audífonos nuevos') no es una meta todavía porque le falta monto y fecha."
              narrative_beat: "Liruf dice: 'quiero unos audífonos nuevos'. Dina le pregunta: '¿cuánto cuestan? ¿para cuándo los quieres?' - Liruf no sabe ninguna de las dos."
              difficulty: 1
              suggested_families: [story, choice]
            - position: 2
              slug: deseo-o-meta
              micro_objective: "Distingue, entre 4 frases, cuáles son deseos vagos y cuáles ya tienen forma de meta."
              narrative_beat: "Zara revisa cuatro frases en la pizarra del valle y marca cuáles todavía son solo deseos."
              difficulty: 2
              suggested_families: [choice, analyze]
        - position: 2
          slug: le-pongo-un-numero-exacto
          title_es: "Le pongo un número exacto"
          concept: "Convierte un deseo vago en un monto exacto de dinero usando el precio real del objeto."
          learning_objective: "El aprendiz convierte un deseo en un monto exacto usando el precio real de un objeto concreto."
          key_vocabulary: [monto exacto, precio real]
          prior_knowledge: "Distingue un deseo vago de una meta real (tema anterior)."
          fact_refs: [mxn.reference_prices.audifonos_inalambricos]
          parent_check: "Ayuda a {{name}} a buscar el precio real del objeto que quiere para su meta."
          lessons:
            - position: 1
              slug: busco-el-precio-real
              micro_objective: "Convierte un deseo vago en un monto exacto de dinero usando el precio real del objeto."
              narrative_beat: "Liruf busca el precio real de los audífonos inalámbricos que quiere: 900 pesos - ahora su deseo tiene un número."
              difficulty: 2
              suggested_families: [input, money]
            - position: 2
              slug: elijo-entre-dos-versiones
              micro_objective: "Compara dos versiones del mismo objeto con precios distintos y elige el monto exacto para su meta."
              narrative_beat: "Zara compara dos versiones de tenis de moda con precios distintos y decide cuál monto exacto usar para su meta."
              difficulty: 3
              suggested_families: [choice, money]
        - position: 3
          slug: le-pongo-una-fecha
          title_es: "Le pongo una fecha"
          concept: "Una meta sin fecha se puede posponer para siempre - ponerle una fecha la vuelve real."
          learning_objective: "El aprendiz reconoce la necesidad de una fecha en una meta y elige una fecha razonable para un caso dado."
          key_vocabulary: [fecha, posponer, razonable]
          prior_knowledge: "Convierte un deseo en un monto exacto (tema anterior)."
          fact_refs: []
          parent_check: "Preguntale a {{name}} para cuándo quiere lograr su meta - una fecha concreta, no 'algún día'."
          lessons:
            - position: 1
              slug: rho-nunca-lo-penso
              micro_objective: "Reconoce que una meta sin fecha se puede posponer para siempre, y le pone una fecha concreta a un deseo con monto."
              narrative_beat: "Rho tiene el monto de su meta claro, pero sin fecha - Dina le pregunta: '¿para cuándo?' y Rho se da cuenta de que nunca lo había pensado."
              difficulty: 3
              suggested_families: [story, choice]
            - position: 2
              slug: elijo-una-fecha-razonable
              micro_objective: "Elige una fecha razonable para una meta dada, ni tan pronto que sea imposible, ni tan lejos que pierda sentido."
              narrative_beat: "Zara elige una fecha para su meta: ni la próxima semana (imposible) ni en cinco años (sin sentido para ese objeto)."
              difficulty: 3
              suggested_families: [choice, analyze]
        - position: 4
          slug: comparo-metas-completas-e-incompletas
          title_es: "Comparo metas completas e incompletas"
          concept: "Comparar varias metas descritas permite detectar cuáles les falta monto, fecha, o ambas."
          learning_objective: "El aprendiz detecta, entre varias metas, cuáles están incompletas y completa la parte que falta."
          key_vocabulary: [meta incompleta, completar]
          prior_knowledge: "Elige una fecha razonable para una meta (tema anterior)."
          fact_refs: []
          parent_check: "Revisa junto a {{name}} tres metas que se le ocurran y detecten juntos cuáles están incompletas."
          lessons:
            - position: 1
              slug: reviso-cuatro-metas
              micro_objective: "Compara varias metas descritas y detecta cuáles les falta monto, fecha, o ambas."
              narrative_beat: "El equipo revisa cuatro metas escritas por distintos cadetes del valle y detecta a cuáles les falta una parte."
              difficulty: 3
