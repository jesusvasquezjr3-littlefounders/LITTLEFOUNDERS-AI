          prior_knowledge: "Calcula cuánto subió un precio en pesos y porcentaje (tema anterior)."
          fact_refs: []
          parent_check: "Preguntale a {{name}} si le conviene ahorrar un poco más de lo que cuesta hoy su meta, 'por si acaso' sube el precio."
          lessons:
