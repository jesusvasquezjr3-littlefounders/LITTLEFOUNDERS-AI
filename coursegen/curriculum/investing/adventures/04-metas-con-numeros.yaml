              narrative_beat: "Zara termina de ahorrar el monto exacto que había planeado, pero el objeto ya subió de precio - le falta un poco."
              difficulty: 2
              suggested_families: [story, analyze]
            - position: 2
              slug: calculo-cuanto-le-falta
              micro_objective: "Calcula cuánto le falta a un plan de ahorro cuando el precio de la meta sube después de haber empezado a ahorrar."
              narrative_beat: "Rho calcula exactamente cuánto le falta a su plan, ahora que el precio de su meta subió un poco."
              difficulty: 3
              suggested_families: [money, input]
        - position: 3
          slug: calculo-cuanto-subio
          title_es: "Calculo cuánto subió"
          concept: "Un ejemplo verificable de subida de precio (100 a 110) muestra cuánto subió en pesos y en porcentaje."
          learning_objective: "El aprendiz calcula, con un ejemplo didáctico, cuánto subió un precio en pesos y en porcentaje, y aplica el mismo cálculo a otro monto."
          key_vocabulary: [subida de precio, porcentaje]
          prior_knowledge: "Calcula cuánto le falta a un plan cuando el precio sube (tema anterior)."
          fact_refs: [money.inflation_example_100_to_110]
