              difficulty: 5
              suggested_families: [choice, analyze]
  - position: 2
    slug: cuando-las-cosas-suben-de-precio
    icon: trending_up
    title:
      en-US: "When Things Get More Expensive"
      es-MX: "Cuando las Cosas Suben de Precio"
      pt-BR: "Quando as Coisas Ficam Mais Caras"
    description:
      en-US: "Prices don't hold still - learn why a fixed savings goal needs a cushion against a rising price."
      es-MX: "Los precios no se quedan quietos - aprende por qué una meta de ahorro fija necesita un colchón contra un precio que sube."
      pt-BR: "Os precos nao ficam parados - aprenda por que uma meta de poupanca fixa precisa de uma reserva contra um preco que sobe."
    topics:
        - position: 1
          slug: los-precios-no-se-quedan-quietos
          title_es: "Los precios no se quedan quietos"
          concept: "El precio de las cosas puede subir con el tiempo, aunque tú sigas ahorrando el mismo plan."
          learning_objective: "El aprendiz reconoce, con un ejemplo concreto, que los precios pueden subir con el tiempo."
          key_vocabulary: [precio, subir con el tiempo]
          prior_knowledge: "Completo De Quiero Algo a Una Meta Real (saga anterior)."
          fact_refs: []
          parent_check: "Preguntale a {{name}} si ha notado que algo que quiere comprar cuesta más ahora que hace unos meses."
          lessons:
            - position: 1
              slug: el-precio-que-cambio
              micro_objective: "Reconoce que el precio de las cosas puede subir con el tiempo, aunque tú sigas ahorrando el mismo plan."
              narrative_beat: "Rho mira el precio de los audífonos que quiere: hace unos meses costaban menos - los precios no se quedaron quietos."
              difficulty: 1
              suggested_families: [story, choice]
            - position: 2
              slug: encuentro-un-ejemplo-propio
              micro_objective: "Identifica, en un caso, un ejemplo concreto de algo que subió de precio con el tiempo."
              narrative_beat: "Liruf compara el precio de su videojuego favorito hoy contra el precio que recuerda de hace un año."
              difficulty: 2
              suggested_families: [choice, analyze]
        - position: 2
          slug: mi-meta-que-se-mueve
