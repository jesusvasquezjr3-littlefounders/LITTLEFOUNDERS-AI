              narrative_beat: "El equipo arma el formato en la pizarra: 'quiero ___, cuesta ___, para el ___' y lo llenan juntos con un ejemplo real."
              difficulty: 4
              suggested_families: [storyplay, input]
            - position: 2
              slug: escribo-mi-meta-solo
              micro_objective: "Aplica, sin ayuda, el formato de una sola frase a su propia meta real."
              narrative_beat: "Rho escribe solo, sin ayuda, su propia meta completa en una sola frase usando el formato del equipo."
              difficulty: 4
              suggested_families: [input, storyplay]
        - position: 6
          slug: reviso-mi-primera-meta
          title_es: "Reviso mi primera meta"
          concept: "Revisa la meta propia contra un checklist de tres partes (objeto, monto, fecha) y corrige lo que falte."
