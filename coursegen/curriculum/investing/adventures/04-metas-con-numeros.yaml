          key_vocabulary: [checklist, corregir]
          prior_knowledge: "Redacta una meta propia en una sola frase (tema anterior)."
          fact_refs: []
          parent_check: "Revisa junto a {{name}} su meta contra el checklist de tres partes: ¿tiene objeto, monto y fecha?"
          lessons:
            - position: 1
