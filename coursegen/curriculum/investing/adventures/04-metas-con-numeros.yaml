          concept: "Si el precio de tu meta sube mientras ahorras, el monto que planeaste ya no alcanza - tu meta 'se movió'."
          learning_objective: "El aprendiz reconoce y calcula cuánto le falta a un plan de ahorro cuando el precio de la meta sube."
          key_vocabulary: [meta que se mueve, le falta]
          prior_knowledge: "Reconoce que los precios pueden subir con el tiempo (tema anterior)."
          fact_refs: []
          parent_check: "Preguntale a {{name}} qué pasaría con su meta si el precio del objeto sube justo antes de que termine de ahorrar."
