            - position: 2
              slug: completo-la-parte-que-falta
              micro_objective: "Completa una meta incompleta agregando la parte que le falta (monto o fecha)."
              narrative_beat: "Liruf completa su propia meta agregando la fecha que había olvidado poner."
              difficulty: 4
              suggested_families: [choice, input]
        - position: 5
          slug: mi-meta-en-una-frase
          title_es: "Mi meta en una frase"
          concept: "Redacta una meta propia en una sola frase con objeto, monto y fecha."
          learning_objective: "El aprendiz redacta una meta propia completa en una sola frase, usando un formato de tres partes."
          key_vocabulary: [formato de meta, una sola frase]
          prior_knowledge: "Completa una meta incompleta (tema anterior)."
          fact_refs: []
          parent_check: "Pidele a {{name}} que te diga su meta completa en una sola frase: quiero ___, cuesta ___, para el ___."
          lessons:
            - position: 1
              slug: armamos-el-formato-de-meta
