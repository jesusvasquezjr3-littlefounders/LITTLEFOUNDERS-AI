schema_version: 1

adventure:
  position: 5
  slug: canastas-y-fondos
  theme: kingdom
  age_tier: tier4
  title:
    en-US: "Baskets and Funds"
    es-MX: "Canastas y Fondos"
    pt-BR: "Cestas e Fundos"
  description:
    en-US: "In the League of Guilds, the team learns that a basket holding small pieces of many things beats betting everything on one - and that a real index quietly follows the whole group instead of guessing a winner."
    es-MX: "En la Liga de los Gremios, el equipo aprende que una canasta con pedacitos de muchas cosas le gana a apostar todo a una sola - y que un índice de verdad sigue a todo el grupo en vez de adivinar un ganador."
    pt-BR: "Na Liga das Guildas, a equipe aprende que uma cesta com pedacos de muitas coisas vence apostar tudo em uma so - e que um indice de verdade segue todo o grupo em vez de adivinhar um vencedor."
  narrative_arc: "Dina, Liruf, Rho y Zara llegan a la Liga de los Gremios, una federación de casas comerciales donde aprenden que comprar un pedacito de muchas cosas (una canasta) reparte mejor el riesgo que comprar una sola cosa completa. Descubren la metáfora de no poner todas las monedas en una sola canoa, aprenden que diversificar de verdad significa elegir piezas que no fallan todas juntas, conocen los índices que siguen automáticamente a un grupo entero en vez de intentar adivinar un ganador, y terminan armando, simulando y defendiendo su propia canasta final frente a la asamblea de gremios."

sagas:
  - position: 1
    slug: un-pedacito-de-muchas-cosas
    icon: category
    title:
      en-US: "A Little Piece of Many Things"
      es-MX: "Un Pedacito de Muchas Cosas"
      pt-BR: "Um Pedacinho de Muitas Coisas"
    description:
      en-US: "Instead of buying one whole thing, own a small piece of many things at once - that's a basket."
      es-MX: "En vez de comprar una cosa completa, ten un pedacito de muchas cosas a la vez - eso es una canasta."
      pt-BR: "Em vez de comprar uma coisa inteira, tenha um pedacinho de muitas coisas ao mesmo tempo - isso e uma cesta."
    topics:
        - position: 1
          slug: que-es-una-canasta-de-inversion
          title_es: "Qué es una canasta de inversión"
          concept: "Una canasta (fondo) agrupa pedacitos de muchas cosas distintas en un solo lugar, en vez de comprar una sola cosa completa."
          learning_objective: "El aprendiz reconoce que una canasta agrupa pedacitos de muchas cosas distintas, y la distingue de comprar una sola cosa completa."
          key_vocabulary: [canasta, fondo, pedacitos]
          prior_knowledge: "Ninguno - es el punto de partida de esta aventura."
          fact_refs: []
          parent_check: "Preguntale a {{name}} qué cree que significa 'una canasta de inversión' comparado con comprar una sola cosa."
          lessons:
            - position: 1
              slug: la-canasta-del-mercado
              micro_objective: "Reconoce que una canasta (fondo) agrupa pedacitos de muchas cosas distintas en un solo lugar."
              narrative_beat: "Dina le muestra a Liruf una canasta en el mercado del gremio: no tiene una sola cosa adentro, tiene pedacitos de diez cosas distintas."
              difficulty: 1
              suggested_families: [story, choice]
            - position: 2
              slug: comparo-cosa-completa-y-canasta
              micro_objective: "Explica, con sus palabras, la diferencia entre comprar una cosa completa y comprar una canasta con pedacitos de varias."
              narrative_beat: "Liruf compara comprar una cosa completa contra comprar la canasta - ahora entiende que la canasta reparte entre varias a la vez."
              difficulty: 2
              suggested_families: [choice, analyze]
        - position: 2
          slug: un-pedacito-no-es-lo-mismo-que-todo
          title_es: "Un pedacito no es lo mismo que todo"
          concept: "Comprar un pedacito de algo (una acción) es distinto a comprar la cosa completa - cuesta menos y puedes tener pedacitos de varias cosas a la vez."
          learning_objective: "El aprendiz reconoce que un pedacito cuesta menos que la cosa completa y calcula cuántos pedacitos caben en el mismo presupuesto."
          key_vocabulary: [pedacito, acción, presupuesto]
          prior_knowledge: "Distingue una cosa completa de una canasta de pedacitos (tema anterior)."
          fact_refs: []
          parent_check: "Preguntale a {{name}} si preferiría comprar una cosa completa o pedacitos de varias cosas distintas con el mismo dinero."
          lessons:
            - position: 1
              slug: zara-compra-un-pedacito
              micro_objective: "Reconoce que comprar un pedacito de algo (una acción) cuesta menos que comprar la cosa completa."
              narrative_beat: "Zara descubre que puede comprar un pedacito de un gremio grande, sin tener que pagar el gremio entero."
              difficulty: 2
              suggested_families: [story, money]
            - position: 2
              slug: cuantos-pedacitos-con-el-mismo-dinero
              micro_objective: "Calcula cuántos pedacitos distintos se pueden comprar con el mismo dinero que costaría una sola cosa completa."
              narrative_beat: "Rho calcula: con lo que cuesta una cosa completa, puede comprar pedacitos de cinco cosas distintas en su lugar."
              difficulty: 3
              suggested_families: [money, input]
        - position: 3
          slug: cuantos-pedacitos-caben-en-una-canasta
          title_es: "Cuántos pedacitos caben en una canasta"
          concept: "Una canasta puede contener pedacitos de decenas o cientos de cosas distintas a la vez."
          learning_objective: "El aprendiz reconoce que una canasta puede contener muchos pedacitos distintos y compara una canasta chica contra una grande."
          key_vocabulary: [canasta chica, canasta grande]
          prior_knowledge: "Calcula cuántos pedacitos caben en un presupuesto (tema anterior)."
          fact_refs: []
          parent_check: "Preguntale a {{name}} si cree que una canasta puede tener pedacitos de más de 50 cosas distintas a la vez."
          lessons:
            - position: 1
              slug: la-canasta-de-cien-pedacitos
              micro_objective: "Reconoce que una canasta puede contener pedacitos de decenas o cientos de cosas distintas a la vez."
              narrative_beat: "Dina abre una canasta grande del gremio: adentro hay pedacitos de cien gremios distintos, no solo diez."
              difficulty: 3
              suggested_families: [story, analyze]
            - position: 2
              slug: comparo-canasta-chica-y-grande
              micro_objective: "Compara una canasta chica (pocos pedacitos) contra una canasta grande (muchos pedacitos) y describe la diferencia."
              narrative_beat: "Zara compara dos canastas: una con 5 pedacitos, otra con 50 - describe cómo se ve cada una por dentro."
              difficulty: 3
              suggested_families: [analyze, choice]
        - position: 4
          slug: comparo-comprar-uno-o-comprar-una-canasta
          title_es: "Comparo comprar uno o comprar una canasta"
          concept: "Comparar el resultado de comprar una sola cosa completa contra comprar pedacitos de varias muestra la ventaja de la canasta cuando una sale mal."
          learning_objective: "El aprendiz compara el resultado de comprar una cosa completa contra una canasta de pedacitos, cuando una de las piezas sale mal."
          key_vocabulary: [sale mal, comparar resultados]
          prior_knowledge: "Compara una canasta chica contra una grande (tema anterior)."
          fact_refs: []
          parent_check: "Preguntale a {{name}} qué le conviene más: comprar una sola cosa completa, o pedacitos de varias cosas distintas."
          lessons:
            - position: 1
              slug: liruf-una-cosa-zara-una-canasta
              micro_objective: "Compara el resultado de comprar una sola cosa completa contra comprar pedacitos de varias, cuando una de ellas sale mal."
              narrative_beat: "Liruf compró un gremio entero que tuvo un mal año; Zara compró pedacitos de diez gremios y solo uno tuvo un mal año."
              difficulty: 3
              suggested_families: [story, analyze]
            - position: 2
              slug: decido-que-camino-tomar
              micro_objective: "Decide, en un caso nuevo, si conviene más comprar una sola cosa completa o una canasta de pedacitos."
              narrative_beat: "Con el ejemplo de Liruf y Zara claro, Rho decide qué camino tomar para su propio dinero."
              difficulty: 4
              suggested_families: [choice, analyze]
        - position: 5
          slug: quien-arma-la-canasta
          title_es: "Quién arma la canasta"
          concept: "Alguien (un gremio o fondo) arma y administra la canasta por ti, agrupando los pedacitos."
          learning_objective: "El aprendiz reconoce que un fondo administra la canasta por el ahorrador, y distingue eso de buscar cada pedacito uno por uno."
          key_vocabulary: [administrar, agrupar]
          prior_knowledge: "Decide entre comprar una cosa completa o una canasta (tema anterior)."
          fact_refs: []
          parent_check: "Preguntale a {{name}} si sabía que un fondo puede armar y administrar una canasta completa por ti."
          lessons:
            - position: 1
              slug: el-gremio-arma-la-canasta
              micro_objective: "Reconoce que alguien (un gremio o fondo) arma y administra la canasta por ti, agrupando los pedacitos."
              narrative_beat: "Dina explica: un gremio especializado arma la canasta completa por ti, así no tienes que buscar cada pedacito uno por uno."
              difficulty: 4
              suggested_families: [story, choice]
            - position: 2
              slug: buscar-yo-mismo-o-recibirla-armada
              micro_objective: "Distingue, en un caso, la diferencia entre buscar cada pedacito uno por uno y dejar que un gremio arme la canasta completa."
              narrative_beat: "Zara compara el trabajo de armar su propia canasta pedacito por pedacito contra dejar que un gremio ya se la entregue armada."
              difficulty: 4
              suggested_families: [choice, analyze]
        - position: 6
          slug: mi-primera-canasta-simple
          title_es: "Mi primera canasta simple"
          concept: "Arma una canasta simple propia eligiendo varios pedacitos distintos en vez de uno solo."
          learning_objective: "El aprendiz arma, sin ayuda, una canasta propia con al menos 4 pedacitos distintos."
          key_vocabulary: [canasta simple, pedacitos distintos]
          prior_knowledge: "Distingue armar la canasta uno mismo de recibirla ya armada (tema anterior)."
          fact_refs: []
          parent_check: "Ayuda a {{name}} a imaginar su primera canasta simple: al menos 4 cosas distintas, no una sola."
          lessons:
            - position: 1
              slug: armamos-la-primera-canasta-en-equipo
              micro_objective: "Con apoyo, arma una canasta simple propia eligiendo varios pedacitos distintos en vez de uno solo."
              narrative_beat: "El equipo arma junto su primera canasta simple, eligiendo pedacitos de varios gremios distintos del mercado."
              difficulty: 4
              suggested_families: [storyplay, arrange]
            - position: 2
              slug: armo-mi-canasta-solo
              micro_objective: "Aplica, sin ayuda, lo aprendido para armar su propia canasta con al menos 4 pedacitos distintos."
              narrative_beat: "Rho arma solo, sin ayuda, su propia canasta con pedacitos de cuatro gremios distintos del mercado."
              difficulty: 5
              suggested_families: [arrange, money]
        - position: 7
          slug: repaso-un-pedacito-de-muchas-cosas
          kind: review_spaced
          title_es: "Repaso: Un Pedacito de Muchas Cosas"
          concept: "El equipo repasa la diferencia entre comprar una cosa completa y una canasta de pedacitos antes de aprender a no repetir el mismo tipo de pieza."
          learning_objective: "El aprendiz recuerda y aplica, sin nueva enseñanza, la diferencia entre comprar una cosa completa y comprar pedacitos en una canasta."
          key_vocabulary: [cosa completa, canasta de pedacitos]
          prior_knowledge: "Completo los 6 temas de Un Pedacito de Muchas Cosas."
          fact_refs: []
          review_of:
            - canastas-y-fondos/un-pedacito-de-muchas-cosas/que-es-una-canasta-de-inversion
            - canastas-y-fondos/un-pedacito-de-muchas-cosas/un-pedacito-no-es-lo-mismo-que-todo
            - canastas-y-fondos/un-pedacito-de-muchas-cosas/cuantos-pedacitos-caben-en-una-canasta
            - canastas-y-fondos/un-pedacito-de-muchas-cosas/comparo-comprar-uno-o-comprar-una-canasta
            - canastas-y-fondos/un-pedacito-de-muchas-cosas/quien-arma-la-canasta
            - canastas-y-fondos/un-pedacito-de-muchas-cosas/mi-primera-canasta-simple
          lessons:
            - position: 1
              slug: repaso-cosa-completa-o-canasta
              micro_objective: "Recuerda y aplica, sin ayuda, la diferencia entre comprar una cosa completa y comprar pedacitos en una canasta."
              narrative_beat: "El equipo repasa el mercado del gremio y vuelve a distinguir, sin ayuda, cosas completas de canastas de pedacitos."
              difficulty: 3
              suggested_families: [choice, analyze]
            - position: 2
              slug: repaso-armo-canasta-nueva
              micro_objective: "Aplica sin ayuda todo lo repasado: arma una canasta nueva con varios pedacitos distintos."
              narrative_beat: "Zara arma, sin ayuda de nadie, una canasta nueva combinando varios pedacitos distintos del mercado."
              difficulty: 4
              suggested_families: [arrange, money]
        - position: 8
          slug: cruce-pedacitos-y-canasta-completa
          kind: review_interleaved
          title_es: "Cruce: Pedacitos y Canasta Completa"
          concept: "Mezclamos la idea de comprar pedacitos con la de dejar que un gremio arme la canasta para evaluar una opción nueva."
          learning_objective: "El aprendiz combina, sin nueva enseñanza, al menos dos señales de esta saga para evaluar una decisión de canasta."
          key_vocabulary: [pedacitos, canasta armada]
          prior_knowledge: "Completo el repaso de Un Pedacito de Muchas Cosas (tema anterior)."
          fact_refs: []
          review_of:
