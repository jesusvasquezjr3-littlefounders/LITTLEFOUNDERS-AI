            - canastas-y-fondos/un-pedacito-de-muchas-cosas/comparo-comprar-uno-o-comprar-una-canasta
            - canastas-y-fondos/un-pedacito-de-muchas-cosas/quien-arma-la-canasta
          lessons:
            - position: 1
              slug: junto-pedacitos-y-canasta-armada
              micro_objective: "Combina la idea de comprar pedacitos con la de dejar que un gremio arme la canasta para evaluar una opción nueva."
              narrative_beat: "Rho junta dos ideas: comprar pedacitos en vez de una cosa completa Y dejar que un gremio arme la canasta, para un caso nuevo."
              difficulty: 4
              suggested_families: [analyze, choice]
            - position: 2
              slug: evaluo-una-decision-de-canasta
              micro_objective: "Evalúa, sin ayuda, una decisión nueva combinando el costo de un pedacito con el resultado de repartir entre varios."
              narrative_beat: "Zara decide en segundos si le conviene una canasta nueva, cruzando el costo de los pedacitos con el resultado de repartir entre varios."
              difficulty: 5
              suggested_families: [choice, analyze]
  - position: 2
    slug: no-todo-en-una-sola-canasta
    icon: shield
    title:
      en-US: "Not Everything in One Basket"
      es-MX: "No Todo en Una Sola Canasta"
      pt-BR: "Nao Tudo em Uma So Cesta"
    description:
      en-US: "Don't put all your coins in one canoe - and make sure your pieces don't all sink for the same reason."
      es-MX: "No pongas todas tus monedas en una sola canoa - y asegúrate de que tus piezas no se hundan todas por la misma razón."
      pt-BR: "Nao coloque todas as suas moedas em uma so canoa - e garanta que suas pecas nao afundem todas pelo mesmo motivo."
    topics:
        - position: 1
          slug: la-metafora-de-las-canoas
          title_es: "La metáfora de las canoas"
          concept: "No pongas todas tus monedas en una sola canoa - si esa canoa se voltea, pierdes todo; repartidas en varias, una que se voltee no te hunde."
          learning_objective: "El aprendiz reconoce, con la metáfora de las canoas, que repartir entre varias reduce el golpe si una falla."
          key_vocabulary: [canoa, repartir, hundir]
          prior_knowledge: "Completo Un Pedacito de Muchas Cosas (saga anterior)."
          fact_refs: [risk.diversification_metaphor]
          parent_check: "Preguntale a {{name}} qué pasaría si todas sus monedas estuvieran en una sola canoa que se voltea."
          lessons:
            - position: 1
              slug: rho-explica-las-canoas
              micro_objective: "Reconoce, con la metáfora de las canoas, que repartir entre varias reduce el golpe si una se voltea."
              narrative_beat: "Rho le explica a Liruf: 'no pongas todas tus monedas en una sola canoa - si esa canoa se voltea, pierdes todo'."
              difficulty: 1
              suggested_families: [story, choice]
            - position: 2
              slug: explico-la-canoa-que-se-voltea
              micro_objective: "Explica, con sus palabras, qué pasaría si todas las monedas de un personaje estuvieran en una sola canoa que se voltea."
              narrative_beat: "Liruf explica con sus palabras qué le pasaría a todas sus monedas si estuvieran en una sola canoa que se voltea."
              difficulty: 2
              suggested_families: [choice, analyze]
        - position: 2
          slug: diversificar-en-una-palabra
          title_es: "Diversificar, en una palabra"
          concept: "Repartir entre varias cosas distintas para que ninguna sola pueda hundirte se llama diversificar."
          learning_objective: "El aprendiz nombra 'diversificar' como el acto de repartir entre varias cosas distintas, e identifica cuándo un caso lo muestra."
          key_vocabulary: [diversificar]
          prior_knowledge: "Reconoce la metáfora de las canoas (tema anterior)."
          fact_refs: []
          parent_check: "Pidele a {{name}} que use la palabra 'diversificar' en una frase sobre su propio dinero o sus propias cosas."
          lessons:
            - position: 1
              slug: le-ponemos-nombre
              micro_objective: "Reconoce que repartir entre varias cosas distintas para que ninguna sola pueda hundirte se llama diversificar."
              narrative_beat: "Dina le da nombre a lo que ya hicieron: 'repartir entre varias cosas distintas para que ninguna sola te hunda se llama diversificar'."
              difficulty: 2
              suggested_families: [story, choice]
            - position: 2
              slug: identifico-diversificacion
              micro_objective: "Identifica, en 4 casos, cuáles muestran diversificación y cuáles muestran todo concentrado en un solo lugar."
              narrative_beat: "Zara revisa cuatro canastas del mercado y marca cuáles están diversificadas y cuáles no."
              difficulty: 3
              suggested_families: [choice, analyze]
        - position: 3
          slug: que-tan-parecidas-son-las-piezas
          title_es: "Qué tan parecidas son las piezas"
          concept: "Diversificar de verdad significa elegir piezas que no fallan todas por la misma razón al mismo tiempo, no solo muchas piezas parecidas."
          learning_objective: "El aprendiz reconoce que muchas piezas parecidas no diversifican de verdad, y compara dos canastas por qué tan variadas son sus piezas."
          key_vocabulary: [piezas parecidas, fallar juntas]
          prior_knowledge: "Nombra 'diversificar' e identifica ejemplos (tema anterior)."
          fact_refs: []
          parent_check: "Preguntale a {{name}} si diez piezas del mismo tipo cuentan como una canasta bien diversificada."
          lessons:
            - position: 1
              slug: diez-pedacitos-del-mismo-tipo
              micro_objective: "Reconoce que diversificar de verdad significa elegir piezas que no fallan todas por la misma razón al mismo tiempo."
              narrative_beat: "Rho nota que su canasta tiene diez pedacitos, pero todos son del mismo tipo de gremio - si algo golpea a ese tipo, los diez caen juntos."
              difficulty: 3
              suggested_families: [story, analyze]
            - position: 2
              slug: comparo-dos-canastas-de-diez
              micro_objective: "Compara dos canastas con el mismo número de piezas y decide cuál está mejor diversificada según qué tan parecidas son sus piezas."
              narrative_beat: "Zara compara dos canastas de diez piezas cada una: una con piezas muy parecidas, otra con piezas de tipos distintos."
              difficulty: 3
              suggested_families: [analyze, choice]
        - position: 4
          slug: comparo-una-canasta-parecida-y-una-variada
          title_es: "Comparo una canasta parecida y una variada"
          concept: "Comparar una canasta con piezas muy parecidas contra una con piezas variadas muestra el efecto cuando algo golpea a un tipo de pieza."
          learning_objective: "El aprendiz compara el resultado de una canasta parecida contra una variada cuando un evento golpea a un tipo de pieza, y evalúa una canasta nueva."
          key_vocabulary: [golpear un tipo, canasta variada]
          prior_knowledge: "Compara dos canastas por qué tan variadas son (tema anterior)."
          fact_refs: []
          parent_check: "Preguntale a {{name}} qué le pasaría a una canasta si todas sus piezas fueran del mismo tipo y ese tipo tuviera un mal momento."
          lessons:
            - position: 1
              slug: el-golpe-que-cae-parejo-o-no
              micro_objective: "Compara el resultado de una canasta con piezas muy parecidas contra una con piezas variadas, cuando algo golpea a un tipo de pieza."
              narrative_beat: "Cuando un problema golpea a un tipo de gremio, la canasta de Rho (toda parecida) cae completa; la de Zara (variada) casi no se mueve."
              difficulty: 3
              suggested_families: [story, analyze]
            - position: 2
              slug: decido-si-esta-lo-bastante-variada
              micro_objective: "Decide, para una canasta nueva, si sus piezas están lo suficientemente variadas entre sí."
              narrative_beat: "Rho revisa una canasta nueva y decide si sus piezas son lo bastante distintas entre sí para llamarla diversificada de verdad."
              difficulty: 4
              suggested_families: [choice, analyze]
        - position: 5
          slug: diversificar-no-elimina-todo-el-riesgo
          title_es: "Diversificar no elimina todo el riesgo"
          concept: "Diversificar reduce el golpe de una sola pieza que falla, pero no elimina el riesgo por completo."
          learning_objective: "El aprendiz reconoce que diversificar reduce pero no elimina el riesgo, y que incluso una canasta bien diversificada puede tener una mala temporada."
          key_vocabulary: [reducir el golpe, mala temporada completa]
          prior_knowledge: "Decide si una canasta está lo bastante variada (tema anterior)."
          fact_refs: []
          parent_check: "Preguntale a {{name}} si diversificar significa que nunca se va a perder nada - y por qué no."
          lessons:
            - position: 1
              slug: diversificar-no-es-magia
              micro_objective: "Reconoce que diversificar reduce el golpe de una pieza que falla, pero no elimina el riesgo por completo."
              narrative_beat: "Dina aclara: 'diversificar no significa que nunca vas a perder nada - significa que una sola mala pieza no te hunde entera'."
              difficulty: 4
              suggested_families: [story, choice]
            - position: 2
              slug: la-mala-temporada-completa
              micro_objective: "Reconoce, en un caso, que incluso una canasta bien diversificada puede tener una mala temporada completa."
              narrative_beat: "Zara ve que, en una mala temporada para todo el archipiélago, incluso su canasta bien diversificada bajó un poco - diversificar ayuda, pero no es magia."
              difficulty: 4
              suggested_families: [choice, analyze]
        - position: 6
          slug: reviso-que-tan-diversificada-esta-mi-canasta
          title_es: "Reviso qué tan diversificada está mi canasta"
          concept: "Revisa una canasta propia y evalúa qué tan variadas son realmente sus piezas."
          learning_objective: "El aprendiz revisa y mejora, sin ayuda, la diversificación real de una canasta propia."
          key_vocabulary: [revisar, mejorar la diversificación]
          prior_knowledge: "Reconoce que diversificar no elimina todo el riesgo (tema anterior)."
          fact_refs: []
          parent_check: "Ayuda a {{name}} a revisar si las piezas de una canasta imaginaria son realmente variadas entre sí."
          lessons:
            - position: 1
