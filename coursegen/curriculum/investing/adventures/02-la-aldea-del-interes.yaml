schema_version: 1
adventure:
  position: 2
  slug: la-aldea-del-interes
  theme: valley
  age_tier: tier2
  title:
    en-US: The Village of Interest
    es-MX: La Aldea del Interés
    pt-BR: A Aldeia do Juro
  description:
    en-US: Dina and Dino reach a valley village where the local savings house gives a small prize for
      coins left saved for a while.
    es-MX: Dina y Dino llegan a una aldea del valle donde la casa de ahorros da un pequeño premio por
      las monedas que se dejan guardadas un tiempo.
    pt-BR: Dina e Dino chegam a uma aldeia do vale onde a casa de poupança dá um pequeno prêmio pelas
      moedas guardadas por um tempo.
  narrative_arc: 'Dina y Dino bajan del bosque a una aldea de valle donde Dr. Rho administra la casa de
    ahorros del pueblo: guardar monedas ahí y dejarlas un tiempo hace aparecer un pequeño premio extra,
    la misma idea del jardín del tiempo aplicada ahora a las monedas. Aprenden a leer libretas, a plantear
    metas con costo y plazo, a abrir su propia cuenta de ahorro infantil junto a un adulto de confianza,
    y a comparar con calma sus opciones -incluyendo reconocer, con las herramientas del Faro de la Confianza,
    una promesa de premio demasiado buena para ser verdad. Al despedirse de la aldea, Dina y Dino están
    listos para zarpar hacia un archipiélago donde no todo premio viene sin riesgo.'
sagas:
- position: 1
  slug: premio-por-guardar
  icon: savings
  title:
    en-US: The Prize for Saving
    es-MX: El Premio por Guardar
    pt-BR: O Prêmio por Guardar
  description:
    en-US: Discover the small extra prize that appears when you leave your coins saved for a while.
    es-MX: Descubre el pequeño premio extra que aparece cuando dejas tus monedas guardadas un tiempo.
    pt-BR: Descubra o pequeno prêmio extra que aparece quando você deixa suas moedas guardadas por um
      tempo.
  topics:
  - position: 1
    slug: una-casa-para-guardar-monedas
    title_es: Una casa para guardar monedas
    concept: En la aldea del valle hay una casa especial donde la gente guarda sus monedas para que estén
      seguras y, además, reciban un premio con el tiempo.
    learning_objective: Al final, el niño puede describir qué es la casa de ahorros de la aldea y para
      qué sirve.
    key_vocabulary:
    - casa de ahorros
    - guardar
    - seguro
    - aldea
    prior_knowledge: Ha aprendido que el tiempo hace crecer lo que se guarda (aventura 1, El Jardín del
      Tiempo).
    parent_check: ¿{{name}} puede explicar qué es un lugar donde se guardan monedas de forma segura y
      por qué conviene usarlo?
    fact_refs: []
    lessons:
    - position: 1
      slug: la-casa-de-piedra-del-valle
      micro_objective: Conocer la casa de ahorros de la aldea como un lugar seguro para guardar monedas.
      narrative_beat: 'Dina y Dino bajan del bosque a un valle donde Dr. Rho los recibe en una pequeña
        casa de piedra llena de libretas y cofres: la casa de ahorros de la aldea.'
      difficulty: 1
      suggested_families:
      - story
      - choice
    - position: 2
      slug: colchon-o-casa-de-ahorros
      micro_objective: Comparar guardar monedas en casa con guardarlas en la casa de ahorros de la aldea.
      narrative_beat: Zara Vex compara guardar monedas debajo del colchón con guardarlas en la casa de
        ahorros, y pide a Dino notar las diferencias.
      difficulty: 2
      suggested_families:
      - analyze
      - choice
    - position: 3
      slug: ademas-de-guardar-un-premio
      micro_objective: Reconocer que la casa de ahorros, además de guardar seguro, da un premio con el
        tiempo.
      narrative_beat: Dr. Rho explica a Dina que la casa de ahorros no solo guarda las monedas seguras,
        sino que además les da un premio con el tiempo.
      difficulty: 2
      suggested_families:
      - choice
      - story
    - position: 4
      slug: explicarle-a-un-vecino
      micro_objective: Aplicar lo aprendido explicando a otro personaje por qué conviene usar la casa
        de ahorros.
      narrative_beat: Frente a una escena nueva de la aldea, Dina explica a un vecino por qué conviene
        guardar sus monedas en la casa de ahorros.
      difficulty: 3
      suggested_families:
      - choice
      - analyze
  - position: 2
    slug: el-premio-que-aparece-solo
    title_es: El premio que aparece solo
    concept: Guardar monedas en la casa de ahorros y dejarlas un tiempo hace que aparezca un pequeño premio
      extra, sin que nadie tenga que trabajar por él.
    learning_objective: Al final, el niño puede explicar que guardar monedas por un tiempo hace aparecer
      un pequeño premio extra.
    key_vocabulary:
    - premio
    - extra
    - aparecer
    - guardar
    prior_knowledge: Conoce la casa de ahorros de la aldea (tema anterior).
    parent_check: ¿{{name}} puede explicar qué es el 'premio' que da un lugar de ahorro por guardar dinero
      un tiempo?
    prerequisites:
    - path: el-jardin-del-tiempo/semilla-que-espera/lo-que-crece-solo-con-el-tiempo
      strength: hard
      reason: El premio del banco es la misma idea del jardín -algo crece solo con el paso del tiempo-
        aplicada ahora a monedas guardadas.
    fact_refs:
    - money.simple_interest_100_year1
    lessons:
    - position: 1
      slug: cien-monedas-se-vuelven-ciento-diez
      micro_objective: Observar que guardar monedas por un tiempo hace aparecer un pequeño premio extra.
      narrative_beat: 'Dina guarda 100 monedas en su libreta y, al volver un año después, Dr. Rho le muestra
        que ahora tiene 110: diez monedas de premio aparecieron solas.'
      difficulty: 1
      suggested_families:
      - story
      - choice
    - position: 2
      slug: de-donde-salio-el-premio
      micro_objective: Explicar que el premio aparece por guardar el dinero con el tiempo, no por trabajo
        adicional.
      narrative_beat: Zara Vex pregunta a Dino de dónde salió el premio, ya que nadie trabajó por esas
        monedas extra.
      difficulty: 2
      suggested_families:
      - choice
      - analyze
    - position: 3
      slug: como-el-arbol-del-bosque
      micro_objective: Relacionar el premio del ahorro con la idea de que las cosas crecen solas con el
        tiempo (aventura 1).
      narrative_beat: 'Dr. Rho compara el premio del ahorro con el árbol del bosque: ambos crecen solos
        si se les da tiempo.'
      difficulty: 2
      suggested_families:
      - choice
      - story
    - position: 4
      slug: predecir-el-premio-de-una-cantidad-nueva
      micro_objective: Aplicar la idea del premio por guardar prediciendo el resultado con una cantidad
        nueva.
      narrative_beat: Con una nueva cantidad guardada, Dina predice cuántas monedas de premio aparecerán
        después de un año.
      difficulty: 3
      suggested_families:
      - money
      - choice
  - position: 3
    slug: cuanto-premio-por-cuanto-guardado
    title_es: Cuánto premio por cuánto guardado
    concept: 'El premio que da la casa de ahorros depende de cuántas monedas se guardaron: guardar más
      da un premio más grande.'
    learning_objective: Al final, el niño puede calcular cuánto premio corresponde a una cantidad guardada,
      usando el mismo porcentaje de premio.
    key_vocabulary:
    - premio
    - cantidad
    - calcular
    - guardado
    prior_knowledge: Sabe que guardar monedas hace aparecer un premio extra (tema anterior).
    parent_check: ¿{{name}} puede calcular, con ayuda, cuánto premio le tocaría a una cantidad guardada?
    fact_refs:
    - money.example_growth_rate_pct
    - money.small_growth_example_20_to_24
    lessons:
    - position: 1
      slug: diez-monedas-por-cada-cien
      micro_objective: Conocer que el premio de la casa de ahorros es una cantidad fija por cada 100 monedas
        guardadas.
      narrative_beat: 'Dr. Rho muestra a Dina su libreta: por cada 100 monedas guardadas, la casa de ahorros
        da 10 monedas de premio al año.'
      difficulty: 1
      suggested_families:
      - story
      - money
    - position: 2
      slug: calcular-el-premio-de-veinte-monedas
      micro_objective: Calcular el premio correspondiente a una cantidad guardada menor, usando la misma
        proporción.
      narrative_beat: Zara Vex reta a Dino a calcular el premio de una cantidad más pequeña guardada,
        usando la misma proporción.
      difficulty: 2
      suggested_families:
      - money
      - choice
    - position: 3
      slug: que-pasa-si-guardo-el-doble
      micro_objective: Predecir que guardar el doble de monedas produce un premio del doble de tamaño.
      narrative_beat: Dr. Rho pregunta a Dina qué le pasará al premio si guarda el doble de monedas que
        antes.
      difficulty: 2
      suggested_families:
      - choice
      - analyze
    - position: 4
      slug: el-premio-de-tres-vecinos
      micro_objective: Aplicar el cálculo del premio a varias cantidades guardadas distintas.
      narrative_beat: Frente a tres cantidades distintas guardadas por vecinos de la aldea, Dina calcula
        el premio de cada una.
      difficulty: 3
      suggested_families:
      - money
      - choice
  - position: 4
    slug: guardar-en-casa-o-en-la-aldea
    title_es: Guardar en casa o en la aldea
    concept: Guardar en casa mantiene las monedas exactamente iguales; guardarlas en la casa de ahorros
      de la aldea las deja crecer con el premio.
    learning_objective: Al final, el niño puede comparar el resultado de guardar en casa contra guardar
      en la casa de ahorros de la aldea.
    key_vocabulary:
    - comparar
    - crecer
    - igual
    - premio
    prior_knowledge: Sabe calcular cuánto premio corresponde a una cantidad guardada (tema anterior).
    parent_check: ¿{{name}} puede comparar qué pasa con el dinero guardado en casa contra guardado en
      un lugar que da premio?
    fact_refs: []
    lessons:
    - position: 1
      slug: la-caja-bajo-la-cama-y-la-libreta
      micro_objective: 'Observar dos formas distintas de guardar monedas: en casa y en la casa de ahorros.'
      narrative_beat: Dino guarda sus monedas en una caja bajo su cama, mientras Dina las lleva a la casa
        de ahorros de la aldea.
      difficulty: 1
      suggested_families:
      - story
      - choice
    - position: 2
      slug: un-ano-despues
      micro_objective: Comparar el resultado de un año guardando en casa contra guardando en la casa de
        ahorros.
      narrative_beat: Un año después, Dr. Rho muestra que las monedas de Dino siguen siendo las mismas,
        mientras que las de Dina crecieron con el premio.
      difficulty: 2
      suggested_families:
      - analyze
      - money
    - position: 3
      slug: por-que-no-cambiaron-mis-monedas
      micro_objective: Explicar por qué guardar en casa no genera premio, mientras que la casa de ahorros
        sí.
      narrative_beat: Zara Vex pregunta a Dino por qué cree que sus monedas no cambiaron, mientras que
        las de Dina sí.
      difficulty: 2
      suggested_families:
      - choice
      - story
    - position: 4
      slug: dino-decide-cambiar
      micro_objective: Aplicar la decisión de guardar en la casa de ahorros en vez de en casa, explicando
        la razón.
      narrative_beat: Frente a una nueva decisión, Dino elige guardar sus próximas monedas en la casa
        de ahorros, explicando su razón.
      difficulty: 3
      suggested_families:
      - choice
      - analyze
  - position: 5
    slug: el-premio-crece-si-guardo-mas-tiempo
    title_es: El premio crece si guardo más tiempo
    concept: Mientras más tiempo se dejan las monedas guardadas en la casa de ahorros, más veces aparece
      el premio y más grande se vuelve el total.
    learning_objective: Al final, el niño puede explicar que, mientras más tiempo se guarda, más crece
      el total con los premios acumulados.
    key_vocabulary:
    - más-tiempo
    - acumular
    - total
    - crecer
    prior_knowledge: Sabe comparar guardar en casa contra guardar en la casa de ahorros (tema anterior).
    parent_check: ¿{{name}} puede explicar por qué guardar dinero por más tiempo hace que el premio acumulado
      sea mayor?
    prerequisites:
    - path: el-jardin-del-tiempo/jardin-que-nadie-toca/mientras-mas-tiempo-mas-grande
      strength: soft
      reason: La idea de que algo protegido crece más mientras más tiempo pasa se traslada directamente
        del jardín a la libreta de ahorros.
    fact_refs:
    - money.compound_growth_100_3years
    lessons:
    - position: 1
      slug: ciento-diez-y-luego-ciento-veintiuno
      micro_objective: Observar que dejar el dinero guardado más tiempo hace que el total crezca más de
        un año a otro.
      narrative_beat: 'Dr. Rho muestra la libreta de Dina después de un año (110 monedas) y después de
        dos años (121 monedas): el premio también recibió su propio premio.'
      difficulty: 1
      suggested_families:
      - story
      - money
    - position: 2
      slug: calcular-el-tercer-ano
      micro_objective: Calcular el total de un tercer año siguiendo el mismo patrón de crecimiento mostrado.
      narrative_beat: Zara Vex pide a Dino calcular el total después de un tercer año, siguiendo el mismo
        patrón que Dr. Rho mostró.
      difficulty: 2
      suggested_families:
      - money
      - analyze
    - position: 3
      slug: el-premio-del-premio
      micro_objective: Reconocer que el premio de cada año se calcula sobre un total un poco más grande
        que el anterior.
      narrative_beat: Dr. Rho explica que el premio del segundo año fue un poco más grande que el del
        primero, porque también se calculó sobre el premio anterior.
      difficulty: 2
      suggested_families:
      - choice
      - story
    - position: 4
      slug: el-patron-de-tres-anos
      micro_objective: Aplicar la observación del patrón de crecimiento a una libreta nueva de varios
        años.
      narrative_beat: Frente a una nueva libreta con tres años de historia, Dina explica el patrón de
        crecimiento que observa.
      difficulty: 3
      suggested_families:
      - money
      - choice
  - position: 6
    slug: mi-primera-libreta-de-ahorros
    title_es: Mi primera libreta de ahorros
    concept: Una libreta de ahorros registra cuánto se guardó, cuánto premio se ganó, y cuánto hay en
      total, para poder seguir el crecimiento con claridad.
    learning_objective: Al final, el niño puede leer una libreta de ahorros simple e identificar cuánto
      se guardó, cuánto premio ganó y cuánto hay en total.
    key_vocabulary:
    - libreta
    - registrar
    - total
    - leer
    prior_knowledge: Sabe que dejar el dinero más tiempo hace crecer más el total (tema anterior).
    parent_check: ¿{{name}} sabe leer un registro simple de cuánto guardó, cuánto ganó y cuánto tiene
      en total?
    fact_refs: []
    lessons:
    - position: 1
      slug: mi-libreta-propia
      micro_objective: 'Conocer las partes de una libreta de ahorros: lo guardado, el premio y el total.'
      narrative_beat: Dr. Rho entrega a Dina su primera libreta de ahorros propia, con espacios para anotar
        lo guardado, el premio y el total.
      difficulty: 1
      suggested_families:
      - story
      - choice
    - position: 2
      slug: leer-una-libreta-llena
      micro_objective: Leer una libreta de ahorros llena e identificar sus partes correctamente.
      narrative_beat: Zara Vex muestra una libreta ya llena y pide a Dino identificar cuánto se guardó
        y cuánto fue premio.
      difficulty: 2
      suggested_families:
      - analyze
      - choice
    - position: 3
      slug: sumar-guardado-mas-premio
      micro_objective: Calcular el total sumando lo guardado más el premio en una libreta propia.
      narrative_beat: Dr. Rho pregunta a Dina cuánto hay en total sumando lo guardado más el premio de
        su propia libreta.
      difficulty: 2
      suggested_families:
      - choice
      - money
    - position: 4
      slug: la-libreta-de-otro-vecino
      micro_objective: Aplicar la lectura completa de una libreta de ahorros nueva, sin ayuda.
      narrative_beat: Frente a una libreta nueva de otro personaje de la aldea, Dina identifica sin ayuda
        las tres partes y explica lo que significan.
      difficulty: 3
      suggested_families:
      - choice
      - analyze
  - position: 7
    slug: comparar-dos-libretas
    title_es: Comparar dos libretas
    concept: Comparar dos libretas de ahorros distintas ayuda a ver cómo cambia el resultado según cuánto
      se guardó y por cuánto tiempo.
    learning_objective: Al final, el niño puede comparar dos libretas de ahorros distintas y explicar
      por qué sus resultados son diferentes.
    key_vocabulary:
    - comparar
    - libreta
    - resultado
    - diferente
    prior_knowledge: Sabe leer una libreta de ahorros simple (tema anterior).
    parent_check: ¿{{name}} puede comparar dos registros de ahorro distintos y explicar por qué uno creció
      más que el otro?
    fact_refs: []
    lessons:
    - position: 1
      slug: dos-libretas-de-la-aldea
      micro_objective: Observar dos libretas de ahorros distintas con resultados diferentes.
      narrative_beat: 'Dr. Rho muestra dos libretas de la aldea: una con más monedas guardadas desde el
        inicio, y otra con menos.'
      difficulty: 1
      suggested_families:
      - story
      - choice
    - position: 2
      slug: calcular-y-comparar-el-premio
      micro_objective: Calcular y comparar el premio de dos libretas distintas.
      narrative_beat: Zara Vex pide a Dino calcular el premio de cada libreta y comparar cuál ganó más.
      difficulty: 2
      suggested_families:
      - money
      - analyze
    - position: 3
      slug: tambien-influye-el-tiempo
      micro_objective: Reconocer que tanto la cantidad guardada como el tiempo influyen en el resultado
        de una libreta.
      narrative_beat: Dr. Rho pregunta a Dina si el tiempo también influyó en la diferencia entre ambas
        libretas, no solo la cantidad guardada.
      difficulty: 2
      suggested_families:
      - choice
      - story
    - position: 4
      slug: predecir-cual-tendra-mas
      micro_objective: Aplicar el análisis de cantidad y tiempo para predecir cuál de dos libretas nuevas
        tendrá más premio.
      narrative_beat: Frente a dos libretas nuevas, Dina predice cuál tendrá más premio, considerando
        cantidad y tiempo.
      difficulty: 3
      suggested_families:
      - choice
      - analyze
  - position: 8
    slug: mi-plan-con-premio
    title_es: Mi plan con premio
    concept: Armar un plan propio de ahorro con premio (cuánto guardar, por cuánto tiempo) aplica todo
      lo aprendido sobre la casa de ahorros de la aldea.
    learning_objective: Al final, el niño puede armar un plan propio de ahorro que incluya cuánto guardar
      y por cuánto tiempo, aprovechando el premio.
    key_vocabulary:
    - plan
    - ahorro
    - premio
    - tiempo
    prior_knowledge: Ha aprendido a leer y comparar libretas de ahorro con premio (temas anteriores).
    parent_check: ¿{{name}} puede contarte su propio plan de ahorro, incluyendo cuánto guardaría y por
      cuánto tiempo?
    fact_refs: []
    lessons:
    - position: 1
      slug: abrir-mi-propia-libreta
      micro_objective: Elegir, dentro de una historia, cuánto guardar para comenzar un plan propio de
        ahorro con premio.
      narrative_beat: Dr. Rho invita a Dina a abrir su propia libreta en la casa de ahorros y elegir cuánto
        guardar para empezar su plan.
      difficulty: 1
      suggested_families:
      - story
      - choice
    - position: 2
      slug: calcular-mi-premio-futuro
      micro_objective: Calcular el premio esperado de un plan propio después de uno y de dos años.
      narrative_beat: Zara Vex ayuda a Dino a calcular cuánto premio ganaría su plan después de uno y
        de dos años.
      difficulty: 2
      suggested_families:
      - money
      - choice
    - position: 3
      slug: explicar-mi-plan-en-voz-alta
      micro_objective: Explicar en voz alta un plan propio de ahorro con premio, incluyendo cantidad y
        tiempo.
      narrative_beat: Dina practica explicando en voz alta su plan completo antes de llevarlo a la casa
        de ahorros.
      difficulty: 2
      suggested_families:
      - storyplay
      - choice
    - position: 4
      slug: comprometerme-con-mi-libreta
      micro_objective: Aplicar con seguridad el plan completo de ahorro con premio, comprometiéndose a
        mantenerlo.
      narrative_beat: Con su plan ya armado, Dina abre su libreta en la casa de ahorros y se compromete
        a mantenerla sin tocar.
      difficulty: 3
      suggested_families:
      - choice
      - story
  - position: 9
    slug: el-cofre-del-repaso
    kind: review_spaced
    title_es: El Cofre del Repaso
    concept: Zara Vex abre el cofre con las semillas de recuerdo de El Premio por Guardar.
    learning_objective: Al final, el niño puede recordar y aplicar, sin ayuda nueva, los conceptos principales
      de la saga El Premio por Guardar.
    key_vocabulary:
    - premio
    - libreta
    - casa de ahorros
    - crecer
    prior_knowledge: Ha completado los ocho temas de la saga El Premio por Guardar (aventura 2, saga 1).
    fact_refs: []
    review_of:
    - la-aldea-del-interes/premio-por-guardar/una-casa-para-guardar-monedas
    - la-aldea-del-interes/premio-por-guardar/el-premio-que-aparece-solo
    - la-aldea-del-interes/premio-por-guardar/cuanto-premio-por-cuanto-guardado
    - la-aldea-del-interes/premio-por-guardar/guardar-en-casa-o-en-la-aldea
    - la-aldea-del-interes/premio-por-guardar/el-premio-crece-si-guardo-mas-tiempo
    - la-aldea-del-interes/premio-por-guardar/mi-primera-libreta-de-ahorros
    - la-aldea-del-interes/premio-por-guardar/comparar-dos-libretas
    - la-aldea-del-interes/premio-por-guardar/mi-plan-con-premio
    lessons:
    - position: 1
      slug: el-cofre-se-abre
      micro_objective: Recordar, sin ayuda nueva, qué es la casa de ahorros y por qué guardar monedas
        hace aparecer un premio.
      narrative_beat: Zara Vex abre un cofre lleno de recuerdos de la aldea y reta a Dina a recordar,
        moneda por moneda, lo primero que aprendió.
      difficulty: 1
      suggested_families:
      - story
      - choice
    - position: 2
      slug: recordar-en-orden
      micro_objective: Recordar y ordenar de nuevo cómo calcular el premio de una cantidad guardada y
        por qué guardar en casa no genera premio.
      narrative_beat: Dino saca del cofre los recuerdos mezclados de la saga y los ordena de memoria,
        sin que Dr. Rho le dé ninguna pista nueva.
      difficulty: 1
      suggested_families:
      - arrange
      - choice
    - position: 3
