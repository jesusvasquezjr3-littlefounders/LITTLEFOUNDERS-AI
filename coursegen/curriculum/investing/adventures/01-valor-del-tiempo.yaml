schema_version: 1

adventure:
  position: 1
  slug: valor-del-tiempo
  theme: cosmos
  age_tier: tier4
  title:
    en-US: "The Value of Time"
    es-MX: "El Valor del Tiempo"
    pt-BR: "O Valor do Tempo"
  description:
    en-US: "In the Clock Station, four cadets learn why WHEN you decide matters as much as WHAT you decide - money and options today are worth more than a promise for later."
    es-MX: "En la Estación Reloj, cuatro cadetes aprenden por qué el MOMENTO en que decides importa tanto como la decisión misma - el dinero y las opciones de hoy valen más que una promesa para después."
    pt-BR: "Na Estação Relógio, quatro cadetes aprendem por que o MOMENTO em que voce decide importa tanto quanto a decisao em si - o dinheiro e as opcoes de hoje valem mais que uma promessa para depois."
  narrative_arc: "Dina, Liruf, Rho y Zara llegan a la Estación Reloj como cadetes de tiempo: su misión es entender por qué el momento en que decides importa tanto como la decisión misma. A lo largo de la estación descubren que el dinero de hoy vale más que la promesa de mañana, que esperar sin actuar tiene un costo invisible, y que cada elección cierra la puerta a otra - hasta que arman su propia regla personal para decidir con el reloj en mente y la defienden frente al consejo de la estación."

sagas:
  - position: 1
    slug: peso-hoy-o-peso-manana
    icon: schedule
    title:
      en-US: "Peso Today or Peso Tomorrow?"
      es-MX: "¿Peso Hoy o Peso Mañana?"
      pt-BR: "Peso Hoje ou Peso Amanha?"
    description:
      en-US: "Money and options in hand today beat the same amount promised later - learn why, concretely."
      es-MX: "El dinero y las opciones en mano hoy le ganan a la misma cantidad prometida después - aprende por qué, de forma concreta."
      pt-BR: "O dinheiro e as opcoes em maos hoje vencem a mesma quantidade prometida depois - aprenda por que, de forma concreta."
    topics:
        - position: 1
          slug: dinero-en-mano
          title_es: "Dinero en mano"
          concept: "Recibir algo de valor ahora te da control inmediato; recibir la promesa de lo mismo después no."
          learning_objective: "El aprendiz reconoce que tener algo ahora da un control que una promesa futura no da, aunque el monto sea igual."
          key_vocabulary: [control inmediato, promesa futura, valor ahora]
          prior_knowledge: "Ninguno - es el punto de partida del curso."
          fact_refs: []
          parent_check: "Preguntale a {{name}} si preferiría $100 hoy o $100 en dos meses, y que te explique por qué."
          lessons:
            - position: 1
              slug: sobre-que-elegir
              micro_objective: "Reconoce que recibir algo de valor ahora te da control inmediato que la promesa de lo mismo después no te da."
              narrative_beat: "Rho le ofrece a Liruf: '$100 hoy, o $100 en dos meses'. Liruf duda un segundo y elige el sobre que ya tiene en la mano."
              difficulty: 1
              suggested_families: [story, choice]
            - position: 2
              slug: explico-mi-eleccion
              micro_objective: "Explica, en un caso simple, por qué $100 hoy no es lo mismo que la promesa de $100 en dos meses."
              narrative_beat: "Dina le pide a Liruf que explique su elección: '¿por qué elegiste el sobre de hoy si es la misma cantidad?'"
              difficulty: 2
              suggested_families: [choice, analyze]
        - position: 2
          slug: que-puedo-hacer-con-el-ahora
          title_es: "Qué puedo hacer con el ahora"
          concept: "Tener dinero hoy abre opciones (gastarlo, guardarlo, invertirlo) que no existen si aún no lo tienes."
          learning_objective: "El aprendiz identifica al menos dos opciones reales que abre tener algo hoy y que una promesa futura no abre todavía."
          key_vocabulary: [opciones, guardar, hacer crecer]
          prior_knowledge: "Reconoce que el dinero en mano da control inmediato (tema anterior)."
          fact_refs: []
          parent_check: "Preguntale a {{name}} qué podría hacer HOY con dinero que ya tiene, que no podría hacer con dinero que le prometieron para después."
          lessons:
            - position: 1
              slug: lista-de-opciones
              micro_objective: "Identifica al menos dos cosas que puedes hacer con dinero que ya tienes hoy y que no puedes hacer con dinero prometido para después."
              narrative_beat: "Zara hace una lista rápida: con el dinero de hoy puede guardarlo, gastarlo o dejarlo crecer - con la promesa de mañana, nada de eso todavía."
              difficulty: 2
              suggested_families: [arrange, analyze]
            - position: 2
              slug: cual-me-da-mas-opciones
              micro_objective: "Compara dos escenarios y decide cuál te da más opciones reales: recibir algo ahora o recibir más tarde la promesa de lo mismo."
              narrative_beat: "Rho compara dos rutas del mismo reto: una le da puntos hoy, la otra promete el doble en un mes - pero solo una le sirve YA para algo urgente."
              difficulty: 3
              suggested_families: [choice, analyze]
        - position: 3
          slug: una-promesa-no-es-lo-mismo
          title_es: "Una promesa no es lo mismo"
          concept: "Una promesa de pago futuro carga incertidumbre (puede no cumplirse, puede tardar) - vale menos que el mismo monto ya en tu bolsillo."
          learning_objective: "El aprendiz reconoce la incertidumbre de una promesa futura como razón concreta de que valga menos que el dinero en mano."
          key_vocabulary: [incertidumbre, cumplir, retraso]
          prior_knowledge: "Identifica las opciones que da tener algo hoy (tema anterior)."
          fact_refs: [mxn.reference_prices.audifonos_inalambricos]
          parent_check: "Preguntale a {{name}} si alguna vez le prometieron algo 'la próxima semana' y tardó mucho más - cómo cambió eso lo que sentía por la promesa."
          lessons:
            - position: 1
              slug: la-promesa-que-se-retrasa
              micro_objective: "Reconoce que una promesa de pago futuro carga incertidumbre (puede no cumplirse o tardar más) que el dinero en mano no tiene."
              narrative_beat: "Liruf le prometió a Zara unos audífonos inalámbricos 'la próxima semana', pero ya van tres semanas - la promesa perdió valor con cada retraso."
              difficulty: 3
              suggested_families: [story, choice]
            - position: 2
              slug: ordeno-promesas-por-confianza
              micro_objective: "Ordena tres promesas de pago según qué tan confiables son, usando pistas del caso (quién promete, con qué historial)."
              narrative_beat: "Rho revisa tres promesas distintas en su libreta y las ordena de la más segura a la más incierta, según quién las hizo y qué tan seguido cumple."
              difficulty: 3
              suggested_families: [arrange, analyze]
        - position: 4
          slug: comparo-oferta-hoy-y-oferta-futura
          title_es: "Comparo: oferta hoy y oferta futura"
          concept: "Comparar una oferta menor disponible hoy contra una oferta mayor disponible después requiere ver si la diferencia compensa la espera."
          learning_objective: "El aprendiz compara una oferta presente contra una oferta futura mayor y decide si la diferencia justifica esperar."
          key_vocabulary: [comparar ofertas, diferencia, justificar la espera]
          prior_knowledge: "Reconoce la incertidumbre de una promesa futura (tema anterior)."
          fact_refs: [math.weekly_income_options_tier4]
          parent_check: "Preguntale a {{name}} cómo decidiría entre ganar menos dinero hoy o más dinero el próximo mes por el mismo trabajo."
          lessons:
            - position: 1
              slug: que-datos-me-faltan
              micro_objective: "Compara una oferta menor disponible hoy contra una oferta mayor disponible después, e identifica qué datos le faltan para decidir bien."
              narrative_beat: "A Zara le ofrecen $200 hoy por ayudar en un puesto, o $250 el mes que entra por el mismo trabajo - antes de elegir, quiere saber si esa segunda oferta es segura."
              difficulty: 3
              suggested_families: [choice, analyze]
            - position: 2
              slug: decido-con-los-datos-completos
              micro_objective: "Decide entre una oferta hoy y una oferta futura mayor, justificando la decisión con al menos un motivo concreto."
              narrative_beat: "Con los datos completos en mano, Zara decide: la oferta futura es segura y suficientemente mayor, así que esta vez sí vale la pena esperar."
              difficulty: 4
              suggested_families: [choice, storyplay]
        - position: 5
          slug: mientras-mas-lejos-menos-vale
          title_es: "Mientras más lejos, menos vale"
          concept: "Entre dos promesas del mismo monto, la que tarda más en llegar vale menos hoy."
          learning_objective: "El aprendiz compara dos promesas del mismo monto y reconoce que la más lejana en el tiempo vale menos hoy."
          key_vocabulary: [distancia en el tiempo, mismo monto, vale menos hoy]
          prior_knowledge: "Compara una oferta hoy contra una oferta futura (tema anterior)."
          fact_refs: [mxn.reference_prices.boleto_concierto]
          parent_check: "Preguntale a {{name}} si dos regalos iguales valen lo mismo si uno llega en dos semanas y el otro en seis meses."
          lessons:
            - position: 1
              slug: dos-boletos-mismo-precio
              micro_objective: "Compara dos promesas del mismo monto que llegan en momentos distintos y reconoce que la más lejana vale menos hoy."
              narrative_beat: "Dina compara dos boletos de concierto prometidos: uno llega en dos semanas, el otro en seis meses - aunque cuestan lo mismo, no valen igual hoy."
              difficulty: 4
              suggested_families: [analyze, choice]
            - position: 2
              slug: ordeno-por-cercania
              micro_objective: "Ordena tres promesas del mismo monto por qué tan lejos están en el tiempo, de la que más vale hoy a la que menos."
              narrative_beat: "Rho acomoda tres tarjetas idénticas en valor pero con fechas distintas - la de la próxima semana pesa más en su decisión que la del próximo año."
              difficulty: 4
              suggested_families: [arrange, analyze]
        - position: 6
          slug: mi-primera-regla-de-tiempo
          title_es: "Mi primera regla de tiempo"
          concept: "Sintetiza una regla personal: peso en mano vale más que peso prometido, a menos que la espera venga con una razón clara para valer más."
          learning_objective: "El aprendiz redacta y aplica una regla personal simple para comparar dinero en mano contra una promesa futura."
          key_vocabulary: [regla personal, razón clara, síntesis]
          prior_knowledge: "Ordena promesas por qué tan lejos están en el tiempo (tema anterior)."
          fact_refs: []
          parent_check: "Pidele a {{name}} que te diga, en una sola frase, su propia regla para decidir entre dinero hoy y una promesa futura."
          lessons:
            - position: 1
              slug: armamos-la-regla-juntos
              micro_objective: "Redacta, con apoyo, una regla personal simple que compare dinero en mano contra una promesa futura."
              narrative_beat: "El equipo arma en la pizarra su primera regla: 'peso en mano vale más que peso prometido, a menos que la espera tenga una razón clara para ganar'."
              difficulty: 4
              suggested_families: [storyplay, analyze]
            - position: 2
              slug: aplico-mi-regla-solo
              micro_objective: "Aplica, sin ayuda, su propia regla del tiempo a un caso nuevo para decidir entre dinero hoy y una promesa futura."
              narrative_beat: "Liruf usa la regla del equipo por su cuenta, sin que nadie le ayude, para decidir entre el sobre de hoy y la promesa de un vecino."
              difficulty: 5
              suggested_families: [choice, storyplay]
        - position: 7
          slug: repaso-peso-hoy-o-peso-manana
          kind: review_spaced
          title_es: "Repaso: ¿Peso Hoy o Peso Mañana?"
          concept: "Antes de seguir explorando la estación, el equipo repasa por qué el dinero en mano vale más que una promesa lejana."
          learning_objective: "El aprendiz recuerda y aplica, sin nueva enseñanza, los filtros de esta saga para comparar dinero hoy contra una promesa futura."
          key_vocabulary: [dinero en mano, promesa futura, distancia en el tiempo]
          prior_knowledge: "Completo los 6 temas de ¿Peso Hoy o Peso Mañana?"
          fact_refs: []
          review_of:
            - valor-del-tiempo/peso-hoy-o-peso-manana/dinero-en-mano
            - valor-del-tiempo/peso-hoy-o-peso-manana/que-puedo-hacer-con-el-ahora
            - valor-del-tiempo/peso-hoy-o-peso-manana/una-promesa-no-es-lo-mismo
            - valor-del-tiempo/peso-hoy-o-peso-manana/comparo-oferta-hoy-y-oferta-futura
            - valor-del-tiempo/peso-hoy-o-peso-manana/mientras-mas-lejos-menos-vale
            - valor-del-tiempo/peso-hoy-o-peso-manana/mi-primera-regla-de-tiempo
          lessons:
            - position: 1
              slug: repaso-dinero-en-mano-vale-mas
              micro_objective: "Recuerda y aplica, sin ayuda, por qué recibir algo ahora vale más que la promesa de lo mismo después."
              narrative_beat: "El equipo revisa su libreta de la Estación Reloj y vuelve a clasificar sus primeras decisiones con ojos más entrenados."
              difficulty: 3
              suggested_families: [choice, analyze]
            - position: 2
              slug: repaso-comparo-promesa-nueva
              micro_objective: "Aplica sin ayuda todo lo repasado: compara una promesa nueva contra dinero disponible hoy y decide."
              narrative_beat: "Zara recibe una promesa nueva de un compañero y, sin ayuda de nadie, decide en segundos si vale más que tenerlo ya."
              difficulty: 4
              suggested_families: [storyplay, choice]
        - position: 8
          slug: cruce-promesas-y-opciones
          kind: review_interleaved
          title_es: "Cruce: Promesas y Opciones del Ahora"
          concept: "Mezclamos las opciones que da el ahora con la distancia de una promesa futura para juzgar un caso de una sola vez."
          learning_objective: "El aprendiz combina, sin nueva enseñanza, al menos dos señales de esta saga para evaluar una decisión completa."
          key_vocabulary: [opciones del ahora, distancia de una promesa]
          prior_knowledge: "Completo el repaso de ¿Peso Hoy o Peso Mañana? (tema anterior)."
          fact_refs: []
          review_of:
            - valor-del-tiempo/peso-hoy-o-peso-manana/dinero-en-mano
            - valor-del-tiempo/peso-hoy-o-peso-manana/que-puedo-hacer-con-el-ahora
            - valor-del-tiempo/peso-hoy-o-peso-manana/mientras-mas-lejos-menos-vale
          lessons:
            - position: 1
              slug: junto-opciones-y-distancia
              micro_objective: "Combina la idea de 'opciones que da el ahora' con 'cuánto vale una promesa lejana' para evaluar un caso nuevo."
              narrative_beat: "Rho junta dos filtros a la vez: qué tanto puede hacer con algo ahora Y qué tan lejos está la promesa alternativa."
              difficulty: 4
              suggested_families: [choice, analyze]
            - position: 2
              slug: evaluo-un-caso-completo
              micro_objective: "Evalúa, sin ayuda, un caso nuevo combinando el valor del ahora con la distancia de una promesa futura."
              narrative_beat: "Zara decide en segundos si vale la pena esperar un boleto prometido, cruzando qué tanto necesita el dinero hoy con qué tan lejos está la fecha."
              difficulty: 5
              suggested_families: [analyze, choice]
  - position: 2
    slug: el-costo-de-esperar
    icon: hourglass_top
    title:
      en-US: "The Cost of Waiting"
      es-MX: "El Costo de Esperar"
      pt-BR: "O Custo de Esperar"
    description:
      en-US: "Waiting is never free - even doing nothing has a hidden cost, and FOMO is not a reason to skip thinking."
      es-MX: "Esperar nunca es gratis - incluso no hacer nada tiene un costo invisible, y el FOMO no es razón para saltarse pensar."
      pt-BR: "Esperar nunca e gratis - mesmo nao fazer nada tem um custo invisivel, e o FOMO nao e motivo para pular o pensar."
    topics:
        - position: 1
          slug: esperar-no-es-gratis
          title_es: "Esperar no es gratis"
          concept: "No decidir también es una decisión, y esperar sin actuar tiene un costo aunque en el momento no se vea."
          learning_objective: "El aprendiz distingue esperar-con-razón de simplemente no decidir, nombrando el costo invisible de la inacción."
          key_vocabulary: [espera, costo invisible, inacción]
          prior_knowledge: "Completo ¿Peso Hoy o Peso Mañana? (saga anterior)."
          fact_refs: []
          parent_check: "Preguntale a {{name}} si alguna vez perdió algo bueno por no decidirse a tiempo entre dos opciones."
          lessons:
            - position: 1
              slug: no-elegir-tambien-es-elegir
              micro_objective: "Identifica, en un caso simple, que no decidir también cuenta como una decisión con consecuencias."
              narrative_beat: "Liruf no elige entre dos boletos disponibles hoy - para cuando se decide, los dos ya se agotaron."
              difficulty: 1
              suggested_families: [story, choice]
            - position: 2
              slug: el-costo-de-no-decidir
              micro_objective: "Reconoce el costo invisible de esperar sin actuar en un caso donde una oportunidad se pierde por no decidir a tiempo."
              narrative_beat: "Dina señala: 'no elegir ninguno también fue tu elección, y te costó los dos boletos'."
              difficulty: 2
              suggested_families: [choice, analyze]
        - position: 2
          slug: el-boton-de-comprar-ya
          title_es: "El botón de 'comprar ya'"
          concept: "Un lanzamiento limitado empuja a decidir rápido por miedo a perdérselo (FOMO); pausar a pensar casi siempre vale más que ceder al impulso."
          learning_objective: "El aprendiz reconoce la señal de FOMO en una oferta limitada y compara decidir bajo presión contra decidir con una pausa."
          key_vocabulary: [FOMO, impulso, pausa]
          prior_knowledge: "Distingue esperar-con-razón de no decidir (tema anterior)."
          fact_refs: [mxn.reference_prices.tenis_de_moda]
          parent_check: "Preguntale a {{name}} si alguna vez compró algo rápido por miedo a que se acabara, y si después se arrepintió."
          lessons:
            - position: 1
              slug: reconozco-la-senal-de-fomo
              micro_objective: "Reconoce la señal de FOMO ('solo quedan 3', 'oferta termina en 1 hora') como una táctica que empuja a decidir sin pensar."
              narrative_beat: "La pantalla de Zara parpadea: 'solo quedan 2 pares - ¡compra ya!' - reconoce la táctica antes de tocar el botón."
              difficulty: 2
              suggested_families: [story, choice]
            - position: 2
              slug: la-pausa-de-un-minuto
              micro_objective: "Compara una decisión tomada bajo presión de tiempo contra la misma decisión tomada con una pausa de un minuto, y elige cuál conviene."
              narrative_beat: "Rho se da un minuto antes de decidir sobre el lanzamiento limitado de tenis de moda - en ese minuto nota que no los necesita tanto como creía."
              difficulty: 3
              suggested_families: [choice, analyze]
        - position: 3
          slug: cuanto-me-cuesta-no-decidir
          title_es: "Cuánto me cuesta no decidir"
          concept: "No decidir a tiempo puede significar perder la mejor opción disponible, no solo quedarte igual."
          learning_objective: "El aprendiz calcula, en un caso simple, qué se pierde concretamente por tardar en decidir."
          key_vocabulary: [oportunidad perdida, mejor opción disponible]
          prior_knowledge: "Reconoce la señal de FOMO y la pausa útil (tema anterior)."
          fact_refs: []
          parent_check: "Preguntale a {{name}} qué perdió, exactamente, la última vez que tardó en decidirse por algo."
          lessons:
            - position: 1
              slug: el-cupo-que-se-fue
              micro_objective: "Calcula, en un caso simple, qué perdió un personaje por tardar en decidir (la mejor opción ya no está disponible)."
              narrative_beat: "Para cuando Liruf se decide por el mejor lugar del taller de robótica, ya se lo ganó otro compañero que decidió primero."
              difficulty: 3
              suggested_families: [story, analyze]
            - position: 2
              slug: comparo-dos-tiempos-de-reaccion
              micro_objective: "Compara dos personajes que enfrentan la misma oportunidad y decide cuál pierde más por tardar en decidir."
              narrative_beat: "Zara compara: ella decidió en un día, su amigo tardó una semana - ambos querían el mismo cupo del club."
              difficulty: 3
              suggested_families: [choice, analyze]
        - position: 4
          slug: la-fila-para-el-mismo-lugar
          title_es: "La fila para el mismo lugar"
          concept: "Dos personas que actúan en momentos distintos ante la misma oportunidad no terminan en el mismo lugar - quien actúa antes casi siempre tiene más opciones."
          learning_objective: "El aprendiz predice quién se queda con más opciones al comparar el orden en que varios personajes actuaron."
          key_vocabulary: [actuar antes, opciones restantes]
          prior_knowledge: "Calcula el costo de tardar en decidir (tema anterior)."
          fact_refs: []
          parent_check: "Preguntale a {{name}} si conoce un caso donde quien se apuntó primero a algo terminó con mejores opciones que quien se apuntó después."
          lessons:
            - position: 1
              slug: quien-actuo-primero
              micro_objective: "Ordena a 4 personajes según el orden en que actuaron frente a la misma oportunidad y predice quién se quedó con más opciones."
              narrative_beat: "Rho ordena en su libreta a cuatro compañeros según cuándo se apuntaron al viaje - los primeros eligieron habitación, los últimos, lo que quedó."
              difficulty: 3
              suggested_families: [arrange, analyze]
            - position: 2
              slug: actuo-sin-toda-la-informacion
              micro_objective: "Decide, en un caso nuevo, si vale la pena actuar antes aunque falte información completa, comparando el riesgo de esperar contra el de decidir ya."
              narrative_beat: "Dina decide apuntarse al taller aunque todavía no sabe el horario exacto, porque sabe que los cupos se acaban rápido."
              difficulty: 4
              suggested_families: [choice, analyze]
        - position: 5
          slug: pausar-vs-procrastinar
          title_es: "Pausar vs. procrastinar"
          concept: "Pausar para pensar es distinto de procrastinar sin fecha - la pausa útil tiene un límite de tiempo claro."
          learning_objective: "El aprendiz distingue una pausa útil (con fecha límite) de procrastinar (sin fecha) en casos concretos."
          key_vocabulary: [pausa útil, procrastinar, límite de tiempo]
          prior_knowledge: "Predice quién se queda con más opciones al actuar antes (tema anterior)."
          fact_refs: []
          parent_check: "Preguntale a {{name}} si la próxima vez que diga 'ya después lo pienso' puede convertirlo en 'lo decido antes de tal día'."
          lessons:
            - position: 1
              slug: pausa-con-fecha-o-sin-fecha
              micro_objective: "Distingue, en 4 casos, cuáles muestran una pausa útil (con fecha límite) y cuáles muestran procrastinación (sin fecha)."
              narrative_beat: "Zara se da hasta el viernes para decidir - eso es una pausa útil. Liruf dice 'ya después lo pienso' sin poner fecha - eso ya es procrastinar."
              difficulty: 4
              suggested_families: [choice, analyze]
            - position: 2
              slug: le-pongo-fecha-a-mi-pausa
              micro_objective: "Convierte una postergación sin fecha ('ya luego lo pienso') en una pausa útil con un límite de tiempo concreto."
              narrative_beat: "Rho le pone fecha a su indecisión: 'lo decido antes del domingo', y de pronto la pausa deja de sentirse infinita."
              difficulty: 4
              suggested_families: [storyplay, choice]
        - position: 6
          slug: decido-con-fecha-limite
          title_es: "Decido con fecha límite"
          concept: "Ponerle una fecha límite a una decisión evita que 'esperar un poco más' se vuelva esperar para siempre."
          learning_objective: "El aprendiz elige y aplica una fecha límite razonable para una decisión pendiente propia."
          key_vocabulary: [fecha límite, decisión a tiempo]
          prior_knowledge: "Distingue pausa útil de procrastinación (tema anterior)."
          fact_refs: []
