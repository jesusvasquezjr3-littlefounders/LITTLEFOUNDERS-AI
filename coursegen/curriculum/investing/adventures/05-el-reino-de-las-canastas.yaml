      - choice
    - position: 3
      slug: aplicar-lo-guardado
      micro_objective: Aplicar de nuevo, en una escena distinta, lo aprendido sobre leer un gráfico simple de precios.
      narrative_beat: Dr. Rho presenta una escena nueva del mercado y pregunta a Dina si recuerda, sin repasar la lección, qué haría en ese caso.
      difficulty: 2
