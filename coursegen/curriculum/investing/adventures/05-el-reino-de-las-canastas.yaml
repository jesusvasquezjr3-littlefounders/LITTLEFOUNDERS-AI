    - position: 4
      slug: cerrar-el-cofre-real
      micro_objective: Aplicar en conjunto todo lo repasado de la saga, incluyendo que una acción no es una promesa, para cerrar el cofre.
      narrative_beat: Antes de cerrar el cofre, Dina demuestra que recuerda toda la saga uniendo cada tarjeta con la lección que le corresponde.
      difficulty: 2
      suggested_families:
