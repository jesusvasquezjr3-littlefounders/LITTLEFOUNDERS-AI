schema_version: 1
adventure:
  position: 5
  slug: el-reino-de-las-canastas
  theme: kingdom
  age_tier: tier3
  title:
    en-US: The Kingdom of Baskets
    es-MX: El Reino de las Canastas
    pt-BR: O Reino das Cestas
  description:
    en-US: In a kingdom ruled by baskets, Dina and Dino learn that a stock is a real piece of a real company, that spreading money across different things beats guessing a single winner, and that a fund or an index is a basket shared by many.
    es-MX: En un reino gobernado por canastas, Dina y Dino aprenden que una acción es un pedacito real de una empresa real, que repartir el dinero entre cosas distintas gana a adivinar un solo ganador, y que un fondo o un índice es una canasta compartida entre muchos.
    pt-BR: Em um reino governado por cestas, Dina e Dino aprendem que uma ação é um pedacinho real de uma empresa real, que espalhar o dinheiro entre coisas diferentes vence adivinhar um único vencedor, e que um fundo ou um índice é uma cesta compartilhada por muitos.
  narrative_arc: 'Dina y Dino llegan a un reino donde todo se organiza en canastas: el mercado, el tesoro real, hasta las grandes decisiones. Dr. Rho, guardián real de las canastas, les enseña que una acción es un pedacito de una empresa de verdad -- como la limonadería que conocieron en Emprendimiento -- y que nadie debe apostar todo su tesoro a una sola cosa. Zara Vex reta a los niños con escenarios donde una sola canasta se rompe, para que descubran por su cuenta por qué repartir entre varias canastas, fondos e índices protege mejor que adivinar un único ganador.'
sagas:
- position: 1
  slug: un-pedacito-de-una-empresa
  icon: storefront
  title:
    en-US: A Little Piece of a Company
    es-MX: Un Pedacito de una Empresa
    pt-BR: Um Pedacinho de uma Empresa
  description:
    en-US: Discover what a company is, why it needs money to grow, and what it really means to own a stock.
    es-MX: Descubre qué es una empresa, por qué necesita dinero para crecer, y qué significa de verdad tener una acción.
    pt-BR: Descubra o que é uma empresa, por que ela precisa de dinheiro para crescer, e o que realmente significa ter uma ação.
  topics:
  - position: 1
    slug: que-es-una-empresa
    title_es: Qué es una empresa
    concept: Una empresa es un negocio que vende algo -- productos o servicios -- y necesita dinero para crecer más allá de donde empezó.
    learning_objective: Al final, el niño puede explicar con sus palabras qué es una empresa y por qué necesita dinero para crecer.
    key_vocabulary:
    - empresa
    - negocio
    - vender
    - crecer
    prior_knowledge: Recuerda cómo funcionaba el negocio de limonada que conoció en Emprendimiento.
    parent_check: "¿{{name}} puede explicarte con sus palabras qué es una empresa y por qué necesita dinero para crecer?"
    fact_refs: []
    lessons:
    - position: 1
      slug: la-limonaderia-que-crecio
      micro_objective: Recordar que un negocio, como la limonadería, es una empresa que vende algo a cambio de dinero.
      narrative_beat: Dr. Rho recibe a Dina y Dino en el Reino de las Canastas y les muestra que la limonadería que conocieron en Emprendimiento ahora es una empresa mucho más grande.
      difficulty: 1
      suggested_families:
      - story
      - choice
    - position: 2
      slug: para-que-necesita-dinero-una-empresa
      micro_objective: Identificar por qué una empresa necesita dinero para crecer, como comprar más limones o contratar ayuda.
      narrative_beat: Zara Vex pregunta a Dino qué necesitaría la limonadería para vender en todo el reino y no solo en una esquina del mercado.
      difficulty: 2
      suggested_families:
      - choice
      - analyze
    - position: 3
      slug: quien-le-da-dinero-a-una-empresa
      micro_objective: Reconocer que las personas del reino pueden dar dinero a una empresa a cambio de un pedacito de ella.
      narrative_beat: Dr. Rho explica que, en vez de pedir prestado, una empresa puede ofrecer pedacitos de sí misma a quien quiera ayudarla a crecer.
      difficulty: 2
      suggested_families:
      - story
      - choice
    - position: 4
      slug: mi-empresa-del-reino
      micro_objective: Aplicar el concepto de empresa a un negocio nuevo imaginado dentro del reino.
      narrative_beat: Dina imagina un nuevo negocio del reino y explica, con sus propias palabras, por qué se considera una empresa.
      difficulty: 3
      suggested_families:
      - choice
      - storyplay
  - position: 2
    slug: que-es-una-accion
    title_es: Qué es una acción
    concept: Una acción es un pedacito real de una empresa; quien la tiene es dueño de esa parte, por pequeña que sea.
    learning_objective: Al final, el niño puede explicar que una acción es un pedacito real de una empresa.
    key_vocabulary:
    - acción
    - pedacito
    - dueño
    - empresa
    prior_knowledge: Sabe qué es una empresa y por qué necesita dinero para crecer (tema anterior).
    parent_check: "¿{{name}} puede explicarte qué es una acción usando la palabra 'pedacito de una empresa'?"
    fact_refs: []
    lessons:
    - position: 1
      slug: un-pedacito-de-la-limonaderia
      micro_objective: Reconocer que una acción es un pedacito real de una empresa, como un pedacito de la limonadería.
      narrative_beat: Dr. Rho corta un pastel de limón en pedacitos frente a Dina y compara cada pedacito con una acción de la limonadería.
      difficulty: 1
      suggested_families:
      - story
      - choice
    - position: 2
      slug: tener-una-accion-es-tener-un-pedacito
      micro_objective: Distinguir entre 'tener una acción' y simplemente 'querer una empresa', usando el pedacito como evidencia.
      narrative_beat: Zara Vex pregunta a Dino si admirar la limonadería es lo mismo que tener un pedacito real de ella.
      difficulty: 2
      suggested_families:
      - choice
      - analyze
    - position: 3
      slug: cuantos-pedacitos-tiene-una-empresa
      micro_objective: Reconocer que una empresa se puede dividir en muchos pedacitos pequeños, no solo uno grande.
      narrative_beat: Dr. Rho muestra el pastel cortado en diez pedacitos iguales y explica que una empresa puede repartirse así entre muchas personas.
      difficulty: 2
      suggested_families:
      - arrange
      - choice
    - position: 4
      slug: mi-primer-pedacito
      micro_objective: Aplicar la idea de acción como pedacito a una empresa nueva del reino.
      narrative_beat: Frente a una empresa nueva del mercado real, Dina decide qué significaría tener un pedacito de ella.
      difficulty: 3
      suggested_families:
      - choice
      - storyplay
  - position: 3
    slug: si-la-empresa-gana-si-la-empresa-pierde
    title_es: Si la empresa gana, si la empresa pierde
    concept: Si una empresa vende bien y gana dinero, su pedacito suele valer más; si le va mal, su pedacito suele valer menos.
    learning_objective: Al final, el niño puede explicar que el valor de una acción cambia según le vaya bien o mal a la empresa.
    key_vocabulary:
    - ganar
    - perder
    - valor
    - cambiar
    prior_knowledge: Sabe que una acción es un pedacito real de una empresa (tema anterior).
    parent_check: "¿{{name}} puede explicarte por qué el pedacito de una empresa vale más cuando a la empresa le va bien?"
    fact_refs: []
    lessons:
    - position: 1
      slug: la-limonaderia-vende-mucho
      micro_objective: Observar que cuando la limonadería vende mucho, su pedacito empieza a valer más.
      narrative_beat: Un día caluroso, la limonadería del reino vende más que nunca, y Dino nota que su pedacito ahora vale un poco más.
      difficulty: 1
      suggested_families:
      - story
      - money
    - position: 2
      slug: la-limonaderia-vende-poco
      micro_objective: Observar que cuando la limonadería vende poco, su pedacito puede valer menos.
      narrative_beat: Una semana de lluvia hace que casi nadie compre limonada, y Dina nota que su pedacito vale un poco menos que antes.
      difficulty: 2
      suggested_families:
      - money
      - analyze
    - position: 3
      slug: comparar-dos-empresas
      micro_objective: Comparar dos empresas del reino y decidir a cuál le fue mejor esta temporada.
      narrative_beat: Zara Vex muestra los resultados de dos negocios del mercado y reta a Dino a decidir cuál tuvo mejor temporada.
      difficulty: 2
      suggested_families:
      - analyze
      - choice
    - position: 4
      slug: mi-explicacion-del-cambio-de-valor
      micro_objective: Explicar, con un ejemplo propio, por qué el valor de un pedacito puede subir o bajar.
      narrative_beat: Dina explica a Dino, con el ejemplo de la limonadería, por qué su pedacito no siempre vale lo mismo.
      difficulty: 3
      suggested_families:
      - choice
      - storyplay
  - position: 4
    slug: comprar-una-accion-es-volverme-mini-dueno
    title_es: Comprar una acción me vuelve mini-dueño
    concept: Comprar una acción convierte a la persona en un mini-dueño de la empresa, con un pedacito de lo que la empresa gana o pierde.
    learning_objective: Al final, el niño puede explicar qué significa volverse mini-dueño de una empresa al comprar una acción.
    key_vocabulary:
    - comprar
    - mini-dueño
    - dueño
    - pertenecer
    prior_knowledge: Sabe que el valor de una acción cambia según le vaya bien o mal a la empresa (tema anterior).
    parent_check: "¿{{name}} puede explicarte qué significa ser 'mini-dueño' de una empresa al tener una acción?"
    fact_refs: []
    lessons:
    - position: 1
      slug: el-mini-dueno-de-la-limonaderia
      micro_objective: Reconocer que comprar un pedacito de la limonadería convierte a alguien en mini-dueño de ese negocio.
      narrative_beat: Dr. Rho entrega a Dina un pequeño pergamino que dice que ahora es mini-dueña de un pedacito de la limonadería.
      difficulty: 1
      suggested_families:
      - story
      - choice
    - position: 2
      slug: cuantos-mini-duenos-puede-tener-una-empresa
      micro_objective: Reconocer que una empresa puede tener muchos mini-dueños distintos al mismo tiempo.
      narrative_beat: Dino cuenta en el mercado a varias personas que también tienen pedacitos de la misma limonadería.
      difficulty: 2
      suggested_families:
      - arrange
      - choice
    - position: 3
      slug: que-gana-un-mini-dueno
      micro_objective: Explicar qué puede ganar un mini-dueño cuando a la empresa le va bien.
      narrative_beat: Zara Vex pregunta a Dina qué gana ella, como mini-dueña, cuando la limonadería vende mucho en un día caluroso.
      difficulty: 3
      suggested_families:
      - choice
      - analyze
    - position: 4
      slug: mi-decision-de-volverme-mini-dueno
      micro_objective: Decidir, en un escenario simulado, si conviene volverse mini-dueño de una empresa nueva.
      narrative_beat: Frente a un nuevo puesto del mercado, Dina decide si le gustaría volverse mini-dueña de ese negocio.
      difficulty: 3
      suggested_families:
      - storyplay
      - choice
  - position: 5
    slug: muchas-personas-un-mismo-pedacito
    title_es: Muchas personas, un mismo pedacito de historia
    concept: Muchas personas distintas pueden tener pedacitos de la misma empresa al mismo tiempo, cada una con su propio interés en que le vaya bien.
    learning_objective: Al final, el niño puede explicar que varias personas pueden ser mini-dueñas de la misma empresa a la vez.
    key_vocabulary:
    - varios
    - compartir
    - interés
    - juntos
    prior_knowledge: Sabe qué significa volverse mini-dueño al comprar una acción (tema anterior).
    parent_check: "¿{{name}} puede explicarte por qué muchas personas distintas pueden ser dueñas de la misma empresa?"
    fact_refs: []
    lessons:
    - position: 1
      slug: el-libro-de-los-mini-duenos
      micro_objective: Observar que la limonadería tiene un libro con los nombres de todos sus mini-dueños.
      narrative_beat: Dr. Rho muestra a Dino un libro grueso con los nombres de todas las personas que tienen un pedacito de la limonadería.
      difficulty: 1
      suggested_families:
      - story
      - choice
    - position: 2
      slug: todos-quieren-que-le-vaya-bien
      micro_objective: Reconocer que todos los mini-dueños de una empresa comparten el interés de que le vaya bien.
      narrative_beat: Zara Vex pregunta a Dina por qué todos los mini-dueños del libro celebran juntos cuando la limonadería vende mucho.
      difficulty: 2
      suggested_families:
      - choice
      - analyze
    - position: 3
      slug: un-pedacito-pequeno-tambien-cuenta
      micro_objective: Reconocer que un pedacito pequeño de una empresa vale y cuenta igual que uno más grande, en su proporción.
      narrative_beat: Dino se preocupa porque su pedacito es más pequeño que el de Dina, pero Dr. Rho le explica que igual cuenta.
      difficulty: 3
      suggested_families:
      - story
      - analyze
    - position: 4
      slug: mi-lugar-entre-los-mini-duenos
      micro_objective: Explicar, con un ejemplo propio, cómo se sentiría formar parte del grupo de mini-dueños de una empresa.
      narrative_beat: Dina imagina su nombre escrito en el libro de mini-dueños junto a otras personas del reino.
      difficulty: 3
      suggested_families:
      - storyplay
      - choice
  - position: 6
    slug: el-precio-de-una-accion-sube-y-baja
    title_es: El precio de una acción sube y baja
    concept: El precio de una acción cambia todos los días según lo que las personas creen que vale la empresa, y puede leerse en un gráfico simple.
    learning_objective: Al final, el niño puede leer un gráfico simple y decir si el precio de una acción subió o bajó.
    key_vocabulary:
    - precio
    - gráfico
    - subir
    - bajar
    prior_knowledge: Sabe que varias personas pueden ser mini-dueñas de la misma empresa (tema anterior).
    parent_check: "¿{{name}} puede mirar un gráfico simple y decirte si el precio de una acción subió o bajó?"
    fact_refs: []
    lessons:
    - position: 1
      slug: la-linea-que-sube-y-baja
      micro_objective: Observar que el precio de una acción se puede dibujar como una línea que sube y baja con los días.
      narrative_beat: Dr. Rho muestra a Dina un pergamino con una línea que sube y baja, cada punto representando un día de la limonadería.
      difficulty: 2
      suggested_families:
      - story
      - money
    - position: 2
      slug: leer-un-punto-del-grafico
      micro_objective: Leer un punto específico del gráfico y decir si ese día el precio era mayor o menor que el día anterior.
      narrative_beat: Zara Vex señala dos puntos del gráfico y reta a Dino a decir cuál de los dos días valía más el pedacito.
      difficulty: 2
      suggested_families:
      - analyze
      - money
    - position: 3
      slug: por-que-cambia-el-precio-cada-dia
      micro_objective: Explicar, con un ejemplo, por qué el precio de una acción puede cambiar de un día a otro.
      narrative_beat: Dr. Rho explica que el precio cambia según cuánta gente quiere comprar o vender su pedacito ese día.
      difficulty: 3
      suggested_families:
      - story
      - analyze
    - position: 4
      slug: mi-lectura-del-grafico
      micro_objective: Aplicar la lectura de un gráfico nuevo para describir la semana completa de una empresa.
      narrative_beat: Frente a un gráfico nuevo del mercado, Dina describe si la semana fue buena o difícil para esa empresa.
      difficulty: 3
      suggested_families:
      - analyze
      - choice
  - position: 7
    slug: una-accion-no-es-una-promesa
    title_es: Una acción no es una promesa de ganar siempre
    concept: Tener una acción no garantiza ganar dinero siempre; el valor puede subir, bajar, o quedarse igual, y eso es parte normal de invertir.
    learning_objective: Al final, el niño puede explicar que una acción no promete ganancias seguras.
    key_vocabulary:
    - promesa
    - garantizar
    - riesgo
    - normal
    prior_knowledge: Sabe leer un gráfico simple de subidas y bajadas (tema anterior).
    parent_check: "¿{{name}} puede explicarte por qué una acción nunca es una promesa segura de ganar dinero?"
    fact_refs: []
    lessons:
    - position: 1
      slug: nadie-le-promete-nada-a-la-limonaderia
      micro_objective: Reconocer que ni siquiera Dr. Rho puede prometer que el precio de una acción solo va a subir.
      narrative_beat: Dino le pregunta a Dr. Rho si su pedacito siempre va a valer más, y Dr. Rho responde con honestidad que nadie puede prometer eso.
      difficulty: 2
      suggested_families:
      - story
      - choice
    - position: 2
      slug: comparar-una-promesa-real-con-una-falsa
      micro_objective: Comparar una explicación honesta ('puede subir o bajar') con una promesa poco creíble ('siempre va a ganar').
      narrative_beat: Zara Vex presenta dos vendedores del mercado, uno que promete ganancias seguras y otro que explica el riesgo con honestidad.
      difficulty: 3
      suggested_families:
      - analyze
      - choice
    - position: 3
      slug: subir-bajar-o-quedarse-igual-es-normal
      micro_objective: Reconocer que subir, bajar o quedarse igual son resultados normales al tener una acción.
      narrative_beat: 'Dr. Rho muestra tres pedacitos distintos del mercado: uno subió, uno bajó y uno se quedó casi igual, y explica que los tres son normales.'
      difficulty: 3
      suggested_families:
      - arrange
      - analyze
    - position: 4
      slug: mi-explicacion-sin-promesas
      micro_objective: Explicar, sin usar promesas exageradas, cómo funciona el valor de una acción.
      narrative_beat: Dina le explica a un aprendiz nuevo del reino cómo funciona una acción, con cuidado de no prometer nada que no pueda cumplir.
      difficulty: 3
      suggested_families:
      - choice
      - storyplay
  - position: 8
    slug: mi-primer-pedacito-de-empresa
    title_es: Practicar mi primer pedacito de empresa
    concept: Reconocer una acción como pedacito real de un negocio real, en escenarios nuevos, junta todo lo aprendido en la saga.
    learning_objective: Al final, el niño puede reconocer y explicar una acción como un pedacito real de una empresa real en una situación nueva.
    key_vocabulary:
    - reconocer
    - pedacito
    - empresa
    - explicar
    prior_knowledge: Ha completado los seis temas anteriores sobre qué es una acción (temas anteriores).
    parent_check: "¿{{name}} puede reconocer, en un ejemplo nuevo, que una acción es un pedacito real de una empresa real?"
    fact_refs: []
    lessons:
    - position: 1
      slug: una-empresa-nueva-en-el-mercado
      micro_objective: Reconocer los elementos básicos de una empresa nueva presentada en el mercado del reino.
      narrative_beat: Un nuevo puesto de pan aparece en el mercado del reino, y Dina identifica que es una empresa como la limonadería.
      difficulty: 2
      suggested_families:
      - story
      - choice
    - position: 2
      slug: decidir-si-quiero-un-pedacito
      micro_objective: Aplicar lo aprendido para decidir, con razones propias, si le gustaría tener un pedacito de la nueva empresa.
      narrative_beat: Zara Vex reta a Dino a explicar por qué le gustaría, o no, tener un pedacito del nuevo puesto de pan.
      difficulty: 3
      suggested_families:
      - choice
      - analyze
    - position: 3
      slug: explicar-el-riesgo-sin-miedo
      micro_objective: Explicar con calma que el pedacito de la nueva empresa puede subir o bajar, sin exagerar el miedo ni la promesa.
      narrative_beat: Dr. Rho pide a Dina que le explique el riesgo del nuevo puesto de pan, sin asustarse ni prometer de más.
      difficulty: 3
      suggested_families:
      - storyplay
      - choice
    - position: 4
      slug: mi-pedacito-explicado-completo
      micro_objective: Aplicar con seguridad todo lo aprendido sobre acciones para explicar un pedacito de empresa a un personaje nuevo.
      narrative_beat: Dina le explica a un aprendiz nuevo del reino, de principio a fin, qué es un pedacito real de una empresa real.
      difficulty: 3
      suggested_families:
      - choice
      - story
  - position: 9
    slug: el-cofre-del-repaso
    kind: review_spaced
    title_es: El Cofre del Repaso
    concept: Dr. Rho abre el cofre real de las canastas para poner a prueba, sin enseñar nada nuevo, todo lo aprendido en la saga Un Pedacito de una Empresa.
    learning_objective: Al final, el niño puede recordar y aplicar, sin ayuda nueva, los conceptos principales de la saga Un Pedacito de una Empresa.
    key_vocabulary:
    - empresa
    - acción
    - pedacito
    - valor
    prior_knowledge: Ha completado los ocho temas de la saga Un Pedacito de una Empresa (aventura 5, saga 1).
