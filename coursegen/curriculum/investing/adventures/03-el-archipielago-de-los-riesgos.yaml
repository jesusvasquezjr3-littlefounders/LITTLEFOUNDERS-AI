schema_version: 1
adventure:
  position: 3
  slug: el-archipielago-de-los-riesgos
  theme: archipelago
  age_tier: tier2
  title:
    en-US: The Archipelago of Risks
    es-MX: El Archipiélago de los Riesgos
    pt-BR: O Arquipélago dos Riscos
  description:
    en-US: Dina and Liruf sail with Zara Vex among islands where different paths offer different possible
      rewards -- and different risks.
    es-MX: Dina y Liruf navegan con Zara Vex entre islas donde distintos caminos ofrecen distintos premios
      posibles -y distintos riesgos.
    pt-BR: Dina e Liruf navegam com Zara Vex entre ilhas onde caminhos diferentes oferecem prêmios possíveis
      -e riscos- diferentes.
  narrative_arc: 'Dina y Liruf zarpan del valle hacia un archipiélago donde Zara Vex, estratega experta
    en decisiones difíciles, los reta a comparar una laguna tranquila y previsible con un estrecho agitado
    e incierto. Ahí descubren qué es un riesgo, por qué un premio posible más grande casi siempre trae
    más riesgo, y por qué repartir las monedas entre varias canoas protege mejor que cargarlas todas en
    una. Aprenden a informarse -preguntar, observar, escuchar a quien ya fue- antes de decidir, y a aceptar
    que, incluso decidiendo bien, perder también pasa: lo importante es aprender, ajustar y volver a intentarlo.
    Al despedirse del archipiélago, están listos para llegar a una ciudad donde las metas se vuelven más
    grandes y los precios cambian con el paso del tiempo.'
sagas:
- position: 1
  slug: caminos-seguros-y-arriesgados
  icon: explore
  title:
    en-US: Safe Paths and Risky Paths
    es-MX: Caminos Seguros y Caminos Arriesgados
    pt-BR: Caminhos Seguros e Caminhos Arriscados
  description:
    en-US: Meet a calm lagoon and a restless strait, and discover what the word 'risk' really means.
    es-MX: Conoce una laguna tranquila y un estrecho agitado, y descubre qué significa de verdad la palabra
      'riesgo'.
    pt-BR: Conheça uma lagoa tranquila e um estreito agitado, e descubra o que a palavra 'risco' realmente
      significa.
  topics:
  - position: 1
    slug: dos-caminos-uno-tranquilo-y-uno-agitado
    title_es: 'Dos caminos: uno tranquilo y uno agitado'
    concept: El archipiélago tiene una laguna tranquila donde siempre se pesca un poco, y un estrecho
      agitado donde a veces se pesca mucho más y a veces casi nada.
    learning_objective: Al final, el niño puede describir la diferencia entre una opción tranquila y previsible
      y una opción agitada e incierta.
    key_vocabulary:
    - tranquilo
    - agitado
    - previsible
    - incierto
    prior_knowledge: Ha aprendido a guardar con premio en la aldea del valle (aventura 2).
    parent_check: ¿{{name}} puede describir la diferencia entre algo tranquilo y previsible, y algo agitado
      e incierto?
    fact_refs: []
    lessons:
    - position: 1
      slug: la-laguna-y-el-estrecho
      micro_objective: Observar la diferencia entre una laguna tranquila y previsible y un estrecho agitado
        e incierto.
      narrative_beat: Zara Vex lleva a Dina y Liruf en canoa hasta el archipiélago, donde señala una laguna
        tranquila y, más allá, un estrecho de aguas agitadas.
      difficulty: 1
      suggested_families:
      - story
      - choice
    - position: 2
      slug: pescar-en-cada-lugar
      micro_objective: Comparar lo que se obtiene pescando en la laguna tranquila contra el estrecho agitado.
      narrative_beat: Dr. Rho muestra que en la laguna casi siempre se pesca la misma cantidad, mientras
        que en el estrecho a veces se pesca mucho y a veces casi nada.
      difficulty: 2
      suggested_families:
      - analyze
      - choice
    - position: 3
      slug: por-que-hay-dos-caminos
      micro_objective: Explicar por qué el archipiélago ofrece dos caminos tan distintos entre sí.
      narrative_beat: Zara Vex pregunta a Liruf por qué cree que el archipiélago tiene un camino tan tranquilo
        y otro tan agitado.
      difficulty: 2
      suggested_families:
      - choice
      - story
    - position: 4
      slug: elegir-mi-primer-camino
      micro_objective: Aplicar la observación de ambos caminos para elegir uno, explicando la razón de
        la elección.
      narrative_beat: Frente a los dos caminos por primera vez, Dina elige cuál explorar hoy y explica
        su razón a Zara Vex.
      difficulty: 3
      suggested_families:
      - choice
      - analyze
  - position: 2
    slug: que-es-un-riesgo
    title_es: Qué es un riesgo
    concept: Un riesgo es la posibilidad de que algo no salga como se espera, ya sea mejor o peor de lo
      previsto.
    learning_objective: Al final, el niño puede explicar con sus palabras qué significa 'riesgo'.
    key_vocabulary:
    - riesgo
    - posibilidad
    - esperar
    - incierto
    prior_knowledge: Sabe distinguir un camino tranquilo de uno agitado (tema anterior).
    parent_check: ¿{{name}} puede explicar, con sus palabras, qué significa la palabra 'riesgo'?
    fact_refs: []
    lessons:
    - position: 1
      slug: la-red-que-podria-o-no-podria
      micro_objective: Reconocer que un riesgo es la posibilidad de que algo salga distinto a lo esperado.
      narrative_beat: Zara Vex lanza una red al estrecho agitado y explica que esta vez podría salir llena
        de peces, o casi vacía.
      difficulty: 1
      suggested_families:
      - story
      - choice
    - position: 2
      slug: riesgo-en-varias-escenas
      micro_objective: Identificar situaciones del archipiélago donde existe un riesgo real.
      narrative_beat: Dr. Rho muestra varias escenas del archipiélago y pide a Dina identificar en cuáles
        existe un riesgo.
      difficulty: 2
      suggested_families:
      - analyze
      - choice
    - position: 3
      slug: riesgo-no-es-siempre-malo
      micro_objective: Explicar que un riesgo puede terminar mejor o peor de lo esperado, no siempre mal.
      narrative_beat: Zara Vex explica a Liruf que un riesgo puede terminar mejor de lo esperado, no solo
        peor.
      difficulty: 2
      suggested_families:
      - choice
      - story
    - position: 4
      slug: nombrar-el-riesgo-de-una-escena-nueva
      micro_objective: Aplicar la definición de riesgo nombrando el riesgo presente en una escena nueva.
      narrative_beat: Frente a una escena nueva del archipiélago, Dina nombra con sus palabras cuál es
        el riesgo presente.
      difficulty: 3
      suggested_families:
      - choice
      - analyze
  - position: 3
    slug: mas-premio-posible-mas-riesgo-posible
    title_es: Más premio posible, más riesgo posible
    concept: Casi siempre, un camino que ofrece un premio posible más grande también trae más riesgo de
      que salga mal.
    learning_objective: Al final, el niño puede explicar la relación general entre un premio posible más
      grande y un riesgo posible más grande.
    key_vocabulary:
    - premio
    - riesgo
    - relación
    - grande
    prior_knowledge: Sabe qué significa la palabra 'riesgo' (tema anterior).
    parent_check: ¿{{name}} puede explicar por qué un premio posible más grande casi siempre viene con
      más riesgo?
    prerequisites:
    - path: la-aldea-del-interes/premio-por-guardar/el-premio-que-aparece-solo
      strength: soft
      reason: Ya haber visto que guardar con calma da un premio seguro ayuda a notar, por contraste, que
        un premio más grande y rápido casi siempre trae más riesgo.
    fact_refs:
    - risk.reward_tradeoff_pairs
    lessons:
    - position: 1
      slug: la-laguna-segura-y-el-estrecho-generoso
      micro_objective: Observar que el estrecho, más riesgoso, también ofrece la posibilidad de un premio
        más grande que la laguna.
      narrative_beat: Dr. Rho recuerda que la laguna casi siempre da un premio chico y seguro, mientras
        que el estrecho a veces da un premio enorme.
      difficulty: 1
      suggested_families:
      - story
      - choice
    - position: 2
      slug: comparar-premio-posible-y-riesgo
      micro_objective: Comparar el premio posible y el riesgo posible de la laguna contra el estrecho.
      narrative_beat: Zara Vex pide a Liruf comparar, lado a lado, el premio posible y el riesgo posible
        de cada camino del archipiélago.
      difficulty: 2
      suggested_families:
      - analyze
      - choice
    - position: 3
      slug: por-que-van-juntos
      micro_objective: Explicar por qué un premio posible más grande casi siempre viene acompañado de
        más riesgo.
      narrative_beat: Dr. Rho pregunta a Dina por qué cree que un premio más grande casi siempre trae
        más riesgo de por medio.
      difficulty: 2
      suggested_families:
      - choice
      - story
    - position: 4
      slug: aplicar-la-relacion-a-un-camino-nuevo
      micro_objective: Aplicar la relación entre premio posible y riesgo a un camino nuevo del archipiélago.
      narrative_beat: Frente a un tercer camino nuevo del archipiélago, Dina predice si su riesgo es alto
        o bajo según el premio que promete.
      difficulty: 3
      suggested_families:
      - choice
      - analyze
  - position: 4
    slug: no-todo-riesgo-es-igual-de-grande
    title_es: No todo riesgo es igual de grande
    concept: Existen riesgos pequeños, medianos y grandes; no todos merecen la misma precaución.
    learning_objective: 'Al final, el niño puede clasificar distintos riesgos según su tamaño: pequeño,
      mediano o grande.'
    key_vocabulary:
    - pequeño
    - mediano
    - grande
    - precaución
    prior_knowledge: Sabe que más premio posible casi siempre trae más riesgo (tema anterior).
    parent_check: ¿{{name}} puede dar un ejemplo de un riesgo pequeño y uno de un riesgo grande?
    fact_refs: []
    lessons:
    - position: 1
      slug: tres-islas-tres-tamanos-de-riesgo
      micro_objective: 'Observar que existen riesgos de distinto tamaño: pequeños, medianos y grandes.'
      narrative_beat: Zara Vex presenta tres islas del archipiélago, cada una con un riesgo de tamaño
        distinto para explorarla.
      difficulty: 1
      suggested_families:
      - story
      - choice
    - position: 2
      slug: clasificar-los-riesgos-de-las-islas
      micro_objective: Clasificar distintos riesgos según si son pequeños, medianos o grandes.
      narrative_beat: Dr. Rho pide a Liruf clasificar el riesgo de cada isla en pequeño, mediano o grande.
      difficulty: 2
      suggested_families:
      - arrange
      - analyze
    - position: 3
      slug: por-que-no-todos-merecen-la-misma-precaucion
      micro_objective: Explicar por qué un riesgo pequeño no necesita la misma precaución que uno grande.
      narrative_beat: Dr. Rho pregunta a Dina por qué cree que un riesgo pequeño no necesita la misma
        precaución que uno grande.
      difficulty: 2
      suggested_families:
      - choice
      - story
    - position: 4
      slug: clasificar-un-riesgo-nuevo
      micro_objective: Aplicar la clasificación de tamaño de riesgo a una situación nueva del archipiélago.
      narrative_beat: Frente a una nueva isla del archipiélago, Dina clasifica su riesgo y decide cuánta
        precaución merece.
      difficulty: 3
      suggested_families:
      - choice
      - analyze
  - position: 5
    slug: como-se-siente-arriesgarse
    title_es: Cómo se siente arriesgarse
    concept: Arriesgarse puede sentirse emocionante y también un poco nervioso al mismo tiempo, y reconocer
      esa mezcla ayuda a decidir con más calma.
    learning_objective: Al final, el niño puede reconocer y nombrar la mezcla de emociones que aparece
      al arriesgarse.
    key_vocabulary:
    - emoción
    - nervios
    - arriesgarse
    - sentir
    prior_knowledge: Sabe clasificar riesgos según su tamaño (tema anterior).
    parent_check: ¿{{name}} puede nombrar cómo se siente cuando está por tomar un riesgo (emoción, nervios,
      ambos)?
    fact_refs: []
    lessons:
    - position: 1
      slug: el-corazon-acelerado-de-liruf
      micro_objective: Reconocer la mezcla de emoción y nervios que aparece al estar por tomar un riesgo.
      narrative_beat: A Liruf se le acelera el corazón antes de lanzar la red al estrecho agitado, mezcla
        de emoción y nervios.
      difficulty: 1
      suggested_families:
      - story
      - choice
    - position: 2
      slug: nombrar-lo-que-se-siente
      micro_objective: Nombrar con palabras propias la mezcla de emociones que aparece al arriesgarse.
      narrative_beat: Dr. Rho pregunta a Dina qué palabras usaría para describir lo que siente antes de
        arriesgarse.
      difficulty: 2
      suggested_families:
      - choice
      - analyze
    - position: 3
      slug: hasta-zara-lo-siente
      micro_objective: Reconocer que sentir nervios frente al riesgo es normal, incluso en alguien con
        experiencia.
      narrative_beat: Zara Vex comparte que, incluso siendo estratega, todavía siente nervios antes de
        decisiones importantes.
      difficulty: 2
      suggested_families:
      - story
      - choice
    - position: 4
      slug: decidir-con-calma-a-pesar-de-los-nervios
      micro_objective: Aplicar el reconocimiento de la mezcla de emociones para decidir con más calma
        frente a un riesgo nuevo.
      narrative_beat: Frente a un nuevo riesgo del archipiélago, Liruf nombra lo que siente y decide con
        más calma qué hacer.
      difficulty: 3
      suggested_families:
      - choice
      - storyplay
  - position: 6
    slug: elegir-un-camino-con-informacion
    title_es: Elegir un camino con información
    concept: Buscar información antes de decidir -preguntar, observar, comparar- ayuda a elegir un camino
      con más confianza.
    learning_objective: Al final, el niño puede aplicar la búsqueda de información antes de decidir entre
      dos caminos con riesgo distinto.
    key_vocabulary:
    - información
    - preguntar
    - observar
    - confianza
    prior_knowledge: Reconoce la mezcla de emociones al arriesgarse (tema anterior).
    parent_check: ¿{{name}} busca información (preguntar, observar) antes de decidir algo importante?
    fact_refs: []
    lessons:
    - position: 1
      slug: preguntar-a-los-pescadores
      micro_objective: Observar cómo buscar información (preguntar a otros) ayuda antes de elegir un camino.
      narrative_beat: Antes de elegir un camino, Dr. Rho le sugiere a Dina preguntar a los pescadores
        del archipiélago qué han visto últimamente.
      difficulty: 1
      suggested_families:
      - story
      - choice
    - position: 2
      slug: observar-antes-de-elegir
      micro_objective: Aplicar la observación cuidadosa como una forma de reunir información antes de
        decidir.
      narrative_beat: Zara Vex enseña a Liruf a observar el color del agua y el viento antes de elegir
        qué camino tomar.
      difficulty: 2
      suggested_families:
      - analyze
      - choice
    - position: 3
      slug: comparar-lo-que-escucho
      micro_objective: Comparar información de varias fuentes antes de tomar una decisión.
      narrative_beat: Dr. Rho pregunta a Dina qué hace si dos pescadores le dan información distinta sobre
        el mismo camino.
      difficulty: 2
      suggested_families:
      - choice
      - analyze
    - position: 4
      slug: elegir-con-toda-mi-informacion
      micro_objective: Aplicar toda la información reunida para elegir un camino con más confianza.
      narrative_beat: Con toda la información reunida, Dina elige su camino en el archipiélago y explica
        en qué se basó.
      difficulty: 3
      suggested_families:
      - choice
      - analyze
  - position: 7
    slug: lo-que-no-puedo-saber-antes-de-elegir
    title_es: Lo que no puedo saber antes de elegir
    concept: Por más información que se reúna, siempre queda algo que no se puede saber con certeza antes
      de decidir; eso también es parte del riesgo.
    learning_objective: Al final, el niño puede reconocer que, incluso con información, algo del resultado
      sigue siendo incierto.
    key_vocabulary:
    - incierto
    - certeza
    - información
    - límite
    prior_knowledge: Sabe buscar información antes de elegir un camino (tema anterior).
    parent_check: ¿{{name}} entiende que, aunque se informe bien, algunas cosas no se pueden saber con
      total certeza?
    fact_refs: []
    lessons:
    - position: 1
      slug: ni-los-pescadores-mas-sabios-lo-saben-todo
      micro_objective: Reconocer que incluso con mucha información, el resultado final sigue siendo incierto.
      narrative_beat: Un pescador muy experimentado le confiesa a Dina que, ni con toda su experiencia,
        puede saber con certeza qué traerá el estrecho hoy.
      difficulty: 1
      suggested_families:
      - story
      - choice
    - position: 2
      slug: lo-que-si-se-y-lo-que-no-se
      micro_objective: Distinguir, en una decisión, qué información sí se tiene y qué queda incierto.
      narrative_beat: Dr. Rho ayuda a Liruf a separar, en su decisión, lo que sí sabe de lo que sigue siendo
        incierto.
      difficulty: 2
      suggested_families:
      - analyze
      - choice
    - position: 3
      slug: eso-tambien-es-parte-del-riesgo
      micro_objective: Explicar por qué lo que no se puede saber también forma parte de lo que hace riesgosa
        una decisión.
      narrative_beat: Zara Vex explica a Liruf que esa parte incierta, la que nadie puede saber de antemano,
        es justamente parte de lo que hace riesgosa una decisión.
      difficulty: 2
      suggested_families:
      - choice
      - story
    - position: 4
      slug: decidir-aceptando-la-incertidumbre
      micro_objective: Aplicar la decisión de avanzar aceptando que una parte del resultado seguirá siendo
        incierta.
      narrative_beat: Frente a un nuevo camino, Dina decide avanzar aceptando que, aunque se informó bien,
        una parte seguirá siendo incierta.
      difficulty: 3
      suggested_families:
      - choice
      - analyze
  - position: 8
    slug: mi-primera-decision-con-riesgo
    title_es: Mi primera decisión con riesgo
    concept: Tomar una primera decisión propia frente a un riesgo real, usando información, calma y aceptando
      la incertidumbre, cierra el aprendizaje de esta saga.
    learning_objective: Al final, el niño puede tomar una decisión propia frente a un riesgo, explicando
      su proceso completo.
    key_vocabulary:
    - decisión
    - riesgo
    - proceso
    - propia
    prior_knowledge: Ha aprendido a informarse, sentir con calma y aceptar la incertidumbre frente a un
      riesgo (temas anteriores).
    parent_check: ¿{{name}} puede contarte una decisión propia donde consideró un riesgo antes de actuar?
    fact_refs: []
    lessons:
    - position: 1
      slug: el-momento-de-decidir
      micro_objective: Reconocer, dentro de una historia, el momento de tomar una primera decisión propia
        frente a un riesgo real.
      narrative_beat: Dr. Rho invita a Dina a tomar su primera decisión real frente a los dos caminos
        del archipiélago, sin que nadie decida por ella.
      difficulty: 1
      suggested_families:
      - story
      - choice
    - position: 2
      slug: los-pasos-de-mi-decision
      micro_objective: 'Ordenar los pasos de un buen proceso de decisión frente a un riesgo: informarse,
        sentir con calma, decidir.'
      narrative_beat: 'Zara Vex ayuda a Liruf a ordenar los pasos que seguirá para tomar su propia decisión:
        informarse, sentir con calma, decidir.'
      difficulty: 2
      suggested_families:
      - choice
      - arrange
    - position: 3
      slug: explicar-mi-decision-en-voz-alta
      micro_objective: Explicar en voz alta el proceso completo detrás de una decisión propia frente a
        un riesgo.
      narrative_beat: Dina practica explicar en voz alta todo su proceso antes de tomar su decisión final
        en el archipiélago.
      difficulty: 2
      suggested_families:
      - storyplay
      - choice
    - position: 4
      slug: tomar-mi-decision
      micro_objective: Aplicar con seguridad el proceso completo de decisión frente a un riesgo real propio.
      narrative_beat: Con su proceso completo aplicado, Dina toma su primera decisión real frente al riesgo
        del archipiélago.
      difficulty: 3
      suggested_families:
      - choice
      - story
  - position: 9
    slug: el-cofre-del-repaso
    kind: review_spaced
    title_es: El Cofre del Repaso
    concept: Zara Vex abre el cofre con los recuerdos de la saga Caminos Seguros y Caminos Arriesgados.
    learning_objective: Al final, el niño puede recordar y aplicar, sin ayuda nueva, los conceptos principales
      de la saga Caminos Seguros y Caminos Arriesgados.
    key_vocabulary:
    - riesgo
    - premio
    - información
    - decidir
    prior_knowledge: Ha completado los ocho temas de la saga Caminos Seguros y Caminos Arriesgados (aventura
      3, saga 1).
    fact_refs: []
    review_of:
    - el-archipielago-de-los-riesgos/caminos-seguros-y-arriesgados/dos-caminos-uno-tranquilo-y-uno-agitado
    - el-archipielago-de-los-riesgos/caminos-seguros-y-arriesgados/que-es-un-riesgo
    - el-archipielago-de-los-riesgos/caminos-seguros-y-arriesgados/mas-premio-posible-mas-riesgo-posible
    - el-archipielago-de-los-riesgos/caminos-seguros-y-arriesgados/no-todo-riesgo-es-igual-de-grande
    - el-archipielago-de-los-riesgos/caminos-seguros-y-arriesgados/como-se-siente-arriesgarse
    - el-archipielago-de-los-riesgos/caminos-seguros-y-arriesgados/elegir-un-camino-con-informacion
    - el-archipielago-de-los-riesgos/caminos-seguros-y-arriesgados/lo-que-no-puedo-saber-antes-de-elegir
    - el-archipielago-de-los-riesgos/caminos-seguros-y-arriesgados/mi-primera-decision-con-riesgo
    lessons:
    - position: 1
      slug: el-cofre-se-abre
      micro_objective: Recordar, sin ayuda nueva, la diferencia entre un camino tranquilo y uno agitado,
        y qué significa 'riesgo'.
      narrative_beat: Zara Vex abre un cofre de conchas de recuerdo del archipiélago y reta a Dina a recordar
        lo primero que aprendió.
      difficulty: 1
      suggested_families:
      - story
      - choice
    - position: 2
      slug: recordar-en-orden
      micro_objective: Recordar y ordenar de nuevo la relación entre premio y riesgo, y cómo clasificar
        riesgos de distinto tamaño.
      narrative_beat: Liruf saca del cofre los recuerdos mezclados de la saga y los ordena de memoria,
        sin que Dr. Rho le dé ninguna pista nueva.
      difficulty: 1
      suggested_families:
      - arrange
      - choice
    - position: 3
      slug: aplicar-lo-guardado
      micro_objective: Aplicar de nuevo, en una escena distinta, cómo buscar información y aceptar la
        incertidumbre antes de decidir.
      narrative_beat: Dr. Rho presenta una escena nueva del archipiélago y pregunta a Dina si recuerda,
