schema_version: 1
adventure:
  position: 1
  slug: el-jardin-del-tiempo
  theme: forest
  age_tier: tier2
  title:
    en-US: The Garden of Time
    es-MX: El Jardín del Tiempo
    pt-BR: O Jardim do Tempo
  description:
    en-US: Dina and Dino enter an ancient forest where Dr. Rho, its patient old gardener, teaches them
      that time itself -- not just effort -- is what makes what's saved grow big.
    es-MX: Dina y Dino entran a un bosque antiguo donde Dr. Rho, su paciente jardinero, les enseña que
      el tiempo -y no solo el esfuerzo- es lo que hace crecer grande lo que se guarda.
    pt-BR: Dina e Dino entram numa floresta antiga onde Dr. Rho, seu paciente jardineiro, ensina que o
      tempo -e não só o esforço- é o que faz crescer grande o que se guarda.
  narrative_arc: 'Dina y Dino se internan en un bosque antiguo donde Dr. Rho ha cuidado el mismo jardín
    durante décadas. Él les revela el secreto que abre este viaje: el tiempo mismo es una herramienta
    -sembrar una semilla y dejarla crecer sin tocarla produce algo mucho más grande que comerse la fruta
    de inmediato. Zara Vex reta a ambos con acertijos del bosque sobre paciencia, protección y constancia,
    mientras Dino aprende a domar sus ganas de tenerlo todo ya. Al final del bosque, Dina y Dino están
    listos para descubrir que ese mismo tiempo, aplicado a las monedas guardadas en la aldea del valle,
    también hace crecer un premio.'
sagas:
- position: 1
  slug: semilla-que-espera
  icon: eco
  title:
    en-US: The Seed That Waits
    es-MX: La Semilla que Espera
    pt-BR: A Semente que Espera
  description:
    en-US: Plant something today and discover why it only becomes big after time passes.
    es-MX: Planta algo hoy y descubre por qué solo se hace grande después de que pasa el tiempo.
    pt-BR: Plante algo hoje e descubra por que só fica grande depois que o tempo passa.
  topics:
  - position: 1
    slug: que-es-sembrar-para-el-futuro
    title_es: Qué es sembrar para el futuro
    concept: Sembrar una semilla hoy significa guardar algo pequeño ahora para tener algo grande después;
      guardar dinero funciona igual.
    learning_objective: Al final, el niño puede explicar que sembrar hoy es guardar algo pequeño para
      tener algo más grande en el futuro.
    key_vocabulary:
    - sembrar
    - semilla
    - futuro
    - guardar
    prior_knowledge: Ha ganado, ahorrado y gastado dinero en aventuras anteriores (educación financiera
      y emprendimiento).
    parent_check: ¿{{name}} puede explicarte, con sus palabras, qué significa 'sembrar hoy para el futuro'?
    fact_refs: []
    lessons:
    - position: 1
      slug: las-manos-llenas-de-tierra-de-dr-rho
      micro_objective: Reconocer que una semilla pequeña plantada hoy se convierte en algo grande después
        de un tiempo.
      narrative_beat: Dina y Dino entran a un bosque antiguo donde Dr. Rho, con las manos llenas de tierra,
        planta una semilla diminuta y les promete que un día será un árbol enorme.
      difficulty: 1
      suggested_families:
      - story
      - choice
    - position: 2
      slug: una-semilla-y-una-moneda
      micro_objective: Comparar sembrar una semilla con guardar una moneda como la misma idea de 'algo
        pequeño ahora, algo grande después'.
      narrative_beat: Dr. Rho muestra una canasta con una semilla y una moneda guardada, y pregunta a
        Dina en qué se parecen.
      difficulty: 2
      suggested_families:
      - choice
      - analyze
    - position: 3
      slug: por-que-no-hay-arbol-de-inmediato
      micro_objective: Explicar con palabras propias por qué sembrar hoy no produce un resultado grande
        de inmediato.
      narrative_beat: Zara Vex reta a Dino a explicar, con sus propias palabras, por qué sembrar hoy no
        da un árbol de inmediato.
      difficulty: 2
      suggested_families:
      - story
      - choice
    - position: 4
      slug: quien-siembra-para-el-futuro
      micro_objective: Aplicar el concepto de sembrar para el futuro identificándolo en una escena nueva.
      narrative_beat: Frente a una nueva escena del bosque, Dina identifica sin ayuda cuál de dos personajes
        está 'sembrando para el futuro' y cuál solo quiere todo ya.
      difficulty: 3
      suggested_families:
      - choice
      - analyze
  - position: 2
    slug: lo-que-crece-solo-con-el-tiempo
    title_es: Lo que crece solo con el tiempo
    concept: Algunas cosas no se hacen más grandes por más esfuerzo, sino porque pasa el tiempo; una semilla
      necesita días y semanas, no solo cuidado.
    learning_objective: Al final, el niño puede reconocer que ciertas cosas crecen porque pasa el tiempo,
      no solo porque se les pone más esfuerzo.
    key_vocabulary:
    - tiempo
    - crecer
    - esperar
    - paso a paso
    prior_knowledge: Sabe que sembrar hoy da algo grande en el futuro (tema anterior).
    parent_check: ¿{{name}} puede dar un ejemplo de algo que crece solo porque pasa el tiempo, no porque
      se le ponga más esfuerzo?
    fact_refs: []
    lessons:
    - position: 1
      slug: regar-tres-veces-en-un-dia
      micro_objective: Reconocer que regar más no acelera el paso del tiempo que una semilla necesita
        para crecer.
      narrative_beat: Dino riega la semilla tres veces en un mismo día, esperando verla convertida en
        árbol al instante, pero Dr. Rho le explica que el tiempo no se puede apurar con más agua.
      difficulty: 1
      suggested_families:
      - story
      - choice
    - position: 2
      slug: una-semilla-de-hoy-y-una-de-hace-un-mes
      micro_objective: Identificar que la semilla plantada hace más tiempo está más crecida, sin que nadie
        le haya puesto más esfuerzo.
      narrative_beat: Dr. Rho muestra dos semillas idénticas, una plantada hace un día y otra hace un
        mes, y pide a Dina identificar cuál está más crecida.
      difficulty: 2
      suggested_families:
      - analyze
      - choice
    - position: 3
      slug: otras-cosas-que-tardan-en-crecer
      micro_objective: Nombrar otro ejemplo, distinto a la semilla, de algo que crece solo porque pasa
        el tiempo.
      narrative_beat: Zara Vex pregunta a Dino qué otras cosas del bosque tardan en crecer aunque nadie
        las apure.
      difficulty: 2
      suggested_families:
      - story
      - choice
    - position: 4
      slug: dos-brotes-nuevos
      micro_objective: Explicar, en una escena nueva, por qué un brote más grande no significa que recibió
        más esfuerzo, sino más tiempo.
      narrative_beat: Ante dos brotes nuevos del bosque, Dina explica por qué uno se ve más grande sin
        que haya recibido más cuidado que el otro.
      difficulty: 3
      suggested_families:
      - choice
      - analyze
  - position: 3
    slug: plantar-hoy-comer-manana
    title_es: Plantar hoy, comer mañana
    concept: Elegir plantar una semilla en vez de comerla de inmediato es elegir tener más fruta después,
      aunque signifique esperar.
    learning_objective: Al final, el niño puede decidir entre comer una fruta ahora o plantar su semilla
      para tener más fruta después.
    key_vocabulary:
    - plantar
    - esperar
    - elegir
    - después
    prior_knowledge: Sabe que las cosas crecen con el tiempo, no con prisa (tema anterior).
    parent_check: ¿{{name}} puede explicar la diferencia entre comerse algo ahora y guardar su 'semilla'
      para tener más después?
    fact_refs: []
    lessons:
    - position: 1
      slug: la-fruta-jugosa-de-dino
      micro_objective: Reconocer que una fruta contiene semillas que podrían convertirse en más fruta
        en el futuro.
      narrative_beat: Dino encuentra una fruta jugosa y está a punto de comérsela entera, hasta que Dr.
        Rho le muestra que dentro tiene semillas que podrían convertirse en un árbol nuevo.
      difficulty: 1
      suggested_families:
      - story
      - choice
    - position: 2
      slug: comer-hoy-o-plantar
      micro_objective: Comparar el resultado de comer una fruta ahora contra plantar su semilla para el
        futuro.
      narrative_beat: 'Dr. Rho compara dos caminos con Dina: comerse la fruta hoy, o plantar la semilla
        y esperar un árbol con muchas frutas.'
      difficulty: 2
      suggested_families:
      - choice
      - analyze
    - position: 3
      slug: si-solo-tuviera-una-fruta
      micro_objective: Decidir, en un caso concreto, entre comer una fruta única ahora o plantar su semilla.
      narrative_beat: Zara Vex pregunta a Dino qué elegiría si tuviera solo una fruta y ninguna otra en
        el bosque.
      difficulty: 2
      suggested_families:
      - story
      - choice
    - position: 4
      slug: la-canasta-de-frutas-nuevas
      micro_objective: Aplicar la decisión de plantar hoy para comer mañana repartiendo varias frutas
        nuevas.
      narrative_beat: Frente a una canasta con varias frutas nuevas, Dina decide cuántas comer hoy y cuántas
        plantar para el futuro.
      difficulty: 3
      suggested_families:
      - choice
      - storyplay
  - position: 4
    slug: regar-un-poco-cada-dia
    title_es: Regar un poco cada día
    concept: Poner un poco de agua cada día ayuda más a una semilla que echarle toda el agua de golpe
      una sola vez.
    learning_objective: Al final, el niño puede explicar por qué regar poco a poco cada día ayuda más
      que regar todo de una vez.
    key_vocabulary:
    - regar
    - poco a poco
    - cada día
    - cuidar
    prior_knowledge: Sabe elegir entre comer una fruta hoy o plantar su semilla (tema anterior).
    parent_check: ¿{{name}} entiende por qué es mejor cuidar algo poquito cada día que hacerlo todo de
      una sola vez?
    fact_refs: []
    lessons:
    - position: 1
      slug: la-cubeta-enorme-de-dino
      micro_objective: Observar que echarle toda el agua de golpe a una semilla nueva puede hacerle daño
        en vez de ayudar.
      narrative_beat: Dino carga una cubeta enorme de agua y la vacía toda sobre una semilla nueva, pero
        Dr. Rho corre a detenerlo antes de que la ahogue.
      difficulty: 1
      suggested_families:
      - story
      - choice
    - position: 2
      slug: dos-formas-de-regar
      micro_objective: Comparar el resultado de regar poco cada día contra regar todo de una sola vez.
      narrative_beat: 'Dr. Rho muestra dos semillas: una regada un poquito cada día, otra regada toda
        de golpe una sola vez, y pide a Dina comparar cómo están.'
      difficulty: 2
      suggested_families:
      - analyze
      - choice
    - position: 3
      slug: por-que-poquito-funciona-mejor
      micro_objective: Explicar con sus palabras por qué regar poco a poco ayuda más que regar todo junto.
      narrative_beat: Zara Vex pregunta a Dino por qué cree que un poquito cada día funciona mejor que
        mucho de una sola vez.
      difficulty: 2
      suggested_families:
      - story
      - choice
    - position: 4
      slug: mi-plan-de-riego-de-la-semana
      micro_objective: Aplicar el hábito de cuidar poco a poco cada día armando un plan propio para una
        semilla nueva.
      narrative_beat: Con una semilla nueva del bosque, Dina arma su propio plan de riego poco a poco
        para toda la semana.
      difficulty: 3
      suggested_families:
      - choice
      - storyplay
  - position: 5
    slug: la-semilla-que-no-se-toca
    title_es: La semilla que no se toca
    concept: Una semilla enterrada necesita quedarse quieta bajo la tierra para poder crecer; desenterrarla
      para revisarla la puede dañar.
    learning_objective: Al final, el niño puede explicar por qué una semilla enterrada debe dejarse quieta
      para que pueda crecer.
    key_vocabulary:
    - enterrar
    - quieto
    - tocar
    - dañar
    prior_knowledge: Sabe que regar poco a poco cada día ayuda a una semilla a crecer (tema anterior).
    parent_check: ¿{{name}} puede explicar por qué desenterrar una semilla para revisarla todos los días
      le hace daño?
    fact_refs: []
    lessons:
    - position: 1
      slug: dino-desentierra-cada-manana
      micro_objective: Reconocer que desenterrar una semilla todos los días para revisarla puede impedir
        que crezca.
      narrative_beat: Dino, curioso, desentierra la semilla cada mañana para ver si ya es un árbol, hasta
        que Dr. Rho le explica que así nunca podrá crecer.
      difficulty: 1
      suggested_families:
      - story
      - choice
    - position: 2
      slug: quieta-o-desenterrada-varias-veces
      micro_objective: Comparar el crecimiento de una semilla que se dejó quieta contra una que se desenterró
        varias veces.
      narrative_beat: 'Dr. Rho muestra dos semillas: una que se dejó quieta bajo la tierra, y otra que
        se desenterró varias veces, y pide a Dina comparar cuál creció mejor.'
      difficulty: 2
      suggested_families:
      - analyze
      - choice
    - position: 3
      slug: solo-para-ver-como-va
      micro_objective: Explicar por qué conviene resistir las ganas de desenterrar la semilla solo para
        revisarla.
      narrative_beat: Zara Vex pregunta a Dino qué le diría a alguien que quiere desenterrar su semilla
        'solo para ver cómo va'.
      difficulty: 2
      suggested_families:
      - story
      - choice
    - position: 4
      slug: dejarla-enterrada-a-pesar-de-la-curiosidad
      micro_objective: Aplicar la decisión de dejar una semilla enterrada aunque exista curiosidad por
        revisarla.
      narrative_beat: Frente a una semilla nueva, Dina decide dejarla enterrada aunque sienta curiosidad,
        y explica por qué eligió esperar.
      difficulty: 3
      suggested_families:
      - choice
      - storyplay
  - position: 6
    slug: una-fruta-hoy-o-un-arbol-manana
    title_es: Una fruta hoy o un árbol mañana
    concept: Comparar el tamaño de lo que se obtiene comiendo una fruta hoy contra lo que se obtiene esperando
      el árbol completo ayuda a decidir mejor.
    learning_objective: Al final, el niño puede comparar el tamaño de una fruta hoy contra el de un árbol
      completo de frutas mañana.
    key_vocabulary:
    - comparar
    - tamaño
    - hoy
    - mañana
    prior_knowledge: Sabe que una semilla enterrada debe dejarse quieta para crecer (tema anterior).
    parent_check: ¿{{name}} puede comparar, con un ejemplo propio, lo que se gana comiendo algo hoy contra
      esperar por algo más grande mañana?
    fact_refs: []
    lessons:
    - position: 1
      slug: el-arbol-viejo-cargado-de-frutas
      micro_objective: Observar la diferencia de tamaño entre una fruta sola y un árbol completo lleno
        de frutas.
      narrative_beat: Dr. Rho muestra a Dina un árbol viejo cargado de decenas de frutas y le recuerda
        que, hace años, ese árbol era solo una fruta que alguien decidió no comerse.
      difficulty: 1
      suggested_families:
      - story
      - choice
    - position: 2
      slug: fruta-hoy-o-arbol-manana
      micro_objective: Clasificar distintos resultados según pertenezcan a 'una fruta hoy' o 'un árbol
        mañana'.
      narrative_beat: 'Zara Vex dibuja dos columnas: ''una fruta hoy'' y ''un árbol mañana'', y pide a
        Dino ordenar imágenes en la columna correcta.'
      difficulty: 2
      suggested_families:
      - analyze
      - choice
    - position: 3
      slug: cuando-si-prefiero-la-fruta-de-hoy
      micro_objective: Reconocer que a veces sí conviene elegir la fruta de hoy, cuando de verdad se necesita
        en ese momento.
      narrative_beat: Dino admite que a veces sí prefiere una fruta hoy, y Dr. Rho le explica que eso
        también está bien si de verdad la necesita ahora.
      difficulty: 2
      suggested_families:
      - story
      - choice
    - position: 4
      slug: decidir-con-calma-fruta-o-arbol
      micro_objective: Decidir, en una situación nueva, entre la fruta de hoy o el árbol de mañana, explicando
        la razón.
      narrative_beat: Frente a una situación nueva, Dina decide con calma si conviene más la fruta de
        hoy o esperar el árbol de mañana, explicando su razón.
      difficulty: 3
      suggested_families:
      - choice
      - analyze
  - position: 7
    slug: cuidar-la-semilla-cuando-nadie-mira
    title_es: Cuidar la semilla cuando nadie mira
    concept: Cuidar una semilla aunque nadie esté mirando ni lo esté premiando en ese momento es parte
      de aprender a ser constante.
    learning_objective: Al final, el niño puede explicar por qué vale la pena cuidar una semilla aunque
      nadie lo esté viendo.
    key_vocabulary:
    - constancia
    - cuidar
    - solo
    - disciplina
    prior_knowledge: Sabe comparar una fruta hoy con un árbol mañana (tema anterior).
    parent_check: ¿{{name}} sigue cuidando algo (una tarea, un ahorro) aunque nadie se lo esté recordando
      en ese momento?
    fact_refs: []
    lessons:
    - position: 1
      slug: dino-deja-de-regar-varios-dias
      micro_objective: Observar que una semilla descuidada cuando nadie mira crece menos que una cuidada
        con constancia.
      narrative_beat: Dino deja de regar la semilla varios días porque cree que, si Dr. Rho no lo ve,
        no importa, hasta que nota que la semilla ha crecido menos que la de Dina.
      difficulty: 1
      suggested_families:
      - story
      - choice
    - position: 2
      slug: por-que-dina-siguio-regando
      micro_objective: Explicar por qué conviene seguir cuidando algo aunque nadie lo esté recordando
        en ese momento.
      narrative_beat: Dr. Rho pregunta a Dina por qué ella siguió regando su semilla incluso los días
        en que nadie se lo recordó.
      difficulty: 2
      suggested_families:
      - choice
      - analyze
    - position: 3
      slug: regar-en-secreto
      micro_objective: Practicar el hábito de cuidar algo de forma constante sin esperar que alguien lo
        note de inmediato.
      narrative_beat: Zara Vex reta a Dino a regar su semilla en secreto, sin que nadie lo vea ni lo felicite,
        durante varios días seguidos.
      difficulty: 3
      suggested_families:
      - storyplay
      - choice
    - position: 4
      slug: la-semilla-crecida-de-dino
      micro_objective: Aplicar con seguridad el hábito de cuidar algo de forma constante, incluso sin
        que nadie lo esté viendo.
      narrative_beat: Al final de la semana, Dino muestra su semilla crecida y explica que la cuidó incluso
        los días en que nadie miraba.
      difficulty: 3
      suggested_families:
      - choice
      - story
  - position: 8
    slug: mi-primer-arbol-plantado
    title_es: Mi primer árbol plantado
    concept: Planear qué se quiere sembrar, con qué constancia se va a cuidar y cuánto tiempo tomará,
      es aplicar todo lo aprendido sobre sembrar para el futuro.
    learning_objective: Al final, el niño puede armar un plan propio para sembrar algo, incluyendo qué
      cuidará y por cuánto tiempo.
    key_vocabulary:
    - plan
    - sembrar
    - cuidar
    - tiempo
    prior_knowledge: Ha aprendido a sembrar para el futuro, esperar con paciencia y cuidar con constancia
      (temas anteriores).
    parent_check: ¿{{name}} puede contarte un plan propio de algo que quiere 'sembrar' y cuidar con el
      tiempo?
    fact_refs: []
    lessons:
    - position: 1
      slug: elegir-mi-propia-semilla
      micro_objective: Elegir, dentro de una historia, qué sembrar como primer proyecto propio de largo
        plazo.
      narrative_beat: Dr. Rho invita a Dina y Dino a elegir su propia semilla del bosque para plantarla
        y cuidarla como su primer árbol.
      difficulty: 1
      suggested_families:
      - story
      - choice
    - position: 2
      slug: los-pasos-de-mi-plan
      micro_objective: Ordenar los pasos correctos de un plan simple para sembrar y cuidar algo propio.
      narrative_beat: 'Zara Vex ayuda a Dino a ordenar los pasos de su plan: elegir la semilla, plantarla,
        regarla poco a poco, y dejarla quieta.'
      difficulty: 2
      suggested_families:
      - choice
      - arrange
    - position: 3
      slug: explicar-mi-plan-en-voz-alta
      micro_objective: Explicar en voz alta un plan propio de siembra, incluyendo cuidado y tiempo de
        espera.
      narrative_beat: Dina practica explicando en voz alta su plan completo antes de plantar su semilla
        frente a Dr. Rho.
      difficulty: 2
      suggested_families:
      - storyplay
      - choice
    - position: 4
      slug: la-promesa-de-cuidar-mi-arbol
      micro_objective: Aplicar con seguridad el plan completo de sembrar, cuidar y esperar, comprometiéndose
        a seguirlo.
      narrative_beat: Con su semilla ya plantada, Dina y Dino prometen frente a Dr. Rho cuidarla con constancia
        hasta que se convierta en árbol.
      difficulty: 3
      suggested_families:
      - choice
      - story
  - position: 9
    slug: el-cofre-del-repaso
    kind: review_spaced
    title_es: El Cofre del Repaso
    concept: Zara Vex abre un cofre de semillas de recuerdo para poner a prueba, sin enseñar nada nuevo,
      todo lo aprendido en la saga La Semilla que Espera.
    learning_objective: Al final, el niño puede recordar y aplicar, sin ayuda nueva, los conceptos principales
      de la saga La Semilla que Espera.
    key_vocabulary:
    - sembrar
    - esperar
    - cuidar
    - constancia
    prior_knowledge: Ha completado los ocho temas de la saga La Semilla que Espera (aventura 1, saga 1).
    fact_refs: []
    review_of:
    - el-jardin-del-tiempo/semilla-que-espera/que-es-sembrar-para-el-futuro
    - el-jardin-del-tiempo/semilla-que-espera/lo-que-crece-solo-con-el-tiempo
    - el-jardin-del-tiempo/semilla-que-espera/plantar-hoy-comer-manana
    - el-jardin-del-tiempo/semilla-que-espera/regar-un-poco-cada-dia
    - el-jardin-del-tiempo/semilla-que-espera/la-semilla-que-no-se-toca
    - el-jardin-del-tiempo/semilla-que-espera/una-fruta-hoy-o-un-arbol-manana
    - el-jardin-del-tiempo/semilla-que-espera/cuidar-la-semilla-cuando-nadie-mira
    - el-jardin-del-tiempo/semilla-que-espera/mi-primer-arbol-plantado
    lessons:
    - position: 1
      slug: el-cofre-se-abre
      micro_objective: Recordar, sin ayuda nueva, por qué sembrar hoy da algo grande en el futuro y por
        qué las cosas crecen con el tiempo, no con prisa.
      narrative_beat: Zara Vex abre un cofre lleno de semillas de recuerdo y reta a Dina a recordar, semilla
        por semilla, lo primero que aprendió en este bosque.
      difficulty: 1
      suggested_families:
      - story
      - choice
    - position: 2
      slug: recordar-en-orden
      micro_objective: Recordar y ordenar de nuevo cómo decidir entre comer una fruta hoy o plantar su
        semilla, y por qué regar poco a poco ayuda más.
      narrative_beat: Dino saca del cofre las semillas mezcladas de la saga y las ordena de memoria, sin
        que Dr. Rho le dé ninguna pista nueva.
      difficulty: 1
      suggested_families:
      - arrange
      - choice
    - position: 3
      slug: aplicar-lo-guardado
