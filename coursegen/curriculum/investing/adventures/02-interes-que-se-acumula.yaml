schema_version: 1

adventure:
  position: 2
  slug: interes-que-se-acumula
  theme: city
  age_tier: tier4
  title:
    en-US: "Interest That Adds Up"
    es-MX: "El Interés que se Acumula"
    pt-BR: "O Juro que se Acumula"
  description:
    en-US: "In the Growth District, the team learns why money left alone can grow on its own - and why a forgotten subscription or an app's cut can grow against you the exact same way."
    es-MX: "En el Distrito de Crecimiento, el equipo aprende por qué el dinero que dejas quieto puede crecer solo - y por qué una suscripción olvidada o la comisión de una app puede crecer EN TU CONTRA de la misma forma."
    pt-BR: "No Distrito de Crescimento, a equipe aprende por que o dinheiro que voce deixa parado pode crescer sozinho - e por que uma assinatura esquecida ou a comissao de um aplicativo pode crescer CONTRA voce da mesma forma."
  narrative_arc: "Dina, Liruf, Rho y Zara llegan al Distrito de Crecimiento, donde bancos, fondos y apps compiten por su atención. Ahí descubren que guardar dinero puede ganar un pequeño premio (interés), que dejar ese premio adentro hace que el siguiente premio sea todavía mayor (interés compuesto), y que la misma lógica de crecimiento trabaja EN SU CONTRA en una suscripción olvidada o la comisión de una app de encargos. Terminan comparando interés simple contra compuesto a fondo y defendiendo, con números propios, un plan de qué dejar crecer y qué cancelar a tiempo."

sagas:
  - position: 1
    slug: el-premio-por-guardar
    icon: savings
    title:
      en-US: "The Reward for Saving"
      es-MX: "El Premio por Guardar"
      pt-BR: "O Premio por Guardar"
    description:
      en-US: "Banks and funds pay a small reward for letting your money sit - learn to calculate it."
      es-MX: "Bancos y fondos pagan un pequeño premio por dejar tu dinero guardado - aprende a calcularlo."
      pt-BR: "Bancos e fundos pagam um pequeno premio por deixar seu dinheiro guardado - aprenda a calcula-lo."
    topics:
        - position: 1
          slug: que-es-un-premio-por-guardar
          title_es: "Qué es un premio por guardar"
          concept: "Un banco o fondo te puede dar un pequeño premio (interés) por dejar tu dinero guardado en vez de gastarlo."
          learning_objective: "El aprendiz reconoce que guardar dinero en un banco o fondo puede generar un premio, y explica por qué existe ese premio."
          key_vocabulary: [premio, interés, guardar, fondo]
          prior_knowledge: "Ninguno - es el punto de partida de esta aventura."
          fact_refs: []
          parent_check: "Preguntale a {{name}} si sabía que un banco o fondo puede pagarte un pequeño premio por dejar tu dinero guardado."
          lessons:
            - position: 1
              slug: el-letrero-del-distrito
              micro_objective: "Reconoce que un banco o fondo puede dar un pequeño premio por dejar el dinero guardado en vez de gastarlo de inmediato."
              narrative_beat: "Dina le muestra a Liruf un letrero en el Distrito de Crecimiento: 'guarda tu dinero aquí y te damos un premio cada año'. Liruf nunca lo había visto así."
              difficulty: 1
              suggested_families: [story, choice]
            - position: 2
              slug: por-que-existe-el-premio
              micro_objective: "Explica, con sus palabras, por qué un fondo te paga un premio por guardar tu dinero en vez de gastarlo."
              narrative_beat: "Rho le explica a Liruf: el fondo usa tu dinero mientras lo guardas, y por eso te comparte una parte como premio."
              difficulty: 2
              suggested_families: [choice, analyze]
        - position: 2
          slug: calculo-mi-primer-premio
          title_es: "Calculo mi primer premio"
          concept: "El premio de un año se calcula con un porcentaje simple sobre el monto guardado."
          learning_objective: "El aprendiz calcula el premio de un año sobre un monto guardado, usando un porcentaje didáctico fijo."
          key_vocabulary: [porcentaje, monto guardado, premio anual]
          prior_knowledge: "Reconoce qué es un premio por guardar (tema anterior)."
          fact_refs: [money.simple_interest_100_year1, money.example_growth_rate_pct]
          parent_check: "Pidele a {{name}} que calcule cuánto premio ganaría guardando 100 pesos con un 10% de premio anual."
          lessons:
            - position: 1
              slug: calculo-el-premio-de-100
              micro_objective: "Calcula el premio de un año sobre 100 pesos guardados con un 10% de premio anual."
              narrative_beat: "Zara guarda 100 pesos en el fondo del distrito: al cabo de un año, el letrero le dice que su premio fue de 10 pesos."
              difficulty: 2
              suggested_families: [input, money]
            - position: 2
              slug: sumo-premio-y-guardado
              micro_objective: "Calcula el total (guardado más premio) después de un año, sobre un monto guardado con 10% de premio."
              narrative_beat: "Zara suma su premio de 10 pesos a los 100 que guardó, y confirma que ahora tiene 110 pesos en total."
              difficulty: 3
              suggested_families: [money, input]
        - position: 3
          slug: mas-guardado-mas-premio
          title_es: "Más guardado, más premio"
          concept: "Entre más guardes, mayor es el premio en pesos, aunque el porcentaje sea el mismo."
          learning_objective: "El aprendiz compara el premio de dos montos distintos guardados al mismo porcentaje y reconoce que el monto mayor da más premio."
          key_vocabulary: [monto mayor, mismo porcentaje, comparar premios]
          prior_knowledge: "Calcula el premio de un año sobre un monto guardado (tema anterior)."
          fact_refs: []
          parent_check: "Preguntale a {{name}} si guardar el doble de dinero al mismo porcentaje da el doble de premio - y por qué."
          lessons:
            - position: 1
              slug: comparo-100-y-200
              micro_objective: "Compara el premio en pesos de dos montos distintos guardados al mismo porcentaje, y reconoce que el monto mayor da más premio."
              narrative_beat: "Rho compara: quien guardó 100 recibe 10 de premio; quien guardó 200, recibe 20 - el mismo 10%, pero premios distintos."
              difficulty: 3
              suggested_families: [analyze, money]
            - position: 2
              slug: ordeno-tres-montos-por-premio
              micro_objective: "Ordena tres montos guardados al mismo porcentaje según el tamaño del premio que reciben."
              narrative_beat: "Dina ordena tres cuentas del distrito de menor a mayor premio, todas con el mismo porcentaje pero montos distintos."
              difficulty: 3
              suggested_families: [arrange, analyze]
        - position: 4
          slug: el-premio-no-llega-si-lo-sacas-antes
          title_es: "El premio no llega si lo sacas antes"
          concept: "Sacar el dinero antes de que termine el periodo significa perder el premio de ese periodo."
          learning_objective: "El aprendiz reconoce que retirar el dinero antes de tiempo cancela el premio de ese periodo, y decide cuándo conviene esperar."
          key_vocabulary: [retirar antes de tiempo, periodo, perder el premio]
          prior_knowledge: "Compara el premio de dos montos distintos (tema anterior)."
          fact_refs: []
          parent_check: "Preguntale a {{name}} qué pasaría si sacara su dinero guardado a la mitad del año en vez de esperar el año completo."
          lessons:
            - position: 1
              slug: saco-el-dinero-a-la-mitad
              micro_objective: "Reconoce que sacar el dinero antes de que termine el periodo significa perder el premio de ese periodo."
              narrative_beat: "Liruf saca su dinero a la mitad del año, apurado - y descubre que el premio todavía no estaba listo para él."
              difficulty: 3
              suggested_families: [story, choice]
            - position: 2
              slug: decido-si-espero-o-saco
              micro_objective: "Decide, en un caso, si conviene sacar el dinero antes de tiempo o esperar a que se complete el periodo del premio."
              narrative_beat: "Zara compara: necesita el dinero pronto, pero esperar dos semanas más le daría el premio completo - decide qué le conviene más."
              difficulty: 4
              suggested_families: [choice, analyze]
        - position: 5
          slug: comparo-dos-cuentas
          title_es: "Comparo dos cuentas"
          concept: "Comparar dos ofertas de guardado con distinto porcentaje de premio sobre el mismo monto muestra cuál conviene más."
          learning_objective: "El aprendiz calcula y compara el premio de dos cuentas con distinto porcentaje sobre el mismo monto, y elige la que conviene."
          key_vocabulary: [comparar cuentas, distinto porcentaje, conviene más]
          prior_knowledge: "Decide si sacar el dinero antes de tiempo vale la pena (tema anterior)."
          fact_refs: []
          parent_check: "Pidele a {{name}} que compare dos ofertas de guardado con distinto porcentaje y te diga cuál conviene más."
          lessons:
            - position: 1
              slug: dos-puestos-distinto-porcentaje
              micro_objective: "Compara dos ofertas de guardado con distinto porcentaje de premio sobre el mismo monto, y calcula cuál da más."
              narrative_beat: "Rho compara dos puestos del distrito: uno ofrece 10% de premio anual, el otro solo 5% - sobre el mismo monto, calcula la diferencia."
              difficulty: 4
              suggested_families: [analyze, money]
            - position: 2
              slug: elijo-la-mejor-cuenta
              micro_objective: "Elige, entre dos cuentas con distinto porcentaje, la que más conviene para un monto y plazo dados."
              narrative_beat: "Con los cálculos hechos, Zara elige la cuenta del 10% para guardar su dinero del verano."
              difficulty: 4
              suggested_families: [choice, money]
        - position: 6
          slug: mi-primer-plan-de-guardado
          title_es: "Mi primer plan de guardado"
          concept: "Arma un plan simple: cuánto guardar y qué premio esperar en un año."
          learning_objective: "El aprendiz arma y aplica un plan propio de cuánto guardar y calcula el premio esperado en un año."
          key_vocabulary: [plan de guardado, premio esperado]
          prior_knowledge: "Compara dos cuentas con distinto porcentaje (tema anterior)."
          fact_refs: []
          parent_check: "Ayuda a {{name}} a armar un plan simple: cuánto guardaría al mes y qué premio esperaría en un año."
          lessons:
            - position: 1
              slug: armamos-el-plan-en-equipo
              micro_objective: "Con apoyo, arma un plan simple de cuánto guardar y qué premio esperar en un año."
              narrative_beat: "El equipo arma en la pizarra un plan: cuánto va a guardar cada quien y cuánto premio esperan recibir en un año."
              difficulty: 4
              suggested_families: [storyplay, money]
            - position: 2
              slug: calculo-mi-propio-premio-esperado
              micro_objective: "Aplica, sin ayuda, su propio plan de guardado calculando el premio esperado para un monto y porcentaje propios."
              narrative_beat: "Liruf calcula solo, sin ayuda, cuánto premio recibiría si guarda su mesada del mes completo todo el año."
              difficulty: 5
              suggested_families: [money, input]
        - position: 7
          slug: repaso-el-premio-por-guardar
          kind: review_spaced
          title_es: "Repaso: El Premio por Guardar"
          concept: "El equipo repasa cómo calcular y comparar el premio que da guardar dinero antes de ver qué pasa si lo dejan crecer más tiempo."
          learning_objective: "El aprendiz recuerda y aplica, sin nueva enseñanza, el cálculo del premio de un año sobre un monto guardado."
          key_vocabulary: [premio, porcentaje, comparar cuentas]
          prior_knowledge: "Completo los 6 temas de El Premio por Guardar."
          fact_refs: []
          review_of:
            - interes-que-se-acumula/el-premio-por-guardar/que-es-un-premio-por-guardar
            - interes-que-se-acumula/el-premio-por-guardar/calculo-mi-primer-premio
            - interes-que-se-acumula/el-premio-por-guardar/mas-guardado-mas-premio
            - interes-que-se-acumula/el-premio-por-guardar/el-premio-no-llega-si-lo-sacas-antes
            - interes-que-se-acumula/el-premio-por-guardar/comparo-dos-cuentas
            - interes-que-se-acumula/el-premio-por-guardar/mi-primer-plan-de-guardado
          lessons:
            - position: 1
              slug: repaso-calculo-premios
              micro_objective: "Recuerda y aplica, sin ayuda, cómo calcular el premio de un año sobre un monto guardado."
              narrative_beat: "El equipo repasa sus cálculos del Distrito de Crecimiento y vuelve a sacar premios sin ayuda."
              difficulty: 3
              suggested_families: [money, analyze]
            - position: 2
              slug: repaso-elijo-la-mejor-cuenta
              micro_objective: "Aplica sin ayuda todo lo repasado: compara dos cuentas nuevas y elige la que más conviene."
              narrative_beat: "Zara compara dos cuentas nuevas del distrito, sin ayuda de nadie, y elige la que le da más premio."
              difficulty: 4
              suggested_families: [choice, analyze]
        - position: 8
          slug: cruce-monto-y-porcentaje
          kind: review_interleaved
          title_es: "Cruce: Monto y Porcentaje"
          concept: "Mezclamos el efecto del monto guardado con el efecto del porcentaje para calcular un premio completo de una sola vez."
          learning_objective: "El aprendiz combina, sin nueva enseñanza, monto y porcentaje para calcular y comparar el premio de varios casos."
          key_vocabulary: [monto, porcentaje, premio total]
          prior_knowledge: "Completo el repaso de El Premio por Guardar (tema anterior)."
          fact_refs: []
          review_of:
            - interes-que-se-acumula/el-premio-por-guardar/mas-guardado-mas-premio
            - interes-que-se-acumula/el-premio-por-guardar/comparo-dos-cuentas
            - interes-que-se-acumula/el-premio-por-guardar/calculo-mi-primer-premio
          lessons:
            - position: 1
              slug: junto-monto-y-porcentaje
              micro_objective: "Combina el efecto del monto guardado con el efecto del porcentaje para calcular el premio de un caso nuevo."
              narrative_beat: "Rho junta dos ideas a la vez: cuánto guardó Y qué porcentaje le ofrecen, para calcular su premio completo."
              difficulty: 4
              suggested_families: [money, analyze]
            - position: 2
              slug: elijo-la-mejor-combinacion
              micro_objective: "Evalúa, sin ayuda, cuál de tres combinaciones de monto y porcentaje da el mejor premio total."
              narrative_beat: "Zara compara tres combinaciones distintas de monto y porcentaje y elige, sin ayuda, la que da el mejor premio."
              difficulty: 5
              suggested_families: [analyze, choice]
  - position: 2
    slug: cuando-el-premio-se-queda-adentro
    icon: repeat
    title:
      en-US: "When the Reward Stays In"
      es-MX: "Cuando el Premio se Queda Adentro"
      pt-BR: "Quando o Premio Fica Dentro"
    description:
      en-US: "Leave the reward inside instead of taking it out, and next year's reward gets calculated on a bigger number - that's compound interest."
      es-MX: "Deja el premio adentro en vez de sacarlo, y el premio del año siguiente se calcula sobre un número más grande - eso es interés compuesto."
      pt-BR: "Deixe o premio dentro em vez de tira-lo, e o premio do ano seguinte e calculado sobre um número maior - isso e juro composto."
    topics:
        - position: 1
          slug: dejo-el-premio-adentro
          title_es: "Dejo el premio adentro"
          concept: "Si en vez de sacar el premio lo dejas adentro, el siguiente premio se calcula sobre un monto más grande - eso es interés compuesto."
          learning_objective: "El aprendiz reconoce que dejar el premio adentro cambia la base sobre la que se calcula el siguiente premio."
          key_vocabulary: [interés compuesto, dejar adentro, nueva base]
          prior_knowledge: "Completo El Premio por Guardar (saga anterior)."
          fact_refs: [money.compound_growth_100_3years]
          parent_check: "Preguntale a {{name}} qué pasa con el premio del año siguiente si no saca el premio de este año."
          lessons:
            - position: 1
              slug: no-saco-mi-premio
              micro_objective: "Reconoce que dejar el premio adentro, en vez de sacarlo, hace que el siguiente premio se calcule sobre un monto más grande."
              narrative_beat: "Dina le explica a Liruf: 'si no sacas tu premio de 10 pesos, el año que viene el 10% se calcula sobre 110, no sobre 100'."
              difficulty: 1
              suggested_families: [story, choice]
            - position: 2
              slug: explico-el-cambio-de-base
              micro_objective: "Explica, con sus palabras, por qué dejar el premio adentro cambia el cálculo del siguiente año."
              narrative_beat: "Liruf repite la idea con sus propias palabras: 'entre más dejo adentro, más grande es la base del siguiente premio'."
              difficulty: 2
              suggested_families: [choice, analyze]
        - position: 2
          slug: calculo-el-segundo-ano
          title_es: "Calculo el segundo año"
          concept: "El premio del segundo año se calcula sobre el nuevo total, no sobre el monto original."
          learning_objective: "El aprendiz calcula el premio del segundo año sobre el nuevo total y compara que es mayor que el del año 1."
          key_vocabulary: [segundo año, nuevo total, premio mayor]
          prior_knowledge: "Reconoce que dejar el premio adentro cambia la base del cálculo (tema anterior)."
          fact_refs: [money.compound_growth_100_3years]
          parent_check: "Pidele a {{name}} que calcule el premio del segundo año sobre 110 pesos con un 10% de premio."
          lessons:
            - position: 1
              slug: premio-sobre-110
              micro_objective: "Calcula el premio del segundo año sobre el nuevo total (110), y compara que es mayor que el premio del año 1."
              narrative_beat: "Zara calcula: sobre 110 pesos, el premio del segundo año es 11 - un peso más que el premio del primer año."
              difficulty: 2
              suggested_families: [money, input]
            - position: 2
              slug: confirmo-el-total-de-dos-anos
              micro_objective: "Confirma el total después de dos años dejando todo el premio adentro (100 -> 110 -> 121)."
              narrative_beat: "Rho suma el premio del segundo año a los 110 que ya tenía, y confirma que ahora el total es 121."
              difficulty: 3
              suggested_families: [money, analyze]
        - position: 3
          slug: tres-anos-dejando-todo-adentro
          title_es: "Tres años dejando todo adentro"
          concept: "Sigue la cadena completa a tres años (100->110->121->133.1) y ve cómo el premio total crece cada año un poco más."
          learning_objective: "El aprendiz sigue una cadena de tres años de interés compuesto y compara el tamaño del premio del año 1 contra el del año 3."
          key_vocabulary: [cadena de años, premio creciente]
          prior_knowledge: "Calcula el premio del segundo año sobre el nuevo total (tema anterior)."
          fact_refs: [money.compound_growth_100_3years]
          parent_check: "Repasa con {{name}} la cadena completa: 100, 110, 121, 133.1 - y pregúntale en qué año el premio fue más grande en pesos."
          lessons:
            - position: 1
              slug: sigo-la-cadena-completa
              micro_objective: "Sigue la cadena completa a tres años (100->110->121->133.1) y calcula el premio de cada año."
              narrative_beat: "El equipo sigue la cadena completa en la pizarra: 100, luego 110, luego 121, y finalmente 133.1 al tercer año."
              difficulty: 3
              suggested_families: [arrange, money]
            - position: 2
              slug: comparo-el-premio-del-ano-1-y-el-3
              micro_objective: "Compara el tamaño del premio del año 1 contra el del año 3 y reconoce que el premio en pesos creció aunque el porcentaje fue el mismo."
              narrative_beat: "Dina señala: el premio del año 1 fue 10 pesos, el del año 3 fue 12.1 - el mismo 10%, pero un premio más grande cada vez."
              difficulty: 3
              suggested_families: [analyze, choice]
        - position: 4
          slug: que-pasa-si-lo-saco-a-mitad-de-camino
          title_es: "Qué pasa si lo saco a mitad de camino"
          concept: "Comparar dejar el premio adentro todo el tiempo contra sacarlo a la mitad muestra que el compuesto pierde su ventaja si se interrumpe."
          learning_objective: "El aprendiz compara el resultado final de dejar el interés compuesto correr contra interrumpirlo, y decide cuándo vale la pena interrumpir."
          key_vocabulary: [interrumpir, ventaja del compuesto]
          prior_knowledge: "Sigue la cadena completa de tres años (tema anterior)."
          fact_refs: []
          parent_check: "Preguntale a {{name}} qué pasaría si sacara su premio cada año en vez de dejarlo adentro todo el tiempo."
          lessons:
            - position: 1
              slug: liruf-saca-cada-ano-zara-no
              micro_objective: "Compara el total final de dejar el premio adentro todo el tiempo contra sacarlo cada año, sobre el mismo monto inicial."
              narrative_beat: "Liruf saca su premio cada año y se lo gasta; Zara lo deja todo adentro - al tercer año, Zara tiene más aunque guardaron lo mismo."
              difficulty: 3
              suggested_families: [story, analyze]
            - position: 2
              slug: decido-si-interrumpo
              micro_objective: "Decide, en un caso, si interrumpir el interés compuesto a la mitad del camino vale la pena o no según lo que se necesita el dinero."
              narrative_beat: "Rho decide si sacar su dinero antes de tiempo realmente vale la pena, sabiendo que pierde el efecto de dejarlo crecer."
              difficulty: 4
              suggested_families: [choice, analyze]
        - position: 5
          slug: el-compuesto-necesita-tiempo
          title_es: "El compuesto necesita tiempo"
          concept: "El efecto del interés compuesto es pequeño al principio y se nota más mientras más años pasan sin tocarlo."
          learning_objective: "El aprendiz compara el efecto del interés compuesto a corto y largo plazo, y reconoce que el tiempo es un ingrediente clave."
          key_vocabulary: [corto plazo, largo plazo, efecto acumulado]
          prior_knowledge: "Compara dejar el premio adentro contra interrumpirlo (tema anterior)."
          fact_refs: []
          parent_check: "Preguntale a {{name}} por qué el interés compuesto se nota poco en el primer año pero mucho más después de varios años."
          lessons:
            - position: 1
              slug: chiquito-al-principio
              micro_objective: "Reconoce que el efecto del interés compuesto es pequeño al principio y se nota más mientras más años pasan sin tocarlo."
              narrative_beat: "Zara compara el premio del año 1 (chiquito) contra el del año 10 (mucho más grande) - el tiempo es el ingrediente que faltaba."
              difficulty: 4
              suggested_families: [analyze, choice]
            - position: 2
              slug: comparo-2-anos-contra-6-anos
              micro_objective: "Compara dos planes con el mismo monto pero distinto número de años sin tocar el dinero, y decide cuál da más al final."
              narrative_beat: "Rho compara dejar su premio adentro 2 años contra dejarlo adentro 6 años - mismo monto inicial, resultado muy distinto."
              difficulty: 4
              suggested_families: [choice, analyze]
        - position: 6
          slug: explico-la-diferencia-a-un-amigo
          title_es: "Explico la diferencia a un amigo"
          concept: "Explica con tus palabras, usando el ejemplo de 100->133.1, por qué dejar el premio adentro rinde más que sacarlo cada año."
          learning_objective: "El aprendiz explica, con un ejemplo propio, la diferencia entre interés simple y dejar el premio adentro."
          key_vocabulary: [explicar, ejemplo propio]
          prior_knowledge: "Compara el efecto del interés compuesto a corto y largo plazo (tema anterior)."
          fact_refs: []
          parent_check: "Pidele a {{name}} que te explique, con sus propias palabras, por qué dejar el premio adentro rinde más que sacarlo cada año."
          lessons:
            - position: 1
              slug: preparamos-la-explicacion
              micro_objective: "Con apoyo, explica usando el ejemplo 100->133.1 por qué dejar el premio adentro rinde más que sacarlo cada año."
              narrative_beat: "El equipo prepara una explicación corta para un amigo nuevo del distrito, usando el ejemplo de 100 a 133.1 en tres años."
              difficulty: 4
              suggested_families: [storyplay, analyze]
            - position: 2
