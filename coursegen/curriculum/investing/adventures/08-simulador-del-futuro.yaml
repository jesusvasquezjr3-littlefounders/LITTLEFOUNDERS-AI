          prior_knowledge: "Aplica la regla del valor del tiempo dentro del simulador (tema anterior)."
          fact_refs: [money.example_growth_rate_pct]
          parent_check: "Pidele a {{name}} que calcule, dentro de un caso simulado, cuánto crecería un monto con interés compuesto en varios años."
