schema_version: 1

adventure:
  position: 8
  slug: simulador-del-futuro
  theme: city
  age_tier: tier4
  title:
    en-US: "The Future Simulator"
    es-MX: "El Simulador del Futuro"
    pt-BR: "O Simulador do Futuro"
  description:
    en-US: "The capstone: a portfolio simulator - SIMULATED decisions only, never real transactions - where the whole course comes together and gets tested under a rough patch and a fraud attempt."
    es-MX: "El cierre del curso: un simulador de cartera - decisiones SIMULADAS, nunca transacciones reales - donde todo el curso se junta y se pone a prueba frente a una mala temporada y un intento de fraude."
    pt-BR: "O fechamento do curso: um simulador de carteira - decisoes SIMULADAS, nunca transacoes reais - onde todo o curso se junta e e testado diante de uma ma temporada e uma tentativa de fraude."
  narrative_arc: "Dina, Liruf, Rho y Zara regresan al Distrito de Crecimiento para usar el Simulador del Futuro: una consola que deja practicar decisiones de dinero con resultados que se sienten reales, sin arriesgar nada real. Repasan ahí el valor del tiempo y el interés que se acumula, arman y ajustan carteras simuladas diversificadas, y enfrentan una mala temporada simulada donde deben resistir el pánico de vender de golpe Y reconocer una oferta sospechosa con las señales del radar de fraude. Terminan combinando cada aventura del curso en un plan simulado completo, con un reporte final que presentan y defienden frente al consejo de todas las aventuras - recordando siempre que todo fue un simulador para aprender a decidir, no una instrucción para invertir dinero real todavía."

sagas:
  - position: 1
    slug: bienvenida-al-simulador
    icon: computer
    title:
      en-US: "Welcome to the Simulator"
      es-MX: "Bienvenida al Simulador"
      pt-BR: "Bem-vindo ao Simulador"
    description:
      en-US: "Practice decisions that feel real, without risking anything real - and cheaply relearn the value of time and compounding."
      es-MX: "Practica decisiones que se sienten reales, sin arriesgar nada real - y repasa barato el valor del tiempo y el interés que se acumula."
      pt-BR: "Pratique decisoes que parecem reais, sem arriscar nada real - e revise barato o valor do tempo e o juro que se acumula."
    topics:
        - position: 1
          slug: que-es-un-simulador
          title_es: "Qué es un simulador"
          concept: "Un simulador deja practicar decisiones con resultados que se sienten reales, sin arriesgar dinero real - así se practica antes de que la decisión real importe."
          learning_objective: "El aprendiz reconoce que un simulador permite practicar decisiones con resultados realistas sin arriesgar dinero real."
          key_vocabulary: [simulador, resultados realistas, sin arriesgar]
          prior_knowledge: "Ninguno - es el punto de partida de esta aventura final."
          fact_refs: []
          parent_check: "Preguntale a {{name}} por qué cree que practicar decisiones en un simulador es más seguro que practicar con dinero real."
          lessons:
            - position: 1
              slug: dina-presenta-el-simulador
              micro_objective: "Reconoce que un simulador deja practicar decisiones con resultados que se sienten reales, sin arriesgar dinero real."
              narrative_beat: "Dina le muestra a Liruf el Simulador del Distrito: 'aquí puedes practicar decisiones de dinero sin arriesgar ni un peso real'."
              difficulty: 1
              suggested_families: [story, choice]
            - position: 2
              slug: explico-simular-vs-decidir-real
              micro_objective: "Explica, con sus palabras, la diferencia entre practicar en un simulador y decidir con dinero real."
              narrative_beat: "Liruf explica con sus palabras por qué practicar en el simulador es distinto -y más seguro- que decidir con dinero real."
              difficulty: 2
              suggested_families: [choice, analyze]
        - position: 2
          slug: por-que-simular-antes-de-decidir-de-verdad
          title_es: "Por qué simular antes de decidir de verdad"
          concept: "Simular antes de decidir de verdad deja cometer errores baratos (sin costo real) en vez de errores caros."
          learning_objective: "El aprendiz reconoce y compara el costo de un error dentro del simulador contra el mismo error con dinero real."
          key_vocabulary: [error barato, error caro]
          prior_knowledge: "Distingue simular de decidir con dinero real (tema anterior)."
          fact_refs: []
          parent_check: "Preguntale a {{name}} qué ventaja tiene equivocarse dentro de un simulador en vez de equivocarse con dinero real."
          lessons:
            - position: 1
              slug: rho-comete-un-error-barato
              micro_objective: "Reconoce que simular antes de decidir de verdad deja cometer errores baratos en vez de errores caros."
              narrative_beat: "Rho comete un error en el simulador - no le costó nada real, solo aprendió la lección sin pagar el precio de verdad."
              difficulty: 2
              suggested_families: [story, choice]
              # B.11: flagged mentor-misjudgment episode, pending content-team validation (Appendix C Stage 3).
              mentor_misjudgment:
                character: rho
                misjudgment: "En el simulador, Rho elige una opción sin revisar cuánto le costaría, y el resultado le sale caro."
                recovery: "Rho explica sin culpa qué revisaría la próxima vez y repite la decisión simulada con ese paso."
            - position: 2
              slug: comparo-el-costo-del-mismo-error
              micro_objective: "Compara el costo de un error dentro del simulador contra el costo del mismo error con dinero real."
              narrative_beat: "Zara compara: el mismo error en el simulador no costó nada; con dinero real, hubiera costado mucho."
              difficulty: 3
              suggested_families: [analyze, choice]
        - position: 3
          slug: repaso-el-valor-del-tiempo-en-el-simulador
          title_es: "Repaso el valor del tiempo en el simulador"
          concept: "Aplica, dentro del simulador, la lección de que el dinero de hoy vale más que una promesa lejana."
          learning_objective: "El aprendiz aplica, dentro de una decisión simulada, la regla del valor del tiempo aprendida en la primera aventura del curso."
          key_vocabulary: [valor del tiempo, decisión simulada]
          prior_knowledge: "Compara el costo de un error simulado contra uno real (tema anterior)."
          fact_refs: []
          parent_check: "Pidele a {{name}} que recuerde su regla del valor del tiempo de la Estación Reloj, y que la aplique a una oferta simulada."
          lessons:
            - position: 1
              slug: rho-aplica-su-vieja-regla
              micro_objective: "Aplica, dentro del simulador, la lección de que el dinero de hoy vale más que una promesa lejana."
              narrative_beat: "Dentro del simulador, Rho recibe una oferta: dinero simulado hoy o el doble en un año - aplica su vieja regla del valor del tiempo."
              difficulty: 3
              suggested_families: [choice, analyze]
            - position: 2
              slug: decido-con-mi-regla-del-tiempo
