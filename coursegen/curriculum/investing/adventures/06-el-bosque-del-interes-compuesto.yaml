    title_es: El Cofre del Repaso
    concept: Dr. Rho abre el cofre del bosque para poner a prueba, sin enseñar nada nuevo, todo lo aprendido en la saga La Bola de Nieve del Dinero.
    learning_objective: Al final, el niño puede recordar y aplicar, sin ayuda nueva, los conceptos principales de la saga La Bola de Nieve del Dinero.
