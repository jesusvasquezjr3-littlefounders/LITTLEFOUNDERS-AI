      micro_objective: Recordar, sin ayuda nueva, qué es el interés y la diferencia entre interés simple y compuesto.
      narrative_beat: Dr. Rho abre el cofre nevado del bosque y reta a Dina a recordar, copo por copo, lo primero que aprendió en esta saga.
