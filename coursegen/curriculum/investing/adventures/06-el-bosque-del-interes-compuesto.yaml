schema_version: 1
adventure:
  position: 6
  slug: el-bosque-del-interes-compuesto
  theme: forest
  age_tier: tier3
  title:
    en-US: The Forest of Compound Interest
    es-MX: El Bosque del Interés Compuesto
    pt-BR: A Floresta dos Juros Compostos
  description:
    en-US: In a forest where snowballs grow and trees give seeds that grow more trees, Dina and Liruf discover that time is the real superpower behind compound interest, and that starting early beats saving more later.
    es-MX: En un bosque donde las bolas de nieve crecen y los árboles dan semillas que dan más árboles, Dina y Liruf descubren que el tiempo es el verdadero superpoder detrás del interés compuesto, y que empezar antes gana a ahorrar más tarde.
    pt-BR: Em uma floresta onde bolas de neve crescem e árvores dão sementes que geram mais árvores, Dina e Liruf descobrem que o tempo é o verdadeiro superpoder por trás dos juros compostos, e que começar cedo vence economizar mais tarde.
  narrative_arc: Dina y Liruf entran a un bosque nevado donde Dr. Rho cuida bolas de nieve mágicas y árboles que dan semillas. Ahí descubren que el dinero guardado puede crecer solo, como una bola de nieve que junta más nieve en cada vuelta, o como un árbol que da semillas que se convierten en más árboles. Zara Vex reta a los niños a comparar sembradores que empezaron en momentos distintos, para que descubran por su cuenta que el tiempo, no la cantidad, es el verdadero superpoder de guardar dinero con constancia.
sagas:
- position: 1
  slug: la-bola-de-nieve-del-dinero
  icon: ac_unit
  title:
    en-US: The Money Snowball
    es-MX: La Bola de Nieve del Dinero
    pt-BR: A Bola de Neve do Dinheiro
  description:
    en-US: Discover how interest works and why compound interest grows faster than simple interest, one snowball turn at a time.
    es-MX: Descubre cómo funciona el interés y por qué el interés compuesto crece más rápido que el interés simple, vuelta de nieve tras vuelta.
    pt-BR: Descubra como funcionam os juros e por que os juros compostos crescem mais rápido que os juros simples, volta de neve após volta.
  topics:
  - position: 1
    slug: que-es-el-interes
    title_es: Qué es el interés
    concept: El interés es un poco de dinero extra que se gana por guardar dinero con el tiempo, como un premio por dejarlo crecer.
    learning_objective: Al final, el niño puede explicar con sus palabras qué es el interés.
    key_vocabulary:
    - interés
    - extra
    - guardar
    - premio
    prior_knowledge: Sabe que guardar dinero en un lugar seguro lo protege (Educación Financiera).
    parent_check: "¿{{name}} puede explicarte con sus palabras qué es el interés y por qué es como un pequeño premio?"
    fact_refs: []
    lessons:
    - position: 1
      slug: la-primera-bola-de-nieve
      micro_objective: Observar cómo una bola de nieve pequeña empieza a crecer al rodar por el bosque.
      narrative_beat: Dr. Rho recibe a Dina y Liruf en el bosque nevado y hace rodar una bolita de nieve pequeña frente a ellos.
      difficulty: 1
      suggested_families:
      - story
      - choice
    - position: 2
      slug: guardar-dinero-tambien-crece
      micro_objective: Comparar la bola de nieve que crece con el dinero guardado que también puede crecer un poco con el tiempo.
      narrative_beat: Zara Vex compara la bola de nieve con una bolsa de monedas guardada, preguntando a Liruf qué tienen en común.
      difficulty: 2
      suggested_families:
      - choice
      - analyze
    - position: 3
      slug: el-premio-por-guardar
      micro_objective: Reconocer el interés como un pequeño premio que se gana por dejar el dinero guardado con el tiempo.
      narrative_beat: Dr. Rho explica que el interés es como un pequeño premio de nieve extra que se pega a la bola por dejarla rodar.
      difficulty: 2
      suggested_families:
      - story
      - choice
    - position: 4
      slug: mi-explicacion-del-interes
      micro_objective: Explicar, con sus propias palabras, qué es el interés usando el ejemplo de la bola de nieve.
      narrative_beat: Dina le explica a un aprendiz nuevo del bosque qué es el interés, usando la bola de nieve como ejemplo.
      difficulty: 3
      suggested_families:
      - choice
      - storyplay
  - position: 2
    slug: interes-simple-vs-interes-compuesto
    title_es: Interés simple frente a interés compuesto
    concept: El interés simple agrega siempre la misma cantidad extra cada vez, mientras que el interés compuesto agrega un poco más cada vez porque el premio anterior también gana premio.
    learning_objective: Al final, el niño puede distinguir el interés simple del interés compuesto con un ejemplo visual.
    key_vocabulary:
    - simple
    - compuesto
    - agregar
    - cantidad
    prior_knowledge: Sabe qué es el interés y por qué es un premio por guardar dinero (tema anterior).
    parent_check: "¿{{name}} puede explicarte, con un dibujo o un ejemplo, la diferencia entre interés simple e interés compuesto?"
    fact_refs: []
    lessons:
    - position: 1
      slug: dos-bolas-de-nieve-distintas
      micro_objective: 'Observar dos bolas de nieve que ruedan distinto: una gana siempre la misma nieve, la otra gana cada vez más.'
      narrative_beat: Dr. Rho hace rodar dos bolas de nieve al mismo tiempo, una crece siempre igual y la otra crece cada vez más rápido.
      difficulty: 1
      suggested_families:
      - story
      - choice
    - position: 2
      slug: la-bola-que-siempre-gana-lo-mismo
      micro_objective: Reconocer que en el interés simple, la cantidad extra agregada es siempre la misma cada vuelta.
      narrative_beat: Zara Vex señala la primera bola de nieve y muestra que gana la misma cantidad de nieve en cada vuelta, sin cambiar.
      difficulty: 2
      suggested_families:
      - analyze
      - money
    - position: 3
      slug: la-bola-que-gana-cada-vez-mas
      micro_objective: Reconocer que en el interés compuesto, la cantidad extra crece porque el premio anterior también gana premio.
      narrative_beat: Dr. Rho señala la segunda bola de nieve y explica que la nieve ganada la vuelta pasada también empieza a ganar nieve nueva.
      difficulty: 2
      suggested_families:
      - analyze
      - money
    - position: 4
      slug: mi-comparacion-de-las-dos-bolas
      micro_objective: Comparar, con un ejemplo propio, por qué la bola de interés compuesto termina siendo más grande.
      narrative_beat: Dina compara las dos bolas de nieve al final del recorrido y explica por qué una terminó más grande que la otra.
      difficulty: 3
      suggested_families:
      - choice
      - analyze
  - position: 3
    slug: la-bola-de-nieve-que-crece
    title_es: La bola de nieve que crece sola
    concept: Cada vuelta de la bola de nieve agrega más nieve a lo que ya tenía, así que la bola crece sobre lo que ya había crecido antes.
    learning_objective: Al final, el niño puede explicar que el interés compuesto crece sobre lo que ya había crecido antes.
    key_vocabulary:
    - crecer
    - vuelta
    - antes
    - sobre
    prior_knowledge: Puede distinguir el interés simple del compuesto con un ejemplo visual (tema anterior).
    parent_check: "¿{{name}} puede explicarte por qué la bola de nieve del interés compuesto crece sobre lo que ya había crecido antes?"
    fact_refs: []
    lessons:
    - position: 1
      slug: la-primera-vuelta-del-bosque
      micro_objective: Observar la primera vuelta de la bola de nieve, ganando su primer poco de nieve extra.
      narrative_beat: Dr. Rho cuenta la primera vuelta de la bola de nieve mágica, marcando cuánta nieve extra ganó.
      difficulty: 1
      suggested_families:
      - story
      - money
    - position: 2
      slug: la-segunda-vuelta-usa-la-nieve-nueva
      micro_objective: Reconocer que la segunda vuelta de la bola usa como base la nieve ganada en la primera vuelta.
      narrative_beat: Zara Vex marca la segunda vuelta y muestra que ahora la bola es más grande, así que gana un poco más de nieve que antes.
      difficulty: 2
      suggested_families:
      - analyze
      - money
    - position: 3
      slug: cada-vuelta-parte-de-un-tamano-mas-grande
      micro_objective: Explicar que cada vuelta nueva parte de un tamaño más grande que la vuelta anterior.
      narrative_beat: Dr. Rho pregunta a Liruf por qué la tercera vuelta gana todavía más nieve que la segunda.
      difficulty: 2
      suggested_families:
      - choice
      - story
    - position: 4
      slug: mi-dibujo-de-la-bola-que-crece
      micro_objective: Representar, con un dibujo simulado, cómo la bola de nieve crece sobre lo que ya había crecido.
      narrative_beat: Dina dibuja las tres vueltas de la bola de nieve, mostrando cómo cada una parte de un tamaño más grande.
      difficulty: 3
      suggested_families:
      - arrange
      - choice
  - position: 4
    slug: de-cien-a-ciento-diez
    title_es: De cien a ciento diez monedas
    concept: Cien monedas guardadas un año con interés compuesto pueden convertirse en ciento diez monedas, ganando diez monedas de premio.
    learning_objective: Al final, el niño puede calcular que cien monedas se convierten en ciento diez después de un año de interés.
    key_vocabulary:
    - cien
    - ciento diez
    - año
    - monedas
    prior_knowledge: Sabe que cada vuelta de la bola de nieve crece sobre lo que ya había crecido (tema anterior).
    prerequisites:
    - path: el-reino-de-las-canastas/un-pedacito-de-una-empresa/el-precio-de-una-accion-sube-y-baja
      strength: soft
      reason: "Haber visto que un valor puede subir con el tiempo prepara para entender cómo crece el interés compuesto."
    parent_check: "¿{{name}} puede explicarte cómo cien monedas se convierten en ciento diez después de un año guardadas con interés?"
    fact_refs: []
    lessons:
    - position: 1
      slug: cien-monedas-en-la-bola
      micro_objective: Observar cien monedas de oro del bosque guardadas al inicio de la primera vuelta.
      narrative_beat: Dr. Rho coloca cien monedas de oro del bosque dentro de la primera bola de nieve mágica.
      difficulty: 1
      suggested_families:
      - story
      - money
    - position: 2
      slug: diez-monedas-de-premio
      micro_objective: Observar que después de un año, la bola de nieve agregó diez monedas de premio a las cien iniciales.
      narrative_beat: Al terminar la primera vuelta, Zara Vex cuenta diez monedas nuevas pegadas a la bola de nieve de Dina.
      difficulty: 2
      suggested_families:
      - money
      - analyze
    - position: 3
      slug: sumar-cien-mas-diez
      micro_objective: Calcular que cien monedas más diez monedas de premio dan ciento diez monedas en total.
      narrative_beat: Dr. Rho pide a Liruf sumar las cien monedas iniciales con las diez de premio para saber el total nuevo.
      difficulty: 2
      suggested_families:
      - money
      - input
    - position: 4
      slug: mi-calculo-de-cien-a-ciento-diez
      micro_objective: Aplicar el cálculo completo para explicar cómo cien monedas se convirtieron en ciento diez.
      narrative_beat: Dina explica a un aprendiz nuevo, paso a paso, cómo sus cien monedas se convirtieron en ciento diez.
      difficulty: 3
      suggested_families:
      - money
      - choice
  - position: 5
    slug: de-ciento-diez-a-ciento-veintiuno
    title_es: De ciento diez a ciento veintiuno
    concept: El segundo año, las ciento diez monedas también ganan su premio, y se convierten en ciento veintiuno, porque el premio del año pasado también ganó premio.
    learning_objective: Al final, el niño puede calcular que ciento diez monedas se convierten en ciento veintiuno después de un segundo año.
    key_vocabulary:
    - ciento diez
    - ciento veintiuno
    - segundo año
    - premio
    prior_knowledge: Sabe que cien monedas se convierten en ciento diez después de un año (tema anterior).
    parent_check: "¿{{name}} puede explicarte por qué ciento diez monedas se convierten en ciento veintiuno, y no solo en ciento veinte?"
    fact_refs: []
    lessons:
    - position: 1
      slug: la-segunda-vuelta-con-ciento-diez
      micro_objective: Observar que la segunda vuelta de la bola de nieve empieza con ciento diez monedas, no con cien.
      narrative_beat: Dr. Rho marca el inicio de la segunda vuelta de la bola de nieve de Dina, que ahora tiene ciento diez monedas.
      difficulty: 1
      suggested_families:
      - story
      - money
    - position: 2
      slug: el-premio-tambien-gano-premio
      micro_objective: Reconocer que las diez monedas de premio del año pasado también ganaron un poco de premio este año.
      narrative_beat: Zara Vex señala que, este año, hasta las diez monedas de premio del año pasado ganaron un poquito más.
      difficulty: 2
      suggested_families:
      - analyze
      - money
    - position: 3
      slug: por-que-no-son-ciento-veinte
      micro_objective: Explicar por qué el resultado es ciento veintiuno y no exactamente ciento veinte.
      narrative_beat: Dr. Rho pregunta a Liruf por qué el premio de este año es un poquito más que el del año pasado.
      difficulty: 3
      suggested_families:
      - analyze
      - money
    - position: 4
      slug: mi-calculo-de-ciento-diez-a-ciento-veintiuno
      micro_objective: Aplicar el cálculo completo para explicar cómo ciento diez monedas se convirtieron en ciento veintiuno.
      narrative_beat: Dina explica a Liruf, paso a paso, cómo sus ciento diez monedas se convirtieron en ciento veintiuno.
      difficulty: 3
      suggested_families:
      - money
      - choice
  - position: 6
    slug: de-ciento-veintiuno-a-ciento-treinta-y-tres
    title_es: De ciento veintiuno a ciento treinta y tres
    concept: El tercer año, las ciento veintiuno monedas se convierten en ciento treinta y tres con un poco, mostrando que la bola de nieve gana cada vez más rápido.
    learning_objective: Al final, el niño puede calcular que ciento veintiuno monedas se convierten en ciento treinta y tres con un poco después de un tercer año.
    key_vocabulary:
    - ciento veintiuno
    - ciento treinta y tres
    - tercer año
    - crecer
    prior_knowledge: Sabe que ciento diez monedas se convierten en ciento veintiuno después de un segundo año (tema anterior).
    parent_check: "¿{{name}} puede explicarte que, cada año, la bola de nieve del dinero gana un poquito más que el año anterior?"
    fact_refs: []
    lessons:
    - position: 1
      slug: la-tercera-vuelta-del-bosque
      micro_objective: Observar la tercera vuelta de la bola de nieve, empezando con ciento veintiuno monedas.
      narrative_beat: Dr. Rho marca el inicio de la tercera vuelta de la bola de nieve de Dina, que ahora tiene ciento veintiuno monedas.
      difficulty: 2
      suggested_families:
      - story
      - money
    - position: 2
      slug: ciento-treinta-y-tres-con-un-poco
      micro_objective: Observar que la tercera vuelta termina en ciento treinta y tres monedas con un poco más.
      narrative_beat: Al terminar la tercera vuelta, Zara Vex cuenta ciento treinta y tres monedas con un poquito más pegadas a la bola.
      difficulty: 2
      suggested_families:
      - money
      - analyze
    - position: 3
      slug: comparar-las-tres-vueltas
      micro_objective: Comparar el premio ganado en cada una de las tres vueltas y notar que crece cada vez.
      narrative_beat: Dr. Rho pone las tres vueltas en fila y pide a Liruf comparar cuánto premio ganó cada una.
      difficulty: 3
      suggested_families:
      - analyze
      - arrange
    - position: 4
      slug: mi-linea-de-tres-anos
      micro_objective: Aplicar el registro completo de los tres años para explicar cómo la bola de nieve fue creciendo cada vez más rápido.
      narrative_beat: Dina arma una línea con los tres años completos y explica a un aprendiz nuevo cómo la bola creció cada vez más rápido.
      difficulty: 3
      suggested_families:
      - arrange
      - choice
  - position: 7
    slug: por-que-crece-mas-rapido-cada-vez
    title_es: Por qué crece más rápido cada vez
    concept: La bola de nieve del dinero crece más rápido cada vez porque cada premio nuevo se suma a un tamaño más grande que el anterior.
    learning_objective: Al final, el niño puede explicar por qué el interés compuesto crece más rápido con cada vuelta que pasa.
    key_vocabulary:
    - rápido
    - vuelta
    - crecer
    - premio
    prior_knowledge: Ha calculado tres vueltas completas de la bola de nieve del dinero (temas anteriores).
    parent_check: "¿{{name}} puede explicarte por qué la bola de nieve del dinero crece cada vez más rápido, y no siempre igual?"
    fact_refs: []
    lessons:
    - position: 1
      slug: la-bola-gigante-de-diez-vueltas
      micro_objective: Observar una bola de nieve imaginada después de diez vueltas, mucho más grande que después de tres.
      narrative_beat: Dr. Rho muestra a Dina una bola de nieve imaginada después de diez vueltas completas, enorme comparada con la del principio.
      difficulty: 2
      suggested_families:
      - story
      - choice
    - position: 2
      slug: el-secreto-de-la-velocidad
      micro_objective: 'Explicar el secreto de por qué la bola gana velocidad: cada premio se suma a un tamaño mayor que antes.'
      narrative_beat: Zara Vex reta a Liruf a explicar el secreto de por qué la bola de nieve del bosque gana velocidad con cada vuelta.
      difficulty: 3
      suggested_families:
      - choice
      - analyze
    - position: 3
      slug: comparar-el-inicio-con-el-final
      micro_objective: Comparar cuánto premio ganó la bola en su primera vuelta frente a cuánto gana en una vuelta mucho más tardía.
      narrative_beat: Dr. Rho compara el pequeño premio de la primera vuelta con el premio mucho más grande de una vuelta mucho más tardía.
      difficulty: 3
      suggested_families:
      - analyze
      - money
    - position: 4
      slug: mi-explicacion-de-la-velocidad
      micro_objective: Explicar, con sus propias palabras, por qué el interés compuesto acelera con el tiempo.
      narrative_beat: Dina le explica a un aprendiz nuevo del bosque, con sus propias palabras, por qué la bola de nieve acelera con el tiempo.
      difficulty: 3
      suggested_families:
      - choice
      - storyplay
  - position: 8
    slug: practicar-la-bola-de-nieve
    title_es: Practicar la bola de nieve del dinero
    concept: Calcular los siguientes pasos de una bola de nieve de dinero en escenarios nuevos junta todo lo aprendido en la saga.
    learning_objective: Al final, el niño puede calcular el siguiente paso de una bola de nieve de dinero dada.
    key_vocabulary:
    - calcular
    - siguiente
    - practicar
    - bola de nieve
    prior_knowledge: Ha completado los siete temas anteriores sobre la bola de nieve del dinero (temas anteriores).
    parent_check: "¿{{name}} puede calcular, con tu ayuda, el siguiente paso de una bola de nieve de dinero nueva?"
    fact_refs: []
    lessons:
    - position: 1
      slug: una-bola-de-nieve-nueva
      micro_objective: Observar una bola de nieve nueva del bosque, empezando con una cantidad distinta de monedas.
      narrative_beat: Dr. Rho presenta una bola de nieve nueva a Liruf, empezando con una cantidad distinta de monedas de oro.
      difficulty: 2
      suggested_families:
      - story
      - money
    - position: 2
      slug: predecir-el-siguiente-paso
      micro_objective: Predecir cuántas monedas tendrá la bola de nieve nueva después de la primera vuelta.
      narrative_beat: Zara Vex reta a Liruf a predecir cuántas monedas tendrá la nueva bola de nieve después de su primera vuelta.
      difficulty: 3
      suggested_families:
      - money
      - input
    - position: 3
      slug: comprobar-mi-prediccion
      micro_objective: Comprobar la predicción hecha comparándola con el resultado real de la vuelta de la bola de nieve.
      narrative_beat: Dr. Rho revela el resultado real de la vuelta, y Liruf compara su predicción con lo que en verdad pasó.
      difficulty: 3
      suggested_families:
      - money
      - analyze
    - position: 4
      slug: mi-calculo-completo-de-la-bola
      micro_objective: Aplicar con seguridad, sin ayuda, el cálculo completo de una bola de nieve nueva a lo largo de varias vueltas.
      narrative_beat: Dina calcula sola, sin ayuda de Dr. Rho, varias vueltas completas de una bola de nieve nueva del bosque.
      difficulty: 3
      suggested_families:
      - money
      - choice
  - position: 9
    slug: el-cofre-del-repaso
