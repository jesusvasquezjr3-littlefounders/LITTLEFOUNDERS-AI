schema_version: 1
adventure:
  position: 4
  slug: la-ciudad-de-las-metas
  theme: city
  age_tier: tier3
  title:
    en-US: The City of Goals
    es-MX: La Ciudad de las Metas
    pt-BR: A Cidade das Metas
  description:
    en-US: Dina and Liruf reach a bustling city where Dina, now a goals mentor, helps them plan real long-term
      goals and discover why prices rise with time.
    es-MX: Dina y Liruf llegan a una ciudad bulliciosa donde Dina, ahora mentora de metas, los ayuda a
      planear metas reales de largo plazo y a descubrir por qué los precios suben con el tiempo.
    pt-BR: Dina e Liruf chegam a uma cidade agitada onde Dina, agora mentora de metas, os ajuda a planejar
      metas reais de longo prazo e a descobrir por que os preços sobem com o tempo.
  narrative_arc: 'Dina y Liruf llegan a una gran ciudad -su primera aventura de tier3- donde Dina asume
    su papel de mentora de metas: ayuda a plantear objetivos grandes que toman meses, no semanas, dividiéndolos
    en avances semanales manejables. Ahí conocen a la abuela de Dr. Rho, quien recuerda que su paleta
    favorita costaba mucho menos hace algunos años -la puerta concreta a entender que los precios suben
    con el tiempo (inflación) y que el mismo dinero compra un poco menos mañana. Dina y Liruf descubren
    por qué guardar dinero ''bajo el colchón'', sin dejarlo crecer, pierde valor real frente a guardarlo
    donde el tiempo y el premio lo hacen crecer -combinando todo lo aprendido en el jardín y la aldea-
    y aprenden el concepto de poder de compra: por qué una meta también necesita crecer para no quedarse
    corta. Al despedirse de la ciudad, Dina y Liruf cierran el arco introductorio de la aventura y entran
    de lleno al mundo de las inversiones que los espera en los siguientes destinos del mapa.'
sagas:
- position: 1
  slug: metas-grandes-planes-claros
  icon: flag_circle
  title:
    en-US: Big Goals, Clear Plans
    es-MX: Metas Grandes, Planes Claros
    pt-BR: Metas Grandes, Planos Claros
  description:
    en-US: Break a goal that takes months, not weeks, into a plan you can actually follow.
    es-MX: Divide una meta que toma meses, no semanas, en un plan que de verdad puedas seguir.
    pt-BR: Divida uma meta que leva meses, não semanas, em um plano que você realmente pode seguir.
  topics:
  - position: 1
    slug: una-meta-que-toma-mas-de-un-mes
    title_es: Una meta que toma más de un mes
    concept: Algunas metas son tan grandes que no se logran en unas pocas semanas, sino a lo largo de
      varios meses de ahorro constante.
    learning_objective: Al final, el niño puede identificar una meta de largo plazo que toma más de un
      mes de ahorro constante.
    key_vocabulary:
    - meta
    - largo-plazo
    - meses
    - constante
    prior_knowledge: Ha aprendido a plantear metas con premio en la aldea del valle (aventura 2).
    parent_check: ¿{{name}} puede nombrar una meta grande que le tomaría varios meses lograr, ahorrando
      con constancia?
    prerequisites:
    - path: la-aldea-del-interes/metas-con-premio/una-meta-que-quiero-lograr
      strength: hard
      reason: Plantear una meta grande de varios meses requiere ya saber plantear y medir el avance de
        una meta más simple con premio.
    fact_refs:
    - mxn.reference_prices.bicicleta_infantil
    lessons:
    - position: 1
      slug: dina-llega-a-la-ciudad
      micro_objective: Reconocer que la ciudad presenta metas más grandes, que toman más de un mes de
        ahorro.
      narrative_beat: Dina y Liruf llegan a una gran ciudad donde Dina ve una bicicleta que cuesta mucho
        más que cualquier meta que haya ahorrado antes.
      difficulty: 1
      suggested_families:
      - story
      - choice
    - position: 2
      slug: meses-en-vez-de-semanas
      micro_objective: Distinguir una meta de varios meses de una meta de pocas semanas, ya conocida de
        la aldea.
      narrative_beat: Dr. Rho explica que esta meta no se mide en semanas, como en la aldea, sino en varios
        meses de ahorro constante.
      difficulty: 2
      suggested_families:
      - choice
      - money
    - position: 3
      slug: por-que-esta-meta-toma-mas-tiempo
      micro_objective: Explicar por qué una meta más costosa toma naturalmente más tiempo de ahorro.
      narrative_beat: Zara Vex pregunta a Liruf por qué cree que esta meta, al costar tanto más, toma tanto
        más tiempo de ahorro.
      difficulty: 2
      suggested_families:
      - choice
      - story
    - position: 4
      slug: identificar-mi-propia-meta-grande
      micro_objective: Aplicar la identificación de una meta grande propia que tomaría varios meses lograr.
      narrative_beat: Frente a varias metas posibles de la ciudad, Dina identifica cuál tomaría varios
        meses de ahorro constante.
      difficulty: 3
      suggested_families:
      - choice
      - money
  - position: 2
    slug: partir-una-meta-grande-en-semanas
    title_es: Partir una meta grande en semanas
    concept: Dividir una meta grande en semanas más pequeñas, cada una con un avance concreto, hace que
      el camino se sienta manejable.
    learning_objective: Al final, el niño puede dividir una meta grande de varios meses en avances semanales
      concretos.
    key_vocabulary:
    - dividir
    - avance
    - semanal
    - manejable
    prior_knowledge: Ha identificado una meta grande que toma varios meses (tema anterior).
    parent_check: ¿{{name}} puede explicar cómo dividiría una meta grande en pasos semanales más pequeños?
    fact_refs: []
    lessons:
    - position: 1
      slug: la-meta-se-ve-enorme
      micro_objective: Reconocer que una meta grande puede sentirse abrumadora si no se divide en partes.
      narrative_beat: Dina mira el costo total de la bicicleta y siente que la meta es enorme, casi imposible
        de imaginar completa.
      difficulty: 1
      suggested_families:
      - story
      - choice
    - position: 2
      slug: dividir-en-semanas-mas-chicas
      micro_objective: Calcular cuántas semanas de ahorro constante se necesitan para una meta grande.
      narrative_beat: Dr. Rho ayuda a Dina a dividir el costo total entre lo que puede guardar cada semana,
        para ver el número real de semanas.
      difficulty: 2
      suggested_families:
      - money
      - choice
    - position: 3
      slug: un-numero-manejable
      micro_objective: Explicar por qué dividir la meta en semanas la hace sentir más manejable.
      narrative_beat: Zara Vex pregunta a Liruf por qué ver el número de semanas, en vez del costo total,
        hace que la meta se sienta más manejable.
      difficulty: 2
      suggested_families:
      - choice
      - story
    - position: 4
      slug: dividir-mi-propia-meta-grande
      micro_objective: Aplicar la división de una meta grande propia en avances semanales concretos.
      narrative_beat: Frente a su propia meta grande, Dina la divide en semanas y calcula su primer avance
        concreto.
      difficulty: 3
      suggested_families:
      - money
      - choice
  - position: 3
    slug: cuanto-tengo-cuanto-me-falta
    title_es: Cuánto tengo, cuánto me falta
    concept: Registrar cuánto se ha guardado y cuánto falta para la meta permite ver el avance real semana
      tras semana.
    learning_objective: Al final, el niño puede calcular cuánto ha guardado y cuánto le falta para una
      meta de largo plazo.
    key_vocabulary:
    - tengo
    - falta
    - avance
    - registrar
    prior_knowledge: Sabe dividir una meta grande en avances semanales (tema anterior).
    parent_check: ¿{{name}} puede calcular, con ayuda, cuánto le falta para una meta si ya sabe cuánto
      ha guardado?
    fact_refs: []
    lessons:
    - position: 1
      slug: el-registro-de-avance-de-dina
      micro_objective: Conocer un registro simple que muestra cuánto se ha guardado y cuánto falta para
        una meta.
      narrative_beat: Dr. Rho entrega a Dina un registro simple donde anota, cada semana, cuánto lleva
        guardado y cuánto le falta.
      difficulty: 1
      suggested_families:
      - story
      - choice
    - position: 2
      slug: calcular-lo-que-falta
      micro_objective: Calcular cuánto falta para una meta, restando lo guardado del costo total.
      narrative_beat: Zara Vex reta a Liruf a calcular cuánto le falta para su meta, restando lo que ya
        guardó del costo total.
      difficulty: 2
      suggested_families:
      - money
      - choice
    - position: 3
      slug: ver-el-avance-anima
      micro_objective: Explicar por qué ver el avance real, semana tras semana, ayuda a mantener la motivación.
      narrative_beat: Dr. Rho pregunta a Dina por qué cree que ver su avance real, cada semana, la ayuda
        a seguir motivada.
      difficulty: 2
      suggested_families:
      - choice
      - story
    - position: 4
      slug: actualizar-mi-registro
      micro_objective: Aplicar el cálculo de avance a un registro propio, actualizándolo con una nueva
        semana.
      narrative_beat: Frente a una nueva semana de ahorro, Dina actualiza su registro y calcula su nuevo
        avance.
      difficulty: 3
      suggested_families:
      - money
      - choice
  - position: 4
    slug: ajustar-el-plan-si-cambia-algo
    title_es: Ajustar el plan si cambia algo
    concept: Cuando algo cambia -se guarda menos una semana, o aparece un gasto inesperado- el plan de
      meta se puede ajustar sin abandonarlo.
    learning_objective: Al final, el niño puede ajustar un plan de meta cuando algo cambia, sin abandonar
      la meta.
    key_vocabulary:
    - ajustar
    - cambiar
    - imprevisto
    - flexible
    prior_knowledge: Sabe calcular cuánto le falta para una meta (tema anterior).
    parent_check: ¿{{name}} sabe que un plan de ahorro se puede ajustar si algo cambia, en vez de abandonarlo
      por completo?
    fact_refs: []
    lessons:
    - position: 1
      slug: una-semana-dificil
      micro_objective: Reconocer que a veces una semana no permite guardar lo planeado, y eso no arruina
        la meta.
      narrative_beat: Una semana, Dina no puede guardar lo que había planeado porque surgió un gasto inesperado
        en casa.
      difficulty: 1
      suggested_families:
      - story
      - choice
    - position: 2
      slug: recalcular-las-semanas-que-faltan
      micro_objective: Recalcular cuántas semanas adicionales se necesitan después de un ajuste al plan.
      narrative_beat: Dr. Rho ayuda a Dina a recalcular cuántas semanas más le tomará la meta después
        de esa semana difícil.
      difficulty: 2
      suggested_families:
      - money
      - choice
    - position: 3
      slug: ajustar-no-es-rendirse
      micro_objective: Explicar la diferencia entre ajustar un plan y abandonarlo por completo.
      narrative_beat: Zara Vex explica a Liruf que ajustar el plan, sumando algunas semanas más, es muy
        distinto a rendirse.
      difficulty: 2
      suggested_families:
      - choice
      - story
    - position: 4
      slug: ajustar-mi-propio-plan
      micro_objective: Aplicar el ajuste de un plan propio de meta frente a un cambio inesperado.
      narrative_beat: Frente a un cambio inesperado en su propio plan, Dina lo ajusta con calma, sin abandonar
        su meta.
      difficulty: 3
      suggested_families:
      - choice
      - money
  - position: 5
    slug: una-meta-de-un-ano-comparada-con-una-de-un-mes
    title_es: Una meta de un año comparada con una de un mes
    concept: Comparar una meta de un mes con una de un año muestra que ambas usan el mismo proceso, solo
      que la de un año exige más constancia sostenida.
    learning_objective: Al final, el niño puede comparar el proceso de una meta de un mes contra una meta
      de un año.
    key_vocabulary:
    - comparar
    - año
    - mes
    - constancia
    prior_knowledge: Ha aprendido a ajustar un plan de meta cuando algo cambia (tema anterior).
    parent_check: ¿{{name}} puede comparar cómo ahorraría para algo que toma un mes y algo que toma un
      año?
    fact_refs: []
    lessons:
    - position: 1
      slug: dos-metas-muy-distintas
      micro_objective: 'Observar dos metas de la ciudad: una que toma un mes y otra que toma un año completo.'
      narrative_beat: 'Dr. Rho muestra a Dina dos metas de la ciudad: unos audífonos que toman un mes,
        y un viaje familiar que toma un año.'
      difficulty: 1
      suggested_families:
      - story
      - choice
    - position: 2
      slug: comparar-las-semanas-de-cada-una
      micro_objective: Comparar el número de semanas necesarias entre una meta de un mes y una de un año.
      narrative_beat: Zara Vex pide a Liruf comparar cuántas semanas toma cada meta y qué tan distinto
        se siente cada número.
      difficulty: 2
      suggested_families:
      - money
      - analyze
    - position: 3
      slug: el-mismo-proceso-mas-constancia
      micro_objective: Explicar que ambas metas usan el mismo proceso, pero la de un año exige sostener
        la constancia por más tiempo.
      narrative_beat: Dr. Rho pregunta a Dina si el proceso para ahorrar cambia entre ambas metas, o solo
        cambia cuánto tiempo hay que sostenerlo.
      difficulty: 2
      suggested_families:
      - choice
      - story
    - position: 4
      slug: elegir-y-planear-ambas-metas
      micro_objective: Aplicar el proceso de ahorro a una meta de un mes y a una de un año al mismo tiempo.
      narrative_beat: Frente a dos metas nuevas, una de un mes y otra de un año, Dina arma un plan de
        ahorro para cada una.
      difficulty: 3
      suggested_families:
      - choice
      - money
  - position: 6
    slug: lo-que-gana-mi-meta-si-empiezo-antes
    title_es: Lo que gana mi meta si empiezo antes
    concept: Empezar a ahorrar para una meta de largo plazo antes, en vez de esperar, da más tiempo para
      que el premio de la casa de ahorros también ayude.
    learning_objective: Al final, el niño puede explicar la ventaja de empezar a ahorrar para una meta
      de largo plazo lo antes posible.
    key_vocabulary:
    - empezar
    - antes
    - ventaja
    - tiempo
    prior_knowledge: Ha comparado el proceso de una meta de un mes contra una de un año (tema anterior).
    parent_check: ¿{{name}} puede explicar por qué empezar antes a ahorrar para una meta grande ayuda
      más que esperar?
    fact_refs:
    - money.simple_interest_100_year1
    - money.compound_growth_100_3years
    lessons:
    - position: 1
      slug: dos-companeros-dos-fechas-de-inicio
      micro_objective: Observar la diferencia entre empezar a ahorrar para una meta hoy o esperar varios
        meses para empezar.
      narrative_beat: 'Dr. Rho compara a dos amigos de la ciudad: uno empezó a ahorrar para su meta hoy,
        y otro decidió esperar varios meses.'
      difficulty: 1
      suggested_families:
      - story
      - choice
    - position: 2
      slug: calcular-la-diferencia-de-empezar-antes
      micro_objective: Calcular cuánto premio adicional se gana por empezar a ahorrar antes para una meta
        de largo plazo.
      narrative_beat: Zara Vex ayuda a Liruf a calcular cuánto premio extra ganaría el amigo que empezó
        antes, comparado con el que esperó.
      difficulty: 2
      suggested_families:
      - money
      - analyze
    - position: 3
      slug: por-que-el-tiempo-extra-ayuda
      micro_objective: Explicar por qué más tiempo guardado permite que el premio de la casa de ahorros
        ayude más.
      narrative_beat: 'Dr. Rho recuerda a Dina lo aprendido en la aldea: mientras más tiempo se guarda,
        más premio se acumula.'
      difficulty: 2
      suggested_families:
      - choice
      - story
    - position: 4
      slug: decidir-empezar-hoy
      micro_objective: Aplicar la decisión de empezar a ahorrar hoy para una meta propia de largo plazo,
        explicando la ventaja.
      narrative_beat: Frente a su propia meta de largo plazo, Dina decide empezar a ahorrar hoy mismo
        y explica la ventaja de no esperar.
      difficulty: 3
      suggested_families:
      - choice
      - money
  - position: 7
    slug: escribir-mi-propia-meta-grande
    title_es: Escribir mi propia meta grande
    concept: Escribir con claridad una meta grande -qué es, cuánto cuesta, y para cuándo- es el primer
      paso concreto para lograrla.
    learning_objective: Al final, el niño puede escribir con claridad una meta grande propia, incluyendo
      qué es, cuánto cuesta y para cuándo la quiere.
    key_vocabulary:
    - escribir
    - meta
    - claridad
    - concreto
    prior_knowledge: Ha aprendido a dividir, registrar avance, ajustar y empezar temprano en una meta
      grande (temas anteriores).
    parent_check: '¿{{name}} puede escribir o decir con claridad una meta grande propia: qué es, cuánto
      cuesta y para cuándo la quiere?'
    fact_refs: []
    lessons:
    - position: 1
      slug: el-cuaderno-de-metas-de-la-ciudad
      micro_objective: Conocer un cuaderno de metas donde se escribe con claridad qué se quiere lograr
        y para cuándo.
      narrative_beat: Dr. Rho entrega a Dina un cuaderno especial de la ciudad para escribir su meta grande
        con toda claridad.
      difficulty: 1
      suggested_families:
      - story
      - choice
    - position: 2
      slug: las-tres-partes-de-una-meta-escrita
      micro_objective: 'Ordenar las tres partes necesarias de una meta bien escrita: qué es, cuánto cuesta,
        para cuándo.'
      narrative_beat: Zara Vex ayuda a Liruf a ordenar las tres partes de una meta bien escrita antes de
        anotarla en su cuaderno.
      difficulty: 2
      suggested_families:
      - choice
      - arrange
    - position: 3
      slug: practicar-escribir-mi-meta
      micro_objective: Practicar escribir o decir en voz alta una meta grande propia con sus tres partes
        completas.
      narrative_beat: Dina practica escribir su propia meta grande en el cuaderno, revisando que tenga
        las tres partes completas.
      difficulty: 2
      suggested_families:
      - storyplay
      - choice
    - position: 4
      slug: mi-meta-grande-terminada
      micro_objective: Aplicar con seguridad la escritura completa de una meta grande propia, lista para
        comenzar a perseguirla.
      narrative_beat: Con su meta grande ya escrita con claridad, Dina la comparte con Dr. Rho y Liruf,
        lista para comenzar su plan.
      difficulty: 3
      suggested_families:
      - choice
      - story
  - position: 8
    slug: mi-plan-completo-de-meta
    title_es: Mi plan completo de meta
    concept: Un plan completo de meta une la meta escrita, la división en semanas, el registro de avance
      y el ajuste si algo cambia, todo aplicado a una situación real.
    learning_objective: Al final, el niño puede armar un plan completo de meta que una meta escrita, avances
      semanales y ajuste flexible.
    key_vocabulary:
    - plan
    - completo
    - meta
    - aplicar
    prior_knowledge: Ha aprendido a escribir su meta grande con claridad (tema anterior).
    parent_check: '¿{{name}} tiene, o puede armar, un plan completo para una meta grande: qué quiere,
      cuánto cuesta y cómo la va a lograr?'
    fact_refs: []
    lessons:
    - position: 1
      slug: unir-todas-las-piezas
      micro_objective: Reconocer, dentro de una historia, las piezas que forman un plan completo de meta.
      narrative_beat: 'Dr. Rho ayuda a Dina a unir todas las piezas de su plan: la meta escrita, las semanas
        divididas, y su registro de avance.'
      difficulty: 1
      suggested_families:
      - story
      - choice
    - position: 2
      slug: calcular-mi-plan-completo
      micro_objective: Calcular el plan completo de una meta, incluyendo semanas totales y avance semanal
        esperado.
      narrative_beat: 'Zara Vex reta a Liruf a calcular su plan completo: cuántas semanas, cuánto guardar
        cada una, y cuándo terminará.'
      difficulty: 2
      suggested_families:
      - money
      - choice
    - position: 3
      slug: explicar-mi-plan-en-voz-alta
      micro_objective: Explicar en voz alta un plan completo de meta, incluyendo todas sus piezas.
      narrative_beat: Dina practica explicando en voz alta su plan completo de meta antes de comenzar
        a seguirlo de verdad.
      difficulty: 2
      suggested_families:
      - storyplay
      - choice
    - position: 4
      slug: comprometerme-con-mi-plan-completo
      micro_objective: Aplicar con seguridad el plan completo de meta, comprometiéndose a seguirlo y ajustarlo
        si hace falta.
      narrative_beat: Con su plan completo ya armado, Dina se compromete frente a Dr. Rho a seguirlo,
        ajustándolo si algo cambia en el camino.
      difficulty: 3
      suggested_families:
      - choice
      - story
  - position: 9
    slug: el-cofre-del-repaso
    kind: review_spaced
    title_es: El Cofre del Repaso
    concept: Zara Vex abre el cofre con los recuerdos de la saga Metas Grandes, Planes Claros.
    learning_objective: Al final, el niño puede recordar y aplicar, sin ayuda nueva, los conceptos principales
      de la saga Metas Grandes, Planes Claros.
    key_vocabulary:
    - meta
    - plan
    - semanas
    - constancia
    prior_knowledge: Ha completado los ocho temas de la saga Metas Grandes, Planes Claros (aventura 4,
      saga 1).
    fact_refs: []
    review_of:
    - la-ciudad-de-las-metas/metas-grandes-planes-claros/una-meta-que-toma-mas-de-un-mes
    - la-ciudad-de-las-metas/metas-grandes-planes-claros/partir-una-meta-grande-en-semanas
    - la-ciudad-de-las-metas/metas-grandes-planes-claros/cuanto-tengo-cuanto-me-falta
    - la-ciudad-de-las-metas/metas-grandes-planes-claros/ajustar-el-plan-si-cambia-algo
    - la-ciudad-de-las-metas/metas-grandes-planes-claros/una-meta-de-un-ano-comparada-con-una-de-un-mes
    - la-ciudad-de-las-metas/metas-grandes-planes-claros/lo-que-gana-mi-meta-si-empiezo-antes
    - la-ciudad-de-las-metas/metas-grandes-planes-claros/escribir-mi-propia-meta-grande
    - la-ciudad-de-las-metas/metas-grandes-planes-claros/mi-plan-completo-de-meta
    lessons:
    - position: 1
      slug: el-cofre-se-abre
      micro_objective: Recordar, sin ayuda nueva, qué hace grande a una meta y cómo dividirla en semanas.
      narrative_beat: Zara Vex abre un cofre de recuerdos de la ciudad y reta a Dina a recordar lo primero
        que aprendió sobre metas grandes.
      difficulty: 1
      suggested_families:
      - story
      - choice
    - position: 2
      slug: recordar-en-orden
      micro_objective: Recordar y ordenar de nuevo cómo calcular el avance de una meta y cómo ajustar
        el plan si algo cambia.
      narrative_beat: Liruf saca del cofre los recuerdos mezclados de la saga y los ordena de memoria,
        sin que Dr. Rho le dé ninguna pista nueva.
      difficulty: 1
      suggested_families:
      - arrange
      - choice
    - position: 3
      slug: aplicar-lo-guardado
