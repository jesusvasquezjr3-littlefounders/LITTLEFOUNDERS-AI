schema_version: 1
adventure:
  position: 7
  slug: el-faro-de-los-fraudes
  theme: archipelago
  age_tier: tier3
  title:
    en-US: The Lighthouse of Frauds
    es-MX: El Faro de los Fraudes
    pt-BR: O Farol das Fraudes
  description:
    en-US: 'Back in the archipelago, Zara Vex now teaches Dina and Liruf to recognize investment fraud: fast-money promises, pyramids, urgency, and who to ask before deciding.'
    es-MX: 'De vuelta en el archipiélago, Zara Vex ahora enseña a Dina y Liruf a reconocer el fraude de inversión: promesas de dinero rápido, pirámides, urgencia, y a quién preguntar antes de decidir.'
    pt-BR: 'De volta ao arquipélago, Zara Vex agora ensina Dina e Liruf a reconhecer fraudes de investimento: promessas de dinheiro rápido, pirâmides, urgência, e a quem perguntar antes de decidir.'
  narrative_arc: Zara Vex, quien antes ponía a prueba a Dina y Liruf con anuncios y trampas en este mismo archipiélago, ahora los recibe como su mejor detectora de fraudes de inversión. Dr. Rho vigila desde el faro mientras Zara Vex les muestra promesas de dinero rápido, pirámides disfrazadas de oportunidad y mensajes que meten prisa para que nadie piense con calma. Juntos aprenden que la mejor defensa no es adivinar solos, sino detenerse, buscar las señales de alerta, y preguntar siempre a la familia antes de decidir.
sagas:
- position: 1
  slug: promesas-de-dinero-rapido
  icon: warning
  title:
    en-US: Fast-Money Promises
    es-MX: Promesas de Dinero Rápido
    pt-BR: Promessas de Dinheiro Rápido
  description:
    en-US: Learn to recognize a fast-money promise as a warning sign, not an opportunity.
    es-MX: Aprende a reconocer una promesa de dinero rápido como una señal de alerta, no como una oportunidad.
    pt-BR: Aprenda a reconhecer uma promessa de dinheiro rápido como um sinal de alerta, não como uma oportunidade.
  topics:
  - position: 1
    slug: dinero-rapido-sin-esfuerzo
    title_es: Dinero rápido sin esfuerzo
    concept: Una promesa de dinero rápido sin ningún esfuerzo es una señal de alerta, porque el dinero real casi siempre toma tiempo en crecer.
    learning_objective: Al final, el niño puede reconocer una promesa de dinero rápido sin esfuerzo como una señal de alerta.
    key_vocabulary:
    - promesa
    - rápido
    - esfuerzo
    - alerta
    prior_knowledge: Sabe que el interés compuesto crece con tiempo y constancia, no de golpe (Aventura 6).
    parent_check: "¿{{name}} puede explicarte por qué una promesa de dinero rápido sin esfuerzo es una señal de alerta?"
    fact_refs: []
    lessons:
    - position: 1
      slug: zara-vex-vuelve-al-archipielago
      micro_objective: Reconocer a Zara Vex como guía de esta nueva parte del archipiélago dedicada a detectar fraudes.
      narrative_beat: Zara Vex recibe a Dina y Liruf en el muelle donde antes jugaban a detectar anuncios, ahora convertido en su escuela de detección de fraudes.
      difficulty: 1
      suggested_families:
      - story
      - choice
    - position: 2
      slug: un-mensaje-de-dinero-facil
      micro_objective: Observar un mensaje que promete dinero rápido y fácil sin pedir ningún esfuerzo a cambio.
      narrative_beat: Un mensaje llega al muelle prometiendo 'dinero fácil y rápido, sin hacer nada', y Liruf siente curiosidad.
      difficulty: 2
      suggested_families:
      - story
      - analyze
    - position: 3
      slug: el-dinero-real-toma-tiempo
      micro_objective: Recordar, con el ejemplo del bosque, que el dinero real casi siempre toma tiempo en crecer.
      narrative_beat: Dr. Rho recuerda a Dina la bola de nieve del bosque, que necesitaba tiempo para crecer, no una sola vuelta mágica.
      difficulty: 2
      suggested_families:
      - choice
      - analyze
    - position: 4
      slug: mi-primera-senal-de-alerta
      micro_objective: Aplicar la señal de alerta aprendida a un mensaje nuevo que promete dinero rápido sin esfuerzo.
      narrative_beat: Frente a un mensaje nuevo del muelle, Dina reconoce sola la señal de alerta de dinero rápido sin esfuerzo.
      difficulty: 3
      suggested_families:
      - analyze
      - choice
  - position: 2
    slug: si-suena-demasiado-bueno
    title_es: Si suena demasiado bueno para ser verdad
    concept: 'El dicho ''si suena demasiado bueno para ser verdad, probablemente lo es'' ayuda a sospechar de promesas de inversión exageradas.'
    learning_objective: Al final, el niño puede aplicar el dicho 'si suena demasiado bueno para ser verdad' a una promesa de inversión.
    key_vocabulary:
    - demasiado bueno
    - sospechar
    - exagerado
    - dicho
    prior_knowledge: Reconoce una promesa de dinero rápido sin esfuerzo como señal de alerta (tema anterior).
    parent_check: "¿{{name}} puede explicarte el dicho 'si suena demasiado bueno para ser verdad, probablemente lo es'?"
    fact_refs: []
    lessons:
    - position: 1
      slug: el-dicho-del-faro
      micro_objective: Conocer el dicho 'si suena demasiado bueno para ser verdad, probablemente lo es' de boca de Zara Vex.
      narrative_beat: Zara Vex enseña a Liruf el dicho del faro, uno que ella misma usa cada vez que algo suena demasiado perfecto.
      difficulty: 1
      suggested_families:
      - story
      - choice
    - position: 2
      slug: comparar-una-promesa-creible-con-una-exagerada
      micro_objective: Comparar una promesa de inversión creíble con una exagerada, usando el dicho como guía.
      narrative_beat: Dr. Rho muestra dos mensajes del muelle y pide a Dina usar el dicho para decidir cuál suena demasiado perfecto.
      difficulty: 2
      suggested_families:
      - analyze
      - choice
    - position: 3
      slug: aplicar-el-dicho-a-una-oferta-nueva
      micro_objective: Aplicar el dicho a una oferta de inversión nueva presentada en el muelle.
      narrative_beat: Zara Vex reta a Liruf a aplicar el dicho frente a una nueva oferta que promete ganancias enormes sin ningún riesgo.
      difficulty: 3
      suggested_families:
      - analyze
      - choice
    - position: 4
      slug: mi-explicacion-del-dicho
      micro_objective: Explicar, con sus propias palabras, por qué el dicho ayuda a protegerse de promesas exageradas.
      narrative_beat: Dina le explica a un aprendiz nuevo del faro por qué confía en el dicho de Zara Vex cada vez que algo suena demasiado bueno.
      difficulty: 3
      suggested_families:
      - choice
      - storyplay
  - position: 3
    slug: nadie-garantiza-ganar-siempre
    title_es: Nadie garantiza ganar siempre
    concept: Nadie, ni siquiera el guardián más sabio, puede garantizar que una inversión siempre va a ganar; toda inversión real tiene algo de riesgo.
    learning_objective: Al final, el niño puede explicar que nadie puede garantizar que una inversión siempre gana.
    key_vocabulary:
    - garantizar
    - siempre
    - riesgo
    - inversión
    prior_knowledge: Puede aplicar el dicho 'si suena demasiado bueno para ser verdad' a una promesa (tema anterior).
    prerequisites:
    - path: el-bosque-del-interes-compuesto/la-bola-de-nieve-del-dinero/que-es-el-interes
      strength: soft
      reason: "Entender cómo funciona el interés real ayuda a reconocer cuándo una promesa de interés es falsa."
    parent_check: "¿{{name}} puede explicarte por qué nadie puede garantizar que una inversión siempre va a ganar?"
    fact_refs: []
    lessons:
    - position: 1
      slug: ni-siquiera-dr-rho-lo-garantiza
      micro_objective: Reconocer que ni siquiera Dr. Rho, el guardián más sabio del archipiélago, puede garantizar ganancias seguras.
      narrative_beat: Liruf le pregunta a Dr. Rho si puede garantizarle que una inversión siempre va a ganar, y Dr. Rho responde con honestidad que no.
      difficulty: 2
      suggested_families:
      - story
      - choice
    - position: 2
      slug: un-vendedor-que-garantiza-de-mas
      micro_objective: Observar a un vendedor del muelle que garantiza ganancias seguras siempre, sin ninguna excepción.
      narrative_beat: Zara Vex señala a un vendedor del muelle que asegura, sin dudar, que su oferta 'siempre gana, sin excepción'.
      difficulty: 2
      suggested_families:
      - analyze
      - choice
    - position: 3
      slug: comparar-la-garantia-falsa-con-la-honestidad
      micro_objective: Comparar la garantía exagerada del vendedor con una explicación honesta del riesgo real.
      narrative_beat: Dr. Rho compara la garantía exagerada del vendedor con su propia explicación honesta sobre el riesgo real de invertir.
      difficulty: 3
      suggested_families:
      - analyze
      - choice
    - position: 4
      slug: mi-explicacion-sin-garantias-falsas
      micro_objective: Explicar, sin usar garantías exageradas, cómo funciona el riesgo real de una inversión.
      narrative_beat: Dina le explica a un aprendiz nuevo del faro por qué desconfía de cualquiera que le garantice ganar siempre.
      difficulty: 3
      suggested_families:
      - choice
      - story
  - position: 4
    slug: comparar-una-promesa-real-con-una-exagerada
    title_es: Comparar una promesa realista con una exagerada
    concept: Comparar una promesa de inversión realista, que admite riesgo, con una exagerada, que promete solo ganar, ayuda a distinguir cuál merece confianza.
    learning_objective: Al final, el niño puede comparar una promesa de inversión realista con una exagerada.
    key_vocabulary:
    - realista
    - exagerada
    - confianza
    - comparar
    prior_knowledge: Sabe que nadie puede garantizar que una inversión siempre gana (tema anterior).
    parent_check: "¿{{name}} puede comparar, con un ejemplo, una promesa de inversión realista con una exagerada?"
    fact_refs: []
    lessons:
    - position: 1
      slug: dos-carteles-en-el-muelle
      micro_objective: Observar dos carteles del muelle, uno con una promesa realista y otro con una promesa exagerada.
      narrative_beat: Dr. Rho muestra a Dina dos carteles del muelle, uno que admite riesgo y otro que promete solo ganancias.
      difficulty: 2
      suggested_families:
      - story
      - analyze
    - position: 2
      slug: que-dice-el-cartel-realista
      micro_objective: Identificar qué dice el cartel realista sobre el riesgo de la inversión que ofrece.
      narrative_beat: Zara Vex lee con Liruf el primer cartel, que explica con honestidad que la inversión puede subir o bajar.
      difficulty: 2
      suggested_families:
      - analyze
      - choice
    - position: 3
      slug: que-dice-el-cartel-exagerado
      micro_objective: Identificar qué dice el cartel exagerado y por qué su promesa no suena creíble.
      narrative_beat: Zara Vex lee con Liruf el segundo cartel, que promete solo ganancias enormes, sin mencionar ningún riesgo.
      difficulty: 3
      suggested_families:
      - analyze
      - choice
    - position: 4
      slug: mi-eleccion-entre-los-dos-carteles
      micro_objective: Elegir, con razones propias, en cuál de los dos carteles confiaría más y explicar por qué.
      narrative_beat: Dina elige, con sus propias razones, el cartel realista, explicando por qué confía más en la honestidad que en la promesa perfecta.
      difficulty: 3
      suggested_families:
      - choice
      - storyplay
  - position: 5
    slug: quien-se-beneficia-de-la-promesa
    title_es: Quién se beneficia de la promesa
    concept: Preguntar quién se beneficia si una persona cree la promesa ayuda a descubrir si alguien más gana con el dinero de quien confía demasiado rápido.
    learning_objective: Al final, el niño puede formular la pregunta de quién se beneficia si él o ella cree una promesa de inversión.
    key_vocabulary:
    - beneficiar
    - preguntar
    - descubrir
    - confiar
    prior_knowledge: Puede comparar una promesa de inversión realista con una exagerada (tema anterior).
    parent_check: "¿{{name}} puede explicarte por qué conviene preguntarse quién se beneficia si uno cree una promesa de inversión?"
    fact_refs: []
    lessons:
    - position: 1
      slug: quien-gana-si-yo-creo
      micro_objective: Observar que alguien más, además de quien invierte, también puede ganar si la promesa se cree sin dudar.
      narrative_beat: Zara Vex pregunta a Liruf quién más, además de él, ganaría si creyera de inmediato el mensaje del muelle.
      difficulty: 2
      suggested_families:
      - story
      - choice
    - position: 2
      slug: el-vendedor-tambien-gana
      micro_objective: Reconocer que la persona que hace la promesa también puede beneficiarse si otros la creen.
      narrative_beat: Dr. Rho muestra que el vendedor del cartel exagerado también gana dinero cada vez que alguien cree su promesa.
      difficulty: 2
      suggested_families:
      - analyze
      - choice
    - position: 3
      slug: hacer-la-pregunta-antes-de-creer
      micro_objective: Practicar formular la pregunta 'quién se beneficia si yo creo esto' antes de aceptar una promesa nueva.
      narrative_beat: Zara Vex reta a Liruf a hacerse la pregunta 'quién se beneficia si yo creo esto' frente a un mensaje nuevo del muelle.
      difficulty: 3
      suggested_families:
      - choice
      - analyze
    - position: 4
      slug: mi-pregunta-antes-de-decidir
      micro_objective: Aplicar con seguridad la pregunta de quién se beneficia frente a una promesa nueva antes de decidir.
      narrative_beat: Dina se hace la pregunta de quién se beneficia frente a un nuevo mensaje del muelle, antes de decidir qué hacer.
      difficulty: 3
      suggested_families:
      - choice
      - storyplay
  - position: 6
    slug: la-promesa-sin-riesgo-no-existe
    title_es: La promesa sin ningún riesgo no existe
    concept: Una inversión que dice tener 'cero riesgo' merece sospecha, porque toda inversión real conlleva al menos un poco de riesgo.
    learning_objective: Al final, el niño puede explicar por qué una inversión que promete 'cero riesgo' merece sospecha.
    key_vocabulary:
    - cero riesgo
    - sospecha
    - real
    - siempre
    prior_knowledge: Puede formular la pregunta de quién se beneficia de una promesa (tema anterior).
    parent_check: "¿{{name}} puede explicarte por qué una inversión que dice 'cero riesgo' merece sospecha?"
    fact_refs: []
    lessons:
    - position: 1
      slug: el-cartel-de-cero-riesgo
      micro_objective: Observar un cartel del muelle que promete una inversión de 'cero riesgo, garantizado'.
      narrative_beat: Un nuevo cartel en el muelle promete 'cero riesgo, garantizado', y Liruf se pregunta si eso es posible.
      difficulty: 2
      suggested_families:
      - story
      - analyze
    - position: 2
      slug: recordar-el-fondo-que-tambien-baja
      micro_objective: Recordar que hasta un fondo diversificado del reino puede bajar de valor, así que nada tiene cero riesgo real.
      narrative_beat: Dr. Rho recuerda a Dina que hasta el fondo diversificado del Reino de las Canastas podía bajar de valor algún año.
      difficulty: 3
      suggested_families:
      - analyze
      - choice
    - position: 3
      slug: por-que-cero-riesgo-es-una-senal
      micro_objective: Explicar por qué la frase 'cero riesgo' es en sí misma una señal de alerta, no una garantía de seguridad.
      narrative_beat: Zara Vex explica a Liruf por qué la frase 'cero riesgo' suele ser justo la señal de que algo no anda bien.
      difficulty: 3
      suggested_families:
      - story
      - analyze
    - position: 4
      slug: mi-alerta-de-cero-riesgo
      micro_objective: Aplicar con seguridad la señal de alerta de 'cero riesgo' frente a una oferta nueva del muelle.
      narrative_beat: Frente a una nueva oferta que promete 'cero riesgo', Dina reconoce sola la señal de alerta sin ayuda de Dr. Rho.
      difficulty: 3
      suggested_families:
      - analyze
      - choice
  - position: 7
    slug: practicar-detectar-la-promesa-rapida
    title_es: Practicar detectar la promesa de dinero rápido
    concept: Usar las señales de alerta aprendidas para detectar una promesa de dinero rápido en escenarios nuevos junta todo lo aprendido en la saga.
    learning_objective: Al final, el niño puede detectar, en un escenario nuevo, una promesa de dinero rápido usando las señales de alerta.
    key_vocabulary:
    - detectar
    - señal
    - alerta
    - practicar
    prior_knowledge: Sabe por qué una inversión de 'cero riesgo' merece sospecha (tema anterior).
    parent_check: "¿{{name}} puede detectar, en un mensaje nuevo, al menos una señal de alerta de dinero rápido?"
    fact_refs: []
    lessons:
    - position: 1
      slug: cinco-mensajes-del-muelle
      micro_objective: Observar cinco mensajes distintos del muelle, algunos con señales de alerta de dinero rápido y otros sin ellas.
      narrative_beat: Zara Vex reúne cinco mensajes distintos del muelle y los coloca frente a Liruf para que los revise con cuidado.
      difficulty: 2
      suggested_families:
      - story
      - analyze
    - position: 2
      slug: marcar-las-senales-de-alerta
      micro_objective: Marcar, en cada uno de los cinco mensajes, las señales de alerta de dinero rápido que encuentre.
      narrative_beat: Liruf revisa cada uno de los cinco mensajes, marcando las señales de alerta de dinero rápido que va encontrando.
      difficulty: 3
      suggested_families:
      - analyze
      - arrange
    - position: 3
      slug: explicar-por-que-cada-senal-cuenta
      micro_objective: Explicar, para al menos dos mensajes, por qué la señal encontrada indica una posible promesa de dinero rápido.
      narrative_beat: Dr. Rho pide a Dina explicar, para dos de los mensajes, por qué la señal que encontró indica una posible promesa de dinero rápido.
      difficulty: 3
      suggested_families:
      - choice
      - analyze
    - position: 4
      slug: mi-deteccion-completa-de-cinco-mensajes
      micro_objective: Aplicar con seguridad, sin ayuda, la detección completa de señales de alerta en los cinco mensajes del muelle.
      narrative_beat: Dina revisa sola, sin ayuda de Dr. Rho, los cinco mensajes completos y explica sus conclusiones a Zara Vex.
      difficulty: 3
      suggested_families:
      - analyze
      - choice
  - position: 8
    slug: mi-primera-alerta-de-fraude
    title_es: Aplicar mi primera alerta de fraude
    concept: Aplicar lo aprendido para reconocer una promesa sospechosa nueva junta todo lo aprendido en la saga sobre dinero rápido.
    learning_objective: Al final, el niño puede reconocer, en una situación nueva, una promesa sospechosa de dinero rápido y explicar por qué.
    key_vocabulary:
    - reconocer
    - sospechosa
    - explicar
    - aplicar
    prior_knowledge: Ha practicado detectar promesas de dinero rápido en varios mensajes (tema anterior).
    parent_check: "¿{{name}} puede reconocer, en una situación nueva, una promesa sospechosa de dinero rápido y explicarte por qué?"
    fact_refs: []
    lessons:
    - position: 1
      slug: un-desconocido-le-escribe-a-liruf
      micro_objective: Observar un mensaje nuevo de un desconocido que le escribe a Liruf con una promesa de dinero rápido.
      narrative_beat: Un desconocido le escribe a Liruf en el muelle, prometiéndole dinero rápido si invierte de inmediato.
      difficulty: 2
      suggested_families:
      - story
      - choice
    - position: 2
      slug: revisar-las-senales-antes-de-responder
      micro_objective: Revisar el mensaje nuevo buscando las señales de alerta aprendidas en la saga antes de responder.
      narrative_beat: Zara Vex reta a Liruf a revisar el mensaje del desconocido, buscando todas las señales de alerta aprendidas en esta saga.
      difficulty: 3
      suggested_families:
      - analyze
      - choice
    - position: 3
      slug: explicar-mi-conclusion-con-razones
      micro_objective: Explicar, con al menos dos razones concretas, por qué el mensaje del desconocido parece sospechoso.
      narrative_beat: Liruf explica a Dr. Rho, con dos razones concretas, por qué el mensaje del desconocido le parece sospechoso.
      difficulty: 3
      suggested_families:
      - choice
      - story
    - position: 4
      slug: mi-decision-final-de-la-saga
      micro_objective: Decidir, con seguridad y sin ayuda, cómo actuar frente al mensaje sospechoso del desconocido.
      narrative_beat: Dina decide, sin ayuda de Dr. Rho, no responder al mensaje del desconocido y avisar del caso a Zara Vex.
      difficulty: 3
      suggested_families:
      - storyplay
      - choice
  - position: 9
    slug: el-cofre-del-repaso
    kind: review_spaced
    title_es: El Cofre del Repaso
    concept: Zara Vex abre un cofre de señales del faro para poner a prueba, sin enseñar nada nuevo, todo lo aprendido en la saga Promesas de Dinero Rápido.
    learning_objective: Al final, el niño puede recordar y aplicar, sin ayuda nueva, los conceptos principales de la saga Promesas de Dinero Rápido.
    key_vocabulary:
    - promesa
    - rápido
    - garantizar
    - riesgo
    prior_knowledge: Ha completado los ocho temas de la saga Promesas de Dinero Rápido (aventura 7, saga 1).
    fact_refs: []
    review_of:
    - el-faro-de-los-fraudes/promesas-de-dinero-rapido/dinero-rapido-sin-esfuerzo
    - el-faro-de-los-fraudes/promesas-de-dinero-rapido/si-suena-demasiado-bueno
    - el-faro-de-los-fraudes/promesas-de-dinero-rapido/nadie-garantiza-ganar-siempre
    - el-faro-de-los-fraudes/promesas-de-dinero-rapido/quien-se-beneficia-de-la-promesa
    - el-faro-de-los-fraudes/promesas-de-dinero-rapido/la-promesa-sin-riesgo-no-existe
    - el-faro-de-los-fraudes/promesas-de-dinero-rapido/practicar-detectar-la-promesa-rapida
    lessons:
    - position: 1
      slug: el-cofre-de-alertas-se-abre
      micro_objective: Recordar, sin ayuda nueva, por qué una promesa de dinero rápido sin esfuerzo es una señal de alerta.
      narrative_beat: Zara Vex abre un cofre de señales del faro y reta a Dina a recordar, tarjeta por tarjeta, lo primero que aprendió en esta saga.
      difficulty: 1
      suggested_families:
      - story
      - choice
    - position: 2
      slug: recordar-en-orden-las-promesas
      micro_objective: Recordar y ordenar de nuevo el dicho 'demasiado bueno para ser verdad' y por qué nadie garantiza ganar siempre.
      narrative_beat: Liruf saca del cofre las tarjetas mezcladas de la saga y las ordena de memoria, sin que Zara Vex le dé ninguna pista nueva.
      difficulty: 1
      suggested_families:
      - arrange
      - choice
    - position: 3
      slug: aplicar-lo-guardado-de-las-promesas
      micro_objective: Aplicar de nuevo, en una escena distinta, lo aprendido sobre preguntar quién se beneficia de una promesa.
      narrative_beat: Dr. Rho presenta una escena nueva del muelle y pregunta a Dina si recuerda, sin repasar la lección, qué haría en ese caso.
      difficulty: 2
      suggested_families:
      - choice
      - analyze
    - position: 4
