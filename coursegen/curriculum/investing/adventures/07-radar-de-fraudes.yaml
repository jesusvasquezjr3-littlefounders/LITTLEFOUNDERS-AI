schema_version: 1

adventure:
  position: 7
  slug: radar-de-fraudes
  theme: cosmos
  age_tier: tier4
  title:
    en-US: "Fraud Radar"
    es-MX: "Radar de Fraudes"
    pt-BR: "Radar de Fraudes"
  description:
    en-US: "At the Listening Post, four signal-watchers learn to tell a real opportunity from a fake distress call designed to lure you in - guaranteed profit, pressure to decide now, needing to recruit others, and money nobody can explain."
    es-MX: "En el Puesto de Escucha, cuatro vigías de señales aprenden a distinguir una oportunidad real de una señal falsa diseñada para atraerte - ganancia garantizada, presión para decidir ya, necesitar reclutar a otros, y dinero que nadie puede explicar de dónde sale."
    pt-BR: "No Posto de Escuta, quatro vigias de sinais aprendem a distinguir uma oportunidade real de um sinal falso projetado para atrair - lucro garantido, pressao para decidir agora, precisar recrutar outros, e dinheiro que ninguem consegue explicar de onde vem."
  narrative_arc: "Dina, Liruf, Rho y Zara operan el Puesto de Escucha, una estación que filtra señales reales de señales falsas diseñadas para atraer naves a una trampa. Aprenden, una por una, las cuatro señales de alerta de un fraude de inversión: la promesa de ganancia garantizada, la presión para decidir de inmediato, la necesidad de reclutar a más gente para ganar, y el dinero que nadie puede explicar de dónde sale. Estudian a fondo los esquemas piramidales y Ponzi para entender por qué SIEMPRE colapsan y NUNCA son una oportunidad real, sin importar cómo se presenten. Terminan armando su radar personal completo con las cuatro señales y aprendiendo el paso más importante de todos: no participar, y contárselo a un adulto de confianza."

sagas:
  - position: 1
    slug: la-primera-senal-ganancia-garantizada
    icon: gpp_maybe
    title:
      en-US: "The First Signal: Guaranteed Profit"
      es-MX: "La Primera Señal: Ganancia Garantizada"
      pt-BR: "O Primeiro Sinal: Lucro Garantido"
    description:
      en-US: "No real investment can promise a fixed, guaranteed return no matter what - everything that really grows carries some risk."
      es-MX: "Ninguna inversión real puede prometer una ganancia fija y garantizada sin importar lo que pase - todo lo que crece de verdad tiene algo de riesgo."
      pt-BR: "Nenhum investimento real pode prometer um retorno fixo e garantido, aconteca o que acontecer - tudo que realmente cresce carrega algum risco."
    topics:
        - position: 1
          slug: nada-es-garantizado-de-verdad
          title_es: "Nada es garantizado de verdad"
          concept: "Ninguna inversión real puede prometer una ganancia fija y garantizada sin importar lo que pase - todo lo que crece de verdad tiene algo de riesgo."
          learning_objective: "El aprendiz reconoce que ninguna inversión real puede garantizar una ganancia fija sin ningún riesgo."
          key_vocabulary: [garantizado, ganancia fija, riesgo]
          prior_knowledge: "Ninguno - es el punto de partida de esta aventura."
          fact_refs: []
          parent_check: "Preguntale a {{name}} si cree que existe alguna inversión que garantice ganar dinero siempre, sin ningún riesgo."
          lessons:
            - position: 1
              slug: la-senal-que-no-cuadra
              micro_objective: "Reconoce que ninguna inversión real puede prometer una ganancia fija y garantizada sin importar lo que pase."
              narrative_beat: "Rho revisa una señal en el Puesto de Escucha: promete 'ganancia garantizada, pase lo que pase' - algo no cuadra, ninguna inversión real puede prometer eso."
              difficulty: 1
              suggested_families: [story, choice]
            - position: 2
              slug: explico-por-que-nada-es-garantizado
              micro_objective: "Explica, con sus palabras, por qué ninguna inversión real puede garantizar una ganancia fija sin ningún riesgo."
              narrative_beat: "Liruf explica con sus palabras por qué toda inversión real tiene algo de riesgo, y por qué 'garantizado' debería sonar extraño."
              difficulty: 2
              suggested_families: [choice, analyze]
        - position: 2
