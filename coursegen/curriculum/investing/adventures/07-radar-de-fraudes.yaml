          learning_objective: "El aprendiz reconoce e identifica frases de garantía total como la primera señal de alerta, distinguiéndolas de mensajes honestos."
          key_vocabulary: [frase de alerta, señal 1]
          prior_knowledge: "Reconoce que ninguna inversión real garantiza una ganancia fija (tema anterior)."
          fact_refs: [fraud.red_flags_list]
