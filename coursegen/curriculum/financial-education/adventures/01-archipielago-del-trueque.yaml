schema_version: 1

adventure:
  position: 1
  slug: archipielago-del-trueque
  theme: archipelago
  age_tier: tier1
  title:
    en-US: "The Archipelago of Trade"
    es-MX: "El Archipiélago del Trueque"
    pt-BR: "O Arquipélago da Troca"
  description:
    en-US: "Sail between tiny islands to discover what wants are, why trading things is tricky, and how coins were born."
    es-MX: "Navega entre islitas para descubrir qué son los deseos, por qué cambiar cosas es difícil y cómo nacieron las monedas."
    pt-BR: "Navegue entre ilhotas para descobrir o que são desejos, por que trocar coisas é difícil e como nasceram as moedas."
  narrative_arc: "Dina, Dino, Rho y Zara llegan a un archipiélago donde cada isla tiene solo una cosa especial. Al principio intentan cambiar sus tesoros directamente y descubren que no siempre encuentran a alguien que quiera justo lo que ellos ofrecen. Juntos inventan — y luego adoptan — las monedas como una forma más fácil de cambiar cosas con todos los isleños."

sagas:
  - position: 1
    slug: islas-de-los-deseos
    icon: waves
    title:
      en-US: "The Islands of Wishes"
      es-MX: "Las Islas de los Deseos"
      pt-BR: "As Ilhas dos Desejos"
    description:
      en-US: "Every islander wants something different — the first step to understanding money."
      es-MX: "Cada isleño quiere algo distinto: el primer paso para entender el dinero."
      pt-BR: "Cada habitante da ilha quer algo diferente: o primeiro passo para entender o dinheiro."
    topics:
      - position: 1
        slug: cosas-que-quiero
        title_es: "Cosas que quiero"
        concept: "Cada persona tiene cosas que le gustaría tener o hacer: eso se llama un deseo."
        learning_objective: "Al final, el niño puede nombrar cosas que quiere y distinguirlas de lo que ya tiene."
        key_vocabulary: [querer, deseo, me gusta, tener]
        prior_knowledge: "Ninguno — es el punto de partida del curso."
        fact_refs: []
        parent_check: "La próxima vez que estén en la tienda, pregúntale a {{name}} si eso que pide de verdad lo quiere o si ya tiene algo parecido en casa."
        lessons:
          - position: 1
            slug: mi-primer-deseo
            micro_objective: "Nombra 3 cosas que le gustaría tener usando la palabra 'quiero'."
            narrative_beat: "Dina llega a la primera isla y abre su cofre de deseos: una concha, una pluma y una fruta dulce."
            difficulty: 1
            suggested_families: [story, choice]
          - position: 2
            slug: quiero-o-ya-tengo
            micro_objective: "Distingue, entre 4 tarjetas, cuáles muestran algo que 'quiero' y cuáles algo que ya tiene."
            narrative_beat: "Dino salta entre rocas señalando cosas que quiere y cosas que ya carga en su mochila."
            difficulty: 1
            suggested_families: [choice]
          - position: 3
            slug: por-que-lo-quiero
            micro_objective: "Explica en una frase corta por qué eligió su deseo favorito."
            narrative_beat: "Rho investiga con su lupa cuál deseo parece más importante para cada isleño."
            difficulty: 1
            suggested_families: [choice, story]
          - position: 4
            slug: mi-lista-de-deseos
            micro_objective: "Ordena 3 deseos propios del que más al que menos le importa hoy."
            narrative_beat: "Zara dibuja su lista de deseos en el mapa de la isla antes de zarpar."
            difficulty: 2
            suggested_families: [arrange, choice]
      - position: 2
        slug: no-todos-queremos-lo-mismo
        title_es: "No todos queremos lo mismo"
        concept: "Dos personas pueden querer cosas muy distintas, y eso está bien."
        learning_objective: "Al final, el niño puede reconocer que los deseos de otra persona pueden ser diferentes a los suyos."
        key_vocabulary: [diferente, igual, preferir, cada quien]
        prior_knowledge: "Sabe nombrar sus propios deseos (tema anterior)."
        fact_refs: []
        parent_check: "Cuando {{name}} juegue con un amigo que prefiere otro juguete o sabor, fíjate si acepta con calma que el otro quiera algo distinto."
        lessons:
          - position: 1
            slug: dos-islenos-dos-deseos
            micro_objective: "Identifica el deseo de un personaje distinto al propio en una escena corta."
            narrative_beat: "Dino cuenta que quiere una fruta, pero su vecino isleño quiere una concha brillante."
            difficulty: 1
            suggested_families: [story, choice]
          - position: 2
            slug: a-cada-quien-lo-suyo
            micro_objective: "Empareja 4 personajes con el deseo que cada uno mencionó."
            narrative_beat: "Rho hace una ronda de preguntas por la isla y anota qué quiere cada isleño."
            difficulty: 1
            suggested_families: [arrange]
          - position: 3
            slug: mismo-deseo-distinta-razon
            micro_objective: "Elige entre dos razones distintas por las que dos niños quieren la misma fruta."
            narrative_beat: "Zara nota que dos isleños quieren la misma fruta, pero uno tiene hambre y el otro la colecciona."
            difficulty: 2
            suggested_families: [choice, story]
          - position: 4
            slug: respeto-por-lo-que-otros-quieren
            micro_objective: "Elige la respuesta amable cuando el deseo de otro es distinto al suyo."
            narrative_beat: "Dina reúne al grupo para celebrar que cada quien tiene su propio tesoro favorito."
            difficulty: 2
            suggested_families: [storyplay, choice]
      - position: 3
        slug: solo-tengo-una-cosa-a-la-vez
        title_es: "Solo tengo una cosa a la vez"
        concept: "No siempre puedo tener todo lo que quiero al mismo tiempo; a veces hay que elegir."
        learning_objective: "Al final, el niño puede elegir una cosa entre varias que quiere, aceptando que las demás esperan."
        key_vocabulary: [elegir, esperar, una cosa, después]
        prior_knowledge: "Reconoce que los deseos varían entre personas (tema anterior)."
        fact_refs: []
        parent_check: "En la próxima tiendita o feria, deja que {{name}} elija solo un antojo entre varios y observa si acepta esperar por los demás sin berrinche."
        lessons:
          - position: 1
            slug: no-puedo-llevarme-todo
            micro_objective: "Observa una escena y señala por qué el personaje solo puede llevarse un tesoro."
            narrative_beat: "Rho encuentra tres tesoros en una cueva pero su bolsa solo tiene espacio para uno."
            difficulty: 1
            suggested_families: [story, choice]
          - position: 2
            slug: elijo-uno-entre-varios
            micro_objective: "Elige un objeto entre 3 opciones y justifica su elección con una palabra."
            narrative_beat: "Zara mira tres conchas de colores y debe quedarse con una sola para el viaje."
            difficulty: 1
            suggested_families: [choice]
          - position: 3
            slug: lo-que-dejo-para-despues
            micro_objective: "Distingue entre 'lo elijo ahora' y 'lo espero para después' en 4 escenarios."
            narrative_beat: "Dina guarda su segunda opción en un mapa de 'tesoros para otro día'."
            difficulty: 2
            suggested_families: [choice, arrange]
          - position: 4
            slug: elegir-sin-tristeza
            micro_objective: "Elige la reacción de calma cuando no puede tener las dos cosas que quiere."
            narrative_beat: "Dino se pone un poquito triste por no llevarse las dos frutas, y Dina le recuerda que puede volver mañana."
            difficulty: 2
            suggested_families: [storyplay, choice]
      - position: 4
        slug: cambiar-es-una-idea
        title_es: "Cambiar es una idea"
        concept: "Puedo dar algo mío a otra persona a cambio de algo que ella tiene: eso es un cambio o trueque."
        learning_objective: "Al final, el niño puede describir un trueque simple entre dos personajes."
        key_vocabulary: [cambiar, trueque, dar, recibir]
        prior_knowledge: "Sabe elegir entre varias cosas que quiere (tema anterior)."
        fact_refs: []
        parent_check: "Invita a {{name}} a cambiar un juguete o estampita con un hermano o amigo y pídele que después te cuente qué dio y qué recibió."
        lessons:
          - position: 1
            slug: te-doy-esto-por-eso
            micro_objective: "Describe con una frase un trueque simple entre dos personajes."
            narrative_beat: "Zara le ofrece su pluma a Dino a cambio de su fruta dulce."
            difficulty: 1
            suggested_families: [story, choice]
          - position: 2
            slug: identifico-un-trueque
            micro_objective: "Reconoce, entre 4 escenas, cuáles muestran un trueque y cuáles no."
            narrative_beat: "Dina observa distintas islas y anota en cuáles los isleños están cambiando cosas."
            difficulty: 1
            suggested_families: [choice]
          - position: 3
            slug: armo-mi-propio-trueque
            micro_objective: "Empareja 3 objetos propios con 3 objetos ajenos formando trueques válidos."
            narrative_beat: "Rho arma un tablero de trueques con los tesoros de toda la tripulación."
            difficulty: 2
            suggested_families: [arrange]
          - position: 4
            slug: mi-primer-cambio-feliz
            micro_objective: "Completa un trueque en la historia y explica si quedó contento con el resultado."
            narrative_beat: "Dino cambia su concha por la fruta que tanto quería y celebra con un salto."
            difficulty: 2
            suggested_families: [storyplay, choice]
      - position: 5
        slug: es-un-buen-cambio
        title_es: "¿Es un buen cambio?"
        concept: "Un buen trueque deja contentas a las dos personas; si solo una queda feliz, algo anda mal."
        learning_objective: "Al final, el niño puede juzgar si un trueque parece justo para ambas partes."
        key_vocabulary: [justo, contento, buen cambio, las dos partes]
        prior_knowledge: "Sabe describir y armar un trueque simple (tema anterior)."
        fact_refs: []
        parent_check: "Después de que {{name}} cambie algo con un amigo, pregúntale si los dos quedaron contentos o si alguien se ve triste con el resultado."
        lessons:
          - position: 1
            slug: los-dos-quedan-contentos
            micro_objective: "Señala en una escena si ambos personajes se ven contentos tras el trueque."
            narrative_beat: "Dina cambia su fruta por una concha y ambas caras en la isla se ven sonrientes."
            difficulty: 1
            suggested_families: [story, choice]
          - position: 2
            slug: uno-quedo-triste
            micro_objective: "Identifica en una escena cuál de los dos personajes no quedó contento con el trueque."
            narrative_beat: "Dino nota que su amigo isleño se quedó triste después de cambiar su tesoro favorito."
            difficulty: 1
            suggested_families: [choice]
          - position: 3
            slug: elijo-el-trueque-justo
            micro_objective: "Elige, entre dos trueques propuestos, el que parece más justo para ambos."
            narrative_beat: "Rho compara dos ofertas de trueque y busca pistas de cuál conviene a los dos isleños."
            difficulty: 2
            suggested_families: [choice, storyplay]
          - position: 4
            slug: propongo-un-trueque-justo
            micro_objective: "Arma un trueque entre dos personajes en el que ambos terminen contentos."
            narrative_beat: "Zara ayuda a dos isleños tímidos a proponerse trueques que dejen a ambos felices."
            difficulty: 2
            suggested_families: [storyplay, choice]
      - position: 6
        slug: el-problema-del-trueque
        title_es: "El problema del trueque"
        concept: "A veces quiero lo que otro tiene, pero él no quiere lo que yo le ofrezco: el trueque se traba."
        learning_objective: "Al final, el niño puede explicar por qué un trueque puede fallar cuando nadie quiere lo que el otro ofrece."
        key_vocabulary: [no quiere, se traba, no funciona, buscar otro]
        prior_knowledge: "Sabe juzgar si un trueque es justo (tema anterior)."
        fact_refs: []
        parent_check: "Plantéale a {{name}} que quiere cambiar su paleta por el carrito de un amigo, pero ese amigo no quiere paletas: ¿logra explicar por qué el cambio no puede hacerse?"
        lessons:
          - position: 1
            slug: nadie-quiere-mi-concha
            micro_objective: "Reconoce en la historia por qué un trueque no se pudo completar."
            narrative_beat: "Dina ofrece su concha por un pez, pero el pescador solo quiere fruta, no conchas."
            difficulty: 1
            suggested_families: [story, choice]
          - position: 2
            slug: busco-a-alguien-mas
            micro_objective: "Elige, entre 3 isleños, cuál sí podría querer el objeto ofrecido."
            narrative_beat: "Dino recorre la isla buscando a alguien que sí quiera cambiar su concha por algo."
            difficulty: 1
            suggested_families: [choice]
          - position: 3
            slug: muchos-pasos-para-un-trueque
            micro_objective: "Ordena los pasos de una cadena de 3 trueques necesarios para conseguir lo que quería al inicio."
            narrative_beat: "Rho descubre que Zara necesitó tres cambios distintos antes de conseguir el pez que quería."
            difficulty: 2
            suggested_families: [arrange, story]
          - position: 4
            slug: el-trueque-cansa
            micro_objective: "Explica en una frase por qué hacer muchos trueques seguidos es cansado."
            narrative_beat: "Toda la tripulación se sienta agotada tras un día de trueques que no salieron a la primera."
            difficulty: 3
            suggested_families: [story, choice]
      - position: 7
        slug: cofre-del-repaso-de-los-deseos
        title_es: "El Cofre del Repaso de los Deseos"
        concept: "Antes de zarpar a la siguiente isla, la tripulación abre el cofre de recuerdos y repasa todo lo aprendido sobre los deseos y el trueque."
        learning_objective: "Al final, el niño recuerda y usa, sin nueva enseñanza, los conceptos de deseo, elección y trueque justo de esta saga."
        key_vocabulary: [deseo, elegir, trueque, contento]
        prior_knowledge: "Completó los 6 temas de Las Islas de los Deseos."
        fact_refs: []
        kind: review_spaced
        review_of:
          - archipielago-del-trueque/islas-de-los-deseos/cosas-que-quiero
          - archipielago-del-trueque/islas-de-los-deseos/no-todos-queremos-lo-mismo
          - archipielago-del-trueque/islas-de-los-deseos/solo-tengo-una-cosa-a-la-vez
          - archipielago-del-trueque/islas-de-los-deseos/cambiar-es-una-idea
          - archipielago-del-trueque/islas-de-los-deseos/es-un-buen-cambio
          - archipielago-del-trueque/islas-de-los-deseos/el-problema-del-trueque
        lessons:
          - position: 1
            slug: abro-el-cofre-de-deseos
            micro_objective: "Recuerda y nombra, sin ayuda, un deseo propio usando lo aprendido en esta saga."
            narrative_beat: "Rho encuentra un cofre de madera tallado y, al abrirlo, aparecen recuerdos de todos los deseos de la tripulación."
            difficulty: 1
            suggested_families: [story, choice]
          - position: 2
            slug: recuerdo-mi-trueque-favorito
            micro_objective: "Recuerda y describe, sin ayuda, un trueque simple ya vivido en la saga."
            narrative_beat: "Zara saca del cofre una conchita y recuerda el trueque que hizo con ella al principio del viaje."
            difficulty: 1
            suggested_families: [story, choice]
          - position: 3
            slug: elijo-el-trueque-mas-justo-del-cofre
            micro_objective: "Elige, entre 2 trueques recordados del cofre, cuál fue el más justo para ambas partes."
            narrative_beat: "Dino compara dos recuerdos guardados en el cofre y decide cuál trueque dejó más contentos a los dos isleños."
            difficulty: 2
            suggested_families: [choice, storyplay]
          - position: 4
            slug: cierro-el-cofre-listo-para-seguir
            micro_objective: "Aplica sin ayuda lo recordado: elige la mejor reacción cuando un deseo no se puede cumplir de inmediato."
            narrative_beat: "Dina cierra el cofre de recuerdos: la tripulación está lista para seguir explorando el archipiélago."
            difficulty: 2
            suggested_families: [storyplay, choice]
      - position: 8
        slug: reto-entrelazado-de-los-deseos
        title_es: "Reto Entrelazado de los Deseos"
        concept: "Mezclamos ideas de distintos momentos de esta saga para pensarlas juntas, como un verdadero reto de isleño experto."
        learning_objective: "Al final, el niño combina, sin nueva enseñanza, ideas de al menos dos temas distintos de esta saga en una sola actividad."
        key_vocabulary: [deseo, trueque, justo, elegir]
        prior_knowledge: "Completó El Cofre del Repaso de los Deseos (tema anterior)."
        fact_refs: []
        kind: review_interleaved
        review_of:
          - archipielago-del-trueque/islas-de-los-deseos/cosas-que-quiero
          - archipielago-del-trueque/islas-de-los-deseos/no-todos-queremos-lo-mismo
          - archipielago-del-trueque/islas-de-los-deseos/es-un-buen-cambio
          - archipielago-del-trueque/islas-de-los-deseos/el-problema-del-trueque
        lessons:
          - position: 1
            slug: deseo-y-trueque-en-la-misma-escena
            micro_objective: "Combina, en una sola escena, el deseo de un personaje y el trueque que hizo para conseguirlo."
            narrative_beat: "Rho arma una escena mezclando el deseo inicial de Dino con el trueque que finalmente hizo para lograrlo."
            difficulty: 2
            suggested_families: [story, choice]
          - position: 2
            slug: dos-islenos-dos-trueques-distintos
            micro_objective: "Compara el deseo y el trueque de dos isleños distintos, aplicando ambos temas a la vez."
            narrative_beat: "Zara compara dos isleños del archipiélago: cada uno tuvo un deseo distinto y resolvió un trueque distinto."
            difficulty: 2
            suggested_families: [choice, arrange]
          - position: 3
            slug: cuando-un-trueque-no-cumple-el-deseo
            micro_objective: "Reconoce, combinando deseo y trueque trabado, por qué un cambio fallido deja un deseo sin cumplir."
            narrative_beat: "Dino recuerda cuando nadie quería su concha y su deseo de comer fruta tuvo que esperar."
            difficulty: 2
            suggested_families: [story, choice]
          - position: 4
            slug: armo-un-trueque-justo-para-mi-deseo
            micro_objective: "Arma, sin ayuda, un trueque justo que cumpla un deseo propio, combinando ambas ideas de la saga."
            narrative_beat: "Dina cierra el reto entrelazado logrando un trueque justo que por fin cumple su deseo inicial."
            difficulty: 2
            suggested_families: [storyplay, choice]

  - position: 2
    slug: nace-el-dinero
    icon: token
    title:
      en-US: "Money Is Born"
      es-MX: "Nace el Dinero"
      pt-BR: "O Dinheiro Nasce"
    description:
      en-US: "The crew invents something everyone accepts — and trading gets a lot easier."
      es-MX: "La tripulación inventa algo que todos aceptan, y cambiar cosas se vuelve mucho más fácil."
      pt-BR: "A tripulação inventa algo que todos aceitam, e trocar coisas fica muito mais fácil."
    topics:
      - position: 1
        slug: algo-que-todos-aceptan
        title_es: "Algo que todos aceptan"
        concept: "Si todos están de acuerdo en aceptar la misma cosa a cambio, cambiar se vuelve fácil para todos."
        learning_objective: "Al final, el niño puede explicar con sus palabras la idea de 'algo que todos aceptan'."
        key_vocabulary: [todos aceptan, de acuerdo, fácil, para todos]
        prior_knowledge: "Entiende por qué un trueque puede trabarse (saga anterior)."
        fact_refs: []
        parent_check: "Pregúntale a {{name}} por qué cree que en la tienda todos aceptan las mismas monedas, en vez de que cada quien pida algo distinto a cambio."
        lessons:
          - position: 1
            slug: y-si-todos-aceptaran-lo-mismo
            micro_objective: "Repite con sus palabras la idea de tener algo que todos acepten a cambio."
            narrative_beat: "Rho reúne a toda la isla y pregunta: ¿qué pasaría si todos aceptáramos la misma cosita a cambio?"
            difficulty: 1
            suggested_families: [story, choice]
          - position: 2
            slug: elijo-lo-que-todos-quieren
            micro_objective: "Elige, entre 3 objetos, cuál parece que la mayoría de la isla aceptaría."
            narrative_beat: "Zara pregunta a varios isleños qué objeto les gustaría recibir siempre a cambio."
            difficulty: 1
            suggested_families: [choice]
          - position: 3
            slug: comparo-antes-y-despues
            micro_objective: "Compara una escena de trueque difícil con una escena donde todos usan lo mismo."
            narrative_beat: "Dina muestra dos dibujos: uno de trueques trabados y otro de cambios rápidos y felices."
            difficulty: 2
            suggested_families: [choice, story]
          - position: 4
            slug: mi-idea-para-la-isla
            micro_objective: "Propone en una frase un objeto que la isla entera podría aceptar."
            narrative_beat: "Dino junta a la tripulación para votar su primera idea de 'algo para todos'."
            difficulty: 2
            suggested_families: [storyplay, choice]
      - position: 2
        slug: de-conchas-a-monedas
        title_es: "De conchas a monedas"
        concept: "Antes de las monedas de metal, la gente usó conchas, semillas y piedritas especiales para cambiar cosas."
        learning_objective: "Al final, el niño puede nombrar un objeto antiguo que se usó como el dinero de hoy."
        key_vocabulary: [conchas, semillas, antes, hoy]
        prior_knowledge: "Entiende la idea de algo que todos aceptan (tema anterior)."
        fact_refs: []
        parent_check: "Pídele a {{name}} que te cuente, como en el cuento, qué usaba la gente antes de tener monedas para cambiar cosas."
        lessons:
          - position: 1
            slug: las-conchas-especiales
            micro_objective: "Reconoce en la historia qué objeto usaba antes la isla como su 'algo especial'."
            narrative_beat: "Rho encuentra un cofre viejo lleno de conchas brillantes que los abuelos isleños usaban para cambiar cosas."
            difficulty: 1
            suggested_families: [story]
          - position: 2
            slug: semillas-que-valen
            micro_objective: "Empareja 3 objetos antiguos con la isla o pueblo que los usaba."
            narrative_beat: "Zara descubre un mapa viejo que muestra semillas especiales usadas en otra isla lejana."
            difficulty: 1
            suggested_families: [arrange, choice]
          - position: 3
            slug: de-lo-antiguo-a-lo-nuevo
            micro_objective: "Ordena en una línea de tiempo simple: conchas, semillas, monedas de metal."
            narrative_beat: "Dina arma con piedritas una línea del tiempo del archipiélago sobre 'cómo cambiábamos cosas antes'."
            difficulty: 2
            suggested_families: [arrange, story]
          - position: 4
            slug: cuento-mi-descubrimiento
            micro_objective: "Explica con una frase por qué las conchas fueron el primer 'dinero' de la isla."
            narrative_beat: "Dino cuenta emocionado a todo el barco lo que Rho descubrió en el cofre viejo."
            difficulty: 2
            suggested_families: [story, choice]
      - position: 3
        slug: por-que-usamos-monedas
        title_es: "Por qué usamos monedas"
        concept: "Las monedas de metal duran mucho, son fáciles de cargar y de contar; por eso son mejores que conchas o semillas."
        learning_objective: "Al final, el niño puede dar una razón de por qué las monedas son prácticas."
        key_vocabulary: [duran, fácil de cargar, fácil de contar, práctico]
        prior_knowledge: "Conoce qué se usaba como dinero antes de las monedas (tema anterior)."
        fact_refs: []
        parent_check: "Muéstrale a {{name}} una moneda junto a una fruta y pregúntale cuál dura más tiempo guardada, y por qué eso importa para cambiar cosas."
        lessons:
