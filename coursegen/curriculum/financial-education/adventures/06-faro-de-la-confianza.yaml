schema_version: 1
adventure:
  position: 6
  slug: faro-de-la-confianza
  theme: archipelago
  age_tier: tier2
  title:
    en-US: The Lighthouse of Trust
    es-MX: El Faro de la Confianza
    pt-BR: O Farol da Confiança
  description:
    en-US: Across a chain of islands, Dina and Liruf learn to spot tricks, fake messages, and keep their
      information safe with help from Dr. Rho's lighthouse.
    es-MX: En un archipiélago de islas, Dina y Liruf aprenden a reconocer trampas, mensajes falsos y a
      cuidar su información con la ayuda del faro de Dr. Rho.
    pt-BR: Em um arquipélago de ilhas, Dina e Liruf aprendem a reconhecer armadilhas, mensagens falsas
      e a cuidar de suas informações com a ajuda do farol do Dr. Rho.
  narrative_arc: 'Dina y Liruf navegan más allá del valle del mercado hasta un archipiélago coronado por
    un viejo faro donde Dr. Rho vigila a los barcos por la noche. Zara Vex llega con trucos y acertijos
    para poner a prueba qué tan bien pueden reconocer una mala oferta, un mensaje falso o un dato compartido
    sin cuidado, enseñándoles el verdadero trabajo del faro: cuidar la confianza, no solo guiar barcos.'
sagas:
- position: 1
  slug: anuncios-y-trampas
  icon: campaign
  title:
    en-US: Ads and Traps
    es-MX: Anuncios y Trampas
    pt-BR: Anúncios e Armadilhas
  description:
    en-US: Learn to tell an honest ad apart from a trap that exaggerates or tricks.
    es-MX: Aprende a distinguir un anuncio honesto de una trampa que exagera o engaña.
    pt-BR: Aprenda a distinguir um anúncio honesto de uma armadilha que exagera ou engana.
  topics:
  - position: 1
    slug: que-es-un-anuncio
    title_es: Qué es un anuncio
    concept: Un anuncio es un mensaje que busca convencerte de comprar o hacer algo, y reconocerlo es
      el primer paso para pensar antes de actuar.
    learning_objective: Al final, el niño puede identificar cuándo un mensaje es un anuncio publicitario.
    key_vocabulary:
    - anuncio
    - publicidad
    - convencer
    - mensaje
    prior_knowledge: Ha comprado y vendido en el mercado del valle (aventura 5).
    parent_check: "¿{{name}} puede reconocer cuándo un mensaje está tratando de convencerlo de comprar algo?"
    fact_refs: []
    lessons:
    - position: 1
      slug: las-islas-del-faro
      micro_objective: Reconocer que un anuncio es un mensaje diseñado para convencer a alguien de comprar.
      narrative_beat: Dina y Liruf llegan en barco a un archipiélago donde un faro brillante guía a los
        navegantes; Dr. Rho los recibe y les muestra carteles coloridos pegados en el muelle.
      difficulty: 1
      suggested_families:
      - story
      - choice
    - position: 2
      slug: anuncio-o-no
      micro_objective: Distinguir un anuncio de un mensaje informativo neutral.
      narrative_beat: Zara Vex reparte volantes del muelle y reta a Liruf a separar cuáles son anuncios
        y cuáles son simples avisos del pueblo.
      difficulty: 2
      suggested_families:
      - choice
      - analyze
    - position: 3
      slug: donde-aparecen-los-anuncios
      micro_objective: Identificar distintos lugares donde puede aparecer un anuncio.
      narrative_beat: Dr. Rho señala anuncios en carteles, en el periódico del pueblo y hasta pintados
        en un barco de pesca.
      difficulty: 2
      suggested_families:
      - story
      - choice
    - position: 4
      slug: mi-primer-anuncio-detectado
      micro_objective: Detectar, en una escena nueva, todos los anuncios presentes entre varios mensajes.
      narrative_beat: Antes de subir al faro, Dina encuentra tres mensajes distintos en el muelle y separa
        cuáles quieren venderle algo.
      difficulty: 3
      suggested_families:
      - analyze
      - choice
  - position: 2
    slug: verdad-o-exageracion
    title_es: Anuncios que dicen la verdad vs. que exageran
    concept: Algunos anuncios describen el producto tal como es, y otros exageran para que parezca mejor
      de lo que realmente es.
    learning_objective: Al final, el niño puede distinguir un anuncio honesto de uno que exagera.
    key_vocabulary:
    - verdad
    - exagerar
    - honesto
    - real
    prior_knowledge: Reconoce qué es un anuncio (tema anterior).
    parent_check: "Si le muestras un anuncio, ¿{{name}} puede decir si describe el producto tal cual es o si exagera?"
    fact_refs: []
    lessons:
    - position: 1
      slug: el-pescado-mas-grande-del-mundo
      micro_objective: Reconocer una exageración evidente en un anuncio.
      narrative_beat: Un cartel en el muelle promete 'el pescado más grande del mundo' y Liruf se ríe al
        ver que es un pez normal.
      difficulty: 1
      suggested_families:
      - story
      - choice
    - position: 2
      slug: comparar-dos-anuncios
      micro_objective: Comparar dos anuncios del mismo producto y decidir cuál exagera más.
      narrative_beat: Dr. Rho muestra dos anuncios de la misma tienda de velas y pide a Dina identificar
        cuál se acerca más a la realidad.
      difficulty: 2
      suggested_families:
      - analyze
      - choice
    - position: 3
      slug: palabras-que-exageran
      micro_objective: Reconocer palabras típicas de exageración publicitaria (siempre, el mejor, nunca
        falla).
      narrative_beat: Zara Vex enseña a Dina a detectar palabras como 'siempre' o 'el mejor de todos'
        como señal de exageración.
      difficulty: 2
      suggested_families:
      - analyze
      - choice
    - position: 4
      slug: mi-anuncio-honesto
      micro_objective: Elegir, entre varias versiones de un anuncio, la que describe el producto con honestidad.
      narrative_beat: En el taller del faro, Dina ayuda a un vendedor del muelle a reescribir su anuncio
        sin exagerar.
      difficulty: 3
      suggested_families:
      - choice
      - analyze
  - position: 3
    slug: gratis-que-no-es-gratis
    title_es: '''Gratis'' que no es gratis'
    concept: Algunas ofertas dicen 'gratis' pero en realidad piden algo a cambio, como comprar otra cosa
      o dar información.
    learning_objective: Al final, el niño puede identificar cuándo una oferta 'gratis' en realidad tiene
      una condición oculta.
    key_vocabulary:
    - gratis
    - condición
    - oferta
    - a cambio
    prior_knowledge: Distingue anuncios honestos de exagerados (tema anterior).
    parent_check: "¿{{name}} puede encontrar la condición escondida en una oferta que dice 'gratis'?"
    fact_refs: []
    lessons:
    - position: 1
      slug: el-regalo-con-truco
      micro_objective: Reconocer que una oferta 'gratis' puede tener una condición escondida.
      narrative_beat: Un cartel ofrece 'una vela gratis' y Liruf descubre, leyendo con cuidado, que solo
        aplica si compras tres primero.
      difficulty: 1
      suggested_families:
      - story
      - analyze
    - position: 2
      slug: leer-la-letra-pequena
      micro_objective: Buscar la condición escondida en una oferta 'gratis' dada.
      narrative_beat: Dr. Rho enseña a Dina a leer con calma toda la oferta, incluida la parte escrita
        más pequeña.
      difficulty: 2
      suggested_families:
      - analyze
      - choice
    - position: 3
      slug: gratis-de-verdad
      micro_objective: Distinguir una oferta realmente gratis de una que solo lo parece.
      narrative_beat: Zara Vex presenta tres ofertas del muelle y reta a Liruf a decidir cuál es gratis
        de verdad.
      difficulty: 3
      suggested_families:
      - analyze
      - choice
    - position: 4
      slug: decidir-si-me-conviene
      micro_objective: Decidir si una oferta 'gratis' con condición conviene o no, según lo que pide a
        cambio.
      narrative_beat: Con toda la información leída, Dina decide si vale la pena aceptar la oferta del
        vendedor de velas.
      difficulty: 3
      suggested_families:
      - choice
      - analyze
  - position: 4
    slug: trucos-para-que-compres-rapido
    title_es: Trucos para que compres rápido
    concept: Algunos anuncios usan la prisa ('solo hoy', 'quedan pocos') para que decidas comprar sin
      pensarlo bien.
    learning_objective: Al final, el niño puede reconocer un mensaje que usa la prisa para apurar una
      decisión de compra.
    key_vocabulary:
    - prisa
    - apurar
    - pensar
    - esperar
    prior_knowledge: Reconoce ofertas con condiciones ocultas (tema anterior).
    parent_check: "¿{{name}} puede reconocer una frase de apuro, como 'solo hoy', dentro de un anuncio?"
    fact_refs: []
    lessons:
    - position: 1
      slug: solo-hoy
      micro_objective: Reconocer la frase 'solo hoy' como una señal de apuro en un anuncio.
      narrative_beat: Un vendedor grita '¡solo hoy, no lo pienses más!' y Liruf siente el impulso de comprar
        sin mirar bien.
      difficulty: 1
      suggested_families:
      - story
      - choice
    - position: 2
      slug: quedan-pocos
      micro_objective: Identificar otras frases de apuro comunes en anuncios (quedan pocos, se acaba).
      narrative_beat: Dr. Rho recopila frases de apuro escuchadas en el muelle y pide a Dina reconocerlas
        en nuevos anuncios.
      difficulty: 2
      suggested_families:
      - analyze
      - choice
    - position: 3
      slug: pausar-antes-de-decidir
      micro_objective: Aplicar la estrategia de pausar y pensar frente a un anuncio con apuro.
      narrative_beat: 'Zara Vex le muestra a Liruf un truco simple: contar hasta cinco antes de decidir
        cuando un anuncio mete prisa.'
      difficulty: 2
      suggested_families:
      - storyplay
      - choice
    - position: 4
      slug: resistir-el-apuro
      micro_objective: Decidir con calma frente a un anuncio apurado, sin dejarse llevar por la prisa.
      narrative_beat: Frente a un cartel que grita 'última oportunidad', Dina se detiene, respira y decide
        con calma.
      difficulty: 3
      suggested_families:
      - storyplay
      - choice
  - position: 5
    slug: comparar-anuncio-con-realidad
    title_es: Comparar el anuncio con la realidad
    concept: Revisar el producto real junto al anuncio ayuda a ver si lo prometido coincide con lo que
      en verdad ofrece.
    learning_objective: Al final, el niño puede comparar lo que promete un anuncio con las características
      reales del producto.
    key_vocabulary:
    - promesa
    - realidad
    - comparar
    - revisar
    prior_knowledge: Reconoce exageraciones y apuros en anuncios (temas anteriores).
    parent_check: "¿{{name}} puede comparar lo que promete un anuncio con lo que el producto realmente ofrece?"
    fact_refs: []
    lessons:
    - position: 1
      slug: la-vela-del-anuncio
      micro_objective: Observar la diferencia entre lo mostrado en un anuncio y el producto real.
      narrative_beat: El anuncio mostraba una vela enorme y brillante, pero la vela real en la tienda
        es bastante más pequeña.
      difficulty: 1
      suggested_families:
      - story
      - analyze
    - position: 2
      slug: que-promete-y-que-cumple
      micro_objective: Separar, en un ejemplo, qué promete el anuncio y qué cumple realmente el producto.
      narrative_beat: Dr. Rho hace una lista de promesas del anuncio y otra de lo que el producto realmente
        tiene.
      difficulty: 2
      suggested_families:
      - analyze
      - arrange
    - position: 3
      slug: decidir-con-la-comparacion
      micro_objective: Decidir si conviene comprar un producto después de comparar el anuncio con la realidad.
      narrative_beat: Zara Vex pregunta a Dina si aún quiere comprar la vela después de ver la comparación
        completa.
      difficulty: 3
      suggested_families:
      - choice
      - analyze
    - position: 4
      slug: mi-revision-final
      micro_objective: Aplicar el proceso de comparación completo a un anuncio nuevo antes de decidir.
      narrative_beat: Dina practica sola, comparando un nuevo anuncio del muelle con el producto real
        antes de recomendarlo a Liruf.
      difficulty: 3
      suggested_families:
      - analyze
      - choice
  - position: 6
    slug: decir-espera-antes-de-pedir
    title_es: Decir 'espera' antes de pedir algo
    concept: Detenerse a pensar antes de pedir que te compren algo evita decisiones apuradas por un anuncio.
    learning_objective: Al final, el niño puede aplicar la pausa de 'espera y piensa' antes de pedir una
      compra influida por un anuncio.
    key_vocabulary:
    - esperar
    - pensar
    - decidir
    - pedir
    prior_knowledge: Ha practicado comparar anuncios con la realidad (tema anterior).
    parent_check: "Antes de pedir algo que vio en un anuncio, ¿{{name}} se detiene a pensarlo con calma?"
    fact_refs: []
    lessons:
    - position: 1
      slug: las-ganas-de-pedirlo-ya
      micro_objective: Reconocer el momento en que un anuncio genera ganas inmediatas de pedir algo.
      narrative_beat: Liruf ve un anuncio brillante y corre a pedirle a Dr. Rho que se lo compre de inmediato.
      difficulty: 1
      suggested_families:
      - story
      - choice
    - position: 2
      slug: tres-preguntas-antes-de-pedir
      micro_objective: Aplicar tres preguntas simples (¿lo necesito?, ¿es verdad?, ¿puedo esperar?) antes
        de pedir algo.
      narrative_beat: Dr. Rho enseña a Dina tres preguntas rápidas para hacerse antes de pedir cualquier
        cosa vista en un anuncio.
      difficulty: 2
      suggested_families:
      - storyplay
      - choice
    - position: 3
      slug: practicar-la-pausa
      micro_objective: Aplicar la pausa de 'espera y piensa' frente a un anuncio nuevo dentro de una historia.
      narrative_beat: Zara Vex pone a prueba a Liruf con un anuncio muy tentador para ver si recuerda detenerse
        antes de pedir.
      difficulty: 3
      suggested_families:
      - storyplay
      - choice
    - position: 4
      slug: mi-decision-pensada
      micro_objective: Decidir con calma, tras aplicar la pausa completa, si pedir o no una compra anunciada.
      narrative_beat: Frente al anuncio más llamativo del muelle, Dina se detiene, piensa y toma su propia
        decisión sin prisa.
      difficulty: 3
      suggested_families:
      - storyplay
      - analyze
  - position: 7
    slug: presion-de-grupo-y-publicidad
    title_es: Presión de grupo y publicidad
    concept: A veces un anuncio no solo promete algo, sino que además hace sentir que 'todos lo tienen' para que uno también quiera comprarlo.
    learning_objective: Al final, el niño puede reconocer cuándo un anuncio usa la presión de grupo para convencer, y no solo la calidad del producto.
    key_vocabulary:
    - presión
    - grupo
    - pertenecer
    - convencer
    prior_knowledge: Reconoce exageraciones y trucos de apuro en los anuncios (temas anteriores).
    parent_check: "¿{{name}} puede explicarte la diferencia entre querer algo de verdad y quererlo solo porque 'todos lo tienen'?"
    prerequisites:
    - path: mercado-de-los-colores/lo-que-necesito-de-verdad/cosas-que-necesito-para-vivir-bien
      strength: soft
      reason: "Distinguir lo que de verdad necesita de lo que solo desea ayuda a no dejarse llevar por la presión de grupo."
    fact_refs: []
    lessons:
    - position: 1
      slug: todos-lo-tienen-menos-yo
      micro_objective: Reconocer la frase 'todos lo tienen' como una forma de presión, no como un hecho comprobado.
      narrative_beat: Un anuncio en el muelle asegura que 'todos los niños del archipiélago ya tienen este juguete', y Liruf se pregunta si eso es cierto.
      difficulty: 1
      suggested_families:
      - story
      - choice
    - position: 2
      slug: la-diferencia-entre-querer-y-pertenecer
      micro_objective: Distinguir el deseo de encajar en un grupo del valor real de un producto anunciado.
      narrative_beat: Dr. Rho pregunta a Dina si quiere el juguete porque le gusta de verdad, o porque teme quedarse fuera del grupo.
      difficulty: 2
      suggested_families:
      - choice
      - analyze
    - position: 3
      slug: pensar-por-mi-cuenta
      micro_objective: Practicar decidir con calma frente a un anuncio que usa presión de grupo.
      narrative_beat: Zara Vex reta a Liruf a decidir, sin dejarse llevar por lo que 'todos dicen', si de verdad le conviene el producto.
      difficulty: 3
      suggested_families:
      - storyplay
      - choice
    - position: 4
      slug: mi-propia-decision
      micro_objective: Aplicar con seguridad la decisión propia frente a un anuncio nuevo que usa presión de grupo.
      narrative_beat: Frente a un anuncio que promete que 'todo el archipiélago' ya compró algo, Dina decide con calma, pensando solo en lo que ella de verdad necesita.
      difficulty: 3
      suggested_families:
      - choice
      - analyze
  - position: 8
    slug: quien-paga-por-el-anuncio
    title_es: Quién paga por el anuncio
    concept: Algunos mensajes que parecen una recomendación sincera en realidad son publicidad pagada por quien vende el producto.
    learning_objective: Al final, el niño puede reconocer cuándo una recomendación es en realidad un anuncio pagado.
    key_vocabulary:
    - pagado
    - recomendar
    - patrocinado
    - sincero
    prior_knowledge: Sabe comparar lo que promete un anuncio con la realidad (tema anterior).
    parent_check: "¿{{name}} puede reconocer cuándo una recomendación es en realidad un anuncio pagado?"
    fact_refs: []
    lessons:
    - position: 1
      slug: el-pescador-que-recomienda-una-red
      micro_objective: Observar la diferencia entre una recomendación sincera y una pagada por quien vende.
      narrative_beat: Un pescador del muelle recomienda una red de pesca a todos, y Liruf descubre que el vendedor le paga por decirlo.
      difficulty: 1
      suggested_families:
      - story
      - analyze
    - position: 2
      slug: sincero-o-pagado
      micro_objective: Clasificar distintos mensajes entre recomendación sincera y anuncio pagado.
      narrative_beat: Dr. Rho muestra varios mensajes del muelle y pide a Dina separar cuáles son opiniones sinceras y cuáles son pagadas.
      difficulty: 2
      suggested_families:
      - arrange
      - choice
    - position: 3
      slug: por-que-importa-saberlo
      micro_objective: Explicar por qué conviene saber si una recomendación fue pagada antes de confiar en ella.
      narrative_beat: Zara Vex pregunta a Liruf por qué cambia su confianza en un consejo si descubre que alguien le pagó por darlo.
      difficulty: 2
      suggested_families:
      - choice
      - story
    - position: 4
      slug: revisar-quien-habla
      micro_objective: Aplicar la pregunta de quién paga por esto frente a un mensaje nuevo antes de confiar en él.
      narrative_beat: Frente a un nuevo mensaje del muelle, Dina se pregunta primero quién lo pagó antes de decidir si confiar en lo que dice.
      difficulty: 3
      suggested_families:
      - analyze
      - choice
  - position: 9
    slug: el-cofre-del-repaso
    kind: review_spaced
    title_es: El Cofre del Repaso
    concept: Zara Vex abre un cofre de señales del faro para poner a prueba, sin enseñar nada nuevo, todo lo aprendido en la saga Anuncios y Trampas.
    learning_objective: Al final, el niño puede recordar y aplicar, sin ayuda nueva, los conceptos principales de la saga Anuncios y Trampas.
    key_vocabulary:
    - anuncio
    - honesto
    - gratis
    - prisa
    prior_knowledge: Ha completado los seis temas de la saga Anuncios y Trampas (aventura 6, saga 1).
    fact_refs: []
    review_of:
    - faro-de-la-confianza/anuncios-y-trampas/que-es-un-anuncio
    - faro-de-la-confianza/anuncios-y-trampas/verdad-o-exageracion
    - faro-de-la-confianza/anuncios-y-trampas/gratis-que-no-es-gratis
    - faro-de-la-confianza/anuncios-y-trampas/trucos-para-que-compres-rapido
    - faro-de-la-confianza/anuncios-y-trampas/comparar-anuncio-con-realidad
    - faro-de-la-confianza/anuncios-y-trampas/decir-espera-antes-de-pedir
    - faro-de-la-confianza/anuncios-y-trampas/presion-de-grupo-y-publicidad
    - faro-de-la-confianza/anuncios-y-trampas/quien-paga-por-el-anuncio
    lessons:
    - position: 1
      slug: el-cofre-se-abre
      micro_objective: Recordar, sin ayuda nueva, cómo reconocer que un anuncio busca convencer y cómo distinguir un anuncio honesto de uno que exagera.
      narrative_beat: Zara Vex abre un cofre de señales del faro y reta a Dina a recordar, tarjeta por tarjeta, lo primero que aprendió en esta saga.
      difficulty: 1
      suggested_families:
      - story
      - choice
    - position: 2
      slug: recordar-en-orden
      micro_objective: Recordar y ordenar de nuevo cómo reconocer una condición oculta en una oferta gratis y cómo reconocer frases de apuro en un anuncio.
      narrative_beat: Liruf saca del cofre las tarjetas mezcladas de la saga y las ordena de memoria, sin que Dr. Rho le dé ninguna pista nueva.
      difficulty: 1
      suggested_families:
      - arrange
      - choice
    - position: 3
      slug: aplicar-lo-guardado
      micro_objective: Aplicar de nuevo, en una escena distinta, lo aprendido sobre comparar lo prometido con el producto real.
      narrative_beat: Dr. Rho presenta una escena nueva del archipiélago y pregunta a Dina si recuerda, sin repasar la lección, qué haría en ese caso.
      difficulty: 2
      suggested_families:
      - choice
      - story
    - position: 4
      slug: cerrar-el-cofre
      micro_objective: Aplicar en conjunto todo lo repasado de la saga, incluyendo cómo aplicar la pausa de esperar y pensar antes de pedir algo, para cerrar el cofre.
      narrative_beat: Antes de cerrar el cofre, Dina demuestra que recuerda toda la saga uniendo cada tarjeta con la lección que le corresponde.
      difficulty: 2
      suggested_families:
      - choice
      - storyplay
  - position: 10
    slug: reto-entrelazado
    kind: review_interleaved
    title_es: Reto Entrelazado
    concept: Zara Vex mezcla lo aprendido en Anuncios y Trampas con ideas de aventuras anteriores en un reto que combina ambos mundos.
    learning_objective: Al final, el niño puede recordar y combinar un concepto de Anuncios y Trampas con un concepto de una aventura anterior.
    key_vocabulary:
    - recordar
    - combinar
    - aplicar
    - anuncio
    prior_knowledge: Conoce Anuncios y Trampas (aventura 6) y las lecciones citadas de aventuras anteriores.
    fact_refs: []
    review_of:
    - mercado-de-los-colores/decisiones-inteligentes/pienso-antes-de-comprar
    - archipielago-del-trueque/nace-el-dinero/todos-confiamos-en-el-dinero
    lessons:
    - position: 1
      slug: un-recuerdo-de-otro-mundo
      micro_objective: Recordar, tal como se aprendió antes, el concepto de una aventura anterior citado en este reto.
