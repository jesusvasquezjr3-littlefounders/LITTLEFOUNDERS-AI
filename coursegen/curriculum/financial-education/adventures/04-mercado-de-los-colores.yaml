schema_version: 1

adventure:
  position: 4
  slug: mercado-de-los-colores
  theme: city
  age_tier: tier1
  title:
    en-US: "The Market of Colors"
    es-MX: "El Mercado de los Colores"
    pt-BR: "O Mercado das Cores"
  description:
    en-US: "In a bustling market city, the crew learns to tell needs from wants, compare prices, and shop within a limit."
    es-MX: "En una ciudad de mercado lleno de color, la tripulación aprende a distinguir necesidades de deseos, comparar precios y comprar dentro de un límite."
    pt-BR: "Em uma cidade de mercado cheia de cores, a tripulação aprende a distinguir necessidades de desejos, comparar preços e comprar dentro de um limite."
  narrative_arc: "El barco atraca en una ciudad de puestos coloridos donde todo se puede comprar, pero las monedas no alcanzan para todo. Dina, Liruf, Rho y Zara aprenden a pensar antes de comprar: qué necesitan de verdad, qué solo desean, cuál puesto ofrece el mejor precio, y cómo hacer que su bolsa de compras rinda para lo más importante."

sagas:
  - position: 1
    slug: lo-que-necesito-de-verdad
    icon: checklist
    title:
      en-US: "What I Really Need"
      es-MX: "Lo Que Necesito de Verdad"
      pt-BR: "O Que Eu Realmente Preciso"
    description:
      en-US: "The crew learns to separate what they truly need from what they simply want."
      es-MX: "La tripulación aprende a separar lo que de verdad necesita de lo que solo desea."
      pt-BR: "A tripulação aprende a separar o que realmente precisa do que apenas deseja."
    topics:
      - position: 1
        slug: cosas-que-necesito-para-vivir-bien
        title_es: "Cosas que necesito para vivir bien"
        concept: "Hay cosas que mi cuerpo y mi vida necesitan de verdad, como comida, agua y un lugar donde dormir."
        learning_objective: "Al final, el niño puede nombrar 3 cosas que una persona necesita para vivir bien."
        key_vocabulary: [necesito, para vivir, importante]
        prior_knowledge: "Sabe dividir monedas entre ahorro, gasto y compartir (aventura anterior)."
        fact_refs: []
        parent_check: "Un día cualquiera en casa, pregúntale a {{name}} qué cosas necesitamos de verdad para vivir bien, como comida, agua o un lugar para dormir, y escucha si logra nombrar al menos tres."
        lessons:
          - position: 1
            slug: lo-que-mi-cuerpo-necesita
            micro_objective: "Reconoce en la historia una cosa que el cuerpo necesita de verdad para estar bien."
            narrative_beat: "Dina llega a la ciudad con hambre y busca primero un puesto de comida, no de juguetes."
            difficulty: 1
            suggested_families: [story, choice]
          - position: 2
            slug: tres-cosas-que-necesito
            micro_objective: "Elige, entre 6 tarjetas, las 3 que muestran cosas que una persona necesita para vivir bien."
            narrative_beat: "Liruf recorre el mercado señalando lo que cree que todos necesitan para vivir bien."
            difficulty: 1
            suggested_families: [choice]
          - position: 3
            slug: ordeno-lo-mas-importante
            micro_objective: "Ordena 3 necesidades básicas de la más urgente a la menos urgente en una escena."
            narrative_beat: "Rho ayuda a un viajero cansado a pensar qué necesita primero: agua, sombra o descanso."
            difficulty: 2
            suggested_families: [arrange, story]
          - position: 4
            slug: mi-lista-de-necesidades
            micro_objective: "Arma en la historia una lista de 3 necesidades básicas propias."
            narrative_beat: "Zara escribe su propia lista de necesidades antes de empezar a recorrer el mercado."
            difficulty: 2
            suggested_families: [story, choice]
      - position: 2
        slug: cosas-que-quiero-pero-no-necesito
        title_es: "Cosas que quiero pero no necesito"
        concept: "Hay cosas que me gustaría tener, pero que no son indispensables para vivir bien: eso es un deseo."
        learning_objective: "Al final, el niño puede nombrar algo que desea pero reconoce que no es una necesidad."
        key_vocabulary: [deseo, no indispensable, me gustaría]
        prior_knowledge: "Sabe nombrar necesidades básicas (tema anterior)."
        fact_refs: [mxn.reference_prices.juguete_pequeno]
        parent_check: "La siguiente vez que estén en una tienda y {{name}} pida algo, pregúntale con calma si de verdad lo necesita o si nada más le gustaría tenerlo, sin hacerlo sentir mal por desear cosas."
        lessons:
          - position: 1
            slug: el-juguete-brillante
            micro_objective: "Reconoce en la historia un objeto que el personaje desea, pero no necesita para vivir."
            narrative_beat: "Liruf ve un juguete brillante en un puesto y admite que le encanta, aunque no lo necesita."
            difficulty: 1
            suggested_families: [story, choice]
          - position: 2
            slug: deseo-o-necesidad
            micro_objective: "Clasifica 4 objetos entre 'deseo' y 'necesidad', usando lo aprendido en el tema anterior."
            narrative_beat: "Rho separa los puestos del mercado entre los que venden necesidades y los que venden deseos."
            difficulty: 1
            suggested_families: [choice]
          - position: 3
            slug: puedo-desear-sin-culpa
            micro_objective: "Reconoce que desear algo que no es una necesidad está bien, no es motivo de culpa."
            narrative_beat: "Zara le asegura a Liruf que está bien desear el juguete brillante, solo hay que pensarlo con calma."
            difficulty: 2
            suggested_families: [story, choice]
          - position: 4
            slug: nombro-mi-propio-deseo
            micro_objective: "Nombra, dentro de la historia, un deseo propio distinto de sus necesidades."
            narrative_beat: "Dina piensa en algo que le encantaría tener del mercado, aunque no lo necesite de verdad."
            difficulty: 2
            suggested_families: [story, choice]
      - position: 3
        slug: a-veces-algo-es-necesidad-y-deseo-a-la-vez
        title_es: "A veces algo es necesidad y deseo a la vez"
        concept: "Algunas cosas pueden ser necesidad y deseo al mismo tiempo, como un zapato que necesito y que además me gusta mucho."
        learning_objective: "Al final, el niño puede reconocer un ejemplo donde algo es necesidad y deseo a la vez."
        key_vocabulary: [las dos cosas, necesito y me gusta]
        prior_knowledge: "Distingue deseos de necesidades por separado (tema anterior)."
        fact_refs: []
        parent_check: "Muéstrale a {{name}} algo que compraron porque hacía falta y que además les encantó, y pídele que te explique por qué esa cosa fue necesidad y gusto al mismo tiempo."
        lessons:
          - position: 1
            slug: unos-zapatos-que-me-encantan
            micro_objective: "Reconoce en la historia un objeto que es necesidad y deseo al mismo tiempo."
            narrative_beat: "Rho necesita zapatos nuevos para el viaje, y además encuentra unos de su color favorito."
            difficulty: 1
            suggested_families: [story, choice]
          - position: 2
            slug: encuentro-ejemplos-de-las-dos-cosas
            micro_objective: "Elige, entre 4 objetos, cuáles podrían ser necesidad y deseo a la vez."
            narrative_beat: "Zara revisa el mercado buscando objetos que sean útiles y también le encanten."
            difficulty: 2
            suggested_families: [choice]
          - position: 3
            slug: explico-mi-ejemplo
            micro_objective: "Explica en una frase por qué un objeto elegido es necesidad y deseo a la vez."
            narrative_beat: "Liruf explica por qué su mochila nueva es algo que necesita y también algo que le fascina."
            difficulty: 2
            suggested_families: [story, choice]
          - position: 4
            slug: celebro-cuando-coinciden
            micro_objective: "Reconoce en la historia que es una suerte cuando lo que necesito también me gusta mucho."
            narrative_beat: "Dina celebra haber encontrado unos zapatos que necesitaba y que además ama."
            difficulty: 2
            suggested_families: [story, storyplay]
      - position: 4
        slug: elijo-que-es-mas-importante
        title_es: "Elijo qué es más importante"
        concept: "Cuando tengo monedas limitadas, puedo elegir primero lo que es más importante entre varias opciones."
        learning_objective: "Al final, el niño puede elegir, entre una necesidad y un deseo, cuál priorizar con monedas limitadas."
        key_vocabulary: [prioridad, más importante, elegir primero]
        prior_knowledge: "Reconoce que algo puede ser necesidad y deseo a la vez (tema anterior)."
        fact_refs: []
        parent_check: "Con unas monedas de juego y dos opciones sobre la mesa, observa si {{name}} logra decidir cuál de las dos es más importante cubrir primero."
        prerequisites:
          - path: aldea-del-ahorro/metas-de-la-aldea/cuanto-guardo-cuanto-gasto
            strength: soft
            reason: "Ya practicó justificar una división simple entre ahorrar y gastar, lo que ayuda a elegir entre una necesidad y un deseo con monedas limitadas."
        lessons:
          - position: 1
            slug: solo-me-alcanza-para-uno
            micro_objective: "Reconoce en la historia que el personaje solo tiene monedas para una de dos opciones."
            narrative_beat: "Rho solo tiene monedas para comprar agua o para comprar un dulce, no para las dos cosas."
            difficulty: 1
            suggested_families: [story, choice]
          - position: 2
            slug: elijo-la-necesidad-primero
            micro_objective: "Elige, entre una necesidad y un deseo, la opción más importante para priorizar."
            narrative_beat: "Zara ayuda a Rho a decidir: primero el agua que necesita, después puede pensar en el dulce."
            difficulty: 2
            suggested_families: [choice, money]
          - position: 3
            slug: a-veces-el-deseo-puede-esperar
            micro_objective: "Reconoce en la historia que un deseo puede esperar sin desaparecer para siempre."
            narrative_beat: "Liruf guarda la idea del juguete brillante para más adelante, después de cubrir lo importante."
            difficulty: 2
            suggested_families: [story, choice]
          - position: 4
            slug: priorizo-en-la-historia
            micro_objective: "Completa en la historia una decisión de prioridad entre necesidad y deseo con monedas limitadas."
            narrative_beat: "Dina decide con calma qué comprar primero, pensando en lo que es más importante hoy."
            difficulty: 2
            suggested_families: [storyplay, money]
      - position: 5
        slug: mi-lista-de-necesidades-de-hoy
        title_es: "Mi lista de necesidades de hoy"
        concept: "Antes de entrar al mercado, puedo armar una lista corta de lo que de verdad necesito hoy."
        learning_objective: "Al final, el niño puede armar una lista corta de necesidades antes de una compra."
        key_vocabulary: [lista, antes de comprar, hoy necesito]
        prior_knowledge: "Sabe priorizar entre necesidad y deseo (tema anterior)."
        fact_refs: []
        parent_check: "Antes de salir juntos a hacer un mandado, invita a {{name}} a decir en voz alta dos o tres cosas que de verdad hacen falta comprar hoy."
        lessons:
          - position: 1
            slug: antes-de-entrar-al-mercado
            micro_objective: "Reconoce en la historia el momento en que un personaje arma su lista antes de comprar."
            narrative_beat: "Rho se sienta afuera del mercado y anota en un pergamino lo que necesita hoy."
            difficulty: 1
            suggested_families: [story, choice]
          - position: 2
            slug: armo-mi-lista-corta
            micro_objective: "Arma una lista corta de 2-3 necesidades antes de entrar a comprar en la historia."
            narrative_beat: "Zara hace su propia lista corta antes de perderse entre los puestos coloridos."
            difficulty: 2
            suggested_families: [story, arrange]
          - position: 3
            slug: sigo-mi-lista
            micro_objective: "Reconoce en la historia cómo seguir la lista ayuda a no comprar cosas de más."
            narrative_beat: "Liruf revisa su lista varias veces mientras camina entre los puestos tentadores del mercado."
            difficulty: 2
            suggested_families: [story, choice]
          - position: 4
            slug: termino-mi-lista-completa
            micro_objective: "Completa en la historia una compra siguiendo toda su lista de necesidades."
            narrative_beat: "Dina termina de comprar todo lo de su lista y se siente satisfecha, sin gastar de más."
            difficulty: 2
            suggested_families: [storyplay, money]
      - position: 6
        slug: separar-necesidades-y-deseos
        title_es: "Separar necesidades y deseos"
        concept: "Con práctica, puedo mirar una lista de cosas y separar rápido cuáles son necesidades y cuáles deseos."
        learning_objective: "Al final, el niño puede clasificar correctamente una lista de objetos entre necesidades y deseos."
        key_vocabulary: [separar, clasificar, necesidad, deseo]
        prior_knowledge: "Sabe armar una lista de necesidades antes de comprar (tema anterior)."
        fact_refs: []
        parent_check: "Señalando varios objetos de la casa o de un anuncio, pídele a {{name}} que separe cuáles son necesidades y cuáles son deseos, sin darle pistas."
        lessons:
          - position: 1
            slug: repaso-necesidad-o-deseo
            micro_objective: "Repasa la diferencia entre necesidad y deseo con 3 ejemplos de la historia."
            narrative_beat: "Rho repasa con la tripulación todo lo aprendido sobre necesidades y deseos en el mercado."
            difficulty: 2
            suggested_families: [story, choice]
          - position: 2
            slug: clasifico-una-lista-completa
            micro_objective: "Clasifica una lista de 8 objetos entre necesidades y deseos."
            narrative_beat: "Zara clasifica todos los objetos que vio hoy en el mercado en dos grandes grupos."
            difficulty: 2
            suggested_families: [money]
          - position: 3
            slug: reviso-mis-aciertos
            micro_objective: "Revisa su clasificación anterior y corrige un objeto mal clasificado dentro de la historia."
            narrative_beat: "Liruf revisa su lista con Rho y corrige un objeto que había puesto en el grupo equivocado."
            difficulty: 2
            suggested_families: [choice, story]
          - position: 4
            slug: lo-que-necesito-de-verdad-repaso
            micro_objective: "Clasifica sin ayuda una lista nueva de objetos entre necesidades y deseos, como cierre de la saga."
            narrative_beat: "Dina completa su propia clasificación final antes de seguir explorando el mercado de colores."
            difficulty: 3
            suggested_families: [money, choice]
      - position: 7
        slug: cofre-del-repaso-de-necesidades
        title_es: "El Cofre del Repaso de Necesidades"
        concept: "Antes de ver los precios del mercado, la tripulación abre el cofre de recuerdos y repasa necesidades y deseos."
        learning_objective: "Al final, el niño recuerda y usa, sin nueva enseñanza, la diferencia entre necesidad y deseo, y cómo priorizar con monedas limitadas."
        key_vocabulary: [necesidad, deseo, prioridad, lista]
        prior_knowledge: "Completó los 6 temas de Lo Que Necesito de Verdad."
        fact_refs: []
        kind: review_spaced
        review_of:
          - mercado-de-los-colores/lo-que-necesito-de-verdad/cosas-que-necesito-para-vivir-bien
          - mercado-de-los-colores/lo-que-necesito-de-verdad/cosas-que-quiero-pero-no-necesito
          - mercado-de-los-colores/lo-que-necesito-de-verdad/a-veces-algo-es-necesidad-y-deseo-a-la-vez
          - mercado-de-los-colores/lo-que-necesito-de-verdad/elijo-que-es-mas-importante
          - mercado-de-los-colores/lo-que-necesito-de-verdad/mi-lista-de-necesidades-de-hoy
          - mercado-de-los-colores/lo-que-necesito-de-verdad/separar-necesidades-y-deseos
        lessons:
          - position: 1
            slug: recuerdo-una-necesidad-basica
            micro_objective: "Recuerda, sin ayuda, una necesidad básica para vivir bien vista en esta saga."
            narrative_beat: "Rho abre el cofre y recuerda la primera vez que buscó agua en el mercado, antes que cualquier otra cosa."
            difficulty: 1
            suggested_families: [story, choice]
          - position: 2
            slug: recuerdo-un-deseo-sin-culpa
            micro_objective: "Recuerda, sin ayuda, un deseo propio distinto de sus necesidades, sin sentir culpa por tenerlo."
            narrative_beat: "Zara recuerda el juguete brillante que deseaba, aunque no lo necesitaba de verdad."
            difficulty: 1
            suggested_families: [story, choice]
          - position: 3
            slug: clasifico-recuerdos-del-mercado
            micro_objective: "Clasifica, sin ayuda, 4 objetos recordados entre necesidad y deseo."
            narrative_beat: "Liruf clasifica varios recuerdos del cofre entre lo que de verdad necesitaba y lo que solo deseaba."
            difficulty: 2
            suggested_families: [choice, money]
          - position: 4
            slug: cierro-el-cofre-de-necesidades
            micro_objective: "Aplica sin ayuda lo recordado: prioriza una necesidad sobre un deseo con monedas limitadas."
            narrative_beat: "Dina cierra el cofre de necesidades, lista para ver los precios de todo el mercado."
            difficulty: 2
            suggested_families: [money, choice]
      - position: 8
        slug: reto-entrelazado-de-necesidades
        title_es: "Reto Entrelazado de Necesidades"
        concept: "Mezclamos decidir cuánto guardar y cuánto gastar, como en la aldea, con priorizar necesidades en el mercado."
        learning_objective: "Al final, el niño combina, sin nueva enseñanza, ideas sobre guardar y gastar con ideas sobre priorizar necesidades."
        key_vocabulary: [necesidad, deseo, guardar, gastar]
        prior_knowledge: "Completó El Cofre del Repaso de Necesidades (tema anterior) y La Aldea del Ahorro (aventura anterior)."
        fact_refs: []
        kind: review_interleaved
        review_of:
          - aldea-del-ahorro/metas-de-la-aldea/cuanto-guardo-cuanto-gasto
          - mercado-de-los-colores/lo-que-necesito-de-verdad/elijo-que-es-mas-importante
          - mercado-de-los-colores/lo-que-necesito-de-verdad/mi-lista-de-necesidades-de-hoy
        lessons:
          - position: 1
            slug: guardar-o-cubrir-una-necesidad
            micro_objective: "Combina decidir cuánto guardar y cuánto gastar con priorizar una necesidad frente a un deseo."
            narrative_beat: "Rho recuerda que en la aldea decidía cuánto guardar, y ahora decide primero cubrir sus necesidades."
            difficulty: 2
            suggested_families: [story, choice]
          - position: 2
            slug: mi-lista-y-mi-frasco
            micro_objective: "Conecta armar una lista de necesidades con haber ahorrado monedas para poder cubrirlas."
            narrative_beat: "Zara revisa su lista de necesidades del mercado y recuerda las monedas que guardó en la aldea para esto."
            difficulty: 2
            suggested_families: [story, money]
          - position: 3
            slug: elijo-gastar-en-lo-importante
            micro_objective: "Elige, entre gastar en una necesidad y gastar en un deseo, la opción más importante, aplicando ambas sagas."
            narrative_beat: "Liruf elige gastar primero en lo que necesita, recordando por qué decidía cuánto gastar en la aldea."
            difficulty: 2
            suggested_families: [choice, money]
          - position: 4
            slug: cubro-mi-lista-con-lo-que-ahorre
            micro_objective: "Completa, sin ayuda, la cobertura de una lista de necesidades usando monedas ya ahorradas."
            narrative_beat: "Dina cubre toda su lista de necesidades del mercado usando las monedas que guardó con paciencia."
            difficulty: 2
            suggested_families: [money, storyplay]

  - position: 2
    slug: el-mercado-y-sus-precios
    icon: storefront
    title:
      en-US: "The Market and Its Prices"
      es-MX: "El Mercado y sus Precios"
      pt-BR: "O Mercado e Seus Preços"
    description:
      en-US: "Every stall has a price tag — the crew learns to read, compare and question prices."
      es-MX: "Cada puesto tiene una etiqueta de precio: la tripulación aprende a leerlas, compararlas y cuestionarlas."
      pt-BR: "Cada barraca tem uma etiqueta de preço: a tripulação aprende a lê-las, compará-las e questioná-las."
    topics:
      - position: 1
        slug: todo-en-el-mercado-tiene-un-precio
        title_es: "Todo en el mercado tiene un precio"
        concept: "Cada objeto en el mercado tiene una etiqueta que dice cuántas monedas cuesta."
        learning_objective: "Al final, el niño puede leer el precio escrito en la etiqueta de un objeto."
        key_vocabulary: [precio, etiqueta, cuesta]
        prior_knowledge: "Sabe clasificar necesidades y deseos (saga anterior)."
        fact_refs: [mxn.reference_prices.paleta]
        parent_check: "En su próxima salida a comprar, invita a {{name}} a buscar y leer en voz alta el precio de un producto, ayudándolo solo con los números grandes."
        lessons:
          - position: 1
            slug: la-etiqueta-del-precio
            micro_objective: "Reconoce en la historia dónde está escrito el precio de un objeto en el mercado."
            narrative_beat: "Rho encuentra su primera etiqueta de precio colgada de una fruta jugosa en el puesto."
            difficulty: 1
            suggested_families: [story, choice]
          - position: 2
            slug: leo-un-precio
            micro_objective: "Lee correctamente un precio de una cifra dentro de un rango de $5 a $50."
            narrative_beat: "Zara practica leer en voz alta los precios de distintos puestos del mercado."
            difficulty: 1
            suggested_families: [money, input]
          - position: 3
            slug: comparo-el-precio-con-mis-monedas
            micro_objective: "Compara un precio con la cantidad de monedas que tiene el personaje y determina si le alcanza."
            narrative_beat: "Liruf cuenta sus monedas y las compara con el precio de la fruta que quiere comprar."
            difficulty: 2
            suggested_families: [money, input]
          - position: 4
            slug: reviso-varios-precios
            micro_objective: "Revisa 3 etiquetas de precio distintas en la historia y las lee correctamente en voz alta."
            narrative_beat: "Dina recorre varios puestos leyendo cada etiqueta de precio con atención."
            difficulty: 2
            suggested_families: [money, choice]
      - position: 2
        slug: reviso-el-precio-antes-de-decidir
        title_es: "Reviso el precio antes de decidir"
        concept: "Antes de comprar algo, es buena idea revisar su precio primero, sin apurarse."
        learning_objective: "Al final, el niño puede describir por qué revisar el precio antes de decidir es una buena costumbre."
        key_vocabulary: [revisar antes, sin apurarse, decidir con calma]
        prior_knowledge: "Sabe leer precios en etiquetas (tema anterior)."
        fact_refs: []
        parent_check: "Justo antes de que {{name}} decida comprar algo en una tienda, pregúntale por qué conviene revisar el precio con calma antes de decidir, y escucha su explicación."
        lessons:
          - position: 1
            slug: casi-compro-sin-mirar
            micro_objective: "Reconoce en la historia el riesgo de comprar algo sin revisar antes su precio."
            narrative_beat: "Rho casi compra un juguete sin fijarse en el precio, hasta que Zara le recuerda revisarlo."
            difficulty: 1
            suggested_families: [story, choice]
          - position: 2
            slug: me-tomo-mi-tiempo
            micro_objective: "Elige, entre 2 respuestas posibles, la que muestra tomarse un momento para revisar el precio antes de decidir."
            narrative_beat: "Liruf respira y se toma un momento para leer bien el precio antes de decidir comprar."
            difficulty: 1
            suggested_families: [choice]
          - position: 3
            slug: comparo-antes-de-comprar
            micro_objective: "Revisa 2 precios distintos de objetos parecidos antes de decidir cuál comprar en la historia."
            narrative_beat: "Zara revisa dos puestos de fruta antes de decidir en cuál va a comprar."
            difficulty: 2
            suggested_families: [money, choice]
