schema_version: 1
adventure:
  position: 5
  slug: taller-de-los-inventores
  theme: valley
  age_tier: tier1
  title:
    en-US: The Inventors' Workshop
    es-MX: El Taller de los Inventores
    pt-BR: A Oficina dos Inventores
  description:
    en-US: Dina and Dino discover a magical workshop where ideas become inventions, fair prices, and happy
      sales.
    es-MX: Dina y Dino descubren un taller mágico donde las ideas se convierten en inventos, precios justos
      y ventas felices.
    pt-BR: Dina e Dino descobrem uma oficina mágica onde as ideias viram invenções, preços justos e vendas
      felizes.
  narrative_arc: Dina y Dino encuentran un taller abandonado en el valle donde Dr. Rho guarda inventos
    a medio hacer. Juntos aprenden a convertir una idea en algo real, ponerle un precio justo y venderlo
    en el mercado del valle, mientras Zara Vex los reta a mejorar cada semana.
sagas:
- position: 1
  slug: chispas-de-ideas
  icon: lightbulb
  title:
    en-US: Sparks of Ideas
    es-MX: Chispas de Ideas
    pt-BR: Faíscas de Ideias
  description:
    en-US: Spot everyday problems and turn them into invention ideas.
    es-MX: Descubre problemas de la vida diaria y conviértelos en ideas de invento.
    pt-BR: Descubra problemas do dia a dia e transforme-os em ideias de invenção.
  topics:
  - position: 1
    slug: problemas-cada-dia
    title_es: Problemas que ves cada día
    concept: Un problema es algo que resulta incómodo o difícil para alguien, y notarlo es el primer paso
      para inventar algo que ayude.
    learning_objective: Al final, el niño puede señalar un problema cotidiano concreto que alguien enfrenta.
    key_vocabulary:
    - problema
    - invento
    - idea
    - necesidad
    prior_knowledge: Sabe que las personas tienen necesidades y deseos distintos (aventuras 1 y 4).
    fact_refs: []
    lessons:
    - position: 1
      slug: un-taller-en-el-valle
      micro_objective: Identificar qué es un problema cotidiano al ver ejemplos concretos.
      narrative_beat: Dina y Dino encuentran un taller polvoriento en el valle; Dr. Rho les explica que
        ahí nacen los inventos que resuelven problemas.
      difficulty: 1
      suggested_families:
      - story
      - choice
    - position: 2
      slug: notar-lo-incomodo
      micro_objective: Distinguir un problema real de una simple queja sin solución posible.
      narrative_beat: Dr. Rho muestra una caja de objetos rotos y pide a Dina que explique qué molestia
        resolvía cada uno.
      difficulty: 1
      suggested_families:
      - choice
      - analyze
    - position: 3
      slug: problemas-de-mi-dia
      micro_objective: Elegir, entre varias escenas, cuál muestra un problema que un invento podría resolver.
      narrative_beat: 'Dino recorre el valle anotando problemas: una carreta que se atasca, una alacena
        desordenada, plantas que se secan.'
      difficulty: 2
      suggested_families:
      - choice
      - arrange
    - position: 4
      slug: el-cuaderno-de-problemas
      micro_objective: Registrar tres problemas distintos observados en un mismo lugar.
      narrative_beat: Zara Vex reta a Dina a llenar una página del cuaderno de inventos con problemas
        reales del valle antes del atardecer.
      difficulty: 2
      suggested_families:
      - choice
      - story
  - position: 2
    slug: de-problema-a-idea
    title_es: De problema a idea
    concept: Una idea de invento nace cuando imaginamos una forma de resolver un problema que ya identificamos.
    learning_objective: Al final, el niño puede proponer una idea simple que resuelva un problema dado.
    key_vocabulary:
    - idea
    - invento
    - solución
    - imaginar
    prior_knowledge: Puede nombrar un problema cotidiano concreto (tema anterior).
    fact_refs: []
    lessons:
    - position: 1
      slug: chispa-de-idea
      micro_objective: Reconocer que cada invento comenzó como una idea para resolver un problema.
      narrative_beat: Dr. Rho enciende una lámpara vieja y cuenta que nació de la idea de alguien cansado
        de tropezar en la oscuridad.
      difficulty: 1
      suggested_families:
      - story
      - choice
    - position: 2
      slug: una-idea-por-problema
      micro_objective: Emparejar cada problema mostrado con una idea de invento que lo resuelva.
      narrative_beat: Dino junta tarjetas de problemas del valle y busca, una por una, la idea que mejor
        encaja.
      difficulty: 2
      suggested_families:
      - arrange
      - choice
    - position: 3
      slug: imaginar-sin-miedo
      micro_objective: Generar una idea propia frente a un problema no visto antes.
      narrative_beat: Zara Vex presenta un problema nuevo del mercado y reta a Dina a imaginar, sin ayuda,
        una idea que lo resuelva.
      difficulty: 2
      suggested_families:
      - choice
      - story
    - position: 4
      slug: la-idea-mas-clara
      micro_objective: Explicar con una frase simple en qué consiste la idea elegida.
      narrative_beat: Dina escribe su idea en una ficha del taller para que Dr. Rho la guarde en el estante
        de inventos futuros.
      difficulty: 3
      suggested_families:
      - choice
      - storyplay
  - position: 3
    slug: para-quien-es
    title_es: ¿Para quién es?
    concept: 'Todo invento útil tiene a alguien en mente: la persona que lo va a usar.'
    learning_objective: Al final, el niño puede identificar quién usaría un invento y por qué le serviría.
    key_vocabulary:
    - cliente
    - usuario
    - ayudar
    - necesitar
    prior_knowledge: Distingue necesidades de deseos (aventura 4).
    fact_refs: []
    lessons:
    - position: 1
      slug: quien-lo-necesita
      micro_objective: Identificar quién se beneficiaría de un invento mostrado en una escena.
      narrative_beat: Dino observa a distintos vecinos del valle y se pregunta quién usaría cada invento
        del taller.
      difficulty: 1
      suggested_families:
      - story
      - choice
    - position: 2
      slug: un-invento-un-usuario
      micro_objective: Emparejar cada invento con la persona que mejor lo aprovecharía.
      narrative_beat: Dr. Rho muestra tres inventos a medio terminar y pide adivinar para quién es cada
        uno.
      difficulty: 2
      suggested_families:
      - arrange
      - analyze
    - position: 3
      slug: pensar-en-el-otro
      micro_objective: Explicar por qué un invento específico ayuda a la persona elegida.
      narrative_beat: 'Zara Vex pregunta a Dina: ''¿por qué justo esta persona necesita tu idea y no otra?'''
      difficulty: 2
      suggested_families:
      - choice
      - story
    - position: 4
      slug: mi-primer-usuario
      micro_objective: Elegir un usuario real del valle para la idea propia del niño.
      narrative_beat: Dina decide que su invento será para el granjero que siempre llega tarde por cargar
        canastas pesadas.
      difficulty: 3
      suggested_families:
      - choice
      - storyplay
  - position: 4
    slug: elegir-la-mejor-idea
    title_es: Elegir la mejor idea
    concept: Cuando hay varias ideas posibles, comparar sus ventajas ayuda a elegir la más útil.
    learning_objective: Al final, el niño puede comparar dos o más ideas y elegir la más adecuada para
      un problema.
    key_vocabulary:
    - comparar
    - elegir
    - ventaja
    - útil
    prior_knowledge: Puede generar más de una idea para un mismo problema.
    fact_refs: []
    lessons:
    - position: 1
      slug: varias-chispas
      micro_objective: Observar varias ideas distintas propuestas para un mismo problema.
      narrative_beat: 'El taller se llena de bocetos: tres inventores del valle proponen ideas distintas
        para el mismo carrito atascado.'
      difficulty: 1
      suggested_families:
      - story
      - choice
    - position: 2
      slug: que-idea-ayuda-mas
      micro_objective: Identificar cuál de dos ideas resuelve mejor el problema mostrado.
      narrative_beat: Dr. Rho pone dos bocetos lado a lado y pregunta cuál resuelve mejor el problema
        del carrito.
      difficulty: 2
      suggested_families:
      - choice
      - analyze
    - position: 3
      slug: comparar-con-calma
      micro_objective: Justificar con una razón simple por qué una idea es mejor que otra.
      narrative_beat: Dino aprende a decir no solo cuál idea prefiere, sino por qué la prefiere, antes
        de decidir.
      difficulty: 3
      suggested_families:
      - choice
      - analyze
    - position: 4
      slug: mi-decision-final
      micro_objective: Elegir, entre las propias ideas generadas, la que se llevará al banco de trabajo.
      narrative_beat: 'Dina revisa su cuaderno de ideas y tacha todas menos una: la que construirá esta
        semana.'
      difficulty: 3
      suggested_families:
      - choice
      - storyplay
  - position: 5
    slug: dibujar-el-plan
    title_es: Dibujar el plan
    concept: Antes de construir, dibujar el plan del invento ayuda a organizar las partes y los pasos.
    learning_objective: Al final, el niño puede ordenar los pasos básicos para construir una idea sencilla.
    key_vocabulary:
    - plan
    - plano
    - pasos
    - orden
    prior_knowledge: Tiene una idea de invento elegida (tema anterior).
    fact_refs: []
    lessons:
    - position: 1
      slug: el-plano-del-inventor
      micro_objective: Reconocer que un plan muestra las partes de un invento antes de construirlo.
      narrative_beat: Dr. Rho despliega un plano viejo lleno de piezas numeradas y explica que ahí nació
        su primer invento.
      difficulty: 1
      suggested_families:
      - story
      - choice
    - position: 2
      slug: pasos-en-orden
      micro_objective: Ordenar los pasos básicos para construir un invento sencillo.
      narrative_beat: Dino mezcla sin querer las tarjetas de pasos de un plan y debe ordenarlas de nuevo
        antes de empezar.
      difficulty: 2
      suggested_families:
      - arrange
      - story
    - position: 3
      slug: partes-del-invento
      micro_objective: Clasificar qué materiales corresponden a cada parte del plan.
      narrative_beat: Dina separa tornillos, telas y madera según la parte del plano a la que pertenecen.
      difficulty: 2
      suggested_families:
      - arrange
      - analyze
    - position: 4
      slug: mi-plano-listo
      micro_objective: Elaborar un plan ordenado de pasos para la idea propia del niño.
      narrative_beat: Con la ayuda de Dr. Rho, Dina termina su propio plano y lo cuelga en la pared del
        taller.
      difficulty: 3
      suggested_families:
      - arrange
      - choice
  - position: 6
    slug: contarle-la-idea-a-alguien
    title_es: Contarle la idea a alguien
    concept: Explicar una idea con palabras simples y claras ayuda a que otros la entiendan y la apoyen.
    learning_objective: Al final, el niño puede describir su idea de invento en una o dos frases claras.
    key_vocabulary:
    - explicar
    - claro
    - presentar
    - idea
    prior_knowledge: Tiene un plan de invento definido (tema anterior).
    fact_refs: []
    lessons:
    - position: 1
      slug: contar-en-pocas-palabras
      micro_objective: Reconocer la diferencia entre una explicación clara y una confusa.
      narrative_beat: Zara Vex escucha a Dino explicar su idea con tantos detalles que nadie entiende
        para qué sirve.
      difficulty: 1
      suggested_families:
      - story
      - choice
    - position: 2
      slug: elegir-lo-importante
      micro_objective: Seleccionar la información esencial para explicar un invento en una frase.
      narrative_beat: 'Dr. Rho enseña a Dina a quedarse solo con lo importante: qué hace el invento y
        a quién ayuda.'
      difficulty: 2
      suggested_families:
      - choice
      - analyze
    - position: 3
      slug: practicar-la-explicacion
      micro_objective: Presentar la idea propia frente a un personaje y responder una pregunta simple
        sobre ella.
      narrative_beat: Dina practica su explicación frente a Dino, que le hace una pregunta antes de que
        ella siga al mercado.
      difficulty: 2
      suggested_families:
      - storyplay
      - choice
    - position: 4
      slug: lista-para-el-taller
      micro_objective: Comunicar con claridad la idea final antes de pasar a construirla.
      narrative_beat: Con su idea clara y su plano en mano, Dina anuncia a todo el taller que está lista
        para empezar a construir.
      difficulty: 3
      suggested_families:
      - storyplay
      - story
  - position: 7
    slug: el-cofre-del-repaso
    kind: review_spaced
    title_es: El Cofre del Repaso
    concept: Zara Vex abre un cofre de recuerdos del taller para poner a prueba, sin enseñar nada nuevo, todo lo aprendido en la saga Chispas de Ideas.
    learning_objective: Al final, el niño puede recordar y aplicar, sin ayuda nueva, los conceptos principales de la saga Chispas de Ideas.
    key_vocabulary:
    - problema
    - idea
    - cliente
    - comparar
    prior_knowledge: Ha completado los seis temas de la saga Chispas de Ideas (aventura 5, saga 1).
    fact_refs: []
    review_of:
    - taller-de-los-inventores/chispas-de-ideas/problemas-cada-dia
    - taller-de-los-inventores/chispas-de-ideas/de-problema-a-idea
    - taller-de-los-inventores/chispas-de-ideas/para-quien-es
    - taller-de-los-inventores/chispas-de-ideas/elegir-la-mejor-idea
    - taller-de-los-inventores/chispas-de-ideas/dibujar-el-plan
    - taller-de-los-inventores/chispas-de-ideas/contarle-la-idea-a-alguien
    lessons:
    - position: 1
      slug: el-cofre-se-abre
      micro_objective: Recordar, sin ayuda nueva, cómo notar un problema cotidiano y cómo convertir un problema en una idea.
      narrative_beat: Zara Vex encuentra un cofre de recuerdos del taller y reta a Dina a recordar, tarjeta por tarjeta, lo primero que aprendió en esta saga.
      difficulty: 1
      suggested_families:
      - story
      - choice
    - position: 2
      slug: recordar-en-orden
      micro_objective: Recordar y ordenar de nuevo cómo pensar en quién usaría el invento y cómo comparar ideas y elegir la mejor.
      narrative_beat: Dino saca del cofre las tarjetas mezcladas de la saga y las ordena de memoria, sin que Dr. Rho le dé ninguna pista nueva.
      difficulty: 1
      suggested_families:
      - arrange
      - choice
    - position: 3
      slug: aplicar-lo-guardado
      micro_objective: Aplicar de nuevo, en una escena distinta, lo aprendido sobre ordenar los pasos en un plano.
      narrative_beat: Dr. Rho presenta una escena nueva del taller y pregunta a Dina si recuerda, sin repasar la lección, qué haría en ese caso.
      difficulty: 2
      suggested_families:
      - choice
      - story
    - position: 4
      slug: cerrar-el-cofre
      micro_objective: Aplicar en conjunto todo lo repasado de la saga, incluyendo cómo explicar la idea con claridad, para cerrar el cofre.
      narrative_beat: Antes de cerrar el cofre, Dina demuestra que recuerda toda la saga uniendo cada tarjeta con la lección que le corresponde.
      difficulty: 2
      suggested_families:
      - choice
      - storyplay
  - position: 8
    slug: reto-entrelazado
    kind: review_interleaved
    title_es: Reto Entrelazado
    concept: Zara Vex mezcla lo aprendido en Chispas de Ideas con ideas de aventuras anteriores en un reto que combina ambos mundos.
    learning_objective: Al final, el niño puede recordar y combinar un concepto de Chispas de Ideas con un concepto de una aventura anterior.
    key_vocabulary:
    - recordar
    - combinar
    - aplicar
    - problema
    prior_knowledge: Conoce Chispas de Ideas (aventura 5) y las lecciones citadas de aventuras anteriores.
    fact_refs: []
    review_of:
    - mercado-de-los-colores/lo-que-necesito-de-verdad/cosas-que-necesito-para-vivir-bien
    - mercado-de-los-colores/decisiones-inteligentes/pienso-antes-de-comprar
    lessons:
    - position: 1
      slug: un-recuerdo-de-otro-mundo
      micro_objective: Recordar, tal como se aprendió antes, el concepto de una aventura anterior citado en este reto.
      narrative_beat: Zara Vex trae un recuerdo de un mundo anterior y pide a Dino recordarlo sin ayuda, antes de mezclarlo con el taller.
      difficulty: 2
      suggested_families:
      - choice
      - story
    - position: 2
      slug: unir-los-dos-mundos
      micro_objective: Combinar el concepto recordado de una aventura anterior con lo aprendido en Chispas de Ideas.
      narrative_beat: Dr. Rho muestra cómo esa lección de otro mundo se conecta directamente con lo que Dina aprendió en Chispas de Ideas.
      difficulty: 2
      suggested_families:
      - choice
      - analyze
    - position: 3
      slug: practicar-el-entrelazado
      micro_objective: Aplicar juntos, en una escena nueva, ambos conceptos combinados.
      narrative_beat: Zara Vex reta a Dino a resolver una escena nueva del valle usando a la vez las dos lecciones combinadas.
      difficulty: 2
      suggested_families:
      - choice
      - storyplay
    - position: 4
      slug: mi-reto-entrelazado
      micro_objective: Aplicar con seguridad, sin ayuda, la combinación completa de ambos conceptos en una situación final.
      narrative_beat: Frente a una última escena del taller, Dina combina lo aprendido en Chispas de Ideas con la lección de la aventura anterior para resolverla.
      difficulty: 2
      suggested_families:
      - choice
      - story
- position: 2
  slug: manos-a-la-obra
  icon: construction
  title:
    en-US: Hands at Work
    es-MX: Manos a la Obra
    pt-BR: Mãos à Obra
  description:
    en-US: Gather materials, work out costs, and build your invention with care.
    es-MX: Reúne materiales, calcula costos y construye tu invento con cuidado.
    pt-BR: Reúna materiais, calcule custos e construa sua invenção com cuidado.
  topics:
  - position: 1
    slug: materiales-que-necesito
    title_es: 'Materiales: ¿qué necesito?'
    concept: Cada parte de un invento requiere un material específico, y elegirlo bien es el primer paso
      para construir.
    learning_objective: Al final, el niño puede identificar qué materiales corresponden a un plan de invento
      dado.
    key_vocabulary:
    - material
    - madera
    - tela
    - herramienta
    prior_knowledge: Tiene un plano con partes definidas (aventura 5, saga 1).
    fact_refs: []
    lessons:
    - position: 1
      slug: el-estante-de-materiales
      micro_objective: Reconocer distintos materiales disponibles en el taller.
      narrative_beat: Dino descubre un estante lleno de madera, tela, cuerdas y ruedas, cada uno etiquetado
        con su nombre.
      difficulty: 1
      suggested_families:
      - story
      - choice
    - position: 2
      slug: material-correcto-por-parte
      micro_objective: Emparejar cada parte del plano con el material que le corresponde.
      narrative_beat: Dr. Rho pide a Dina que conecte cada pieza dibujada en el plano con el material
        del estante.
      difficulty: 2
      suggested_families:
      - arrange
      - choice
    - position: 3
      slug: lo-que-falta
      micro_objective: Detectar qué materiales del plan aún no están disponibles en el taller.
      narrative_beat: Al revisar su lista, Dina nota que le falta una rueda pequeña que no hay en el estante.
      difficulty: 2
      suggested_families:
      - analyze
      - choice
    - position: 4
      slug: mi-lista-de-materiales
      micro_objective: Elaborar una lista completa de materiales necesarios para el invento propio.
      narrative_beat: Con ayuda de Dr. Rho, Dina termina su lista de materiales antes de ir al mercado
        del valle.
      difficulty: 3
      suggested_families:
      - arrange
      - choice
  - position: 2
    slug: cuanto-cuesta-cada-material
    title_es: Cuánto cuesta cada material
    concept: Cada material tiene un precio, y conocerlo es necesario antes de comprar lo que hace falta.
    learning_objective: Al final, el niño puede leer el precio de un material en monedas y billetes.
    key_vocabulary:
    - precio
    - costo
    - moneda
    - billete
    prior_knowledge: Reconoce monedas y billetes (aventura 1).
    fact_refs:
    - mxn.denominations.coins
    - mxn.denominations.bills
    lessons:
    - position: 1
      slug: la-tienda-de-materiales
      micro_objective: Observar los precios marcados en distintos materiales de una tienda.
      narrative_beat: En el mercado del valle, Dina encuentra un puesto donde cada material tiene su precio
        en una etiqueta.
      difficulty: 1
      suggested_families:
      - story
      - money
    - position: 2
      slug: pagar-el-material
      micro_objective: Formar con monedas y billetes el pago exacto de un material.
      narrative_beat: Dino junta monedas de su bolsillo para pagar exactamente el precio de un rollo de
        cuerda.
      difficulty: 2
      suggested_families:
      - money
      - input
    - position: 3
      slug: comparar-precios-de-material
      micro_objective: Elegir el material más económico entre dos opciones equivalentes.
      narrative_beat: Zara Vex señala dos puestos que venden la misma madera a precios distintos y reta
        a Dina a elegir el mejor.
      difficulty: 2
      suggested_families:
      - money
      - analyze
    - position: 4
      slug: comprar-para-mi-invento
      micro_objective: Pagar correctamente varios materiales de la lista propia del niño.
      narrative_beat: Con su lista en mano, Dina recorre el mercado pagando cada material que necesita
        para su invento.
      difficulty: 3
      suggested_families:
      - money
      - arrange
  - position: 3
    slug: sumar-el-costo-total
    title_es: Sumar el costo total
    concept: Sumar el precio de todos los materiales muestra cuánto cuesta construir el invento completo.
    learning_objective: Al final, el niño puede calcular el costo total sumando los precios de varios
      materiales.
    key_vocabulary:
    - costo total
    - sumar
    - cuenta
    - ahorro
    prior_knowledge: Puede leer precios individuales de materiales (tema anterior).
    fact_refs:
    - mxn.denominations.coins
    lessons:
    - position: 1
      slug: todos-los-recibos
      micro_objective: Reconocer que el costo total junta el precio de cada material comprado.
      narrative_beat: Dr. Rho guarda los recibos de todo lo comprado en el taller y le muestra a Dino
        cómo se acumulan.
      difficulty: 1
      suggested_families:
      - story
      - analyze
    - position: 2
      slug: sumar-material-por-material
      micro_objective: Sumar el precio de dos o tres materiales para obtener un subtotal.
      narrative_beat: Dina suma, uno por uno, el precio de la madera y las ruedas que compró para su carrito.
      difficulty: 2
      suggested_families:
      - input
      - money
    - position: 3
      slug: el-costo-completo
      micro_objective: Calcular el costo total de un invento con cuatro o más materiales.
      narrative_beat: Dino organiza todos los recibos del taller y calcula cuánto costó en total el invento
        comunitario.
      difficulty: 3
      suggested_families:
      - input
      - arrange
    - position: 4
      slug: cuanto-costo-mi-invento
      micro_objective: Calcular el costo total del invento propio del niño usando su lista de materiales.
      narrative_beat: Dina suma cada material de su lista y anota el costo total de su invento en el cuaderno.
