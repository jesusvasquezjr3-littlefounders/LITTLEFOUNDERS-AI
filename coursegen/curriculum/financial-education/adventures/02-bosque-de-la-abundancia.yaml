schema_version: 1

adventure:
  position: 2
  slug: bosque-de-la-abundancia
  theme: forest
  age_tier: tier1
  title:
    en-US: "The Forest of Plenty"
    es-MX: "El Bosque de la Abundancia"
    pt-BR: "A Floresta da Abundância"
  description:
    en-US: "The crew discovers that effort and small jobs turn into coins — and that earning feels good."
    es-MX: "La tripulación descubre que el esfuerzo y las pequeñas chambitas se convierten en monedas, y que ganarlas se siente bien."
    pt-BR: "A tripulação descobre que o esforço e pequenas tarefinhas se transformam em moedas, e que ganhá-las é gratificante."
  narrative_arc: "El barco llega a un bosque frondoso donde nada aparece solo: los árboles dan frutos si alguien los cuida, y los caminos se abren si alguien los despeja. Dina, Dino, Rho y Zara aprenden que ayudar con esfuerzo — una chambita a la vez — les gana monedas propias, y empiezan a llevar la cuenta de lo que ganan."

sagas:
  - position: 1
    slug: semillas-de-esfuerzo
    icon: eco
    title:
      en-US: "Seeds of Effort"
      es-MX: "Semillas de Esfuerzo"
      pt-BR: "Sementes de Esforço"
    description:
      en-US: "Nothing in the forest grows without effort — the crew learns what work really means."
      es-MX: "Nada en el bosque crece sin esfuerzo: la tripulación aprende qué significa realmente trabajar."
      pt-BR: "Nada na floresta cresce sem esforço: a tripulação aprende o que realmente significa trabalhar."
    topics:
      - position: 1
        slug: hacer-algo-toma-esfuerzo
        title_es: "Hacer algo toma esfuerzo"
        concept: "Para conseguir algo en el bosque, alguien tiene que poner esfuerzo: cargar, cavar, cuidar o cargar cosas."
        learning_objective: "Al final, el niño puede identificar una acción que requiere esfuerzo dentro de una escena."
        key_vocabulary: [esfuerzo, trabajar, cansado, lograr]
        prior_knowledge: "Sabe qué es una moneda y para qué sirve (aventura anterior)."
        fact_refs: []
        lessons:
          - position: 1
            slug: el-arbol-no-crece-solo
            micro_objective: "Reconoce en la historia que un árbol necesita cuidado para dar fruto."
            narrative_beat: "Dina riega un árbol seco del bosque y nota que necesita esfuerzo diario para florecer."
            difficulty: 1
            suggested_families: [story, choice]
          - position: 2
            slug: cual-accion-cuesta-esfuerzo
            micro_objective: "Elige, entre 4 escenas, cuáles muestran una acción que requiere esfuerzo."
            narrative_beat: "Dino compara descansar bajo un árbol con cargar leña, y nota que se sienten distinto."
            difficulty: 1
            suggested_families: [choice]
          - position: 3
            slug: me-canso-un-poquito
            micro_objective: "Reconoce que sentirse cansado después de esforzarse es normal y está bien."
            narrative_beat: "Rho se sienta a descansar tras ayudar a despejar un camino y sonríe satisfecho."
            difficulty: 2
            suggested_families: [story, choice]
          - position: 4
            slug: mi-primer-esfuerzo-del-bosque
            micro_objective: "Elige, dentro de la historia, una acción con esfuerzo que le gustaría intentar."
            narrative_beat: "Zara elige su primera tarea en el bosque: recoger ramitas caídas para el camino."
            difficulty: 2
            suggested_families: [storyplay, choice]
      - position: 2
        slug: ayudar-en-casa-es-un-trabajo
        title_es: "Ayudar en casa es un trabajo"
        concept: "Las tareas que hago en casa, como ordenar o regar plantas, también son un tipo de trabajo con esfuerzo."
        learning_objective: "Al final, el niño puede nombrar una tarea de casa que también cuenta como trabajo."
        key_vocabulary: [tarea de casa, ordenar, ayudar]
        prior_knowledge: "Sabe que hacer algo toma esfuerzo (tema anterior)."
        fact_refs: []
        lessons:
          - position: 1
            slug: tender-la-cama-del-nido
            micro_objective: "Reconoce en la historia una tarea de casa que muestra esfuerzo."
            narrative_beat: "Dino ordena su nido de ramitas antes de salir a explorar el bosque."
            difficulty: 1
            suggested_families: [story, choice]
          - position: 2
            slug: tareas-que-ayudan-en-casa
            micro_objective: "Elige, entre 4 tarjetas, las 2 que muestran tareas de casa."
            narrative_beat: "Zara hace una lista de tareas que ayudan a mantener su cabaña del bosque ordenada."
            difficulty: 1
            suggested_families: [choice]
          - position: 3
            slug: ordeno-mis-tareas-de-hoy
            micro_objective: "Ordena 3 tareas de casa según cuál haría primero."
            narrative_beat: "Rho organiza su mañana: primero ordenar, luego regar, luego barrer el porche del árbol."
            difficulty: 2
            suggested_families: [arrange, choice]
          - position: 4
            slug: cumplo-una-tarea-de-casa
            micro_objective: "Completa una tarea de casa dentro de la historia y describe cómo se sintió."
            narrative_beat: "Dina termina de ordenar su cabaña y se siente orgullosa del resultado."
            difficulty: 2
            suggested_families: [storyplay, choice]
      - position: 3
        slug: diferentes-trabajos-diferentes-esfuerzos
        title_es: "Diferentes trabajos, diferentes esfuerzos"
        concept: "Unos trabajos piden más esfuerzo que otros, y eso no los hace mejores ni peores."
        learning_objective: "Al final, el niño puede comparar dos trabajos y reconocer cuál requiere más esfuerzo."
        key_vocabulary: [más esfuerzo, menos esfuerzo, distinto]
        prior_knowledge: "Reconoce tareas de casa como trabajo (tema anterior)."
        fact_refs: []
        lessons:
          - position: 1
            slug: cargar-lena-o-regar-una-flor
            micro_objective: "Compara dos tareas y reconoce cuál pide más esfuerzo."
            narrative_beat: "Dino compara cargar un tronco pesado con regar una florecita chiquita."
            difficulty: 1
            suggested_families: [story, choice]
          - position: 2
            slug: ordeno-por-esfuerzo
            micro_objective: "Ordena 3 tareas de menor a mayor esfuerzo que requieren."
            narrative_beat: "Rho hace una fila de tareas del bosque, de la más fácil a la más pesada."
            difficulty: 2
            suggested_families: [arrange]
          - position: 3
            slug: ningun-trabajo-es-menos
            micro_objective: "Reconoce que un trabajo pequeño también merece respeto, aunque pida poco esfuerzo."
            narrative_beat: "Zara agradece a Dino por su tarea chiquita tanto como a Rho por la tarea pesada."
            difficulty: 2
            suggested_families: [story, choice]
          - position: 4
            slug: elijo-segun-mi-energia
            micro_objective: "Elige, entre dos tareas, la que más le conviene según cuánta energía tiene hoy en la historia."
            narrative_beat: "Dina elige una tarea ligera porque hoy se siente un poco cansada del viaje."
            difficulty: 2
            suggested_families: [storyplay, choice]
      - position: 4
        slug: trabajar-con-otros
        title_es: "Trabajar con otros"
        concept: "Algunas tareas son más fáciles y divertidas si las hago junto con alguien más: eso es trabajar en equipo."
        learning_objective: "Al final, el niño puede reconocer una escena donde dos personajes trabajan juntos."
        key_vocabulary: [equipo, juntos, ayudarse]
        prior_knowledge: "Compara el esfuerzo de distintos trabajos (tema anterior)."
        fact_refs: []
        lessons:
          - position: 1
            slug: entre-dos-es-mas-facil
            micro_objective: "Reconoce en la historia que un tronco pesado se carga más fácil entre dos."
            narrative_beat: "Dino y Rho cargan juntos un tronco que ninguno podía mover solo."
            difficulty: 1
            suggested_families: [story, choice]
          - position: 2
            slug: quien-trabaja-en-equipo
            micro_objective: "Identifica, entre 4 escenas, cuáles muestran trabajo en equipo."
            narrative_beat: "Zara observa distintos rincones del bosque buscando quién trabaja acompañado."
            difficulty: 1
            suggested_families: [choice]
          - position: 3
            slug: cada-quien-su-parte
            micro_objective: "Empareja 3 tareas en equipo con la parte que le tocaría hacer a cada personaje."
            narrative_beat: "Dina reparte las partes de la tarea: uno junta ramas, otro las amarra, otro las carga."
            difficulty: 2
            suggested_families: [arrange, story]
          - position: 4
            slug: armamos-un-equipo
            micro_objective: "Completa en la historia una tarea grupal repartiendo el esfuerzo entre varios personajes."
            narrative_beat: "Toda la tripulación construye juntos un puente de ramas para cruzar el río del bosque."
            difficulty: 2
            suggested_families: [storyplay, choice]
      - position: 5
        slug: terminar-lo-que-empiezo
        title_es: "Terminar lo que empiezo"
        concept: "Una tarea vale más cuando la termino completa, aunque me tome un poco más de tiempo."
        learning_objective: "Al final, el niño puede reconocer la diferencia entre una tarea terminada y una a medias."
        key_vocabulary: [terminar, a medias, completo]
        prior_knowledge: "Sabe trabajar en equipo (tema anterior)."
        fact_refs: []
        lessons:
          - position: 1
            slug: el-camino-a-medias
            micro_objective: "Reconoce en la historia por qué un camino a medio despejar todavía no sirve."
            narrative_beat: "Dino deja el camino a medio despejar y se distrae persiguiendo una mariposa."
            difficulty: 1
            suggested_families: [story, choice]
          - position: 2
            slug: terminada-o-a-medias
            micro_objective: "Clasifica 4 escenas entre 'tarea terminada' y 'tarea a medias'."
            narrative_beat: "Rho revisa varias tareas del bosque y anota cuáles quedaron completas."
            difficulty: 1
            suggested_families: [choice]
          - position: 3
            slug: regreso-a-terminar
            micro_objective: "Ordena los pasos de una historia donde el personaje regresa a terminar su tarea."
            narrative_beat: "Zara le recuerda a Dino que puede volver y terminar el camino que dejó a medias."
            difficulty: 2
            suggested_families: [arrange, story]
          - position: 4
            slug: mi-tarea-completa
            micro_objective: "Completa en la historia una tarea de inicio a fin sin dejarla a medias."
            narrative_beat: "Dino regresa, termina de despejar el camino y lo cruza orgulloso junto a sus amigos."
            difficulty: 2
            suggested_families: [storyplay, choice]
      - position: 6
        slug: me-siento-orgulloso-de-mi-trabajo
        title_es: "Me siento orgulloso de mi trabajo"
        concept: "Cuando termino una tarea con esfuerzo, siento una alegría especial: eso es sentirse orgulloso."
        learning_objective: "Al final, el niño puede describir cómo se siente al terminar una tarea con esfuerzo propio."
        key_vocabulary: [orgulloso, alegría, logré]
        prior_knowledge: "Sabe terminar una tarea de principio a fin (tema anterior)."
        fact_refs: []
        lessons:
          - position: 1
            slug: lo-logre-yo-solo
            micro_objective: "Reconoce en la historia el momento en que un personaje se siente orgulloso de su logro."
            narrative_beat: "Rho termina de construir su primer refugio de ramas y sonríe mirando su obra."
            difficulty: 1
            suggested_families: [story, choice]
          - position: 2
            slug: caras-de-orgullo
            micro_objective: "Elige, entre 4 expresiones, cuál muestra a un personaje sintiéndose orgulloso."
            narrative_beat: "Zara compara distintas caras de la tripulación después de terminar sus tareas."
            difficulty: 1
            suggested_families: [choice]
          - position: 3
            slug: celebro-mi-esfuerzo
            micro_objective: "Elige la forma más sana de celebrar un logro propio, entre 3 opciones."
            narrative_beat: "Dino salta de alegría al terminar su tarea, y sus amigos celebran con él."
            difficulty: 2
            suggested_families: [choice, storyplay]
          - position: 4
            slug: semillas-de-esfuerzo-repaso
            micro_objective: "Explica en una frase qué tarea de esta saga le hizo sentir más orgulloso."
            narrative_beat: "Dina reúne a la tripulación para que cada quien cuente su tarea favorita del bosque."
            difficulty: 2
            suggested_families: [story, choice]
      - position: 7
        slug: cofre-del-repaso-de-las-semillas
        title_es: "El Cofre del Repaso de las Semillas"
        concept: "Antes de seguir con las chambitas, la tripulación abre el cofre de recuerdos y repasa lo aprendido sobre el esfuerzo."
        learning_objective: "Al final, el niño recuerda y usa, sin nueva enseñanza, los conceptos de esfuerzo, equipo y orgullo de esta saga."
        key_vocabulary: [esfuerzo, equipo, terminar, orgulloso]
        prior_knowledge: "Completó los 6 temas de Semillas de Esfuerzo."
        fact_refs: []
        kind: review_spaced
        review_of:
          - bosque-de-la-abundancia/semillas-de-esfuerzo/hacer-algo-toma-esfuerzo
          - bosque-de-la-abundancia/semillas-de-esfuerzo/ayudar-en-casa-es-un-trabajo
          - bosque-de-la-abundancia/semillas-de-esfuerzo/diferentes-trabajos-diferentes-esfuerzos
          - bosque-de-la-abundancia/semillas-de-esfuerzo/trabajar-con-otros
          - bosque-de-la-abundancia/semillas-de-esfuerzo/terminar-lo-que-empiezo
          - bosque-de-la-abundancia/semillas-de-esfuerzo/me-siento-orgulloso-de-mi-trabajo
        lessons:
          - position: 1
            slug: recuerdo-mi-primer-esfuerzo
            micro_objective: "Recuerda y nombra, sin ayuda, una acción que le costó esfuerzo al inicio del bosque."
            narrative_beat: "Rho abre el cofre de recuerdos del bosque y encuentra la primera ramita que cargó con esfuerzo."
            difficulty: 1
            suggested_families: [story, choice]
          - position: 2
            slug: recuerdo-una-tarea-de-equipo
            micro_objective: "Recuerda y describe, sin ayuda, una tarea que hizo en equipo durante esta saga."
            narrative_beat: "Zara recuerda el tronco pesado que cargó junto a Dino entre los dos."
            difficulty: 1
            suggested_families: [story, choice]
          - position: 3
            slug: elijo-el-recuerdo-de-mas-orgullo
            micro_objective: "Elige, entre 3 recuerdos del cofre, cuál le dio más orgullo terminar."
            narrative_beat: "Dino compara tres recuerdos guardados y elige cuál tarea terminada lo hizo sentir más orgulloso."
            difficulty: 2
            suggested_families: [choice, storyplay]
          - position: 4
            slug: cierro-el-cofre-de-las-semillas
            micro_objective: "Aplica sin ayuda lo recordado: explica por qué terminar una tarea completa vale más que dejarla a medias."
            narrative_beat: "Dina cierra el cofre de las semillas de esfuerzo, lista para las chambitas que vienen."
            difficulty: 2
            suggested_families: [story, choice]
      - position: 8
        slug: reto-entrelazado-de-las-semillas
        title_es: "Reto Entrelazado de las Semillas"
        concept: "Mezclamos lo aprendido sobre el esfuerzo del bosque con lo aprendido sobre los trueques justos del archipiélago."
        learning_objective: "Al final, el niño combina, sin nueva enseñanza, ideas sobre trueques justos con ideas sobre esfuerzo y trabajo en equipo."
        key_vocabulary: [esfuerzo, trueque, justo, equipo]
        prior_knowledge: "Completó El Cofre del Repaso de las Semillas (tema anterior) y El Archipiélago del Trueque (aventura anterior)."
        fact_refs: []
        kind: review_interleaved
        review_of:
          - archipielago-del-trueque/islas-de-los-deseos/es-un-buen-cambio
          - bosque-de-la-abundancia/semillas-de-esfuerzo/trabajar-con-otros
          - bosque-de-la-abundancia/semillas-de-esfuerzo/terminar-lo-que-empiezo
        lessons:
          - position: 1
            slug: el-trueque-justo-y-el-trabajo-en-equipo
            micro_objective: "Compara la idea de un trueque justo del archipiélago con la idea de trabajar en equipo del bosque."
            narrative_beat: "Rho recuerda que un buen trueque deja contentas a las dos partes, igual que un buen trabajo en equipo."
            difficulty: 2
            suggested_families: [story, choice]
          - position: 2
            slug: ambos-quedan-contentos
            micro_objective: "Reconoce, mezclando ambos temas, que un trueque justo y una tarea en equipo se sienten parecido: los dos quedan contentos."
            narrative_beat: "Zara compara cómo se sintieron los isleños tras un buen trueque con cómo se sienten Dino y Rho tras cargar el tronco juntos."
            difficulty: 2
            suggested_families: [choice]
          - position: 3
            slug: termino-mi-parte-del-trato
            micro_objective: "Ordena, combinando ambas ideas, los pasos de cumplir su parte en un trueque y en un trabajo en equipo."
            narrative_beat: "Dino ordena en su mente cómo cumplir su palabra, ya sea en un trueque o en una tarea compartida."
            difficulty: 2
            suggested_families: [arrange, story]
          - position: 4
            slug: mi-esfuerzo-tambien-es-justo
            micro_objective: "Explica, sin ayuda, por qué poner esfuerzo propio en una tarea es tan justo como ofrecer algo justo en un trueque."
            narrative_beat: "Dina cierra el reto entrelazado comparando su esfuerzo de hoy con los trueques justos del archipiélago."
            difficulty: 2
            suggested_families: [storyplay, choice]

  - position: 2
    slug: chambitas-del-bosque
    icon: task_alt
    title:
      en-US: "Little Jobs of the Forest"
      es-MX: "Chambitas del Bosque"
      pt-BR: "Tarefinhas da Floresta"
    description:
      en-US: "The crew takes on their first small jobs, at home and around the forest."
      es-MX: "La tripulación toma sus primeras chambitas, en casa y por todo el bosque."
      pt-BR: "A tripulação assume suas primeiras tarefinhas, em casa e por toda a floresta."
    topics:
      - position: 1
        slug: que-es-una-chambita
        title_es: "Qué es una chambita"
        concept: "Una chambita es una tarea pequeña que hago con esfuerzo y que alguien me pide o yo mismo elijo hacer."
        learning_objective: "Al final, el niño puede explicar con sus palabras qué es una chambita."
        key_vocabulary: [chambita, tarea pequeña, pedir ayuda]
        prior_knowledge: "Sabe qué significa esforzarse y sentirse orgulloso (saga anterior)."
        fact_refs: []
        lessons:
          - position: 1
            slug: la-primera-chambita
            micro_objective: "Reconoce en la historia el momento en que a un personaje le piden una chambita."
            narrative_beat: "Un ave del bosque le pide a Dina que le ayude a juntar ramitas para su nido."
            difficulty: 1
            suggested_families: [story, choice]
          - position: 2
            slug: eso-es-una-chambita
            micro_objective: "Distingue, entre 4 escenas, cuáles muestran una chambita y cuáles solo un juego."
            narrative_beat: "Dino compara jugar a perseguir mariposas con ayudar a cargar frutos: solo una es una chambita."
            difficulty: 1
            suggested_families: [choice]
          - position: 3
            slug: chambitas-grandes-y-chicas
            micro_objective: "Ordena 3 chambitas de la más chica a la más grande según el esfuerzo que piden."
            narrative_beat: "Rho hace una lista de chambitas del bosque, de la más rápida a la más larga."
            difficulty: 2
            suggested_families: [arrange]
          - position: 4
            slug: elijo-mi-primera-chambita
            micro_objective: "Elige, entre 3 opciones, la chambita que le gustaría hacer primero en la historia."
            narrative_beat: "Zara revisa el tablón de chambitas del bosque y elige su primera tarea."
            difficulty: 2
            suggested_families: [storyplay, choice]
      - position: 2
        slug: chambitas-en-mi-casa
        title_es: "Chambitas en mi casa"
        concept: "En casa también hay chambitas: tender la cama, guardar juguetes o ayudar a poner la mesa."
        learning_objective: "Al final, el niño puede nombrar 2 chambitas que podría hacer en su propia casa."
        key_vocabulary: [chambita de casa, tender, guardar]
        prior_knowledge: "Sabe qué es una chambita (tema anterior)."
        fact_refs: []
        lessons:
          - position: 1
            slug: chambitas-dentro-de-la-cabana
            micro_objective: "Reconoce en la historia una chambita que ocurre dentro de una casa o cabaña."
            narrative_beat: "Dina ayuda a ordenar la cabaña del árbol antes de que llegue la lluvia."
            difficulty: 1
            suggested_families: [story, choice]
          - position: 2
            slug: elijo-chambitas-de-casa
            micro_objective: "Elige, entre 4 tarjetas, las que muestran chambitas típicas de casa."
            narrative_beat: "Rho hace una lista de posibles chambitas para ayudar en su propia cabaña."
            difficulty: 1
            suggested_families: [choice]
          - position: 3
            slug: mi-semana-de-chambitas-en-casa
            micro_objective: "Ordena 4 chambitas de casa en el orden en que las haría durante la semana."
            narrative_beat: "Zara planea sus chambitas de casa para toda la semana en un calendario de hojas."
            difficulty: 2
            suggested_families: [arrange]
          - position: 4
            slug: cumplo-una-chambita-de-casa
            micro_objective: "Completa una chambita de casa dentro de la historia siguiendo los pasos correctos."
            narrative_beat: "Dino tiende su nido de hojas siguiendo cada paso que le enseñó Dina."
            difficulty: 2
            suggested_families: [storyplay, choice]
      - position: 3
        slug: chambitas-para-mis-vecinos
        title_es: "Chambitas para mis vecinos"
        concept: "También puedo ayudar con pequeñas chambitas a los vecinos del bosque, siempre con permiso de un adulto."
        learning_objective: "Al final, el niño puede reconocer una chambita segura y apropiada para ayudar a un vecino."
        key_vocabulary: [vecino, ayudar, con permiso]
        prior_knowledge: "Sabe hacer chambitas en su propia casa (tema anterior)."
        fact_refs: []
        lessons:
          - position: 1
            slug: ayudo-al-vecino-ardilla
            micro_objective: "Reconoce en la historia una chambita segura hecha para ayudar a un vecino."
            narrative_beat: "Una ardilla vecina le pide a Rho ayuda para juntar bellotas antes del invierno."
            difficulty: 1
            suggested_families: [story, choice]
          - position: 2
            slug: pido-permiso-primero
            micro_objective: "Reconoce que antes de ayudar a un vecino, primero se pide permiso a un adulto de confianza."
            narrative_beat: "Zara le pregunta a Dina si está bien ayudar a la familia búho con su nido."
            difficulty: 1
            suggested_families: [story, choice]
          - position: 3
            slug: chambitas-seguras-para-vecinos
            micro_objective: "Elige, entre 4 opciones, cuáles chambitas para vecinos son seguras y apropiadas para su edad."
            narrative_beat: "Dino revisa distintas peticiones del bosque y elige solo las que le parecen seguras."
            difficulty: 2
            suggested_families: [choice]
          - position: 4
