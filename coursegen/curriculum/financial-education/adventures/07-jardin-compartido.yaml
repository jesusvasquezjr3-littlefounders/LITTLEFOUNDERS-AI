schema_version: 1
adventure:
  position: 7
  slug: jardin-compartido
  theme: forest
  age_tier: tier2
  title:
    en-US: The Shared Garden
    es-MX: El Jardín Compartido
    pt-BR: O Jardim Compartilhado
  description:
    en-US: In a forest community garden, Dina and Liruf discover the joy of giving, cooperating, and caring
      together for what belongs to everyone.
    es-MX: En un jardín comunitario del bosque, Dina y Liruf descubren la alegría de dar, cooperar y cuidar
      juntos lo que es de todos.
    pt-BR: Em um jardim comunitário da floresta, Dina e Liruf descobrem a alegria de doar, cooperar e cuidar
      juntos do que é de todos.
  narrative_arc: Dina y Liruf regresan al bosque de la abundancia y encuentran un jardín comunitario cuidado
    por muchas familias. Dr. Rho les explica cómo cada quien aporta una parte pequeña para mantener funcionando
    lo que todos comparten —agua, caminos, un puente— mientras Zara Vex organiza una gran fiesta comunitaria
    para celebrar lo logrado juntos.
sagas:
- position: 1
  slug: dar-con-el-corazon
  icon: volunteer_activism
  title:
    en-US: Giving from the Heart
    es-MX: Dar con el Corazón
    pt-BR: Doar com o Coração
  description:
    en-US: Discover the many ways to give and the joy of helping others.
    es-MX: Descubre las muchas formas de dar y la alegría de ayudar a otros.
    pt-BR: Descubra as muitas formas de doar e a alegria de ajudar os outros.
  topics:
  - position: 1
    slug: que-significa-dar
    title_es: Qué significa dar
    concept: Dar es entregar algo propio —tiempo, cosas o dinero— para ayudar a otra persona sin esperar
      un pago a cambio.
    learning_objective: Al final, el niño puede explicar con sus palabras qué significa dar.
    key_vocabulary:
    - dar
    - ayudar
    - compartir
    - generosidad
    prior_knowledge: Conoce el frasco de compartir (aventura 3).
    parent_check: "¿{{name}} puede explicarte con sus palabras qué significa dar?"
    fact_refs: []
    lessons:
    - position: 1
      slug: el-jardin-del-bosque
      micro_objective: Reconocer una escena donde alguien da algo a otra persona sin recibir un pago.
      narrative_beat: Dina y Liruf regresan al bosque de la abundancia y encuentran un jardín donde varias
        familias trabajan juntas sin cobrarse entre sí.
      difficulty: 1
      suggested_families:
      - story
      - choice
    - position: 2
      slug: dar-no-es-solo-dinero
      micro_objective: Reconocer que dar puede ser dinero, cosas o tiempo, no solo monedas.
      narrative_beat: 'Dr. Rho muestra tres formas en que los vecinos del jardín ayudaron esa semana:
        una regó plantas, otra prestó herramientas, otra dio semillas.'
      difficulty: 2
      suggested_families:
      - story
      - choice
    - position: 3
      slug: dar-vs-vender
      micro_objective: Distinguir un acto de dar de un intercambio de compra-venta.
      narrative_beat: Zara Vex compara la tienda del mercado con el jardín compartido y pregunta a Liruf
        qué diferencia nota.
      difficulty: 2
      suggested_families:
      - choice
      - analyze
    - position: 4
      slug: mi-idea-de-dar
      micro_objective: Proponer un ejemplo propio de qué le gustaría dar a alguien del jardín.
      narrative_beat: Dina piensa en algo que podría dar esta semana a una familia del jardín compartido.
      difficulty: 3
      suggested_families:
      - choice
      - story
  - position: 2
    slug: dar-tiempo-cosas-dinero
    title_es: Dar tiempo, dar cosas, dar dinero
    concept: 'Existen varias formas de dar: regalar tiempo ayudando, entregar objetos útiles, o compartir
      dinero.'
    learning_objective: Al final, el niño puede clasificar un ejemplo de dar como tiempo, cosas o dinero.
    key_vocabulary:
    - tiempo
    - objeto
    - dinero
    - formas de dar
    prior_knowledge: Sabe qué significa dar (tema anterior).
    parent_check: "¿{{name}} puede darte un ejemplo de dar tiempo, dar cosas y dar dinero?"
    fact_refs: []
    lessons:
    - position: 1
      slug: tres-formas-en-el-jardin
      micro_objective: Observar tres ejemplos distintos de dar (tiempo, cosas, dinero) en el jardín.
      narrative_beat: Liruf ayuda a cargar agua (tiempo), Dina entrega una pala vieja (cosas), y un vecino
        deja monedas para semillas nuevas (dinero).
      difficulty: 1
      suggested_families:
      - story
      - choice
    - position: 2
      slug: clasificar-formas-de-dar
      micro_objective: Clasificar varios ejemplos de dar según sean tiempo, cosas o dinero.
      narrative_beat: Dr. Rho reparte tarjetas con distintas ayudas del jardín y pide a Dina ordenarlas
        en tres grupos.
      difficulty: 2
      suggested_families:
      - arrange
      - choice
    - position: 3
      slug: que-puedo-dar-yo
      micro_objective: Identificar qué tipo de dar (tiempo, cosas o dinero) tiene más sentido según la
        situación de una persona.
      narrative_beat: Zara Vex pregunta a Liruf qué daría él si no tuviera monedas mensuales pero sí tiempo
        libre por la tarde.
      difficulty: 2
      suggested_families:
      - choice
      - analyze
    - position: 4
      slug: mi-combinacion-de-dar
      micro_objective: Proponer una combinación propia de tiempo, cosas o dinero para ayudar a una situación
        dada del jardín.
      narrative_beat: Dina decide dar parte de su tiempo y una herramienta vieja para ayudar a reparar
        la cerca del jardín.
      difficulty: 3
      suggested_families:
      - choice
      - storyplay
  - position: 3
    slug: elegir-a-quien-ayudar
    title_es: Elegir a quién ayudar
    concept: Elegir a quién ayudar con lo que se tiene para dar depende de quién lo necesita más en ese
      momento.
    learning_objective: Al final, el niño puede elegir, entre varias necesidades, a quién ayudar primero
      con una razón simple.
    key_vocabulary:
    - necesitar
    - elegir
    - prioridad
    - ayudar
    prior_knowledge: Reconoce formas distintas de dar (tema anterior).
    parent_check: "Si le presentas dos necesidades distintas, ¿{{name}} puede elegir a quién ayudaría primero y por qué?"
    fact_refs: []
    lessons:
    - position: 1
      slug: varias-necesidades-en-el-jardin
      micro_objective: Observar varias necesidades distintas presentes al mismo tiempo en el jardín.
      narrative_beat: En el jardín, una planta se está secando, un vecino busca ayuda para cargar leña,
        y una familia nueva no tiene herramientas.
      difficulty: 1
      suggested_families:
      - story
      - choice
    - position: 2
      slug: cual-necesita-mas
      micro_objective: Comparar dos necesidades y decidir cuál requiere ayuda con más urgencia.
      narrative_beat: Dr. Rho compara la planta a punto de secarse con la leña que puede esperar un día
        más.
      difficulty: 2
      suggested_families:
      - analyze
      - choice
    - position: 3
      slug: ayudar-con-lo-que-tengo
      micro_objective: Elegir a quién ayudar considerando lo que uno mismo tiene disponible para dar.
      narrative_beat: Zara Vex le recuerda a Liruf que solo tiene un poco de tiempo libre, así que debe
        elegir bien a quién ayudar hoy.
      difficulty: 3
      suggested_families:
      - choice
      - analyze
    - position: 4
      slug: mi-decision-de-ayuda
      micro_objective: Decidir, con una razón propia, a quién ayudar primero entre varias necesidades
        del jardín.
      narrative_beat: Dina revisa las necesidades del jardín esa tarde y decide, con su propia razón,
        a quién ayudará primero.
      difficulty: 3
      suggested_families:
      - choice
      - storyplay
  - position: 4
    slug: cuanto-puedo-dar-sin-quedarme-sin-nada
    title_es: Cuánto puedo dar sin quedarme sin nada
    concept: Dar generosamente no significa darlo todo; guardar una parte para uno mismo también es importante.
    learning_objective: Al final, el niño puede decidir cuánto dar sin comprometer sus propias necesidades.
    key_vocabulary:
    - límite
    - equilibrio
    - guardar
    - dar
    prior_knowledge: Conoce los frascos de ahorrar, gastar y compartir (aventura 3).
    parent_check: "¿{{name}} puede explicarte por qué no conviene dar todo lo que tiene, sino guardar también una parte?"
    fact_refs: []
    lessons:
    - position: 1
      slug: dar-todo-el-frasco
      micro_objective: Reconocer qué pasa si alguien da todo lo que tiene sin guardar nada para sí mismo.
      narrative_beat: Liruf, muy generoso, quiere vaciar todo su frasco de compartir en el jardín, y Dr.
        Rho le pregunta qué le quedará a él.
      difficulty: 1
      suggested_families:
      - story
      - choice
    - position: 2
      slug: una-parte-para-cada-cosa
      micro_objective: Reconocer que el frasco de compartir tiene un límite razonable, distinto del de
        ahorrar y gastar.
      narrative_beat: Dr. Rho recuerda a Dina que cada frasco —ahorrar, gastar, compartir— tiene su propia
        parte, y dar demasiado de uno afecta a los otros.
      difficulty: 2
      suggested_families:
      - money
      - choice
    - position: 3
      slug: decidir-un-limite-justo
      micro_objective: Elegir, entre varias cantidades, una que sea generosa pero razonable para dar según
        el frasco disponible.
      narrative_beat: Zara Vex presenta tres cantidades distintas del frasco de compartir y pregunta cuál
        es razonable dar esta semana.
      difficulty: 3
      suggested_families:
      - money
      - choice
    - position: 4
      slug: mi-limite-de-dar
      micro_objective: Repartir el frasco de compartir propio entre una donación al jardín y lo que se
        guarda para más adelante.
      narrative_beat: 'Dina reparte su frasco de compartir: una parte va al jardín esta semana, y el resto
        se queda guardado para la próxima.'
      difficulty: 3
      suggested_families:
      - money
      - storyplay
  - position: 5
    slug: dar-sin-esperar-algo-a-cambio
    title_es: Dar sin esperar algo a cambio
    concept: Dar de verdad significa ayudar sin exigir ni esperar que la otra persona devuelva el favor
      de inmediato.
    learning_objective: Al final, el niño puede distinguir dar sinceramente de dar esperando algo a cambio.
    key_vocabulary:
    - sincero
    - esperar
    - favor
    - generosidad
    prior_knowledge: Ha decidido cuánto dar con un límite razonable (tema anterior).
    parent_check: "¿{{name}} puede explicarte la diferencia entre ayudar sin esperar nada y ayudar esperando algo a cambio?"
    fact_refs: []
    lessons:
    - position: 1
      slug: el-favor-con-condicion
      micro_objective: Reconocer la diferencia entre ayudar sinceramente y ayudar solo para recibir algo
        a cambio.
      narrative_beat: Un vecino del jardín ayuda a otro solo porque espera que le devuelvan el favor mañana
        mismo; Liruf nota que se siente distinto a dar de verdad.
      difficulty: 1
      suggested_families:
      - story
      - choice
    - position: 2
      slug: como-se-siente-dar-de-verdad
      micro_objective: Comparar cómo se siente dar sin condiciones frente a dar esperando algo a cambio.
      narrative_beat: Dr. Rho pregunta a Dina cómo se sintió cuando ayudó a cargar agua sin que nadie
        se lo pidiera devolver.
      difficulty: 2
      suggested_families:
      - choice
      - story
    - position: 3
      slug: reconocer-el-dar-sincero
      micro_objective: Identificar, en varios ejemplos, cuáles muestran dar sincero y cuáles dar con condición.
      narrative_beat: Zara Vex presenta cuatro escenas del jardín y reta a Liruf a identificar cuáles son
        actos de dar sincero.
      difficulty: 2
      suggested_families:
      - analyze
      - choice
    - position: 4
      slug: mi-forma-de-dar
      micro_objective: Practicar un acto de dar sin esperar nada a cambio dentro de una historia del jardín.
      narrative_beat: Dina ayuda a una familia nueva del jardín sin decir nada a nadie, solo por el gusto
        de ayudar.
      difficulty: 3
      suggested_families:
      - storyplay
      - choice
  - position: 6
    slug: la-alegria-de-compartir
    title_es: La alegría de compartir
    concept: Dar y compartir generan una alegría propia, además de ayudar a quien recibe.
    learning_objective: Al final, el niño puede describir cómo se siente dar algo a alguien más.
    key_vocabulary:
    - alegría
    - compartir
    - sentir
    - gratitud
    prior_knowledge: Ha practicado dar sin esperar algo a cambio (tema anterior).
    parent_check: "¿{{name}} puede contarte cómo se siente cuando ayuda a alguien más?"
    fact_refs: []
    lessons:
    - position: 1
      slug: la-sonrisa-del-jardin
      micro_objective: Observar la reacción de alegría de alguien que recibe ayuda genuina.
      narrative_beat: La familia nueva del jardín sonríe agradecida cuando recibe las herramientas que
        Liruf les compartió.
      difficulty: 1
      suggested_families:
      - story
      - choice
    - position: 2
      slug: como-me-siento-al-dar
      micro_objective: Describir con una palabra o frase corta cómo se siente dar algo a alguien más.
      narrative_beat: Dr. Rho pregunta a Dina cómo se sintió por dentro después de ayudar en el jardín
        esta semana.
      difficulty: 2
      suggested_families:
      - choice
      - story
    - position: 3
      slug: compartir-en-equipo
      micro_objective: Reconocer que compartir en grupo puede generar una alegría distinta a compartir
        solo.
      narrative_beat: Todo el jardín se reúne para compartir la primera cosecha juntos, y Zara Vex nota
        que la alegría se siente más grande en grupo.
      difficulty: 2
      suggested_families:
      - story
      - choice
    - position: 4
      slug: mi-momento-de-compartir
      micro_objective: Reflexionar sobre un acto de dar propio y su efecto tanto en quien recibió como
        en quien dio.
      narrative_beat: Al final del día, Dina recuerda todo lo que dio en el jardín esta saga y cómo eso
        la hizo sentir parte de algo más grande.
      difficulty: 3
      suggested_families:
      - story
      - storyplay
  - position: 7
    slug: donar-con-criterio
    title_es: Donar con criterio
    concept: Antes de donar, pensar a dónde va la ayuda y si de verdad llega a quien la necesita hace que dar sea más efectivo.
    learning_objective: Al final, el niño puede explicar al menos una pregunta que conviene hacerse antes de donar algo a una causa.
    key_vocabulary:
    - donar
    - criterio
    - confiable
    - verificar
    prior_knowledge: Sabe distinguir dar sincero de dar con condición (aventura 7, saga 1).
    parent_check: "¿{{name}} puede explicarte una pregunta que se haría antes de donar algo, para saber si de verdad ayuda?"
    fact_refs: []
    lessons:
    - position: 1
      slug: dos-canastas-para-donar
      micro_objective: Observar dos formas distintas de donar, una sin pensarlo y otra revisando a dónde va la ayuda.
      narrative_beat: En el jardín, Liruf ve dos canastas de donación, una organizada por Dr. Rho, con destino claro, y otra sin nadie a cargo.
      difficulty: 1
      suggested_families:
      - story
      - choice
    - position: 2
      slug: a-donde-va-mi-donacion
      micro_objective: Identificar a dónde llega una donación antes de decidir entregarla.
      narrative_beat: Dr. Rho muestra a Dina que la canasta organizada del jardín llega directo a una familia que necesita semillas.
      difficulty: 2
      suggested_families:
      - story
      - analyze
    - position: 3
      slug: preguntas-antes-de-donar
      micro_objective: Aplicar dos preguntas simples sobre a dónde va y si de verdad ayuda antes de decidir dónde donar.
      narrative_beat: Zara Vex enseña a Liruf dos preguntas rápidas para hacerse antes de dejar algo en cualquier canasta de donación.
      difficulty: 2
      suggested_families:
      - choice
      - storyplay
    - position: 4
      slug: mi-donacion-pensada
      micro_objective: Decidir, aplicando las preguntas aprendidas, dónde donar una parte del frasco de compartir propio.
      narrative_beat: Dina revisa las dos canastas del jardín y elige, con una razón clara, dónde dejar su donación esta semana.
      difficulty: 3
      suggested_families:
      - choice
      - money
  - position: 8
    slug: elegir-una-causa-que-me-importa
    title_es: Elegir una causa que me importa
    concept: Dar con más ganas y constancia ocurre cuando la causa elegida se conecta con algo que de verdad le importa a quien dona.
    learning_objective: Al final, el niño puede nombrar una causa propia que le gustaría apoyar y explicar por qué le importa.
    key_vocabulary:
    - causa
    - importar
    - apoyar
    - elegir
    prior_knowledge: Ha practicado donar pensando a dónde va la ayuda (tema anterior).
    parent_check: "¿{{name}} puede contarte una causa que le importa y por qué le gustaría apoyarla?"
    fact_refs: []
    lessons:
    - position: 1
      slug: muchas-causas-en-el-jardin
      micro_objective: Observar varias causas distintas que existen en el jardín y el bosque, como animales, plantas o familias nuevas.
      narrative_beat: Dr. Rho muestra un mural con varias causas del bosque, como cuidar animales, sembrar árboles y ayudar a familias nuevas.
      difficulty: 1
      suggested_families:
      - story
      - choice
    - position: 2
      slug: cual-me-mueve-mas
      micro_objective: Comparar dos causas distintas y reconocer cuál conecta más con los propios intereses.
      narrative_beat: Zara Vex pregunta a Liruf cuál de las causas del mural le hace sentir más ganas de ayudar, y por qué.
      difficulty: 2
      suggested_families:
      - choice
      - analyze
    - position: 3
      slug: por-que-me-importa
      micro_objective: Explicar con una razón propia por qué una causa elegida le importa más que otras.
      narrative_beat: Dina explica a Dr. Rho por qué cuidar a los animales del bosque es la causa que más le importa a ella.
      difficulty: 2
      suggested_families:
      - choice
      - story
    - position: 4
      slug: mi-causa-elegida
      micro_objective: Elegir una causa personal propia y proponer una forma concreta de apoyarla.
      narrative_beat: Dina elige su causa del jardín y decide, con una idea propia, cómo la apoyará esta temporada.
      difficulty: 3
      suggested_families:
      - choice
      - storyplay
  - position: 9
    slug: el-cofre-del-repaso
    kind: review_spaced
    title_es: El Cofre del Repaso
    concept: Zara Vex abre un cofre de semillas del jardín para poner a prueba, sin enseñar nada nuevo, todo lo aprendido en la saga Dar con el Corazón.
    learning_objective: Al final, el niño puede recordar y aplicar, sin ayuda nueva, los conceptos principales de la saga Dar con el Corazón.
    key_vocabulary:
    - dar
    - tiempo
    - necesitar
    - límite
    prior_knowledge: Ha completado los seis temas de la saga Dar con el Corazón (aventura 7, saga 1).
    fact_refs: []
    review_of:
    - jardin-compartido/dar-con-el-corazon/que-significa-dar
    - jardin-compartido/dar-con-el-corazon/dar-tiempo-cosas-dinero
    - jardin-compartido/dar-con-el-corazon/elegir-a-quien-ayudar
    - jardin-compartido/dar-con-el-corazon/cuanto-puedo-dar-sin-quedarme-sin-nada
    - jardin-compartido/dar-con-el-corazon/dar-sin-esperar-algo-a-cambio
    - jardin-compartido/dar-con-el-corazon/la-alegria-de-compartir
    - jardin-compartido/dar-con-el-corazon/donar-con-criterio
    - jardin-compartido/dar-con-el-corazon/elegir-una-causa-que-me-importa
    lessons:
    - position: 1
      slug: el-cofre-se-abre
      micro_objective: Recordar, sin ayuda nueva, cómo explicar qué significa dar y cómo clasificar dar en tiempo, cosas o dinero.
      narrative_beat: Zara Vex abre un cofre de semillas del jardín y reta a Dina a recordar, tarjeta por tarjeta, lo primero que aprendió en esta saga.
      difficulty: 1
      suggested_families:
      - story
      - choice
    - position: 2
      slug: recordar-en-orden
      micro_objective: Recordar y ordenar de nuevo cómo elegir a quién ayudar primero y cómo decidir cuánto dar sin comprometer lo propio.
      narrative_beat: Liruf saca del cofre las tarjetas mezcladas de la saga y las ordena de memoria, sin que Dr. Rho le dé ninguna pista nueva.
      difficulty: 1
      suggested_families:
      - arrange
      - choice
    - position: 3
      slug: aplicar-lo-guardado
      micro_objective: Aplicar de nuevo, en una escena distinta, lo aprendido sobre distinguir dar sincero de dar con condición.
      narrative_beat: Dr. Rho presenta una escena nueva del jardín y pregunta a Dina si recuerda, sin repasar la lección, qué haría en ese caso.
      difficulty: 2
      suggested_families:
      - choice
      - story
    - position: 4
      slug: cerrar-el-cofre
      micro_objective: Aplicar en conjunto todo lo repasado de la saga, incluyendo cómo describir cómo se siente dar algo a alguien más, para cerrar el cofre.
      narrative_beat: Antes de cerrar el cofre, Dina demuestra que recuerda toda la saga uniendo cada tarjeta con la lección que le corresponde.
      difficulty: 2
      suggested_families:
      - choice
      - storyplay
  - position: 10
    slug: reto-entrelazado
    kind: review_interleaved
    title_es: Reto Entrelazado
    concept: Zara Vex mezcla lo aprendido en Dar con el Corazón con ideas de aventuras anteriores en un reto que combina ambos mundos.
    learning_objective: Al final, el niño puede recordar y combinar un concepto de Dar con el Corazón con un concepto de una aventura anterior.
    key_vocabulary:
    - recordar
    - combinar
    - aplicar
    - dar
    prior_knowledge: Conoce Dar con el Corazón (aventura 7) y las lecciones citadas de aventuras anteriores.
    fact_refs: []
    review_of:
    - taller-de-los-inventores/dia-de-mercado/guardar-las-ganancias
    - bosque-de-la-abundancia/el-circulo-de-dar-y-recibir/un-trabajo-ayuda-a-alguien-mas
    lessons:
    - position: 1
      slug: un-recuerdo-de-otro-mundo
      micro_objective: Recordar, tal como se aprendió antes, el concepto de una aventura anterior citado en este reto.
      narrative_beat: Zara Vex trae un recuerdo de un mundo anterior y pide a Liruf recordarlo sin ayuda, antes de mezclarlo con el jardín.
      difficulty: 2
      suggested_families:
      - choice
      - story
    - position: 2
      slug: unir-los-dos-mundos
      micro_objective: Combinar el concepto recordado de una aventura anterior con lo aprendido en Dar con el Corazón.
      narrative_beat: Dr. Rho muestra cómo esa lección de otro mundo se conecta directamente con lo que Dina aprendió en Dar con el Corazón.
      difficulty: 2
      suggested_families:
      - choice
      - analyze
    - position: 3
      slug: practicar-el-entrelazado
      micro_objective: Aplicar juntos, en una escena nueva, ambos conceptos combinados.
