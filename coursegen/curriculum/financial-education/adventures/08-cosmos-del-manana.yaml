schema_version: 1
adventure:
  position: 8
  slug: cosmos-del-manana
  theme: cosmos
  age_tier: tier2
  title:
    en-US: Tomorrow's Cosmos
    es-MX: El Cosmos del Mañana
    pt-BR: O Cosmos do Amanhã
  description:
    en-US: Aboard Dr. Rho's ship, Dina, Dino, and Zara Vex revisit everything they've learned and build
      their own founder plan for the future.
    es-MX: A bordo de la nave de Dr. Rho, Dina, Dino y Zara Vex repasan todo lo aprendido y construyen
      su propio plan de founder hacia el futuro.
    pt-BR: A bordo da nave do Dr. Rho, Dina, Dino e Zara Vex revisitam tudo o que aprenderam e constroem
      seu próprio plano de founder para o futuro.
  narrative_arc: 'Dr. Rho revela una nave con forma de cosmos que lleva a Dina, Dino y Zara Vex de vuelta
    por cada mundo que visitaron: el archipiélago, el bosque, la aldea, el mercado, el taller, el faro
    y el jardín. Juntos convierten todo lo aprendido en un plan de founder propio, y cierran el viaje
    con un gran lanzamiento que celebra el camino recorrido.'
sagas:
- position: 1
  slug: suenos-con-forma
  icon: rocket_launch
  title:
    en-US: Dreams Take Shape
    es-MX: Sueños con Forma
    pt-BR: Sonhos com Forma
  description:
    en-US: Turn a big dream into a goal with real steps and size.
    es-MX: Convierte un sueño grande en una meta con pasos y tamaño real.
    pt-BR: Transforme um grande sonho em uma meta com passos e tamanho real.
  topics:
  - position: 1
    slug: con-que-sueno
    title_es: Con qué sueño
    concept: Un sueño es algo que a alguien le encantaría lograr algún día, y nombrarlo con claridad es
      el primer paso para perseguirlo.
    learning_objective: Al final, el niño puede nombrar un sueño personal concreto que le gustaría lograr.
    key_vocabulary:
    - sueño
    - meta
    - futuro
    - lograr
    prior_knowledge: Ha definido metas de ahorro concretas (aventura 3).
    fact_refs: []
    lessons:
    - position: 1
      slug: la-nave-de-dr-rho
      micro_objective: Reconocer la diferencia entre un deseo pasajero y un sueño que alguien quiere perseguir
        de verdad.
      narrative_beat: Dr. Rho revela una nave con forma de cosmos y invita a Dina, Dino y Zara Vex a un
        viaje para repasar todo lo aprendido y soñar en grande.
      difficulty: 1
      suggested_families:
      - story
      - choice
    - position: 2
      slug: suenos-de-otros-founders
      micro_objective: Observar ejemplos de sueños concretos de otros personajes del universo LittleFounders.
      narrative_beat: 'Desde la nave, ven pequeñas escenas de otros founders: uno sueña con un huerto
        propio, otro con viajar a todas las islas del archipiélago.'
      difficulty: 2
      suggested_families:
      - story
      - choice
    - position: 3
      slug: mi-sueno-en-una-frase
      micro_objective: Formular un sueño personal en una frase clara y concreta.
      narrative_beat: Zara Vex reta a Dino a decir su sueño en una sola frase, sin vueltas ni dudas.
      difficulty: 2
      suggested_families:
      - choice
      - storyplay
    - position: 4
      slug: elegir-mi-sueno-principal
      micro_objective: Elegir, entre varios sueños posibles, uno principal para trabajar durante el viaje.
      narrative_beat: Entre varias ideas, Dina elige el sueño que más le entusiasma perseguir durante
        este viaje por el cosmos.
      difficulty: 3
      suggested_families:
      - choice
      - story
  - position: 2
    slug: ponerle-un-tamano-a-mi-sueno
    title_es: Ponerle un tamaño a mi sueño
    concept: Calcular cuánto cuesta o cuánto tiempo toma un sueño ayuda a verlo como algo alcanzable,
      no solo como una idea lejana.
    learning_objective: Al final, el niño puede estimar un costo o tiempo aproximado para su sueño personal.
    key_vocabulary:
    - costo
    - tiempo
    - tamaño
    - estimar
    prior_knowledge: Tiene un sueño personal definido (tema anterior).
    fact_refs: []
    lessons:
    - position: 1
      slug: cuanto-cuesta-un-sueno
      micro_objective: Reconocer que un sueño puede tener un costo o un tiempo asociado para lograrlo.
      narrative_beat: Dr. Rho muestra en un mapa estelar cuánto costó y cuánto tardó el sueño de otro
        founder del cosmos.
      difficulty: 1
      suggested_families:
      - story
      - analyze
    - position: 2
      slug: estimar-el-costo
      micro_objective: Estimar, con una guía dada, el costo aproximado de un sueño concreto.
      narrative_beat: Zara Vex ayuda a Dino a calcular más o menos cuánto costaría su sueño de tener un
        telescopio propio.
      difficulty: 2
      suggested_families:
      - money
      - input
    - position: 3
      slug: estimar-el-tiempo
      micro_objective: Estimar, con una guía dada, cuánto tiempo podría tomar lograr un sueño concreto.
      narrative_beat: Dina calcula cuántas semanas de ahorro le tomaría alcanzar su sueño, usando lo aprendido
        en aventuras anteriores.
      difficulty: 2
      suggested_families:
      - input
      - money
    - position: 4
      slug: el-tamano-de-mi-sueno
      micro_objective: Calcular el costo y tiempo aproximados del sueño personal propio del niño.
      narrative_beat: 'Con la ayuda de Dr. Rho, Dina calcula el tamaño real de su sueño: cuánto cuesta
        y cuánto tiempo le tomará.'
      difficulty: 3
      suggested_families:
      - money
      - input
  - position: 3
    slug: dividir-el-sueno-en-pasos
    title_es: Dividir el sueño en pasos
    concept: Un sueño grande se vuelve manejable cuando se divide en pasos más pequeños y concretos.
    learning_objective: Al final, el niño puede dividir un sueño en al menos tres pasos concretos y ordenados.
    key_vocabulary:
    - paso
    - dividir
    - orden
    - plan
    prior_knowledge: Ha calculado el tamaño de su sueño (tema anterior).
    fact_refs: []
    lessons:
    - position: 1
      slug: un-sueno-enorme
      micro_objective: Reconocer que un sueño grande puede sentirse difícil si se piensa como un solo
        paso.
      narrative_beat: Dino mira su sueño enorme y se siente un poco abrumado, hasta que Dr. Rho le muestra
        un mapa estelar dividido en tramos pequeños.
      difficulty: 1
      suggested_families:
      - story
      - choice
    - position: 2
      slug: pasos-para-otro-founder
      micro_objective: Observar cómo otro founder dividió su propio sueño en pasos concretos.
      narrative_beat: 'En la nave, ven cómo otro founder dividió su sueño de un huerto en pasos: ahorrar,
        comprar semillas, sembrar, cuidar.'
      difficulty: 2
      suggested_families:
      - story
      - arrange
    - position: 3
      slug: ordenar-mis-pasos
      micro_objective: Ordenar en secuencia lógica los pasos propuestos para lograr un sueño dado.
      narrative_beat: Zara Vex mezcla los pasos del sueño de Dina y la reta a ordenarlos correctamente.
      difficulty: 3
      suggested_families:
      - arrange
      - choice
    - position: 4
      slug: mi-sueno-en-pasos
      micro_objective: Dividir el sueño personal propio en al menos tres pasos ordenados.
      narrative_beat: Dina divide su propio sueño en pasos claros, del primero al último, en su cuaderno
        de viaje.
      difficulty: 3
      suggested_families:
      - arrange
      - choice
  - position: 4
    slug: elegir-el-primer-paso
    title_es: Elegir el primer paso
    concept: Elegir con claridad el primer paso de un plan ayuda a comenzar a perseguir un sueño sin sentirse
      perdido.
    learning_objective: Al final, el niño puede identificar cuál es el primer paso correcto para comenzar
      a perseguir su sueño.
    key_vocabulary:
    - primero
    - comenzar
    - paso
    - empezar
    prior_knowledge: Tiene el sueño dividido en pasos (tema anterior).
    fact_refs: []
    lessons:
    - position: 1
      slug: por-donde-empezar
      micro_objective: Reconocer que no todos los pasos de un plan se hacen al mismo tiempo; hay que elegir
        uno primero.
      narrative_beat: Dino mira todos los pasos de su sueño a la vez y no sabe por cuál empezar.
      difficulty: 1
      suggested_families:
      - story
      - choice
    - position: 2
      slug: el-paso-mas-facil-de-empezar
      micro_objective: Identificar, entre varios pasos, cuál conviene comenzar primero por ser el más
        accesible.
      narrative_beat: Dr. Rho ayuda a Dina a ver que el primer paso de su plan es simplemente empezar
        a ahorrar un poquito cada semana.
      difficulty: 2
      suggested_families:
      - choice
      - analyze
    - position: 3
      slug: practicar-elegir-el-primer-paso
      micro_objective: Elegir el primer paso correcto para el sueño de otro personaje dentro de una historia.
      narrative_beat: Zara Vex presenta el sueño de otro founder y reta a Dino a decidir cuál sería su
        primer paso.
      difficulty: 2
      suggested_families:
      - choice
      - storyplay
    - position: 4
      slug: mi-primer-paso-elegido
      micro_objective: Elegir con claridad el primer paso concreto para comenzar a perseguir el sueño
        personal propio.
      narrative_beat: Dina marca en su cuaderno el primer paso de su plan, listo para comenzar en cuanto
        la nave aterrice.
      difficulty: 3
      suggested_families:
      - choice
      - storyplay
  - position: 5
    slug: imaginar-obstaculos
    title_es: Imaginar obstáculos
    concept: Pensar por adelantado en los obstáculos posibles de un plan ayuda a no rendirse cuando aparecen
      de verdad.
    learning_objective: Al final, el niño puede anticipar al menos un obstáculo posible para su plan y
      una forma de enfrentarlo.
    key_vocabulary:
    - obstáculo
    - imaginar
    - enfrentar
    - plan
    prior_knowledge: Tiene el primer paso de su plan elegido (tema anterior).
    fact_refs: []
    lessons:
    - position: 1
      slug: el-meteorito-en-el-camino
      micro_objective: Reconocer que todo plan puede encontrarse con un obstáculo inesperado en el camino.
      narrative_beat: La nave de Dr. Rho esquiva un pequeño meteorito, y él compara eso con los obstáculos
        que aparecen en cualquier plan.
      difficulty: 1
      suggested_families:
      - story
      - choice
    - position: 2
      slug: posibles-obstaculos
      micro_objective: Identificar obstáculos posibles (gastar sin querer, olvidar el plan, un imprevisto)
        para un sueño dado.
      narrative_beat: Zara Vex ayuda a Dino a imaginar qué podría salir mal en su plan de ahorro para
        el telescopio.
      difficulty: 2
      suggested_families:
      - analyze
      - choice
    - position: 3
      slug: elegir-como-obstaculo-o-no
      micro_objective: Decidir, entre dos caminos posibles dentro de una historia, cuál ayuda mejor a
        superar un obstáculo del plan.
      narrative_beat: Frente a una tentación de gastar sus ahorros, Dino elige, dentro de la historia,
        si seguir su plan o desviarse.
      difficulty: 3
      suggested_families:
      - storyplay
      - choice
    - position: 4
      slug: mi-plan-a-prueba-de-obstaculos
      micro_objective: Anticipar un obstáculo concreto para el sueño propio y proponer una forma de enfrentarlo.
      narrative_beat: Dina anota en su cuaderno un obstáculo posible para su sueño y decide, con calma,
        cómo lo enfrentará si aparece.
      difficulty: 3
      suggested_families:
      - analyze
      - choice
  - position: 6
    slug: mi-sueno-mi-plan-corto
    title_es: Mi sueño, mi plan corto
    concept: Juntar el sueño, su tamaño, sus pasos y sus posibles obstáculos forma un plan corto y claro
      para empezar a perseguirlo.
    learning_objective: Al final, el niño puede presentar un plan corto y completo para su propio sueño.
    key_vocabulary:
    - plan
    - resumen
    - sueño
    - presentar
    prior_knowledge: Ha trabajado el sueño, su tamaño, sus pasos, el primer paso y los obstáculos (temas
      anteriores).
    fact_refs: []
    lessons:
    - position: 1
      slug: todas-las-piezas-juntas
      micro_objective: Reconocer que un plan completo junta el sueño, el tamaño, los pasos y los obstáculos
        ya trabajados.
      narrative_beat: Dr. Rho reúne todas las notas del cuaderno de viaje y muestra cómo todas las piezas
        ya trabajadas forman un plan completo.
      difficulty: 1
      suggested_families:
      - story
      - arrange
    - position: 2
      slug: el-plan-de-otro-founder
      micro_objective: Revisar el plan corto completo de otro founder como modelo antes de armar el propio.
      narrative_beat: 'En la nave, ven el plan corto completo de otro founder: su sueño, su tamaño, sus
        pasos y su primer paso.'
      difficulty: 2
      suggested_families:
      - story
      - analyze
    - position: 3
      slug: armar-mi-plan-corto
      micro_objective: 'Armar, en orden, las piezas del plan corto propio: sueño, tamaño, pasos, primer
        paso.'
      narrative_beat: Zara Vex ayuda a Dina a ordenar todas las piezas de su plan corto en una sola página
        del cuaderno.
      difficulty: 3
      suggested_families:
      - arrange
      - choice
    - position: 4
      slug: presentar-mi-plan
      micro_objective: Presentar el plan corto completo del sueño propio frente a los demás personajes.
      narrative_beat: Antes de que la nave aterrice en el siguiente destino, Dina presenta su plan corto
        completo a Dr. Rho, Dino y Zara Vex.
      difficulty: 3
      suggested_families:
      - storyplay
      - story
- position: 2
  slug: el-mapa-de-todo-lo-aprendido
  icon: map
  title:
    en-US: The Map of Everything Learned
    es-MX: El Mapa de Todo lo Aprendido
    pt-BR: O Mapa de Tudo o que Aprendemos
  description:
    en-US: Travel through every past world and review everything learned along the way.
    es-MX: Viaja por cada mundo anterior y repasa lo que aprendiste en el camino.
    pt-BR: Viaje por cada mundo anterior e revise tudo o que aprendeu no caminho.
  topics:
  - position: 1
    slug: recordar-el-trueque-y-el-dinero
    title_es: Recordar el trueque y el dinero
    concept: Repasar por qué existe el dinero y cómo reemplazó al trueque directo refuerza las bases de
      toda la aventura financiera.
    learning_objective: Al final, el niño puede explicar, en una frase, por qué el dinero facilita los
      intercambios frente al trueque.
    key_vocabulary:
    - trueque
    - dinero
    - intercambio
    - repaso
    prior_knowledge: Completó la aventura 1, El Archipiélago del Trueque.
    fact_refs: []
    lessons:
    - position: 1
      slug: el-primer-mapa-estelar
      micro_objective: Recordar la idea central de por qué surgió el dinero, vista en la primera aventura.
      narrative_beat: La nave se detiene sobre una proyección del archipiélago del trueque, y Dr. Rho
        pide a todos recordar cómo empezó su viaje.
      difficulty: 1
      suggested_families:
      - story
      - choice
    - position: 2
      slug: trueque-o-dinero
      micro_objective: Distinguir, en un ejemplo de repaso, una situación de trueque de una situación
        con dinero.
      narrative_beat: Zara Vex presenta dos escenas del archipiélago y reta a Dino a identificar cuál
        usa trueque y cuál usa dinero.
      difficulty: 2
      suggested_families:
      - choice
      - analyze
    - position: 3
      slug: por-que-cambiamos-al-dinero
      micro_objective: Explicar con una razón concreta por qué el dinero resulta más práctico que el trueque
        directo.
      narrative_beat: Dina recuerda, con sus propias palabras, por qué cambiar cocos por pescado a veces
        no funcionaba bien.
      difficulty: 2
      suggested_families:
      - choice
      - story
    - position: 4
      slug: repaso-mixto-trueque-y-dinero
      micro_objective: Aplicar en un desafío mixto lo repasado sobre trueque y dinero de la primera aventura.
      narrative_beat: La nave presenta un pequeño desafío final sobre el archipiélago antes de avanzar
        al siguiente mapa estelar.
      difficulty: 3
      suggested_families:
      - choice
      - analyze
  - position: 2
    slug: recordar-el-trabajo-y-el-esfuerzo
    title_es: Recordar el trabajo y el esfuerzo
    concept: Repasar cómo el trabajo y el esfuerzo generan ingresos refuerza la relación entre esfuerzo
      y recompensa.
    learning_objective: Al final, el niño puede explicar, en una frase, la relación entre esfuerzo y ganar
      dinero.
    key_vocabulary:
    - trabajo
    - esfuerzo
    - ganar
    - repaso
    prior_knowledge: Completó la aventura 2, El Bosque de la Abundancia.
    fact_refs: []
    lessons:
    - position: 1
      slug: el-segundo-mapa-estelar
      micro_objective: Recordar la idea central de ganar dinero a través del trabajo, vista en la segunda
        aventura.
      narrative_beat: El siguiente mapa estelar muestra el bosque de la abundancia, y Dino recuerda sus
        primeras chambitas.
      difficulty: 1
      suggested_families:
      - story
      - choice
    - position: 2
      slug: trabajo-facil-o-dificil
      micro_objective: Comparar distintos tipos de trabajo repasados de la segunda aventura según su esfuerzo.
      narrative_beat: Zara Vex compara dos chambitas del bosque y pregunta cuál requería más esfuerzo.
      difficulty: 2
      suggested_families:
      - analyze
      - choice
    - position: 3
      slug: por-que-el-esfuerzo-se-recompensa
      micro_objective: Explicar con una razón propia por qué el trabajo genera una recompensa.
      narrative_beat: Dina recuerda por qué recibía monedas después de ayudar en el bosque, y no solo
        por pedirlas.
      difficulty: 2
      suggested_families:
      - choice
      - story
    - position: 4
      slug: repaso-mixto-trabajo-y-esfuerzo
      micro_objective: Aplicar en un desafío mixto lo repasado sobre trabajo y esfuerzo de la segunda
        aventura.
      narrative_beat: La nave presenta un desafío final sobre el bosque de la abundancia antes de seguir
        el viaje.
      difficulty: 3
      suggested_families:
      - choice
      - analyze
  - position: 3
    slug: recordar-ahorrar-y-esperar
    title_es: Recordar ahorrar y esperar
    concept: Repasar la paciencia de ahorrar para una meta refuerza el valor de esperar en vez de gastar
      de inmediato.
    learning_objective: Al final, el niño puede explicar, en una frase, por qué ahorrar requiere paciencia.
    key_vocabulary:
    - ahorrar
    - paciencia
    - meta
    - repaso
    prior_knowledge: Completó la aventura 3, La Aldea del Ahorro.
    fact_refs: []
    lessons:
    - position: 1
      slug: el-tercer-mapa-estelar
      micro_objective: Recordar la idea central de ahorrar con paciencia para una meta, vista en la tercera
        aventura.
      narrative_beat: El mapa estelar muestra la aldea del ahorro, y Dina recuerda su primera alcancía
        y su primera meta.
      difficulty: 1
      suggested_families:
      - story
      - choice
    - position: 2
      slug: esperar-o-gastar-ya
      micro_objective: Comparar, en un ejemplo de repaso, la opción de esperar y ahorrar frente a gastar
        de inmediato.
      narrative_beat: Zara Vex recuerda a Dino la vez que decidió esperar en vez de gastar todo de inmediato
        en un capricho.
      difficulty: 2
      suggested_families:
      - choice
      - analyze
    - position: 3
      slug: por-que-vale-la-pena-esperar
      micro_objective: Explicar con una razón propia por qué esperar y ahorrar puede valer la pena.
      narrative_beat: Dina recuerda cómo se sintió al lograr su meta de ahorro después de varias semanas
        de paciencia.
      difficulty: 2
      suggested_families:
      - choice
      - story
    - position: 4
      slug: repaso-mixto-ahorrar-y-esperar
      micro_objective: Aplicar en un desafío mixto lo repasado sobre ahorrar y esperar de la tercera aventura.
      narrative_beat: La nave presenta un desafío final sobre la aldea del ahorro antes de continuar el
        viaje por el cosmos.
      difficulty: 3
      suggested_families:
      - money
      - choice
  - position: 4
    slug: recordar-comprar-inteligente
    title_es: Recordar comprar inteligente
    concept: Repasar cómo distinguir necesidades de deseos y comparar precios refuerza las bases de comprar
      con inteligencia.
    learning_objective: Al final, el niño puede explicar, en una frase, qué significa comprar de forma
      inteligente.
    key_vocabulary:
    - necesidad
    - deseo
    - comparar
    - repaso
    prior_knowledge: Completó la aventura 4, El Mercado de los Colores.
    fact_refs: []
    lessons:
    - position: 1
      slug: el-cuarto-mapa-estelar
      micro_objective: Recordar la idea central de distinguir necesidades de deseos, vista en la cuarta
        aventura.
      narrative_beat: El mapa estelar muestra el mercado de los colores, y Dino recuerda cuando aprendió
        a diferenciar lo que necesitaba de lo que solo quería.
      difficulty: 1
      suggested_families:
      - story
      - choice
    - position: 2
      slug: necesidad-o-deseo-repaso
      micro_objective: Clasificar, en un ejemplo de repaso, distintos artículos entre necesidades y deseos.
      narrative_beat: Zara Vex reparte tarjetas del mercado de colores y reta a Dina a separarlas entre
        necesidades y deseos.
      difficulty: 2
      suggested_families:
      - arrange
      - choice
    - position: 3
      slug: comparar-antes-de-comprar-repaso
      micro_objective: Explicar con una razón propia por qué comparar precios ayuda a comprar de forma
        inteligente.
      narrative_beat: Dina recuerda por qué comparar precios en dos puestos del mercado la ayudó a ahorrar
        monedas.
      difficulty: 2
      suggested_families:
      - choice
      - story
    - position: 4
      slug: repaso-mixto-comprar-inteligente
      micro_objective: Aplicar en un desafío mixto lo repasado sobre necesidades, deseos y comparación
        de precios de la cuarta aventura.
      narrative_beat: La nave presenta un desafío final sobre el mercado de los colores antes de seguir
        el viaje.
      difficulty: 3
      suggested_families:
      - choice
      - analyze
  - position: 5
    slug: recordar-inventar-poner-precio-y-vender
    title_es: Recordar inventar, poner precio y vender
    concept: Repasar el ciclo de inventar, calcular costo, poner un precio justo y vender refuerza la
      idea de emprender con propósito.
    learning_objective: Al final, el niño puede resumir, en orden, los pasos principales del ciclo de
      inventar y vender.
    key_vocabulary:
    - inventar
    - precio
    - vender
    - repaso
    prior_knowledge: Completó la aventura 5, El Taller de los Inventores.
    fact_refs: []
    lessons:
    - position: 1
      slug: el-quinto-mapa-estelar
      micro_objective: Recordar la idea central del ciclo de inventar, poner precio y vender, vista en
        la quinta aventura.
