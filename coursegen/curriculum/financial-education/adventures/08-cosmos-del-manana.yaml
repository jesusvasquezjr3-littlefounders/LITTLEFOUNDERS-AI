schema_version: 1
adventure:
  position: 8
  slug: cosmos-del-manana
  theme: cosmos
  age_tier: tier2
  title:
    en-US: Tomorrow's Cosmos
    es-MX: El Cosmos del Mañana
    pt-BR: O Cosmos do Amanhã
  description:
    en-US: Aboard Dr. Rho's ship, Dina, Liruf, and Zara Vex revisit everything they've learned and build
      their own founder plan for the future.
    es-MX: A bordo de la nave de Dr. Rho, Dina, Liruf y Zara Vex repasan todo lo aprendido y construyen
      su propio plan de founder hacia el futuro.
    pt-BR: A bordo da nave do Dr. Rho, Dina, Liruf e Zara Vex revisitam tudo o que aprenderam e constroem
      seu próprio plano de founder para o futuro.
  narrative_arc: 'Dr. Rho revela una nave con forma de cosmos que lleva a Dina, Liruf y Zara Vex de vuelta
    por cada mundo que visitaron: el archipiélago, el bosque, la aldea, el mercado, el taller, el faro
    y el jardín. Juntos convierten todo lo aprendido en un plan de founder propio, y cierran el viaje
    con un gran lanzamiento que celebra el camino recorrido.'
sagas:
- position: 1
  slug: suenos-con-forma
  icon: rocket_launch
  title:
    en-US: Dreams Take Shape
    es-MX: Sueños con Forma
    pt-BR: Sonhos com Forma
  description:
    en-US: Turn a big dream into a goal with real steps and size.
    es-MX: Convierte un sueño grande en una meta con pasos y tamaño real.
    pt-BR: Transforme um grande sonho em uma meta com passos e tamanho real.
  topics:
  - position: 1
    slug: con-que-sueno
    title_es: Con qué sueño
    concept: Un sueño es algo que a alguien le encantaría lograr algún día, y nombrarlo con claridad es
      el primer paso para perseguirlo.
    learning_objective: Al final, el niño puede nombrar un sueño personal concreto que le gustaría lograr.
    key_vocabulary:
    - sueño
    - meta
    - futuro
    - lograr
    prior_knowledge: Ha definido metas de ahorro concretas (aventura 3).
    parent_check: "¿{{name}} puede nombrarte un sueño personal concreto que le gustaría lograr?"
    fact_refs: []
    lessons:
    - position: 1
      slug: la-nave-de-dr-rho
      micro_objective: Reconocer la diferencia entre un deseo pasajero y un sueño que alguien quiere perseguir
        de verdad.
      narrative_beat: Dr. Rho revela una nave con forma de cosmos y invita a Dina, Liruf y Zara Vex a un
        viaje para repasar todo lo aprendido y soñar en grande.
      difficulty: 1
      suggested_families:
      - story
      - choice
    - position: 2
      slug: suenos-de-otros-founders
      micro_objective: Observar ejemplos de sueños concretos de otros personajes del universo LittleFounders.
      narrative_beat: 'Desde la nave, ven pequeñas escenas de otros founders: uno sueña con un huerto
        propio, otro con viajar a todas las islas del archipiélago.'
      difficulty: 2
      suggested_families:
      - story
      - choice
    - position: 3
      slug: mi-sueno-en-una-frase
      micro_objective: Formular un sueño personal en una frase clara y concreta.
      narrative_beat: Zara Vex reta a Liruf a decir su sueño en una sola frase, sin vueltas ni dudas.
      difficulty: 2
      suggested_families:
      - choice
      - storyplay
    - position: 4
      slug: elegir-mi-sueno-principal
      micro_objective: Elegir, entre varios sueños posibles, uno principal para trabajar durante el viaje.
      narrative_beat: Entre varias ideas, Dina elige el sueño que más le entusiasma perseguir durante
        este viaje por el cosmos.
      difficulty: 3
      suggested_families:
      - choice
      - story
  - position: 2
    slug: ponerle-un-tamano-a-mi-sueno
    title_es: Ponerle un tamaño a mi sueño
    concept: Calcular cuánto cuesta o cuánto tiempo toma un sueño ayuda a verlo como algo alcanzable,
      no solo como una idea lejana.
    learning_objective: Al final, el niño puede estimar un costo o tiempo aproximado para su sueño personal.
    key_vocabulary:
    - costo
    - tiempo
    - tamaño
    - estimar
    prior_knowledge: Tiene un sueño personal definido (tema anterior).
    parent_check: "¿{{name}} puede darte una idea de cuánto costaría o cuánto tiempo tomaría lograr su sueño?"
    fact_refs: []
    lessons:
    - position: 1
      slug: cuanto-cuesta-un-sueno
      micro_objective: Reconocer que un sueño puede tener un costo o un tiempo asociado para lograrlo.
      narrative_beat: Dr. Rho muestra en un mapa estelar cuánto costó y cuánto tardó el sueño de otro
        founder del cosmos.
      difficulty: 1
      suggested_families:
      - story
      - analyze
    - position: 2
      slug: estimar-el-costo
      micro_objective: Estimar, con una guía dada, el costo aproximado de un sueño concreto.
      narrative_beat: Zara Vex ayuda a Liruf a calcular más o menos cuánto costaría su sueño de tener un
        telescopio propio.
      difficulty: 2
      suggested_families:
      - money
      - input
    - position: 3
      slug: estimar-el-tiempo
      micro_objective: Estimar, con una guía dada, cuánto tiempo podría tomar lograr un sueño concreto.
      narrative_beat: Dina calcula cuántas semanas de ahorro le tomaría alcanzar su sueño, usando lo aprendido
        en aventuras anteriores.
      difficulty: 2
      suggested_families:
      - input
      - money
    - position: 4
      slug: el-tamano-de-mi-sueno
      micro_objective: Calcular el costo y tiempo aproximados del sueño personal propio del niño.
      narrative_beat: 'Con la ayuda de Dr. Rho, Dina calcula el tamaño real de su sueño: cuánto cuesta
        y cuánto tiempo le tomará.'
      difficulty: 3
      suggested_families:
      - money
      - input
  - position: 3
    slug: dividir-el-sueno-en-pasos
    title_es: Dividir el sueño en pasos
    concept: Un sueño grande se vuelve manejable cuando se divide en pasos más pequeños y concretos.
    learning_objective: Al final, el niño puede dividir un sueño en al menos tres pasos concretos y ordenados.
    key_vocabulary:
    - paso
    - dividir
    - orden
    - plan
    prior_knowledge: Ha calculado el tamaño de su sueño (tema anterior).
    parent_check: "¿{{name}} puede dividir un sueño grande en al menos tres pasos más pequeños?"
    fact_refs: []
    lessons:
    - position: 1
      slug: un-sueno-enorme
      micro_objective: Reconocer que un sueño grande puede sentirse difícil si se piensa como un solo
        paso.
      narrative_beat: Liruf mira su sueño enorme y se siente un poco abrumado, hasta que Dr. Rho le muestra
        un mapa estelar dividido en tramos pequeños.
      difficulty: 1
      suggested_families:
      - story
      - choice
    - position: 2
      slug: pasos-para-otro-founder
      micro_objective: Observar cómo otro founder dividió su propio sueño en pasos concretos.
      narrative_beat: 'En la nave, ven cómo otro founder dividió su sueño de un huerto en pasos: ahorrar,
        comprar semillas, sembrar, cuidar.'
      difficulty: 2
      suggested_families:
      - story
      - arrange
    - position: 3
      slug: ordenar-mis-pasos
      micro_objective: Ordenar en secuencia lógica los pasos propuestos para lograr un sueño dado.
      narrative_beat: Zara Vex mezcla los pasos del sueño de Dina y la reta a ordenarlos correctamente.
      difficulty: 3
      suggested_families:
      - arrange
      - choice
    - position: 4
      slug: mi-sueno-en-pasos
      micro_objective: Dividir el sueño personal propio en al menos tres pasos ordenados.
      narrative_beat: Dina divide su propio sueño en pasos claros, del primero al último, en su cuaderno
        de viaje.
      difficulty: 3
      suggested_families:
      - arrange
      - choice
  - position: 4
    slug: elegir-el-primer-paso
    title_es: Elegir el primer paso
    concept: Elegir con claridad el primer paso de un plan ayuda a comenzar a perseguir un sueño sin sentirse
      perdido.
    learning_objective: Al final, el niño puede identificar cuál es el primer paso correcto para comenzar
      a perseguir su sueño.
    key_vocabulary:
    - primero
    - comenzar
    - paso
    - empezar
    prior_knowledge: Tiene el sueño dividido en pasos (tema anterior).
    parent_check: "¿{{name}} puede decirte cuál sería el primer paso concreto para comenzar a perseguir su sueño?"
    fact_refs: []
    lessons:
    - position: 1
      slug: por-donde-empezar
      micro_objective: Reconocer que no todos los pasos de un plan se hacen al mismo tiempo; hay que elegir
        uno primero.
      narrative_beat: Liruf mira todos los pasos de su sueño a la vez y no sabe por cuál empezar.
      difficulty: 1
      suggested_families:
      - story
      - choice
    - position: 2
      slug: el-paso-mas-facil-de-empezar
      micro_objective: Identificar, entre varios pasos, cuál conviene comenzar primero por ser el más
        accesible.
      narrative_beat: Dr. Rho ayuda a Dina a ver que el primer paso de su plan es simplemente empezar
        a ahorrar un poquito cada semana.
      difficulty: 2
      suggested_families:
      - choice
      - analyze
    - position: 3
      slug: practicar-elegir-el-primer-paso
      micro_objective: Elegir el primer paso correcto para el sueño de otro personaje dentro de una historia.
      narrative_beat: Zara Vex presenta el sueño de otro founder y reta a Liruf a decidir cuál sería su
        primer paso.
      difficulty: 2
      suggested_families:
      - choice
      - storyplay
    - position: 4
      slug: mi-primer-paso-elegido
      micro_objective: Elegir con claridad el primer paso concreto para comenzar a perseguir el sueño
        personal propio.
      narrative_beat: Dina marca en su cuaderno el primer paso de su plan, listo para comenzar en cuanto
        la nave aterrice.
      difficulty: 3
      suggested_families:
      - choice
      - storyplay
  - position: 5
    slug: imaginar-obstaculos
    title_es: Imaginar obstáculos
    concept: Pensar por adelantado en los obstáculos posibles de un plan ayuda a no rendirse cuando aparecen
      de verdad.
    learning_objective: Al final, el niño puede anticipar al menos un obstáculo posible para su plan y
      una forma de enfrentarlo.
    key_vocabulary:
    - obstáculo
    - imaginar
    - enfrentar
    - plan
    prior_knowledge: Tiene el primer paso de su plan elegido (tema anterior).
    parent_check: "¿{{name}} puede imaginar un obstáculo posible para su plan y cómo lo enfrentaría?"
    fact_refs: []
    lessons:
    - position: 1
      slug: el-meteorito-en-el-camino
      micro_objective: Reconocer que todo plan puede encontrarse con un obstáculo inesperado en el camino.
      narrative_beat: La nave de Dr. Rho esquiva un pequeño meteorito, y él compara eso con los obstáculos
        que aparecen en cualquier plan.
      difficulty: 1
      suggested_families:
      - story
      - choice
    - position: 2
      slug: posibles-obstaculos
      micro_objective: Identificar obstáculos posibles (gastar sin querer, olvidar el plan, un imprevisto)
        para un sueño dado.
      narrative_beat: Zara Vex ayuda a Liruf a imaginar qué podría salir mal en su plan de ahorro para
        el telescopio.
      difficulty: 2
      suggested_families:
      - analyze
      - choice
    - position: 3
      slug: elegir-como-obstaculo-o-no
      micro_objective: Decidir, entre dos caminos posibles dentro de una historia, cuál ayuda mejor a
        superar un obstáculo del plan.
      narrative_beat: Frente a una tentación de gastar sus ahorros, Liruf elige, dentro de la historia,
        si seguir su plan o desviarse.
      difficulty: 3
      suggested_families:
      - storyplay
      - choice
    - position: 4
      slug: mi-plan-a-prueba-de-obstaculos
      micro_objective: Anticipar un obstáculo concreto para el sueño propio y proponer una forma de enfrentarlo.
      narrative_beat: Dina anota en su cuaderno un obstáculo posible para su sueño y decide, con calma,
        cómo lo enfrentará si aparece.
      difficulty: 3
      suggested_families:
      - analyze
      - choice
  - position: 6
    slug: mi-sueno-mi-plan-corto
    title_es: Mi sueño, mi plan corto
    concept: Juntar el sueño, su tamaño, sus pasos y sus posibles obstáculos forma un plan corto y claro
      para empezar a perseguirlo.
    learning_objective: Al final, el niño puede presentar un plan corto y completo para su propio sueño.
    key_vocabulary:
    - plan
    - resumen
    - sueño
    - presentar
    prior_knowledge: Ha trabajado el sueño, su tamaño, sus pasos, el primer paso y los obstáculos (temas
      anteriores).
    parent_check: "¿{{name}} puede presentarte un plan corto y completo para su propio sueño?"
    fact_refs: []
    lessons:
    - position: 1
      slug: todas-las-piezas-juntas
      micro_objective: Reconocer que un plan completo junta el sueño, el tamaño, los pasos y los obstáculos
        ya trabajados.
      narrative_beat: Dr. Rho reúne todas las notas del cuaderno de viaje y muestra cómo todas las piezas
        ya trabajadas forman un plan completo.
      difficulty: 1
      suggested_families:
      - story
      - arrange
    - position: 2
      slug: el-plan-de-otro-founder
      micro_objective: Revisar el plan corto completo de otro founder como modelo antes de armar el propio.
      narrative_beat: 'En la nave, ven el plan corto completo de otro founder: su sueño, su tamaño, sus
        pasos y su primer paso.'
      difficulty: 2
      suggested_families:
      - story
      - analyze
    - position: 3
      slug: armar-mi-plan-corto
      micro_objective: 'Armar, en orden, las piezas del plan corto propio: sueño, tamaño, pasos, primer
        paso.'
      narrative_beat: Zara Vex ayuda a Dina a ordenar todas las piezas de su plan corto en una sola página
        del cuaderno.
      difficulty: 3
      suggested_families:
      - arrange
      - choice
    - position: 4
      slug: presentar-mi-plan
      micro_objective: Presentar el plan corto completo del sueño propio frente a los demás personajes.
      narrative_beat: Antes de que la nave aterrice en el siguiente destino, Dina presenta su plan corto
        completo a Dr. Rho, Liruf y Zara Vex.
      difficulty: 3
      suggested_families:
      - storyplay
      - story
  - position: 7
    slug: metas-a-largo-plazo
    title_es: Metas a largo plazo
    concept: Algunas metas se logran en pocas semanas, y otras, como aprender un oficio o construir algo grande, toman meses o incluso años de trabajo constante.
    learning_objective: Al final, el niño puede distinguir una meta de corto plazo de una meta de largo plazo y nombrar un ejemplo propio de cada una.
    key_vocabulary:
    - largo plazo
    - corto plazo
    - constancia
    - tiempo
    prior_knowledge: Ha calculado el tamaño de su sueño en costo y tiempo (tema anterior).
    parent_check: "¿{{name}} puede explicarte la diferencia entre una meta que toma pocas semanas y una que toma meses o años?"
    prerequisites:
    - path: aldea-del-ahorro/paciencia-de-tortuga/ahorro-un-poco-cada-semana
      strength: soft
      reason: "Haber practicado ahorrar un poco cada semana con paciencia prepara para perseguir una meta que toma mucho más tiempo."
    fact_refs: []
    lessons:
    - position: 1
      slug: suenos-rapidos-y-suenos-lentos
      micro_objective: Comparar un sueño que se logra en pocas semanas con uno que toma meses o años.
      narrative_beat: Desde la nave, Dr. Rho muestra dos founders del cosmos, uno que ahorró para un juguete en un mes y otro que construyó su taller en dos años.
      difficulty: 1
      suggested_families:
      - story
      - choice
    - position: 2
      slug: por-que-algunos-suenos-toman-mas-tiempo
      micro_objective: Explicar por qué algunos sueños necesitan mucho más tiempo y constancia que otros.
      narrative_beat: Zara Vex explica que un sueño grande, como dominar un oficio, no se logra de un día para otro, sino con constancia.
      difficulty: 2
      suggested_families:
      - story
      - analyze
    - position: 3
      slug: clasificar-mis-suenos
      micro_objective: Clasificar varios sueños dados entre metas de corto plazo y de largo plazo.
      narrative_beat: Dina ordena varios sueños de otros founders del cosmos entre los que toman semanas y los que toman años.
      difficulty: 2
      suggested_families:
      - arrange
      - choice
    - position: 4
      slug: mi-meta-a-largo-plazo
      micro_objective: Nombrar una meta a largo plazo propia y reconocer que requerirá constancia.
      narrative_beat: Dina piensa en un sueño suyo que le tomaría mucho más que unas semanas, y decide que también vale la pena perseguirlo.
      difficulty: 3
      suggested_families:
      - choice
      - storyplay
  - position: 8
    slug: suenos-que-se-logran-en-equipo
    title_es: Sueños que se logran en equipo
    concept: Algunos sueños grandes se logran mejor cuando se persiguen junto con otras personas, en vez de intentarlo todo en solitario.
    learning_objective: Al final, el niño puede reconocer cuándo un sueño propio se beneficiaría de la ayuda o compañía de otros.
    key_vocabulary:
    - equipo
    - compañía
    - juntos
    - apoyo
    prior_knowledge: Tiene un sueño personal definido y sabe que algunos toman más tiempo que otros (temas anteriores).
    parent_check: "¿{{name}} puede reconocer cuándo un sueño suyo sería más fácil de lograr con la ayuda de otras personas?"
    fact_refs: []
    lessons:
    - position: 1
      slug: un-sueno-demasiado-grande-para-uno
      micro_objective: Reconocer un sueño que sería muy difícil de lograr completamente solo.
      narrative_beat: Liruf imagina un sueño enorme, como construir un puente entre dos islas, y se da cuenta de que solo no podría.
      difficulty: 1
      suggested_families:
      - story
      - choice
    - position: 2
      slug: quien-podria-ayudarme
      micro_objective: Identificar personas que podrían acompañar o ayudar a lograr un sueño grande.
      narrative_beat: Zara Vex ayuda a Liruf a pensar en quién del cosmos podría acompañarlo a construir su puente entre islas.
      difficulty: 2
      suggested_families:
      - choice
      - story
    - position: 3
      slug: solo-o-en-equipo
      micro_objective: Comparar, para un sueño dado, si conviene más perseguirlo solo o en equipo.
      narrative_beat: Dr. Rho presenta dos sueños distintos y pregunta a Dina cuál conviene más hacer en equipo y cuál puede hacerse sola.
      difficulty: 2
      suggested_families:
      - choice
      - analyze
    - position: 4
      slug: mi-equipo-de-sueno
      micro_objective: Identificar, para el sueño propio, a alguien que podría acompañarlo en el camino.
      narrative_beat: Dina anota en su cuaderno de viaje quién podría ayudarla a lograr su propio sueño de founder.
      difficulty: 3
      suggested_families:
      - choice
      - storyplay
  - position: 9
    slug: el-cofre-del-repaso
    kind: review_spaced
    title_es: El Cofre del Repaso
    concept: Zara Vex abre un cofre estelar de la nave para poner a prueba, sin enseñar nada nuevo, todo lo aprendido en la saga Sueños con Forma.
    learning_objective: Al final, el niño puede recordar y aplicar, sin ayuda nueva, los conceptos principales de la saga Sueños con Forma.
    key_vocabulary:
    - sueño
    - costo
    - paso
    - primero
    prior_knowledge: Ha completado los seis temas de la saga Sueños con Forma (aventura 8, saga 1).
    fact_refs: []
    review_of:
    - cosmos-del-manana/suenos-con-forma/con-que-sueno
    - cosmos-del-manana/suenos-con-forma/ponerle-un-tamano-a-mi-sueno
    - cosmos-del-manana/suenos-con-forma/dividir-el-sueno-en-pasos
    - cosmos-del-manana/suenos-con-forma/elegir-el-primer-paso
    - cosmos-del-manana/suenos-con-forma/imaginar-obstaculos
    - cosmos-del-manana/suenos-con-forma/mi-sueno-mi-plan-corto
    - cosmos-del-manana/suenos-con-forma/metas-a-largo-plazo
    - cosmos-del-manana/suenos-con-forma/suenos-que-se-logran-en-equipo
    lessons:
    - position: 1
      slug: el-cofre-se-abre
      micro_objective: Recordar, sin ayuda nueva, cómo nombrar un sueño personal concreto y cómo estimar el costo o tiempo de un sueño.
      narrative_beat: Zara Vex abre un cofre estelar de la nave y reta a Dina a recordar, tarjeta por tarjeta, lo primero que aprendió en esta saga.
      difficulty: 1
      suggested_families:
      - story
      - choice
    - position: 2
      slug: recordar-en-orden
      micro_objective: Recordar y ordenar de nuevo cómo dividir un sueño en pasos concretos y cómo elegir el primer paso correcto para comenzar.
      narrative_beat: Liruf saca del cofre estelar las tarjetas mezcladas de la saga y las ordena de memoria, sin que Dr. Rho le dé ninguna pista nueva.
      difficulty: 1
      suggested_families:
      - arrange
      - choice
    - position: 3
      slug: aplicar-lo-guardado
      micro_objective: Aplicar de nuevo, en una escena distinta, lo aprendido sobre anticipar un obstáculo posible del plan.
      narrative_beat: Dr. Rho presenta una escena nueva de la nave y pregunta a Dina si recuerda, sin repasar la lección, qué haría en ese caso.
      difficulty: 2
      suggested_families:
      - choice
      - story
    - position: 4
      slug: cerrar-el-cofre
      micro_objective: Aplicar en conjunto todo lo repasado de la saga, incluyendo cómo presentar un plan corto y completo del sueño, para cerrar el cofre.
      narrative_beat: Antes de cerrar el cofre estelar, Dina demuestra que recuerda toda la saga uniendo cada tarjeta con la lección que le corresponde.
      difficulty: 2
      suggested_families:
      - choice
      - storyplay
  - position: 10
    slug: reto-entrelazado
    kind: review_interleaved
    title_es: Reto Entrelazado
    concept: Zara Vex mezcla lo aprendido en Sueños con Forma con ideas de aventuras anteriores en un reto que combina ambos mundos.
    learning_objective: Al final, el niño puede recordar y combinar un concepto de Sueños con Forma con un concepto de una aventura anterior.
    key_vocabulary:
    - recordar
    - combinar
    - aplicar
    - sueño
    prior_knowledge: Conoce Sueños con Forma (aventura 8) y las lecciones citadas de aventuras anteriores.
    fact_refs: []
    review_of:
    - aldea-del-ahorro/paciencia-de-tortuga/ahorro-un-poco-cada-semana
    - bosque-de-la-abundancia/chambitas-del-bosque/cuanto-esfuerzo-cuanta-recompensa
    lessons:
    - position: 1
      slug: un-recuerdo-de-otro-mundo
      micro_objective: Recordar, tal como se aprendió antes, el concepto de una aventura anterior citado en este reto.
      narrative_beat: Zara Vex trae un recuerdo de un mundo anterior y pide a Liruf recordarlo sin ayuda, antes de mezclarlo con el cosmos.
      difficulty: 2
      suggested_families:
      - choice
      - story
    - position: 2
      slug: unir-los-dos-mundos
      micro_objective: Combinar el concepto recordado de una aventura anterior con lo aprendido en Sueños con Forma.
