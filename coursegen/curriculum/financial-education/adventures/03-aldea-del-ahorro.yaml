schema_version: 1

adventure:
  position: 3
  slug: aldea-del-ahorro
  theme: valley
  age_tier: tier1
  title:
    en-US: "The Savings Village"
    es-MX: "La Aldea del Ahorro"
    pt-BR: "A Vila da Poupança"
  description:
    en-US: "In a peaceful valley, the crew learns to set goals, wait with patience, and keep their coins safe."
    es-MX: "En un valle tranquilo, la tripulación aprende a ponerse metas, esperar con paciencia y cuidar sus monedas."
    pt-BR: "Em um vale tranquilo, a tripulação aprende a criar metas, esperar com paciência e cuidar de suas moedas."
  narrative_arc: "El barco llega a un valle sereno donde cada familia guarda un frasco especial para sus sueños. Dina, Liruf, Rho y Zara aprenden que guardar un poquito de sus monedas cada semana, en un lugar seguro, los acerca a metas que no podrían comprar de un solo golpe. La paciencia se vuelve su nueva herramienta."

sagas:
  - position: 1
    slug: el-frasco-de-los-suenos
    icon: savings
    title:
      en-US: "The Jar of Dreams"
      es-MX: "El Frasco de los Sueños"
      pt-BR: "O Pote dos Sonhos"
    description:
      en-US: "Every villager keeps a jar for something they're dreaming of — the crew starts their own."
      es-MX: "Cada aldeano guarda un frasco para algo que sueña tener: la tripulación empieza el suyo."
      pt-BR: "Cada aldeão guarda um pote para algo que sonha ter: a tripulação começa o seu."
    topics:
      - position: 1
        slug: guardar-para-despues
        title_es: "Guardar para después"
        concept: "En vez de gastar todas mis monedas hoy, puedo guardar algunas para usarlas más adelante."
        learning_objective: "Al final, el niño puede explicar con sus palabras la idea de guardar monedas para después."
        key_vocabulary: [guardar, después, ahorrar]
        prior_knowledge: "Sabe ganar y contar sus propias monedas (aventura anterior)."
        fact_refs: []
        parent_check: "La próxima vez que le des una moneda a {{name}}, fíjate si guarda una parte en vez de gastarla toda de inmediato."
        prerequisites:
          - path: bosque-de-la-abundancia/la-cosecha-de-monedas/gano-monedas-por-mi-chambita
            strength: hard
            reason: "No se puede guardar monedas para después sin antes haber ganado monedas propias con esfuerzo."
        lessons:
          - position: 1
            slug: no-gasto-todo-hoy
            micro_objective: "Reconoce en la historia el momento en que un personaje decide no gastar todas sus monedas."
            narrative_beat: "Dina guarda una moneda en su bolsillo en lugar de gastarla toda en el puesto del valle."
            difficulty: 1
            suggested_families: [story, choice]
          - position: 2
            slug: gastar-hoy-o-guardar
            micro_objective: "Distingue, entre 4 escenas, cuáles muestran a alguien guardando monedas y cuáles gastándolas."
            narrative_beat: "Liruf compara dos aldeanos: uno gasta todo de inmediato, otro guarda un poco cada vez."
            difficulty: 1
            suggested_families: [choice]
          - position: 3
            slug: para-que-guardo
            micro_objective: "Explica en una frase para qué podría servir guardar monedas en vez de gastarlas."
            narrative_beat: "Rho pregunta a los aldeanos del valle por qué guardan monedas en sus frascos."
            difficulty: 1
            suggested_families: [story, choice]
          - position: 4
            slug: guardo-mi-primera-moneda
            micro_objective: "Guarda su primera moneda dentro de la historia, en lugar de gastarla de inmediato."
            narrative_beat: "Zara guarda su primera moneda del valle en un frasquito de vidrio recién estrenado."
            difficulty: 2
            suggested_families: [money, storyplay]
      - position: 2
        slug: tengo-un-sueno-que-cuesta-monedas
        title_es: "Tengo un sueño que cuesta monedas"
        concept: "Puedo elegir algo que sueño tener y darme cuenta de cuántas monedas necesito para conseguirlo."
        learning_objective: "Al final, el niño puede nombrar una meta personal que le gustaría comprar con sus ahorros."
        key_vocabulary: [meta, sueño, cuesta]
        prior_knowledge: "Entiende la idea de guardar monedas para después (tema anterior)."
        fact_refs: [mxn.reference_prices.juguete_pequeno]
        parent_check: "Pregúntale a {{name}} qué le gustaría comprar algún día con sus propios ahorros y espera una respuesta concreta, no un 'no sé'."
        prerequisites:
          - path: archipielago-del-trueque/el-valor-de-las-cosas/cosas-que-cuestan-mas
            strength: hard
            reason: "Para nombrar una meta que cuesta varias monedas, primero hay que saber que existen cosas que cuestan más que otras."
        lessons:
          - position: 1
            slug: mi-sueno-en-el-valle
            micro_objective: "Reconoce en la historia el sueño que un personaje quiere alcanzar con sus ahorros."
            narrative_beat: "Rho sueña con un telescopio especial para observar las estrellas del valle."
            difficulty: 1
            suggested_families: [story, choice]
          - position: 2
            slug: cuanto-cuesta-mi-sueno
            micro_objective: "Relaciona una meta con el número de monedas aproximado que necesita para lograrla."
            narrative_beat: "Zara pregunta al comerciante del valle cuántas monedas cuesta el telescopio de Rho."
            difficulty: 1
            suggested_families: [choice, money]
          - position: 3
            slug: elijo-mi-propia-meta
            micro_objective: "Elige, entre 3 opciones, una meta propia que le gustaría lograr con ahorros."
            narrative_beat: "Liruf piensa en voz alta qué le gustaría comprar si juntara suficientes monedas."
            difficulty: 2
            suggested_families: [choice, story]
          - position: 4
            slug: dibujo-mi-sueno
            micro_objective: "Describe en una frase su propia meta de ahorro y por qué la eligió."
            narrative_beat: "Dina dibuja su meta de ahorro en un pergamino para recordarla cada día."
            difficulty: 2
            suggested_families: [story, storyplay]
      - position: 3
        slug: elijo-mi-frasco-de-ahorro
        title_es: "Elijo mi frasco de ahorro"
        concept: "Puedo elegir un frasco o lugar especial donde guardar las monedas destinadas a mi meta."
        learning_objective: "Al final, el niño puede identificar y elegir un lugar apropiado para guardar sus ahorros."
        key_vocabulary: [frasco, lugar especial, guardar ahí]
        prior_knowledge: "Tiene una meta personal de ahorro (tema anterior)."
        fact_refs: []
        parent_check: "Muéstrale a {{name}} dos recipientes distintos en casa y observa si sabe señalar cuál serviría mejor para guardar sus monedas."
        lessons:
          - position: 1
            slug: el-frasco-de-rho
            micro_objective: "Reconoce en la historia el frasco que un personaje eligió para su meta de ahorro."
            narrative_beat: "Rho elige un frasco de vidrio transparente para ver crecer sus ahorros para el telescopio."
            difficulty: 1
            suggested_families: [story, choice]
          - position: 2
            slug: cual-frasco-elijo
            micro_objective: "Elige, entre 3 frascos distintos, el que le parece más adecuado para guardar monedas."
            narrative_beat: "Zara compara distintos frascos del mercado del valle antes de elegir el suyo."
            difficulty: 1
            suggested_families: [choice]
          - position: 3
            slug: le-pongo-nombre-a-mi-frasco
            micro_objective: "Nombra su propio frasco de ahorro con el nombre de su meta."
            narrative_beat: "Liruf escribe 'Mi Barquito Nuevo' en una etiqueta y la pega en su frasco de ahorro."
            difficulty: 2
            suggested_families: [story, choice]
          - position: 4
            slug: mi-frasco-esta-listo
            micro_objective: "Completa en la historia la preparación de su propio frasco de ahorro para comenzar."
            narrative_beat: "Dina coloca su frasco vacío en un estante especial, lista para empezar a ahorrar."
            difficulty: 2
            suggested_families: [storyplay, story]
      - position: 4
        slug: cada-moneda-cuenta
        title_es: "Cada moneda cuenta"
        concept: "No importa si guardo una moneda grande o chica: cada una que meto al frasco me acerca a mi meta."
        learning_objective: "Al final, el niño puede reconocer que cada moneda guardada suma hacia la meta, sin importar su tamaño."
        key_vocabulary: [cada moneda, suma, acercarse a la meta]
        prior_knowledge: "Tiene su propio frasco de ahorro listo (tema anterior)."
        fact_refs: []
        parent_check: "Ponle enfrente a {{name}} una moneda chica y una grande y pregúntale si las dos ayudan por igual a su meta."
        lessons:
          - position: 1
            slug: una-moneda-mas-cerca
            micro_objective: "Reconoce en la historia que guardar una moneda más acerca al personaje a su meta."
            narrative_beat: "Rho guarda una moneda de $2 en su frasco y siente que está un poquito más cerca del telescopio."
            difficulty: 1
            suggested_families: [story, money]
          - position: 2
            slug: monedas-chicas-tambien-cuentan
            micro_objective: "Reconoce que una moneda chica también ayuda a llegar a la meta, aunque tome más tiempo."
            narrative_beat: "Zara guarda una moneda de $1 y nota que también cuenta, aunque sea la más chiquita."
            difficulty: 1
            suggested_families: [choice, money]
          - position: 3
            slug: cuento-mi-frasco
            micro_objective: "Cuenta el total actual de monedas guardadas en su frasco, hasta $20."
            narrative_beat: "Liruf cuenta con cuidado todas las monedas que lleva guardadas hasta ahora en su frasco."
            difficulty: 2
            suggested_families: [money, input]
          - position: 4
            slug: mi-frasco-crece-poquito-a-poquito
            micro_objective: "Registra el crecimiento de su frasco tras guardar varias monedas distintas en la historia."
            narrative_beat: "Dina observa emocionada cómo su frasco va subiendo de nivel con cada moneda guardada."
            difficulty: 2
            suggested_families: [money, story]
      - position: 5
        slug: a-veces-quiero-gastar-ya
        title_es: "A veces quiero gastar ya"
        concept: "A veces siento ganas de gastar mis monedas guardadas de inmediato en algo que veo hoy; es normal sentirlo."
        learning_objective: "Al final, el niño puede reconocer el impulso de gastar ya y nombrarlo sin sentirse mal por sentirlo."
        key_vocabulary: [impulso, quiero ya, sentirlo está bien]
        prior_knowledge: "Sabe que cada moneda guardada suma hacia su meta (tema anterior)."
        fact_refs: []
        parent_check: "Cuando {{name}} vea algo que quiera comprar ya mismo, escucha si logra decirlo en voz alta sin sentirse mal por sentirlo."
        lessons:
          - position: 1
            slug: vi-algo-que-quiero-ya
            micro_objective: "Reconoce en la historia el momento en que un personaje siente ganas de gastar sus ahorros de inmediato."
            narrative_beat: "Rho ve un dulce brillante en el mercado del valle y siente muchas ganas de comprarlo ahora mismo."
            difficulty: 1
            suggested_families: [story, choice]
          - position: 2
            slug: sentirlo-esta-bien
            micro_objective: "Reconoce que sentir ganas de gastar de inmediato es normal y no está mal sentirlo."
            narrative_beat: "Zara le dice a Rho que está bien sentir esas ganas, lo importante es qué decide hacer después."
            difficulty: 1
            suggested_families: [story, choice]
          - position: 3
            slug: lo-pienso-un-momento
            micro_objective: "Elige, entre 2 respuestas posibles, la que muestra pensar un momento antes de decidir gastar los ahorros."
            narrative_beat: "Liruf respira hondo y piensa un momento antes de decidir si gasta o guarda su moneda."
            difficulty: 2
            suggested_families: [choice, storyplay]
          - position: 4
            slug: decido-con-calma
            micro_objective: "Completa en la historia una decisión calmada entre gastar ahora o seguir ahorrando para la meta."
            narrative_beat: "Dina decide, después de pensarlo, seguir guardando sus monedas para su meta más grande."
            difficulty: 2
            suggested_families: [storyplay, choice]
      - position: 6
        slug: espero-un-poquito-mas
        title_es: "Espero un poquito más"
        concept: "Cuando decido esperar en vez de gastar de inmediato, me acerco más rápido a lograr mi meta grande."
        learning_objective: "Al final, el niño puede elegir esperar en una situación simple de tentación de gasto."
        key_vocabulary: [esperar, un poquito más, mi meta grande]
        prior_knowledge: "Reconoce el impulso de gastar de inmediato (tema anterior)."
        fact_refs: []
        parent_check: "La próxima vez que {{name}} sienta ganas de gastar en algo pequeño, dale la opción de esperar y observa si la elige por su cuenta."
        lessons:
          - position: 1
            slug: rho-decide-esperar
            micro_objective: "Reconoce en la historia el resultado de esperar en lugar de gastar de inmediato."
            narrative_beat: "Rho no compra el dulce brillante y, semanas después, se compra su telescopio soñado."
            difficulty: 1
            suggested_families: [story, choice]
          - position: 2
            slug: comparo-esperar-y-no-esperar
            micro_objective: "Compara dos finales de historia: uno donde el personaje espera y otro donde gasta de inmediato."
            narrative_beat: "Zara compara dos caminos posibles para Liruf: gastar hoy o esperar y lograr su meta grande."
            difficulty: 2
            suggested_families: [choice, story]
          - position: 3
            slug: elijo-esperar-hoy
            micro_objective: "Elige esperar en una situación de tentación simple dentro de la historia."
            narrative_beat: "Liruf ve otro dulce brillante, pero esta vez decide esperar y seguir ahorrando para su barquito."
            difficulty: 2
            suggested_families: [storyplay, choice]
          - position: 4
            slug: el-frasco-de-los-suenos-repaso
            micro_objective: "Explica en una frase por qué esperar un poquito más ayudó a lograr una meta en la historia."
            narrative_beat: "Toda la tripulación celebra que esperar un poquito más los acercó a sus sueños del valle."
            difficulty: 2
            suggested_families: [story, choice]
      - position: 7
        slug: cofre-del-repaso-del-frasco
        title_es: "El Cofre del Repaso del Frasco"
        concept: "Antes de seguir el viaje, la tripulación abre el cofre de recuerdos y repasa lo aprendido sobre guardar y esperar."
        learning_objective: "Al final, el niño recuerda y usa, sin nueva enseñanza, los conceptos de guardar, meta y espera de esta saga."
        key_vocabulary: [guardar, meta, frasco, esperar]
        prior_knowledge: "Completó los 6 temas de El Frasco de los Sueños."
        fact_refs: []
        kind: review_spaced
        review_of:
          - aldea-del-ahorro/el-frasco-de-los-suenos/guardar-para-despues
          - aldea-del-ahorro/el-frasco-de-los-suenos/tengo-un-sueno-que-cuesta-monedas
          - aldea-del-ahorro/el-frasco-de-los-suenos/elijo-mi-frasco-de-ahorro
          - aldea-del-ahorro/el-frasco-de-los-suenos/cada-moneda-cuenta
          - aldea-del-ahorro/el-frasco-de-los-suenos/a-veces-quiero-gastar-ya
          - aldea-del-ahorro/el-frasco-de-los-suenos/espero-un-poquito-mas
        lessons:
          - position: 1
            slug: recuerdo-por-que-guardo
            micro_objective: "Recuerda, sin ayuda, por qué decidió guardar monedas en vez de gastarlas todas."
            narrative_beat: "Rho abre el cofre y recuerda su primera moneda guardada para el telescopio."
            difficulty: 1
            suggested_families: [story, choice]
          - position: 2
            slug: recuerdo-mi-meta-del-valle
            micro_objective: "Recuerda y describe, sin ayuda, la meta de ahorro que eligió al inicio de esta saga."
            narrative_beat: "Zara recuerda el día en que eligió su frasco y su meta de ahorro en el valle."
            difficulty: 1
            suggested_families: [story, choice]
          - position: 3
            slug: elijo-el-mejor-momento-para-esperar
            micro_objective: "Elige, entre 2 situaciones recordadas, cuál mostró mejor la decisión de esperar en vez de gastar ya."
            narrative_beat: "Liruf compara dos recuerdos: una vez que esperó y una vez que estuvo a punto de gastar de inmediato."
            difficulty: 2
            suggested_families: [choice, storyplay]
          - position: 4
            slug: cierro-el-cofre-del-frasco
            micro_objective: "Aplica sin ayuda lo recordado: explica por qué esperar un poquito más ayuda a lograr una meta."
            narrative_beat: "Dina cierra el cofre del frasco de los sueños, lista para aprender más sobre paciencia."
            difficulty: 2
            suggested_families: [story, choice]
      - position: 8
        slug: reto-entrelazado-del-frasco
        title_es: "Reto Entrelazado del Frasco"
        concept: "Mezclamos ganar monedas con esfuerzo, como en el bosque, con guardar monedas para una meta, como en el valle."
        learning_objective: "Al final, el niño combina, sin nueva enseñanza, ideas sobre ganar monedas con esfuerzo con ideas sobre guardarlas para una meta."
        key_vocabulary: [ganar, guardar, meta, moneda]
        prior_knowledge: "Completó El Cofre del Repaso del Frasco (tema anterior) y El Bosque de la Abundancia (aventura anterior)."
        fact_refs: []
        kind: review_interleaved
        review_of:
          - bosque-de-la-abundancia/la-cosecha-de-monedas/mi-primera-semana-de-ganancias
          - aldea-del-ahorro/el-frasco-de-los-suenos/tengo-un-sueno-que-cuesta-monedas
          - aldea-del-ahorro/el-frasco-de-los-suenos/cada-moneda-cuenta
        lessons:
          - position: 1
            slug: de-ganar-a-guardar
            micro_objective: "Conecta, sin ayuda, cómo las monedas ganadas en el bosque ahora se guardan en un frasco del valle."
            narrative_beat: "Rho recuerda su cofre lleno de ganancias del bosque y ahora guarda parte de ellas en su frasco."
            difficulty: 2
            suggested_families: [story, money]
          - position: 2
            slug: cuanto-necesito-para-mi-sueno
            micro_objective: "Relaciona el total ganado en una semana con cuánto le falta para su meta de ahorro."
            narrative_beat: "Zara compara lo que ganó en el bosque con lo que le falta para comprar su telescopio soñado."
            difficulty: 2
            suggested_families: [money, choice]
          - position: 3
            slug: cada-moneda-ganada-tambien-cuenta
            micro_objective: "Reconoce que cada moneda ganada con esfuerzo, grande o chica, también cuenta hacia su meta."
            narrative_beat: "Liruf guarda una moneda chica que ganó ayudando y recuerda que también acerca a su meta."
            difficulty: 2
            suggested_families: [choice, money]
          - position: 4
            slug: guardo-lo-que-gane-con-esfuerzo
            micro_objective: "Guarda, sin ayuda, una parte de sus ganancias del bosque en su frasco de ahorro del valle."
            narrative_beat: "Dina guarda con cuidado una parte de sus ganancias del bosque en su nuevo frasco del valle."
            difficulty: 2
            suggested_families: [money, storyplay]

  - position: 2
    slug: paciencia-de-tortuga
    icon: hourglass_top
    title:
      en-US: "Turtle Patience"
      es-MX: "Paciencia de Tortuga"
      pt-BR: "Paciência de Tartaruga"
    description:
      en-US: "Slow and steady: the crew learns to count weeks and celebrate small progress toward a goal."
      es-MX: "Despacio pero seguro: la tripulación aprende a contar semanas y celebrar el progreso hacia una meta."
      pt-BR: "Devagar mas sempre: a tripulação aprende a contar semanas e celebrar o progresso rumo a uma meta."
    topics:
      - position: 1
        slug: lo-que-quiero-ahora-vs-lo-que-quiero-despues
        title_es: "Lo que quiero ahora vs. lo que quiero después"
        concept: "Puedo comparar algo pequeño que quiero ahora con algo más grande que quiero lograr después."
        learning_objective: "Al final, el niño puede comparar una recompensa pequeña inmediata con una meta más grande a futuro."
        key_vocabulary: [ahora, después, más grande]
        prior_knowledge: "Sabe elegir esperar en una situación simple (saga anterior)."
        fact_refs: []
        parent_check: "Plantéale a {{name}} una elección sencilla entre algo chico hoy y algo más grande después, y fíjate si sabe explicarte cuál conviene."
        prerequisites:
          - path: archipielago-del-trueque/islas-de-los-deseos/solo-tengo-una-cosa-a-la-vez
            strength: soft
            reason: "Ya practicó elegir una cosa y dejar la otra para después, lo que ayuda a comparar una recompensa pequeña de hoy con una meta más grande de mañana."
        lessons:
          - position: 1
            slug: la-tortuga-sabia-del-valle
            micro_objective: "Reconoce en la historia la diferencia entre una recompensa chica ahora y una grande después."
            narrative_beat: "Una tortuga sabia del valle le muestra a Zara dos caminos: uno rápido y chico, otro lento y grande."
            difficulty: 1
            suggested_families: [story, choice]
          - position: 2
            slug: comparo-dos-recompensas
            micro_objective: "Compara dos recompensas presentadas en la historia y elige cuál es mayor."
            narrative_beat: "Rho compara un dulce pequeño de hoy con un telescopio grande dentro de varias semanas."
            difficulty: 1
            suggested_families: [choice]
          - position: 3
            slug: cuanto-vale-esperar
            micro_objective: "Explica en una frase por qué a veces vale la pena esperar por algo más grande."
            narrative_beat: "Liruf le pregunta a la tortuga sabia por qué esperar puede valer la pena."
            difficulty: 2
            suggested_families: [story, choice]
          - position: 4
            slug: elijo-mi-camino
            micro_objective: "Elige, entre el camino rápido y el camino lento, considerando la recompensa de cada uno."
            narrative_beat: "Dina elige seguir el camino lento de la tortuga, pensando en la recompensa que le espera."
            difficulty: 2
            suggested_families: [storyplay, choice]
      - position: 2
        slug: contar-los-dias-que-faltan
        title_es: "Contar los días que faltan"
        concept: "Puedo contar cuántos días faltan para algo, usando números pequeños."
        learning_objective: "Al final, el niño puede contar hacia adelante o hacia atrás un número pequeño de días."
        key_vocabulary: [días que faltan, contar hacia adelante]
        prior_knowledge: "Compara recompensas inmediatas y futuras (tema anterior)."
        fact_refs: [calendar.days_per_week]
        parent_check: "Pídele a {{name}} que cuente contigo cuántos días faltan para un evento cercano, como un cumpleaños o una salida especial."
        lessons:
          - position: 1
            slug: cuantos-dias-faltan
            micro_objective: "Cuenta cuántos días faltan para un evento simple mencionado en la historia."
            narrative_beat: "Rho marca en su calendario de hojas cuántos días faltan para el festival del valle."
            difficulty: 1
            suggested_families: [story, input]
          - position: 2
            slug: tacho-los-dias
            micro_objective: "Marca visualmente los días que van pasando en un calendario simple de una semana."
            narrative_beat: "Zara tacha cada día que pasa en su calendario mientras espera el festival del valle."
            difficulty: 1
            suggested_families: [input, arrange]
          - position: 3
            slug: cuento-hacia-atras
            micro_objective: "Cuenta hacia atrás desde un número pequeño de días hasta llegar a cero."
            narrative_beat: "Liruf cuenta hacia atrás los días que faltan para su cumpleaños en el valle."
            difficulty: 2
            suggested_families: [input]
          - position: 4
            slug: ya-casi-llega-el-dia
            micro_objective: "Reconoce en la historia que el número de días que faltan disminuye cada vez que pasa uno."
