schema_version: 1

# Canonical numeric ground truth (COURSE_ENGINE.md §3). Every number Forge
# puts in a money exercise must either come from here or be pure arithmetic
# the deterministic gate can re-verify. `verified: true` = safe to state as
# fact (denominations, calendar math). `verified: false` = a REFERENCE value
# for exercise flavor only — `enforce: false` means the gate must NOT treat
# it as a hard-pinned constant (a "paleta" can cost $12 or $18 in different
# lessons; only the ORDER OF MAGNITUDE and MXN-plausibility matter).
#
# NEVER-INVENTED: no precise regulatory/legal numbers (minimum ages for bank
# products, tax brackets, interest rates) appear here. If a fact can't be
# stated with confidence it is omitted, not guessed.

facts:

  # ---- MXN denominations (Banxico, currently circulating) ----
  mxn.denominations.coins:
    value: [0.5, 1, 2, 5, 10, 20]
    unit: MXN
    label_es: "Monedas de México en circulación"
    verified: true
    notes: "Banxico; $20 existe como moneda Y billete — evitar ambigüedad usando 'moneda de $20' vs 'billete de $20' explícitamente en el prompt."

  mxn.denominations.coins.tier1_subset:
    value: [1, 2, 5, 10]
    unit: MXN
    label_es: "Subconjunto de monedas para ejercicios tier1 (6-7 años)"
    verified: true
    notes: "La moneda de $0.50 se omite en tier1 — decimales confunden a esta edad; $20 moneda se omite para no chocar con el billete de $20."

  mxn.denominations.bills:
    value: [20, 50, 100, 200, 500, 1000]
    unit: MXN
    label_es: "Billetes de México en circulación"
    verified: true
    notes: "Banxico; familia G de billetes vigente."

  mxn.denominations.bills.tier1_subset:
    value: [20, 50, 100]
    unit: MXN
    label_es: "Subconjunto de billetes para ejercicios tier1"
    verified: true
    notes: "Billetes de $200+ aparecen a partir de tier2 o adventure 3+ una vez dominado el conteo con montos menores."

  # ---- USD denominations ----
  usd.denominations.coins:
    value: [0.01, 0.05, 0.10, 0.25]
    unit: USD
    label_es: "Monedas de Estados Unidos (penny, nickel, dime, quarter)"
    verified: true
    notes: "USD subunit is decimal cents; used only in later locale-specific exercises, not adventures 1-4 (es-MX authoring locale defaults to MXN)."

  usd.denominations.bills:
    value: [1, 5, 10, 20, 50, 100]
    unit: USD
    label_es: "Billetes de Estados Unidos"
    verified: true

  # ---- BRL denominations ----
