    es-MX: "Una estación de diagnóstico donde se revisa cada tipo de ejercicio antes de lanzar un curso real."
    pt-BR: "Uma estação de diagnóstico onde cada tipo de exercício é verificado antes de lançar um curso real."
  narrative_arc: "Antes de lanzar un curso real, dina, liruf, rho y zara recorren la Estación de Pruebas y encienden, uno por uno, los paneles de diagnóstico del Motor de Lecciones — para asegurarse de que todo funcione a la perfección."
