schema_version: 1
# QA/authoring course (COURSE_ENGINE.md §4 addendum). Every lesson pins
# `forced_types` so all 56 LESSON_ENGINE segment types get exercised — but
# the CONTENT is a real, coherent micro-course (Liruf's lemonade stand):
# every lesson teaches a genuine money/entrepreneurship micro-concept in
# warm, kid-facing es-MX. Rewritten 2026-07-13 after the first generated
# batch read as meta/test placeholders ("Verificar el ejercicio X…") — QA
# coverage and real pedagogy are NOT in tension; briefs must always be real.
adventure:
  position: 1
  slug: estacion-de-pruebas
  theme: city
  age_tier: tier2
  title:
    en-US: "Liruf's Lemonade Stand"
    es-MX: "El Puesto de Limonada de Liruf"
    pt-BR: "A Barraca de Limonada do Liruf"
  description:
    en-US: "Liruf opens his first lemonade stand and learns to count money, set prices, save, and sell — one small skill at a time."
    es-MX: "Liruf abre su primer puesto de limonada y aprende a contar dinero, poner precios, ahorrar y vender — una habilidad pequeña a la vez."
    pt-BR: "Liruf abre sua primeira barraca de limonada e aprende a contar dinheiro, definir preços, poupar e vender — uma habilidade de cada vez."
  narrative_arc: "Liruf quiere una guitarra que cuesta 80 pesos. Con ayuda de Dina, Rho y Zara decide ganarse el dinero con un puesto de limonada: primero imagina la idea, luego cuenta sus monedas, arma el puesto, fija un precio justo de 5 pesos por vaso, atiende a sus primeros clientes, aprende de sus errores de cuentas y, día a día, ahorra sus ganancias hasta acercarse a su meta."
sagas:
  - position: 1
    slug: camara-de-tipos
    icon: storefront
    title:
      en-US: "Opening the Stand"
      es-MX: "Abrir el Puesto"
      pt-BR: "Abrindo a Barraca"
    description:
      en-US: "From the first idea to the first sale: money basics, one skill per lesson."
      es-MX: "De la primera idea a la primera venta: fundamentos del dinero, una habilidad por lección."
      pt-BR: "Da primeira ideia à primeira venda: fundamentos do dinheiro, uma habilidade por lição."
    topics:
      - position: 1
        slug: tipos-story
        title_es: "La Gran Idea"
        concept: "Ganar dinero empieza con una idea: Liruf quiere una guitarra de 80 pesos y decide vender limonada al vecindario en lugar de solo esperar."
        learning_objective: "Entender que el dinero se gana ofreciendo algo que otros quieren, y que una meta clara (la guitarra de 80 pesos) ayuda a empezar."
        key_vocabulary: [meta, ganar, vender]
        prior_knowledge: "Ninguno — es el inicio del curso."
        fact_refs: [qa.reference_price.guitar, qa.reference_price.cup]
        parent_check: "Pregúntale a {{name}}: ¿qué quiere comprar Liruf y cómo decidió conseguir el dinero?"
        lessons:
          - position: 1
            slug: story-dialogue
            micro_objective: "Descubrir, en una charla entre Dina y Liruf, que el dinero para la guitarra se puede GANAR vendiendo limonada — no solo esperar un regalo."
            narrative_beat: "Liruf suspira frente al aparador de la guitarra de 80 pesos; Dina le propone: '¿Y si la ganas tú mismo con un puesto de limonada?'"
            difficulty: 1
            suggested_families: [story]
            forced_types: [story_dialogue]
          - position: 2
            slug: story-scene
            micro_objective: "Ver el plan completo en una escena: vender vasos de limonada a 5 pesos hasta juntar los 80 de la guitarra."
            narrative_beat: "Liruf dibuja su plan en una cartulina: un vaso = 5 pesos; muchos vasos = una guitarra."
            difficulty: 1
            suggested_families: [story]
            forced_types: [story_scene]
          - position: 3
            slug: key-ideas
            micro_objective: "Fijar las 3 ideas clave del plan: tener una meta (80 pesos), ofrecer algo que la gente quiera (limonada fría), y guardar lo ganado."
            narrative_beat: "Rho resume en su pizarra las tres reglas de oro del pequeño vendedor."
            difficulty: 1
            suggested_families: [story]
            forced_types: [key_ideas]
          - position: 4
            slug: concept-reveal
            micro_objective: "Voltear tarjetas para descubrir qué significa 'costo' (lo que gastas en limones y azúcar) y 'ganancia' (lo que te queda después de pagar el costo)."
            narrative_beat: "Zara esconde los conceptos en tarjetas: ¿qué habrá detrás de 'costo'? ¿y detrás de 'ganancia'?"
            difficulty: 2
            suggested_families: [story]
            forced_types: [concept_reveal]
          - position: 5
            slug: checkpoint
            micro_objective: "Respirar y repasar: ya tienes meta (80 pesos), producto (limonada a 5 pesos) y sabes qué es costo y ganancia. ¿Cómo te sientes para abrir el puesto?"
            narrative_beat: "Dina pregunta a Liruf cómo se siente antes del gran día de apertura."
            difficulty: 1
            suggested_families: [story]
            forced_types: [checkpoint]
      - position: 2
        slug: tipos-choice
        title_es: "Decisiones de Vendedor"
        concept: "Un vendedor toma decisiones todo el día: qué precio poner, dónde guardar el dinero, a qué cliente atender primero y qué gastos valen la pena."
        learning_objective: "Tomar decisiones simples de dinero comparando opciones: precio justo, lugar seguro para guardar, y distinguir un buen trato de uno malo."
        key_vocabulary: [precio, decisión, seguro]
        prior_knowledge: "La meta de 80 pesos y el precio de 5 pesos por vaso."
        fact_refs: [qa.reference_price.cup, mxn.denominations.coins]
        parent_check: "Pregúntale a {{name}}: ¿dónde está más seguro el dinero del puesto y por qué?"
        lessons:
          - position: 1
            slug: quiz-mcq
            micro_objective: "Elegir el precio justo para un vaso de limonada (5 pesos) entre opciones exageradas (50 pesos ahuyenta clientes; 1 peso no cubre el costo)."
            narrative_beat: "Primer dilema del puesto: ¿a cuánto el vaso? Liruf duda entre varias etiquetas de precio."
            difficulty: 1
            suggested_families: [choice]
            forced_types: [quiz_mcq]
          - position: 2
            slug: true-false
            micro_objective: "Decidir si es cierto o falso: 'Si guardo 5 pesos de cada venta, mi ahorro CRECE cada día'."
            narrative_beat: "Zara lanza una frase sobre el ahorro y Liruf debe atraparla como cierta o falsa."
            difficulty: 1
            suggested_families: [choice]
            forced_types: [true_false]
          - position: 3
            slug: picture-choice
            micro_objective: "Elegir con imágenes el lugar más seguro para guardar las ganancias del día: la alcancía con llave (no el bolsillo roto ni la mesa del puesto)."
            narrative_beat: "Al cerrar el puesto, Liruf mira tres lugares posibles para su dinero."
            difficulty: 1
            suggested_families: [choice]
            forced_types: [picture_choice]
          - position: 4
            slug: odd-one-out
            micro_objective: "Detectar cuál NO es un ingrediente de la limonada (limones, azúcar, agua… ¿y una pelota?): separar lo que sí cuesta dinero producir."
            narrative_beat: "Rho revisa la lista de compras y algo raro se coló."
            difficulty: 1
            suggested_families: [choice]
            forced_types: [odd_one_out]
          - position: 5
            slug: best-decision
            micro_objective: "Elegir la MEJOR decisión cuando un cliente paga con billete de 20 por un vaso de 5: contar el cambio con calma (no adivinarlo ni quedárselo)."
            narrative_beat: "La primera clienta paga con un billete grande y Liruf siente nervios."
            difficulty: 2
            suggested_families: [choice]
            forced_types: [best_decision]
          - position: 6
            slug: yes-no-cases
            micro_objective: "Decir sí o no, caso por caso: ¿este gasto ayuda al puesto? (más limones: sí; un juguete nuevo hoy: no, todavía no)."
            narrative_beat: "Liruf repasa su lista de tentaciones y necesidades con Dina."
            difficulty: 2
            suggested_families: [choice]
            forced_types: [yes_no_cases]
          - position: 7
            slug: speed-tap
            micro_objective: "Atrapar rápido solo las MONEDAS entre los objetos que pasan (monedas sí; botones y corcholatas no): reconocer el dinero de un vistazo."
            narrative_beat: "¡Se volcó el frasco! Ayuda a Liruf a rescatar sus monedas antes de que rueden."
            difficulty: 1
            suggested_families: [choice]
            forced_types: [speed_tap]
          - position: 8
            slug: confidence-quiz
            micro_objective: "Responder cuánto es 5 + 5 (dos vasos vendidos) y además decir qué tan seguro te sientes de tu respuesta — aprender a confiar en tus cuentas."
            narrative_beat: "Dos ventas seguidas: Liruf suma mentalmente y Dina le pregunta '¿qué tan seguro estás?'"
            difficulty: 2
            suggested_families: [choice]
            forced_types: [confidence_quiz]
      - position: 3
        slug: tipos-input
        title_es: "Las Cuentas del Puesto"
        concept: "Escribir y calcular números reales del puesto: cuántos limones hay, cuánto se ganó, cuánto falta para la meta."
        learning_objective: "Escribir respuestas numéricas y de texto exactas sobre las ventas del día (sumas hasta 80, conteos hasta 20)."
        key_vocabulary: [suma, total, contar]
        prior_knowledge: "El precio de 5 pesos por vaso y la meta de 80."
        fact_refs: [qa.reference_price.cup, qa.reference_price.guitar]
        parent_check: "Pídele a {{name}} que te diga cuánto gana Liruf si vende 4 vasos a 5 pesos."
        lessons:
          - position: 1
            slug: type-answer
            micro_objective: "Escribir la palabra que nombra el dinero que guardas para después: 'ahorro'."
            narrative_beat: "Rho juega al ahorcado financiero: '¿cómo se llama el dinero que no gastas hoy?'"
            difficulty: 1
            suggested_families: [input]
            forced_types: [type_answer]
          - position: 2
            slug: fill-blank
            micro_objective: "Completar la frase de la ganancia: 'Vendí un vaso en 5 pesos, los ingredientes costaron 2, mi ganancia es ___ pesos'."
            narrative_beat: "Dina deja huecos en el cuaderno de cuentas para que Liruf los llene."
            difficulty: 2
            suggested_families: [input]
            forced_types: [fill_blank]
          - position: 3
            slug: number-input
            micro_objective: "Calcular y escribir cuánto ganó Liruf en total si vendió 4 vasos a 5 pesos cada uno (20 pesos)."
            narrative_beat: "Fin de la mañana: 4 vasos vendidos. ¿Cuánto hay en la caja?"
            difficulty: 2
            suggested_families: [input]
            forced_types: [number_input]
          - position: 4
            slug: estimate-slider
            micro_objective: "Estimar con la barra cuántos vasos salen de una jarra grande (ni 1 ni 100: alrededor de 8) — estimar antes de contar."
            narrative_beat: "Zara prepara la jarra del día y pregunta: 'sin contar, ¿como cuántos vasos crees que salgan?'"
            difficulty: 1
            suggested_families: [input]
            forced_types: [estimate_slider]
          - position: 5
            slug: count-objects
            micro_objective: "Contar los limones que quedan en la canasta para saber si alcanzan para mañana."
            narrative_beat: "Inventario nocturno: Liruf cuenta limones a la luz de una lamparita."
            difficulty: 1
            suggested_families: [input]
            forced_types: [count_objects]
          - position: 6
            slug: equation-builder
            micro_objective: "Armar con fichas la suma de la tarde: 5 + 5 + 5 = 15 pesos (tres vasos vendidos)."
            narrative_beat: "Rho da fichas con números y signos: 'arma tú mismo la cuenta de la tarde'."
            difficulty: 2
            suggested_families: [input]
            forced_types: [equation_builder]
      - position: 4
        slug: tipos-arrange
        title_es: "Organizar el Puesto"
        concept: "Un puesto ordenado vende más: los pasos de la receta en orden, los precios emparejados con sus productos, y las compras por prioridad."
        learning_objective: "Ordenar pasos, emparejar productos con precios y clasificar compras entre necesidades del puesto y gustos que pueden esperar."
        key_vocabulary: [orden, primero, prioridad]
        prior_knowledge: "Costo y ganancia; el precio del vaso."
        fact_refs: [qa.reference_price.cup]
        parent_check: "Pídele a {{name}} que te diga los pasos para preparar la limonada en orden."
        lessons:
          - position: 1
            slug: match-pairs
            micro_objective: "Emparejar cada producto del puesto con su precio correcto (vaso chico–5, jarra–20, galleta–3)."
            narrative_beat: "El viento tiró las etiquetas de precios; hay que devolver cada una a su producto."
            difficulty: 1
            suggested_families: [arrange]
            forced_types: [match_pairs]
          - position: 2
            slug: memory-flip
            micro_objective: "Encontrar los pares escondidos de monedas iguales (1 con 1, 5 con 5, 10 con 10): reconocer las monedas de México."
            narrative_beat: "Zara inventa un juego de memoria con las monedas de la caja."
            difficulty: 1
            suggested_families: [arrange]
            forced_types: [memory_flip]
          - position: 3
            slug: sort-buckets
            micro_objective: "Clasificar las compras del día en dos cubetas: NECESIDAD del puesto (limones, vasos) o GUSTO que puede esperar (stickers, globos)."
            narrative_beat: "Antes de ir al mercado, Dina y Liruf separan la lista en dos montones."
            difficulty: 2
            suggested_families: [arrange]
            forced_types: [sort_buckets]
          - position: 4
            slug: order-steps
            micro_objective: "Poner en orden los pasos de la limonada: exprimir limones → agregar agua → endulzar → probar → servir."
            narrative_beat: "Receta revuelta: las tarjetas de pasos se cayeron y hay que reordenarlas."
            difficulty: 1
            suggested_families: [arrange]
            forced_types: [order_steps]
          - position: 5
            slug: rank-choices
            micro_objective: "Ordenar de más a menos urgente en qué gastar la ganancia de hoy: reponer limones primero, luego vasos, y al final adornos."
            narrative_beat: "Con 20 pesos ganados, Rho ayuda a decidir qué compra va primero."
            difficulty: 2
            suggested_families: [arrange]
            forced_types: [rank_choices]
          - position: 6
            slug: build-sentence
            micro_objective: "Armar, palabra por palabra, el letrero del puesto: 'Limonada fría a 5 pesos'."
            narrative_beat: "Las palabras del cartel están sueltas sobre la mesa; hay que armarlo bonito."
            difficulty: 1
            suggested_families: [arrange]
            forced_types: [build_sentence]
          - position: 7
            slug: timeline-order
            micro_objective: "Ordenar el día de venta en el tiempo: comprar ingredientes por la mañana → preparar → vender al mediodía → contar dinero y guardar al cierre."
            narrative_beat: "Liruf recuerda su primer día completo y acomoda las fotos en orden."
            difficulty: 2
            suggested_families: [arrange]
            forced_types: [timeline_order]
          - position: 8
            slug: pattern-complete
            micro_objective: "Completar el patrón de la fila de vasos del mostrador (chico, grande, chico, grande…): descubrir qué sigue."
            narrative_beat: "Zara acomoda los vasos con un patrón y deja huecos a propósito."
            difficulty: 1
            suggested_families: [arrange]
            forced_types: [pattern_complete]
          - position: 9
            slug: group-sets
            micro_objective: "Agrupar el dinero de la caja: monedas con monedas y billetes con billetes, para contarlo más fácil."
            narrative_beat: "Cierre del día: la caja está revuelta y hay que separar el dinero por tipo."
            difficulty: 1
            suggested_families: [arrange]
            forced_types: [group_sets]
          - position: 10
            slug: number-line
            micro_objective: "Ubicar en la recta numérica del 0 al 100 dónde va el ahorro de Liruf (20 pesos) y dónde la meta (80): ver cuánto falta."
            narrative_beat: "Rho dibuja una recta gigante con gis: 'marca dónde vas y a dónde quieres llegar'."
            difficulty: 2
            suggested_families: [arrange]
            forced_types: [number_line]
      - position: 5
        slug: tipos-money
        title_es: "La Caja del Dinero"
        concept: "Manejar dinero de verdad: contar monedas mexicanas, dar cambio exacto, repartir la ganancia y avanzar hacia la meta de 80 pesos."
        learning_objective: "Contar dinero con monedas de 1, 2, 5 y 10, calcular cambio de un billete de 20, y planear cuántas semanas faltan para la meta."
        key_vocabulary: [cambio, alcancía, meta]
        prior_knowledge: "Sumas hasta 80; monedas y billetes de México."
        fact_refs: [mxn.denominations.coins, mxn.denominations.bills, qa.reference_price.cup, qa.reference_price.guitar]
        parent_check: "Dale a {{name}} un billete imaginario de 20 por un vaso de 5 y pídele tu cambio."
        lessons:
          - position: 1
            slug: coin-count
            micro_objective: "Contar las monedas de la primera venta: juntar 5 pesos exactos con monedas de 1 y 2."
            narrative_beat: "Un cliente paga su vaso todo en moneditas; hay que verificar que sean 5."
            difficulty: 1
            suggested_families: [money]
            forced_types: [coin_count]
          - position: 2
            slug: make-change
            micro_objective: "Dar el cambio correcto: el vaso cuesta 5, pagan con billete de 20 → regresar 15 (10 + 5)."
            narrative_beat: "La señora del perrito paga con 20 y espera sonriente su cambio."
            difficulty: 2
            suggested_families: [money]
            forced_types: [make_change]
          - position: 3
            slug: piggy-split
            micro_objective: "Repartir 10 pesos de ganancia entre las dos alcancías: una parte para la meta de la guitarra y otra para reponer ingredientes."
            narrative_beat: "Dos alcancías esperan: la de la guitarra y la del puesto. ¿Cómo repartir lo de hoy?"
            difficulty: 2
            suggested_families: [money]
            forced_types: [piggy_split]
          - position: 4
            slug: needs-wants
            micro_objective: "Separar necesidades del puesto (limones, hielo) de deseos personales (paleta, cómic): el puesto come primero."
            narrative_beat: "En el mercado todo brilla; Dina ayuda a Liruf a no perder el rumbo."
            difficulty: 1
            suggested_families: [money]
            forced_types: [needs_wants]
          - position: 5
            slug: price-compare
            micro_objective: "Comparar precios de limones en dos puestos del mercado y elegir el más barato para gastar menos (costo más bajo = más ganancia)."
            narrative_beat: "Dos marchantes gritan sus ofertas de limones; solo una conviene."
            difficulty: 2
            suggested_families: [money]
            forced_types: [price_compare]
          - position: 6
            slug: budget-fit
            micro_objective: "Armar la compra del día sin pasarse del presupuesto de 20 pesos: elegir qué ingredientes caben."
            narrative_beat: "Con un billete de 20 en la mano, Liruf recorre el mercado calculando."
            difficulty: 3
            suggested_families: [money]
            forced_types: [budget_fit]
          - position: 7
            slug: savings-goal
            micro_objective: "Calcular cuántas semanas faltan para la guitarra de 80 pesos si Liruf ahorra 20 pesos por semana (4 semanas)."
            narrative_beat: "Rho saca su calendario: 'si guardas lo mismo cada semana, ¿cuándo llega la guitarra?'"
            difficulty: 3
            suggested_families: [money]
            forced_types: [savings_goal]
          - position: 8
            slug: fair-trade
            micro_objective: "Decidir si un trueque es justo: ¿cambiar 2 vasos de limonada (10 pesos) por una bolsa de limones que vale 10? Comparar valores antes de aceptar."
            narrative_beat: "El frutero propone un intercambio sin dinero; Liruf hace cuentas antes de dar la mano."
            difficulty: 3
            suggested_families: [money]
            forced_types: [fair_trade]
          - position: 9
            slug: interest-peek
            micro_objective: "Asomarse a un secreto del ahorro: si la alcancía del banco 'agradece' con moneditas extra por esperar, el dinero guardado crece solito con el tiempo."
            narrative_beat: "La abuela le cuenta a Liruf por qué su dinero en el banco 'trabaja' mientras él duerme."
            difficulty: 3
            suggested_families: [money]
            forced_types: [interest_peek]
      - position: 6
        slug: tipos-analyze
        title_es: "Detective de Números"
        concept: "Leer y revisar la información del puesto: encontrar errores de cuentas, leer la gráfica de ventas y desconfiar de tratos demasiado buenos."
        learning_objective: "Detectar un error en una suma de ventas, leer una gráfica simple de vasos vendidos por día y reconocer señales de un mal trato."
        key_vocabulary: [gráfica, error, comparar]
        prior_knowledge: "Sumas del puesto y días de venta."
        fact_refs: [qa.reference_price.cup]
        parent_check: "Muéstrale a {{name}} una suma con un error a propósito y pídele encontrarlo."
        lessons:
          - position: 1
            slug: spot-error
            micro_objective: "Encontrar el paso equivocado en la cuenta de Liruf: 5 + 5 + 5 no puede dar 20."
            narrative_beat: "Algo no cuadra al cierre: sobra una cifra en el cuaderno."
            difficulty: 2
            suggested_families: [analyze]
            forced_types: [spot_error]
          - position: 2
            slug: cause-effect
            micro_objective: "Conectar causas y efectos del puesto: día soleado → más sed → más vasos vendidos; subir el precio al doble → menos clientes."
            narrative_beat: "Rho y Liruf comparan dos días muy distintos de ventas y buscan el porqué."
            difficulty: 2
            suggested_families: [analyze]
            forced_types: [cause_effect]
          - position: 3
            slug: compare-table
            micro_objective: "Leer la tabla de dos proveedores de limones (precio y cantidad) y elegir el que da más por menos."
            narrative_beat: "Dina hace una tabla comparativa en la libreta antes de decidir dónde comprar."
            difficulty: 3
            suggested_families: [analyze]
            forced_types: [compare_table]
          - position: 4
            slug: read-chart
            micro_objective: "Leer la gráfica de barras de vasos vendidos por día y responder cuál fue el mejor día de la semana."
            narrative_beat: "Zara dibuja barras de colores con las ventas de lunes a viernes."
            difficulty: 2
            suggested_families: [analyze]
            forced_types: [read_chart]
          - position: 5
            slug: evidence-hunt
            micro_objective: "Buscar en el recibo del mercado la evidencia exacta de cuánto costaron los limones."
            narrative_beat: "'¿Y en qué se fue el dinero?' — el recibo arrugado tiene la respuesta."
            difficulty: 2
            suggested_families: [analyze]
            forced_types: [evidence_hunt]
          - position: 6
            slug: red-flags
            micro_objective: "Detectar las señales de alerta en la oferta de un desconocido ('dame tus 20 pesos hoy y mañana te doy 100'): promesas demasiado buenas no son de fiar."
            narrative_beat: "Un vendedor apurado ofrece a Liruf un 'negocio mágico' que huele raro."
            difficulty: 3
            suggested_families: [analyze]
            forced_types: [red_flags]
          - position: 7
            slug: fact-opinion
            micro_objective: "Separar hechos ('el vaso cuesta 5 pesos') de opiniones ('mi limonada es la más rica del mundo') en las frases del puesto."
            narrative_beat: "Rho lee en voz alta frases del día: unas se pueden comprobar, otras solo son gustos."
            difficulty: 2
            suggested_families: [analyze]
            forced_types: [fact_opinion]
      - position: 7
        slug: tipos-storyplay
        title_es: "Historias con Decisiones"
        concept: "Vivir el puesto en historias jugables: cada decisión (precio, trato al cliente, gasto) cambia cómo termina el día."
        learning_objective: "Tomar decisiones dentro de historias del puesto y ver sus consecuencias inmediatas en las ventas y el ahorro."
        key_vocabulary: [decisión, consecuencia, cliente]
        prior_knowledge: "Todo lo aprendido del puesto hasta aquí."
