  # ---- Core arithmetic anchors (verified: true — tautological, the
  # deterministic gate re-executes these sums, never trusts the model) ----
  business.math.formula_ganancia:
    value: "ganancia = precio - costo"
    unit: n/a
    label_es: "Fórmula base de ganancia usada en todos los ejercicios de precio justo"
    verified: true
    notes: "Identidad aritmética, no un dato externo — el gate determinista la re-verifica restando."

  business.math.ejemplo_ganancia_15_10:
    value: 5
    unit: MXN
    label_es: "Ejemplo verificable: precio $15 − costo $10 = ganancia $5"
    verified: true
    notes: "15 - 10 = 5; usado como ancla de referencia en El Valle del Precio Justo."

  business.math.ejemplo_ganancia_20_12:
    value: 8
    unit: MXN
    label_es: "Segundo ejemplo verificable: precio $20 − costo $12 = ganancia $8"
    verified: true
    notes: "20 - 12 = 8; segunda ancla de referencia con números distintos."

  business.math.ejemplo_costo_total_limonada:
    value: 4
    unit: MXN
    label_es: "Ejemplo verificable de costo total: vaso $2 + limón $1 + azúcar $1 = $4"
    verified: true
    notes: "2 + 1 + 1 = 4; ancla para 'contar costos completos' (no olvidar ningún material)."

  # ---- Pedagogical conventions/ceilings (verified: true as CONVENTIONS, not
  # external facts — identical pattern to financial-education's
  # math.max_single_coin_count_tier1) ----
  business.math.venta_semanal_dias:
    value: 5
    unit: days
    label_es: "Días de venta por semana usados en los ejercicios de La Ciudad del Cliente y El Valle del Precio Justo"
    verified: true
    notes: "Convención pedagógica (puesto de fin de semana + un par de días entre semana), no un dato regulado."

  business.math.ganancia_ceiling_tier2:
    value: 100
    unit: MXN
    label_es: "Ganancia máxima objetivo usada en ejercicios de precio justo de esta aventura"
    verified: true
    notes: "Tope pedagógico para mantener las restas dentro del rango de cálculo mental de 8-10 años."

  business.math.costo_ceiling_tier2:
    value: 60
    unit: MXN
    label_es: "Costo total máximo usado en ejercicios de 'contar costos completos'"
    verified: true
    notes: "Tope pedagógico — permite sumar 3-4 materiales sin exceder la comprensión numérica tier2."

  # ---- Teen-scale reference costs & prices (MXN) — added for the tier4
  # pivot (WALKTHROUGH 2026-08-12). APPROXIMATE, for exercise flavor only,
  # same convention as the kid-business reference prices above: only
  # order-of-magnitude and MXN-plausibility matter. NEVER-INVENTED still
  # applies — no regulated commission rates, no real minimum wage, no real
  # gig-platform fee schedule; the illustrative commission below is flagged
  # explicitly as illustrative and platform/city-dependent, never a pinned
  # regulatory number. ----
  mxn.reference_costs.funda_personalizada_materiales:
