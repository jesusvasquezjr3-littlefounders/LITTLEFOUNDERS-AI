schema_version: 1

# Canonical numeric ground truth (COURSE_ENGINE.md §3) for the entrepreneurship
# course. Every number Forge puts in a money/business exercise must either
# come from here or be pure arithmetic the deterministic gate can re-verify.
# `verified: true` = safe to state as fact (denominations, calendar math,
# pedagogical conventions/ceilings, and arithmetic identities that are
# tautologically re-checkable — e.g. ganancia = precio - costo). `verified:
# false` = a REFERENCE value for exercise flavor only (kid-business costs and
# selling prices) — `enforce: false` means the gate must NOT treat it as a
# hard-pinned constant.
#
# NEVER-INVENTED: no precise regulatory/legal numbers (business licensing,
# tax rates, minimum wage) appear here. If a fact can't be stated with
# confidence it is omitted, not guessed.

facts:

  # ---- MXN denominations (copied verbatim from financial-education/facts.yaml
  # — Banxico currently-circulating denominations, project-wide, not
  # reinvented per course) ----
  mxn.denominations.coins:
    value: [0.5, 1, 2, 5, 10, 20]
    unit: MXN
    label_es: "Monedas de México en circulación"
    verified: true
    notes: "Banxico; $20 existe como moneda Y billete — evitar ambigüedad usando 'moneda de $20' vs 'billete de $20' explícitamente en el prompt."

  mxn.denominations.coins.tier1_subset:
    value: [1, 2, 5, 10]
    unit: MXN
    label_es: "Subconjunto de monedas para ejercicios tier1 (6-7 años)"
    verified: true
    notes: "La moneda de $0.50 se omite en tier1 — decimales confunden a esta edad; $20 moneda se omite para no chocar con el billete de $20."

  mxn.denominations.bills:
    value: [20, 50, 100, 200, 500, 1000]
    unit: MXN
    label_es: "Billetes de México en circulación"
    verified: true
    notes: "Banxico; familia G de billetes vigente."

  mxn.denominations.bills.tier1_subset:
    value: [20, 50, 100]
    unit: MXN
    label_es: "Subconjunto de billetes para ejercicios tier1"
    verified: true
    notes: "Billetes de $200+ quedan reservados para tier2, una vez dominado el conteo con montos menores."

  # ---- Calendar / counting anchors (copied verbatim from
  # financial-education/facts.yaml — used by savings/venta-por-semana math) ----
  calendar.days_per_week:
    value: 7
    unit: days
    label_es: "Días en una semana"
    verified: true

  calendar.weeks_per_month_approx:
    value: 4
    unit: weeks
    label_es: "Semanas por mes (aproximado, para cálculos simples infantiles)"
    verified: true
    notes: "Aproximación deliberada (4, no 4.33) — tier1 no maneja fracciones de semana."

  calendar.months_per_year:
    value: 12
    unit: months
    label_es: "Meses en un año"
    verified: true

  calendar.days_per_month_approx:
    value: 30
    unit: days
    label_es: "Días por mes (aproximado, redondeado para cálculos infantiles)"
    verified: true

