schema_version: 1

# Closed vocabulary for the entrepreneurship course catalog.
# Consumed by Forge (coursegen) as a HARD-FAIL gate (COURSE_ENGINE.md §3, §4):
# the forbidden-vocabulary lists are checked against every generated string
# (titles, concepts, objectives, prompts) for the matching age tier + locale.
#
# PIVOT (WALKTHROUGH 2026-08-12): this course dropped tier1-3 (6-12) entirely
# and now targets a single tier4 (12-18) audience — matured language, real
# analogies (contentPlaybook.ts tierReasoningGuidance('tier4')), fewer/longer
# lessons. It still runs AFTER financial-education (COURSE_ENGINE.md §3.1b —
# `course.requires: [financial-education]`), so learners arrive already
# knowing what money is, how to earn/save/spend it.
#
# At tier4 the Piaget vocabulary ceiling is effectively OFF: a 12-18-year-old
# can handle full business/financial vocabulary (deuda, crédito, presupuesto,
# margen, ROI, valuación...). There is no course-specific hard ceiling for
# entrepreneurship the way investing has one for high-risk trading jargon —
# so the forbidden list stays empty by design, not an oversight.

themes: [archipelago, forest, city, valley, kingdom, cosmos]

age_tiers:
  tier4:
    ages: "12-18"
    # No Piaget ceiling at this age for business/financial vocabulary, and no
    # entrepreneurship-specific hard ceiling exists (contrast: investing's
    # tier4 keeps a hard ban on high-risk trading jargon — see that course's
    # taxonomy.yaml). Empty by design.
    forbidden_vocabulary:
      es-MX: []
      en-US: []
      pt-BR: []

families: [story, choice, input, arrange, money, analyze, storyplay, maker]

# Which of the 8 families a plan/write prompt may draw exercise TYPES from.
# tier4 gets the full palette — same set tier2/tier3 already used project-wide,
# there is nothing left to unlock at an older tier.
family_allowlist_by_tier:
  tier4: [story, choice, input, arrange, money, analyze, storyplay, maker]

# No tier1-style type exceptions/bans apply at tier4 — the full LESSON_ENGINE
# type palette is available without carve-outs.
type_exceptions: {}
