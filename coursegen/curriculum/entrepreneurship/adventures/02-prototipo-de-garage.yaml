schema_version: 1

adventure:
  position: 2
  slug: prototipo-de-garage
  theme: valley
  age_tier: tier4
  title:
    en-US: "Garage Prototype"
    es-MX: "Prototipo de Garage"
    pt-BR: "Prototipo de Garagem"
  description:
    en-US: "In the Valley of Garages, the crew builds a real MVP under real limits - money, time and tools - and learns that shipped beats perfect."
    es-MX: "En el Valle de los Garages, el equipo construye un MVP real bajo limites reales - dinero, tiempo y herramientas - y aprende que lanzar vale más que ser perfecto."
    pt-BR: "No Vale das Garagens, a equipe constroi um MVP real sob limites reais - dinheiro, tempo e ferramentas - e aprende que lancar vale mais que ser perfeito."
  narrative_arc: "Dina, Liruf, Rho y Zara dejan atras el Distrito Beta con una oportunidad validada bajo el brazo y llegan al Valle de los Garages, donde decenas de talleres compiten por construir la mejor primera versión de una idea. Ahí aprenden que un MVP no es una versión barata de un sueno, sino la versión más pequeña que ya demuestra que el sueno funciona - y que el dinero, el tiempo y las herramientas disponibles no son excusas, son el terreno real donde se construye. El valle entero se prepara para un Demo Day donde cada equipo debe mostrar, con números reales, lo que construyo."

sagas:
  - position: 1
    slug: que-es-un-mvp
    icon: build
    title:
      en-US: "What Is an MVP"
      es-MX: "Que es un MVP"
      pt-BR: "O que e um MVP"
    description:
      en-US: "The smallest version of your idea that already proves it works."
      es-MX: "La versión más chica de tu idea que ya demuestra que funciona."
      pt-BR: "A versao mais simples da sua ideia que ja prova que funciona."
    topics:
        - position: 1
          slug: el-producto-mas-pequeno-que-funciona
          title_es: "El producto más pequeño que funciona"
          concept: "Un MVP (producto mínimo viable) es la versión más chica de tu idea que ya resuelve el problema real, sin adornos."
          learning_objective: "El aprendiz distingue un MVP de una versión completa e identifica el nucleo funcional de una idea dada."
          key_vocabulary: [MVP, producto mínimo viable, nucleo funcional]
          prior_knowledge: "Completo Radar de Oportunidades (aventura anterior): ya tiene una oportunidad validada."
          fact_refs: []
          parent_check: "Preguntale a {{name}} cual sería la versión más chica y más simple de su idea que ya podría probar esta semana."
          lessons:
            - position: 1
              slug: la-app-con-un-solo-boton
              micro_objective: "Reconoce, entre 3 versiónes de una idea, cual es el MVP y cual ya tiene demasiados extras."
              narrative_beat: "Liruf diseña una app con 12 funciónes; Rho le pregunta cual de esas 12 resuelve de verdad el problema que encontraron en el distrito."
              difficulty: 1
              suggested_families: [choice, analyze]
            - position: 2
              slug: quito-todo-lo-que-no-es-esencial
              micro_objective: "Elimina, de una lista de 6 caracteristicas, las que no son necesarias para el primer MVP."
              narrative_beat: "Zara tacha 4 de 6 ideas para su servicio de tutorias: solo deja las que hacen que el servicio funcione desde el primer día."
              difficulty: 2
              suggested_families: [choice, analyze]
        - position: 2
          slug: que-es-lo-esencial
          title_es: "Que es lo esencial"
          concept: "Lo esencial es la parte de tu producto sin la cual el problema no se resuelve; todo lo demas es un extra que puede esperar."
          learning_objective: "El aprendiz distingue caracteristicas esenciales de caracteristicas deseables en un producto dado."
          key_vocabulary: [esencial, deseable, nucleo del problema]
          prior_knowledge: "Distingue un MVP de una versión completa (tema anterior)."
          fact_refs: []
          parent_check: "Pregunta a {{name}} que parte de su idea es la única realmente necesaria, sin la cual el producto ya no serviria de nada."
          lessons:
            - position: 1
              slug: sin-esto-no-funciona
              micro_objective: "Identifica, entre 4 caracteristicas de un producto, cual es la única sin la que el producto deja de resolver el problema."
              narrative_beat: "Rho revisa su idea de estuches personalizados: sin protección real, ni el diseño más bonito sirve de algo."
              difficulty: 2
              suggested_families: [choice, analyze]
            - position: 2
              slug: esencial-o-solo-bonito
              micro_objective: "Clasifica 5 caracteristicas entre esenciales (resuelven el problema) y deseables (solo mejoran la experiencia)."
              narrative_beat: "Dina separa en dos columnas las funciónes de su idea: las que resuelven el problema y las que solo se ven bien."
              difficulty: 3
              suggested_families: [arrange, analyze]
        - position: 3
          slug: no-es-perfecto-es-util
          title_es: "No es perfecto, es util"
          concept: "Un MVP no busca impresionar por su acabado; busca demostrar, de la forma más simple posible, que la solución funciona."
          learning_objective: "El aprendiz elige la versión más util (aunque menos pulida) de un producto sobre la versión más bonita pero más lenta de construir."
          key_vocabulary: [util, pulido, demostrar que funciona]
          prior_knowledge: "Distingue caracteristicas esenciales de deseables (tema anterior)."
          fact_refs: []
          parent_check: "Preguntale a {{name}} si esta priorizando que su prototipo se vea perfecto o que de verdad funcione y se pueda probar pronto."
          lessons:
            - position: 1
              slug: bonito-pero-tardado-o-feo-pero-rapido
              micro_objective: "Compara dos versiónes de un mismo producto y elige la que se puede probar más rápido, aunque se vea menos pulida."
              narrative_beat: "Liruf quiere pintar a mano cada estuche (2 horas cada uno); Zara propone estampas simples que se hacen en 10 minutos."
              difficulty: 3
              suggested_families: [choice, analyze]
            - position: 2
              slug: demuestro-que-funciona-no-que-es-bonito
              micro_objective: "Elige, entre dos prototipos, el que mejor demuestra que la idea resuelve el problema, sin importar su acabado."
              narrative_beat: "Rho presenta una caja de carton con el mecanismo real adentro, en vez de esperar semanas por una caja perfecta."
              difficulty: 3
              suggested_families: [choice, story]
        - position: 4
          slug: que-le-quito-primero
          title_es: "Que le quito primero"
          concept: "Cuando una idea tiene demasiadas partes, hay que decidir en que orden recortar sin perder lo que la hace funcionar."
          learning_objective: "El aprendiz ordena las partes de un producto de la más fácil de recortar a la más difícil de recortar sin romper el MVP."
          key_vocabulary: [recortar, orden de prioridad, romper el MVP]
          prior_knowledge: "Elige la versión más util sobre la más bonita (tema anterior)."
          fact_refs: []
          parent_check: "Pidele a {{name}} que ordene las partes de su idea de la más fácil de dejar para después a la más necesaria desde el primer día."
          lessons:
            - position: 1
              slug: ordeno-que-recorto-primero
              micro_objective: "Ordena 4 partes de un producto de la más prescindible a la más indispensable."
              narrative_beat: "Zara ordena las partes de su servicio de lavado de tenis: el empaque de regalo es lo primero que puede esperar."
              difficulty: 3
              suggested_families: [arrange, analyze]
            - position: 2
              slug: si-recorto-esto-se-rompe-el-mvp
              micro_objective: "Identifica cual de 3 recortes propuestos rompe el MVP porque elimina algo esencial, no un extra."
              narrative_beat: "Liruf propone quitar el paso de revisar que el pedido este completo; Rho le explica que eso rompe la promesa básica del servicio."
              difficulty: 4
              suggested_families: [choice, analyze]
        - position: 5
          slug: version-1-no-es-version-final
          title_es: "Versión 1 no es versión final"
          concept: "La primera versión de cualquier producto real es apenas el punto de partida; se espera que cambie después de probarla con gente de verdad."
          learning_objective: "El aprendiz adopta la mentalidad de versión 1 (V1): construir para aprender, no para terminar de una vez."
          key_vocabulary: [versión 1, iterar, punto de partida]
          prior_knowledge: "Ordena que recortar primero (tema anterior)."
          fact_refs: []
          parent_check: "Preguntale a {{name}} si esta bien que su primera versión tenga fallas, siempre y cuando aprenda algo real al probarla."
          lessons:
            - position: 1
              slug: la-primera-version-de-algo-conocido
              micro_objective: "Reconoce, en un caso, que la primera versión de un producto conocido era mucho más simple que la versión actual."
              narrative_beat: "Rho descubre que la primera versión de una app famosa solo tenia una función, nada más."
              difficulty: 4
              suggested_families: [story, choice]
            - position: 2
              slug: mi-v1-va-a-cambiar-y-esta-bien
              micro_objective: "Elige la actitud correcta frente a la idea de que su V1 tendra fallas y cambiara después."
              narrative_beat: "Dina le recuerda a Liruf que su V1 no tiene que ser perfecta: 'va a cambiar, y eso es justo el plan'."
              difficulty: 4
              suggested_families: [choice, storyplay]
        - position: 6
          slug: mi-mvp-en-una-frase
          title_es: "Mi MVP en una frase"
          concept: "Un MVP bien definido cabe en una frase: que hace, para quien, y que NO incluye todavia."
          learning_objective: "El aprendiz redacta la definición de su propio MVP en una sola frase con alcance claro."
          key_vocabulary: [definición de MVP, alcance, todavia no incluye]
          prior_knowledge: "Adopta la mentalidad de V1 (tema anterior)."
          fact_refs: []
          parent_check: "Pidele a {{name}} que te diga, en una sola frase, que hace su MVP y que no va a incluir todavia."
          lessons:
            - position: 1
              slug: reviso-3-definiciones-de-mvp
              micro_objective: "Revisa 3 definiciónes de MVP y elige la que tiene alcance más claro (que hace y que no incluye)."
              narrative_beat: "Zara compara tres frases de MVP escritas por el equipo y elige la única que dice claramente que NO va a incluir todavia."
              difficulty: 4
              suggested_families: [choice, analyze]
            - position: 2
              slug: escribo-mi-mvp
              micro_objective: "Redacta, sin ayuda, la definición de su propio MVP en una sola frase con alcance claro."
              narrative_beat: "Rho escribe en su cuaderno de taller la frase final de su MVP y la clava en la pared del garage."
              difficulty: 5
              suggested_families: [storyplay, choice]
        - position: 7
          slug: repaso-que-es-un-mvp
          kind: review_spaced
          title_es: "Repaso: Que es un MVP"
          concept: "El equipo repasa como reconocer lo esencial de una idea y definir un MVP claro antes de construir."
          learning_objective: "El aprendiz recuerda y aplica, sin nueva enseñanza, los criterios de esta saga para definir un MVP."
          key_vocabulary: [MVP, esencial, recortar]
          prior_knowledge: "Completo los 6 temas de Que es un MVP."
          fact_refs: []
          review_of:
            - prototipo-de-garage/que-es-un-mvp/el-producto-mas-pequeno-que-funciona
            - prototipo-de-garage/que-es-un-mvp/que-es-lo-esencial
            - prototipo-de-garage/que-es-un-mvp/no-es-perfecto-es-util
            - prototipo-de-garage/que-es-un-mvp/que-le-quito-primero
            - prototipo-de-garage/que-es-un-mvp/version-1-no-es-version-final
            - prototipo-de-garage/que-es-un-mvp/mi-mvp-en-una-frase
          lessons:
            - position: 1
              slug: repaso-esencial-o-extra
              micro_objective: "Recuerda y aplica, sin ayuda, la diferencia entre una caracteristica esencial y un extra."
              narrative_beat: "El equipo revisa su lista de ideas y marca, sin ayuda, cuales partes son el nucleo y cuales pueden esperar."
              difficulty: 3
              suggested_families: [choice, analyze]
            - position: 2
              slug: repaso-mi-mvp-en-una-frase
              micro_objective: "Aplica sin ayuda todo lo repasado: redacta la definición de un MVP nuevo en una sola frase."
              narrative_beat: "Liruf escribe, sin ayuda de nadie, la definición de su segundo MVP en menos de un minuto."
              difficulty: 4
              suggested_families: [storyplay, choice]
        - position: 8
          slug: cruce-mvp-y-oportunidad
          kind: review_interleaved
          title_es: "Cruce: MVP y la Oportunidad Original"
          concept: "Mezclamos la definición de MVP de esta saga con la oportunidad validada en el Distrito Beta."
          learning_objective: "El aprendiz combina, sin nueva enseñanza, la oportunidad ya validada con la definición de un MVP que la resuelva."
          key_vocabulary: [MVP, oportunidad, nucleo funcional]
          prior_knowledge: "Completo el repaso de Que es un MVP (tema anterior) y Radar de Oportunidades (aventura anterior)."
          fact_refs: []
          review_of:
            - prototipo-de-garage/que-es-un-mvp/el-producto-mas-pequeno-que-funciona
            - prototipo-de-garage/que-es-un-mvp/mi-mvp-en-una-frase
            - radar-de-oportunidades/problemas-de-verdad/el-problema-en-una-frase
          lessons:
            - position: 1
              slug: mi-oportunidad-necesita-que-mvp
              micro_objective: "Conecta la oportunidad validada en el distrito con el MVP mínimo que de verdad la resolveria."
              narrative_beat: "Zara revisa el pitch de su oportunidad del Distrito Beta y diseña, por primera vez, el MVP más pequeño que la probaria."
              difficulty: 4
              suggested_families: [analyze, choice]
            - position: 2
              slug: reviso-si-mi-mvp-resuelve-el-problema-original
              micro_objective: "Revisa, sin ayuda, si el MVP disenado de verdad resuelve el problema identificado en la aventura anterior."
              narrative_beat: "Rho compara su MVP contra el enunciado del problema original y confirma que no se le olvido lo esencial."
              difficulty: 5
              suggested_families: [analyze, choice]
  - position: 2
    slug: restricciones-reales
    icon: account_balance_wallet
    title:
      en-US: "Real Constraints"
      es-MX: "Restricciónes Reales"
      pt-BR: "Restricoes Reais"
    description:
      en-US: "Money, time and tools are limited - a real founder builds inside those limits, not around them."
      es-MX: "El dinero, el tiempo y las herramientas son limitados - un founder de verdad construye dentro de esos limites, no alrededor de ellos."
      pt-BR: "Dinheiro, tempo e ferramentas sao limitados - um founder de verdade constroi dentro desses limites, nao ao redor deles."
    topics:
        - position: 1
          slug: cuanto-tengo-para-gastar
          title_es: "Cuanto tengo para gastar"
          concept: "Todo prototipo tiene un techo de gasto real; conocerlo desde el inicio evita construir algo que nunca podras pagar."
          learning_objective: "El aprendiz calcula un presupuesto máximo disponible para construir un primer prototipo."
          key_vocabulary: [presupuesto, techo de gasto, prototipo]
          prior_knowledge: "Completo Que es un MVP (saga anterior)."
          fact_refs: [mxn.reference_costs.tenis_personalizados_materiales]
          parent_check: "Ayuda a {{name}} a calcular, sumando lo que tiene ahorrado y lo que podría conseguir, cuanto dinero real tiene para su primer prototipo."
          lessons:
            - position: 1
              slug: cuanto-tengo-ahorrado
              micro_objective: "Suma el dinero disponible de 3 fuentes (ahorro, un encargo pagado, material reciclado con valor) para definir un presupuesto."
              narrative_beat: "Zara cuenta lo que tiene ahorrado, más lo que le pagaron por un encargo, más el material que ya tiene en casa."
              difficulty: 1
              suggested_families: [input, money]
            - position: 2
              slug: mi-techo-de-gasto
              micro_objective: "Compara el costo estimado de dos versiónes de un prototipo contra el presupuesto disponible y elige la que si alcanza."
              narrative_beat: "Liruf quiere comprar $200 en materiales para tenis personalizados, pero solo tiene $120 esta semana; ajusta su plan."
              difficulty: 2
              suggested_families: [money, choice]
        - position: 2
          slug: cuanto-tiempo-tengo
          title_es: "Cuanto tiempo tengo"
          concept: "El tiempo también es un recurso limitado: construir un prototipo antes de un plazo real obliga a recortar de forma distinta que construirlo sin prisa."
          learning_objective: "El aprendiz estima cuanto tiempo real tiene disponible y ajusta el alcance de un prototipo a ese plazo."
          key_vocabulary: [plazo, tiempo disponible, ajustar alcance]
          prior_knowledge: "Calcula un presupuesto de dinero (tema anterior)."
          fact_refs: []
          parent_check: "Pregunta a {{name}} cuantas horas reales tiene disponibles esta semana para trabajar en su prototipo, sin exagerar."
          lessons:
            - position: 1
              slug: cuantas-horas-tengo-esta-semana
              micro_objective: "Calcula, sumando bloques de tiempo libre en un horario, cuantas horas reales tiene disponibles esta semana para construir."
              narrative_beat: "Rho revisa su horario de la semana y suma solo los bloques libres después de la escuela y las tareas."
              difficulty: 2
              suggested_families: [input, analyze]
            - position: 2
              slug: el-plazo-cambia-el-plan
              micro_objective: "Elige, entre dos planes de construcción, el que si cabe dentro de un plazo de una semana."
              narrative_beat: "Dina tenia un plan de tres semanas para su prototipo, pero el demo day es en 7 días: recorta el plan para que quepa."
              difficulty: 3
              suggested_families: [choice, analyze]
        - position: 3
          slug: que-herramientas-tengo-a-la-mano
          title_es: "Que herramientas tengo a la mano"
          concept: "Antes de pedir o comprar algo nuevo, hay que revisar que herramientas, materiales o habilidades ya estan disponibles."
          learning_objective: "El aprendiz hace un inventario de recursos ya disponibles antes de planear compras nuevas para el prototipo."
          key_vocabulary: [inventario, recursos disponibles, habilidad propia]
          prior_knowledge: "Ajusta el alcance a un plazo real (tema anterior)."
          fact_refs: []
          parent_check: "Revisa junto a {{name}} que materiales, herramientas o habilidades ya tiene en casa antes de pedirte comprar algo nuevo."
          lessons:
            - position: 1
              slug: reviso-lo-que-ya-tengo
              micro_objective: "Hace un inventario de 5 recursos (materiales, herramientas, habilidades) que ya tiene disponibles antes de pedir algo nuevo."
              narrative_beat: "Zara revisa su cuarto y encuentra pintura, pegamento y una impresora vieja que ya podría usar para su prototipo."
              difficulty: 3
              suggested_families: [arrange, analyze]
            - position: 2
              slug: quien-en-mi-equipo-sabe-hacer-esto
              micro_objective: "Identifica, entre los integrantes del equipo, quien tiene la habilidad específica que el prototipo necesita."
              narrative_beat: "Liruf no sabe coser, pero recuerda que Rho si sabe, y le pide ayuda antes de comprar un servicio externo."
              difficulty: 3
              suggested_families: [choice, story]
        - position: 4
          slug: cuando-una-restriccion-es-una-excusa
          title_es: "Cuando una restricción es una excusa"
          concept: "Algunas restricciónes son reales (no tengo el dinero); otras son excusas para no empezar (no tengo el material perfecto)."
          learning_objective: "El aprendiz distingue una restricción real de una excusa disfrazada de restricción."
          key_vocabulary: [restricción real, excusa, empezar]
          prior_knowledge: "Hace inventario de recursos disponibles (tema anterior)."
          fact_refs: []
          parent_check: "Pregunta a {{name}} si lo que dice que le falta es una restricción real o una razón para no empezar todavia."
          lessons:
            - position: 1
              slug: de-verdad-no-puedo-o-no-quiero-empezar
              micro_objective: "Distingue, en 4 frases, cuales describen una restricción real y cuales son excusas para posponer."
              narrative_beat: "Rho dice 'no puedo empezar sin el material perfecto' - Dina le pregunta si de verdad no puede, o si tiene miedo de empezar."
              difficulty: 3
              suggested_families: [choice, analyze]
            - position: 2
              slug: empiezo-con-lo-que-hay
              micro_objective: "Elige la versión del prototipo que se puede empezar hoy mismo con los recursos ya disponibles."
              narrative_beat: "Zara decide empezar su prototipo con carton y marcador, en vez de esperar el material ideal que tardaria dos semanas."
              difficulty: 4
              suggested_families: [choice, storyplay]
        - position: 5
          slug: recorto-sin-perder-lo-esencial
          title_es: "Recorto sin perder lo esencial"
          concept: "Ajustar un plan a un presupuesto o plazo menor no significa romper el MVP: significa recortar lo prescindible, no el nucleo."
          learning_objective: "El aprendiz ajusta un plan de construcción a una restricción nueva sin eliminar la parte esencial del MVP."
          key_vocabulary: [ajustar plan, restricción nueva, nucleo intacto]
          prior_knowledge: "Distingue restricción real de excusa (tema anterior)."
          fact_refs: []
          parent_check: "Revisa con {{name}} si, al recortar su plan por falta de tiempo o dinero, sigue conservando lo que hace funcionar su idea."
          lessons:
            - position: 1
              slug: el-presupuesto-bajo-a-la-mitad
              micro_objective: "Ajusta un plan de prototipo cuyo presupuesto bajo a la mitad, sin eliminar la parte esencial identificada antes."
              narrative_beat: "A Liruf le avisan que solo tiene $60 para su prototipo de estuches, la mitad de lo planeado; ajusta sin perder la función básica."
              difficulty: 4
              suggested_families: [money, analyze]
            - position: 2
              slug: verifico-que-el-nucleo-sigue-intacto
              micro_objective: "Revisa, sin ayuda, si un plan recortado todavia conserva la parte esencial de su MVP original."
              narrative_beat: "Rho revisa su plan recortado contra la definición de su MVP y confirma que lo esencial sigue de pie."
              difficulty: 4
              suggested_families: [analyze, choice]
        - position: 6
          slug: presupuesto-de-garage
          title_es: "Presupuesto de garage"
          concept: "Un presupuesto simple de garage suma todos los costos del prototipo y los compara contra el dinero disponible antes de comprar nada."
          learning_objective: "El aprendiz arma un presupuesto completo de materiales para un prototipo y lo compara contra su techo de gasto."
          key_vocabulary: [presupuesto de garage, costo total, comparar contra el techo]
          prior_knowledge: "Ajusta un plan sin perder lo esencial (tema anterior)."
          fact_refs: [mxn.reference_costs.funda_personalizada_materiales]
          parent_check: "Ayuda a {{name}} a sumar el costo de todos los materiales de su prototipo y comparar el total contra lo que tiene disponible."
          lessons:
            - position: 1
              slug: sumo-todos-los-materiales
              micro_objective: "Suma el costo de 4 materiales distintos para calcular el costo total de un prototipo."
              narrative_beat: "Zara suma vinil, plantilla, sellador y empaque para calcular cuanto le costaria producir una funda personalizada."
              difficulty: 4
              suggested_families: [input, money]
            - position: 2
              slug: me-alcanza-para-el-prototipo
              micro_objective: "Compara el costo total calculado contra el presupuesto disponible y decide si alcanza o hay que recortar."
              narrative_beat: "Dina compara el costo total de su prototipo contra su presupuesto y descubre que le sobran justo unos pesos."
              difficulty: 5
              suggested_families: [money, choice]
        - position: 7
          slug: repaso-restricciones-reales
          kind: review_spaced
          title_es: "Repaso: Restricciónes Reales"
          concept: "El equipo repasa como calcular presupuesto, tiempo y recursos disponibles antes de construir."
          learning_objective: "El aprendiz recuerda y aplica, sin nueva enseñanza, como reconocer y trabajar dentro de restricciónes reales."
          key_vocabulary: [presupuesto, plazo, restricción real]
          prior_knowledge: "Completo los 6 temas de Restricciónes Reales."
          fact_refs: []
          review_of:
