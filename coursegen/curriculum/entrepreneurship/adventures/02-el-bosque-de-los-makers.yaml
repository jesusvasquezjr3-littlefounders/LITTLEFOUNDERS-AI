schema_version: 1
adventure:
  position: 2
  slug: el-bosque-de-los-makers
  theme: forest
  age_tier: tier1
  title:
    en-US: The Forest of Makers
    es-MX: El Bosque de los Makers
    pt-BR: A Floresta dos Makers
  description:
    en-US: Walk into a workshop hidden in the forest, where every idea from the island finally becomes a real, hand-made product.
    es-MX: Entra a un taller escondido en el bosque, donde cada idea de la isla por fin se convierte en un producto real, hecho a mano.
    pt-BR: Entre em uma oficina escondida na floresta, onde cada ideia da ilha finalmente se transforma em um produto real, feito à mão.
  narrative_arc: Con la idea elegida en la Isla de las Ideas bajo el brazo, Dina, Dino, Rho y Zara llegan a un bosque frondoso donde un taller escondido entre los árboles espera a los pequeños makers. Dino se lanza de lleno a construir con las manos, aprendiendo a seguir pasos en orden y a no apurarse; Rho investiga de dónde vienen los materiales, cuáles cuidar y cuáles reusar; Zara pone su sello personal en cada producto, cuidando los detalles hasta que quedan firmes y bien hechos; y Dina aprende a mostrar sus productos, escuchar opiniones sin miedo y construir una segunda versión mejor que la primera. Al final del bosque, cada quien tiene un producto propio, terminado y mejorado, listo para conocer a las personas que podrían usarlo.
sagas:
  - position: 1
    slug: manos-a-la-obra
    icon: construction
    title:
      en-US: Hands to Work
      es-MX: Manos a la Obra
      pt-BR: Mãos à Obra
    description:
      en-US: Turn an idea into a real product, made step by step with your own hands.
      es-MX: Convierte una idea en un producto real, hecho paso a paso con tus propias manos.
      pt-BR: Transforme uma ideia em um produto real, feito passo a passo com as próprias mãos.
    topics:
      - position: 1
        slug: elijo-que-voy-a-hacer
        title_es: Elijo qué voy a hacer
        concept: De todas las ideas que traigo de la isla, elijo una para convertirla en un producto real.
        learning_objective: Al final, el niño puede elegir, entre varias ideas, cuál convertirá en un producto.
        key_vocabulary:
          - producto
          - elegir
          - hacer
          - real
        prior_knowledge: Trae de la Isla de las Ideas una idea sencilla ya elegida.
        fact_refs: []
        parent_check: Pregúntale a {{name}} cuál de sus ideas eligió para convertir en un producto de verdad en el taller del bosque.
        lessons:
          - position: 1
            slug: llegamos-al-bosque
            micro_objective: Reconoce en la historia el momento en que el taller del bosque recibe a la tripulación.
            narrative_beat: Dina y Dino llegan a un taller de madera entre los árboles, listo para convertir ideas en productos reales.
            difficulty: 1
            suggested_families:
              - story
              - choice
          - position: 2
            slug: una-idea-se-vuelve-producto
            micro_objective: Distingue, entre 3 ideas, cuál ya está lista para convertirse en un producto concreto.
            narrative_beat: Rho revisa las ideas de la isla y elige la de la sombrilla de tela para empezar a construirla.
            difficulty: 1
            suggested_families:
              - choice
          - position: 3
            slug: comparo-mis-ideas-para-elegir
            micro_objective: Compara 2 ideas propias y elige cuál conviene construir primero.
            narrative_beat: Zara compara su idea de pulsera con su idea de tarjeta y decide cuál hacer primero en el taller.
            difficulty: 2
            suggested_families:
              - choice
              - arrange
          - position: 4
            slug: elijo-mi-primer-producto
            micro_objective: Elige, sin ayuda, la idea que convertirá en su primer producto del bosque.
            narrative_beat: Dino elige con confianza qué va a construir primero en el taller del bosque.
            difficulty: 2
            suggested_families:
              - storyplay
              - choice
      - position: 2
        slug: junto-lo-que-necesito
        title_es: Junto lo que necesito
        concept: Antes de empezar a hacer mi producto, junto todos los materiales que voy a necesitar.
        learning_objective: Al final, el niño puede listar los materiales necesarios para hacer un producto sencillo.
        key_vocabulary:
          - materiales
          - juntar
          - necesitar
          - antes de empezar
        prior_knowledge: Sabe qué producto va a hacer (tema anterior).
        fact_refs: []
        parent_check: Ayuda a {{name}} a hacer una lista de todo lo que necesitaría para hacer su producto antes de empezar.
        lessons:
          - position: 1
            slug: la-mesa-de-materiales
            micro_objective: Reconoce en la historia los materiales que un personaje junta antes de empezar.
            narrative_beat: Rho pone sobre la mesa del taller hilo, cuentas y tela antes de empezar a construir.
            difficulty: 1
            suggested_families:
              - story
              - choice
          - position: 2
            slug: me-falta-algo
            micro_objective: Identifica, entre 4 materiales mostrados, cuál falta para completar el producto.
            narrative_beat: Zara revisa su mesa de trabajo y nota que le falta un material para terminar su pulsera.
            difficulty: 1
            suggested_families:
              - choice
          - position: 3
            slug: ordeno-mi-lista-de-materiales
            micro_objective: Ordena una lista de 3 a 4 materiales necesarios para un producto sencillo.
            narrative_beat: Dino escribe en orden todo lo que necesita para armar su primer producto.
            difficulty: 2
            suggested_families:
              - arrange
              - input
          - position: 4
            slug: junto-todo-antes-de-empezar
            micro_objective: Reúne, sin ayuda, todos los materiales necesarios antes de comenzar en la historia.
            narrative_beat: Dina junta con calma cada material de su lista antes de tocar las herramientas.
            difficulty: 2
            suggested_families:
              - storyplay
              - choice
      - position: 3
        slug: sigo-los-pasos-en-orden
        title_es: Sigo los pasos en orden
        concept: Hacer un producto bien hecho significa seguir los pasos en el orden correcto, sin saltarse ninguno.
        learning_objective: Al final, el niño puede ordenar los pasos para construir un producto sencillo.
        key_vocabulary:
          - pasos
          - en orden
          - primero
          - después
        prior_knowledge: Sabe juntar los materiales necesarios (tema anterior).
        fact_refs: []
        parent_check: Invita a {{name}} a explicarte, paso por paso y en orden, cómo piensa construir su producto.
        lessons:
          - position: 1
            slug: los-pasos-desordenados
            micro_objective: Reconoce en la historia por qué saltarse un paso hace que el producto salga mal.
            narrative_beat: Dino intenta tejer su pulsera sin cortar primero el hilo y todo se enreda.
            difficulty: 1
            suggested_families:
              - story
              - choice
          - position: 2
            slug: que-va-primero
            micro_objective: Elige, entre 2 pasos, cuál debe ir primero al construir un producto sencillo.
            narrative_beat: Rho decide si primero se corta la tela o primero se cose el borde de la sombrilla.
            difficulty: 1
            suggested_families:
              - choice
          - position: 3
            slug: ordeno-los-pasos-de-mi-pulsera
            micro_objective: Ordena 4 pasos para construir una pulsera sencilla en el orden correcto.
            narrative_beat: Zara ordena con cordeles los cuatro pasos para tejer su primera pulsera.
            difficulty: 2
            suggested_families:
              - arrange
          - position: 4
            slug: sigo-mis-pasos-sin-saltarme-ninguno
            micro_objective: Sigue, sin ayuda, los pasos en orden para construir un producto nuevo en la historia.
            narrative_beat: Dina construye su producto siguiendo cada paso en orden, sin saltarse ninguno.
            difficulty: 2
            suggested_families:
              - storyplay
              - choice
      - position: 4
        slug: uso-mis-manos-con-cuidado
        title_es: Uso mis manos con cuidado
        concept: Trabajar con cuidado, sin apurarme, ayuda a que el producto quede mejor hecho.
        learning_objective: Al final, el niño puede reconocer la diferencia entre trabajar con cuidado y trabajar con prisa.
        key_vocabulary:
          - cuidado
          - con calma
          - prisa
          - con las manos
        prior_knowledge: Sabe seguir los pasos en orden (tema anterior).
        fact_refs: []
        parent_check: Observa si {{name}} logra trabajar con calma en una manualidad, sin apurarse para terminar rápido.
        lessons:
          - position: 1
            slug: dino-se-apura-y-se-enreda
            micro_objective: Reconoce en la historia lo que pasa cuando un personaje trabaja con demasiada prisa.
            narrative_beat: Dino teje su pulsera tan rápido que las cuentas se caen al piso una y otra vez.
            difficulty: 1
            suggested_families:
              - story
              - choice
          - position: 2
            slug: con-calma-o-con-prisa
            micro_objective: Distingue, entre 2 escenas, cuál muestra trabajo cuidadoso y cuál trabajo apurado.
            narrative_beat: Rho compara el trabajo tranquilo de Zara con el trabajo apurado de Dino en la misma tarde.
            difficulty: 1
            suggested_families:
              - choice
          - position: 3
            slug: reviso-mis-manos-mientras-trabajo
            micro_objective: Identifica 3 momentos en los que conviene ir despacio para trabajar con cuidado.
            narrative_beat: Zara señala los momentos exactos donde hay que ir despacio al coser la sombrilla.
            difficulty: 2
            suggested_families:
              - choice
              - analyze
          - position: 4
            slug: trabajo-con-calma-en-mi-producto
            micro_objective: Trabaja, sin ayuda, con calma y cuidado en un producto nuevo de la historia.
            narrative_beat: Dina respira hondo y trabaja despacio, sin prisa, en su propio producto.
            difficulty: 2
            suggested_families:
              - storyplay
              - choice
      - position: 5
        slug: termino-lo-que-empiezo
        title_es: Termino lo que empiezo
        concept: "Un producto a medio hacer no sirve todavía: hay que llegar hasta el final para que esté completo."
        learning_objective: Al final, el niño puede reconocer la diferencia entre un producto terminado y uno a medias.
        key_vocabulary:
          - terminar
          - a medias
          - completo
          - hasta el final
        prior_knowledge: Sabe trabajar con cuidado (tema anterior).
        fact_refs: []
        parent_check: Anima a {{name}} a terminar por completo su manualidad antes de pasar a otra cosa, aunque tome un poco más de tiempo.
        lessons:
          - position: 1
            slug: la-pulsera-a-medias
            micro_objective: Reconoce en la historia por qué un producto a medio terminar todavía no sirve.
            narrative_beat: Dino deja su pulsera a medio tejer para ir a jugar, y se da cuenta de que así no sirve todavía.
            difficulty: 1
            suggested_families:
              - story
              - choice
          - position: 2
            slug: terminado-o-a-medias
            micro_objective: Distingue, entre 4 productos, cuáles están terminados y cuáles a medias.
            narrative_beat: Rho revisa la mesa del taller y separa los productos terminados de los que faltan por completar.
            difficulty: 1
            suggested_families:
              - choice
          - position: 3
            slug: cuento-lo-que-falta
            micro_objective: Identifica qué pasos faltan para terminar un producto que está a medias.
            narrative_beat: Zara revisa su sombrilla a medio hacer y anota qué le falta para estar completa.
            difficulty: 2
            suggested_families:
              - analyze
              - choice
          - position: 4
            slug: termino-mi-producto-por-completo
            micro_objective: Termina, sin ayuda, un producto hasta el final en una historia nueva.
            narrative_beat: Dina regresa a su producto y no se levanta hasta dejarlo completamente terminado.
            difficulty: 2
            suggested_families:
              - storyplay
              - choice
      - position: 6
        slug: muestro-mi-primer-producto
        title_es: Muestro mi primer producto
        concept: Terminar mi primer producto y mostrarlo a otros se siente como un logro que vale la pena celebrar.
        learning_objective: Al final, el niño puede presentar con orgullo un producto que terminó de hacer.
        key_vocabulary:
          - mostrar
          - primer producto
          - logro
          - orgullo
        prior_knowledge: Sabe terminar un producto hasta el final (tema anterior).
        fact_refs: []
        parent_check: Pídele a {{name}} que te muestre y te explique con orgullo el primer producto que terminó de hacer.
        lessons:
          - position: 1
            slug: zara-muestra-su-sombrilla
            micro_objective: Reconoce en la historia el momento en que un personaje muestra con orgullo su primer producto.
            narrative_beat: Zara levanta su sombrilla terminada frente a toda la tripulación del taller.
            difficulty: 1
            suggested_families:
              - story
              - choice
          - position: 2
            slug: orgullo-o-verguenza
            micro_objective: Distingue, entre 2 escenas, cuál muestra orgullo por un trabajo terminado.
            narrative_beat: Rho compara la cara de orgullo de Zara con la cara tímida de Dino frente a sus productos.
            difficulty: 1
            suggested_families:
              - choice
          - position: 3
            slug: cuento-como-lo-hice
            micro_objective: Ordena 3 frases que explican cómo se hizo un producto, del primer paso al último.
            narrative_beat: Dino explica, paso por paso, cómo construyó su primera pulsera terminada.
            difficulty: 2
            suggested_families:
              - arrange
          - position: 4
            slug: presento-mi-primer-producto
            micro_objective: Presenta, sin ayuda, su propio primer producto terminado frente a la tripulación.
            narrative_beat: Dina presenta con orgullo su primer producto terminado en el taller del bosque.
            difficulty: 2
            suggested_families:
              - storyplay
              - choice
      - position: 7
        slug: cofre-del-repaso-de-manos-a-la-obra
        kind: review_spaced
        review_of:
          - el-bosque-de-los-makers/manos-a-la-obra/elijo-que-voy-a-hacer
          - el-bosque-de-los-makers/manos-a-la-obra/junto-lo-que-necesito
          - el-bosque-de-los-makers/manos-a-la-obra/sigo-los-pasos-en-orden
          - el-bosque-de-los-makers/manos-a-la-obra/uso-mis-manos-con-cuidado
          - el-bosque-de-los-makers/manos-a-la-obra/termino-lo-que-empiezo
          - el-bosque-de-los-makers/manos-a-la-obra/muestro-mi-primer-producto
        title_es: El Cofre del Repaso de Manos a la Obra
        concept: Repasamos desde el cofre de recuerdos cómo elegir, juntar materiales y construir un producto de principio a fin.
        learning_objective: Al final, el niño recuerda y usa, sin nueva enseñanza, los conceptos de esta saga sobre construir con las manos.
        key_vocabulary:
          - producto
          - materiales
          - pasos
          - terminar
        prior_knowledge: Completó los 6 temas de Manos a la Obra.
        fact_refs: []
        lessons:
          - position: 1
            slug: abro-el-cofre-del-taller-de-manos
            micro_objective: Recuerda y nombra, sin ayuda, el producto que eligió construir en esta saga.
            narrative_beat: "Rho encuentra un cofre lleno de virutas de madera y retazos: recuerdos del primer taller."
            difficulty: 1
            suggested_families:
              - story
              - choice
          - position: 2
            slug: recuerdo-mis-materiales
            micro_objective: Recuerda, sin ayuda, los materiales que juntó para su producto en esta saga.
            narrative_beat: Zara saca del cofre el hilo y las cuentas que juntó para su primera pulsera.
            difficulty: 1
            suggested_families:
              - story
              - choice
          - position: 3
            slug: elijo-el-paso-que-faltaba
            micro_objective: Elige, entre 2 recuerdos, cuál muestra un paso que se saltó por error.
            narrative_beat: Dino compara dos recuerdos del cofre y decide cuál producto se hizo sin seguir el orden.
            difficulty: 2
            suggested_families:
              - choice
          - position: 4
            slug: cierro-el-cofre-con-mi-producto-terminado
            micro_objective: "Aplica sin ayuda lo recordado: termina un producto de principio a fin en una escena nueva."
            narrative_beat: Dina cierra el cofre de manos a la obra, lista para aprender de dónde vienen los materiales.
            difficulty: 2
            suggested_families:
              - storyplay
              - choice
      - position: 8
        slug: reto-entrelazado-de-manos-a-la-obra
        kind: review_interleaved
        review_of:
          - la-isla-de-las-ideas/el-taller-de-las-chispas/elijo-mi-mejor-idea
          - la-isla-de-las-ideas/ideas-que-ayudan/cuento-mi-idea-en-una-frase
          - el-bosque-de-los-makers/manos-a-la-obra/sigo-los-pasos-en-orden
          - el-bosque-de-los-makers/manos-a-la-obra/termino-lo-que-empiezo
        title_es: Reto Entrelazado de Manos a la Obra
        concept: Mezclamos lo aprendido en la Isla de las Ideas con lo aprendido sobre construir un producto con las manos.
        learning_objective: Al final, el niño combina, sin nueva enseñanza, ideas de la aventura anterior con ideas de esta saga.
        key_vocabulary:
          - idea
          - producto
          - pasos
          - terminar
        prior_knowledge: Completó El Cofre del Repaso de Manos a la Obra (tema anterior) y La Isla de las Ideas (aventura anterior).
        fact_refs: []
        lessons:
          - position: 1
            slug: de-la-idea-elegida-al-primer-paso
            micro_objective: Combina la idea elegida en la isla con el primer paso para construirla en el bosque.
            narrative_beat: Rho recuerda la idea que Zara eligió en la isla y ahora la conecta con el primer paso para construirla.
            difficulty: 2
            suggested_families:
              - story
              - choice
          - position: 2
            slug: la-frase-de-mi-idea-y-mi-producto
            micro_objective: Combina la frase que resumía una idea con el producto real que resultó de ella.
            narrative_beat: Zara recuerda la frase que resumía su idea y la compara con el producto que terminó armando.
            difficulty: 2
            suggested_families:
              - choice
          - position: 3
            slug: ordeno-de-la-idea-al-producto-terminado
            micro_objective: Ordena, mezclando ambas aventuras, los pasos desde tener una idea hasta terminar el producto.
            narrative_beat: "Dino ordena en su libreta todo el camino: desde la idea de la isla hasta el producto ya terminado."
            difficulty: 2
            suggested_families:
              - arrange
              - story
          - position: 4
            slug: construyo-una-idea-vieja-hasta-el-final
            micro_objective: Construye, sin ayuda, una idea del inicio del viaje hasta convertirla en un producto terminado.
            narrative_beat: Dina construye por fin, hasta el final, la primera idea que tuvo en la isla de las ideas.
            difficulty: 2
            suggested_families:
              - storyplay
              - choice
  - position: 2
    slug: de-donde-vienen-las-cosas
    icon: eco
    title:
      en-US: Where Things Come From
      es-MX: De Dónde Vienen las Cosas
      pt-BR: De Onde Vêm as Coisas
    description:
      en-US: Discover what materials are made of, where they come from, and how to use them without waste.
      es-MX: Descubre de qué están hechos los materiales, de dónde vienen y cómo usarlos sin desperdiciar.
      pt-BR: Descubra do que são feitos os materiais, de onde vêm e como usá-los sem desperdiçar.
    topics:
      - position: 1
        slug: de-que-esta-hecho
        title_es: ¿De qué está hecho?
        concept: Cada producto está hecho de uno o varios materiales, y reconocerlos es el primer paso para entenderlos.
        learning_objective: Al final, el niño puede identificar de qué material está hecho un objeto sencillo.
        key_vocabulary:
          - material
          - hecho de
          - identificar
          - objeto
        prior_knowledge: Sabe construir un producto sencillo con las manos (saga anterior).
        fact_refs: []
        parent_check: Pídele a {{name}} que identifique de qué material están hechos 3 objetos distintos de la casa.
        lessons:
          - position: 1
            slug: de-que-esta-hecha-la-pulsera
            micro_objective: Reconoce en la historia de qué material está hecho un producto mostrado.
            narrative_beat: Rho toma la pulsera de Zara y pregunta de qué está hecha cada una de sus partes.
            difficulty: 1
            suggested_families:
              - story
              - choice
          - position: 2
            slug: madera-tela-o-hilo
            micro_objective: Identifica, entre 4 objetos, cuál está hecho de madera, cuál de tela y cuál de hilo.
            narrative_beat: Dino clasifica los objetos del taller según el material principal de cada uno.
            difficulty: 1
            suggested_families:
              - choice
              - arrange
          - position: 3
            slug: un-producto-varios-materiales
            micro_objective: Reconoce que un mismo producto puede estar hecho de más de un material.
            narrative_beat: Zara señala que su sombrilla usa tela, madera y un poco de hilo, todo junto.
            difficulty: 2
            suggested_families:
              - choice
              - analyze
          - position: 4
            slug: identifico-los-materiales-de-mi-producto
            micro_objective: Identifica, sin ayuda, todos los materiales de un producto nuevo en la historia.
            narrative_beat: Dina revisa su propio producto y nombra cada material que lo compone.
            difficulty: 2
            suggested_families:
              - storyplay
              - choice
      - position: 2
        slug: algunos-materiales-vienen-de-la-naturaleza
        title_es: Algunos materiales vienen de la naturaleza
        concept: Materiales como la madera, el algodón o las semillas vienen de plantas y árboles de la naturaleza.
        learning_objective: Al final, el niño puede reconocer un material que viene de la naturaleza.
        key_vocabulary:
          - naturaleza
          - árbol
          - planta
          - venir de
        prior_knowledge: Sabe identificar de qué material está hecho un objeto (tema anterior).
        fact_refs: []
        parent_check: Camina con {{name}} por el jardín o parque y pregúntale qué materiales de sus productos podrían venir de la naturaleza.
        lessons:
          - position: 1
            slug: la-madera-viene-del-arbol
            micro_objective: Reconoce en la historia que un material del taller viene directamente de un árbol.
            narrative_beat: Rho muestra un tronco cortado y explica que de ahí sale la madera del taller.
            difficulty: 1
            suggested_families:
              - story
              - choice
          - position: 2
            slug: de-la-naturaleza-o-no
            micro_objective: Distingue, entre 4 materiales, cuáles vienen de la naturaleza y cuáles no.
            narrative_beat: Zara separa en dos montones los materiales que salen de plantas y los que no.
            difficulty: 1
            suggested_families:
              - choice
              - arrange
          - position: 3
            slug: sigo-el-camino-del-algodon
            micro_objective: Ordena 3 pasos que muestran de dónde sale un material natural hasta llegar al taller.
            narrative_beat: Dino ordena dibujos que muestran cómo el algodón de una planta se convierte en hilo.
            difficulty: 2
            suggested_families:
              - arrange
          - position: 4
            slug: reconozco-un-material-natural-nuevo
            micro_objective: Reconoce, sin ayuda, un material natural nuevo en una escena de la historia.
            narrative_beat: Dina reconoce un material nuevo del bosque y explica de qué planta o árbol podría venir.
            difficulty: 2
            suggested_families:
              - storyplay
              - choice
      - position: 3
        slug: algunos-materiales-se-compran-en-la-tienda
        title_es: Algunos materiales se compran en la tienda
        concept: Otros materiales, como las cuentas de colores o el papel, se compran ya hechos en una tienda.
        learning_objective: Al final, el niño puede reconocer un material que se compra en la tienda.
        key_vocabulary:
          - tienda
          - comprar
          - ya hecho
          - conseguir
        prior_knowledge: Sabe reconocer materiales que vienen de la naturaleza (tema anterior).
