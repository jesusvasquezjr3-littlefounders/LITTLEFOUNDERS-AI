schema_version: 1
adventure:
  position: 5
  slug: el-reino-de-las-ventas
  theme: kingdom
  age_tier: tier2
  title:
    en-US: The Kingdom of Selling
    es-MX: El Reino de las Ventas
    pt-BR: O Reino das Vendas
  description:
    en-US: In a kingdom of traveling merchants, Dina and Liruf open their first lemonade stall in the Grand
      Plaza and learn to sell with honesty, pitch their idea, and treat every customer with care.
    es-MX: En un reino de mercaderes, Dina y Liruf abren su primer puesto de limonada en la Gran Plaza y
      aprenden a vender con honestidad, a contar su idea en un minuto y a cuidar a cada cliente.
    pt-BR: Em um reino de mercadores, Dina e Liruf abrem sua primeira barraca de limonada na Grande Praça
      e aprendem a vender com honestidade, a contar sua ideia em um minuto e a cuidar de cada cliente.
  narrative_arc: 'Dina y Liruf cruzan las puertas del Reino de las Ventas, una tierra de mercaderes gobernada
    desde la Gran Plaza, donde Zara Vex es la estratega más admirada del reino por su forma honesta y brillante
    de vender. Liruf instala su primer puesto de limonada y aprende haciendo, probando ideas una por una,
    mientras Dina observa, pregunta y reflexiona junto a Dr. Rho, quien revisa que cada trato del reino
    sea justo. Juntos descubren que vender de verdad no es convencer a cualquier costo, sino ofrecer algo
    valioso, contarlo bien en un minuto, atender con cuidado a cada cliente y escuchar sus opiniones para
    mejorar siempre.'
sagas:
- position: 1
  slug: vender-con-honestidad
  icon: storefront
  title:
    en-US: Selling with Honesty
    es-MX: Vender con Honestidad
    pt-BR: Vender com Honestidade
  description:
    en-US: Learn that selling for real means offering something valuable while always staying honest.
    es-MX: Aprende que vender de verdad significa ofrecer algo valioso siendo siempre honesto.
    pt-BR: Aprenda que vender de verdade significa oferecer algo valioso sendo sempre honesto.
  topics:
  - position: 1
    slug: que-es-vender
    title_es: Qué es vender
    concept: Vender es ofrecer algo de valor a otra persona a cambio de dinero, y hacerlo bien siempre
      empieza por ser honesto.
    learning_objective: Al final, el niño puede explicar con sus palabras qué significa vender algo.
    key_vocabulary:
    - vender
    - ofrecer
    - cliente
    - honesto
    prior_knowledge: Ha comprado y vendido cosas antes, y sabe que el dinero representa un valor de cambio
      (curso de Educación Financiera).
    parent_check: "¿{{name}} puede explicarte, con sus palabras, qué significa vender algo?"
    fact_refs: []
    lessons:
    - position: 1
      slug: las-puertas-del-reino
      micro_objective: Reconocer que vender es ofrecer algo de valor a otra persona a cambio de dinero.
      narrative_beat: Dina y Liruf cruzan las puertas del Reino de las Ventas y ven la Gran Plaza llena
        de puestos donde la gente ofrece cosas a cambio de monedas.
      difficulty: 1
      suggested_families:
      - story
      - choice
    - position: 2
      slug: vender-o-solo-mostrar
      micro_objective: Distinguir la acción de vender (a cambio de dinero) de solo mostrar o regalar algo.
      narrative_beat: Liruf confunde a un mercader que muestra su mercancía con uno que la regala, y Dr.
        Rho le ayuda a notar la diferencia.
      difficulty: 2
      suggested_families:
      - choice
      - analyze
    - position: 3
      slug: quien-vende-y-quien-compra
      micro_objective: Identificar quién vende y quién compra en distintas escenas del mercado.
      narrative_beat: En la Gran Plaza, Dina observa varios puestos y separa quién ofrece algo y quién
        busca algo.
      difficulty: 2
      suggested_families:
      - analyze
      - choice
    - position: 4
      slug: mi-primera-idea-para-vender
      micro_objective: Proponer, en una escena nueva, una idea simple de algo que podría vender.
      narrative_beat: Frente a su primer puesto vacío, Liruf piensa en voz alta que le gustaría vender limonada
        fresca en la Gran Plaza.
      difficulty: 3
      suggested_families:
      - choice
      - storyplay
  - position: 2
    slug: describir-mi-producto-tal-como-es
    title_es: Describir mi producto tal como es
    concept: Cuando vendo algo, debo describirlo tal como es en realidad, sin agregar cualidades que no
      tiene.
    learning_objective: Al final, el niño puede describir un producto propio usando solo características
      reales.
    key_vocabulary:
    - describir
    - real
    - característica
    - exagerar
    prior_knowledge: Sabe qué significa vender (tema anterior).
    parent_check: "¿{{name}} puede describir uno de sus objetos usando solo características que de verdad tiene?"
    fact_refs: []
    lessons:
    - position: 1
      slug: el-mercader-que-exagera
      micro_objective: Reconocer cuando un mercader describe su producto con cualidades que no tiene de
        verdad.
      narrative_beat: Un mercader del reino grita que su fruta es 'la más dulce de todo el mundo', y Liruf
        se pregunta si eso puede ser cierto.
      difficulty: 1
      suggested_families:
      - story
      - choice
    - position: 2
      slug: describir-sin-agregar-de-mas
      micro_objective: Practicar describir un producto usando solo palabras que son ciertas.
      narrative_beat: Dr. Rho ayuda a Dina a describir su limonada usando solo palabras que de verdad la
        describen, sin inventar nada.
      difficulty: 2
      suggested_families:
      - analyze
      - choice
    - position: 3
      slug: comparar-dos-descripciones
      micro_objective: Comparar dos descripciones del mismo producto y elegir la más honesta.
      narrative_beat: Zara Vex muestra dos formas distintas de describir la misma limonada y reta a Liruf
        a elegir cuál es más honesta.
      difficulty: 2
      suggested_families:
      - analyze
      - choice
    - position: 4
      slug: mi-descripcion-honesta
      micro_objective: Preparar la descripción honesta de un producto propio para el puesto.
      narrative_beat: Dina prepara la descripción de la limonada que venderá en su puesto, revisando que
        cada palabra sea verdad.
      difficulty: 3
      suggested_families:
      - choice
      - storyplay
  - position: 3
    slug: la-diferencia-entre-vender-y-enganar
    title_es: La diferencia entre vender y engañar
    concept: Vender es ofrecer algo real de valor a alguien que lo quiere; engañar es hacer creer algo
      falso para lograr una venta.
    learning_objective: Al final, el niño puede distinguir una venta honesta de un engaño.
    key_vocabulary:
    - engañar
    - honesto
    - valor
    - confianza
    prior_knowledge: Sabe describir un producto con honestidad (tema anterior).
    parent_check: "¿{{name}} puede explicarte la diferencia entre vender algo de verdad y engañar a alguien para venderlo?"
    fact_refs: []
    lessons:
    - position: 1
      slug: el-puesto-del-cambio-desigual
      micro_objective: Reconocer una situación donde alguien intenta engañar para lograr una venta.
      narrative_beat: Un vendedor del reino intenta cambiarle a Liruf un vaso pequeño de limonada por el
        precio de uno grande, diciendo que son iguales.
      difficulty: 1
      suggested_families:
      - story
      - choice
    - position: 2
      slug: senales-de-un-engano
      micro_objective: Identificar una señal de que una venta no está siendo honesta.
      narrative_beat: Dr. Rho enseña a Dina a notar cuando un mercader esconde información importante sobre
        lo que vende.
      difficulty: 2
      suggested_families:
      - analyze
      - choice
    - position: 3
      slug: elegir-vender-con-confianza
      micro_objective: Decidir la forma honesta de resolver una venta en la que se podría engañar fácilmente.
      narrative_beat: Zara Vex pone a prueba a Liruf con un cliente que no notaría un engaño, para ver si
        igual decide ser honesto.
      difficulty: 3
      suggested_families:
      - choice
      - storyplay
    - position: 4
      slug: mi-regla-de-no-enganar
      micro_objective: Aplicar la regla de no engañar frente a una situación nueva de venta.
      narrative_beat: Frente a una nueva oportunidad de venta, Dina recuerda su regla más importante,
        nunca engañar, aunque nadie se dé cuenta.
      difficulty: 3
      suggested_families:
      - storyplay
      - choice
  - position: 4
    slug: un-precio-justo-para-mi-producto
    title_es: Un precio justo para mi producto
    concept: Cobrar un precio justo significa pedir una cantidad que cubre lo que cuesta hacer el producto
      y agrega una ganancia razonable, sin abusar del cliente.
    learning_objective: Al final, el niño puede calcular la ganancia de una venta y explicar qué hace justo
      a un precio.
    key_vocabulary:
    - precio
    - costo
    - ganancia
    - justo
    prior_knowledge: Distingue vender de engañar (tema anterior).
    parent_check: "¿{{name}} puede explicarte qué hace que el precio de algo sea justo?"
    fact_refs:
    - business.math.formula_ganancia
    - business.math.ejemplo_ganancia_15_10
    lessons:
    - position: 1
      slug: cuanto-cuesta-hacerla
      micro_objective: Reconocer que hacer un producto tiene un costo que debe cubrirse con el precio.
      narrative_beat: Liruf cuenta cuántas monedas gastó en vasos, limones y azúcar antes de decidir cuánto
        cobrar por cada limonada.
      difficulty: 1
      suggested_families:
      - story
      - money
    - position: 2
      slug: precio-justo-o-abusivo
      micro_objective: Comparar dos precios del mismo producto y decidir cuál es justo y cuál abusa del
        cliente.
      narrative_beat: Zara Vex muestra dos puestos que venden limonada igual a precios muy distintos, y
        pide a Dina decidir cuál es justo.
      difficulty: 2
      suggested_families:
      - analyze
      - money
    - position: 3
      slug: calcular-mi-ganancia
      micro_objective: Calcular la ganancia de una venta restando el costo del precio de venta ($15 - $10
        = $5).
      narrative_beat: Dr. Rho ayuda a Liruf a calcular cuánto ganó de verdad después de vender algo en $15
        que le costó $10 hacer.
      difficulty: 3
      suggested_families:
      - money
      - input
    - position: 4
      slug: mi-precio-para-el-puesto
      micro_objective: Fijar un precio justo propio para la limonada, explicando por qué cubre el costo
        y deja una ganancia justa.
      narrative_beat: Dina decide el precio final de su limonada, explicando a Zara Vex por qué cubre el
        costo y deja una ganancia justa.
      difficulty: 3
      suggested_families:
      - money
      - choice
  - position: 5
    slug: cumplir-lo-que-prometo-al-vender
    title_es: Cumplir lo que prometo al vender
    concept: Si prometo algo al vender, como el tiempo de entrega o la cantidad, debo cumplirlo exactamente
      como lo dije.
    learning_objective: Al final, el niño puede explicar por qué cumplir una promesa de venta genera confianza.
    key_vocabulary:
    - promesa
    - cumplir
    - entrega
    - confianza
    prior_knowledge: Sabe fijar un precio justo (tema anterior).
    parent_check: "¿{{name}} puede explicarte por qué es importante cumplir lo que se promete al vender algo?"
    fact_refs: []
    lessons:
    - position: 1
      slug: la-promesa-del-mercader
      micro_objective: Reconocer una promesa hecha durante una venta, como el tiempo de entrega.
      narrative_beat: Un mercader promete entregar un pedido 'mañana mismo', y Liruf se pregunta si de verdad
        lo cumplirá.
      difficulty: 1
      suggested_families:
      - story
      - choice
    - position: 2
      slug: cumplida-o-rota
      micro_objective: Clasificar distintas promesas de venta entre cumplidas y rotas.
      narrative_beat: Dr. Rho muestra varios casos del reino y pide a Dina separar las promesas que se
        cumplieron de las que no.
      difficulty: 2
      suggested_families:
      - arrange
      - choice
    - position: 3
      slug: que-pasa-si-no-cumplo
      micro_objective: Explicar qué le pasa a la confianza de un cliente cuando una promesa de venta no
        se cumple.
      narrative_beat: Zara Vex cuenta la historia de un puesto que perdió clientes por no cumplir sus promesas
        de entrega.
      difficulty: 2
      suggested_families:
      - story
      - analyze
    - position: 4
      slug: mi-promesa-cumplida
      micro_objective: Aplicar el hábito de prometer solo lo que se puede cumplir en una venta nueva.
      narrative_beat: Antes de prometer algo a un cliente nuevo, Dina se asegura de que de verdad podrá
        cumplirlo.
      difficulty: 3
      suggested_families:
      - storyplay
      - choice
  - position: 6
    slug: decir-la-verdad-aunque-cueste-una-venta
    title_es: Decir la verdad aunque cueste una venta
    concept: A veces decir la verdad sobre un producto significa perder una venta, y aun así vale la pena
      porque cuida la confianza.
    learning_objective: Al final, el niño puede decidir decir la verdad aunque eso signifique perder una
      venta.
    key_vocabulary:
    - verdad
    - perder
    - valer la pena
    - confianza
    prior_knowledge: Sabe por qué cumplir promesas genera confianza (tema anterior).
    parent_check: "¿{{name}} entiende que a veces decir la verdad puede costar una venta, y aun así es lo correcto?"
    fact_refs: []
    lessons:
    - position: 1
      slug: no-es-lo-que-el-cliente-busca
      micro_objective: Reconocer una situación donde el producto propio no es lo que el cliente necesita.
      narrative_beat: Un cliente busca una limonada bien fría, y Liruf sabe que la suya, aunque buena, ya
        no está tan fría.
      difficulty: 1
      suggested_families:
      - story
      - choice
    - position: 2
      slug: decir-la-verdad-o-vender-igual
      micro_objective: Decidir entre decir la verdad y perder la venta, o quedarse callado y vender igual.
      narrative_beat: Zara Vex reta a Liruf a decidir qué hacer frente al cliente que busca algo que su
        producto no ofrece en ese momento.
      difficulty: 2
      suggested_families:
      - choice
      - storyplay
    - position: 3
      slug: por-que-vale-la-pena-la-verdad
      micro_objective: Explicar por qué decir la verdad, aunque cueste una venta, cuida la confianza a
        largo plazo.
      narrative_beat: Dr. Rho explica a Dina que un cliente que recibe la verdad suele volver, aunque esta
        vez no compre nada.
      difficulty: 3
      suggested_families:
      - story
      - analyze
    - position: 4
      slug: mi-verdad-en-el-puesto
      micro_objective: Aplicar con seguridad decir la verdad frente a una situación nueva donde se podría
        perder una venta.
      narrative_beat: Frente a un nuevo cliente, Dina dice la verdad sobre su limonada, aunque eso signifique
        que esta vez no compre.
      difficulty: 3
      suggested_families:
      - storyplay
      - choice
  - position: 7
    slug: reconocer-cuando-alguien-no-vende-con-honestidad
    title_es: Reconocer cuando alguien no vende con honestidad
    concept: Puedo reconocer señales cuando otro vendedor no está siendo honesto con sus clientes, como
      esconder información o exagerar.
    learning_objective: Al final, el niño puede reconocer al menos una señal de que un vendedor no está
      siendo honesto.
    key_vocabulary:
    - señal
    - esconder
    - honestidad
    - vendedor
    prior_knowledge: Sabe decir la verdad aunque cueste una venta (tema anterior).
    parent_check: "¿{{name}} puede reconocer una señal de que un vendedor no está siendo honesto con sus clientes?"
    prerequisites:
    - path: el-reino-de-las-ventas/vender-con-honestidad/la-diferencia-entre-vender-y-enganar
      strength: soft
      reason: "Distinguir vender de engañar en su propia venta ayuda a reconocer la misma señal cuando lo hace otro vendedor."
    fact_refs: []
    lessons:
    - position: 1
      slug: el-puesto-vecino
      micro_objective: Observar que un puesto vecino esconde información importante sobre su producto.
      narrative_beat: Liruf nota que el puesto de al lado no dice que su mercancía está algo dañada, y se
        pregunta si eso es honesto.
      difficulty: 1
      suggested_families:
      - story
      - analyze
    - position: 2
      slug: senales-que-veo-en-otros
      micro_objective: Identificar señales comunes de falta de honestidad en un vendedor, como esconder,
        exagerar o prometer de más.
      narrative_beat: Dr. Rho reúne varias señales que ha visto en mercaderes deshonestos del reino a lo
        largo de los años.
      difficulty: 2
      suggested_families:
      - analyze
      - arrange
    - position: 3
      slug: que-hago-si-lo-veo
      micro_objective: Decidir una acción correcta al notar que otro vendedor no está siendo honesto.
      narrative_beat: Zara Vex pregunta a Dina qué haría si ve que un mercader vecino no está siendo honesto
        con un cliente.
      difficulty: 3
      suggested_families:
      - choice
      - analyze
    - position: 4
      slug: mi-ojo-atento-del-reino
      micro_objective: Aplicar las señales aprendidas para identificar la falta de honestidad en una escena
        nueva del mercado.
      narrative_beat: En una escena nueva de la Gran Plaza, Dina identifica, sin ayuda, las señales de
        un vendedor poco honesto.
      difficulty: 3
      suggested_families:
      - analyze
      - choice
  - position: 8
    slug: mi-primer-dia-de-ventas-honestas
    title_es: Mi primer día de ventas honestas
    concept: Aplicar juntas todas las reglas de honestidad -describir bien, cobrar justo, cumplir promesas
      y decir la verdad- en un primer día completo de ventas.
    learning_objective: Al final, el niño puede aplicar en conjunto las reglas de venta honesta durante
      un día completo de práctica.
    key_vocabulary:
    - aplicar
    - práctica
    - honestidad
    - puesto
    prior_knowledge: Conoce todas las reglas de venta honesta enseñadas en la saga (temas anteriores).
    parent_check: "¿{{name}} puede resumir las reglas principales para vender con honestidad que aprendió esta semana?"
    fact_refs: []
    lessons:
    - position: 1
      slug: abro-mi-puesto
      micro_objective: Preparar el puesto propio aplicando una descripción honesta y un precio justo.
      narrative_beat: Con ayuda de Zara Vex, Dina prepara su puesto de limonada para el gran día, revisando
        que su descripción y su precio sean honestos.
      difficulty: 1
      suggested_families:
      - story
      - money
    - position: 2
      slug: mi-primer-cliente-del-dia
      micro_objective: Atender a un primer cliente aplicando honestidad en la descripción y el precio.
      narrative_beat: El primer cliente del día llega al puesto de Liruf, y él aplica todo lo aprendido
        sobre describir y cobrar con honestidad.
      difficulty: 2
      suggested_families:
      - storyplay
      - choice
    - position: 3
      slug: un-reto-de-honestidad
      micro_objective: Aplicar la decisión de decir la verdad frente a un cliente, aunque cueste una venta
        durante el día.
      narrative_beat: Un cliente pregunta algo directo sobre la limonada de Dina, y ella responde con la
        verdad, tal como practicó.
      difficulty: 3
      suggested_families:
      - storyplay
      - choice
    - position: 4
      slug: cierro-mi-primer-dia
      micro_objective: Reflexionar sobre el día completo de ventas honestas y resumir lo aprendido.
      narrative_beat: Al cerrar su puesto por primera vez, Dina y Liruf celebran junto a Zara Vex un primer
        día de ventas hecho con honestidad.
      difficulty: 3
      suggested_families:
      - storyplay
      - story
  - position: 9
    slug: el-cofre-del-repaso
    kind: review_spaced
    title_es: El Cofre del Repaso
    concept: Zara Vex abre un cofre del reino para poner a prueba, sin enseñar nada nuevo, todo lo aprendido
      en la saga Vender con Honestidad.
    learning_objective: Al final, el niño puede recordar y aplicar, sin ayuda nueva, los conceptos principales
      de la saga Vender con Honestidad.
    key_vocabulary:
    - vender
    - honesto
    - precio
    - promesa
    prior_knowledge: Ha completado los ocho temas de la saga Vender con Honestidad (aventura 5, saga 1).
    fact_refs: []
    review_of:
    - el-reino-de-las-ventas/vender-con-honestidad/que-es-vender
    - el-reino-de-las-ventas/vender-con-honestidad/describir-mi-producto-tal-como-es
    - el-reino-de-las-ventas/vender-con-honestidad/la-diferencia-entre-vender-y-enganar
    - el-reino-de-las-ventas/vender-con-honestidad/un-precio-justo-para-mi-producto
    - el-reino-de-las-ventas/vender-con-honestidad/cumplir-lo-que-prometo-al-vender
    - el-reino-de-las-ventas/vender-con-honestidad/decir-la-verdad-aunque-cueste-una-venta
    - el-reino-de-las-ventas/vender-con-honestidad/reconocer-cuando-alguien-no-vende-con-honestidad
    - el-reino-de-las-ventas/vender-con-honestidad/mi-primer-dia-de-ventas-honestas
    lessons:
    - position: 1
      slug: el-cofre-se-abre
      micro_objective: Recordar, sin ayuda nueva, qué significa vender y cómo describir un producto tal
        como es.
      narrative_beat: Zara Vex abre el cofre del reino y reta a Dina a recordar, moneda por moneda, lo
        primero que aprendió en esta saga.
      difficulty: 1
      suggested_families:
      - story
      - choice
    - position: 2
      slug: recordar-en-orden
      micro_objective: Recordar y ordenar de nuevo la diferencia entre vender y engañar, y cómo fijar un
        precio justo.
      narrative_beat: Liruf saca del cofre las monedas mezcladas de la saga y las ordena de memoria, sin
        que Dr. Rho le dé ninguna pista nueva.
      difficulty: 1
      suggested_families:
      - arrange
      - choice
    - position: 3
      slug: aplicar-lo-guardado
      micro_objective: Aplicar de nuevo, en una escena distinta, lo aprendido sobre cumplir promesas y
        decir la verdad aunque cueste una venta.
      narrative_beat: Dr. Rho presenta una escena nueva de la Gran Plaza y pregunta a Dina si recuerda,
        sin repasar la lección, qué haría en ese caso.
      difficulty: 2
      suggested_families:
      - choice
      - story
    - position: 4
      slug: cerrar-el-cofre
      micro_objective: Aplicar en conjunto todo lo repasado de la saga, incluyendo reconocer a un vendedor
        poco honesto, para cerrar el cofre.
      narrative_beat: Antes de cerrar el cofre, Dina demuestra que recuerda toda la saga uniendo cada moneda
        con la lección que le corresponde.
      difficulty: 2
      suggested_families:
      - choice
      - storyplay
  - position: 10
    slug: reto-entrelazado
    kind: review_interleaved
    title_es: Reto Entrelazado
    concept: Zara Vex mezcla distintos momentos de la saga Vender con Honestidad en un solo reto, para
      pensarlos juntos como un verdadero mercader del reino.
    learning_objective: Al final, el niño combina, sin nueva enseñanza, ideas de al menos dos temas distintos
      de esta saga en una sola actividad.
    key_vocabulary:
    - recordar
    - combinar
    - aplicar
    - honestidad
    prior_knowledge: Completó El Cofre del Repaso (tema anterior).
