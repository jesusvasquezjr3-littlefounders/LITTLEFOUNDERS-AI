schema_version: 1

adventure:
  position: 1
  slug: radar-de-oportunidades
  theme: city
  age_tier: tier4
  title:
    en-US: "Opportunity Radar"
    es-MX: "Radar de Oportunidades"
    pt-BR: "Radar de Oportunidades"
  description:
    en-US: "In Distrito Beta, four young scouts learn to spot problems worth solving before jumping to solutions - the first skill every founder needs."
    es-MX: "En el Distrito Beta, cuatro jóvenes scouts aprenden a detectar problemas que de verdad valen la pena resolver, antes de saltar a las soluciones - la primera habilidad de todo founder."
    pt-BR: "No Distrito Beta, quatro jovens exploradores aprendem a identificar problemas que realmente valem a pena resolver, antes de pular para solucoes - a primeira habilidade de todo founder."
  narrative_arc: "Dina, Liruf, Rho y Zara llegan al Distrito Beta como aprendices de scouts de oportunidades: su trabajo es caminar la ciudad, escuchar quejas reales, detectar patrones y separar una simple molestia de un problema que alguien pagaría por resolver. A lo largo del distrito descubren que la mejor oportunidad no es la idea más brillante, sino el problema mejor entendido - y terminan defendiendo, con datos y no solo con entusiasmo, la oportunidad que decidieron perseguir."

sagas:
  - position: 1
    slug: problemas-de-verdad
    icon: search
    title:
      en-US: "Real Problems"
      es-MX: "Problemas de Verdad"
      pt-BR: "Problemas de Verdade"
    description:
      en-US: "Not every annoyance is a problem worth solving - learn to tell the difference."
      es-MX: "No toda molestia es un problema que valga la pena resolver - aprende a distinguirlos."
      pt-BR: "Nem todo incomodo e um problema que vale a pena resolver - aprenda a diferencia-los."
    topics:
        - position: 1
          slug: molestia-vs-problema-real
          title_es: "Molestia vs. problema real"
          concept: "Una molestia es algo que incomoda una sola vez; un problema real se repite, cuesta tiempo o dinero, y alguien estaría dispuesto a resolverlo."
          learning_objective: "El aprendiz distingue una molestia pasajera de un problema real usando tres señales: repetición, costo y disposición a resolverlo."
          key_vocabulary: [molestia, problema real, repetición, costo, señal]
          prior_knowledge: "Ninguno - es el punto de partida del curso."
          fact_refs: []
          parent_check: "Preguntale a {{name}} cual fue la última 'molestia' que vivio esta semana y si de verdad se repite seguido o fue cosa de un solo día."
          lessons:
            - position: 1
              slug: la-fila-del-cafe
              micro_objective: "Identifica, en un caso concreto, si una queja describe una molestia de un solo día o un problema que se repite cada semana."
              narrative_beat: "Rho anota en su libreta: 'la fila del café tardo 20 minutos hoy'. Antes de anotarlo como oportunidad, pregunta si eso pasa todos los días o solo hoy."
              difficulty: 1
              suggested_families: [story, choice]
            - position: 2
              slug: tres-senales-de-un-problema-real
              micro_objective: "Aplica las tres señales (se repite, cuesta algo, alguien pagaría por resolverlo) para calificar un caso como problema real o no."
              narrative_beat: "Zara revisa una lista de 4 quejas del barrio y descarta dos porque solo pasaron una vez y a nadie más le importaron."
              difficulty: 2
              suggested_families: [choice, analyze]
        - position: 2
          slug: quien-lo-sufre
          title_es: "Quien lo sufre"
          concept: "Un problema sin una persona concreta detras no es una oportunidad; hay que nombrar exactamente quien lo vive."
          learning_objective: "El aprendiz identifica al grupo o persona específica afectada por un problema, en vez de hablar de la gente en general."
          key_vocabulary: [afectado, grupo específico, usuario, generalizar]
          prior_knowledge: "Distingue una molestia de un problema real (tema anterior)."
          fact_refs: []
          parent_check: "Cuando {{name}} diga que 'a la gente le pasa X', preguntale exactamente a QUIEN conoce que le pasa - un nombre, no una generalidad."
          lessons:
            - position: 1
              slug: quien-exactamente
              micro_objective: "Convierte una frase vaga ('a los estudiantes les cuesta') en una descripción específica de quien exactamente sufre el problema."
              narrative_beat: "Liruf dice 'a todos les cuesta madrugar'. Dina lo detiene: 'a todos, o a los que viven a 40 minutos de la escuela?'"
              difficulty: 2
              suggested_families: [story, choice]
            - position: 2
              slug: mapa-de-afectados
              micro_objective: "Ordena 4 grupos distintos según que tan directamente sufren un mismo problema descrito en el caso."
              narrative_beat: "Rho dibuja un mapa: en el centro, quien más sufre el problema del transporte tarde; en la orilla, quien casi no lo nota."
              difficulty: 3
              suggested_families: [arrange, analyze]
        - position: 3
          slug: que-tan-seguido-pasa
          title_es: "Que tan seguido pasa"
          concept: "La frecuencia importa: un problema diario vale más la pena resolver que uno que ocurre una vez al año."
          learning_objective: "El aprendiz compara dos problemas por su frecuencia y prioriza el que ocurre con más regularidad."
          key_vocabulary: [frecuencia, diario, ocasional, prioridad]
          prior_knowledge: "Sabe identificar quien sufre un problema (tema anterior)."
          fact_refs: []
          parent_check: "Pidele a {{name}} que compare dos problemas que haya mencionado esta semana: cual pasa más seguido?"
          lessons:
            - position: 1
              slug: diario-o-una-vez-al-ano
              micro_objective: "Clasifica 4 problemas descritos según ocurran a diario, cada semana o casi nunca."
              narrative_beat: "Zara ordena tarjetas: 'se me olvida la mochila' (diario) junto a 'se rompio mi patineta' (rara vez)."
              difficulty: 3
              suggested_families: [arrange, choice]
            - position: 2
              slug: elijo-el-mas-frecuente
              micro_objective: "Elige, entre dos problemas con el mismo grupo afectado, cual conviene atacar primero por su frecuencia."
              narrative_beat: "Rho compara dos quejas del mismo salon y elige investigar primero la que se repite cada clase, no la que paso una sola vez."
              difficulty: 3
              suggested_families: [choice, analyze]
        - position: 4
          slug: ya-lo-resuelven-de-otra-forma
          title_es: "Ya lo resuelven de otra forma"
          concept: "Casi todo problema ya tiene una solución improvisada (un parche); conocerla te dice contra que compites de verdad."
          learning_objective: "El aprendiz identifica el 'parche' actual que la gente usa para un problema, antes de proponer algo nuevo."
          key_vocabulary: [parche, solución actual, competencia indirecta, workaround]
          prior_knowledge: "Sabe comparar problemas por frecuencia (tema anterior)."
          fact_refs: []
          parent_check: "Preguntale a {{name}} que hace la gente HOY para resolver el problema que le interesa, antes de inventar algo nuevo."
          lessons:
            - position: 1
              slug: el-parche-que-ya-usan
              micro_objective: "Reconoce, en un caso, cual es la solución improvisada que la gente ya usa para un problema, aunque sea incomoda."
              narrative_beat: "Liruf nota que sus compañeros ya resuelven el problema de cargar el cargador compartiendolo por turnos en un chat."
              difficulty: 3
              suggested_families: [story, choice]
            - position: 2
              slug: contra-que-compito
              micro_objective: "Compara una idea nueva contra el parche actual y decide si de verdad ofrece una mejora clara."
              narrative_beat: "Zara se pregunta si su idea de app de prestamos entre compañeros es mejor que el chat grupal que ya usan, o solo distinta."
              difficulty: 4
              suggested_families: [analyze, choice]
        - position: 5
          slug: pagaria-por-resolverlo
          title_es: "Pagaría por resolverlo"
          concept: "No basta con que un problema moleste: hay que preguntar si alguien pagaría tiempo, esfuerzo o dinero por una solución mejor."
          learning_objective: "El aprendiz evalua la señal de disposición a pagar (dinero, tiempo o esfuerzo) como filtro de una oportunidad real."
          key_vocabulary: [disposición a pagar, esfuerzo, valor percibido]
          prior_knowledge: "Conoce el parche actual de un problema (tema anterior)."
          fact_refs: []
          parent_check: "Preguntale a {{name}} si el problema que le interesa es algo por lo que un amigo pagaría, o solo algo de lo que se queja."
          lessons:
            - position: 1
              slug: pagar-con-dinero-o-con-tiempo
              micro_objective: "Distingue tres formas en que alguien 'paga' por resolver un problema: dinero, tiempo o esfuerzo."
              narrative_beat: "Rho entrevista a un vecino: no pagaría con dinero por lavar su bici, pero si cambiaría 20 minutos de su sabado."
              difficulty: 4
              suggested_families: [story, choice]
            - position: 2
              slug: la-senal-mas-fuerte
              micro_objective: "Elige, entre dos reacciones de personas distintas, cual muestra una disposición a pagar más fuerte."
              narrative_beat: "Zara compara dos respuestas: una persona dice 'estaría bien' y otra dice 'te doy $50 ahora mismo por eso' - sabe cual pesa más."
              difficulty: 4
              suggested_families: [choice, analyze]
        - position: 6
          slug: el-problema-en-una-frase
          title_es: "El problema en una frase"
          concept: "Un problema bien entendido cabe en una sola frase clara: quien lo sufre, que le pasa y por que le importa."
          learning_objective: "El aprendiz redacta un problema real en una sola frase que nombra al afectado, la situación y la consecuencia."
          key_vocabulary: [enunciado del problema, claridad, consecuencia]
          prior_knowledge: "Reconoce señales de disposición a pagar (tema anterior)."
          fact_refs: []
          parent_check: "Pidele a {{name}} que te diga, en una sola frase, cual es el problema que más le interesa resolver - sin rodeos."
          lessons:
            - position: 1
              slug: sobra-o-falta-informacion
              micro_objective: "Revisa 3 enunciados de problema y detecta cual le falta o le sobra información para ser claro."
              narrative_beat: "Dina lee tres enunciados en la pizarra del distrito; uno menciona quien, que y por que, los otros dos se quedan cortos."
              difficulty: 4
              suggested_families: [choice, analyze]
            - position: 2
              slug: escribo-mi-problema
              micro_objective: "Redacta, sin ayuda, un enunciado de problema de una sola frase con afectado, situación y consecuencia."
              narrative_beat: "Liruf escribe en su libreta la frase final de su primer problema investigado y la lee en voz alta al equipo."
              difficulty: 5
              suggested_families: [storyplay, choice]
        - position: 7
          slug: repaso-radar-de-problemas
          kind: review_spaced
          title_es: "Repaso: Radar de Problemas Reales"
          concept: "Antes de seguir explorando el distrito, el equipo repasa como distinguir un problema real de una simple molestia."
          learning_objective: "El aprendiz recuerda y aplica, sin nueva enseñanza, los filtros de esta saga para evaluar problemas."
          key_vocabulary: [molestia, problema real, frecuencia, disposición a pagar]
          prior_knowledge: "Completo los 6 temas de Problemas de Verdad."
          fact_refs: []
          review_of:
            - radar-de-oportunidades/problemas-de-verdad/molestia-vs-problema-real
            - radar-de-oportunidades/problemas-de-verdad/quien-lo-sufre
            - radar-de-oportunidades/problemas-de-verdad/que-tan-seguido-pasa
            - radar-de-oportunidades/problemas-de-verdad/ya-lo-resuelven-de-otra-forma
            - radar-de-oportunidades/problemas-de-verdad/pagaria-por-resolverlo
            - radar-de-oportunidades/problemas-de-verdad/el-problema-en-una-frase
          lessons:
            - position: 1
              slug: repaso-molestia-o-problema
              micro_objective: "Recuerda y aplica, sin ayuda, las señales para distinguir una molestia de un problema real."
              narrative_beat: "El equipo revisa su libreta de campo y vuelve a clasificar sus primeras notas del distrito con ojos más entrenados."
              difficulty: 3
              suggested_families: [choice, analyze]
            - position: 2
              slug: repaso-armo-mi-enunciado
              micro_objective: "Aplica sin ayuda todo lo repasado: arma el enunciado de un problema nuevo en una sola frase."
              narrative_beat: "Zara toma una queja fresca del distrito y, sin ayuda de nadie, arma el enunciado completo en menos de un minuto."
              difficulty: 4
              suggested_families: [storyplay, choice]
        - position: 8
          slug: cruce-problemas-y-frecuencia
          kind: review_interleaved
          title_es: "Cruce: Problemas y Frecuencia"
          concept: "Mezclamos varias señales de esta saga -repetición, frecuencia y disposición a pagar- para juzgar un problema de una sola vez."
          learning_objective: "El aprendiz combina, sin nueva enseñanza, al menos dos señales de esta saga para evaluar un problema completo."
          key_vocabulary: [molestia, frecuencia, disposición a pagar]
          prior_knowledge: "Completo el repaso de Problemas de Verdad (tema anterior)."
          fact_refs: []
          review_of:
            - radar-de-oportunidades/problemas-de-verdad/molestia-vs-problema-real
            - radar-de-oportunidades/problemas-de-verdad/que-tan-seguido-pasa
            - radar-de-oportunidades/problemas-de-verdad/pagaria-por-resolverlo
          lessons:
            - position: 1
              slug: junto-frecuencia-y-molestia
              micro_objective: "Combina la señal de frecuencia con la de molestia-vs-problema para evaluar un caso nuevo."
              narrative_beat: "Rho junta dos filtros a la vez: revisa si el problema se repite Y si de verdad incomoda a alguien más alla de un mal día."
              difficulty: 4
              suggested_families: [choice, analyze]
            - position: 2
              slug: evaluo-un-caso-completo
              micro_objective: "Evalua, sin ayuda, un caso nuevo combinando frecuencia y disposición a pagar en una sola decisión."
              narrative_beat: "Zara decide en segundos si vale la pena seguir investigando un problema, cruzando que tan seguido pasa con si alguien pagaría por resolverlo."
              difficulty: 5
              suggested_families: [analyze, choice]
  - position: 2
    slug: detectando-patrones
    icon: insights
    title:
      en-US: "Spotting Patterns"
      es-MX: "Detectando Patrones"
      pt-BR: "Detectando Padroes"
    description:
      en-US: "One complaint is an anecdote. The same complaint from strangers is a pattern - and a lead."
      es-MX: "Una queja es una anecdota. La misma queja de desconocidos es un patron - y una pista."
      pt-BR: "Uma reclamacao e uma anedota. A mesma reclamacao de estranhos e um padrao - e uma pista."
    topics:
        - position: 1
          slug: quejas-que-se-repiten
          title_es: "Quejas que se repiten"
          concept: "Cuando la misma queja aparece en boca de personas distintas que no se conocen entre si, ahí hay un patron, no una casualidad."
          learning_objective: "El aprendiz reconoce un patron cuando la misma queja aparece en fuentes independientes."
          key_vocabulary: [patron, queja repetida, fuente independiente]
          prior_knowledge: "Completo Problemas de Verdad (saga anterior)."
          fact_refs: []
          parent_check: "Preguntale a {{name}} si ha escuchado la MISMA queja de dos personas que no se conocen entre si - eso ya es un patron."
          lessons:
            - position: 1
              slug: dos-quejas-la-misma-cosa
              micro_objective: "Reconoce cuando dos quejas de personas distintas describen en realidad el mismo problema."
              narrative_beat: "Rho compara la queja de un vendedor de la esquina con la de un cliente en otra calle: son casi la misma frase, sin haberse conocido."
              difficulty: 1
              suggested_families: [story, analyze]
            - position: 2
              slug: cuento-las-repeticiones
              micro_objective: "Cuenta cuantas veces se repite una queja entre 6 comentarios distintos de un caso."
              narrative_beat: "Zara marca con una palomita cada vez que encuentra la misma queja escondida en comentarios de redes del distrito."
              difficulty: 2
              suggested_families: [analyze, input]
        - position: 2
          slug: lo-que-todos-dan-por-hecho
          title_es: "Lo que todos dan por hecho"
          concept: "Una oportunidad se esconde en lo que todos aceptan como normal sin cuestionarlo - 'siempre ha sido así' es una pista, no una regla."
          learning_objective: "El aprendiz identifica una suposición que un grupo da por hecha y la cuestiona como posible oportunidad."
          key_vocabulary: [suposición, dar por hecho, cuestionar, normalizado]
          prior_knowledge: "Reconoce patrones en quejas repetidas (tema anterior)."
          fact_refs: []
          parent_check: "Preguntale a {{name}} que cosa 'siempre se ha hecho así' en su escuela o barrio que nadie ha cuestionado."
          lessons:
            - position: 1
              slug: siempre-ha-sido-asi
              micro_objective: "Detecta, en una escena, la frase 'siempre ha sido así' como señal de una suposición sin cuestionar."
              narrative_beat: "Liruf pregunta por que las inscripciónes del club siempre son solo en papel, y un adulto responde 'porque siempre ha sido así'."
              difficulty: 2
              suggested_families: [story, choice]
            - position: 2
              slug: cuestiono-la-suposicion
              micro_objective: "Convierte una suposición aceptada en una pregunta que abre una posible oportunidad."
              narrative_beat: "Dina transforma 'siempre ha sido así' en 'y si no tuviera que serlo?' frente a tres suposiciónes distintas del distrito."
              difficulty: 3
              suggested_families: [choice, analyze]
        - position: 3
          slug: cuando-algo-cambia
          title_es: "Cuando algo cambia"
          concept: "Un cambio de tecnologia, costumbre o regla abre huecos nuevos que antes no existian - hay que estar atento a lo que cambio recientemente."
          learning_objective: "El aprendiz relaciona un cambio reciente (tecnologico o de costumbre) con una nueva oportunidad que ese cambio abre."
          key_vocabulary: [cambio, tendencia, hueco nuevo]
          prior_knowledge: "Sabe cuestionar suposiciónes (tema anterior)."
          fact_refs: []
          parent_check: "Preguntale a {{name}} que cambio este año en su escuela o su grupo de amigos que antes no existia."
          lessons:
            - position: 1
              slug: algo-nuevo-en-el-distrito
              micro_objective: "Identifica en la escena que cambio reciente género una necesidad nueva que antes no existia."
              narrative_beat: "Rho nota que desde que llego la nueva ciclovia, los vecinos ya no saben donde estacionar sus bicis con seguridad."
              difficulty: 3
              suggested_families: [story, choice]
            - position: 2
              slug: conecto-el-cambio-con-el-hueco
              micro_objective: "Conecta un cambio reciente con el hueco específico que ese cambio dejo sin resolver."
              narrative_beat: "Zara arma en su libreta la línea: 'llego la ciclovia, aumentaron las bicis, falta estacionamiento seguro'."
              difficulty: 3
              suggested_families: [arrange, analyze]
        - position: 4
          slug: comparo-mercados-parecidos
          title_es: "Comparo mercados parecidos"
          concept: "Si algo funciono para resolver un problema parecido en otro lugar, puede darte una pista de que probar aquí."
          learning_objective: "El aprendiz compara un caso conocido de otro contexto con el problema local para inspirar una idea."
          key_vocabulary: [comparar, contexto parecido, inspiración, adaptar]
          prior_knowledge: "Relaciona cambios recientes con huecos (tema anterior)."
          fact_refs: []
          parent_check: "Preguntale a {{name}} si conoce alguna solución de otra escuela o ciudad que podría adaptarse a un problema de la suya."
          lessons:
            - position: 1
              slug: en-otra-colonia-ya-lo-resolvieron
              micro_objective: "Reconoce en un caso una solución que funciono en un contexto parecido y podría adaptarse al propio."
              narrative_beat: "Liruf recuerda que en la colonia vecina un grupo de estudiantes organizo prestamo de calculadoras - algo parecido podría servir aquí."
              difficulty: 3
              suggested_families: [story, analyze]
            - position: 2
              slug: adapto-no-copio
              micro_objective: "Ajusta una idea inspirada en otro contexto para que encaje en las condiciones específicas del caso local."
              narrative_beat: "Dina ajusta la idea del prestamo de calculadoras a su propio salon, donde el problema real es compartir cargadores, no calculadoras."
              difficulty: 4
              suggested_families: [choice, analyze]
        - position: 5
          slug: el-hueco-en-el-mercado
          title_es: "El hueco entre lo que hay y lo que falta"
          concept: "Comparar lo que ya existe contra lo que la gente todavia necesita revela el hueco exacto que una oportunidad debe llenar."
          learning_objective: "El aprendiz traza el hueco entre las opciones actuales y la necesidad no cubierta de un grupo."
          key_vocabulary: [hueco de mercado, opciones actuales, necesidad no cubierta]
          prior_knowledge: "Compara mercados parecidos (tema anterior)."
          fact_refs: []
          parent_check: "Preguntale a {{name}} que hay disponible hoy para resolver el problema que le interesa, y que le sigue faltando a esas opciones."
          lessons:
            - position: 1
              slug: lo-que-ya-existe
              micro_objective: "Lista, a partir de un caso, las opciones que ya existen para resolver un problema dado."
              narrative_beat: "Rho hace una lista de todo lo que ya existe para conseguir apuntes de clase: fotocopias, grupos de chat, prestamos directos."
              difficulty: 4
              suggested_families: [arrange, analyze]
            - position: 2
              slug: lo-que-todavia-falta
              micro_objective: "Identifica, comparando contra lo que ya existe, que necesidad específica sigue sin cubrirse."
              narrative_beat: "Zara nota que ninguna opción de apuntes resuelve el problema real: encontrar justo el tema que falto, no todo el cuaderno."
              difficulty: 4
              suggested_families: [analyze, choice]
        - position: 6
          slug: valido-con-datos-no-con-la-panza
          title_es: "Valido con datos, no con la panza"
          concept: "Una corazonada es un buen punto de partida, pero antes de invertir tiempo hay que buscar una señal real que la respalde."
          learning_objective: "El aprendiz distingue una corazonada de una señal validada y busca al menos un dato antes de decidir."
          key_vocabulary: [corazonada, validar, señal real, dato]
          prior_knowledge: "Traza el hueco de mercado (tema anterior)."
          fact_refs: []
          parent_check: "Preguntale a {{name}} como comprobaria, sin gastar dinero, si su idea de verdad le interesa a alguien más."
          lessons:
            - position: 1
              slug: corazonada-o-dato
              micro_objective: "Distingue entre una afirmación basada en corazonada y una basada en un dato real observado."
              narrative_beat: "Liruf dice 'a todos les va a encantar' - Dina le pregunta: 'a cuantos ya se lo preguntaste de verdad?'"
              difficulty: 4
              suggested_families: [story, choice]
            - position: 2
              slug: busco-una-senal-antes-de-seguir
              micro_objective: "Elige, entre 3 formas de validar una idea, la más rápida y barata para conseguir una señal real."
              narrative_beat: "Zara elige preguntar a 10 compañeros en el recreo antes de gastar su domingo diseñando un logo que nadie pidio."
              difficulty: 5
              suggested_families: [choice, analyze]
        - position: 7
          slug: repaso-detectando-patrones
          kind: review_spaced
          title_es: "Repaso: Detectando Patrones"
          concept: "El equipo repasa como encontrar patrones, cuestionar lo normalizado y validar una idea antes de enamorarse de ella."
          learning_objective: "El aprendiz recuerda y aplica, sin nueva enseñanza, las herramientas de detección de patrones de esta saga."
          key_vocabulary: [patron, suposición, hueco, validar]
          prior_knowledge: "Completo los 6 temas de Detectando Patrones."
          fact_refs: []
          review_of:
            - radar-de-oportunidades/detectando-patrones/quejas-que-se-repiten
            - radar-de-oportunidades/detectando-patrones/lo-que-todos-dan-por-hecho
            - radar-de-oportunidades/detectando-patrones/cuando-algo-cambia
            - radar-de-oportunidades/detectando-patrones/comparo-mercados-parecidos
