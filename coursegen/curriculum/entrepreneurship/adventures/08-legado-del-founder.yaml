schema_version: 1

adventure:
  position: 8
  slug: legado-del-founder
  theme: cosmos
  age_tier: tier4
  title:
    en-US: "The Founder's Legacy"
    es-MX: "Legado del Founder"
    pt-BR: "Legado do Founder"
  description:
    en-US: "At the Legacy Observatory, high above every district the crew has crossed, they assemble everything learned into one complete business model, craft a pitch that actually lands, and build a long-term vision worth defending before the full council of founders."
    es-MX: "En el Observatorio del Legado, muy por encima de cada distrito que el equipo ha cruzado, reunen todo lo aprendido en un modelo de negocio completo, construyen un pitch que de verdad aterriza, y trazan una visión de largo plazo que vale la pena defender ante el consejo completo de founders."
    pt-BR: "No Observatorio do Legado, bem acima de cada distrito que a equipe atravessou, reunem tudo o que aprenderam em um modelo de negocio completo, constroem um pitch que realmente aterrissa, e tracam uma visão de longo prazo que vale a pena defender diante do conselho completo de founders."
  narrative_arc: "Con un caso completo defendido ante el Tribunal de Confianza, Dina, Liruf, Rho y Zara suben al Observatorio del Legado, el punto más alto desde donde se ve todo el camino recorrido: el Distrito Beta donde aprendieron a detectar problemas reales, el Valle de los Garages donde construyeron su primer MVP, el Archipielago de las Voces donde escucharon a sus clientes de verdad, el Distrito del Precio Justo donde aprendieron a cobrar lo correcto, el Bosque de las Conexiones donde vendieron sin manipular, el Reino en Expansión donde aprendieron a liderar un equipo, y el Distrito de las Señales Rojas donde aprendieron a protegerse de un mal trato. Ahora deben reunir todo eso en un solo modelo de negocio completo, convertirlo en un pitch que cualquiera entienda en minutos, y trazar una visión de largo plazo que no dependa solo de ellos. El viaje termina donde empieza el siguiente: presentando su legado completo ante el Consejo del Observatorio, el conjunto de todos los founders que cruzaron el mismo camino antes que ellos."

sagas:
  - position: 1
    slug: mi-modelo-de-negocio-completo
    icon: hub
    title:
      en-US: "My Complete Business Model"
      es-MX: "Mi Modelo de Negocio Completo"
      pt-BR: "Meu Modelo de Negocio Completo"
    description:
      en-US: "Every piece learned across the journey - problem, customer, product, price, channel, team - fits into a single map."
      es-MX: "Cada pieza aprendida a lo largo del viaje - problema, cliente, producto, precio, canal, equipo - cabe en un solo mapa."
      pt-BR: "Cada peca aprendida ao longo da jornada - problema, cliente, produto, preço, canal, equipe - cabe em um único mapa."
    topics:
        - position: 1
          slug: que-piezas-tiene-un-modelo-de-negocio
          title_es: "Que piezas tiene un modelo de negocio"
          concept: "Un modelo de negocio completo tiene piezas concretas que encajan entre si: el problema, el cliente, el producto, el precio, como llega al cliente, y quien lo hace posible - falta una pieza y el modelo cojea."
          learning_objective: "El aprendiz nombra las 6 piezas básicas de un modelo de negocio completo (problema, cliente, producto, precio, canal, equipo)."
          key_vocabulary: [modelo de negocio, piezas que encajan, mapa completo]
          prior_knowledge: "Completo Radar de Riesgos (aventura anterior): ya tiene un caso completo defendido ante el Tribunal de Confianza."
          fact_refs: []
          parent_check: "Pregunta a {{name}} si puede nombrar, de memoria, las 6 piezas de un modelo de negocio completo sin ver ninguna nota."
          lessons:
            - position: 1
              slug: cuento-las-piezas-de-un-negocio-ajeno
              micro_objective: "Cuenta, en el negocio de gorras bordadas de un compañero, cuantas de las 6 piezas básicas ya estan definidas y cuales faltan."
              narrative_beat: "Rho revisa el negocio de gorras de Zara: tiene problema, cliente, producto y precio claros, pero todavia no tiene definido el canal de venta ni los roles del equipo."
              difficulty: 1
              suggested_families: [analyze, choice]
            - position: 2
              slug: nombro-las-seis-piezas-de-memoria
              micro_objective: "Nombra, sin ayuda, las 6 piezas básicas de un modelo de negocio completo sin apoyarse en ninguna lista."
              narrative_beat: "Liruf recita de memoria: problema, cliente, producto, precio, canal y equipo - las seis piezas que aprendio a lo largo de todo el viaje."
              difficulty: 2
              suggested_families: [input, storyplay]
        - position: 2
          slug: mi-problema-y-mi-cliente-en-una-frase
          title_es: "Mi problema y mi cliente en una frase"
          concept: "Resumir en una sola frase el problema real que resuelves y quien exactamente lo vive obliga a que las dos piezas mas importantes del modelo queden claras desde el principio."
          learning_objective: "El aprendiz redacta una frase que combina el problema real identificado y el cliente especifico que lo vive, recuperando lo aprendido en Radar de Oportunidades y Mesa del Cliente."
          key_vocabulary: [problema real, cliente especifico, una sola frase]
          prior_knowledge: "Nombra las 6 piezas de un modelo de negocio (tema anterior)."
          fact_refs: []
          parent_check: "Pidele a {{name}} que te diga, en una sola frase, cual es el problema real de su negocio y quien exactamente lo vive."
          lessons:
            - position: 1
              slug: reviso-mi-problema-y-mi-cliente-de-antes
              micro_objective: "Recupera, sin ayuda, el problema real y el cliente especifico que definio en aventuras anteriores del viaje."
              narrative_beat: "Dina repasa sus notas del Distrito Beta y del Archipielago de las Voces: el problema es que las fundas se rompen en las esquinas, y el cliente es quien ya rompio una este año."
              difficulty: 2
              suggested_families: [analyze, storyplay]
            - position: 2
              slug: escribo-mi-frase-de-problema-y-cliente
              micro_objective: "Redacta, sin ayuda, una sola frase que combina su problema real y su cliente especifico."
              narrative_beat: "Zara escribe: 'resuelvo que las fundas se rompan en la esquina, para estudiantes que ya rompieron una este año' - problema y cliente en una sola frase."
              difficulty: 3
              suggested_families: [storyplay, input]
        - position: 3
          slug: mi-producto-y-su-precio-en-una-frase
          title_es: "Mi producto y su precio en una frase"
          concept: "Resumir el producto (la version mínima que funciona) junto con su precio final defendido conecta lo construido en el Valle de los Garages con lo calculado en el Distrito del Precio Justo."
          learning_objective: "El aprendiz redacta una frase que combina su producto (MVP) y su precio final, recuperando lo aprendido en Prototipo de Garage y Precio que sí Convence."
          key_vocabulary: [producto mínimo, precio final, una sola frase]
          prior_knowledge: "Redacta su frase de problema y cliente (tema anterior)."
          fact_refs: []
          parent_check: "Pidele a {{name}} que te diga, en una sola frase, que es exactamente su producto y cuanto cuesta."
          lessons:
            - position: 1
              slug: reviso-mi-mvp-y-mi-precio-final
              micro_objective: "Recupera, sin ayuda, el MVP construido y el precio final defendido en aventuras anteriores del viaje."
              narrative_beat: "Rho repasa sus notas del Valle de los Garages y del Distrito del Precio Justo: su MVP es una funda con refuerzo de esquina, y su precio final defendido es $95."
              difficulty: 3
              suggested_families: [analyze, storyplay]
            - position: 2
              slug: escribo-mi-frase-de-producto-y-precio
              micro_objective: "Redacta, sin ayuda, una sola frase que combina su producto mínimo viable y su precio final."
              narrative_beat: "Liruf escribe: 'vendo una funda con refuerzo reforzado en la esquina por $95, un precio que cubre mi costo y mi margen mínimo'."
              difficulty: 3
              suggested_families: [storyplay, input]
        - position: 4
          slug: como-llega-mi-producto-al-cliente
          title_es: "Como llega mi producto al cliente"
          concept: "El canal es el camino concreto por el que tu producto llega al cliente: una conversación directa, un puesto, una publicación - describirlo con claridad conecta con lo aprendido en el Bosque de las Conexiones."
          learning_objective: "El aprendiz describe el canal especifico por el que su producto llega al cliente, recuperando lo aprendido en Red de Ventas."
          key_vocabulary: [canal, camino concreto, llega al cliente]
          prior_knowledge: "Redacta su frase de producto y precio (tema anterior)."
          fact_refs: []
          parent_check: "Pregunta a {{name}} por que camino especifico llega su producto hasta el cliente final."
          lessons:
            - position: 1
              slug: reviso-mi-embudo-de-ventas
              micro_objective: "Recupera, sin ayuda, el embudo de ventas y la conversación de venta definidos en la aventura Red de Ventas."
              narrative_beat: "Dina repasa sus notas del Bosque de las Conexiones: su canal principal es un mensaje directo despues de que alguien pregunta el precio en sus publicaciones."
              difficulty: 3
              suggested_families: [analyze, storyplay]
            - position: 2
              slug: describo-mi-canal-en-una-frase
              micro_objective: "Redacta, sin ayuda, una frase que describe el canal especifico por el que su producto llega al cliente."
              narrative_beat: "Zara escribe: 'mi producto llega por mensaje directo despues de que alguien lo ve en mis publicaciones y pregunta el precio' - su canal en una frase."
              difficulty: 4
              suggested_families: [storyplay, input]
        - position: 5
          slug: quien-hace-que-en-mi-equipo
          title_es: "Quien hace que en mi equipo"
          concept: "Un modelo de negocio sin roles claros de equipo se cae en cuanto el founder no puede hacer todo solo - definir quien hace que conecta con lo aprendido en el Reino en Expansión."
          learning_objective: "El aprendiz describe los roles claros de su equipo, recuperando lo aprendido en Equipo que Escala."
          key_vocabulary: [roles claros, quien hace que, equipo]
          prior_knowledge: "Describe su canal de venta (tema anterior)."
          fact_refs: []
          parent_check: "Pidele a {{name}} que te diga quien hace que en su equipo, con roles claros y sin duplicados."
          lessons:
            - position: 1
              slug: reviso-los-roles-de-mi-equipo
              micro_objective: "Recupera, sin ayuda, los roles claros definidos en la aventura Equipo que Escala."
              narrative_beat: "Rho repasa sus notas del Reino en Expansión: el confirma pedidos, su compañera maneja redes, y otra revisa la calidad final antes de entregar."
              difficulty: 3
              suggested_families: [analyze, storyplay]
            - position: 2
              slug: describo-los-roles-en-una-frase
              micro_objective: "Redacta, sin ayuda, una frase que describe los roles claros de su equipo sin duplicados."
              narrative_beat: "Liruf escribe: 'yo confirmo pedidos y cierro ventas, mi compañera maneja redes, y otra revisa la calidad antes de entregar' - roles claros en una frase."
              difficulty: 4
              suggested_families: [storyplay, arrange]
        - position: 6
          slug: uno-todas-las-piezas-en-un-solo-mapa
          title_es: "Uno todas las piezas en un solo mapa"
          concept: "Juntar las 6 frases (problema, cliente, producto, precio, canal, equipo) en un solo mapa visual es lo que convierte piezas sueltas en un modelo de negocio completo y presentable."
          learning_objective: "El aprendiz ensambla las 6 piezas de su modelo de negocio en un solo mapa completo y coherente."
          key_vocabulary: [mapa completo, piezas sueltas, modelo coherente]
          prior_knowledge: "Describe los roles de su equipo (tema anterior)."
          fact_refs: []
          parent_check: "Pidele a {{name}} que te muestre su mapa completo de modelo de negocio, con las 6 piezas juntas."
          lessons:
            - position: 1
              slug: ordeno-mis-seis-frases-en-un-mapa
              micro_objective: "Ordena, sin ayuda, sus 6 frases (problema, cliente, producto, precio, canal, equipo) en un mapa visual de una sola página."
              narrative_beat: "Dina ordena sus 6 tarjetas en un mapa: problema y cliente arriba, producto y precio al centro, canal y equipo abajo - todo en una sola página."
              difficulty: 4
              suggested_families: [arrange, analyze]
            - position: 2
              slug: presento-mi-modelo-completo
              micro_objective: "Completa, sin ayuda, la presentación de su modelo de negocio completo ensamblando las 6 piezas en un mapa coherente."
              narrative_beat: "Zara presenta su mapa completo por primera vez: de un vistazo, cualquiera puede ver el problema, el cliente, el producto, el precio, el canal y el equipo detras de su negocio."
              difficulty: 5
              suggested_families: [storyplay, choice]
        - position: 7
          slug: repaso-mi-modelo-de-negocio-completo
          kind: review_spaced
          title_es: "Repaso: Mi Modelo de Negocio Completo"
          concept: "El equipo repasa las 6 piezas de un modelo de negocio y como ensamblarlas en un solo mapa coherente."
          learning_objective: "El aprendiz recuerda y aplica, sin nueva enseñanza, el ensamblaje completo de un modelo de negocio."
          key_vocabulary: [6 piezas, mapa coherente, ensamblar]
          prior_knowledge: "Completo los 6 temas de Mi Modelo de Negocio Completo."
          fact_refs: []
          review_of:
            - legado-del-founder/mi-modelo-de-negocio-completo/que-piezas-tiene-un-modelo-de-negocio
            - legado-del-founder/mi-modelo-de-negocio-completo/mi-problema-y-mi-cliente-en-una-frase
            - legado-del-founder/mi-modelo-de-negocio-completo/mi-producto-y-su-precio-en-una-frase
            - legado-del-founder/mi-modelo-de-negocio-completo/como-llega-mi-producto-al-cliente
            - legado-del-founder/mi-modelo-de-negocio-completo/quien-hace-que-en-mi-equipo
            - legado-del-founder/mi-modelo-de-negocio-completo/uno-todas-las-piezas-en-un-solo-mapa
          lessons:
            - position: 1
              slug: repaso-redacto-una-frase-de-producto-nueva
              micro_objective: "Recuerda y aplica, sin ayuda, la redacción de una frase de producto y precio para un negocio que todavia no había visto."
              narrative_beat: "El equipo redacta, sin ayuda, la frase de producto y precio de un negocio nuevo de paseo de mascotas que crece en el observatorio."
              difficulty: 3
              suggested_families: [storyplay, input]
            - position: 2
              slug: repaso-ensamblo-un-mapa-nuevo
              micro_objective: "Aplica sin ayuda todo lo repasado: ensambla las 6 piezas de un modelo de negocio nuevo en un solo mapa."
              narrative_beat: "Rho ensambla, sin ayuda de nadie, el mapa completo de un negocio nuevo que el equipo nunca había analizado."
              difficulty: 4
              suggested_families: [arrange, analyze]
        - position: 8
          slug: cruce-todo-el-viaje-emprendedor
          kind: review_interleaved
          title_es: "Cruce: Todo el Viaje Emprendedor"
          concept: "Mezclamos hallazgos de cada distrito recorrido - oportunidad, prototipo, cliente, precio, ventas, equipo y riesgo - en un solo modelo de negocio que los integra todos."
          learning_objective: "El aprendiz combina, sin nueva enseñanza, hallazgos clave de las siete aventuras anteriores del curso completo en su modelo de negocio ensamblado."
          key_vocabulary: [siete aventuras, integrar hallazgos, viaje completo]
          prior_knowledge: "Completo el repaso de Mi Modelo de Negocio Completo (tema anterior) y las siete aventuras previas del curso."
          fact_refs: []
          review_of:
            - radar-de-oportunidades/problemas-de-verdad/molestia-vs-problema-real
            - prototipo-de-garage/que-es-un-mvp/el-producto-mas-pequeno-que-funciona
            - mesa-del-cliente/itero-con-senal-real/mi-decision-final-con-clientes-reales
            - precio-que-si-convence/el-punto-de-equilibrio/decido-mi-precio-final
            - red-de-ventas/persuasion-etica/mi-codigo-de-venta-etica
            - equipo-que-escala/lidero-mientras-escala/mi-plan-de-liderazgo-para-el-siguiente-mes
            - radar-de-riesgos/etica-en-el-dia-a-dia-del-negocio/mi-codigo-de-riesgos-y-etica-del-negocio
          lessons:
            - position: 1
              slug: identifico-el-hallazgo-de-cada-distrito
              micro_objective: "Identifica, sin ayuda, un hallazgo clave de cada uno de los distritos recorridos que forma parte de su modelo de negocio final."
              narrative_beat: "Dina recorre el mapa del observatorio y señala, distrito por distrito, el hallazgo clave que se quedo en su modelo: un problema real, un MVP simple, un cliente validado, un precio con margen, ventas eticas, un equipo con roles claros, y un código de riesgos."
              difficulty: 4
              suggested_families: [analyze, arrange]
            - position: 2
              slug: mi-modelo-final-integra-los-siete-distritos
              micro_objective: "Confirma, sin ayuda, que su mapa de modelo de negocio final refleja de verdad los siete hallazgos clave del viaje completo, sin dejar ninguno fuera."
              narrative_beat: "Zara revisa su mapa final y confirma que cada uno de los siete distritos dejo su huella: el problema, el MVP, el cliente, el precio, las ventas eticas, el equipo y el código de riesgos, todos presentes."
              difficulty: 5
              suggested_families: [analyze, choice]
  - position: 2
    slug: el-pitch-que-si-se-entiende
    icon: campaign
    title:
      en-US: "The Pitch That Actually Lands"
      es-MX: "El Pitch que sí se Entiende"
      pt-BR: "O Pitch que Realmente se Entende"
    description:
      en-US: "A model no one can explain in two minutes is a model no one will fund or join - the pitch is where clarity gets tested."
      es-MX: "Un modelo que nadie puede explicar en dos minutos es un modelo que nadie va a financiar ni a unirse - el pitch es donde la claridad se pone a prueba."
      pt-BR: "Um modelo que ninguem consegue explicar em dois minutos e um modelo que ninguem vai financiar nem se juntar - o pitch e onde a clareza e posta a prova."
    topics:
        - position: 1
          slug: que-es-un-pitch-y-para-que-sirve
          title_es: "Que es un pitch y para que sirve"
          concept: "Un pitch es una presentación corta y clara de tu modelo de negocio, pensada para que alguien que nunca lo había escuchado lo entienda y quiera saber más en pocos minutos."
          learning_objective: "El aprendiz explica para que sirve un pitch y a quien esta dirigido, distinguiendolo de una explicación larga y detallada."
          key_vocabulary: [pitch, presentación corta, entender rápido]
          prior_knowledge: "Completo Mi Modelo de Negocio Completo (saga anterior): ya tiene un modelo ensamblado en un mapa."
          fact_refs: []
          parent_check: "Pregunta a {{name}} para que sirve un pitch y en cuanto tiempo cree que debería poder explicar su negocio completo."
          lessons:
            - position: 1
              slug: esto-es-un-pitch-o-una-explicacion-larga
              micro_objective: "Distingue, entre dos presentaciones del mismo negocio, cual funciona como pitch corto y claro y cual es una explicación larga y difícil de seguir."
              narrative_beat: "Liruf explica su negocio durante 10 minutos con todos los detalles; Rho lo resume en 90 segundos y aun asi cualquiera entiende de que trata."
              difficulty: 1
              suggested_families: [choice, analyze]
            - position: 2
              slug: explico-para-que-sirve-mi-pitch
              micro_objective: "Explica, sin ayuda, para que sirve especificamente el pitch de su propio negocio y a quien va dirigido."
              narrative_beat: "Zara explica: 'mi pitch sirve para que alguien que nunca escucho de mi funda entienda en un minuto por que le serviria y quiera saber más'."
              difficulty: 2
              suggested_families: [storyplay, choice]
        - position: 2
          slug: cuento-mi-problema-en-diez-segundos
          title_es: "Cuento mi problema en diez segundos"
          concept: "Los primeros diez segundos de un pitch deciden si la otra persona sigue escuchando; describir el problema real de forma concreta y rápida es lo que atrapa la atención."
          learning_objective: "El aprendiz redacta una apertura de pitch de diez segundos que describe el problema real de forma concreta."
          key_vocabulary: [primeros diez segundos, atrapar la atención, problema concreto]
          prior_knowledge: "Explica para que sirve un pitch (tema anterior)."
          fact_refs: []
          parent_check: "Pidele a {{name}} que te diga su apertura de pitch en diez segundos, cronometrando el tiempo."
          lessons:
            - position: 1
              slug: esta-apertura-atrapa-o-aburre
              micro_objective: "Compara dos aperturas de pitch de diez segundos y elige la que describe el problema de forma concreta y atrapa la atención."
              narrative_beat: "Dina abre con 'quiero hablarles de mi negocio de fundas' y pierde a la audiencia; Rho abre con 'a cuantos se les ha roto la funda justo en la esquina este año?' y todos levantan la mano."
              difficulty: 2
              suggested_families: [choice, analyze]
            - position: 2
              slug: escribo-mi-apertura-de-diez-segundos
              micro_objective: "Redacta, sin ayuda, una apertura de pitch de diez segundos que describe su problema real de forma concreta."
              narrative_beat: "Liruf escribe su apertura: '¿cuantas veces se te ha roto la funda justo en la esquina? a mi tres veces este año, y ahí empezo todo esto'."
              difficulty: 3
              suggested_families: [storyplay, input]
        - position: 3
          slug: muestro-no-solo-cuento
          title_es: "Muestro, no solo cuento"
          concept: "Describir tu producto con palabras convence menos que mostrarlo de verdad - una foto, una muestra fisica, un video corto - lo que se ve se cree más rápido que lo que se describe."
          learning_objective: "El aprendiz elige, entre describir con palabras y mostrar evidencia concreta, la opción que hace más convincente una parte de su pitch."
          key_vocabulary: [mostrar evidencia, más convincente, se ve se cree]
          prior_knowledge: "Redacta su apertura de diez segundos (tema anterior)."
          fact_refs: []
          parent_check: "Pregunta a {{name}} que evidencia concreta (foto, muestra, video) piensa mostrar durante su pitch, en vez de solo describir con palabras."
          lessons:
            - position: 1
              slug: describo-con-palabras-o-muestro-la-evidencia
              micro_objective: "Elige, entre dos versiónes del mismo pitch, la que muestra evidencia concreta del producto en vez de solo describirlo con palabras."
              narrative_beat: "Zara describe su refuerzo de esquina con palabras durante un minuto; Rho simplemente muestra la funda y la deja caer para que todos vean que no se rompe."
              difficulty: 3
              suggested_families: [choice, analyze]
            - position: 2
              slug: elijo-que-evidencia-voy-a-mostrar
              micro_objective: "Elige, sin ayuda, la evidencia concreta más convincente que puede mostrar durante su pitch en vez de solo describir su producto."
              narrative_beat: "Dina elige mostrar la reseña real de una clienta en pantalla, en vez de solo contar que a la gente le gusto su producto."
              difficulty: 4
              suggested_families: [choice, storyplay]
        - position: 4
          slug: uso-un-numero-que-si-importa
          title_es: "Uso un número que sí importa"
          concept: "Llenar un pitch con muchos números confunde; elegir UN número que de verdad importa (el margen, la tasa de conversión, cuantas ventas ya hizo) se recuerda mucho mejor."
          learning_objective: "El aprendiz elige un solo número clave de su negocio para incluir en su pitch, en vez de saturar con muchos datos."
          key_vocabulary: [un solo número, se recuerda mejor, saturar con datos]
          prior_knowledge: "Elige que evidencia mostrar (tema anterior)."
          fact_refs: []
          parent_check: "Pregunta a {{name}} cual es el UN número más importante que debería incluir en su pitch, y por que ese y no otro."
          lessons:
            - position: 1
