schema_version: 1

adventure:
  position: 5
  slug: red-de-ventas
  theme: forest
  age_tier: tier4
  title:
    en-US: "Sales Network"
    es-MX: "Red de Ventas"
    pt-BR: "Rede de Vendas"
  description:
    en-US: "In the Connection Forest, where every trail links one founder to the next, the crew learns to open real conversations, build a funnel that actually converts, negotiate without losing the customer, and persuade without ever crossing into manipulation."
    es-MX: "En el Bosque de las Conexiones, donde cada sendero conecta a un founder con el siguiente, el equipo aprende a abrir conversaciones reales, construir un embudo que de verdad convierte, negociar sin perder al cliente, y persuadir sin cruzar jamas hacia la manipulación."
    pt-BR: "Na Floresta das Conexões, onde cada trilha liga um founder ao próximo, a equipe aprende a abrir conversas reais, construir um funil que realmente converte, negociar sem perder o cliente, e persuadir sem jamais cruzar para a manipulação."
  narrative_arc: "Con un precio defendido ante el Consejo de Comerciantes, Dina, Liruf, Rho y Zara entran al Bosque de las Conexiones, donde miles de senderos conectan a cada founder con clientes, aliados y competidores. Ahí descubren que vender bien no es convencer a la fuerza, sino abrir una conversación honesta, entender el embudo completo desde que alguien los conoce hasta que compra, negociar protegiendo la relación y no solo el trato, y persuadir usando la verdad como única herramienta. El bosque entero se prepara para el Gran Mercado, donde cada equipo debe demostrar que puede cerrar una venta difícil sin traicionar su propio código ético."

sagas:
  - position: 1
    slug: abro-la-conversacion-de-venta
    icon: forum
    title:
      en-US: "Opening the Sales Conversation"
      es-MX: "Abro la Conversación de Venta"
      pt-BR: "Abro a Conversa de Venda"
    description:
      en-US: "Selling well starts by understanding the other person's problem before saying a single word about your product."
      es-MX: "Vender bien empieza por entender el problema de la otra persona antes de decir una sola palabra de tu producto."
      pt-BR: "Vender bem comeca por entender o problema da outra pessoa antes de dizer uma única palavra sobre seu produto."
    topics:
        - position: 1
          slug: vendo-o-ayudo-a-decidir
          title_es: "Vendo o ayudo a decidir"
          concept: "Vender de verdad es ayudar a alguien a decidir si tu producto resuelve su problema - no empujarlo a comprar algo que no necesita."
          learning_objective: "El aprendiz distingue una conversación de venta que ayuda a decidir de una que empuja una compra innecesaria."
          key_vocabulary: [ayudar a decidir, empujar la compra, necesidad real]
          prior_knowledge: "Completo Precio que sí Convence (aventura anterior): ya tiene un precio final defendido."
          fact_refs: []
          parent_check: "Pregunta a {{name}} si, en su última venta, sintio que ayudo a decidir a la otra persona o que la empujo a comprar algo que no necesitaba."
          lessons:
            - position: 1
              slug: esto-ayuda-o-esto-empuja
              micro_objective: "Distingue, entre dos frases de venta, cual ayuda al cliente a decidir con información real y cual solo lo empuja a comprar ya."
              narrative_beat: "Liruf le dice a un cliente 'compralo ya, es tu última oportunidad' sin que sea cierto; Rho le explica que eso empuja, no ayuda."
              difficulty: 1
              suggested_families: [choice, analyze]
            - position: 2
              slug: reescribo-un-mensaje-que-empuja
              micro_objective: "Reescribe, sin ayuda, un mensaje de venta que empuja en una versión que de verdad ayuda al cliente a decidir."
              narrative_beat: "Zara cambia 'últimas piezas, compra ahora' por 'cuentame que buscas y te digo si esto te sirve' en su mensaje de venta."
              difficulty: 2
              suggested_families: [storyplay, choice]
        - position: 2
          slug: identifico-mi-cliente-ideal
          title_es: "Identifico mi cliente ideal"
          concept: "No todo mundo es tu cliente; describir con precisión quien de verdad se beneficia de tu producto evita perder tiempo con quien nunca va a comprar."
          learning_objective: "El aprendiz describe un perfil de cliente ideal con características específicas, en vez de una descripción vaga de 'cualquiera'."
          key_vocabulary: [cliente ideal, perfil específico, perder tiempo]
          prior_knowledge: "Distingue ayudar a decidir de empujar una compra (tema anterior)."
          fact_refs: []
          parent_check: "Pidele a {{name}} que describa a su cliente ideal con al menos 3 características específicas, no solo 'la gente'."
          lessons:
            - position: 1
              slug: cualquiera-o-alguien-especifico
              micro_objective: "Elige, entre un perfil vago y uno específico, cual describe mejor a un cliente ideal para vender fundas personalizadas."
              narrative_beat: "Rho descarta 'cualquiera con celular' y elige 'estudiantes que ya rompieron una funda este año y publican fotos de su celular seguido'."
              difficulty: 2
              suggested_families: [choice, analyze]
            - position: 2
              slug: describo-mi-cliente-ideal
              micro_objective: "Redacta, sin ayuda, un perfil de cliente ideal con al menos 3 características específicas para su propio producto."
              narrative_beat: "Dina escribe: 'mi cliente ideal tiene entre 14 y 17 años, ya gasta en personalizar sus cosas, y sigue cuentas de diseño en redes'."
              difficulty: 3
              suggested_families: [storyplay, choice]
        - position: 3
          slug: el-primer-mensaje-que-si-contestan
          title_es: "El primer mensaje que sí contestan"
          concept: "Un primer mensaje que habla solo de ti mismo se ignora; uno que nombra algo especifico de la otra persona genera respuesta."
          learning_objective: "El aprendiz redacta un primer mensaje de contacto que nombra algo específico del cliente potencial, en vez de hablar solo de su producto."
          key_vocabulary: [primer mensaje, algo especifico, genera respuesta]
          prior_knowledge: "Describe un perfil de cliente ideal (tema anterior)."
          fact_refs: []
          parent_check: "Revisa junto a {{name}} el primer mensaje que enviaria a un cliente potencial y pregunta si nombra algo especifico de esa persona."
          lessons:
            - position: 1
              slug: este-mensaje-lo-ignoran-o-lo-contestan
              micro_objective: "Compara dos primeros mensajes de contacto y elige el que tiene más probabilidad de recibir respuesta por ser especifico."
              narrative_beat: "Liruf envia 'hola, compra mis gorras' a un desconocido; Zara envia 'vi que traes gorra todos los dias, hago diseños personalizados si te late uno' a alguien que si usa gorra seguido."
              difficulty: 3
              suggested_families: [choice, analyze]
            - position: 2
              slug: escribo-mi-primer-mensaje
              micro_objective: "Redacta, sin ayuda, un primer mensaje de contacto que nombra algo específico de un cliente potencial dado en un caso."
              narrative_beat: "Rho escribe su primer mensaje mencionando que vio a esa persona reparar su funda con cinta - una señal clara de que necesita una nueva."
              difficulty: 3
              suggested_families: [storyplay, choice]
        - position: 4
          slug: dejo-que-el-cliente-hable-de-su-problema-primero
          title_es: "Dejo que el cliente hable de su problema primero"
          concept: "Antes de describir tu producto, preguntar y escuchar el problema real de la otra persona te dice exactamente que parte de tu producto mencionar primero."
          learning_objective: "El aprendiz formula una pregunta que invita al cliente a describir su problema antes de presentar el producto."
          key_vocabulary: [pregunta primero, problema del cliente, antes de presentar]
          prior_knowledge: "Redacta un primer mensaje que sí contestan (tema anterior)."
          fact_refs: []
          parent_check: "Anima a {{name}} a preguntar por el problema del cliente antes de describir su producto en la próxima venta."
          lessons:
            - position: 1
              slug: hablo-de-mi-producto-o-pregunto-primero
              micro_objective: "Elige, entre dos formas de responder a un cliente interesado, la que pregunta primero por su problema en vez de listar caracteristicas."
              narrative_beat: "Dina, en vez de listar los 5 colores de su funda, pregunta '¿que es lo que más te molesta de tu funda actual?' antes de ofrecer nada."
              difficulty: 3
              suggested_families: [choice, story]
            - position: 2
              slug: formulo-mi-pregunta-de-descubrimiento
              micro_objective: "Formula, sin ayuda, una pregunta que invita a un cliente potencial a describir su problema antes de presentarle el producto."
              narrative_beat: "Zara pregunta '¿que buscas resolver con esto?' antes de mencionar una sola caracteristica de su servicio de tutoria."
              difficulty: 4
              suggested_families: [storyplay, choice]
        - position: 5
          slug: conecto-mi-producto-con-su-problema
          title_es: "Conecto mi producto con su problema"
          concept: "Una vez que conoces el problema real del cliente, mencionar solo la parte de tu producto que lo resuelve es más convincente que listar todo lo que ofreces."
          learning_objective: "El aprendiz conecta una característica específica de su producto con el problema exacto que un cliente describio."
          key_vocabulary: [conectar caracteristica y problema, especifico no general, más convincente]
          prior_knowledge: "Formula una pregunta de descubrimiento (tema anterior)."
          fact_refs: []
          parent_check: "Pregunta a {{name}} que parte especifica de su producto conecta mejor con el problema que su último cliente le describio."
          lessons:
            - position: 1
              slug: que-parte-de-mi-producto-le-sirve-a-el
              micro_objective: "Elige, entre 4 caracteristicas de un producto, la única que conecta directamente con el problema que un cliente describio."
              narrative_beat: "Un cliente le dice a Rho que su funda actual se raja en las esquinas; Rho elige mencionar el refuerzo de esquina, no los 5 colores disponibles."
              difficulty: 4
              suggested_families: [choice, analyze]
            - position: 2
              slug: presento-la-conexion-especifica
              micro_objective: "Redacta, sin ayuda, una frase que conecta una caracteristica de su producto con el problema especifico de un cliente dado."
              narrative_beat: "Liruf le dice a su cliente: 'esta funda tiene refuerzo justo en las esquinas, que es donde me dijiste que siempre se te rompe'."
              difficulty: 4
              suggested_families: [storyplay, choice]
        - position: 6
          slug: cierro-con-una-pregunta-no-con-presion
          title_es: "Cierro con una pregunta, no con presión"
          concept: "Cerrar una venta con una pregunta abierta (\"¿te gustaria empezar con este?\") deja al cliente decidir; cerrar con presión (\"tienes que decidir ya\") genera desconfianza."
          learning_objective: "El aprendiz cierra una conversación de venta con una pregunta que invita a decidir, sin usar presión."
          key_vocabulary: [cierre con pregunta, sin presión, invita a decidir]
          prior_knowledge: "Conecta una caracteristica de su producto con el problema del cliente (tema anterior)."
          fact_refs: []
          parent_check: "Pidele a {{name}} que te muestre como piensa cerrar su próxima venta, y confirma que sea con una pregunta, no con presión."
          lessons:
            - position: 1
              slug: este-cierre-presiona-o-invita
              micro_objective: "Elige, entre dos cierres de venta, cual invita a decidir con calma y cual presiona con miedo a perder la oportunidad."
              narrative_beat: "Zara compara 'si no decides hoy se acaba la oferta' contra 'te gustaria que empecemos con el diseño esta semana?' y elige la segunda."
              difficulty: 4
              suggested_families: [choice, analyze]
            - position: 2
              slug: cierro-mi-propia-conversacion
              micro_objective: "Redacta, sin ayuda, un cierre de venta con una pregunta abierta para un caso de venta dado."
              narrative_beat: "Dina cierra su conversación preguntando: '¿te gustaria que empezara con tu diseño esta semana o prefieres pensarlo unos dias?'"
              difficulty: 5
              suggested_families: [storyplay, choice]
        - position: 7
          slug: repaso-abro-la-conversacion-de-venta
          kind: review_spaced
          title_es: "Repaso: Abro la Conversación de Venta"
          concept: "El equipo repasa como describir un cliente ideal, preguntar por su problema primero, y cerrar con una pregunta en vez de presión."
          learning_objective: "El aprendiz recuerda y aplica, sin nueva enseñanza, los pasos de una conversación de venta honesta."
          key_vocabulary: [cliente ideal, pregunta primero, cierre sin presión]
          prior_knowledge: "Completo los 6 temas de Abro la Conversación de Venta."
          fact_refs: []
          review_of:
            - red-de-ventas/abro-la-conversacion-de-venta/vendo-o-ayudo-a-decidir
            - red-de-ventas/abro-la-conversacion-de-venta/identifico-mi-cliente-ideal
            - red-de-ventas/abro-la-conversacion-de-venta/el-primer-mensaje-que-si-contestan
            - red-de-ventas/abro-la-conversacion-de-venta/dejo-que-el-cliente-hable-de-su-problema-primero
            - red-de-ventas/abro-la-conversacion-de-venta/conecto-mi-producto-con-su-problema
            - red-de-ventas/abro-la-conversacion-de-venta/cierro-con-una-pregunta-no-con-presion
          lessons:
            - position: 1
              slug: repaso-formulo-una-pregunta-de-descubrimiento-nueva
              micro_objective: "Recuerda y aplica, sin ayuda, como formular una pregunta de descubrimiento para un cliente que todavia no había visto."
              narrative_beat: "El equipo formula, sin ayuda, una pregunta de descubrimiento para un cliente potencial de un servicio de edición de reels."
              difficulty: 3
              suggested_families: [storyplay, choice]
            - position: 2
              slug: repaso-cierro-sin-presion
              micro_objective: "Aplica sin ayuda todo lo repasado: cierra una conversación de venta nueva con una pregunta, sin usar presión."
              narrative_beat: "Rho cierra, sin ayuda de nadie, una venta nueva preguntando con calma si el cliente quiere empezar esta semana."
              difficulty: 4
              suggested_families: [choice, analyze]
        - position: 8
          slug: cruce-precio-defendido-y-conversacion-de-venta
          kind: review_interleaved
          title_es: "Cruce: Precio Defendido y Conversación de Venta"
          concept: "Mezclamos el precio final defendido en la aventura anterior con la conversación de venta honesta de esta saga."
          learning_objective: "El aprendiz combina, sin nueva enseñanza, un precio final defendido con una conversación de venta que conecta el producto con el problema del cliente."
          key_vocabulary: [precio defendido, conversación honesta, combinar]
          prior_knowledge: "Completo el repaso de Abro la Conversación de Venta (tema anterior) y La Feria del Precio Justo (aventura anterior)."
          fact_refs: []
          review_of:
            - red-de-ventas/abro-la-conversacion-de-venta/conecto-mi-producto-con-su-problema
            - precio-que-si-convence/la-feria-del-precio-justo/mi-precio-final-ante-el-consejo
          lessons:
            - position: 1
              slug: menciono-mi-precio-solo-despues-de-conectar
              micro_objective: "Decide, sin ayuda, el momento correcto para mencionar su precio final: despues de conectar el producto con el problema, no antes."
              narrative_beat: "Zara espera a conectar el refuerzo de esquina con el problema de su cliente antes de mencionar el precio de $95 que ya defendio ante el consejo."
              difficulty: 4
              suggested_families: [analyze, choice]
            - position: 2
              slug: explico-mi-precio-con-el-valor-ya-conectado
              micro_objective: "Redacta, sin ayuda, una frase que presenta el precio final defendido justo despues de conectar el producto con el problema del cliente."
              narrative_beat: "Rho le dice a su cliente: 'por eso esta funda con refuerzo de esquina cuesta $95, cubre justo lo que se te rompe a ti'."
              difficulty: 5
              suggested_families: [storyplay, choice]
  - position: 2
    slug: el-embudo-de-ventas
    icon: filter_alt
    title:
      en-US: "The Sales Funnel"
      es-MX: "El Embudo de Ventas"
      pt-BR: "O Funil de Vendas"
    description:
      en-US: "From the first person who hears about you to the one who actually buys - most people fall out along the way. Learn exactly where."
      es-MX: "Desde la primera persona que escucha de ti hasta la que de verdad compra - la mayoria se cae en el camino. Aprende exactamente donde."
      pt-BR: "Desde a primeira pessoa que ouve falar de voce ate quem realmente compra - a maioria cai pelo caminho. Aprenda exatamente onde."
    topics:
        - position: 1
          slug: que-es-un-embudo-de-ventas
          title_es: "Que es un embudo de ventas"
          concept: "Un embudo de ventas tiene varias etapas (conocen tu producto, lo consideran, deciden, compran) y en cada etapa se queda menos gente que en la anterior - como un embudo real."
          learning_objective: "El aprendiz nombra las 4 etapas de un embudo de ventas básico y explica por que cada etapa tiene menos personas que la anterior."
          key_vocabulary: [embudo de ventas, etapas, menos gente en cada etapa]
          prior_knowledge: "Completo Abro la Conversación de Venta (saga anterior): ya sabe abrir y cerrar una conversación de venta."
          fact_refs: []
          parent_check: "Pregunta a {{name}} cuantas personas conocen su producto, cuantas lo consideran, y cuantas de verdad compraron - los tres números casi nunca son iguales."
          lessons:
            - position: 1
              slug: por-que-se-queda-menos-gente-en-cada-etapa
              micro_objective: "Reconoce, en un caso, por que el número de personas se reduce en cada etapa del embudo de ventas."
              narrative_beat: "Dina explica: 'de 100 personas que vieron mi publicación, 30 preguntaron precio, y solo 8 compraron - cada etapa se queda con menos'."
              difficulty: 1
              suggested_families: [story, choice]
            - position: 2
              slug: ordeno-las-cuatro-etapas
              micro_objective: "Ordena, sin ayuda, las 4 etapas de un embudo de ventas de la más amplia a la más angosta."
              narrative_beat: "Zara ordena tarjetas: conocen, consideran, deciden, compran - de la etapa con más gente a la etapa con menos."
              difficulty: 2
              suggested_families: [arrange, analyze]
        - position: 2
          slug: cuantos-conocen-mi-producto
          title_es: "Cuantos conocen mi producto"
          concept: "La primera etapa del embudo mide cuanta gente siquiera sabe que tu producto existe - sin eso, ninguna otra etapa puede empezar."
          learning_objective: "El aprendiz mide o estima el alcance (cuanta gente conoce el producto) como la primera etapa medible de un embudo de ventas."
          key_vocabulary: [alcance, primera etapa, saber que existe]
          prior_knowledge: "Nombra las 4 etapas de un embudo de ventas (tema anterior)."
          fact_refs: []
          parent_check: "Pregunta a {{name}} cuanta gente calcula que ya sabe que su producto existe, aunque no lo haya comprado."
          lessons:
            - position: 1
              slug: cuenta-el-alcance-de-esta-semana
              micro_objective: "Suma, sin ayuda, cuantas personas distintas conocieron un producto esta semana a partir de 3 fuentes distintas (redes, boca a boca, puesto)."
              narrative_beat: "Liruf suma 40 vistas en redes, 15 personas que le contaron sus amigos y 10 que pasaron por su puesto: 65 personas conocieron su producto esta semana."
              difficulty: 2
              suggested_families: [input, analyze]
            - position: 2
              slug: mi-alcance-subio-o-bajo
              micro_objective: "Compara el alcance de dos semanas distintas y reconoce si subio o bajo, y una posible razón."
              narrative_beat: "Rho compara su alcance de 65 personas esta semana contra 40 la semana pasada, y nota que subio justo cuando público una foto nueva de su producto."
              difficulty: 3
              suggested_families: [analyze, choice]
        - position: 3
          slug: cuantos-de-verdad-lo-consideran
          title_es: "Cuantos de verdad lo consideran"
          concept: "Considerar un producto es más que verlo una vez: es cuando alguien pregunta el precio, pide más información o lo guarda para pensarlo."
          learning_objective: "El aprendiz identifica señales concretas de que un cliente potencial ya esta considerando el producto, más alla de solo haberlo visto."
          key_vocabulary: [consideración, señal concreta, más que ver una vez]
          prior_knowledge: "Mide el alcance de su producto (tema anterior)."
          fact_refs: []
          parent_check: "Pregunta a {{name}} cuantas personas, de las que conocieron su producto esta semana, dieron una señal real de estar considerandolo."
          lessons:
            - position: 1
              slug: esto-es-consideracion-o-solo-vio-la-foto
              micro_objective: "Distingue, entre 4 reacciones de clientes potenciales, cuales cuentan como consideración real y cuales son solo haber visto el producto."
              narrative_beat: "Zara cuenta como consideración a quien pregunto el precio y a quien pidio una foto extra, pero no a quien solo le dio 'me gusta' sin decir nada más."
              difficulty: 3
              suggested_families: [choice, analyze]
            - position: 2
              slug: cuento-mis-consideraciones-reales
              micro_objective: "Cuenta, sin ayuda, cuantas personas de un grupo de 20 dieron una señal real de consideración esta semana."
              narrative_beat: "Dina revisa sus 20 mensajes de esta semana y cuenta 7 que preguntaron precio o pidieron más detalles - esas son consideraciones reales."
              difficulty: 3
              suggested_families: [analyze, input]
        - position: 4
          slug: la-tasa-de-conversion
          title_es: "La tasa de conversión"
          concept: "La tasa de conversión es cuantas de las personas que consideran tu producto terminan comprandolo, expresada como porcentaje - te dice que tan bien cierras."
          learning_objective: "El aprendiz calcula la tasa de conversión dividiendo el número de compradores entre el número de personas que consideraron el producto."
          key_vocabulary: [tasa de conversión, compradores entre consideraciones, que tan bien cierras]
          prior_knowledge: "Identifica señales reales de consideración (tema anterior)."
          fact_refs: []
          parent_check: "Pidele a {{name}} que calcule su tasa de conversión: de la gente que de verdad considero su producto, cuantos compraron."
          lessons:
            - position: 1
              slug: calculo-mi-tasa-de-conversion
              micro_objective: "Calcula, sin ayuda, la tasa de conversión de 3 compras sobre 12 consideraciones reales, llegando a 25%."
              narrative_beat: "Rho divide sus 3 ventas de la semana entre las 12 personas que de verdad consideraron su producto y llega a una tasa de conversión del 25%."
              difficulty: 3
              suggested_families: [input, analyze]
            - position: 2
              slug: comparo-mi-tasa-con-la-semana-pasada
              micro_objective: "Compara la tasa de conversión de dos semanas distintas y reconoce cual semana convirtio mejor, no solo cual vendio más en total."
              narrative_beat: "Liruf vendio más piezas la semana pasada, pero su tasa de conversión de esta semana es más alta - convirtio mejor con menos gente."
              difficulty: 4
              suggested_families: [analyze, choice]
        - position: 5
          slug: donde-se-me-escapan-los-clientes
          title_es: "Donde se me escapan los clientes"
          concept: "Comparar el número de personas en cada etapa del embudo revela en cual etapa especifica se pierde más gente - ahí es donde hay que enfocar el esfuerzo."
          learning_objective: "El aprendiz identifica, comparando las etapas de un embudo, en cual etapa especifica se pierde el mayor porcentaje de clientes potenciales."
          key_vocabulary: [se escapan los clientes, etapa con más fuga, enfocar el esfuerzo]
          prior_knowledge: "Calcula y compara su tasa de conversión (tema anterior)."
          fact_refs: []
          parent_check: "Ayuda a {{name}} a revisar en cual etapa de su embudo se le escapa más gente: al conocerlo, al considerarlo, o al decidir comprar."
          lessons:
            - position: 1
              slug: en-que-etapa-se-pierden-mas
              micro_objective: "Identifica, en un embudo de 4 etapas con números dados, en cual etapa especifica se pierde el mayor porcentaje de personas."
              narrative_beat: "Zara revisa su embudo: de 65 que la conocen, 20 consideran (pierde 69%); de esos 20, 5 compran (pierde 75%) - la etapa de decisión es donde más se le escapan."
              difficulty: 4
              suggested_families: [analyze, choice]
            - position: 2
              slug: nombro-la-etapa-que-mas-fuga
              micro_objective: "Nombra, sin ayuda, la etapa exacta de su propio embudo donde se le escapa más gente, con el porcentaje de fuga."
