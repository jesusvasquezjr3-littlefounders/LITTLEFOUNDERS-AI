              slug: guardo-la-informacion-solo-para-lo-necesario
              micro_objective: "Decide, sin ayuda, que información de un cliente es necesaria guardar para un pedido y cual no tiene por que pedir ni guardar."
              narrative_beat: "Zara guarda solo el nombre y la dirección de entrega que necesita para el pedido, y no pide ni guarda información que no tiene relación con la venta."
              difficulty: 4
              suggested_families: [choice, analyze]
        - position: 4
          slug: reconozco-un-conflicto-de-interes
          title_es: "Reconozco un conflicto de interes"
          concept: "Un conflicto de interes pasa cuando una decisión de negocio se ve influida por un beneficio personal (favorecer a un amigo en una compra grupal) en vez de por lo que es mejor para todos."
          learning_objective: "El aprendiz identifica un conflicto de interes en una decisión de negocio, donde el beneficio personal choca con lo que es mejor para el equipo o los clientes."
