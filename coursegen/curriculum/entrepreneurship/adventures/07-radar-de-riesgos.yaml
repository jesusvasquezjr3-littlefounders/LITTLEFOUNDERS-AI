schema_version: 1

adventure:
  position: 7
  slug: radar-de-riesgos
  theme: city
  age_tier: tier4
  title:
    en-US: "Risk Radar"
    es-MX: "Radar de Riesgos"
    pt-BR: "Radar de Riscos"
  description:
    en-US: "In the Red Flags District, the crew learns to spot a bad deal before signing it, protect a reputation that takes years to build and seconds to damage, read a contract for real, and hold a personal line on business ethics - never evading real laws, always asking a trusted adult when a deal is bigger than they are."
    es-MX: "En el Distrito de las Señales Rojas, el equipo aprende a detectar un mal trato antes de firmarlo, proteger una reputación que tarda años en construirse y segundos en dañarse, leer un contrato de verdad, y sostener una linea personal de ética de negocio - nunca evadiendo leyes reales, siempre pidiendo ayuda a un adulto de confianza cuando un trato les queda grande."
    pt-BR: "No Distrito das Bandeiras Vermelhas, a equipe aprende a identificar um mau negocio antes de assina-lo, proteger uma reputação que leva anos para construir e segundos para danificar, ler um contrato de verdade, e manter uma linha pessoal de etica de negocio - nunca evadindo leis reais, sempre pedindo ajuda a um adulto de confianca quando um negocio fica grande demais."
  narrative_arc: "Con un equipo que ya sabe liderar mientras crece, Dina, Liruf, Rho y Zara entran al Distrito de las Señales Rojas, donde cada calle esconde tratos, contratos y reputaciones en juego. Ahí aprenden a reconocer las señales que anuncian un mal trato antes de aceptarlo, a entender que su reputación es el activo más difícil de reconstruir si se daña, a leer un acuerdo de verdad antes de firmarlo y a saber cuando un trato ya es demasiado grande para decidirlo solos, sin un adulto de confianza. También construyen, dia a dia, un código propio de ética de negocio: tratar igual a todos, no exagerar lo que venden, proteger la información que les confian y negarse con calma cuando alguien les pide hacer algo que no esta bien. Al final, cada equipo enfrenta al Tribunal de Confianza del distrito con un caso completo: tratos sospechosos detectados a tiempo y un código ético que de verdad sostienen."

sagas:
  - position: 1
    slug: senales-de-alerta-en-un-trato
    icon: flag
    title:
      en-US: "Warning Signs in a Deal"
      es-MX: "Señales de Alerta en un Trato"
      pt-BR: "Sinais de Alerta em um Negocio"
    description:
      en-US: "A bad deal rarely announces itself - it hides behind signs you can learn to read before it is too late."
      es-MX: "Un mal trato rara vez se anuncia solo - se esconde detras de señales que puedes aprender a leer antes de que sea tarde."
      pt-BR: "Um mau negocio raramente se anuncia sozinho - se esconde atras de sinais que voce pode aprender a ler antes que seja tarde."
    topics:
        - position: 1
          slug: si-suena-demasiado-bueno-para-ser-verdad
          title_es: "Si suena demasiado bueno para ser verdad"
          concept: "Una oferta que promete mucho más de lo normal (el doble de ganancia, sin ningun esfuerzo, garantizado) casi siempre esconde un riesgo que no se menciona - la desconfianza sana empieza ahí."
          learning_objective: "El aprendiz reconoce, en una oferta de negocio, una promesa exagerada que no coincide con lo normal del mercado y que merece desconfianza."
          key_vocabulary: [promesa exagerada, desconfianza sana, no coincide con lo normal]
          prior_knowledge: "Completo Equipo que Escala (aventura anterior): ya sabe liderar un equipo que crece."
          fact_refs: []
          parent_check: "Pregunta a {{name}} si alguna vez vio una oferta de negocio que sonaba demasiado buena para ser verdad, y como se dio cuenta."
          lessons:
            - position: 1
              slug: esta-oferta-suena-normal-o-exagerada
              micro_objective: "Compara dos ofertas de negocio y reconoce cual promete resultados razonables y cual promete algo exagerado, sin esfuerzo ni riesgo."
              narrative_beat: "Alguien le ofrece a Liruf triplicar su dinero en una semana 'sin hacer nada'; Rho le recuerda que ningun negocio real garantiza eso sin ningun riesgo."
              difficulty: 1
              suggested_families: [choice, analyze]
            - position: 2
              slug: explico-por-que-desconfio-de-esta-oferta
              micro_objective: "Explica, sin ayuda, por que una oferta de negocio dada merece desconfianza por prometer resultados fuera de lo normal."
              narrative_beat: "Zara explica: 'ningun negocio de verdad promete ganancia garantizada sin ningun riesgo - eso ya es la primera señal de alerta'."
              difficulty: 2
              suggested_families: [storyplay, choice]
        - position: 2
          slug: quien-no-quiere-poner-nada-por-escrito
          title_es: "Quien no quiere poner nada por escrito"
          concept: "Alguien que evita poner los términos de un trato por escrito, o cambia de tema cuando se lo pides, esta dejando espacio para negar despues lo que prometio de palabra."
          learning_objective: "El aprendiz reconoce, en una interacción, cuando la otra parte evita poner un trato por escrito como una señal de alerta."
          key_vocabulary: [evitar el escrito, negar despues, señal de alerta]
          prior_knowledge: "Reconoce una promesa exagerada (tema anterior)."
          fact_refs: []
          parent_check: "Pregunta a {{name}} que haria si alguien con quien va a hacer un trato se niega a poner las condiciones por escrito."
          lessons:
            - position: 1
              slug: cambia-de-tema-cuando-pido-por-escrito
              micro_objective: "Reconoce, en un caso, cuando alguien evita repetidamente poner un acuerdo por escrito, cambiando de tema cada vez que se le pide."
              narrative_beat: "Rho le pide tres veces a un posible socio que confirme los términos por mensaje, y las tres veces la persona responde 'no te preocupes, confia en mi' sin escribir nada."
              difficulty: 2
              suggested_families: [story, choice]
            - position: 2
              slug: insisto-en-tenerlo-por-escrito
              micro_objective: "Redacta, sin ayuda, una respuesta firme pero respetuosa que insiste en confirmar un trato por escrito antes de continuar."
              narrative_beat: "Dina responde: 'confio en ti, y justo por eso prefiero que lo confirmemos por escrito, asi los dos recordamos lo mismo despues'."
              difficulty: 3
              suggested_families: [storyplay, choice]
        - position: 3
          slug: me-piden-pagar-antes-de-ver-nada
          title_es: "Me piden pagar antes de ver nada"
          concept: "Que te pidan pagar el total por adelantado, sin ninguna prueba de que la otra parte va a cumplir, es un riesgo distinto a un anticipo razonable acordado por ambas partes."
          learning_objective: "El aprendiz distingue un anticipo razonable acordado de una petición de pago total por adelantado sin ninguna garantía."
          key_vocabulary: [anticipo razonable, pago total adelantado, sin garantía]
          prior_knowledge: "Reconoce cuando alguien evita poner un trato por escrito (tema anterior)."
          fact_refs: []
          parent_check: "Pregunta a {{name}} si alguna vez le pidieron pagar todo por adelantado sin ninguna prueba de que iban a cumplir."
          lessons:
            - position: 1
              slug: esto-es-un-anticipo-razonable-o-una-senal-de-alerta
              micro_objective: "Distingue, entre dos peticiones de pago, cual es un anticipo razonable acordado y cual es una señal de alerta por pedir el 100% sin garantía."
              narrative_beat: "Un cliente le pide a Liruf un anticipo del 30% para empezar su pedido, algo normal; alguien más le pide a Zara el 100% por adelantado por un servicio que nunca ha visto antes."
              difficulty: 3
              suggested_families: [choice, analyze]
            - position: 2
              slug: propongo-un-anticipo-razonable-en-vez-del-total
              micro_objective: "Propone, sin ayuda, un acuerdo de anticipo razonable como alternativa a una petición de pago total adelantado."
              narrative_beat: "Rho responde: 'no puedo pagar el 100% sin ver nada, pero si puedo dar un anticipo del 30% para empezar, y el resto contra entrega'."
              difficulty: 3
              suggested_families: [storyplay, choice]
        - position: 4
          slug: cambia-los-terminos-a-mitad-del-trato
          title_es: "Cambia los términos a mitad del trato"
          concept: "Cuando alguien cambia el precio, la fecha o las condiciones ya acordadas a mitad del proceso, sin una razón real, es una señal de que ese trato no se puede sostener con confianza."
          learning_objective: "El aprendiz reconoce, en un caso, cuando alguien cambia los términos de un trato ya acordado sin una razón valida."
          key_vocabulary: [cambio de términos, sin razón valida, no se sostiene]
          prior_knowledge: "Distingue un anticipo razonable de una petición sin garantía (tema anterior)."
          fact_refs: []
          parent_check: "Pregunta a {{name}} si alguna vez alguien cambio los términos de un trato despues de que ya lo habian acordado, y como reacciono."
          lessons:
            - position: 1
              slug: cambio-el-trato-con-razon-o-sin-ella
              micro_objective: "Distingue, entre dos casos, un cambio de términos con una razón real explicada y un cambio sin ninguna razón valida."
              narrative_beat: "Un proveedor le explica a Dina que el precio subio porque el material subio de costo, con pruebas; otro cliente simplemente le dice 'ya no te pago lo acordado' sin ninguna razón."
              difficulty: 3
              suggested_families: [choice, analyze]
            - position: 2
              slug: respondo-a-un-cambio-de-terminos-sin-razon
              micro_objective: "Redacta, sin ayuda, una respuesta firme ante un cambio de términos sin razón valida, recordando lo acordado por escrito."
              narrative_beat: "Zara responde: 'lo que acordamos por escrito fue $95, no puedo aceptar el cambio sin una razón clara' cuando un cliente intenta bajar el precio a mitad del trabajo."
              difficulty: 4
              suggested_families: [storyplay, choice]
        - position: 5
          slug: presiona-para-que-decida-ya-mismo
          title_es: "Presiona para que decida ya mismo"
          concept: "Alguien que no te deja tiempo para pensar, revisar o preguntar antes de decidir un trato importante esta usando la prisa para que no notes una señal de alerta."
          learning_objective: "El aprendiz reconoce cuando la presión para decidir de inmediato, sin tiempo de revisar, es en si misma una señal de alerta."
          key_vocabulary: [presión para decidir, sin tiempo de revisar, señal de alerta]
          prior_knowledge: "Reconoce un cambio de términos sin razón valida (tema anterior)."
          fact_refs: []
          parent_check: "Pregunta a {{name}} si alguna vez sintio presión para decidir un trato de inmediato, sin tiempo de pensarlo, y por que eso debería hacerle dudar."
          lessons:
            - position: 1
              slug: me-dan-tiempo-o-me-presionan-a-decidir-ya
              micro_objective: "Reconoce, en un caso, cuando alguien presiona a decidir de inmediato un trato importante, sin dar tiempo real para pensarlo."
              narrative_beat: "Alguien le dice a Rho 'firmalo ahora mismo o se cancela la oferta' sobre un trato que apenas esta conociendo - esa prisa es en si misma una señal de alerta."
              difficulty: 4
              suggested_families: [story, choice]
            - position: 2
              slug: pido-tiempo-antes-de-decidir
              micro_objective: "Redacta, sin ayuda, una respuesta que pide tiempo razonable antes de decidir un trato bajo presión."
              narrative_beat: "Liruf responde: 'necesito al menos un dia para revisarlo con calma antes de decidir, si el trato es real puede esperar eso'."
              difficulty: 4
              suggested_families: [storyplay, choice]
        - position: 6
          slug: mi-lista-personal-de-senales-de-alerta
          title_es: "Mi lista personal de señales de alerta"
          concept: "Reunir por escrito las señales de alerta ya identificadas (promesa exagerada, evita lo escrito, pide todo adelantado, cambia términos, presiona a decidir ya) te da una lista rápida de revisar antes de cualquier trato nuevo."
          learning_objective: "El aprendiz redacta una lista personal de al menos 4 señales de alerta para revisar antes de aceptar cualquier trato nuevo."
          key_vocabulary: [lista personal, revisar antes de aceptar, señales reunidas]
          prior_knowledge: "Reconoce la presión para decidir de inmediato (tema anterior)."
          fact_refs: []
          parent_check: "Pidele a {{name}} que te lea su lista personal de señales de alerta antes de aceptar cualquier trato nuevo."
          lessons:
            - position: 1
              slug: reviso-las-cinco-senales-aprendidas
              micro_objective: "Reune, sin ayuda, las 5 señales de alerta aprendidas en esta saga en una sola lista ordenada."
              narrative_beat: "Zara ordena en tarjetas las cinco señales que aprendio: promesa exagerada, evita lo escrito, pide todo adelantado, cambia términos sin razón, y presiona a decidir ya."
              difficulty: 4
              suggested_families: [arrange, analyze]
            - position: 2
              slug: escribo-mi-lista-personal-completa
              micro_objective: "Redacta, sin ayuda, su propia lista personal de señales de alerta para revisar antes de cualquier trato nuevo."
              narrative_beat: "Dina guarda su lista de cinco señales en su libreta, para revisarla cada vez que alguien le proponga un trato nuevo antes de decidir."
              difficulty: 5
              suggested_families: [storyplay, input]
        - position: 7
          slug: repaso-senales-de-alerta-en-un-trato
          kind: review_spaced
          title_es: "Repaso: Señales de Alerta en un Trato"
          concept: "El equipo repasa como reconocer una promesa exagerada, la falta de un acuerdo escrito, un pago adelantado riesgoso y la presión para decidir ya."
          learning_objective: "El aprendiz recuerda y aplica, sin nueva enseñanza, la detección de señales de alerta en un trato nuevo."
          key_vocabulary: [señal de alerta, trato riesgoso, detectar a tiempo]
          prior_knowledge: "Completo los 6 temas de Señales de Alerta en un Trato."
          fact_refs: []
          review_of:
            - radar-de-riesgos/senales-de-alerta-en-un-trato/si-suena-demasiado-bueno-para-ser-verdad
            - radar-de-riesgos/senales-de-alerta-en-un-trato/quien-no-quiere-poner-nada-por-escrito
            - radar-de-riesgos/senales-de-alerta-en-un-trato/me-piden-pagar-antes-de-ver-nada
            - radar-de-riesgos/senales-de-alerta-en-un-trato/cambia-los-terminos-a-mitad-del-trato
            - radar-de-riesgos/senales-de-alerta-en-un-trato/presiona-para-que-decida-ya-mismo
            - radar-de-riesgos/senales-de-alerta-en-un-trato/mi-lista-personal-de-senales-de-alerta
          lessons:
            - position: 1
              slug: repaso-detecto-una-promesa-exagerada-nueva
              micro_objective: "Recuerda y aplica, sin ayuda, la detección de una promesa exagerada en un trato que todavia no había visto."
              narrative_beat: "El equipo detecta, sin ayuda, una promesa exagerada en una oferta nueva de un supuesto negocio de reventa de boletos."
              difficulty: 3
              suggested_families: [choice, analyze]
            - position: 2
              slug: repaso-aplico-mi-lista-completa-a-un-caso-nuevo
              micro_objective: "Aplica sin ayuda todo lo repasado: revisa un trato nuevo completo contra su lista personal de señales de alerta."
              narrative_beat: "Rho revisa, sin ayuda de nadie, un trato nuevo contra su lista completa de cinco señales antes de decidir si aceptarlo."
              difficulty: 4
              suggested_families: [analyze, choice]
        - position: 8
          slug: cruce-persuasion-etica-y-senales-de-alerta
          kind: review_interleaved
          title_es: "Cruce: Persuasión Etica y Señales de Alerta"
          concept: "Mezclamos la persuasión ética aprendida en Red de Ventas con las señales de alerta de esta saga: reconocer la manipulación desde el otro lado del trato."
          learning_objective: "El aprendiz combina, sin nueva enseñanza, el reconocimiento de manipulación con la detección de señales de alerta al recibir una oferta, no solo al hacerla."
          key_vocabulary: [manipulación, señal de alerta, desde el otro lado]
          prior_knowledge: "Completo el repaso de Señales de Alerta en un Trato (tema anterior) y Persuasión Etica (aventura anterior)."
          fact_refs: []
          review_of:
            - radar-de-riesgos/senales-de-alerta-en-un-trato/presiona-para-que-decida-ya-mismo
            - red-de-ventas/persuasion-etica/la-urgencia-real-y-la-urgencia-falsa
          lessons:
            - position: 1
              slug: esta-urgencia-que-me-venden-es-real-o-falsa
              micro_objective: "Aplica, sin ayuda, la técnica de distinguir urgencia real de urgencia falsa para evaluar una oferta que le estan presionando a aceptar."
              narrative_beat: "Zara reconoce que la 'oferta que se acaba en 10 minutos' que le ofrecen es la misma urgencia falsa que aprendio a identificar cuando vendia - ahora la reconoce recibiendola."
              difficulty: 4
              suggested_families: [analyze, choice]
            - position: 2
              slug: rechazo-la-presion-usando-lo-que-ya-se
              micro_objective: "Redacta, sin ayuda, una respuesta que rechaza una presión de decisión inmediata, nombrando la técnica de manipulación reconocida."
              narrative_beat: "Rho responde: 'una oferta real no necesita que decida en 10 minutos - me voy a tomar el tiempo que de verdad necesito' ante una presión que reconoce como manipuladora."
              difficulty: 5
              suggested_families: [storyplay, analyze]
  - position: 2
    slug: mi-reputacion-es-un-activo
    icon: shield
    title:
      en-US: "My Reputation Is An Asset"
      es-MX: "Mi Reputación es un Activo"
      pt-BR: "Minha Reputação e um Ativo"
    description:
      en-US: "Reputation takes years to build and seconds to damage - protect it like the real asset it is."
      es-MX: "La reputación tarda años en construirse y segundos en dañarse - protegela como el activo real que es."
      pt-BR: "A reputação leva anos para se construir e segundos para se danificar - proteja-a como o ativo real que e."
    topics:
        - position: 1
          slug: que-es-la-reputacion-de-verdad
          title_es: "Que es la reputación de verdad"
          concept: "La reputación es la confianza acumulada que la gente tiene en ti a partir de tratos anteriores - no es lo que dices de ti mismo, es lo que otros dicen de ti cuando no estas presente."
          learning_objective: "El aprendiz explica que la reputación se construye con confianza acumulada de tratos anteriores, no con lo que uno mismo dice de si."
          key_vocabulary: [reputación, confianza acumulada, lo que dicen cuando no estas]
          prior_knowledge: "Completo Señales de Alerta en un Trato (saga anterior): ya sabe detectar un mal trato."
          fact_refs: []
          parent_check: "Pregunta a {{name}} que cree que dirian de el o ella las últimas 3 personas con las que hizo un trato, si no estuviera presente para escucharlo."
          lessons:
            - position: 1
              slug: mi-reputacion-la-hago-yo-o-la-hacen-los-demas
              micro_objective: "Reconoce, en un caso, que la reputación de un negocio la construyen las experiencias reales de los clientes, no lo que el negocio dice de si mismo."
              narrative_beat: "Liruf dice en su anuncio 'el mejor servicio de la ciudad', pero su reputación real la esta construyendo cada cliente que cuenta como le fue de verdad."
              difficulty: 1
              suggested_families: [choice, analyze]
            - position: 2
              slug: describo-mi-reputacion-actual
              micro_objective: "Describe, sin ayuda, la reputación actual de su propio negocio a partir de lo que sus últimos clientes han dicho de verdad."
              narrative_beat: "Zara describe su reputación actual citando lo que 3 clientas distintas le dijeron sobre su puntualidad y la calidad de su bordado."
              difficulty: 2
              suggested_families: [storyplay, choice]
        - position: 2
          slug: una-mala-resena-cuesta-mas-que-una-venta-perdida
          title_es: "Una mala reseña cuesta más que una venta perdida"
          concept: "Una venta perdida afecta a un solo cliente; una mala reseña puede alejar a docenas de clientes que nunca conociste - el costo real de una mala experiencia es mucho más grande que esa sola venta."
          learning_objective: "El aprendiz compara el costo de una venta perdida contra el costo potencial de una mala reseña pública y reconoce cual es mayor a largo plazo."
          key_vocabulary: [venta perdida, mala reseña, costo a largo plazo]
          prior_knowledge: "Explica que es la reputación de verdad (tema anterior)."
          fact_refs: []
          parent_check: "Pregunta a {{name}} si alguna vez penso que era peor perder una sola venta que recibir una mala reseña publica, y por que."
          lessons:
            - position: 1
              slug: que-cuesta-mas-una-venta-o-una-mala-resena
              micro_objective: "Compara dos escenarios y reconoce cual tiene un costo mayor para el negocio: perder una venta o recibir una mala reseña que otros ven."
              narrative_beat: "Rho pierde una venta por no tener el color exacto que un cliente pedia; en otro caso, entrega un pedido de mala calidad y recibe una reseña que 40 personas más leen antes de comprar."
              difficulty: 2
              suggested_families: [choice, analyze]
            - position: 2
              slug: decido-priorizar-la-experiencia-sobre-la-venta-rapida
              micro_objective: "Decide, sin ayuda, priorizar una buena experiencia de cliente aunque signifique perder una venta rápida, para proteger la reputación a largo plazo."
              narrative_beat: "Dina decide no vender un producto con un defecto visible, aunque pierda esa venta, porque sabe que una mala reseña le costaria mucho más despues."
              difficulty: 3
              suggested_families: [choice, analyze]
        - position: 3
          slug: como-respondo-a-una-critica-publica
          title_es: "Como respondo a una crítica publica"
          concept: "Responder a una crítica publica con calma, reconociendo lo que paso y ofreciendo arreglarlo, protege la reputación mucho mejor que responder a la defensiva o ignorarla."
          learning_objective: "El aprendiz redacta una respuesta calmada y constructiva a una crítica publica, reconociendo el problema en vez de defenderse o ignorarlo."
          key_vocabulary: [respuesta calmada, reconocer el problema, defensiva]
          prior_knowledge: "Compara el costo de una venta perdida contra una mala reseña (tema anterior)."
          fact_refs: []
          parent_check: "Pregunta a {{name}} como respondio, o como responderia, a una crítica publica sobre su producto o servicio."
          lessons:
            - position: 1
              slug: esta-respuesta-ayuda-o-empeora-la-situacion
              micro_objective: "Compara dos respuestas a una misma crítica publica y elige la que reconoce el problema con calma en vez de ponerse a la defensiva."
              narrative_beat: "Liruf responde a una crítica publica diciendo 'tu nunca sabes usarlo bien'; Zara en cambio responde 'lamento que no cumplio lo que esperabas, cuentame que paso para arreglarlo'."
              difficulty: 3
              suggested_families: [choice, analyze]
            - position: 2
              slug: redacto-mi-respuesta-a-una-critica-publica
              micro_objective: "Redacta, sin ayuda, una respuesta calmada y constructiva a una crítica publica dada en un caso."
              narrative_beat: "Rho responde publicamente: 'gracias por decirmelo, el bordado no debio salir torcido - te contacto por privado para arreglarlo sin costo'."
              difficulty: 3
              suggested_families: [storyplay, choice]
        - position: 4
          slug: cuido-mi-reputacion-en-lo-que-publico
          title_es: "Cuido mi reputación en lo que público"
          concept: "Lo que publicas en redes, aunque sea sobre tu vida personal, también lo ve la gente que podría ser tu cliente - cuidar esa imagen es parte de cuidar la reputación del negocio."
          learning_objective: "El aprendiz reconoce como una publicación personal puede afectar la reputación de su negocio, aunque no hable directamente de el."
          key_vocabulary: [imagen personal y del negocio, lo que ven los clientes, afecta la reputación]
          prior_knowledge: "Redacta una respuesta a una crítica publica (tema anterior)."
          fact_refs: []
          parent_check: "Pregunta a {{name}} si lo que publica en redes, aunque sea personal, podría afectar como lo ven sus clientes."
          lessons:
            - position: 1
              slug: esta-publicacion-afecta-mi-reputacion-de-negocio-o-no
