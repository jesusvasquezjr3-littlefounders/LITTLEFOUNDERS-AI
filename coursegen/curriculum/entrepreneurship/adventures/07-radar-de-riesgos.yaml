  - position: 4
    slug: etica-en-el-dia-a-dia-del-negocio
    icon: balance
    title:
      en-US: "Ethics In The Everyday Of Business"
      es-MX: "Ética en el Día a Día del Negocio"
      pt-BR: "Etica no Dia a Dia do Negocio"
    description:
      en-US: "Fair treatment, honest claims and protecting private information are not extra rules - they are the everyday practice of a business worth trusting."
      es-MX: "Trato justo, promesas honestas y proteger la información privada no son reglas extra - son la práctica diaria de un negocio que vale la pena confiar."
      pt-BR: "Tratamento justo, promessas honestas e proteger informações privadas nao sao regras extras - sao a pratica diaria de um negocio que vale a pena confiar."
    topics:
        - position: 1
          slug: trato-igual-a-todos-mis-clientes
          title_es: "Trato igual a todos mis clientes"
          concept: "Ofrecer un mejor precio o servicio a un amigo, y uno peor a un desconocido con la misma petición, no es lealtad - es un favoritismo que, si se descubre, daña la confianza de todos."
          learning_objective: "El aprendiz reconoce un caso de trato desigual entre clientes por favoritismo y propone un trato consistente para situaciones equivalentes."
          key_vocabulary: [trato igual, favoritismo, situaciones equivalentes]
          prior_knowledge: "Completo Lo que Sí y lo que No en un Contrato (saga anterior): ya sabe leer y negociar un acuerdo con cuidado."
          fact_refs: []
          parent_check: "Pregunta a {{name}} si trata igual a un amigo y a un desconocido cuando piden lo mismo a su negocio."
          lessons:
            - position: 1
              slug: esto-es-favoritismo-o-trato-justo
              micro_objective: "Reconoce, en un caso, cuando un negocio esta dando un trato desigual por favoritismo entre dos clientes con la misma petición."
              narrative_beat: "Liruf le da un descuento grande a su mejor amigo mientras cobra el precio completo a un desconocido por el mismo pedido - ese es favoritismo, no una regla clara."
              difficulty: 1
              suggested_families: [choice, analyze]
            - position: 2
              slug: propongo-una-regla-de-trato-consistente
              micro_objective: "Propone, sin ayuda, una regla de trato consistente (por ejemplo, un descuento solo por volumen, no por amistad) para aplicar igual a todos los clientes."
              narrative_beat: "Zara decide que su descuento solo aplica cuando alguien compra 3 o más piezas, sea amigo o desconocido - una regla igual para todos."
              difficulty: 2
              suggested_families: [storyplay, choice]
        - position: 2
          slug: no-exagero-lo-que-mi-producto-hace
          title_es: "No exagero lo que mi producto hace"
          concept: "Prometer algo que tu producto no hace de verdad (que dura para siempre, que resuelve todo) puede ganar una venta hoy, pero cuando el cliente lo descubre, pierde algo mucho más grande: la confianza y la reputación."
          learning_objective: "El aprendiz identifica una afirmación exagerada sobre un producto y la reformula en una descripción precisa y verificable."
          key_vocabulary: [afirmación exagerada, descripción precisa, verificable]
          prior_knowledge: "Propone una regla de trato consistente (tema anterior)."
          fact_refs: []
          parent_check: "Revisa junto a {{name}} lo que dice sobre su producto y confirma que cada afirmación sea algo que de verdad puede demostrar."
          lessons:
            - position: 1
              slug: esta-afirmacion-la-puedo-demostrar
              micro_objective: "Reconoce, entre 3 afirmaciones sobre un producto, cual es exagerada y no se puede demostrar, y cual es precisa y verificable."
              narrative_beat: "Rho revisa su anuncio: 'resistente al agua' lo puede demostrar con una prueba real; 'indestructible' no lo puede demostrar de ninguna forma."
              difficulty: 2
              suggested_families: [choice, analyze]
            - position: 2
              slug: reformulo-mi-afirmacion-exagerada
              micro_objective: "Reformula, sin ayuda, una afirmación exagerada sobre un producto en una descripción precisa y verificable."
              narrative_beat: "Dina cambia 'nunca se va a romper' por 'probada durante 3 meses de uso diario sin romperse' en la descripción de su producto."
              difficulty: 3
              suggested_families: [storyplay, choice]
        - position: 3
          slug: protejo-la-informacion-que-me-comparten
          title_es: "Protejo la información que me comparten"
          concept: "Los datos que un cliente comparte para hacer un pedido (su dirección, su número, su nombre) son suyos, no tuyos para usar en otra cosa o compartir sin permiso."
          learning_objective: "El aprendiz reconoce un uso indebido de información personal de un cliente y propone la práctica correcta de manejo de esa información."
          key_vocabulary: [información personal, uso indebido, sin permiso]
          prior_knowledge: "Reformula una afirmación exagerada (tema anterior)."
          fact_refs: []
          parent_check: "Pregunta a {{name}} que hace con la información personal (número, dirección) que sus clientes le comparten para un pedido."
