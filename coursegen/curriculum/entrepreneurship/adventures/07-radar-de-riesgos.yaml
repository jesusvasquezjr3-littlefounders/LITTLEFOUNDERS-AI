          prior_knowledge: "Reconoce un uso correcto o indebido de información (tema anterior)."
          fact_refs: []
          parent_check: "Pregunta a {{name}} si alguna vez tuvo que decidir algo donde su interes personal chocaba con lo mejor para el equipo o los clientes."
          lessons:
