          title_es: "Que hago si alguien me pide algo que no esta bien"
          concept: "Cuando un cliente, socio o incluso un amigo pide algo que no esta bien (mentir sobre un producto, saltarse un acuerdo, compartir información privada), decir que no con calma protege tanto tu ética como tu negocio."
