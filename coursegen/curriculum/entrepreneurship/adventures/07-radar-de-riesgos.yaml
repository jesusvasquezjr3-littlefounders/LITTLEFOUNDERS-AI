            - position: 1
              slug: esto-es-un-uso-correcto-o-indebido-de-la-informacion
              micro_objective: "Reconoce, entre dos casos, cual es un uso correcto de la información de un cliente y cual es un uso indebido sin permiso."
              narrative_beat: "Liruf usa el número de un cliente solo para confirmar su pedido; alguien más comparte los números de sus clientes con otro vendedor sin pedir permiso."
              difficulty: 3
              suggested_families: [choice, analyze]
