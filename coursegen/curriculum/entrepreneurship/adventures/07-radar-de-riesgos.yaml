  - position: 3
    slug: lo-que-si-y-lo-que-no-en-un-contrato
    icon: description
    title:
      en-US: "What Belongs and What Doesn't In An Agreement"
      es-MX: "Lo que Sí y lo que No en un Contrato"
      pt-BR: "O que Sim e o que Nao em um Contrato"
    description:
      en-US: "A written agreement protects both sides - learn to read one for real, and know when a deal is big enough to need a trusted adult."
      es-MX: "Un acuerdo por escrito protege a ambas partes - aprende a leerlo de verdad, y sabe cuando un trato ya necesita a un adulto de confianza."
      pt-BR: "Um acordo por escrito protege ambas as partes - aprenda a le-lo de verdade, e saiba quando um negocio ja precisa de um adulto de confianca."
    topics:
        - position: 1
          slug: que-es-un-contrato-de-verdad
          title_es: "Que es un contrato de verdad"
          concept: "Un contrato no es un papel para 'amarrar' a la otra persona - es un acuerdo que ambas partes aceptan porque protege a ambas por igual, no solo a quien lo escribio."
          learning_objective: "El aprendiz explica que un contrato protege a ambas partes involucradas, no solo a quien lo redacto."
          key_vocabulary: [contrato, protege a ambas partes, no solo a uno]
          prior_knowledge: "Completo Mi Reputación es un Activo (saga anterior): ya sabe proteger su reputación."
          fact_refs: []
          parent_check: "Pregunta a {{name}} para que cree que sirve un contrato, y si entiende que protege a las dos partes, no solo a una."
          lessons:
            - position: 1
              slug: este-contrato-protege-a-los-dos-o-solo-a-uno
              micro_objective: "Reconoce, entre dos versiónes de un acuerdo, cual protege a ambas partes por igual y cual solo favorece a quien lo escribio."
              narrative_beat: "Rho revisa un acuerdo que solo obliga al cliente pero no dice nada de lo que el se compromete a entregar - eso no protege a ambos por igual."
              difficulty: 1
              suggested_families: [choice, analyze]
            - position: 2
              slug: explico-para-que-sirve-un-contrato
              micro_objective: "Explica, sin ayuda, para que sirve un contrato y por que protege a ambas partes de un trato."
              narrative_beat: "Liruf explica: 'un contrato no es para que yo gane y tu pierdas, es para que los dos sepamos exactamente que esperar del otro'."
              difficulty: 2
              suggested_families: [storyplay, choice]
        - position: 2
          slug: que-tiene-que-decir-un-buen-acuerdo
          title_es: "Que tiene que decir un buen acuerdo"
          concept: "Un buen acuerdo describe con claridad que se entrega, cuando, por cuanto, y que pasa si alguna de las partes no cumple - sin esos cuatro elementos, el acuerdo deja demasiado a la interpretación."
          learning_objective: "El aprendiz identifica los 4 elementos esenciales que debe incluir un acuerdo básico (que, cuando, cuanto, y que pasa si no se cumple)."
          key_vocabulary: [elementos esenciales, que cuando cuanto, que pasa si no se cumple]
          prior_knowledge: "Explica para que sirve un contrato (tema anterior)."
          fact_refs: []
          parent_check: "Pidele a {{name}} que revise si el último acuerdo que hizo incluia los 4 elementos esenciales: que, cuando, cuanto y que pasa si algo falla."
          lessons:
            - position: 1
              slug: que-le-falta-a-este-acuerdo
              micro_objective: "Identifica, en un acuerdo incompleto, cual de los 4 elementos esenciales (que, cuando, cuanto, que pasa si falla) falta."
              narrative_beat: "Dina revisa un acuerdo que dice el producto y el precio, pero no dice que pasa si el pedido se entrega tarde - falta ese cuarto elemento."
              difficulty: 3
              suggested_families: [choice, analyze]
            - position: 2
              slug: redacto-un-acuerdo-con-los-cuatro-elementos
              micro_objective: "Redacta, sin ayuda, un acuerdo básico que incluye los 4 elementos esenciales para un caso dado."
              narrative_beat: "Zara redacta: 'entrego 1 gorra bordada (que), el sabado (cuando), por $95 (cuanto), y si se retrasa más de 2 dias devuelvo el 20% del anticipo (que pasa si falla)'."
              difficulty: 3
              suggested_families: [storyplay, input]
        - position: 3
          slug: leo-todo-antes-de-firmar
          title_es: "Leo todo antes de firmar"
          concept: "Aceptar un acuerdo sin leerlo completo, confiando en que 'seguro dice lo normal', es como firmar a ciegas - leerlo entero, aunque tome tiempo, es lo que evita sorpresas despues."
          learning_objective: "El aprendiz identifica una condición inesperada dentro de un acuerdo que solo se descubre leyendolo completo, no por encima."
          key_vocabulary: [leer completo, condición inesperada, firmar a ciegas]
          prior_knowledge: "Identifica los 4 elementos esenciales de un acuerdo (tema anterior)."
          fact_refs: []
          parent_check: "Pregunta a {{name}} si lee todo un acuerdo antes de aceptarlo, o si a veces confia en que 'seguro dice lo normal'."
          lessons:
            - position: 1
              slug: esta-condicion-la-hubiera-visto-leyendo-completo
              micro_objective: "Detecta, en un acuerdo de ejemplo, una condición inesperada que solo se nota leyendo el texto completo, no solo el titulo."
              narrative_beat: "Rho casi acepta un acuerdo sin notar, hasta leerlo completo, que incluia una condición de exclusividad que no había discutido con el cliente."
              difficulty: 3
              suggested_families: [analyze, choice]
            - position: 2
              slug: marco-lo-que-necesito-revisar-antes-de-firmar
              micro_objective: "Marca, sin ayuda, las partes de un acuerdo que necesita revisar con más cuidado antes de firmarlo."
              narrative_beat: "Liruf marca con color la sección sobre 'que pasa si cancelo' porque es la parte que menos entiende del acuerdo antes de firmarlo."
              difficulty: 4
              suggested_families: [input, analyze]
        - position: 4
          slug: pregunto-lo-que-no-entiendo
          title_es: "Pregunto lo que no entiendo"
          concept: "Fingir que entiendes una parte de un acuerdo, por pena de preguntar, es más riesgoso que hacer la pregunta - quien redacto un buen acuerdo no debería incomodarse por explicarlo."
          learning_objective: "El aprendiz formula una pregunta especifica sobre una parte de un acuerdo que no entiende, en vez de fingir que la comprende."
          key_vocabulary: [preguntar sin pena, fingir que entiendes, más riesgoso]
          prior_knowledge: "Identifica que revisar antes de firmar (tema anterior)."
          fact_refs: []
          parent_check: "Anima a {{name}} a preguntar, sin pena, cualquier parte de un acuerdo que no entienda antes de aceptarlo."
          lessons:
            - position: 1
              slug: finjo-que-entiendo-o-pregunto
              micro_objective: "Elige, entre fingir que entiende una clausula confusa y preguntar directamente, la opción que de verdad protege al aprendiz."
              narrative_beat: "Dina no entiende una clausula sobre 'derechos de uso de imagen' en un acuerdo y, en vez de fingir que si, pregunta directamente que significa."
              difficulty: 4
              suggested_families: [choice, story]
            - position: 2
              slug: formulo-mi-pregunta-sobre-la-clausula-confusa
              micro_objective: "Formula, sin ayuda, una pregunta especifica sobre una clausula de un acuerdo que no entiende."
              narrative_beat: "Zara pregunta: '¿que significa exactamente que ustedes puedan usar mis fotos en su publicidad? ¿por cuanto tiempo?' antes de firmar."
              difficulty: 4
              suggested_families: [storyplay, choice]
        - position: 5
          slug: cuando-pido-ayuda-de-un-adulto-de-confianza
          title_es: "Cuando pido ayuda de un adulto de confianza"
          concept: "Un trato pequeño entre compañeros es una cosa; un acuerdo grande, con dinero importante o compromisos de largo plazo, es momento de pedirle a un adulto de confianza (padre, madre, tutor) que lo revise antes de firmar nada."
          learning_objective: "El aprendiz reconoce cuando un acuerdo es lo suficientemente grande o complejo para requerir la revisión de un adulto de confianza antes de aceptarlo."
          key_vocabulary: [adulto de confianza, acuerdo grande, revisar antes de firmar]
          prior_knowledge: "Formula preguntas sobre clausulas confusas (tema anterior)."
          fact_refs: []
          parent_check: "Habla con {{name}} sobre a partir de que tamaño de trato le gustaria que lo revisaran juntos antes de aceptar cualquier cosa."
          lessons:
            - position: 1
              slug: este-trato-lo-decido-solo-o-pido-ayuda
              micro_objective: "Reconoce, entre dos tratos de tamaño distinto, cual puede decidir solo y cual conviene revisar primero con un adulto de confianza."
              narrative_beat: "Rho decide solo sobre un pedido de $95 entre compañeros de escuela; para un acuerdo de varios meses con un negocio local, decide primero mostrarselo a su papa."
              difficulty: 4
              suggested_families: [choice, analyze]
            - position: 2
              slug: le-pido-a-un-adulto-que-revise-el-acuerdo
              micro_objective: "Redacta, sin ayuda, una petición clara a un adulto de confianza para que revise un acuerdo antes de firmarlo."
              narrative_beat: "Liruf le dice a su mama: '¿me ayudas a revisar este acuerdo antes de firmarlo? es un compromiso más grande de lo normal y quiero estar seguro'."
              difficulty: 4
              suggested_families: [storyplay, choice]
        - position: 6
          slug: negocio-solo-lo-que-puedo-cumplir-por-escrito
          title_es: "Negocio solo lo que puedo cumplir por escrito"
          concept: "Firmar un acuerdo prometiendo algo que en el fondo dudas poder cumplir (una fecha imposible, una cantidad que no puedes producir) crea un problema garantizado - solo hay que comprometerse por escrito a lo que de verdad se puede sostener."
          learning_objective: "El aprendiz revisa un acuerdo antes de firmarlo y ajusta cualquier compromiso que en realidad no pueda cumplir."
          key_vocabulary: [comprometerse por escrito, solo lo que se puede cumplir, ajustar antes de firmar]
          prior_knowledge: "Reconoce cuando pedir ayuda de un adulto de confianza (tema anterior)."
          fact_refs: []
          parent_check: "Revisa junto a {{name}} un acuerdo que este por firmar y confirma que cada compromiso escrito es algo que de verdad puede cumplir."
