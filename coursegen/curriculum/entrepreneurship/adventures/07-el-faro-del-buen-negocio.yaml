schema_version: 1
adventure:
  position: 7
  slug: el-faro-del-buen-negocio
  theme: archipelago
  age_tier: tier2
  title:
    en-US: The Lighthouse of Good Business
    es-MX: El Faro del Buen Negocio
    pt-BR: O Farol do Bom Negócio
  description:
    en-US: Across an archipelago of small businesses, Dina and Liruf learn what makes a business good all
      the way through -- ethics, fair competition, kept promises, and caring for resources.
    es-MX: En un archipiélago de pequeños negocios, Dina y Liruf aprenden qué hace bueno a un negocio de
      principio a fin -- ética, competencia justa, promesas cumplidas y cuidado de los recursos.
    pt-BR: Em um arquipélago de pequenos negócios, Dina e Liruf aprendem o que torna um negócio bom do início
      ao fim -- ética, concorrência justa, promessas cumpridas e cuidado com os recursos.
  narrative_arc: 'Dina y Liruf navegan desde el taller del valle hasta un archipiélago de pequeños negocios
    coronado por un faro donde Dr. Rho vigila, como siempre, que cada trato sea justo. Zara Vex organiza
    una feria de negocios del archipiélago donde varios puestos compiten por los mismos clientes, y ahí
    Dina y Liruf descubren que un buen negocio no se mide solo por cuánto vende, sino por cómo trata a las
    personas, cómo compite, si cumple lo que promete y si cuida los recursos que usa. Liruf aprende haciendo,
    metiendo las manos en cada decisión difícil del faro, mientras Dina reflexiona junto a Dr. Rho sobre
    lo que de verdad hace bueno a un negocio, más allá de la ganancia.'
sagas:
- position: 1
  slug: etica-del-negocio
  icon: verified_user
  title:
    en-US: Business Ethics
    es-MX: Ética del Negocio
    pt-BR: Ética do Negócio
  description:
    en-US: Learn to make the right choice in a business, even when it is harder than the easy one.
    es-MX: Aprende a elegir lo correcto en un negocio, incluso cuando es más difícil que lo fácil.
    pt-BR: Aprenda a escolher o certo em um negócio, mesmo quando é mais difícil do que o fácil.
  topics:
  - position: 1
    slug: que-es-la-etica-en-un-negocio
    title_es: Qué es la ética en un negocio
    concept: La ética en un negocio es hacer lo correcto en cada decisión, aunque nadie esté mirando en
      ese momento.
    learning_objective: Al final, el niño puede explicar con sus palabras qué significa la ética en un
      negocio.
    key_vocabulary:
    - ética
    - correcto
    - decisión
    - negocio
    prior_knowledge: Sabe resolver desacuerdos y repartir con justicia dentro de un equipo (aventura anterior).
    parent_check: "¿{{name}} puede explicarte, con sus palabras, qué significa hacer lo correcto en un negocio?"
    fact_refs: []
    lessons:
    - position: 1
      slug: las-puertas-del-faro-del-negocio
      micro_objective: Reconocer que un buen negocio se mide también por hacer lo correcto, no solo por
        vender mucho.
      narrative_beat: Dina y Liruf llegan a un archipiélago de pequeños negocios coronado por un faro donde
        Dr. Rho vigila que cada trato sea justo.
      difficulty: 1
      suggested_families:
      - story
      - choice
    - position: 2
      slug: lo-correcto-o-lo-conveniente
      micro_objective: Distinguir una decisión correcta de una decisión que solo es conveniente para el
        negocio.
      narrative_beat: Dr. Rho compara una decisión correcta con una que solo conviene al negocio, para
        que Liruf note la diferencia.
      difficulty: 2
      suggested_families:
      - analyze
      - choice
    - position: 3
      slug: quien-decide-lo-que-es-correcto
      micro_objective: Reconocer que las decisiones correctas de un negocio se piensan considerando a
        todas las personas afectadas.
      narrative_beat: Zara Vex explica que decidir qué es correcto en un negocio significa pensar en todas
        las personas a las que afecta esa decisión.
      difficulty: 2
      suggested_families:
      - story
      - choice
    - position: 4
      slug: mi-primera-decision-etica
      micro_objective: Proponer, en una escena nueva, una primera decisión ética simple para un negocio.
      narrative_beat: Frente a su primer puesto del archipiélago, Dina propone su primera decisión pensada
        con ética.
      difficulty: 3
      suggested_families:
      - choice
      - storyplay
  - position: 2
    slug: hacer-lo-correcto-aunque-nadie-mire
    title_es: Hacer lo correcto aunque nadie mire
    concept: Practicar hacer lo correcto en un negocio incluso cuando nadie lo estaría viendo es lo que
      de verdad define la ética.
    learning_objective: Al final, el niño puede decidir hacer lo correcto en una situación donde nadie
      se daría cuenta.
    key_vocabulary:
    - nadie
    - mirar
    - correcto
    - definir
    prior_knowledge: Sabe qué es la ética en un negocio (tema anterior).
    parent_check: "¿{{name}} hace lo correcto incluso cuando sabe que nadie se daría cuenta si no lo hiciera?"
    fact_refs: []
    lessons:
    - position: 1
      slug: nadie-esta-viendo
      micro_objective: Reconocer una situación de negocio donde nadie notaría si se hace algo incorrecto.
      narrative_beat: Liruf se da cuenta de que podría cobrar de más a un cliente distraído sin que nadie
        más lo notara.
      difficulty: 1
      suggested_families:
      - story
      - choice
    - position: 2
      slug: decidir-igual-que-si-me-vieran
      micro_objective: Practicar decidir de la misma forma correcta, esté alguien mirando o no.
      narrative_beat: Dr. Rho enseña a Dina a decidir siempre de la misma forma correcta, la vean o no
        la vean.
      difficulty: 2
      suggested_families:
      - storyplay
      - choice
    - position: 3
      slug: como-me-siento-despues
      micro_objective: Explicar cómo se siente una persona después de haber hecho lo correcto, aunque nadie
        lo supiera.
      narrative_beat: Zara Vex pregunta a Liruf cómo se sintió después de haber devuelto el cambio de más
        que nadie hubiera notado.
      difficulty: 2
      suggested_families:
      - story
      - analyze
    - position: 4
      slug: mi-decision-sin-testigos
      micro_objective: Aplicar con seguridad hacer lo correcto frente a una situación nueva sin testigos.
      narrative_beat: Frente a una nueva oportunidad sin testigos, Dina elige hacer lo correcto, tal como
        practicó.
      difficulty: 3
      suggested_families:
      - storyplay
      - choice
  - position: 3
    slug: un-negocio-que-cuida-a-las-personas
    title_es: Un negocio que cuida a las personas
    concept: Un negocio ético piensa en cómo sus decisiones afectan a las personas -clientes, equipo y
      comunidad-, no solo en la ganancia.
    learning_objective: Al final, el niño puede identificar cómo una decisión de negocio afecta a distintas
      personas.
    key_vocabulary:
    - afectar
    - personas
    - comunidad
    - cuidar
    prior_knowledge: Sabe hacer lo correcto aunque nadie mire (tema anterior).
    parent_check: "¿{{name}} puede nombrarte a quién puede afectar una decisión de un negocio, además del cliente?"
    fact_refs: []
    lessons:
    - position: 1
      slug: mas-alla-del-cliente
      micro_objective: Reconocer que una decisión de negocio puede afectar a más personas que solo el
        cliente directo.
      narrative_beat: Liruf descubre que una decisión de su puesto también afecta al vecino del muelle,
        no solo a su cliente.
      difficulty: 1
      suggested_families:
      - story
      - choice
    - position: 2
      slug: pensar-en-el-equipo-tambien
      micro_objective: Reconocer que las decisiones de un negocio también afectan a las personas del equipo.
      narrative_beat: Dr. Rho recuerda a Dina que una decisión del negocio también afecta a los compañeros
        que trabajan con ella.
      difficulty: 2
      suggested_families:
      - story
      - analyze
    - position: 3
      slug: pensar-en-la-comunidad
      micro_objective: Reconocer que un negocio también forma parte de una comunidad a la que puede afectar.
      narrative_beat: Zara Vex explica cómo un negocio del archipiélago afecta también a toda la comunidad
        que vive alrededor.
      difficulty: 2
      suggested_families:
      - story
      - analyze
    - position: 4
      slug: mi-mapa-de-personas-afectadas
      micro_objective: Elaborar un mapa simple de las personas que afecta una decisión propia de negocio.
      narrative_beat: Dina dibuja un mapa simple de todas las personas a las que afecta una decisión nueva
        de su puesto.
      difficulty: 3
      suggested_families:
      - arrange
      - choice
  - position: 4
    slug: cuando-la-ganancia-facil-no-es-correcta
    title_es: Cuando la ganancia fácil no es correcta
    concept: Reconocer una situación donde se podría lograr una ganancia fácil haciendo algo incorrecto,
      y elegir no hacerlo.
    learning_objective: Al final, el niño puede reconocer cuándo una ganancia fácil vendría de algo incorrecto.
    key_vocabulary:
    - ganancia
    - fácil
    - incorrecto
    - elegir
    prior_knowledge: Sabe cómo un negocio afecta a distintas personas (tema anterior).
    parent_check: "¿{{name}} puede reconocer cuándo ganar dinero fácil vendría de hacer algo incorrecto?"
    fact_refs: []
    lessons:
    - position: 1
      slug: una-oferta-tentadora
      micro_objective: Reconocer una oferta tentadora de negocio que en realidad implica hacer algo incorrecto.
      narrative_beat: A Liruf le ofrecen ganar mucho dinero fácil si vende algo que sabe que no funciona
        bien.
      difficulty: 1
      suggested_families:
      - story
      - choice
    - position: 2
      slug: ganancia-facil-o-ganancia-correcta
      micro_objective: Comparar el resultado de una ganancia fácil incorrecta con una ganancia correcta,
        aunque sea menor.
      narrative_beat: Dr. Rho compara con Dina lo que pasaría si eligiera la ganancia fácil incorrecta
        frente a la ganancia correcta.
      difficulty: 2
      suggested_families:
      - analyze
      - choice
    - position: 3
      slug: por-que-decir-que-no
      micro_objective: Explicar por qué conviene decir que no a una ganancia fácil que viene de algo incorrecto.
      narrative_beat: Zara Vex explica a Liruf por qué decir que no a una ganancia fácil incorrecta cuida
        el negocio a largo plazo.
      difficulty: 2
      suggested_families:
      - story
      - analyze
    - position: 4
      slug: mi-no-a-la-ganancia-facil
      micro_objective: Aplicar con seguridad decir que no a una ganancia fácil incorrecta en una situación
        nueva.
      narrative_beat: Frente a una nueva oferta tentadora, Dina dice que no, eligiendo la ganancia correcta
        en vez de la fácil.
      difficulty: 3
      suggested_families:
      - storyplay
      - choice
  - position: 5
    slug: elegir-lo-correcto-sobre-lo-facil
    title_es: Elegir lo correcto sobre lo fácil
    concept: Practicar elegir la opción correcta de un negocio, aunque sea más difícil o lenta que la opción
      fácil.
    learning_objective: Al final, el niño puede elegir la opción correcta de un negocio aunque sea más
      difícil.
    key_vocabulary:
    - elegir
    - correcto
    - difícil
    - opción
    prior_knowledge: Sabe reconocer cuándo una ganancia fácil no es correcta (tema anterior).
    parent_check: "¿{{name}} elige hacer las cosas de la forma correcta, aunque sea más lenta o más difícil?"
    fact_refs: []
    lessons:
    - position: 1
      slug: el-camino-facil-y-el-correcto
      micro_objective: Reconocer dos caminos posibles para un negocio, uno fácil y uno correcto pero más
        lento.
      narrative_beat: Liruf ve dos caminos posibles para terminar un pedido, uno rápido y descuidado, otro
        correcto pero más lento.
      difficulty: 1
      suggested_families:
      - story
      - choice
    - position: 2
      slug: que-pasa-a-largo-plazo
      micro_objective: Explicar qué pasa a largo plazo cuando un negocio elige siempre lo correcto sobre
        lo fácil.
      narrative_beat: Dr. Rho explica a Dina qué le pasa a un negocio, con el tiempo, cuando siempre elige
        lo correcto sobre lo fácil.
      difficulty: 2
      suggested_families:
      - story
      - analyze
    - position: 3
      slug: practicar-elegir-lo-correcto
      micro_objective: Practicar elegir la opción correcta dentro de una historia, aunque tome más tiempo.
      narrative_beat: Zara Vex pone a prueba a Liruf con una decisión donde lo correcto toma más tiempo
        que lo fácil.
      difficulty: 3
      suggested_families:
      - choice
      - storyplay
    - position: 4
      slug: mi-eleccion-correcta
      micro_objective: Aplicar con seguridad elegir la opción correcta frente a una situación nueva de
        negocio.
      narrative_beat: Dina elige, sin ayuda, la opción correcta de su negocio, aunque sea más difícil que
        la fácil.
      difficulty: 3
      suggested_families:
      - choice
      - storyplay
  - position: 6
    slug: las-reglas-que-todo-negocio-respeta
    title_es: Las reglas que todo negocio respeta
    concept: Reconocer reglas básicas que todo negocio ético respeta, como no dañar a nadie a propósito
      y ser honesto siempre.
    learning_objective: Al final, el niño puede nombrar al menos dos reglas básicas que un negocio ético
      respeta.
    key_vocabulary:
    - reglas
    - respetar
    - dañar
    - básico
    prior_knowledge: Sabe elegir lo correcto sobre lo fácil (tema anterior).
    parent_check: "¿{{name}} puede nombrarte al menos dos reglas básicas que un negocio ético siempre respeta?"
    fact_refs: []
    lessons:
    - position: 1
      slug: el-libro-de-reglas-del-faro
      micro_objective: Reconocer que existe un pequeño conjunto de reglas básicas que todo negocio del
        archipiélago respeta.
      narrative_beat: Dr. Rho muestra a Dina un pequeño libro con las reglas básicas que todo negocio del
        archipiélago respeta.
      difficulty: 1
      suggested_families:
      - story
      - choice
    - position: 2
      slug: no-danar-a-proposito
      micro_objective: Reconocer la regla de no dañar a nadie a propósito como una regla básica de todo
        negocio.
      narrative_beat: Zara Vex explica que ningún negocio ético del archipiélago debe dañar a propósito
        a otra persona.
      difficulty: 2
      suggested_families:
      - story
      - choice
    - position: 3
      slug: ser-honesto-siempre
      micro_objective: Reconocer la regla de ser honesto siempre como otra regla básica de todo negocio.
      narrative_beat: Liruf recuerda que ser honesto siempre, tal como aprendió en el reino, también es
        una regla básica del faro.
      difficulty: 2
      suggested_families:
      - choice
      - arrange
    - position: 4
      slug: mi-lista-de-reglas-basicas
      micro_objective: Elaborar una lista propia con al menos dos reglas básicas de un negocio ético.
      narrative_beat: Dina arma su propia lista de reglas básicas para su negocio, inspirada en el libro
        del faro.
      difficulty: 3
      suggested_families:
      - arrange
      - choice
  - position: 7
    slug: un-negocio-etico-se-gana-el-respeto
    title_es: Un negocio ético se gana el respeto
    concept: Explicar cómo un negocio ético se gana el respeto de la comunidad con el tiempo, decisión
      tras decisión.
    learning_objective: Al final, el niño puede explicar cómo un negocio ético gana el respeto de su comunidad.
    key_vocabulary:
    - respeto
    - ganar
    - comunidad
    - tiempo
    prior_knowledge: Conoce las reglas básicas que todo negocio respeta (tema anterior).
    parent_check: "¿{{name}} puede explicarte cómo un negocio se gana el respeto de las personas con el tiempo?"
    fact_refs: []
    lessons:
    - position: 1
      slug: el-negocio-mas-respetado-del-archipielago
      micro_objective: Reconocer un ejemplo de negocio que se ganó el respeto de todo el archipiélago con
        el tiempo.
      narrative_beat: Dr. Rho cuenta la historia de un negocio del archipiélago que se ganó el respeto
        de todos, decisión tras decisión.
      difficulty: 1
      suggested_families:
      - story
      - choice
    - position: 2
      slug: decision-tras-decision
      micro_objective: Explicar que el respeto de un negocio se construye con muchas decisiones correctas,
        no una sola.
      narrative_beat: Zara Vex explica a Liruf que el respeto de un negocio no llega de un solo golpe, sino
        de muchas decisiones correctas.
      difficulty: 2
      suggested_families:
      - story
      - analyze
    - position: 3
      slug: el-respeto-tambien-se-puede-perder
      micro_objective: Reconocer que el respeto de un negocio, aunque tome tiempo en ganarse, se puede
        perder rápido con una mala decisión.
      narrative_beat: Dr. Rho explica que el respeto que un negocio tarda tanto en ganar se puede perder
        muy rápido con una sola mala decisión.
      difficulty: 2
      suggested_families:
      - story
      - analyze
    - position: 4
      slug: mi-camino-hacia-el-respeto
      micro_objective: Proponer un plan propio de pequeñas decisiones correctas para ganar el respeto de
        los clientes.
      narrative_beat: Dina propone su propio plan de pequeñas decisiones correctas para ganar el respeto
        de sus clientes del archipiélago.
      difficulty: 3
      suggested_families:
      - choice
      - storyplay
  - position: 8
    slug: mi-brujula-etica-del-faro
    title_es: Mi brújula ética del faro
    concept: Aplicar una guía ética propia -una brújula de decisiones correctas- frente a decisiones nuevas
      de negocio.
    learning_objective: Al final, el niño puede aplicar una guía ética propia frente a decisiones nuevas
      de negocio.
    key_vocabulary:
    - brújula
    - guía
    - decisión
    - aplicar
    prior_knowledge: Conoce todo lo aprendido sobre ética de negocio enseñado en la saga (temas anteriores).
    parent_check: "¿{{name}} puede resumir las reglas principales de ética de negocio que aprendió esta semana?"
    fact_refs: []
    lessons:
    - position: 1
      slug: armo-mi-brujula
      micro_objective: Armar una brújula ética propia con las reglas principales aprendidas en la saga.
      narrative_beat: Con ayuda de Dr. Rho, Dina arma su propia brújula ética con las reglas principales
        que aprendió en el faro.
      difficulty: 1
      suggested_families:
      - story
      - arrange
    - position: 2
      slug: primera-decision-con-mi-brujula
      micro_objective: Aplicar la brújula ética propia frente a una primera decisión de negocio nueva.
      narrative_beat: Liruf usa su nueva brújula ética para decidir frente a una situación nueva de su puesto.
      difficulty: 2
      suggested_families:
      - choice
      - storyplay
    - position: 3
      slug: una-decision-dificil-con-mi-brujula
      micro_objective: Aplicar la brújula ética propia frente a una decisión de negocio más difícil.
      narrative_beat: Zara Vex pone a prueba la brújula ética de Liruf con una decisión de negocio más difícil
        que las anteriores.
      difficulty: 3
      suggested_families:
      - storyplay
      - choice
    - position: 4
      slug: mi-brujula-lista-para-el-archipielago
      micro_objective: Presentar la brújula ética propia terminada, explicando cómo la usará en su negocio.
      narrative_beat: Dina presenta su brújula ética terminada a Zara Vex, explicando cómo la usará en
        su negocio del archipiélago.
      difficulty: 3
      suggested_families:
      - storyplay
      - story
  - position: 9
    slug: el-cofre-del-repaso
    kind: review_spaced
    title_es: El Cofre del Repaso
    concept: Zara Vex abre un cofre del faro para poner a prueba, sin enseñar nada nuevo, todo lo aprendido
      en la saga Ética del Negocio.
    learning_objective: Al final, el niño puede recordar y aplicar, sin ayuda nueva, los conceptos principales
      de la saga Ética del Negocio.
    key_vocabulary:
    - ética
    - correcto
    - reglas
    - respeto
    prior_knowledge: Ha completado los ocho temas de la saga Ética del Negocio (aventura 7, saga 1).
    fact_refs: []
    review_of:
    - el-faro-del-buen-negocio/etica-del-negocio/que-es-la-etica-en-un-negocio
    - el-faro-del-buen-negocio/etica-del-negocio/hacer-lo-correcto-aunque-nadie-mire
    - el-faro-del-buen-negocio/etica-del-negocio/un-negocio-que-cuida-a-las-personas
    - el-faro-del-buen-negocio/etica-del-negocio/cuando-la-ganancia-facil-no-es-correcta
    - el-faro-del-buen-negocio/etica-del-negocio/elegir-lo-correcto-sobre-lo-facil
    - el-faro-del-buen-negocio/etica-del-negocio/las-reglas-que-todo-negocio-respeta
    - el-faro-del-buen-negocio/etica-del-negocio/un-negocio-etico-se-gana-el-respeto
    - el-faro-del-buen-negocio/etica-del-negocio/mi-brujula-etica-del-faro
    lessons:
    - position: 1
      slug: el-cofre-se-abre
      micro_objective: Recordar, sin ayuda nueva, qué es la ética en un negocio y por qué hacer lo correcto
        aunque nadie mire.
      narrative_beat: Zara Vex abre el cofre del faro y reta a Dina a recordar, señal por señal, lo primero
        que aprendió en esta saga.
      difficulty: 1
      suggested_families:
      - story
      - choice
    - position: 2
      slug: recordar-en-orden
      micro_objective: Recordar y ordenar de nuevo cómo un negocio cuida a las personas y cuándo una ganancia
        fácil no es correcta.
      narrative_beat: Liruf saca del cofre las señales mezcladas de la saga y las ordena de memoria, sin
        que Dr. Rho le dé ninguna pista nueva.
      difficulty: 1
      suggested_families:
      - arrange
      - choice
    - position: 3
      slug: aplicar-lo-guardado
      micro_objective: Aplicar de nuevo, en una escena distinta, lo aprendido sobre elegir lo correcto
        sobre lo fácil y respetar las reglas básicas.
      narrative_beat: Dr. Rho presenta una escena nueva del archipiélago y pregunta a Dina si recuerda,
        sin repasar la lección, qué haría en ese caso.
      difficulty: 2
      suggested_families:
      - choice
      - story
    - position: 4
      slug: cerrar-el-cofre
      micro_objective: Aplicar en conjunto todo lo repasado de la saga, incluyendo cómo un negocio ético
        se gana el respeto, para cerrar el cofre.
      narrative_beat: Antes de cerrar el cofre, Dina demuestra que recuerda toda la saga uniendo cada señal
        con la lección que le corresponde.
      difficulty: 2
      suggested_families:
      - choice
      - storyplay
  - position: 10
    slug: reto-entrelazado
    kind: review_interleaved
    title_es: Reto Entrelazado
    concept: Zara Vex mezcla lo aprendido en Ética del Negocio con la honestidad al vender, en un reto
      que combina ambos mundos del faro y del reino.
    learning_objective: Al final, el niño puede recordar y combinar un concepto de Ética del Negocio con
      un concepto de una aventura anterior.
    key_vocabulary:
    - recordar
    - combinar
