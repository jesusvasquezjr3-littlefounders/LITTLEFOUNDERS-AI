schema_version: 1

adventure:
  position: 6
  slug: equipo-que-escala
  theme: kingdom
  age_tier: tier4
  title:
    en-US: "A Team That Scales"
    es-MX: "Equipo que Escala"
    pt-BR: "Equipe que Escala"
  description:
    en-US: "In the Expanding Realm, the crew learns that a founder who does everything alone has a ceiling - and that delegating, building a real culture and handling conflict well is what lets a small venture grow into something bigger than one person."
    es-MX: "En el Reino en Expansión, el equipo aprende que un founder que hace todo solo tiene un techo - y que delegar, construir una cultura real y manejar bien el conflicto es lo que permite que un negocio chico crezca en algo más grande que una sola persona."
    pt-BR: "No Reino em Expansão, a equipe aprende que um founder que faz tudo sozinho tem um teto - e que delegar, construir uma cultura real e lidar bem com o conflito e o que permite que um negocio pequeno cresca em algo maior que uma única pessoa."
  narrative_arc: "Con una red de ventas etica funcionando, Dina, Liruf, Rho y Zara descubren que su pequeño negocio crecio más rápido de lo que uno solo puede sostener y llegan al Reino en Expansión, un territorio donde negocios jovenes se organizan en equipos que crecen sin perder el rumbo. Ahí aprenden a soltar tareas sin soltar el control de calidad, a construir una cultura que se siente en cada decisión y no solo en un cartel, a resolver conflictos atacando el problema y no a la persona, y a liderar mientras el equipo crece sin que las reglas informales del principio se vuelvan un caos. Al final, cada equipo debe presentar ante el Consejo de Lideres del reino un plan de liderazgo real, puesto a prueba por una crisis de equipo simulada."

sagas:
  - position: 1
    slug: ya-no-puedo-solo
    icon: group_add
    title:
      en-US: "I Can't Do It Alone Anymore"
      es-MX: "Ya No Puedo Solo"
      pt-BR: "Ja Nao Consigo Sozinho"
    description:
      en-US: "The moment a venture outgrows one person's hands is the moment delegating stops being optional."
      es-MX: "El momento en que un negocio le queda grande a una sola persona es el momento en que delegar deja de ser opcional."
      pt-BR: "O momento em que um negocio fica grande demais para uma pessoa e o momento em que delegar deixa de ser opcional."
    topics:
        - position: 1
          slug: hago-todo-yo-o-ya-es-momento-de-delegar
          title_es: "Hago todo yo, o ya es momento de delegar"
          concept: "Cuando las tareas superan las horas que tienes disponibles, seguir haciendo todo tu mismo ya no es dedicación, es un cuello de botella que frena el crecimiento del negocio."
          learning_objective: "El aprendiz reconoce, a partir de una lista de tareas y horas disponibles, cuando un negocio ya necesita delegar en vez de seguir con una sola persona haciendo todo."
          key_vocabulary: [cuello de botella, horas disponibles, momento de delegar]
          prior_knowledge: "Completo Red de Ventas (aventura anterior): ya tiene un embudo y una red de clientes funcionando."
          fact_refs: []
          parent_check: "Pregunta a {{name}} si sus tareas del negocio ya le toman más horas de las que tiene disponibles en la semana."
          lessons:
            - position: 1
              slug: mis-tareas-ya-no-caben-en-mi-semana
              micro_objective: "Reconoce, comparando las horas que requieren sus tareas contra las horas disponibles en la semana, si un negocio ya necesita delegar."
              narrative_beat: "Rho suma que sus pedidos de esta semana requieren 22 horas de trabajo, pero solo tiene 14 horas libres entre la escuela y otras cosas - algo tiene que cambiar."
              difficulty: 1
              suggested_families: [analyze, choice]
            - position: 2
              slug: reconozco-el-cuello-de-botella
              micro_objective: "Identifica, en un caso, cual tarea especifica esta actuando como cuello de botella porque solo una persona sabe hacerla."
              narrative_beat: "Zara nota que todos los pedidos se atoran esperando a que ella sola revise la calidad final - ese paso es el cuello de botella de todo el negocio."
              difficulty: 2
              suggested_families: [choice, analyze]
        - position: 2
          slug: que-tarea-si-puedo-soltar
          title_es: "Que tarea sí puedo soltar"
          concept: "No toda tarea se puede delegar igual: unas requieren tu criterio único (la decisión final de precio), otras solo requieren instrucciones claras (empacar un pedido) y esas son las primeras que se sueltan."
          learning_objective: "El aprendiz clasifica tareas de un negocio entre las que requieren su criterio único y las que se pueden delegar con instrucciones claras."
          key_vocabulary: [criterio único, instrucciones claras, primeras en soltar]
          prior_knowledge: "Reconoce cuando un negocio necesita delegar (tema anterior)."
          fact_refs: []
          parent_check: "Ayuda a {{name}} a hacer una lista de sus tareas y marcar cuales podría soltar primero porque no requieren su criterio único."
          lessons:
            - position: 1
              slug: esta-tarea-requiere-mi-criterio-o-no
              micro_objective: "Clasifica 5 tareas de un negocio entre las que requieren el criterio único del founder y las que se pueden delegar con instrucciones claras."
              narrative_beat: "Liruf separa 'decidir el precio final' (requiere su criterio) de 'empacar los pedidos ya armados' (se puede delegar con instrucciones)."
              difficulty: 2
              suggested_families: [arrange, analyze]
            - position: 2
              slug: elijo-mi-primera-tarea-para-soltar
              micro_objective: "Elige, entre 3 tareas delegables, la más adecuada para soltar primero por ser la más sencilla de explicar."
              narrative_beat: "Dina elige soltar primero el empaque de pedidos, la tarea más fácil de explicar con instrucciones claras, antes que la atención a clientes difíciles."
              difficulty: 3
              suggested_families: [choice, analyze]
        - position: 3
          slug: a-quien-le-delego-esta-tarea
          title_es: "A quien le delego esta tarea"
          concept: "Delegar una tarea a quien de verdad tiene la habilidad o el interes para hacerla bien funciona mejor que delegarla solo a quien tiene tiempo libre."
          learning_objective: "El aprendiz elige a la persona más adecuada para una tarea delegada según su habilidad o interes, no solo su disponibilidad."
          key_vocabulary: [habilidad para la tarea, interes, no solo disponibilidad]
          prior_knowledge: "Clasifica tareas delegables (tema anterior)."
          fact_refs: []
          parent_check: "Pregunta a {{name}} en quien piensa para delegar una tarea, y si eligio por habilidad o solo porque esa persona tenia tiempo libre."
          lessons:
            - position: 1
              slug: elijo-por-habilidad-o-por-tiempo-libre
              micro_objective: "Elige, entre dos personas disponibles para una tarea, la que tiene la habilidad adecuada en vez de solo tiempo libre."
              narrative_beat: "Zara delega el diseño de las etiquetas a su compañera que ya sabe usar el programa de diseño, no a quien solo tenia la tarde libre."
              difficulty: 3
              suggested_families: [choice, analyze]
            - position: 2
              slug: emparejo-tareas-con-personas
              micro_objective: "Empareja, sin ayuda, 4 tareas distintas con la persona del equipo más adecuada para cada una según su habilidad."
              narrative_beat: "Rho empareja el manejo de redes sociales con quien ya publica seguido y bien, y el empaque cuidadoso con quien tiene más paciencia para el detalle."
              difficulty: 3
              suggested_families: [arrange, analyze]
        - position: 4
          slug: explico-la-tarea-de-forma-clara
          title_es: "Explico la tarea de forma clara"
          concept: "Una instrucción vaga (\"encargate del empaque\") genera resultados distintos a los que esperabas; una instrucción clara describe el resultado exacto que buscas."
          learning_objective: "El aprendiz redacta instrucciones claras para una tarea delegada, describiendo el resultado exacto esperado."
          key_vocabulary: [instrucción clara, resultado exacto, evitar la ambiguedad]
          prior_knowledge: "Elige a la persona adecuada para una tarea (tema anterior)."
          fact_refs: []
          parent_check: "Pidele a {{name}} que te lea la instrucción que le dio a alguien para una tarea, y pregunta si describe el resultado exacto que espera."
          lessons:
            - position: 1
              slug: esta-instruccion-es-clara-o-vaga
              micro_objective: "Compara dos instrucciones para la misma tarea y elige la que describe con claridad el resultado exacto esperado."
              narrative_beat: "Liruf le dice a su compañero 'encargate del empaque' sin más; Dina en cambio dice 'cada pedido lleva bolsa sellada, etiqueta con el nombre visible, y va en la caja antes de las 6pm'."
              difficulty: 3
              suggested_families: [choice, analyze]
            - position: 2
              slug: redacto-una-instruccion-clara
              micro_objective: "Redacta, sin ayuda, una instrucción clara para una tarea delegada que describe el resultado exacto esperado."
              narrative_beat: "Zara redacta: 'revisa que cada gorra tenga el bordado centrado antes de empacarla; si no esta centrado, aparta y avisame' para su compañera nueva."
              difficulty: 4
              suggested_families: [storyplay, choice]
        - position: 5
          slug: doy-espacio-para-que-lo-haga-a-su-manera
          title_es: "Doy espacio para que lo haga a su manera"
          concept: "Una vez que la instrucción es clara sobre el resultado esperado, dejar que la persona decida el CÓMO a su manera suele generar mejores ideas que exigirle copiar exactamente tu propio metodo."
          learning_objective: "El aprendiz reconoce cuando esta imponiendo su propio método en vez de dejar que la persona delegada decida el cómo, siempre que el resultado se cumpla."
          key_vocabulary: [dejar espacio, decidir el cómo, exigir el resultado no el método]
          prior_knowledge: "Redacta una instrucción clara (tema anterior)."
          fact_refs: []
          parent_check: "Pregunta a {{name}} si, al delegar una tarea, exige que se haga exactamente a su manera o si deja espacio para que la otra persona decida el cómo."
          lessons:
            - position: 1
              slug: exijo-mi-metodo-o-dejo-espacio
              micro_objective: "Reconoce, en un caso, cuando alguien exige su propio método exacto en vez de dejar espacio para que la persona delegada decida el cómo."
              narrative_beat: "Rho al principio le pide a su compañero que organice el empaque exactamente como el, pero luego se da cuenta de que el resultado importa más que el método exacto."
              difficulty: 3
              suggested_families: [story, choice]
            - position: 2
              slug: acepto-una-forma-distinta-que-si-funciona
              micro_objective: "Decide, sin ayuda, aceptar una forma distinta de hacer una tarea propuesta por otra persona, siempre que el resultado esperado se cumpla."
              narrative_beat: "Dina acepta que su compañera organice el empaque en orden alfabetico en vez de por tamaño, porque el resultado final - pedidos completos a tiempo - es el mismo."
              difficulty: 4
              suggested_families: [choice, analyze]
        - position: 6
          slug: reviso-sin-microgestionar
          title_es: "Reviso sin microgestionar"
          concept: "Revisar el resultado de una tarea delegada en momentos acordados (no cada 10 minutos) construye confianza; revisar todo el tiempo sin avisar comunica que no confias en la persona."
          learning_objective: "El aprendiz establece un momento de revisión acordado para una tarea delegada, en vez de revisar constantemente sin avisar."
          key_vocabulary: [revisión acordada, microgestionar, construir confianza]
          prior_knowledge: "Deja espacio para que la persona decida el cómo (tema anterior)."
          fact_refs: []
          parent_check: "Pregunta a {{name}} cada cuanto revisa el trabajo que delego, y si ese momento de revisión quedo acordado de antemano con la otra persona."
          lessons:
            - position: 1
              slug: reviso-cada-rato-o-en-un-momento-acordado
              micro_objective: "Elige, entre dos formas de revisar una tarea delegada, la que construye confianza en vez de sentirse como vigilancia constante."
              narrative_beat: "Liruf le pregunta a su compañero cada 15 minutos como va; Zara acuerda revisar juntos el avance solo al final del dia, y su compañero trabaja con más calma."
              difficulty: 4
              suggested_families: [choice, story]
            - position: 2
              slug: propongo-un-momento-de-revision
              micro_objective: "Propone, sin ayuda, un momento de revisión acordado para una tarea delegada dada en un caso."
              narrative_beat: "Rho propone: 'revisamos juntos el avance del pedido a las 5pm, antes de eso confio en que vas bien' en vez de preguntar cada rato."
              difficulty: 5
              suggested_families: [storyplay, choice]
        - position: 7
          slug: repaso-ya-no-puedo-solo
          kind: review_spaced
          title_es: "Repaso: Ya No Puedo Solo"
          concept: "El equipo repasa como identificar tareas delegables, elegir a la persona correcta, dar instrucciones claras y revisar sin microgestionar."
          learning_objective: "El aprendiz recuerda y aplica, sin nueva enseñanza, el proceso completo de delegar una tarea."
          key_vocabulary: [delegar, instrucciones claras, revisión acordada]
          prior_knowledge: "Completo los 6 temas de Ya No Puedo Solo."
          fact_refs: []
          review_of:
            - equipo-que-escala/ya-no-puedo-solo/hago-todo-yo-o-ya-es-momento-de-delegar
            - equipo-que-escala/ya-no-puedo-solo/que-tarea-si-puedo-soltar
            - equipo-que-escala/ya-no-puedo-solo/a-quien-le-delego-esta-tarea
            - equipo-que-escala/ya-no-puedo-solo/explico-la-tarea-de-forma-clara
            - equipo-que-escala/ya-no-puedo-solo/doy-espacio-para-que-lo-haga-a-su-manera
            - equipo-que-escala/ya-no-puedo-solo/reviso-sin-microgestionar
          lessons:
            - position: 1
              slug: repaso-redacto-una-instruccion-clara-nueva
              micro_objective: "Recuerda y aplica, sin ayuda, como redactar una instrucción clara para una tarea delegada que todavia no había visto."
              narrative_beat: "El equipo redacta, sin ayuda, la instrucción clara de una tarea nueva para un servicio de paseo de mascotas en crecimiento."
              difficulty: 3
              suggested_families: [storyplay, choice]
            - position: 2
              slug: repaso-emparejo-tarea-y-persona-nueva
              micro_objective: "Aplica sin ayuda todo lo repasado: empareja una tarea nueva con la persona más adecuada según su habilidad."
              narrative_beat: "Rho empareja, sin ayuda de nadie, una tarea nueva de atención a clientes con la persona del equipo con más paciencia."
              difficulty: 4
              suggested_families: [choice, analyze]
        - position: 8
          slug: cruce-embudo-de-ventas-y-delegacion
          kind: review_interleaved
          title_es: "Cruce: Embudo de Ventas y Delegación"
          concept: "Mezclamos el análisis de embudo de la aventura anterior con la delegación de esta saga: delegar la etapa correcta libera tiempo justo donde más se necesita."
          learning_objective: "El aprendiz combina, sin nueva enseñanza, la etapa de un embudo de ventas con la decisión de delegar esa etapa a la persona adecuada."
          key_vocabulary: [etapa del embudo, delegar, liberar tiempo]
          prior_knowledge: "Completo el repaso de Ya No Puedo Solo (tema anterior) y El Embudo de Ventas (aventura anterior)."
          fact_refs: []
          review_of:
            - equipo-que-escala/ya-no-puedo-solo/a-quien-le-delego-esta-tarea
            - red-de-ventas/el-embudo-de-ventas/mejoro-el-paso-que-mas-fuga
          lessons:
            - position: 1
              slug: que-etapa-del-embudo-puedo-delegar
              micro_objective: "Identifica, sin ayuda, cual etapa de su embudo de ventas (conocer, considerar, decidir) puede delegar sin perder el criterio único en la decisión final."
              narrative_beat: "Zara decide delegar la etapa de 'dar a conocer' el producto en redes a su compañera creativa, pero conserva ella misma el cierre final de cada venta."
              difficulty: 4
              suggested_families: [analyze, choice]
            - position: 2
              slug: delego-la-etapa-y-libero-tiempo-para-crecer
              micro_objective: "Confirma, sin ayuda, que delegar la etapa correcta del embudo le libera tiempo real para atender la etapa que sí requiere su criterio."
              narrative_beat: "Rho delega el manejo de mensajes iniciales a un compañero y usa el tiempo liberado para mejorar sus cierres de venta, la parte que solo el puede hacer bien."
              difficulty: 5
              suggested_families: [analyze, choice]
  - position: 2
    slug: cultura-que-se-siente
    icon: groups
    title:
      en-US: "A Culture You Can Feel"
      es-MX: "Cultura que se Siente"
      pt-BR: "Cultura que se Sente"
    description:
      en-US: "Team culture is not a poster on the wall - it is what actually happens when no one important is watching."
      es-MX: "La cultura de equipo no es un cartel en la pared - es lo que de verdad pasa cuando nadie importante esta mirando."
      pt-BR: "A cultura de equipe nao e um cartaz na parede - e o que realmente acontece quando ninguem importante esta olhando."
    topics:
        - position: 1
          slug: que-es-la-cultura-de-equipo
          title_es: "Que es la cultura de equipo"
          concept: "La cultura de equipo son los hábitos y expectativas que todos siguen sin que nadie las tenga que repetir cada vez - como se trata un error, como se avisa un retraso, como se celebra un logro."
          learning_objective: "El aprendiz explica que es la cultura de equipo a partir de un ejemplo de hábitos compartidos, no de un valor escrito en un cartel."
          key_vocabulary: [cultura de equipo, hábitos compartidos, sin que nadie lo repita]
          prior_knowledge: "Completo Ya No Puedo Solo (saga anterior): ya sabe delegar tareas con claridad."
          fact_refs: []
          parent_check: "Pregunta a {{name}} que hace su equipo, sin que nadie lo tenga que recordar, cuando alguien se retrasa o comete un error."
          lessons:
            - position: 1
              slug: esto-es-cultura-o-solo-una-regla-escrita
              micro_objective: "Distingue, entre un cartel con valores y un hábito real observado, cual describe mejor la cultura de un equipo."
              narrative_beat: "El equipo de Rho tiene un cartel que dice 'somos honestos', pero lo que de verdad muestra su cultura es que todos avisan de inmediato cuando algo sale mal, sin que se los pidan."
              difficulty: 1
              suggested_families: [choice, analyze]
            - position: 2
              slug: describo-un-habito-de-mi-equipo
              micro_objective: "Describe, sin ayuda, un hábito real y observable que muestra la cultura de su propio equipo."
              narrative_beat: "Zara describe: 'en nuestro equipo, cuando alguien termina su tarea temprano, pregunta quien más necesita ayuda antes de parar' - eso es cultura, no una regla escrita."
              difficulty: 2
              suggested_families: [storyplay, choice]
        - position: 2
          slug: mis-valores-no-son-solo-palabras
          title_es: "Mis valores no son solo palabras"
          concept: "Un valor solo cuenta como cultura cuando cambia una decisión real; si el valor dice 'calidad primero' pero el equipo entrega tarde por priorizar la rapidez, el valor real es otro."
          learning_objective: "El aprendiz verifica si un valor declarado por un equipo se refleja en una decisión real tomada, o si es solo una palabra sin efecto."
          key_vocabulary: [valor declarado, decisión real, sin efecto]
          prior_knowledge: "Explica que es la cultura de equipo (tema anterior)."
          fact_refs: []
          parent_check: "Pregunta a {{name}} un valor que su equipo dice tener, y pidele un ejemplo real de una decisión donde ese valor de verdad se aplico."
          lessons:
            - position: 1
              slug: este-valor-se-aplico-o-se-quedo-en-palabras
              micro_objective: "Reconoce, en un caso, si una decisión tomada por un equipo refleja de verdad el valor que dicen tener o lo contradice."
              narrative_beat: "El equipo de Liruf dice valorar la calidad, pero entrega un pedido con el bordado torcido para no atrasarse - el valor real, esa vez, fue la rapidez, no la calidad."
              difficulty: 2
              suggested_families: [story, choice]
            - position: 2
              slug: elijo-la-decision-que-si-refleja-el-valor
              micro_objective: "Elige, entre dos decisiones posibles, la que de verdad refleja el valor declarado de calidad primero de un equipo."
              narrative_beat: "Dina elige retrasar un dia la entrega para rehacer el bordado torcido, en vez de entregarlo a tiempo pero incompleto - esa decisión si refleja el valor."
              difficulty: 3
              suggested_families: [choice, analyze]
        - position: 3
          slug: como-celebramos-un-logro
          title_es: "Como celebramos un logro"
          concept: "Reconocer un logro especifico de una persona (no solo un 'buen trabajo' general) refuerza justo el comportamiento que quieres que se repita en el equipo."
          learning_objective: "El aprendiz redacta un reconocimiento especifico que nombra el comportamiento exacto que quiere reforzar en el equipo."
          key_vocabulary: [reconocimiento especifico, reforzar el comportamiento, no solo buen trabajo]
          prior_knowledge: "Verifica si un valor se refleja en una decisión real (tema anterior)."
          fact_refs: []
          parent_check: "Pregunta a {{name}} como celebro el último logro de un compañero de equipo, y si nombro algo especifico o solo dijo 'bien hecho'."
          lessons:
            - position: 1
              slug: este-reconocimiento-es-especifico-o-generico
              micro_objective: "Compara dos formas de reconocer un logro y elige la que nombra un comportamiento especifico en vez de una frase generica."
              narrative_beat: "Rho le dice a su compañera 'buen trabajo' sin más; Zara en cambio le dice 'me encanto que revisaras cada bordado antes de empacar, eso evito 3 devoluciones'."
              difficulty: 3
              suggested_families: [choice, analyze]
            - position: 2
              slug: redacto-un-reconocimiento-especifico
              micro_objective: "Redacta, sin ayuda, un reconocimiento especifico para un logro dado en un caso, nombrando el comportamiento exacto."
              narrative_beat: "Liruf le escribe a su compañero: 'gracias por avisarme temprano que ibas a tardar, asi pude reorganizar el pedido a tiempo'."
              difficulty: 3
              suggested_families: [storyplay, choice]
        - position: 4
          slug: como-hablamos-cuando-algo-sale-mal
          title_es: "Como hablamos cuando algo sale mal"
          concept: "Un equipo donde admitir un error se castiga con burla o enojo aprende a esconder los errores; un equipo donde admitir un error se recibe con calma aprende a corregirlos rápido."
          learning_objective: "El aprendiz reconoce si la reacción de un equipo ante un error anima a admitirlo pronto o a esconderlo por miedo."
          key_vocabulary: [admitir un error, esconder el error, reacción del equipo]
          prior_knowledge: "Redacta un reconocimiento especifico (tema anterior)."
          fact_refs: []
          parent_check: "Pregunta a {{name}} que pasa en su equipo cuando alguien admite un error - se sienten libres de decirlo, o prefieren esconderlo?"
          lessons:
            - position: 1
              slug: esconde-el-error-o-lo-admite-rapido
              micro_objective: "Reconoce, en dos escenas, cual reacción del equipo anima a admitir un error pronto y cual empuja a esconderlo."
              narrative_beat: "En el equipo de Dina, cuando alguien rompe un lote de material, lo dice de inmediato porque sabe que nadie se va a burlar; en otro equipo, esconden el error hasta que ya es tarde."
              difficulty: 3
              suggested_families: [story, choice]
            - position: 2
              slug: respondo-con-calma-a-un-error-admitido
              micro_objective: "Redacta, sin ayuda, una respuesta con calma ante un compañero que admite un error, que lo anime a seguir siendo honesto."
              narrative_beat: "Zara responde: 'gracias por decirmelo rápido, veamos juntos como lo arreglamos' cuando su compañero admite que se equivoco en un pedido."
              difficulty: 4
              suggested_families: [storyplay, choice]
        - position: 5
          slug: el-ejemplo-del-lider-pesa-mas-que-sus-palabras
          title_es: "El ejemplo del lider pesa más que sus palabras"
