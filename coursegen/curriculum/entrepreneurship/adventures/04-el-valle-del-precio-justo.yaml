schema_version: 1
adventure:
  position: 4
  slug: el-valle-del-precio-justo
  theme: valley
  age_tier: tier2
  title:
    en-US: The Valley of the Fair Price
    es-MX: El Valle del Precio Justo
    pt-BR: O Vale do Preço Justo
  description:
    en-US: Descend into a market valley and learn to turn cost into a fair price — one that covers your work and still respects your customer.
    es-MX: "Baja a un valle de mercado y aprende a convertir el costo en un precio justo: uno que cubra tu trabajo y aún así respete a tu cliente."
    pt-BR: "Desça a um vale de mercado e aprenda a transformar o custo em um preço justo: um que cubra seu trabalho e ainda assim respeite seu cliente."
  narrative_arc: Con clientes reales ya conocidos en la ciudad, Dina, Liruf, Rho y Zara bajan a un valle lleno de puestos de mercado, donde cada comerciante debe decidir cuánto cobrar. Rho se convierte en el detective de costos de la tripulación, revisando cada material y cada minuto de trabajo para que ningún costo se escape; Zara calcula, resta y ajusta hasta encontrar el precio que de verdad es justo, ni abusivo ni regalado; Liruf aprende, con algún tropiezo, que vender por menos del costo o dejar que algo se dañe también cuenta como perder dinero; y Dina reúne a todos para revisar qué salió mal, ajustar y seguir adelante sin desanimarse. Al final del valle, cada quien sabe calcular su costo, su ganancia y un precio justo, listos para el Reino de las Ventas que los espera más adelante.
sagas:
  - position: 1
    slug: costo-precio-y-ganancia
    icon: price_check
    title:
      en-US: Cost, Price and Profit
      es-MX: Costo, Precio y Ganancia
      pt-BR: Custo, Preço e Lucro
    description:
      en-US: "Learn the three ideas at the heart of every fair price: what it costs, what it sells for, and what you keep."
      es-MX: "Aprende las tres ideas centrales de todo precio justo: lo que cuesta, en cuánto se vende y lo que te queda."
      pt-BR: "Aprenda as três ideias centrais de todo preço justo: quanto custa, por quanto se vende e o que sobra."
    topics:
      - position: 1
        slug: que-es-el-costo
        title_es: ¿Qué es el costo?
        concept: El costo es todo el dinero que gasté para hacer mi producto, sumando cada material que usé.
        learning_objective: Al final, el niño puede identificar el costo de un producto sencillo sumando sus materiales.
        key_vocabulary:
          - costo
          - gasté
          - sumar
          - materiales
        prior_knowledge: Trae de la Ciudad del Cliente un producto ya probado con clientes reales.
        fact_refs:
          - business.math.ejemplo_costo_total_limonada
        parent_check: Ayuda a {{name}} a sumar cuánto costó cada material de su producto para conocer el costo total.
        lessons:
          - position: 1
            slug: rho-suma-los-materiales-de-la-limonada
            micro_objective: Reconoce en la historia cómo se suma el costo de un producto a partir de sus materiales.
            narrative_beat: Rho suma lo que costó el vaso, el limón y el azúcar para saber el costo total de una limonada.
            difficulty: 1
            suggested_families:
              - story
              - money
          - position: 2
            slug: costo-de-cuales-materiales
            micro_objective: Identifica, entre 4 materiales, cuáles forman parte del costo de un producto mostrado.
            narrative_beat: Zara revisa la mesa de trabajo y separa los materiales que sí formaron parte del costo de su pulsera.
            difficulty: 1
            suggested_families:
              - choice
          - position: 3
            slug: sumo-el-costo-de-dos-materiales
            micro_objective: Suma el costo de 2 a 3 materiales sencillos para obtener el costo total de un producto.
            narrative_beat: Liruf suma el costo del hilo y las cuentas para saber cuánto le costó hacer su pulsera.
            difficulty: 2
            suggested_families:
              - money
              - input
          - position: 4
            slug: calculo-el-costo-de-mi-producto
            micro_objective: Calcula, sin ayuda, el costo total de su propio producto sumando sus materiales.
            narrative_beat: Dina calcula con cuidado el costo total de su producto antes de seguir adelante.
            difficulty: 2
            suggested_families:
              - money
              - storyplay
      - position: 2
        slug: que-es-el-precio
        title_es: ¿Qué es el precio?
        concept: El precio es la cantidad de dinero que le pido a mi cliente cuando le vendo mi producto.
        learning_objective: Al final, el niño puede distinguir el precio de un producto de su costo.
        key_vocabulary:
          - precio
          - pedir
          - vender
          - cliente paga
        prior_knowledge: Sabe calcular el costo de un producto sumando materiales (tema anterior).
        fact_refs: []
        parent_check: Pregúntale a {{name}} cuál es la diferencia entre lo que le costó hacer su producto y lo que le pediría a un cliente por él.
        lessons:
          - position: 1
            slug: zara-pone-un-precio-a-su-pulsera
            micro_objective: Reconoce en la historia el momento en que un personaje pone un precio a su producto.
            narrative_beat: Zara decide pedir $20 por su pulsera cuando la vende en el puesto del valle.
            difficulty: 1
            suggested_families:
              - story
              - money
          - position: 2
            slug: costo-o-precio
            micro_objective: Distingue, entre 4 cantidades mencionadas, cuáles son el costo y cuáles son el precio de un producto.
            narrative_beat: Rho separa las cantidades que escuchó entre lo que costó hacer algo y lo que se pide por venderlo.
            difficulty: 1
            suggested_families:
              - choice
          - position: 3
            slug: comparo-costo-y-precio-de-un-producto
            micro_objective: Compara el costo y el precio de un mismo producto y reconoce que son cantidades distintas.
            narrative_beat: Liruf compara lo que le costó su pulsera con lo que decidió pedir por ella.
            difficulty: 2
            suggested_families:
              - choice
              - money
          - position: 4
            slug: pongo-un-precio-a-mi-producto
            micro_objective: Pone, sin ayuda, un precio a su propio producto en una historia nueva.
            narrative_beat: Dina pone con calma un precio a su producto, pensando en lo que un cliente pagaría.
            difficulty: 2
            suggested_families:
              - storyplay
              - money
      - position: 3
        slug: el-precio-no-puede-ser-menor-que-el-costo
        title_es: El precio no puede ser menor que el costo
        concept: Si vendo algo por menos de lo que me costó hacerlo, pierdo dinero en vez de ganar.
        learning_objective: Al final, el niño puede reconocer cuándo un precio propuesto es menor que el costo del producto.
        key_vocabulary:
          - menor que
          - perder dinero
          - no alcanza
          - cubrir el costo
        prior_knowledge: Sabe distinguir costo de precio (tema anterior).
        fact_refs: []
        parent_check: Pregúntale a {{name}} qué pasaría si vendiera su producto por menos de lo que le costó hacerlo.
        lessons:
          - position: 1
            slug: liruf-casi-vende-barato
            micro_objective: Reconoce en la historia por qué vender por menos del costo sería un error.
            narrative_beat: Liruf está a punto de vender su carrito en $5, aunque los materiales le costaron $8.
            difficulty: 1
            suggested_families:
              - story
              - choice
          - position: 2
            slug: precio-que-alcanza-o-no-alcanza
            micro_objective: Distingue, entre 4 pares de costo y precio, cuáles precios alcanzan a cubrir el costo y cuáles no.
            narrative_beat: Rho revisa varios productos y separa los precios que sí cubren el costo de los que no.
            difficulty: 1
            suggested_families:
              - choice
              - money
          - position: 3
            slug: comparo-precio-propuesto-con-costo
            micro_objective: Compara un precio propuesto con el costo real de un producto y decide si alcanza.
            narrative_beat: Zara compara el precio que pensaba pedir con el costo real de su pulsera, para revisar si alcanza.
            difficulty: 2
            suggested_families:
              - money
              - choice
          - position: 4
            slug: evito-vender-por-menos-del-costo
            micro_objective: Elige, sin ayuda, un precio que sí cubre el costo de un producto en una historia nueva.
            narrative_beat: Dina elige con cuidado un precio que sí cubre el costo completo de su producto.
            difficulty: 2
            suggested_families:
              - storyplay
              - money
      - position: 4
        slug: ganancia-es-lo-que-queda
        title_es: Ganancia es lo que queda
        concept: La ganancia es el dinero que me queda después de cobrar el precio y descontar el costo.
        learning_objective: Al final, el niño puede explicar con sus palabras qué es la ganancia.
        key_vocabulary:
          - ganancia
          - lo que queda
          - después de
          - descontar
        prior_knowledge: Sabe que el precio no puede ser menor que el costo (tema anterior).
        fact_refs: []
        parent_check: Pregúntale a {{name}} qué es la ganancia, usando sus propias palabras.
        prerequisites:
          - path: la-ciudad-del-cliente/promesas-que-se-cumplen/un-cliente-contento-regresa
            strength: soft
            reason: Entender que un cliente contento regresa ayuda a valorar por qué la ganancia no es solo un número, sino el resultado de mantener esa relación de confianza.
        lessons:
          - position: 1
            slug: a-zara-le-queda-algo
            micro_objective: Reconoce en la historia el dinero que le queda a un personaje después de vender, una vez descontado el costo.
            narrative_beat: Zara vende su pulsera en $20, y después de descontar el costo de $10, le quedan $10 de ganancia.
            difficulty: 1
            suggested_families:
              - story
              - money
          - position: 2
            slug: con-ganancia-o-sin-ganancia
            micro_objective: Distingue, entre 2 escenas, cuál muestra que quedó ganancia después de vender y cuál no.
            narrative_beat: "Rho compara dos ventas: en una queda algo de dinero extra, en otra no queda nada."
            difficulty: 1
            suggested_families:
              - choice
          - position: 3
            slug: identifico-cuanto-quedo
            micro_objective: Identifica, en 2 a 3 ejemplos, cuánto dinero le quedó a alguien después de vender su producto.
            narrative_beat: Liruf identifica cuánto dinero le quedó después de vender su carrito y pagar sus materiales.
            difficulty: 2
            suggested_families:
              - choice
              - money
          - position: 4
            slug: explico-que-es-mi-ganancia
            micro_objective: Explica, sin ayuda, qué es la ganancia usando su propio producto como ejemplo.
            narrative_beat: Dina explica con calma qué es la ganancia, usando lo que le quedaría de su propio producto.
            difficulty: 2
            suggested_families:
              - storyplay
              - story
      - position: 5
        slug: ganancia-precio-menos-costo
        title_es: Ganancia = precio − costo
        concept: "Puedo calcular mi ganancia con una resta sencilla: al precio de venta le resto el costo del producto."
        learning_objective: Al final, el niño puede calcular la ganancia de un producto restando el costo del precio.
        key_vocabulary:
          - resta
          - precio menos costo
          - calcular
          - fórmula
        prior_knowledge: Sabe explicar qué es la ganancia (tema anterior).
        fact_refs:
          - business.math.formula_ganancia
          - business.math.ejemplo_ganancia_15_10
        parent_check: Practica con {{name}} la resta de precio menos costo usando los números de su propio producto.
        lessons:
          - position: 1
            slug: la-resta-de-zara
            micro_objective: Reconoce en la historia la resta que se usa para calcular la ganancia de un producto.
            narrative_beat: "Zara escribe en su libreta: '$15 de precio menos $10 de costo, me quedan $5 de ganancia'."
            difficulty: 1
            suggested_families:
              - story
              - money
          - position: 2
            slug: resta-correcta-o-incorrecta
            micro_objective: Distingue, entre 2 restas, cuál calcula correctamente la ganancia de precio menos costo.
            narrative_beat: Rho revisa dos restas del mismo producto y encuentra cuál calculó bien la ganancia.
            difficulty: 1
            suggested_families:
              - choice
          - position: 3
            slug: calculo-la-ganancia-con-la-resta
            micro_objective: Calcula, sin ayuda, la ganancia de 2 a 3 productos restando el costo del precio.
            narrative_beat: Liruf calcula la ganancia de su carrito restando el costo del precio que decidió pedir.
            difficulty: 2
            suggested_families:
              - money
              - input
          - position: 4
            slug: calculo-mi-propia-ganancia-con-la-formula
            micro_objective: Calcula, sin ayuda, su propia ganancia usando la resta de precio menos costo.
            narrative_beat: Dina calcula con seguridad su propia ganancia usando precio menos costo.
            difficulty: 2
            suggested_families:
              - storyplay
              - money
      - position: 6
        slug: calculo-mi-primera-ganancia
        title_es: Calculo mi primera ganancia
        concept: Puedo usar todo lo aprendido para calcular, paso a paso, la primera ganancia real de mi propio producto.
        learning_objective: Al final, el niño puede calcular paso a paso la ganancia de un producto propio.
        key_vocabulary:
          - paso a paso
          - primera ganancia
          - propio producto
          - calcular
        prior_knowledge: Sabe calcular la ganancia con la resta de precio menos costo (tema anterior).
        fact_refs:
          - business.math.ejemplo_ganancia_20_12
        parent_check: "Ayuda a {{name}} a calcular, paso a paso, la ganancia real de su propio producto: costo, precio y resta."
        lessons:
          - position: 1
            slug: liruf-calcula-su-primera-ganancia
            micro_objective: Reconoce en la historia los pasos que sigue un personaje para calcular su primera ganancia real.
            narrative_beat: Liruf anota su costo, anota su precio, y hace la resta para calcular su primera ganancia real.
            difficulty: 1
            suggested_families:
              - story
              - money
          - position: 2
            slug: pasos-en-orden-o-desordenados
            micro_objective: Ordena 3 pasos (costo, precio, resta) para calcular correctamente una ganancia.
            narrative_beat: "Rho ordena los pasos: primero el costo, luego el precio, y al final la resta para la ganancia."
            difficulty: 1
            suggested_families:
              - arrange
          - position: 3
            slug: calculo-la-ganancia-de-la-pulsera-de-zara
            micro_objective: Calcula, paso a paso, la ganancia de un producto nuevo usando su costo y su precio.
            narrative_beat: Zara calcula paso a paso la ganancia de su pulsera, revisando cada número con cuidado.
            difficulty: 2
            suggested_families:
              - money
              - input
          - position: 4
            slug: calculo-mi-primera-ganancia-real
            micro_objective: Calcula, sin ayuda, la ganancia real de su propio producto siguiendo todos los pasos.
            narrative_beat: Dina calcula, paso a paso y sin ayuda, la primera ganancia real de su propio producto.
            difficulty: 2
            suggested_families:
              - storyplay
              - money
      - position: 7
        slug: mas-ganancia-con-el-mismo-trabajo
        title_es: Más ganancia con el mismo trabajo
        concept: A veces puedo bajar un poco el costo o ajustar el precio para quedarme con más ganancia, sin trabajar más.
        learning_objective: Al final, el niño puede reconocer una forma de aumentar la ganancia sin aumentar el trabajo.
        key_vocabulary:
          - aumentar ganancia
          - mismo trabajo
          - bajar costo
          - ajustar precio
        prior_knowledge: Sabe calcular su primera ganancia real (tema anterior).
        fact_refs: []
        parent_check: Pregúntale a {{name}} si se le ocurre una forma de quedarse con un poco más de ganancia sin trabajar más.
        lessons:
          - position: 1
            slug: zara-reusa-un-material-y-gana-mas
            micro_objective: Reconoce en la historia cómo bajar el costo de un material aumenta la ganancia sin más trabajo.
            narrative_beat: Zara reusa un cordel que ya tenía, baja su costo, y su ganancia crece sin trabajar más.
            difficulty: 1
            suggested_families:
              - story
              - money
          - position: 2
            slug: mas-ganancia-o-igual-ganancia
            micro_objective: Distingue, entre 2 escenas, cuál muestra un cambio que sí aumenta la ganancia y cuál no cambia nada.
            narrative_beat: Rho compara dos ajustes distintos y reconoce cuál de verdad aumenta la ganancia.
            difficulty: 1
            suggested_families:
              - choice
          - position: 3
            slug: comparo-dos-formas-de-ganar-mas
            micro_objective: Compara bajar el costo con subir el precio, y reconoce que ambas pueden aumentar la ganancia.
            narrative_beat: Liruf compara reusar un material con subir un poquito el precio, y ve que ambas formas le dan más ganancia.
            difficulty: 2
            suggested_families:
              - choice
              - money
          - position: 4
            slug: encuentro-una-forma-de-ganar-mas
            micro_objective: Propone, sin ayuda, una forma de aumentar su propia ganancia sin trabajar más.
            narrative_beat: Dina propone una forma sencilla de quedarse con un poco más de ganancia sin hacer más trabajo.
            difficulty: 2
            suggested_families:
              - storyplay
              - money
      - position: 8
        slug: costo-precio-y-ganancia-en-mi-negocio
        title_es: Costo, precio y ganancia en mi negocio
        concept: "Junto todo lo aprendido: calculo el costo, elijo un precio justo y sé cuánta ganancia me queda en mi propio negocio."
        learning_objective: Al final, el niño puede presentar el costo, precio y ganancia completos de su propio producto.
        key_vocabulary:
          - mi negocio
          - costo
          - precio
          - ganancia
        prior_knowledge: Sabe encontrar una forma de aumentar su ganancia (tema anterior).
        fact_refs: []
        parent_check: Pídele a {{name}} que te presente, con números claros, el costo, el precio y la ganancia de su propio producto.
        lessons:
          - position: 1
            slug: el-reporte-completo-de-zara
            micro_objective: Reconoce en la historia un reporte completo de costo, precio y ganancia de un producto.
            narrative_beat: "Zara presenta a la tripulación su reporte completo: costo, precio y ganancia de su pulsera."
            difficulty: 1
            suggested_families:
              - story
              - money
          - position: 2
            slug: reporte-completo-o-incompleto
            micro_objective: Distingue, entre 2 reportes, cuál incluye costo, precio y ganancia completos, y cuál le falta un dato.
            narrative_beat: Rho compara dos reportes de negocio y encuentra cuál está completo.
            difficulty: 1
            suggested_families:
              - choice
          - position: 3
            slug: armo-el-reporte-de-un-producto-nuevo
            micro_objective: Arma, sin ayuda, el reporte de costo, precio y ganancia de un producto nuevo en la historia.
            narrative_beat: Liruf arma con calma el reporte completo de costo, precio y ganancia de su carrito mejorado.
            difficulty: 2
            suggested_families:
              - money
              - input
          - position: 4
            slug: presento-mi-negocio-completo
            micro_objective: Presenta, sin ayuda, el costo, precio y ganancia completos de su propio negocio.
            narrative_beat: Dina presenta con orgullo el reporte completo de su propio negocio en el valle.
            difficulty: 3
            suggested_families:
              - storyplay
              - money
      - position: 9
        slug: cofre-del-repaso-de-costo-precio-y-ganancia
        kind: review_spaced
        review_of:
          - el-valle-del-precio-justo/costo-precio-y-ganancia/que-es-el-costo
          - el-valle-del-precio-justo/costo-precio-y-ganancia/que-es-el-precio
          - el-valle-del-precio-justo/costo-precio-y-ganancia/el-precio-no-puede-ser-menor-que-el-costo
          - el-valle-del-precio-justo/costo-precio-y-ganancia/ganancia-es-lo-que-queda
          - el-valle-del-precio-justo/costo-precio-y-ganancia/ganancia-precio-menos-costo
          - el-valle-del-precio-justo/costo-precio-y-ganancia/calculo-mi-primera-ganancia
          - el-valle-del-precio-justo/costo-precio-y-ganancia/mas-ganancia-con-el-mismo-trabajo
          - el-valle-del-precio-justo/costo-precio-y-ganancia/costo-precio-y-ganancia-en-mi-negocio
        title_es: El Cofre del Repaso de Costo, Precio y Ganancia
        concept: Repasamos desde el cofre de recuerdos cómo calcular costo, precio y ganancia de un producto.
        learning_objective: Al final, el niño recuerda y usa, sin nueva enseñanza, los conceptos de esta saga sobre costo, precio y ganancia.
        key_vocabulary:
          - costo
          - precio
          - ganancia
          - calcular
        prior_knowledge: Completó los 8 temas de Costo, Precio y Ganancia.
        fact_refs: []
        lessons:
          - position: 1
            slug: abro-el-cofre-de-numeros
            micro_objective: Recuerda y nombra, sin ayuda, el costo de un producto visto en esta saga.
            narrative_beat: Rho abre un cofre lleno de recibos y notas de costo de todo el valle.
            difficulty: 1
            suggested_families:
              - story
              - money
          - position: 2
            slug: recuerdo-una-ganancia-calculada
            micro_objective: Recuerda, sin ayuda, la ganancia calculada de un producto de esta saga.
            narrative_beat: Zara saca del cofre el recuerdo de la resta que calculó la ganancia de su pulsera.
            difficulty: 1
            suggested_families:
              - story
              - money
          - position: 3
            slug: elijo-el-precio-mejor-calculado-del-cofre
            micro_objective: Elige, entre 2 precios recordados, cuál cubría mejor el costo y dejaba más ganancia.
            narrative_beat: Liruf compara dos precios guardados en el cofre y decide cuál dejaba más ganancia.
            difficulty: 2
            suggested_families:
              - choice
              - money
          - position: 4
            slug: cierro-el-cofre-con-mi-propio-calculo
            micro_objective: "Aplica sin ayuda lo recordado: calcula costo, precio y ganancia de un producto nuevo."
            narrative_beat: Dina cierra el cofre de números, lista para contar todos sus costos completos.
            difficulty: 2
            suggested_families:
              - storyplay
              - money
      - position: 10
        slug: reto-entrelazado-de-costo-precio-y-ganancia
        kind: review_interleaved
        review_of:
          - la-ciudad-del-cliente/promesas-que-se-cumplen/un-cliente-contento-regresa
          - la-ciudad-del-cliente/mis-primeras-encuestas/cambio-mi-idea-con-lo-que-aprendi
          - el-valle-del-precio-justo/costo-precio-y-ganancia/ganancia-precio-menos-costo
          - el-valle-del-precio-justo/costo-precio-y-ganancia/mas-ganancia-con-el-mismo-trabajo
        title_es: Reto Entrelazado de Costo, Precio y Ganancia
        concept: Mezclamos lo aprendido en la ciudad sobre clientes y confianza con lo aprendido en el valle sobre costo, precio y ganancia.
        learning_objective: Al final, el niño combina, sin nueva enseñanza, ideas de la aventura de la ciudad con ideas de esta saga.
        key_vocabulary:
          - cliente
          - confianza
          - precio
          - ganancia
        prior_knowledge: Completó El Cofre del Repaso de Costo, Precio y Ganancia (tema anterior) y La Ciudad del Cliente (aventura anterior).
        fact_refs: []
        lessons:
          - position: 1
            slug: un-precio-que-mantiene-la-confianza
            micro_objective: Combina la idea de un cliente contento que regresa con la de calcular un precio que sí cubre el costo.
            narrative_beat: Rho recuerda al cliente que regresaba contento y ahora calcula un precio justo que mantenga esa confianza.
            difficulty: 2
            suggested_families:
              - story
