schema_version: 1
adventure:
  position: 3
  slug: la-ciudad-del-cliente
  theme: city
  age_tier: tier2
  title:
    en-US: The City of the Customer
    es-MX: La Ciudad del Cliente
    pt-BR: A Cidade do Cliente
  description:
    en-US: Bring your products to a bustling city and learn who really wants them, what they need, and how to earn their trust.
    es-MX: Lleva tus productos a una ciudad bulliciosa y aprende quién los quiere de verdad, qué necesita y cómo ganarte su confianza.
    pt-BR: Leve seus produtos a uma cidade movimentada e aprenda quem realmente os quer, o que precisa e como conquistar sua confiança.
  narrative_arc: Con sus productos terminados bajo el brazo, Dina, Liruf, Rho y Zara llegan a una ciudad bulliciosa llena de plazas, puestos y gente ocupada. Zara brilla como estratega, dibujando el retrato de cada cliente ideal antes de ofrecer nada; Rho, siempre detective, escucha con calma las quejas y necesidades escondidas de los isleños; Liruf aprende, a veces a los tropiezos, que una promesa solo vale si de verdad se cumple; y Dina reúne a toda la tripulación para hacer sus primeras encuestas, contando respuestas y usando lo aprendido para mejorar cada idea. Al final de la ciudad, cada quien conoce bien a su cliente, sabe escucharlo, ha ganado su confianza y ha aprendido a preguntarle directamente lo que piensa.
sagas:
  - position: 1
    slug: quien-es-mi-cliente
    icon: person_search
    title:
      en-US: Who Is My Customer?
      es-MX: ¿Quién es mi Cliente?
      pt-BR: Quem é o Meu Cliente?
    description:
      en-US: Not everyone is your customer — learn to picture exactly who your product is for.
      es-MX: "No todos son tu cliente: aprende a imaginar exactamente para quién es tu producto."
      pt-BR: "Nem todo mundo é seu cliente: aprenda a imaginar exatamente para quem é o seu produto."
    topics:
      - position: 1
        slug: no-le-vendo-a-todo-el-mundo
        title_es: No le vendo a todo el mundo
        concept: Un producto no le sirve ni le interesa a todas las personas por igual; pensar en quién sí lo quiere es el primer paso para vender.
        learning_objective: Al final, el niño puede reconocer que un producto no interesa a todas las personas por igual.
        key_vocabulary:
          - cliente
          - todo el mundo
          - interesa
          - no a todos
        prior_knowledge: Trae del Bosque de los Makers un producto ya terminado y cuidado.
        fact_refs: []
        parent_check: Pregúntale a {{name}} si cree que su producto le interesaría a un bebé, a un adulto y a un niño de su edad por igual, y por qué no.
        lessons:
          - position: 1
            slug: la-plaza-llena-de-gente
            micro_objective: Reconoce en la historia que no toda la gente de una plaza se interesa por el mismo producto.
            narrative_beat: "Dina llega a la Ciudad del Cliente y ve una plaza llena de gente distinta: no todos se detienen a ver lo mismo."
            difficulty: 1
            suggested_families:
              - story
              - choice
          - position: 2
            slug: a-quien-si-a-quien-no
            micro_objective: Distingue, entre 4 personas de la plaza, a quiénes sí les interesaría un producto mostrado.
            narrative_beat: Zara observa la plaza y separa a quién le interesaría su pulsera de a quién no.
            difficulty: 1
            suggested_families:
              - choice
          - position: 3
            slug: un-producto-no-es-para-todos
            micro_objective: Reconoce, entre 3 productos, cuál tiene un público más específico y cuál es más general.
            narrative_beat: Rho compara la pulsera, pensada para niños, con el agua embotellada, que le sirve a casi cualquiera.
            difficulty: 2
            suggested_families:
              - choice
              - analyze
          - position: 4
            slug: identifico-quien-no-es-mi-cliente
            micro_objective: Identifica, sin ayuda, a alguien de una escena que probablemente NO sería cliente de un producto dado.
            narrative_beat: Liruf identifica en la plaza a alguien que seguro no querría su carrito de juguete, y explica por qué.
            difficulty: 2
            suggested_families:
              - storyplay
              - choice
      - position: 2
        slug: quien-quiere-lo-que-yo-hago
        title_es: ¿Quién quiere lo que yo hago?
        concept: Pensar en quién de verdad querría comprar mi producto me ayuda a enfocar mejor mi negocio.
        learning_objective: Al final, el niño puede nombrar el tipo de persona que más querría su producto.
        key_vocabulary:
          - querer comprar
          - enfocar
          - tipo de persona
          - mi producto
        prior_knowledge: Sabe que un producto no interesa a todos por igual (tema anterior).
        fact_refs: []
        parent_check: Pregúntale a {{name}} qué tipo de persona cree que más querría comprar su producto, y por qué.
        lessons:
          - position: 1
            slug: quien-querria-mi-pulsera
            micro_objective: Reconoce en la historia el tipo de persona que más querría un producto mostrado.
            narrative_beat: "Zara piensa en quién de la plaza querría más una pulsera de colores brillantes: sobre todo, otros niños."
            difficulty: 1
            suggested_families:
              - story
              - choice
          - position: 2
            slug: interesado-o-no-interesado
            micro_objective: Distingue, entre 4 personajes, cuáles muestran interés genuino en un producto y cuáles no.
            narrative_beat: "Rho observa las caras de la gente cuando ve la pulsera: unos sonríen, otros ni voltean."
            difficulty: 1
            suggested_families:
              - choice
          - position: 3
            slug: comparo-quien-quiere-cada-producto
            micro_objective: Compara 2 productos distintos y reconoce qué tipo de persona querría cada uno.
            narrative_beat: Liruf compara quién querría su carrito de juguete con quién querría la limonada fría de Zara.
            difficulty: 2
            suggested_families:
              - choice
          - position: 4
            slug: nombro-quien-querria-mi-producto
            micro_objective: Nombra, sin ayuda, el tipo de persona que más querría su propio producto en la historia.
            narrative_beat: Dina nombra con claridad qué tipo de persona de la ciudad más querría su producto.
            difficulty: 2
            suggested_families:
              - storyplay
              - choice
      - position: 3
        slug: un-cliente-tiene-una-necesidad
        title_es: Un cliente tiene una necesidad
        concept: Alguien se convierte en cliente cuando mi producto resuelve algo que de verdad necesita o quiere en ese momento.
        learning_objective: Al final, el niño puede identificar la necesidad que motiva a un cliente a interesarse en un producto.
        key_vocabulary:
          - necesidad
          - motiva
          - en ese momento
          - resuelve
        prior_knowledge: Sabe nombrar quién querría su producto (tema anterior).
        fact_refs: []
        parent_check: Pregúntale a {{name}} qué necesidad resuelve su producto para la persona que lo compraría.
        lessons:
          - position: 1
            slug: tiene-sed-y-hay-limonada
            micro_objective: Reconoce en la historia la necesidad que hace que alguien se interese en un producto.
            narrative_beat: Un isleño de la ciudad tiene mucha sed justo cuando pasa frente al puesto de limonada de Liruf.
            difficulty: 1
            suggested_families:
              - story
              - choice
          - position: 2
            slug: necesidad-clara-o-confusa
            micro_objective: Distingue, entre 2 escenas, cuál muestra una necesidad clara detrás del interés de un cliente.
            narrative_beat: Zara compara a alguien que compra limonada por sed real con alguien que solo mira sin necesitar nada.
            difficulty: 1
            suggested_families:
              - choice
          - position: 3
            slug: conecto-cliente-con-su-necesidad
            micro_objective: Empareja 3 clientes con la necesidad que cada uno tiene.
            narrative_beat: Rho conecta a cada persona de la plaza con lo que de verdad le hace falta en ese momento.
            difficulty: 2
            suggested_families:
              - arrange
              - choice
          - position: 4
            slug: identifico-la-necesidad-de-mi-cliente
            micro_objective: Identifica, sin ayuda, la necesidad detrás del interés de un cliente en una escena nueva.
            narrative_beat: Dina identifica exactamente qué necesita la persona que se detiene a ver su producto.
            difficulty: 2
            suggested_families:
              - storyplay
              - choice
      - position: 4
        slug: clientes-grandes-y-clientes-chicos
        title_es: Clientes grandes y clientes chicos
        concept: Los adultos y los niños suelen querer e interesarse en cosas distintas, y eso cambia quién es mi cliente.
        learning_objective: Al final, el niño puede distinguir cómo cambia el interés de un producto entre adultos y niños.
        key_vocabulary:
          - adultos
          - niños
          - distinto interés
          - depende de quién
        prior_knowledge: Sabe identificar la necesidad de un cliente (tema anterior).
        fact_refs: []
        parent_check: Pregúntale a {{name}} si su producto le interesaría más a un adulto o a un niño de su edad, y por qué.
        prerequisites:
          - path: el-bosque-de-los-makers/pruebo-y-mejoro/le-muestro-mi-producto-a-alguien
            strength: soft
            reason: Haber mostrado antes un producto a alguien más facilita imaginar distintos tipos de personas que podrían interesarse en él.
        lessons:
          - position: 1
            slug: el-adulto-y-el-nino-en-la-plaza
            micro_objective: Reconoce en la historia cómo un adulto y un niño reaccionan distinto frente al mismo producto.
            narrative_beat: Un adulto pasa de largo frente a las pulseras de colores, pero un niño se detiene encantado.
            difficulty: 1
            suggested_families:
              - story
              - choice
          - position: 2
            slug: para-adultos-o-para-ninos
            micro_objective: Clasifica 4 productos entre los que interesan más a adultos y los que interesan más a niños.
            narrative_beat: Zara clasifica los puestos de la plaza según a quién le interesa más cada uno.
            difficulty: 1
            suggested_families:
              - arrange
              - choice
          - position: 3
            slug: un-producto-para-ambos
            micro_objective: Reconoce, entre 3 productos, cuál podría interesarle tanto a adultos como a niños.
            narrative_beat: Rho nota que la limonada fría le interesa tanto a los niños como a los adultos en un día caluroso.
            difficulty: 2
            suggested_families:
              - choice
              - analyze
          - position: 4
            slug: pienso-si-mi-producto-es-para-ambos
            micro_objective: Reconoce, sin ayuda, si su propio producto interesa más a adultos, a niños, o a ambos.
            narrative_beat: Liruf piensa con calma si su carrito de juguete interesa solo a niños o también a algunos adultos.
            difficulty: 2
            suggested_families:
              - storyplay
              - choice
      - position: 5
        slug: pienso-en-la-edad-de-mi-cliente
        title_es: Pienso en la edad de mi cliente
        concept: Pensar más o menos en qué edad tiene mi cliente me ayuda a imaginarlo mejor y a preparar mi producto para él.
        learning_objective: Al final, el niño puede estimar, de forma aproximada, la edad de su cliente más probable.
        key_vocabulary:
          - edad aproximada
          - imaginar
          - preparar
          - cliente probable
        prior_knowledge: Sabe distinguir el interés de adultos y niños (tema anterior).
        fact_refs: []
        parent_check: Ayuda a {{name}} a pensar más o menos qué edad tendría su cliente más probable.
        lessons:
          - position: 1
            slug: zara-imagina-la-edad-de-su-cliente
            micro_objective: Reconoce en la historia cómo un personaje imagina la edad aproximada de su cliente.
            narrative_beat: Zara imagina que su pulsera le interesaría más a niños de más o menos su misma edad.
            difficulty: 1
            suggested_families:
              - story
              - choice
          - position: 2
            slug: edad-que-encaja-o-no-encaja
            micro_objective: Elige, entre 2 edades aproximadas, cuál encaja mejor con el interés de un producto mostrado.
            narrative_beat: Rho compara si el carrito de juguete encaja mejor con un bebé o con un niño de 7 años.
            difficulty: 1
            suggested_families:
              - choice
          - position: 3
            slug: ordeno-productos-por-edad-del-cliente
            micro_objective: Ordena 3 productos según la edad aproximada de cliente para la que están pensados.
            narrative_beat: Liruf ordena los puestos de la plaza según si son para bebés, niños o adultos.
            difficulty: 2
            suggested_families:
              - arrange
          - position: 4
            slug: estimo-la-edad-de-mi-cliente
            micro_objective: Estima, sin ayuda, la edad aproximada del cliente más probable de su propio producto.
            narrative_beat: Dina estima con calma la edad aproximada de quien más disfrutaría su producto.
            difficulty: 2
            suggested_families:
              - storyplay
              - choice
      - position: 6
        slug: dibujo-a-mi-cliente-ideal
        title_es: Dibujo a mi cliente ideal
        concept: "Puedo imaginar y describir a mi cliente ideal: cómo es, qué le gusta y por qué querría mi producto."
        learning_objective: Al final, el niño puede describir con detalles simples a su cliente ideal.
        key_vocabulary:
          - cliente ideal
          - describir
          - imaginar
          - detalles
        prior_knowledge: Sabe estimar la edad de su cliente (tema anterior).
        fact_refs: []
        parent_check: "Pídele a {{name}} que describa a su cliente ideal: qué edad tiene, qué le gusta y por qué querría su producto."
        lessons:
          - position: 1
            slug: el-retrato-de-zara
            micro_objective: Reconoce en la historia la descripción del cliente ideal de un personaje.
            narrative_beat: "Zara dibuja a su cliente ideal: un niño que ama los colores brillantes y juega afuera todo el día."
            difficulty: 1
            suggested_families:
              - story
              - choice
          - position: 2
            slug: retrato-completo-o-incompleto
            micro_objective: Distingue, entre 2 descripciones, cuál da más detalles sobre el cliente ideal.
            narrative_beat: Rho compara una descripción vaga del cliente con una descripción llena de detalles útiles.
            difficulty: 1
            suggested_families:
              - choice
          - position: 3
            slug: sumo-detalles-a-mi-retrato
            micro_objective: Ordena 3 detalles (edad, gusto, motivo) para armar la descripción de un cliente ideal.
            narrative_beat: "Liruf ordena los datos de su cliente ideal: edad, qué le gusta y por qué querría el carrito."
            difficulty: 2
            suggested_families:
              - arrange
          - position: 4
            slug: dibujo-a-mi-propio-cliente-ideal
            micro_objective: Describe, sin ayuda, a su propio cliente ideal con al menos dos detalles simples.
            narrative_beat: Dina describe con cariño a su cliente ideal, imaginando cómo es y qué le gustaría de su producto.
            difficulty: 2
            suggested_families:
              - storyplay
              - input
      - position: 7
        slug: mi-cliente-y-yo-compartimos-un-lugar
        title_es: Mi cliente y yo compartimos un lugar
        concept: Para vender bien, conviene pensar en qué lugar de la ciudad es más probable encontrarse con mi cliente ideal.
        learning_objective: Al final, el niño puede elegir un lugar donde sea probable encontrar a su cliente ideal.
        key_vocabulary:
          - lugar
          - encontrar
          - probable
          - compartir
        prior_knowledge: Sabe describir a su cliente ideal (tema anterior).
        fact_refs: []
        parent_check: Pregúntale a {{name}} en qué lugar cree que sería más fácil encontrar a su cliente ideal.
        lessons:
          - position: 1
            slug: el-parque-lleno-de-ninos
            micro_objective: Reconoce en la historia por qué un lugar concreto es bueno para encontrar cierto tipo de cliente.
            narrative_beat: Zara elige el parque de la ciudad para vender su pulsera, porque ahí juegan muchos niños.
            difficulty: 1
            suggested_families:
              - story
              - choice
          - position: 2
            slug: lugar-correcto-o-lugar-equivocado
            micro_objective: Elige, entre 2 lugares, cuál conviene más para encontrar al cliente ideal de un producto.
            narrative_beat: Rho compara vender limonada en el parque soleado o en una biblioteca fresca y tranquila.
            difficulty: 1
            suggested_families:
              - choice
          - position: 3
            slug: ordeno-lugares-por-cuantos-clientes-tienen
            micro_objective: Ordena 3 lugares de la ciudad según qué tantos clientes ideales podrían encontrarse ahí.
            narrative_beat: Liruf ordena tres lugares de la ciudad según cuántos niños como sus clientes pasan por ahí.
            difficulty: 2
            suggested_families:
              - arrange
              - money
          - position: 4
            slug: elijo-el-lugar-para-mi-producto
            micro_objective: Elige, sin ayuda, el lugar más probable para encontrar a su propio cliente ideal.
            narrative_beat: Dina elige con calma el lugar de la ciudad donde más probablemente encontrará a su cliente.
            difficulty: 2
            suggested_families:
              - storyplay
              - choice
      - position: 8
        slug: cierro-el-retrato-de-mi-cliente
        title_es: Cierro el retrato de mi cliente
        concept: "Junto todo lo que sé de mi cliente ideal: quién es, qué necesita, qué edad tiene y dónde encontrarlo."
        learning_objective: Al final, el niño puede resumir el retrato completo de su cliente ideal.
        key_vocabulary:
          - retrato completo
          - juntar
          - resumir
          - cliente ideal
        prior_knowledge: Sabe elegir un lugar para encontrar a su cliente (tema anterior).
        fact_refs: []
        parent_check: "Pídele a {{name}} que te cuente el retrato completo de su cliente ideal: quién es, qué necesita y dónde lo encontraría."
        lessons:
          - position: 1
            slug: zara-junta-todo-el-retrato
            micro_objective: Reconoce en la historia cómo un personaje junta todos los datos de su cliente ideal.
            narrative_beat: Zara junta en una sola hoja quién es su cliente, qué necesita, su edad y dónde encontrarlo.
            difficulty: 1
            suggested_families:
              - story
              - choice
          - position: 2
            slug: retrato-completo-de-quien
            micro_objective: Identifica, entre 2 retratos, cuál está completo con todos los datos del cliente ideal.
            narrative_beat: Rho compara dos retratos de cliente y encuentra cuál tiene todos los datos necesarios.
            difficulty: 1
            suggested_families:
              - choice
          - position: 3
            slug: ordeno-todo-el-retrato-de-mi-cliente
            micro_objective: Ordena los 4 datos clave (quién, necesidad, edad, lugar) para completar el retrato de un cliente.
            narrative_beat: Liruf ordena en su libreta los cuatro datos que arman el retrato completo de su cliente.
            difficulty: 2
            suggested_families:
              - arrange
          - position: 4
            slug: presento-el-retrato-de-mi-cliente
            micro_objective: Presenta, sin ayuda, el retrato completo de su propio cliente ideal frente a la tripulación.
            narrative_beat: Dina presenta con orgullo el retrato completo de su cliente ideal, listo para la siguiente saga.
            difficulty: 2
            suggested_families:
              - storyplay
              - choice
      - position: 9
        slug: cofre-del-repaso-de-quien-es-mi-cliente
        kind: review_spaced
        review_of:
          - la-ciudad-del-cliente/quien-es-mi-cliente/no-le-vendo-a-todo-el-mundo
          - la-ciudad-del-cliente/quien-es-mi-cliente/quien-quiere-lo-que-yo-hago
          - la-ciudad-del-cliente/quien-es-mi-cliente/un-cliente-tiene-una-necesidad
          - la-ciudad-del-cliente/quien-es-mi-cliente/clientes-grandes-y-clientes-chicos
          - la-ciudad-del-cliente/quien-es-mi-cliente/pienso-en-la-edad-de-mi-cliente
          - la-ciudad-del-cliente/quien-es-mi-cliente/dibujo-a-mi-cliente-ideal
          - la-ciudad-del-cliente/quien-es-mi-cliente/mi-cliente-y-yo-compartimos-un-lugar
          - la-ciudad-del-cliente/quien-es-mi-cliente/cierro-el-retrato-de-mi-cliente
        title_es: El Cofre del Repaso de ¿Quién es mi Cliente?
        concept: Repasamos desde el cofre de recuerdos cómo imaginar y describir a nuestro cliente ideal.
        learning_objective: Al final, el niño recuerda y usa, sin nueva enseñanza, los conceptos de esta saga sobre identificar al cliente.
        key_vocabulary:
          - cliente
          - necesidad
          - edad
          - lugar
        prior_knowledge: Completó los 8 temas de ¿Quién es mi Cliente?
        fact_refs: []
        lessons:
          - position: 1
            slug: abro-el-cofre-de-clientes
            micro_objective: Recuerda y nombra, sin ayuda, un tipo de cliente identificado durante esta saga.
            narrative_beat: Rho encuentra un cofre lleno de retratos de clientes imaginados durante el recorrido por la ciudad.
            difficulty: 1
            suggested_families:
              - story
              - choice
          - position: 2
            slug: recuerdo-una-necesidad-de-cliente
            micro_objective: Recuerda, sin ayuda, la necesidad de un cliente vista en esta saga.
            narrative_beat: Zara saca del cofre el recuerdo de la persona con sed que compró limonada.
            difficulty: 1
            suggested_families:
              - story
              - choice
          - position: 3
            slug: elijo-el-lugar-correcto-del-cofre
            micro_objective: Elige, entre 2 lugares recordados, cuál era mejor para encontrar a cierto cliente.
            narrative_beat: Liruf compara dos lugares guardados en el cofre y recuerda cuál tenía más clientes ideales.
            difficulty: 2
            suggested_families:
              - choice
          - position: 4
            slug: cierro-el-cofre-con-mi-retrato-completo
            micro_objective: "Aplica sin ayuda lo recordado: arma el retrato completo de un cliente nuevo."
            narrative_beat: Dina cierra el cofre de clientes, lista para escuchar de verdad lo que necesitan.
            difficulty: 2
            suggested_families:
              - storyplay
              - choice
      - position: 10
        slug: reto-entrelazado-de-quien-es-mi-cliente
        kind: review_interleaved
        review_of:
          - el-bosque-de-los-makers/pruebo-y-mejoro/mi-segunda-version-es-mejor
          - el-bosque-de-los-makers/hecho-con-cuidado/que-es-un-producto-bien-hecho
          - la-ciudad-del-cliente/quien-es-mi-cliente/un-cliente-tiene-una-necesidad
          - la-ciudad-del-cliente/quien-es-mi-cliente/dibujo-a-mi-cliente-ideal
        title_es: Reto Entrelazado de ¿Quién es mi Cliente?
        concept: Mezclamos lo aprendido en el bosque sobre hacer productos con lo aprendido en la ciudad sobre identificar al cliente.
        learning_objective: Al final, el niño combina, sin nueva enseñanza, ideas de la aventura del bosque con ideas de esta saga.
        key_vocabulary:
          - producto
          - cliente
          - necesidad
          - mejorar
        prior_knowledge: Completó El Cofre del Repaso de ¿Quién es mi Cliente? (tema anterior) y El Bosque de los Makers (aventura anterior).
        fact_refs: []
        lessons:
          - position: 1
            slug: mi-producto-bien-hecho-y-su-necesidad
            micro_objective: Combina un producto bien hecho del bosque con la necesidad del cliente que podría resolver.
            narrative_beat: Rho recuerda el producto bien hecho del bosque y ahora piensa qué necesidad de un cliente podría resolver.
            difficulty: 2
            suggested_families:
              - story
              - choice
          - position: 2
            slug: mi-segunda-version-para-mi-cliente-ideal
            micro_objective: Combina la segunda versión mejorada de un producto con el retrato del cliente que más la disfrutaría.
            narrative_beat: Zara conecta la segunda versión mejorada de su sombrilla con el cliente ideal que más la necesitaría.
            difficulty: 2
            suggested_families:
              - choice
          - position: 3
            slug: ordeno-del-producto-al-cliente
