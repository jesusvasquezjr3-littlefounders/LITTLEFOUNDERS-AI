schema_version: 1
adventure:
  position: 6
  slug: el-taller-del-equipo
  theme: valley
  age_tier: tier2
  title:
    en-US: The Workshop of the Team
    es-MX: El Taller del Equipo
    pt-BR: A Oficina da Equipe
  description:
    en-US: In a valley workshop, Dina and Dino join a team of young founders and learn to work together,
      discover each other's talents, split tasks and earnings fairly, and resolve disagreements.
    es-MX: En un taller del valle, Dina y Dino se unen a un equipo de jóvenes founders y aprenden a trabajar
      juntos, descubrir sus talentos, repartir tareas y ganancias con justicia, y resolver desacuerdos.
    pt-BR: Em uma oficina do vale, Dina e Dino se juntam a uma equipe de jovens founders e aprendem a trabalhar
      juntos, descobrir seus talentos, dividir tarefas e ganhos com justiça, e resolver desacordos.
  narrative_arc: 'Dina y Dino bajan del Reino de las Ventas hasta un valle donde un gran taller de madera
    reúne a jóvenes founders que construyen cosas juntos. Zara Vex organiza el tablero de proyectos del
    taller como una verdadera estratega de equipo, mientras Dino aprende haciendo, probando herramientas
    y tareas nuevas cada día. Dr. Rho investiga que cada reparto de tareas y ganancias sea justo, y Dina
    aprende a escuchar, mentorear y resolver los desacuerdos que surgen cuando varias personas trabajan
    juntas. Al final del valle, el equipo descubre que un buen taller no se mide por lo que logra una persona
    sola, sino por lo que logran todos juntos, con roles claros, repartos justos y desacuerdos bien resueltos.'
sagas:
- position: 1
  slug: trabajar-en-equipo
  icon: groups
  title:
    en-US: Working as a Team
    es-MX: Trabajar en Equipo
    pt-BR: Trabalhar em Equipe
  description:
    en-US: Discover why a coordinated team can achieve more than one person working alone.
    es-MX: Descubre por qué un equipo coordinado puede lograr más que una persona sola.
    pt-BR: Descubra por que uma equipe coordenada pode alcançar mais do que uma pessoa sozinha.
  topics:
  - position: 1
    slug: que-es-trabajar-en-equipo
    title_es: Qué es trabajar en equipo
    concept: Trabajar en equipo es cuando varias personas juntan su esfuerzo para lograr algo que sería
      más difícil de lograr solas.
    learning_objective: Al final, el niño puede explicar con sus palabras qué significa trabajar en equipo.
    key_vocabulary:
    - equipo
    - juntar
    - esfuerzo
    - lograr
    prior_knowledge: Ha vendido y atendido clientes por su cuenta en el reino del mercado (aventura anterior).
    parent_check: "¿{{name}} puede explicarte, con sus palabras, qué significa trabajar en equipo?"
    fact_refs: []
    lessons:
    - position: 1
      slug: las-puertas-del-taller
      micro_objective: Reconocer que un taller reúne a varias personas que trabajan juntas en proyectos.
      narrative_beat: Dina y Dino llegan a un gran taller de madera en el valle, donde varios jóvenes founders
        construyen cosas juntos.
      difficulty: 1
      suggested_families:
      - story
      - choice
    - position: 2
      slug: solo-o-en-equipo
      micro_objective: Comparar una tarea hecha por una sola persona con la misma tarea hecha en equipo.
      narrative_beat: Dr. Rho muestra a Dino la misma tarea hecha por una sola persona y luego por un pequeño
        equipo, para comparar los resultados.
      difficulty: 2
      suggested_families:
      - analyze
      - choice
    - position: 3
      slug: para-que-sirve-juntar-esfuerzos
      micro_objective: Explicar para qué sirve juntar el esfuerzo de varias personas en un proyecto.
      narrative_beat: Zara Vex explica que un proyecto grande del taller avanza mucho más rápido cuando
        varias manos trabajan a la vez.
      difficulty: 2
      suggested_families:
      - story
      - choice
    - position: 4
      slug: mi-primer-equipo-del-taller
      micro_objective: Unirse, por primera vez, a un pequeño equipo para intentar un proyecto sencillo.
      narrative_beat: Dina se une a su primer pequeño equipo del taller para construir juntos un proyecto
        sencillo.
      difficulty: 3
      suggested_families:
      - storyplay
      - maker
  - position: 2
    slug: cada-quien-aporta-algo
    title_es: Cada quien aporta algo
    concept: Cada integrante de un equipo aporta algo distinto y valioso al resultado final, aunque su
      parte se vea distinta a la de otros.
    learning_objective: Al final, el niño puede identificar el aporte específico de cada integrante en
      un proyecto de equipo.
    key_vocabulary:
    - aportar
    - distinto
    - valioso
    - integrante
    prior_knowledge: Sabe qué significa trabajar en equipo (tema anterior).
    parent_check: "¿{{name}} puede identificar qué aportó cada persona en un trabajo que hizo en grupo?"
    fact_refs: []
    lessons:
    - position: 1
      slug: piezas-distintas-del-mismo-proyecto
      micro_objective: Reconocer que distintos integrantes de un equipo hacen partes distintas de un mismo
        proyecto.
      narrative_beat: Dino observa que, en el taller, unos cortan madera, otros pintan y otros arman las
        piezas de un mismo proyecto.
      difficulty: 1
      suggested_families:
      - story
      - choice
    - position: 2
      slug: que-aporto-cada-quien
      micro_objective: Identificar, en un proyecto dado, qué aportó cada integrante del equipo.
      narrative_beat: Dr. Rho revisa con Dina un proyecto terminado, señalando qué aportó cada integrante
        del equipo.
      difficulty: 2
      suggested_families:
      - analyze
      - arrange
    - position: 3
      slug: aportes-distintos-igual-de-valiosos
      micro_objective: Explicar por qué un aporte distinto no significa que valga menos que otro.
      narrative_beat: Zara Vex explica a Dino que cortar madera y decorar el resultado son aportes distintos,
        pero igual de valiosos.
      difficulty: 2
      suggested_families:
      - story
      - analyze
    - position: 4
      slug: mi-aporte-al-equipo
      micro_objective: Identificar y nombrar el aporte propio en un proyecto de equipo nuevo.
      narrative_beat: Dina reconoce y nombra, frente a su equipo, cuál fue su propio aporte en el proyecto
        nuevo del taller.
      difficulty: 3
      suggested_families:
      - choice
      - storyplay
  - position: 3
    slug: escuchar-las-ideas-de-los-demas
    title_es: Escuchar las ideas de los demás
    concept: Escuchar con atención las ideas de los demás integrantes del equipo, no solo las propias,
      hace que un proyecto salga mejor.
    learning_objective: Al final, el niño puede practicar escuchar completamente una idea de otro integrante
      antes de responder.
    key_vocabulary:
    - escuchar
    - idea
    - atención
    - completo
    prior_knowledge: Sabe que cada quien aporta algo distinto (tema anterior).
    parent_check: "¿{{name}} escucha completamente una idea de otra persona antes de dar la suya propia?"
    fact_refs: []
    lessons:
    - position: 1
      slug: interrumpir-una-idea
      micro_objective: Reconocer que interrumpir la idea de alguien impide entenderla completa.
      narrative_beat: Dino interrumpe a un compañero que está explicando su idea, y se da cuenta de que
        no la entendió completa.
      difficulty: 1
      suggested_families:
      - story
      - choice
    - position: 2
      slug: escuchar-hasta-el-final
      micro_objective: Practicar escuchar una idea completa, hasta el final, antes de opinar sobre ella.
      narrative_beat: Dr. Rho enseña a Dina a escuchar una idea completa, hasta el final, antes de decir
        lo que piensa.
      difficulty: 2
      suggested_families:
      - storyplay
      - choice
    - position: 3
      slug: preguntar-para-entender-mejor
      micro_objective: Practicar hacer una pregunta para entender mejor la idea de otro integrante del
        equipo.
      narrative_beat: Zara Vex muestra cómo hacer una pregunta amable ayuda a entender mejor la idea de
        un compañero.
      difficulty: 2
      suggested_families:
      - storyplay
      - analyze
    - position: 4
      slug: mi-escucha-completa
      micro_objective: Aplicar la escucha completa frente a una idea nueva de un integrante del equipo.
      narrative_beat: Dina escucha con atención, de principio a fin, la idea nueva de un compañero antes
        de responder.
      difficulty: 3
      suggested_families:
      - storyplay
      - choice
  - position: 4
    slug: ponerse-de-acuerdo-en-una-meta
    title_es: Ponerse de acuerdo en una meta
    concept: Un equipo funciona mejor cuando todos se ponen de acuerdo, desde el principio, en la meta
      que quieren lograr juntos.
    learning_objective: Al final, el niño puede participar en ponerse de acuerdo con un equipo sobre una
      meta común.
    key_vocabulary:
    - meta
    - acuerdo
    - común
    - juntos
    prior_knowledge: Sabe escuchar las ideas de los demás (tema anterior).
    parent_check: "¿{{name}} participa en ponerse de acuerdo con otros sobre una meta común antes de empezar algo?"
    fact_refs: []
    lessons:
    - position: 1
      slug: cada-quien-quiere-algo-distinto
      micro_objective: Reconocer que un equipo puede empezar con ideas distintas sobre qué meta lograr.
      narrative_beat: En el taller, cada integrante del equipo de Dino propone una meta distinta para el
        proyecto nuevo.
      difficulty: 1
      suggested_families:
      - story
      - choice
    - position: 2
      slug: encontrar-la-meta-comun
      micro_objective: Practicar encontrar una meta común que reúna las ideas distintas del equipo.
      narrative_beat: Dr. Rho ayuda al equipo de Dina a encontrar una meta común que tome en cuenta varias
        ideas distintas.
      difficulty: 2
      suggested_families:
      - choice
      - analyze
    - position: 3
      slug: decirlo-en-voz-alta-para-todos
      micro_objective: Practicar decir la meta acordada en voz alta para que todo el equipo la recuerde
        igual.
      narrative_beat: Zara Vex pide al equipo decir la meta acordada en voz alta, para que todos la recuerden
        exactamente igual.
      difficulty: 2
      suggested_families:
      - storyplay
      - choice
    - position: 4
      slug: mi-meta-acordada-con-el-equipo
      micro_objective: Aplicar el proceso de ponerse de acuerdo en una meta con un equipo nuevo.
      narrative_beat: Dina guía a su nuevo equipo del taller para ponerse de acuerdo, juntos, en la meta
        del proyecto.
      difficulty: 3
      suggested_families:
      - storyplay
      - choice
  - position: 5
    slug: ayudarse-cuando-alguien-se-atora
    title_es: Ayudarse cuando alguien se atora
    concept: Ayudar a un compañero del equipo cuando algo no le está saliendo bien es parte de trabajar
      juntos de verdad.
    learning_objective: Al final, el niño puede identificar cuándo un compañero necesita ayuda y ofrecerla.
    key_vocabulary:
    - ayudar
    - atorarse
    - compañero
    - ofrecer
    prior_knowledge: Sabe ponerse de acuerdo con su equipo en una meta (tema anterior).
    parent_check: "¿{{name}} nota cuándo un compañero necesita ayuda y se ofrece a dársela?"
    fact_refs: []
    lessons:
    - position: 1
      slug: un-companero-se-atora
      micro_objective: Reconocer una señal de que un compañero del equipo está teniendo dificultad con
        su parte.
      narrative_beat: Dino nota que un compañero del taller lleva rato intentando lo mismo sin lograrlo,
        y algo no le está saliendo bien.
      difficulty: 1
      suggested_families:
      - story
      - choice
    - position: 2
      slug: ofrecer-ayuda-sin-quitar-el-turno
      micro_objective: Practicar ofrecer ayuda a un compañero sin quitarle la tarea por completo.
      narrative_beat: Dr. Rho muestra cómo ofrecer ayuda a un compañero sin hacer la tarea por él, solo
        acompañándolo.
      difficulty: 2
      suggested_families:
      - storyplay
      - choice
    - position: 3
      slug: pedir-ayuda-tambien-cuenta
      micro_objective: Reconocer que pedir ayuda cuando uno mismo se atora también es parte de trabajar
        bien en equipo.
      narrative_beat: Zara Vex anima a Dino a pedir ayuda cuando él mismo se atora con una parte difícil
        del proyecto.
      difficulty: 2
      suggested_families:
      - story
      - choice
    - position: 4
      slug: mi-ayuda-para-el-equipo
      micro_objective: Aplicar el hábito de ofrecer o pedir ayuda frente a una situación nueva del taller.
      narrative_beat: Dina ofrece su ayuda a un compañero nuevo del taller que se atoró con una parte difícil
        del proyecto.
      difficulty: 3
      suggested_families:
      - storyplay
      - choice
  - position: 6
    slug: celebrar-los-logros-juntos
    title_es: Celebrar los logros juntos
    concept: Celebrar juntos un logro del equipo, reconociendo el esfuerzo de todos, fortalece las ganas
      de seguir trabajando en equipo.
    learning_objective: Al final, el niño puede celebrar un logro de equipo reconociendo el aporte de cada
      integrante.
    key_vocabulary:
    - celebrar
    - logro
    - reconocer
    - esfuerzo
    prior_knowledge: Sabe ayudar a un compañero que se atora (tema anterior).
    parent_check: "¿{{name}} celebra los logros de un grupo reconociendo el esfuerzo de todos, no solo el propio?"
    fact_refs: []
    lessons:
    - position: 1
      slug: el-proyecto-esta-terminado
      micro_objective: Reconocer el momento en que un proyecto de equipo queda terminado.
      narrative_beat: El equipo de Dino termina su primer proyecto completo en el taller, y todos se quedan
        mirándolo con orgullo.
      difficulty: 1
      suggested_families:
      - story
      - choice
    - position: 2
      slug: nombrar-el-aporte-de-cada-quien
      micro_objective: Practicar nombrar en voz alta el aporte de cada integrante al celebrar un logro.
      narrative_beat: Dr. Rho invita a cada integrante del equipo a nombrar el aporte de un compañero antes
        de celebrar juntos.
      difficulty: 2
      suggested_families:
      - storyplay
      - choice
    - position: 3
      slug: celebrar-sin-dejar-a-nadie-fuera
      micro_objective: Reconocer la importancia de que ningún integrante del equipo quede fuera de la celebración.
      narrative_beat: Zara Vex se asegura de que ningún integrante del equipo del taller quede fuera de
        la celebración final.
      difficulty: 2
      suggested_families:
      - story
      - analyze
    - position: 4
      slug: mi-celebracion-de-equipo
      micro_objective: Organizar una celebración propia para un logro de equipo nuevo, incluyendo a todos.
      narrative_beat: Dina organiza una pequeña celebración para su equipo, asegurándose de reconocer el
        esfuerzo de cada compañero.
      difficulty: 3
      suggested_families:
      - storyplay
      - choice
  - position: 7
    slug: un-equipo-funciona-mejor-que-uno-solo
    title_es: Un equipo funciona mejor que uno solo
    concept: Comparar lo que logra una persona sola con lo que logra un equipo bien coordinado ayuda a
      entender el valor de trabajar juntos.
    learning_objective: Al final, el niño puede comparar el resultado de un trabajo hecho solo con uno
      hecho en equipo coordinado.
    key_vocabulary:
    - comparar
    - coordinado
    - resultado
    - valor
    prior_knowledge: Sabe celebrar los logros del equipo (tema anterior).
    parent_check: "¿{{name}} puede explicarte una ventaja de trabajar en equipo frente a trabajar solo?"
    prerequisites:
    - path: el-taller-del-equipo/trabajar-en-equipo/que-es-trabajar-en-equipo
      strength: soft
      reason: "Entender la idea base de trabajar en equipo permite ahora comparar sus resultados con los de trabajar solo."
    fact_refs: []
    lessons:
    - position: 1
      slug: el-mismo-proyecto-dos-formas
      micro_objective: Observar el mismo tipo de proyecto hecho una vez por una sola persona y otra vez
        por un equipo coordinado.
      narrative_beat: Dino observa el mismo tipo de proyecto hecho una vez por una sola persona y otra
        vez por un equipo coordinado del taller.
      difficulty: 1
      suggested_families:
      - story
      - analyze
    - position: 2
      slug: que-cambia-con-el-equipo
      micro_objective: Identificar qué cambia, en tiempo o calidad, cuando un proyecto se hace en equipo
        coordinado.
      narrative_beat: Dr. Rho ayuda a Dina a identificar qué cambió, en tiempo y en calidad, gracias al
        trabajo coordinado del equipo.
      difficulty: 2
      suggested_families:
      - analyze
      - choice
    - position: 3
      slug: cuando-si-conviene-trabajar-solo
      micro_objective: Reconocer que en algunas tareas pequeñas, trabajar solo también puede ser suficiente.
      narrative_beat: Zara Vex reconoce que algunas tareas pequeñas del taller sí se pueden hacer bien
        una sola persona.
      difficulty: 2
      suggested_families:
      - choice
      - analyze
    - position: 4
      slug: mi-comparacion-del-taller
      micro_objective: Explicar, con un ejemplo propio, cuándo conviene más trabajar en equipo que trabajar
        solo.
      narrative_beat: Dina explica, con un ejemplo propio del taller, cuándo conviene más trabajar en equipo
        que trabajar sola.
      difficulty: 3
      suggested_families:
      - choice
      - story
  - position: 8
    slug: mi-primer-proyecto-en-equipo
    title_es: Mi primer proyecto en equipo
    concept: Aplicar juntas todas las reglas de trabajo en equipo -aportar, escuchar, acordar una meta,
      ayudarse y celebrar- en un primer proyecto completo.
    learning_objective: Al final, el niño puede aplicar en conjunto las reglas de trabajo en equipo durante
      un proyecto completo.
    key_vocabulary:
    - proyecto
    - aplicar
    - equipo
    - completo
    prior_knowledge: Conoce todas las reglas de trabajo en equipo enseñadas en la saga (temas anteriores).
    parent_check: "¿{{name}} puede resumir las reglas principales para trabajar bien en equipo que aprendió esta semana?"
    fact_refs: []
    lessons:
    - position: 1
      slug: se-forma-mi-equipo
      micro_objective: Formar un equipo nuevo y ponerse de acuerdo en la meta del proyecto.
      narrative_beat: Con ayuda de Zara Vex, Dina forma su primer equipo completo y se pone de acuerdo
        con ellos en la meta del proyecto.
      difficulty: 1
      suggested_families:
      - story
      - arrange
    - position: 2
      slug: cada-quien-hace-su-parte
      micro_objective: Aportar la parte propia del proyecto mientras se escucha a los demás integrantes.
      narrative_beat: Dino aporta su parte del proyecto mientras escucha con atención lo que sus compañeros
        van construyendo.
      difficulty: 2
      suggested_families:
      - maker
      - storyplay
    - position: 3
      slug: alguien-necesita-ayuda-en-el-proyecto
      micro_objective: Ofrecer ayuda a un compañero que se atora durante el proyecto en equipo.
      narrative_beat: Un compañero del equipo de Dina se atora a mitad del proyecto, y ella le ofrece ayuda
        sin quitarle la tarea.
      difficulty: 3
      suggested_families:
      - storyplay
      - maker
    - position: 4
      slug: celebramos-mi-primer-proyecto
      micro_objective: Terminar y celebrar el primer proyecto completo, reconociendo el aporte de cada
        integrante.
      narrative_beat: El equipo de Dina termina su primer proyecto completo y lo celebra reconociendo el
        aporte de cada integrante.
      difficulty: 3
      suggested_families:
      - storyplay
      - story
  - position: 9
    slug: el-cofre-del-repaso
    kind: review_spaced
    title_es: El Cofre del Repaso
    concept: Zara Vex abre un cofre del taller para poner a prueba, sin enseñar nada nuevo, todo lo aprendido
      en la saga Trabajar en Equipo.
    learning_objective: Al final, el niño puede recordar y aplicar, sin ayuda nueva, los conceptos principales
      de la saga Trabajar en Equipo.
    key_vocabulary:
    - equipo
    - aportar
    - escuchar
    - meta
    prior_knowledge: Ha completado los ocho temas de la saga Trabajar en Equipo (aventura 6, saga 1).
    fact_refs: []
    review_of:
    - el-taller-del-equipo/trabajar-en-equipo/que-es-trabajar-en-equipo
    - el-taller-del-equipo/trabajar-en-equipo/cada-quien-aporta-algo
    - el-taller-del-equipo/trabajar-en-equipo/escuchar-las-ideas-de-los-demas
    - el-taller-del-equipo/trabajar-en-equipo/ponerse-de-acuerdo-en-una-meta
    - el-taller-del-equipo/trabajar-en-equipo/ayudarse-cuando-alguien-se-atora
    - el-taller-del-equipo/trabajar-en-equipo/celebrar-los-logros-juntos
    - el-taller-del-equipo/trabajar-en-equipo/un-equipo-funciona-mejor-que-uno-solo
    - el-taller-del-equipo/trabajar-en-equipo/mi-primer-proyecto-en-equipo
    lessons:
    - position: 1
      slug: el-cofre-se-abre
      micro_objective: Recordar, sin ayuda nueva, qué es trabajar en equipo y por qué cada quien aporta
        algo distinto.
      narrative_beat: Zara Vex abre el cofre del taller y reta a Dina a recordar, herramienta por herramienta,
        lo primero que aprendió en esta saga.
      difficulty: 1
      suggested_families:
      - story
      - choice
    - position: 2
      slug: recordar-en-orden
      micro_objective: Recordar y ordenar de nuevo cómo escuchar las ideas de los demás y cómo ponerse
        de acuerdo en una meta.
      narrative_beat: Dino saca del cofre las herramientas mezcladas de la saga y las ordena de memoria,
        sin que Dr. Rho le dé ninguna pista nueva.
      difficulty: 1
      suggested_families:
      - arrange
      - choice
    - position: 3
      slug: aplicar-lo-guardado
      micro_objective: Aplicar de nuevo, en una escena distinta, lo aprendido sobre ayudarse cuando alguien
        se atora y celebrar los logros juntos.
      narrative_beat: Dr. Rho presenta una escena nueva del taller y pregunta a Dina si recuerda, sin repasar
        la lección, qué haría en ese caso.
      difficulty: 2
      suggested_families:
      - choice
      - story
    - position: 4
      slug: cerrar-el-cofre
      micro_objective: Aplicar en conjunto todo lo repasado de la saga, incluyendo por qué un equipo funciona
        mejor que uno solo, para cerrar el cofre.
      narrative_beat: Antes de cerrar el cofre, Dina demuestra que recuerda toda la saga uniendo cada herramienta
        con la lección que le corresponde.
      difficulty: 2
      suggested_families:
      - choice
      - storyplay
  - position: 10
    slug: reto-entrelazado
    kind: review_interleaved
    title_es: Reto Entrelazado
    concept: Zara Vex mezcla distintos momentos de la saga Trabajar en Equipo en un solo reto, para pensarlos
      juntos como un verdadero equipo del taller.
    learning_objective: Al final, el niño combina, sin nueva enseñanza, ideas de al menos dos temas distintos
      de esta saga en una sola actividad.
    key_vocabulary:
    - recordar
    - combinar
