schema_version: 1

adventure:
  position: 4
  slug: precio-que-si-convence
  theme: valley
  age_tier: tier4
  title:
    en-US: "A Price That Actually Sells"
    es-MX: "Precio que sí Convence"
    pt-BR: "Preço que Convence de Verdade"
  description:
    en-US: "In the Fair Price District, the crew turns real customer evidence into a real price - one that covers every cost, reflects what people actually value, and still leaves a margin worth the effort."
    es-MX: "En el Distrito del Precio Justo, el equipo convierte la evidencia real de clientes en un precio real - uno que cubre cada costo, refleja lo que la gente de verdad valora, y todavia deja un margen que vale la pena."
    pt-BR: "No Distrito do Preço Justo, a equipe transforma evidencia real de clientes em um preço real - um que cobre cada custo, reflete o que as pessoas realmente valorizam, e ainda deixa uma margem que vale a pena."
  narrative_arc: "Con la decisión validada por clientes reales en la mano, Dina, Liruf, Rho y Zara llegan al Distrito del Precio Justo, un valle comercial donde decenas de jovenes founders compiten por poner el precio correcto - ni tan bajo que los deje sin ganancia, ni tan alto que nadie compre. Ahí aprenden a contar cada costo (hasta los que se esconden), a distinguir cobrar por lo que algo cuesta hacer de cobrar por lo que de verdad vale para el cliente, a proteger su margen de comisiones y descuentos que se lo comen, y a calcular exactamente cuantas ventas necesitan para no perder dinero. Al final, cada equipo debe defender su precio final ante el Consejo de Comerciantes del valle, con matemáticas reales, no con una cifra sacada del aire."

sagas:
  - position: 1
    slug: cuanto-cuesta-de-verdad
    icon: calculate
    title:
      en-US: "What It Actually Costs"
      es-MX: "Cuanto Cuesta de Verdad"
      pt-BR: "Quanto Custa de Verdade"
    description:
      en-US: "Before you can price anything, you need to count every real cost - even the ones that hide."
      es-MX: "Antes de poder ponerle precio a algo, hay que contar cada costo real - hasta los que se esconden."
      pt-BR: "Antes de precificar qualquer coisa, e preciso contar cada custo real - ate os que se escondem."
    topics:
        - position: 1
          slug: costos-fijos-y-variables
          title_es: "Costos fijos y variables"
          concept: "Un costo fijo no cambia aunque vendas más o menos (la suscripción mensual de un programa de diseño); un costo variable crece con cada unidad que produces (el vinil de cada funda)."
          learning_objective: "El aprendiz distingue un costo fijo de un costo variable en un negocio real, explicando por que uno cambia con las ventas y el otro no."
          key_vocabulary: [costo fijo, costo variable, cambia con las ventas]
          prior_knowledge: "Completo Mesa del Cliente (aventura anterior): ya tiene una decisión de producto validada por clientes reales."
          fact_refs: []
          parent_check: "Pregunta a {{name}} cual de sus gastos del negocio seguiria pagando aunque no vendiera nada este mes, y cual solo paga si produce algo nuevo."
          lessons:
            - position: 1
              slug: paga-igual-o-paga-mas
              micro_objective: "Distingue, entre dos gastos de un negocio de fundas personalizadas, cual se paga igual todos los meses y cual sube si produce más."
              narrative_beat: "Rho paga $150 al mes por su programa de diseño sin importar cuantas fundas venda; cada funda nueva le cuesta $45 extra en vinil y sellador."
              difficulty: 1
              suggested_families: [choice, analyze]
            - position: 2
              slug: clasifico-mis-gastos
              micro_objective: "Clasifica, sin ayuda, 5 gastos de un negocio entre costo fijo y costo variable."
              narrative_beat: "Zara ordena sus gastos en dos columnas: la renta del rincon del taller va en fija, el hilo y las cuentas van en variable."
              difficulty: 2
              suggested_families: [arrange, analyze]
        - position: 2
          slug: cuento-todos-mis-costos
          title_es: "Cuento todos mis costos"
          concept: "Es fácil contar el material principal y olvidar el empaque, el transporte o la comisión de la app; un costo que no cuentas sigue existiendo, solo que te lo comes tu."
          learning_objective: "El aprendiz identifica costos que faltan en una lista incompleta antes de calcular el costo total de un producto."
          key_vocabulary: [costo olvidado, lista completa, empaque]
          prior_knowledge: "Distingue costo fijo de costo variable (tema anterior)."
          fact_refs: [mxn.reference_costs.funda_personalizada_materiales]
          parent_check: "Revisa junto a {{name}} la lista de costos de su producto y pregunta si de verdad incluyo TODO, hasta el empaque y el envio."
          lessons:
            - position: 1
              slug: que-le-falto-a-esta-lista
              micro_objective: "Detecta, en una lista de 4 costos de una funda personalizada, cual costo real quedo fuera de la cuenta."
              narrative_beat: "Liruf suma vinil, plantilla y sellador, y se le olvida la bolsita de regalo que le pone a cada funda antes de entregarla."
              difficulty: 2
              suggested_families: [choice, analyze]
            - position: 2
              slug: sumo-el-costo-completo
              micro_objective: "Suma, sin ayuda, el costo total de una funda personalizada incluyendo los 4 elementos: materiales, empaque, herramienta compartida y transporte."
              narrative_beat: "Dina suma $45 de materiales más $8 de empaque más $5 de transporte para llegar al verdadero costo de cada funda que vende."
              difficulty: 3
              suggested_families: [input, analyze]
        - position: 3
          slug: el-costo-por-unidad
          title_es: "El costo por unidad"
          concept: "Dividir el costo total de un lote entre el número de unidades te dice cuanto cuesta CADA una - y ese número baja cuando produces más de una vez."
          learning_objective: "El aprendiz calcula el costo por unidad dividiendo el costo total de un lote entre las unidades producidas."
          key_vocabulary: [costo por unidad, lote, dividir entre unidades]
          prior_knowledge: "Suma el costo completo de un producto (tema anterior)."
          fact_refs: []
          parent_check: "Pidele a {{name}} que calcule cuanto le cuesta CADA unidad de su producto, no solo el lote completo."
          lessons:
            - position: 1
              slug: divido-el-lote-entre-las-unidades
              micro_objective: "Calcula, sin ayuda, el costo por unidad de un lote de 10 gorras bordadas cuyo costo total es $600."
              narrative_beat: "Zara borda 10 gorras por $600 en total de materiales e hilo; divide entre 10 y descubre que cada gorra le cuesta $60."
              difficulty: 3
              suggested_families: [input, analyze]
            - position: 2
              slug: un-lote-mas-grande-cuesta-menos-por-unidad
              micro_objective: "Compara el costo por unidad de un lote pequeño contra uno más grande y reconoce cual baja el costo de cada pieza."
              narrative_beat: "Rho descubre que hacer 20 fundas de una vez, en vez de 5, reparte el costo de la herramienta compartida entre más unidades y cada una sale más barata."
              difficulty: 3
              suggested_families: [choice, analyze]
        - position: 4
          slug: tiempo-tambien-cuesta
          title_es: "Tiempo también cuesta"
          concept: "Tu propio tiempo tiene un valor, aunque no pagues una factura por el; compararlo contra lo que ganarias haciendo otra cosa te dice si de verdad conviene."
          learning_objective: "El aprendiz reconoce el costo de oportunidad de su propio tiempo comparando las horas invertidas contra una tarifa alternativa conocida."
          key_vocabulary: [costo de oportunidad, tiempo propio, tarifa alternativa]
          prior_knowledge: "Calcula el costo por unidad (tema anterior)."
          fact_refs: [mxn.reference_prices.clase_tutoria_hora]
          parent_check: "Pregunta a {{name}} cuantas horas reales le toma hacer su producto, y si ese tiempo valdria más ganado de otra forma."
          lessons:
            - position: 1
              slug: mis-horas-tambien-valen-algo
              micro_objective: "Reconoce, en un caso, que las 2 horas que Rho invierte en cada funda tienen un valor comparable a lo que ganaria dando tutoria en ese mismo tiempo."
              narrative_beat: "Rho tarda 2 horas en decorar cada funda; sabe que dar tutoria le paga $150 por hora, asi que esas 2 horas valen al menos $300 de su tiempo."
              difficulty: 3
              suggested_families: [choice, analyze]
            - position: 2
              slug: me-conviene-o-no-me-conviene
              micro_objective: "Decide, comparando el tiempo invertido contra una tarifa alternativa, si un producto vale la pena hacer o conviene mejor usar ese tiempo en otra cosa."
              narrative_beat: "Zara calcula que sus gorras le dejan $40 de ganancia por hora invertida, menos que las $150 por hora que le pagan por tutoria - decide hacer gorras solo los fines de semana."
              difficulty: 4
              suggested_families: [analyze, choice]
        - position: 5
          slug: costos-escondidos
          title_es: "Costos escondidos"
          concept: "Una comisión de plataforma, un empaque extra o un envio gratis que tu absorbes son costos reales aunque nadie te mande una factura por ellos."
          learning_objective: "El aprendiz identifica un costo escondido (como la comisión de una plataforma de venta) que reduce el ingreso real recibido por producto."
          key_vocabulary: [costo escondido, comisión de plataforma, ingreso real]
          prior_knowledge: "Reconoce el costo de oportunidad de su tiempo (tema anterior)."
          fact_refs: [business.illustrative.comision_app_reparto_pct]
          parent_check: "Pregunta a {{name}} si vende por alguna app o plataforma, y cuanto de cada venta se queda la plataforma antes de que el dinero le llegue."
          lessons:
            - position: 1
              slug: la-plataforma-se-queda-con-una-parte
              micro_objective: "Reconoce, en un caso, que una app de venta se queda con una parte de cada pago antes de depositarle el resto al vendedor."
              narrative_beat: "Liruf vende sus playeras estampadas por una app que cobra una comisión ilustrativa del 25% de cada venta - de $200 cobrados, solo le llegan $150."
              difficulty: 4
              suggested_families: [story, choice]
            - position: 2
              slug: recalculo-mi-costo-con-la-comision
              micro_objective: "Recalcula, sin ayuda, el costo real por unidad de un producto sumando la comisión de la plataforma al costo de materiales."
              narrative_beat: "Dina suma los $60 de materiales de su gorra más la comisión que la plataforma le descuenta, y descubre que su costo real es más alto de lo que pensaba."
              difficulty: 4
              suggested_families: [input, analyze]
        - position: 6
          slug: mi-costo-total-por-producto
          title_es: "Mi costo total por producto"
          concept: "El costo total real de un producto suma materiales, tiempo valorado, empaque y comisiones - juntar todo en un solo número es lo que necesitas antes de poner un precio."
          learning_objective: "El aprendiz calcula el costo total real de un producto integrando materiales, empaque, comisión de plataforma y una porción del costo fijo."
          key_vocabulary: [costo total real, integrar todos los costos, un solo número]
          prior_knowledge: "Identifica un costo escondido (tema anterior)."
          fact_refs: [mxn.reference_costs.tenis_personalizados_materiales]
          parent_check: "Pidele a {{name}} que te muestre el costo total real de una unidad de su producto, sumando todo lo que aprendio esta semana."
          lessons:
            - position: 1
              slug: junto-todos-los-pedazos
              micro_objective: "Reune, sin ayuda, los 4 elementos del costo total de un par de tenis personalizados: materiales, empaque, parte del costo fijo y comisión."
              narrative_beat: "Zara ordena en tarjetas: $200 de pintura y sellador, $30 de empaque, $20 de parte del costo fijo del taller y $50 de comisión de la app."
              difficulty: 4
              suggested_families: [arrange, analyze]
            - position: 2
              slug: comparo-el-costo-real-de-dos-productos
              micro_objective: "Compara el costo total real de dos productos distintos y elige, sin ayuda, cual conviene producir primero por su costo más bajo."
              narrative_beat: "Rho compara el costo total real de sus fundas ($58) contra el de sus llaveros bordados ($35) y decide enfocarse primero en los llaveros."
              difficulty: 5
              suggested_families: [choice, analyze]
        - position: 7
          slug: repaso-cuanto-cuesta-de-verdad
          kind: review_spaced
          title_es: "Repaso: Cuanto Cuesta de Verdad"
          concept: "El equipo repasa como distinguir costos fijos de variables, contar costos completos y calcular el costo total real por unidad."
          learning_objective: "El aprendiz recuerda y aplica, sin nueva enseñanza, el cálculo del costo total real de un producto."
          key_vocabulary: [costo fijo, costo variable, costo total real]
          prior_knowledge: "Completo los 6 temas de Cuanto Cuesta de Verdad."
          fact_refs: []
          review_of:
            - precio-que-si-convence/cuanto-cuesta-de-verdad/costos-fijos-y-variables
            - precio-que-si-convence/cuanto-cuesta-de-verdad/cuento-todos-mis-costos
            - precio-que-si-convence/cuanto-cuesta-de-verdad/el-costo-por-unidad
            - precio-que-si-convence/cuanto-cuesta-de-verdad/tiempo-tambien-cuesta
            - precio-que-si-convence/cuanto-cuesta-de-verdad/costos-escondidos
            - precio-que-si-convence/cuanto-cuesta-de-verdad/mi-costo-total-por-producto
          lessons:
            - position: 1
              slug: repaso-clasifico-un-gasto-nuevo
              micro_objective: "Recuerda y aplica, sin ayuda, la diferencia entre costo fijo y variable en un negocio que todavia no había visto."
              narrative_beat: "El equipo clasifica, sin ayuda, los gastos de un nuevo negocio de edición de fotos que un compañero les presenta."
              difficulty: 3
              suggested_families: [arrange, analyze]
            - position: 2
              slug: repaso-calculo-el-costo-total-real
              micro_objective: "Aplica sin ayuda todo lo repasado: calcula el costo total real de un producto nuevo integrando todos los elementos aprendidos."
              narrative_beat: "Liruf calcula, sin ayuda de nadie, el costo total real de un servicio de edición de reels que nunca había analizado antes."
              difficulty: 4
              suggested_families: [input, analyze]
        - position: 8
          slug: cruce-evidencia-de-clientes-y-costos-reales
          kind: review_interleaved
          title_es: "Cruce: Evidencia de Clientes y Costos Reales"
          concept: "Mezclamos la decisión validada por clientes de la aventura anterior con el costo total real que acabamos de calcular."
          learning_objective: "El aprendiz combina, sin nueva enseñanza, un hallazgo de cliente sobre precio con el costo total real de producir el producto ajustado."
          key_vocabulary: [decisión validada, costo total real, combinar evidencia]
          prior_knowledge: "Completo el repaso de Cuanto Cuesta de Verdad (tema anterior) y Mesa del Cliente (aventura anterior)."
          fact_refs: []
          review_of:
            - precio-que-si-convence/cuanto-cuesta-de-verdad/mi-costo-total-por-producto
            - mesa-del-cliente/itero-con-senal-real/mi-decision-final-con-clientes-reales
          lessons:
            - position: 1
              slug: mi-cambio-validado-tiene-un-costo-nuevo
              micro_objective: "Recalcula el costo total real de un producto después del cambio que los clientes confirmaron que funciono."
              narrative_beat: "Zara recalcula el costo de su gorra despues de agregar el cierre reforzado que sus clientas pidieron - el costo subio $8 por unidad."
              difficulty: 4
              suggested_families: [analyze, input]
            - position: 2
              slug: mi-costo-ya-refleja-lo-que-el-cliente-confirmo
              micro_objective: "Confirma, sin ayuda, que el costo total real calculado ya incluye el cambio que la evidencia de clientes respaldo, no la versión vieja del producto."
              narrative_beat: "Rho revisa su costo final y confirma que ya incluye el material extra del cierre reforzado, no el costo de la versión que sus clientes rechazaron."
              difficulty: 5
              suggested_families: [analyze, choice]
  - position: 2
    slug: costo-mas-margen-o-precio-por-valor
    icon: price_change
    title:
      en-US: "Cost-Plus or Value-Based"
      es-MX: "Costo-Mas-Margen o Precio por Valor"
      pt-BR: "Custo-Mais-Margem ou Preço por Valor"
    description:
      en-US: "Two ways to set a price: what it costs you to make it, or what it is worth to the person buying it."
      es-MX: "Dos formas de poner un precio: lo que te cuesta hacerlo, o lo que vale para quien lo compra."
      pt-BR: "Duas formas de definir um preço: o que custa fazer, ou o que vale para quem compra."
    topics:
        - position: 1
          slug: que-es-costo-mas-margen
          title_es: "Que es costo-más-margen"
          concept: "Poner precio por costo-más-margen significa tomar tu costo total y sumarle un porcentaje o cantidad fija de ganancia - simple, pero ignora que tan valioso es el producto para el cliente."
          learning_objective: "El aprendiz calcula un precio usando el método costo-más-margen a partir de un costo total dado y un margen deseado."
          key_vocabulary: [costo-más-margen, margen deseado, precio calculado]
          prior_knowledge: "Completo Cuanto Cuesta de Verdad (saga anterior): ya sabe calcular el costo total real de un producto."
          fact_refs: [business.math.formula_ganancia]
          parent_check: "Pregunta a {{name}} cuanto le cuesta hacer su producto, y cuanto le gustaria ganarle encima de ese costo."
          lessons:
            - position: 1
              slug: le-sumo-una-ganancia-a-mi-costo
              micro_objective: "Calcula, sin ayuda, un precio costo-más-margen sumando $30 de ganancia deseada a un costo total de $58."
              narrative_beat: "Rho suma $30 de ganancia a los $58 que le cuesta cada funda y llega a un precio de $88, sin preguntarse todavia si alguien lo pagaria."
              difficulty: 1
              suggested_families: [input, choice]
            - position: 2
              slug: mismo-metodo-otro-producto
              micro_objective: "Aplica el método costo-más-margen a un segundo producto con un costo y margen deseado distintos."
              narrative_beat: "Zara aplica el mismo método a sus gorras: costo de $60 más $25 de margen deseado le dan un precio de $85."
              difficulty: 2
              suggested_families: [input, analyze]
        - position: 2
          slug: que-es-precio-por-valor
          title_es: "Que es precio por valor"
          concept: "Poner precio por valor significa preguntarte cuanto vale ese producto PARA el cliente - no cuanto te costo a ti hacerlo - y ese valor puede ser mayor o menor que tu costo más margen."
          learning_objective: "El aprendiz distingue un precio basado en valor de un precio basado en costo, identificando de donde viene cada número."
          key_vocabulary: [precio por valor, cuanto vale para el cliente, valor percibido]
          prior_knowledge: "Calcula un precio costo-más-margen (tema anterior)."
          fact_refs: []
          parent_check: "Pregunta a {{name}} que problema le resuelve su producto al cliente, y si eso vale más o menos que lo que le costo hacerlo."
          lessons:
            - position: 1
              slug: de-donde-sale-este-numero
              micro_objective: "Distingue, entre dos precios propuestos para el mismo producto, cual viene del costo del vendedor y cual viene de lo que el cliente esta dispuesto a pagar."
              narrative_beat: "Liruf propone $88 porque asi le sale la cuenta de su costo; Dina propone $120 porque sus clientes le dijeron que resolver ese problema vale eso para ellos."
              difficulty: 2
              suggested_families: [choice, analyze]
            - position: 2
              slug: el-valor-no-siempre-es-mayor-al-costo
              micro_objective: "Reconoce un caso donde el precio por valor resulta MENOR al precio costo-más-margen, no siempre mayor."
              narrative_beat: "Zara descubre que sus clientes solo valoran su servicio de tutoria en $120 por hora, menos de lo que le saldria cobrar por costo-más-margen."
              difficulty: 3
              suggested_families: [choice, analyze]
        - position: 3
          slug: cuanto-pagarian-de-verdad
          title_es: "Cuanto pagarian de verdad"
          concept: "Preguntar directamente cuanto pagarian por algo, comparándolo con precios que ya conocen (una suscripción, un boleto), ayuda a descubrir el valor real que le dan."
          learning_objective: "El aprendiz estima la disposición a pagar de un cliente comparando el producto contra un precio de referencia que el cliente ya conoce."
          key_vocabulary: [disposición a pagar, precio de referencia, comparar contra algo conocido]
          prior_knowledge: "Distingue precio por valor de precio por costo (tema anterior)."
          fact_refs: [mxn.reference_prices.suscripcion_streaming_mensual]
          parent_check: "Pregunta a {{name}} con que gasto conocido (una suscripción, un boleto) podría comparar el precio de su producto para saber si suena caro o barato."
          lessons:
            - position: 1
              slug: comparo-contra-algo-que-ya-conocen
              micro_objective: "Compara el precio mensual de un servicio de tutoria contra una suscripción de streaming que el cliente ya paga, para estimar si le suena razonable."
              narrative_beat: "Rho le dice a un cliente: 'mi paquete de 4 tutorias al mes cuesta como dos suscripciónes de streaming' - y el cliente entiende de inmediato si le parece mucho o poco."
              difficulty: 3
              suggested_families: [choice, analyze]
            - position: 2
              slug: pregunto-directo-cuanto-pagaria
              micro_objective: "Formula, sin ayuda, una pregunta directa para descubrir cuanto pagaria un cliente por un producto, comparado con algo que ya conoce."
              narrative_beat: "Zara pregunta: 'si esto te cuesta como tu boleto del concierto del sabado, te parece razonable o mucho?' y anota la respuesta exacta."
              difficulty: 3
              suggested_families: [storyplay, choice]
        - position: 4
          slug: comparo-costo-plus-y-valor
          title_es: "Comparo costo-más-margen y valor"
          concept: "Poner los dos precios lado a lado - el que sale de tu costo y el que sale de lo que el cliente valora - te dice si tienes espacio para negociar o si algo no cuadra."
          learning_objective: "El aprendiz compara el precio costo-más-margen contra el precio por valor del mismo producto y decide que hacer según cual sea mayor."
          key_vocabulary: [comparar dos precios, espacio para negociar, algo no cuadra]
          prior_knowledge: "Estima la disposición a pagar de un cliente (tema anterior)."
          fact_refs: []
          parent_check: "Ayuda a {{name}} a poner lado a lado el precio que le sale por costo y el que sus clientes de verdad pagarian, y a decidir que significa la diferencia."
          lessons:
            - position: 1
              slug: el-valor-es-mayor-que-mi-costo-mas-margen
              micro_objective: "Reconoce, cuando el precio por valor es mayor al costo-más-margen, que hay espacio para subir el precio sin perder clientes."
              narrative_beat: "Rho descubre que sus clientes pagarian hasta $130 por su funda, más de los $88 que le salia por costo-más-margen - decide subir el precio."
              difficulty: 3
              suggested_families: [choice, analyze]
            - position: 2
              slug: el-valor-es-menor-que-mi-costo-mas-margen
              micro_objective: "Reconoce, cuando el precio por valor es menor al costo-más-margen, que el producto necesita bajar su costo o cambiar de segmento."
              narrative_beat: "Zara descubre que sus clientes solo pagarian $70 por su gorra, menos de los $85 que le salia por costo-más-margen - sabe que algo tiene que cambiar."
              difficulty: 4
              suggested_families: [choice, analyze]
        - position: 5
          slug: el-precio-ancla
          title_es: "El precio ancla"
          concept: "Mostrar un precio de referencia (\"antes $150, ahora $110\") cambia como la gente percibe si un precio es barato o caro, aunque el producto no haya cambiado."
          learning_objective: "El aprendiz reconoce el efecto de un precio ancla sobre la percepción de valor de un cliente."
          key_vocabulary: [precio ancla, percepción de valor, antes y ahora]
          prior_knowledge: "Compara el precio costo-más-margen contra el precio por valor (tema anterior)."
          fact_refs: [mxn.reference_prices.videojuego_digital]
          parent_check: "Pregunta a {{name}} si alguna vez un precio le parecio barato solo porque lo comparo contra un precio más alto mostrado al lado."
          lessons:
            - position: 1
