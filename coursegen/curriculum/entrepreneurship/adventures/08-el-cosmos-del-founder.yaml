schema_version: 1
adventure:
  position: 8
  slug: el-cosmos-del-founder
  theme: cosmos
  age_tier: tier2
  title:
    en-US: The Founder's Cosmos
    es-MX: El Cosmos del Founder
    pt-BR: O Cosmos do Founder
  description:
    en-US: The capstone journey where Dina and Liruf gather everything learned across every world into
      one complete mini-business plan, iterate it, present it, and graduate as founders.
    es-MX: El viaje final donde Dina y Liruf reúnen todo lo aprendido en cada mundo en un plan completo
      de mini-empresa, lo iteran, lo presentan y se gradúan como founders.
    pt-BR: A jornada final onde Dina e Liruf reúnem tudo o que aprenderam em cada mundo em um plano completo
      de mini-empresa, o iteram, o apresentam e se formam como founders.
  narrative_arc: 'Dina y Liruf dejan atrás el archipiélago del faro y suben hasta un observatorio flotante
    en el cosmos, donde Dr. Rho reúne estrellas que representan cada mundo que visitaron: la isla de las
    ideas, el bosque de los makers, la ciudad del cliente, el reino de las ventas, el taller del equipo
    y el faro del buen negocio. Zara Vex, como estratega estrella de todo el viaje, ayuda a Dina y Liruf
    a reunir todo lo aprendido en un solo plan completo de mini-empresa, mientras Liruf aprende haciendo,
    probando y ajustando su plan una y otra vez hasta que funciona de verdad. Al final, frente a todo el
    cosmos reunido, Dina y Liruf presentan su proyecto completo y se gradúan como los primeros founders del
    cosmos, listos para seguir creando con honestidad, equipo, ética y cuidado.'
sagas:
- position: 1
  slug: el-plan-completo
  icon: rocket_launch
  title:
    en-US: The Complete Plan
    es-MX: El Plan Completo
    pt-BR: O Plano Completo
  description:
    en-US: Gather idea, product, customer, price, sale and team into one single mini-business plan.
    es-MX: Reúne idea, producto, cliente, precio, venta y equipo en un solo plan de mini-empresa.
    pt-BR: Reúna ideia, produto, cliente, preço, venda e equipe em um único plano de mini-empresa.
  topics:
  - position: 1
    slug: que-es-un-plan-de-mini-empresa
    title_es: Qué es un plan de mini-empresa
    concept: Un plan de mini-empresa reúne, en un solo lugar, la idea, el producto, el cliente, el precio,
      la venta y el equipo de un proyecto.
    learning_objective: Al final, el niño puede explicar con sus palabras qué es un plan de mini-empresa
      y qué partes tiene.
    key_vocabulary:
    - plan
    - mini-empresa
    - reunir
    - partes
    prior_knowledge: Ha aprendido, en aventuras anteriores, sobre ideas, productos, clientes, precios,
      ventas y equipos.
    parent_check: "¿{{name}} puede nombrarte las seis partes que tiene un plan completo de mini-empresa?"
    fact_refs: []
    lessons:
    - position: 1
      slug: el-observatorio-del-cosmos
      micro_objective: Reconocer que un plan de mini-empresa reúne, en un solo lugar, todo lo aprendido
        en el viaje.
      narrative_beat: Dina y Liruf llegan a un observatorio flotante en el cosmos, donde Dr. Rho reúne estrellas
        que representan cada mundo que visitaron.
      difficulty: 1
      suggested_families:
      - story
      - choice
    - position: 2
      slug: seis-estrellas-para-un-plan
      micro_objective: Identificar las seis partes de un plan de mini-empresa, idea, producto, cliente,
        precio, venta y equipo.
      narrative_beat: Zara Vex muestra seis estrellas brillantes en el observatorio, una por cada parte
        del plan de mini-empresa.
      difficulty: 2
      suggested_families:
      - arrange
      - choice
    - position: 3
      slug: por-que-conviene-tener-un-plan
      micro_objective: Explicar para qué sirve tener todas las partes de un proyecto reunidas en un solo
        plan.
      narrative_beat: Dr. Rho explica a Liruf por qué conviene tener todas las partes de su proyecto reunidas
        en un solo lugar.
      difficulty: 2
      suggested_families:
      - story
      - analyze
    - position: 4
      slug: mi-primera-mirada-a-mi-plan
      micro_objective: Observar, por primera vez, un plan de mini-empresa vacío listo para completarse.
      narrative_beat: Dina observa, por primera vez, su propio plan de mini-empresa vacío, listo para
        completarse estrella por estrella.
      difficulty: 3
      suggested_families:
      - choice
      - storyplay
  - position: 2
    slug: mi-idea-en-el-plan
    title_es: Mi idea en el plan
    concept: Escribir la idea principal del plan, incluyendo qué problema resuelve, es la primera estrella
      del plan completo.
    learning_objective: Al final, el niño puede escribir la idea principal de su proyecto dentro de un
      plan.
    key_vocabulary:
    - idea
    - problema
    - escribir
    - principal
    prior_knowledge: Sabe qué es un plan de mini-empresa (tema anterior).
    parent_check: "¿{{name}} puede contarte, en una frase, la idea principal de su proyecto?"
    fact_refs: []
    lessons:
    - position: 1
      slug: recordar-mi-idea-original
      micro_objective: Recordar la idea original que empezó todo el viaje de negocio.
      narrative_beat: Liruf recuerda, mirando las estrellas del cosmos, la idea original que lo hizo empezar
        su primer puesto.
      difficulty: 1
      suggested_families:
      - story
      - choice
    - position: 2
      slug: recordar-el-problema-que-resuelve
      micro_objective: Recordar y escribir el problema concreto que la idea original resuelve.
      narrative_beat: Dr. Rho ayuda a Dina a recordar y escribir el problema exacto que su idea original
        resuelve.
      difficulty: 2
      suggested_families:
      - input
      - choice
    - position: 3
      slug: escribir-mi-idea-en-la-primera-estrella
      micro_objective: Escribir la idea principal, completa y clara, en la primera estrella del plan.
      narrative_beat: Zara Vex ayuda a Liruf a escribir su idea principal, completa y clara, en la primera
        estrella de su plan.
      difficulty: 2
      suggested_families:
      - input
      - arrange
    - position: 4
      slug: mi-idea-lista-en-el-plan
      micro_objective: Revisar y confirmar que la idea escrita en el plan es clara y contiene el problema
        que resuelve.
      narrative_beat: Dina revisa su idea escrita en el plan y confirma que se entiende clara, con el problema
        que resuelve incluido.
      difficulty: 3
      suggested_families:
      - choice
      - input
  - position: 3
    slug: mi-producto-en-el-plan
    title_es: Mi producto en el plan
    concept: Describir el producto concreto que se hará para llevar la idea a la realidad es la segunda
      estrella del plan completo.
    learning_objective: Al final, el niño puede describir su producto concreto dentro de un plan de mini-empresa.
    key_vocabulary:
    - producto
    - concreto
    - describir
    - realidad
    prior_knowledge: Sabe escribir la idea principal en el plan (tema anterior).
    parent_check: "¿{{name}} puede describirte, con palabras concretas, el producto que quiere hacer?"
    fact_refs: []
    lessons:
    - position: 1
      slug: de-la-idea-al-producto
      micro_objective: Reconocer el paso de tener una idea a decidir un producto concreto que la representa.
      narrative_beat: Liruf piensa qué producto concreto podría hacer para llevar su idea del observatorio
        a la realidad.
      difficulty: 1
      suggested_families:
      - story
      - choice
    - position: 2
      slug: describir-mi-producto-con-detalle
      micro_objective: Describir el producto propio con detalles concretos, tamaño, forma o materiales.
      narrative_beat: Dr. Rho ayuda a Dina a describir su producto con detalles concretos, como tamaño,
        forma y materiales.
      difficulty: 2
      suggested_families:
      - input
      - analyze
    - position: 3
      slug: escribir-mi-producto-en-la-segunda-estrella
      micro_objective: Escribir la descripción del producto en la segunda estrella del plan.
      narrative_beat: Zara Vex ayuda a Liruf a escribir la descripción de su producto en la segunda estrella
        de su plan.
      difficulty: 2
      suggested_families:
      - input
      - arrange
    - position: 4
      slug: mi-producto-listo-en-el-plan
      micro_objective: Revisar y confirmar que el producto escrito en el plan conecta con la idea principal.
      narrative_beat: Dina revisa su producto escrito en el plan y confirma que conecta bien con la idea
        principal de la primera estrella.
      difficulty: 3
      suggested_families:
      - choice
      - input
  - position: 4
    slug: mi-cliente-en-el-plan
    title_es: Mi cliente en el plan
    concept: Describir quién es el cliente ideal del producto es la tercera estrella del plan completo.
    learning_objective: Al final, el niño puede describir a su cliente ideal dentro de un plan de mini-empresa.
    key_vocabulary:
    - cliente
    - ideal
    - describir
    - producto
    prior_knowledge: Sabe describir su producto en el plan (tema anterior).
    parent_check: "¿{{name}} puede describirte quién sería el cliente ideal para su producto?"
    fact_refs: []
    lessons:
    - position: 1
      slug: quien-querria-mi-producto
      micro_objective: Pensar en quién querría de verdad el producto propio.
      narrative_beat: Liruf piensa en quién, del cosmos entero, querría de verdad el producto que está
        planeando.
      difficulty: 1
      suggested_families:
      - story
      - choice
    - position: 2
      slug: describir-a-mi-cliente-ideal
      micro_objective: Describir al cliente ideal con detalles concretos, como su edad o su necesidad principal.
      narrative_beat: Dr. Rho ayuda a Dina a describir a su cliente ideal, con su edad y su necesidad principal.
      difficulty: 2
      suggested_families:
      - input
      - analyze
    - position: 3
      slug: escribir-mi-cliente-en-la-tercera-estrella
      micro_objective: Escribir la descripción del cliente ideal en la tercera estrella del plan.
      narrative_beat: Zara Vex ayuda a Liruf a escribir la descripción de su cliente ideal en la tercera
        estrella de su plan.
      difficulty: 2
      suggested_families:
      - input
      - arrange
    - position: 4
      slug: mi-cliente-listo-en-el-plan
      micro_objective: Revisar y confirmar que el cliente escrito en el plan de verdad necesita el producto
        descrito.
      narrative_beat: Dina revisa su cliente escrito en el plan y confirma que de verdad necesita el producto
        que describió.
      difficulty: 3
      suggested_families:
      - choice
      - input
  - position: 5
    slug: mi-precio-en-el-plan
    title_es: Mi precio en el plan
    concept: Calcular y anotar un precio justo, con su ganancia, es la cuarta estrella del plan completo.
    learning_objective: Al final, el niño puede calcular y anotar un precio justo con su ganancia dentro
      de un plan.
    key_vocabulary:
    - precio
    - ganancia
    - calcular
    - anotar
    prior_knowledge: Sabe describir a su cliente ideal en el plan (tema anterior).
    prerequisites:
    - path: el-reino-de-las-ventas/vender-con-honestidad/un-precio-justo-para-mi-producto
      strength: hard
      reason: "El plan completo reutiliza directamente el cálculo de ganancia (precio menos costo) que el niño ya practicó al fijar el precio de su primer producto en el reino."
    parent_check: "¿{{name}} puede calcular el precio justo de su producto, incluyendo el costo y la ganancia?"
    fact_refs:
    - business.math.formula_ganancia
    - business.math.ejemplo_ganancia_15_10
    lessons:
    - position: 1
      slug: cuanto-cuesta-mi-producto
      micro_objective: Calcular el costo total de hacer el producto propio.
      narrative_beat: Liruf calcula, con ayuda de Zara Vex, cuánto le cuesta en total hacer su producto
        para el cosmos.
      difficulty: 1
      suggested_families:
      - money
      - input
    - position: 2
      slug: calcular-la-ganancia-de-mi-plan
      micro_objective: Calcular la ganancia esperada restando el costo del precio de venta propuesto, por
        ejemplo $15 - $10 = $5.
      narrative_beat: Dr. Rho ayuda a Dina a calcular la ganancia de su plan, vendiendo su producto en
        $15 con un costo de $10.
      difficulty: 2
      suggested_families:
      - money
      - input
    - position: 3
      slug: escribir-mi-precio-en-la-cuarta-estrella
      micro_objective: Escribir el precio, el costo y la ganancia calculados en la cuarta estrella del
        plan.
      narrative_beat: Zara Vex ayuda a Liruf a escribir su precio, su costo y su ganancia en la cuarta estrella
        de su plan.
      difficulty: 2
      suggested_families:
      - money
      - arrange
    - position: 4
      slug: mi-precio-listo-en-el-plan
      micro_objective: Revisar y confirmar que el precio escrito en el plan es justo para el cliente descrito.
      narrative_beat: Dina revisa su precio escrito en el plan y confirma que es justo para el cliente
        que describió antes.
      difficulty: 3
      suggested_families:
      - choice
      - money
  - position: 6
    slug: mi-venta-en-el-plan
    title_es: Mi venta en el plan
    concept: Describir cómo y dónde se venderá el producto es la quinta estrella del plan completo.
    learning_objective: Al final, el niño puede describir cómo y dónde venderá su producto dentro de un
      plan.
    key_vocabulary:
    - venta
    - cómo
    - dónde
    - describir
    prior_knowledge: Sabe calcular su precio justo en el plan (tema anterior).
    parent_check: "¿{{name}} puede describirte cómo y dónde planea vender su producto?"
    fact_refs: []
    lessons:
    - position: 1
      slug: donde-podria-vender
      micro_objective: Pensar en lugares posibles donde se podría vender el producto propio.
      narrative_beat: Liruf piensa en distintos lugares del cosmos donde podría instalar su puesto para
        vender.
      difficulty: 1
      suggested_families:
      - story
      - choice
    - position: 2
      slug: como-atraere-a-mi-cliente
      micro_objective: Describir cómo se dará a conocer el producto al cliente ideal, usando lo aprendido
        sobre el pitch.
      narrative_beat: Dr. Rho ayuda a Dina a pensar cómo dará a conocer su producto a su cliente ideal.
      difficulty: 2
      suggested_families:
      - choice
      - storyplay
    - position: 3
      slug: escribir-mi-venta-en-la-quinta-estrella
      micro_objective: Escribir cómo y dónde se venderá el producto en la quinta estrella del plan.
      narrative_beat: Zara Vex ayuda a Liruf a escribir cómo y dónde venderá su producto en la quinta estrella
        de su plan.
      difficulty: 2
      suggested_families:
      - input
      - arrange
    - position: 4
      slug: mi-venta-lista-en-el-plan
      micro_objective: Revisar y confirmar que el plan de venta conecta bien con el cliente y el lugar
        descritos.
      narrative_beat: Dina revisa su plan de venta y confirma que conecta bien con el cliente y el lugar
        que había descrito.
      difficulty: 3
      suggested_families:
      - choice
      - input
  - position: 7
    slug: mi-equipo-en-el-plan
    title_es: Mi equipo en el plan
    concept: Describir quién forma el equipo y qué rol tiene cada quien es la sexta y última estrella del
      plan completo.
    learning_objective: Al final, el niño puede describir su equipo y los roles de cada quien dentro de
      un plan.
    key_vocabulary:
    - equipo
    - rol
    - describir
    - última
    prior_knowledge: Sabe describir cómo y dónde venderá su producto en el plan (tema anterior).
    parent_check: "¿{{name}} puede describirte quién formaría su equipo y qué haría cada quien?"
    fact_refs: []
    lessons:
    - position: 1
      slug: quien-me-podria-ayudar
      micro_objective: Pensar en quién podría formar parte del equipo del proyecto propio.
      narrative_beat: Liruf piensa en quién del cosmos podría ayudarlo a formar un equipo para su proyecto.
      difficulty: 1
      suggested_families:
      - story
      - choice
    - position: 2
      slug: pensar-en-roles-segun-talentos
      micro_objective: Pensar en un rol posible para cada integrante del equipo, según su talento.
      narrative_beat: Dr. Rho ayuda a Dina a pensar en un rol para cada integrante de su equipo, según
        el talento de cada quien.
      difficulty: 2
      suggested_families:
      - choice
      - arrange
    - position: 3
      slug: escribir-mi-equipo-en-la-sexta-estrella
      micro_objective: Escribir el equipo y los roles de cada quien en la sexta estrella del plan.
      narrative_beat: Zara Vex ayuda a Liruf a escribir su equipo y los roles de cada quien en la sexta
        estrella de su plan.
      difficulty: 2
      suggested_families:
      - input
      - arrange
    - position: 4
      slug: mi-equipo-listo-en-el-plan
      micro_objective: Revisar y confirmar que cada rol escrito en el plan tiene sentido para el proyecto
        completo.
      narrative_beat: Dina revisa su equipo escrito en el plan y confirma que cada rol tiene sentido para
        todo el proyecto.
      difficulty: 3
      suggested_families:
      - choice
      - input
  - position: 8
    slug: mi-plan-completo-de-mini-empresa
    title_es: Mi plan completo de mini-empresa
    concept: Reunir las seis estrellas -idea, producto, cliente, precio, venta y equipo- en un solo plan
      completo y coherente.
    learning_objective: Al final, el niño puede presentar un plan de mini-empresa completo con sus seis
      partes conectadas.
    key_vocabulary:
    - completo
    - coherente
    - reunir
    - seis
    prior_knowledge: Conoce las seis partes del plan enseñadas en la saga (temas anteriores).
    parent_check: "¿{{name}} puede mostrarte su plan completo de mini-empresa con sus seis partes?"
    fact_refs: []
    lessons:
    - position: 1
      slug: reviso-mis-seis-estrellas
      micro_objective: Revisar juntas las seis estrellas del plan, una por una, antes de unirlas.
      narrative_beat: Con ayuda de Zara Vex, Dina revisa juntas sus seis estrellas del plan, una por una,
        antes de unirlas.
      difficulty: 1
      suggested_families:
      - arrange
      - choice
    - position: 2
      slug: conecto-las-estrellas-entre-si
      micro_objective: Verificar que las seis estrellas del plan se conectan bien entre sí, sin contradicciones.
      narrative_beat: Liruf verifica que sus seis estrellas del plan, de la idea al equipo, se conectan
        bien entre sí.
      difficulty: 2
      suggested_families:
      - analyze
      - arrange
    - position: 3
      slug: encuentro-una-estrella-floja
      micro_objective: Identificar cuál de las seis estrellas del plan necesita más trabajo todavía.
      narrative_beat: Dr. Rho ayuda a Dina a identificar cuál de sus seis estrellas del plan todavía necesita
        más trabajo.
      difficulty: 3
      suggested_families:
      - analyze
      - choice
    - position: 4
      slug: mi-primer-plan-completo
      micro_objective: Presentar el plan completo de mini-empresa con sus seis partes conectadas por primera
        vez.
      narrative_beat: Dina presenta, por primera vez, su plan completo de mini-empresa con las seis estrellas
        conectadas.
      difficulty: 3
      suggested_families:
      - storyplay
      - story
  - position: 9
    slug: el-cofre-del-repaso
    kind: review_spaced
    title_es: El Cofre del Repaso
    concept: Zara Vex abre un cofre del cosmos para poner a prueba, sin enseñar nada nuevo, todo lo aprendido
      en la saga El Plan Completo.
    learning_objective: Al final, el niño puede recordar y aplicar, sin ayuda nueva, los conceptos principales
      de la saga El Plan Completo.
    key_vocabulary:
    - plan
    - idea
    - precio
    - equipo
    prior_knowledge: Ha completado los ocho temas de la saga El Plan Completo (aventura 8, saga 1).
    fact_refs: []
    review_of:
    - el-cosmos-del-founder/el-plan-completo/que-es-un-plan-de-mini-empresa
    - el-cosmos-del-founder/el-plan-completo/mi-idea-en-el-plan
    - el-cosmos-del-founder/el-plan-completo/mi-producto-en-el-plan
    - el-cosmos-del-founder/el-plan-completo/mi-cliente-en-el-plan
    - el-cosmos-del-founder/el-plan-completo/mi-precio-en-el-plan
    - el-cosmos-del-founder/el-plan-completo/mi-venta-en-el-plan
    - el-cosmos-del-founder/el-plan-completo/mi-equipo-en-el-plan
    - el-cosmos-del-founder/el-plan-completo/mi-plan-completo-de-mini-empresa
    lessons:
    - position: 1
      slug: el-cofre-se-abre
      micro_objective: Recordar, sin ayuda nueva, qué es un plan de mini-empresa y cómo escribir la idea
        principal.
      narrative_beat: Zara Vex abre el cofre del cosmos y reta a Dina a recordar, estrella por estrella,
        lo primero que aprendió en esta saga.
      difficulty: 1
      suggested_families:
      - story
      - choice
    - position: 2
      slug: recordar-en-orden
      micro_objective: Recordar y ordenar de nuevo cómo describir el producto y cómo describir al cliente
        ideal.
      narrative_beat: Liruf saca del cofre las estrellas mezcladas de la saga y las ordena de memoria, sin
        que Dr. Rho le dé ninguna pista nueva.
      difficulty: 1
      suggested_families:
      - arrange
      - choice
    - position: 3
      slug: aplicar-lo-guardado
      micro_objective: Aplicar de nuevo, en una escena distinta, lo aprendido sobre calcular el precio
        justo y describir la venta.
      narrative_beat: Dr. Rho presenta una escena nueva del cosmos y pregunta a Dina si recuerda, sin repasar
        la lección, qué haría en ese caso.
      difficulty: 2
      suggested_families:
      - choice
      - money
    - position: 4
      slug: cerrar-el-cofre
      micro_objective: Aplicar en conjunto todo lo repasado de la saga, incluyendo cómo reunir las seis
        estrellas en un plan completo, para cerrar el cofre.
      narrative_beat: Antes de cerrar el cofre, Dina demuestra que recuerda toda la saga uniendo cada estrella
        con la lección que le corresponde.
      difficulty: 2
      suggested_families:
      - choice
      - storyplay
  - position: 10
    slug: reto-entrelazado
    kind: review_interleaved
    title_es: Reto Entrelazado
    concept: Zara Vex mezcla lo aprendido en El Plan Completo con Cuidar Recursos y Aprender de Errores
      del faro, en un reto que combina planear con cuidado y aprender de lo que no funciona.
    learning_objective: Al final, el niño puede recordar y combinar un concepto de El Plan Completo con
      un concepto de una aventura anterior.
    key_vocabulary:
    - recordar
    - combinar
    - aplicar
    - plan
    prior_knowledge: Conoce El Plan Completo (saga 1, aventura 8) y Cuidar Recursos y Aprender de Errores
      (aventura 7).
    fact_refs: []
    review_of:
    - el-faro-del-buen-negocio/cuidar-recursos-y-aprender-de-errores/que-son-los-recursos-de-un-negocio
