schema_version: 1
adventure:
  position: 1
  slug: la-isla-de-las-ideas
  theme: archipelago
  age_tier: tier1
  title:
    en-US: The Island of Ideas
    es-MX: La Isla de las Ideas
    pt-BR: A Ilha das Ideias
  description:
    en-US: Sail to a new island where everyday problems hide in plain sight, and every problem noticed is the seed of a helpful idea.
    es-MX: Navega a una isla nueva donde los problemas cotidianos se esconden a la vista de todos, y cada problema notado es la semilla de una idea que ayuda.
    pt-BR: Navegue até uma nova ilha onde os problemas do dia a dia se escondem à vista de todos, e cada problema percebido é a semente de uma ideia que ajuda.
  narrative_arc: "Después de aprender a cuidar el dinero en el archipiélago del trueque, Dina, Dino, Rho y Zara llegan a una isla nueva llena de pequeños problemas que nadie ha resuelto: un puente que rechina, una fuente sin sombra, un carrito que se atora en la arena. Zara descubre que cada problema notado puede convertirse en una idea que ayude a alguien, Rho investiga preguntando a los isleños antes de suponer nada, y Dino aprende que las mejores ideas nacen de combinar chispas sencillas. Juntos preparan su entrada para la Gran Feria de Inventos de la isla, la primera parada de su viaje como pequeños emprendedores."
sagas:
  - position: 1
    slug: ojos-que-notan
    icon: visibility
    title:
      en-US: Eyes That Notice
      es-MX: Ojos que Notan
      pt-BR: Olhos que Percebem
    description:
      en-US: Learn to spot everyday problems hiding in plain sight — the very first step of every idea.
      es-MX: "Aprende a detectar problemas cotidianos que están a la vista de todos: el primer paso de toda idea."
      pt-BR: "Aprenda a identificar problemas do dia a dia que estão à vista de todos: o primeiro passo de toda ideia."
    topics:
      - position: 1
        slug: algo-no-funciona-bien
        title_es: Algo no funciona bien
        concept: Un problema es algo que no funciona como debería o que hace las cosas más difíciles de lo necesario.
        learning_objective: Al final, el niño puede señalar un ejemplo de algo que no funciona bien en una escena.
        key_vocabulary:
          - problema
          - no funciona
          - difícil
          - arreglar
        prior_knowledge: Ninguno — es el punto de partida de esta aventura.
        fact_refs: []
        parent_check: Pídele a {{name}} que señale algo en casa que no funcione bien, como una puerta que rechina, y pregúntale por qué cree que pasa eso.
        lessons:
          - position: 1
            slug: el-puente-que-rechina
            micro_objective: Reconoce en la historia un ejemplo claro de algo que no funciona bien.
            narrative_beat: "Dina cruza un puente de madera en la nueva isla y el crujido la detiene: algo en ese puente no anda bien."
            difficulty: 1
            suggested_families:
              - story
              - choice
          - position: 2
            slug: funciona-o-no-funciona
            micro_objective: Distingue, entre 4 escenas, cuáles muestran algo que no funciona bien.
            narrative_beat: "Dino recorre el muelle señalando objetos: una carretilla atorada, una banca firme, una cubeta rota."
            difficulty: 1
            suggested_families:
              - choice
          - position: 3
            slug: encuentro-tres-problemas
            micro_objective: Encuentra 3 problemas escondidos en una sola escena de la isla.
            narrative_beat: Rho examina con su lupa la plaza del pueblo y descubre tres cosas que no funcionan como deberían.
            difficulty: 2
            suggested_families:
              - choice
              - arrange
          - position: 4
            slug: mi-primer-problema-notado
            micro_objective: Elige y describe con una frase el primer problema que notó en la isla.
            narrative_beat: Zara anota en su libreta el primer problema que decidió mirar de cerca.
            difficulty: 2
            suggested_families:
              - storyplay
              - choice
      - position: 2
        slug: eso-me-incomoda-a-mi
        title_es: Eso me incomoda a mí
        concept: "Algunos problemas los siento yo mismo: algo que me cuesta trabajo, me toma mucho tiempo o me hace sentir incómodo."
        learning_objective: Al final, el niño puede nombrar un problema que le incomoda a él o ella misma.
        key_vocabulary:
          - incomodar
          - a mí
          - me cuesta
          - molesto
        prior_knowledge: Reconoce ejemplos de algo que no funciona bien (tema anterior).
        fact_refs: []
        parent_check: Pregúntale a {{name}} qué tarea de todos los días le resulta incómoda o difícil de hacer solo.
        lessons:
          - position: 1
            slug: mis-sandalias-se-atoran
            micro_objective: Reconoce en la historia un problema que le pasa directamente al personaje.
            narrative_beat: A Dino se le atoran las sandalias en la arena cada vez que corre por la playa de la isla.
            difficulty: 1
            suggested_families:
              - story
              - choice
          - position: 2
            slug: molesto-para-mi-o-para-otro
            micro_objective: Distingue si un problema mostrado le incomoda al personaje mismo o a alguien más.
            narrative_beat: "Zara compara dos escenas: una donde a ella le molesta algo, y otra donde le molesta a un isleño."
            difficulty: 1
            suggested_families:
              - choice
          - position: 3
            slug: cuento-mi-incomodidad
            micro_objective: Elige, entre 3 opciones, la palabra que mejor describe su propia incomodidad.
            narrative_beat: Rho anota cómo se siente cuando algo le cuesta demasiado trabajo cada mañana.
            difficulty: 2
            suggested_families:
              - choice
              - input
          - position: 4
            slug: identifico-mi-propio-problema
            micro_objective: Nombra, sin ayuda, un problema personal dentro de una escena nueva.
            narrative_beat: Dina se sienta con la tripulación a compartir qué le incomoda a cada quien en su día en la isla.
            difficulty: 2
            suggested_families:
              - storyplay
              - choice
      - position: 3
        slug: eso-incomoda-a-otros
        title_es: Eso incomoda a otros
        concept: Un problema también puede ser algo que le pasa a otra persona, aunque a mí no me afecte directamente.
        learning_objective: Al final, el niño puede identificar un problema que le pasa a otra persona, distinto al propio.
        key_vocabulary:
          - otra persona
          - le pasa a
          - ajeno
          - fijarse
        prior_knowledge: Sabe nombrar un problema propio (tema anterior).
        fact_refs: []
        parent_check: La próxima vez que vean a alguien batallando con algo (cargando bolsas pesadas, por ejemplo), pregúntale a {{name}} qué problema nota en esa persona.
        lessons:
          - position: 1
            slug: el-abuelo-y-las-bolsas-pesadas
            micro_objective: Reconoce en la historia un problema que le pasa a un personaje distinto al protagonista.
            narrative_beat: Dina ve a un isleño mayor cargando bolsas pesadas cuesta arriba y se detiene a mirar.
            difficulty: 1
            suggested_families:
              - story
              - choice
          - position: 2
            slug: mio-o-de-otro
            micro_objective: Clasifica 4 problemas entre 'me pasa a mí' y 'le pasa a otra persona'.
            narrative_beat: "Rho separa en dos columnas los problemas que ha visto: los suyos y los de otros isleños."
            difficulty: 1
            suggested_families:
              - arrange
              - choice
          - position: 3
            slug: me-fijo-en-los-demas
            micro_objective: Ordena 3 escenas según qué tan claramente muestran un problema ajeno.
            narrative_beat: Zara observa con calma a tres isleños distintos buscando quién parece tener más dificultad.
            difficulty: 2
            suggested_families:
              - arrange
          - position: 4
            slug: noto-un-problema-que-no-es-mio
            micro_objective: Describe, sin ayuda, un problema ajeno notado en una escena nueva de la isla.
            narrative_beat: Dino cuenta a la tripulación el problema de un isleño que conoció esa tarde, aunque a él no le afecte.
            difficulty: 2
            suggested_families:
              - storyplay
              - story
      - position: 4
        slug: un-problema-chico-y-uno-grande
        title_es: Un problema chico y uno grande
        concept: "No todos los problemas pesan igual: algunos son pequeñas molestias y otros afectan mucho más a alguien."
        learning_objective: Al final, el niño puede comparar dos problemas y decir cuál parece más grande.
        key_vocabulary:
          - chico
          - grande
          - afecta más
          - comparar
        prior_knowledge: Reconoce problemas propios y ajenos (temas anteriores).
        fact_refs: []
        parent_check: Muéstrale a {{name}} dos molestias distintas (un lápiz roto y no tener agua para tomar) y pregúntale cuál le parece más grande y por qué.
        lessons:
          - position: 1
            slug: un-lapiz-roto-y-un-techo-goteando
            micro_objective: Compara dos problemas mostrados y reconoce cuál afecta más a alguien.
            narrative_beat: Rho compara un lápiz roto con un techo que gotea sobre la cama de un isleño.
            difficulty: 1
            suggested_families:
              - choice
              - story
          - position: 2
            slug: elijo-el-problema-mas-grande
            micro_objective: Elige, entre 3 problemas, cuál parece el más grande para quien lo vive.
            narrative_beat: Zara escucha tres quejas distintas en el mercado y decide cuál le preocupa más.
            difficulty: 1
            suggested_families:
              - choice
          - position: 3
            slug: ordeno-problemas-por-tamano
            micro_objective: Ordena 4 problemas de menor a mayor según qué tanto afectan a alguien.
            narrative_beat: Dino ordena en su libreta los problemas de la isla, del más chico al más grande.
            difficulty: 2
            suggested_families:
              - arrange
          - position: 4
            slug: explico-por-que-es-grande
            micro_objective: Explica en una frase por qué eligió un problema como el más grande de una escena.
            narrative_beat: Dina reúne a la tripulación para explicar por qué el problema del techo que gotea le parece urgente.
            difficulty: 2
            suggested_families:
              - story
              - choice
      - position: 5
        slug: le-pongo-nombre-a-mi-problema
        title_es: Le pongo nombre a mi problema
        concept: Decir un problema con palabras claras y cortas ayuda a que otros lo entiendan y a pensar mejor en cómo resolverlo.
        learning_objective: Al final, el niño puede describir un problema en una frase corta y clara.
        key_vocabulary:
          - nombrar
          - frase corta
          - claro
          - describir
        prior_knowledge: Sabe comparar el tamaño de dos problemas (tema anterior).
        fact_refs: []
        parent_check: Pídele a {{name}} que te diga, en una sola frase corta, cuál es el problema que más le gustaría resolver esta semana.
        lessons:
          - position: 1
            slug: una-frase-para-mi-problema
            micro_objective: Reconoce en la historia una frase corta y clara que nombra un problema.
            narrative_beat: Rho practica decir 'el puente rechina cuando alguien cruza' en vez de hablar y hablar sin llegar al punto.
            difficulty: 1
            suggested_families:
              - story
              - choice
          - position: 2
            slug: frase-clara-o-confusa
            micro_objective: Elige, entre 2 frases, cuál describe el problema de forma más clara.
            narrative_beat: Zara compara dos formas de contar el mismo problema y nota que una se entiende mejor.
            difficulty: 1
            suggested_families:
              - choice
          - position: 3
            slug: completo-la-frase-del-problema
            micro_objective: Completa una frase corta que nombra un problema usando las palabras clave correctas.
            narrative_beat: Dino arma con tarjetas de palabras una frase que describe el problema del carrito atorado.
            difficulty: 2
            suggested_families:
              - input
              - choice
          - position: 4
            slug: digo-mi-problema-en-voz-alta
            micro_objective: Dice, sin ayuda, su propio problema en una frase corta frente a la tripulación.
            narrative_beat: Dina anima a cada quien a decir en voz alta, en una sola frase, el problema que quiere resolver.
            difficulty: 2
            suggested_families:
              - storyplay
              - story
      - position: 6
        slug: problemas-que-se-repiten
        title_es: Problemas que se repiten
        concept: Un problema que le pasa a muchas personas, o que pasa una y otra vez, suele valer más la pena resolver.
        learning_objective: Al final, el niño puede reconocer cuándo un problema se repite y por qué eso lo hace importante.
        key_vocabulary:
          - se repite
          - muchas veces
          - a muchos
          - vale la pena
        prior_knowledge: Sabe nombrar un problema en una frase clara (tema anterior).
        fact_refs: []
        parent_check: Pregúntale a {{name}} si el problema que eligió le pasa solo una vez o si se repite seguido, y por qué eso importa.
        lessons:
          - position: 1
            slug: el-mismo-problema-otra-vez
            micro_objective: Reconoce en la historia que un problema le ha pasado a un personaje más de una vez.
            narrative_beat: Rho nota que el mismo carrito se atora en la arena todos los días de mercado, no solo una vez.
            difficulty: 1
            suggested_families:
              - story
              - choice
          - position: 2
            slug: le-pasa-a-uno-o-a-muchos
            micro_objective: Distingue, entre 4 escenas, cuáles muestran un problema que le pasa a varias personas.
            narrative_beat: Zara pregunta en la plaza y descubre que tres isleños distintos se quejan del mismo puente.
            difficulty: 1
            suggested_families:
              - choice
          - position: 3
            slug: cuento-cuantas-veces-pasa
            micro_objective: Ordena 3 problemas según qué tan seguido se repiten.
            narrative_beat: Dino lleva la cuenta de cuántas veces en la semana ha visto el mismo problema del puente.
            difficulty: 2
            suggested_families:
              - arrange
          - position: 4
            slug: elijo-el-problema-que-mas-vale-la-pena
            micro_objective: Elige, entre 3 problemas notados, cuál parece más importante por repetirse o afectar a más gente.
            narrative_beat: Dina reúne a la tripulación para decidir, entre todo lo notado, cuál problema vale más la pena mirar de cerca.
            difficulty: 3
            suggested_families:
              - choice
              - storyplay
      - position: 7
        slug: cofre-del-repaso-de-ojos-que-notan
        kind: review_spaced
        review_of:
          - la-isla-de-las-ideas/ojos-que-notan/algo-no-funciona-bien
          - la-isla-de-las-ideas/ojos-que-notan/eso-me-incomoda-a-mi
          - la-isla-de-las-ideas/ojos-que-notan/eso-incomoda-a-otros
          - la-isla-de-las-ideas/ojos-que-notan/un-problema-chico-y-uno-grande
          - la-isla-de-las-ideas/ojos-que-notan/le-pongo-nombre-a-mi-problema
          - la-isla-de-las-ideas/ojos-que-notan/problemas-que-se-repiten
        title_es: El Cofre del Repaso de Ojos que Notan
        concept: Antes de seguir explorando, la tripulación abre un cofre de recuerdos y repasa todo lo aprendido sobre notar problemas.
        learning_objective: Al final, el niño recuerda y usa, sin nueva enseñanza, los conceptos de esta saga sobre notar problemas.
        key_vocabulary:
          - problema
          - incomoda
          - comparar
          - nombrar
        prior_knowledge: Completó los 6 temas de Ojos que Notan.
        fact_refs: []
        lessons:
          - position: 1
            slug: abro-el-cofre-de-problemas
            micro_objective: Recuerda y nombra, sin ayuda, un problema notado durante esta saga.
            narrative_beat: Rho encuentra un cofre de madera con recuerdos de todos los problemas que la tripulación ha notado.
            difficulty: 1
            suggested_families:
              - story
              - choice
          - position: 2
            slug: recuerdo-un-problema-ajeno
            micro_objective: Recuerda y describe, sin ayuda, un problema que le pasó a otra persona.
            narrative_beat: Zara saca del cofre el recuerdo del abuelo isleño con las bolsas pesadas.
            difficulty: 1
            suggested_families:
              - story
              - choice
          - position: 3
            slug: elijo-el-problema-mas-grande-del-cofre
            micro_objective: Elige, entre 2 problemas recordados, cuál parecía más grande.
            narrative_beat: Dino compara dos recuerdos del cofre y decide cuál problema afectaba más a los isleños.
            difficulty: 2
            suggested_families:
              - choice
          - position: 4
            slug: cierro-el-cofre-listo-para-mas-ideas
            micro_objective: "Aplica sin ayuda lo recordado: nombra en una frase clara un problema que se repite."
            narrative_beat: "Dina cierra el cofre: la tripulación está lista para convertir problemas en ideas."
            difficulty: 2
            suggested_families:
              - storyplay
              - choice
      - position: 8
        slug: reto-entrelazado-de-ojos-que-notan
        kind: review_interleaved
        review_of:
          - la-isla-de-las-ideas/ojos-que-notan/eso-incomoda-a-otros
          - la-isla-de-las-ideas/ojos-que-notan/un-problema-chico-y-uno-grande
          - la-isla-de-las-ideas/ojos-que-notan/le-pongo-nombre-a-mi-problema
          - la-isla-de-las-ideas/ojos-que-notan/problemas-que-se-repiten
        title_es: Reto Entrelazado de Ojos que Notan
        concept: Mezclamos ideas de distintos momentos de esta saga para pensarlas juntas.
        learning_objective: Al final, el niño combina, sin nueva enseñanza, ideas de al menos dos temas distintos de esta saga.
        key_vocabulary:
          - problema
          - comparar
          - nombrar
          - se repite
        prior_knowledge: Completó El Cofre del Repaso de Ojos que Notan (tema anterior).
        fact_refs: []
        lessons:
          - position: 1
            slug: un-problema-ajeno-y-grande
            micro_objective: Combina, en una sola escena, un problema ajeno con su tamaño de importancia.
            narrative_beat: Rho arma una escena mezclando el problema del abuelo isleño con qué tan grande parece.
            difficulty: 2
            suggested_families:
              - story
              - choice
          - position: 2
            slug: nombro-y-comparo-a-la-vez
            micro_objective: Nombra en una frase clara un problema y lo compara con otro en tamaño.
            narrative_beat: Zara nombra dos problemas de la isla en frases claras y decide cuál pesa más.
            difficulty: 2
            suggested_families:
              - choice
              - arrange
          - position: 3
            slug: cuento-y-nombro-un-problema-repetido
            micro_objective: Ordena y nombra, combinando ambos temas, un problema que se repite muchas veces.
            narrative_beat: Dino ordena sus notas del problema del puente y lo nombra en una frase clara.
            difficulty: 2
            suggested_families:
              - arrange
              - story
          - position: 4
            slug: elijo-mi-problema-para-seguir
            micro_objective: Elige, sin ayuda, el problema más importante de la saga combinando tamaño y repetición.
            narrative_beat: Dina cierra el reto entrelazado eligiendo el problema que la tripulación llevará a la siguiente isla.
            difficulty: 2
            suggested_families:
              - storyplay
              - choice
  - position: 2
    slug: ideas-que-ayudan
    icon: lightbulb
    title:
      en-US: Ideas That Help
      es-MX: Ideas que Ayudan
      pt-BR: Ideias que Ajudam
    description:
      en-US: Turn a noticed problem into an idea that truly helps someone.
      es-MX: Convierte un problema notado en una idea que de verdad ayude a alguien.
      pt-BR: Transforme um problema percebido em uma ideia que realmente ajude alguém.
    topics:
      - position: 1
        slug: de-problema-a-idea
        title_es: De problema a idea
        concept: Una idea nace cuando pienso una posible forma de resolver un problema que noté.
        learning_objective: Al final, el niño puede proponer una idea simple para resolver un problema mostrado.
        key_vocabulary:
          - idea
          - resolver
          - posible
          - pensar
        prior_knowledge: Sabe notar y nombrar problemas (saga anterior).
        fact_refs: []
        parent_check: Cuando {{name}} note un problema, pregúntale si se le ocurre alguna idea, por sencilla que sea, para resolverlo.
        lessons:
          - position: 1
            slug: mi-primera-idea
            micro_objective: Reconoce en la historia una idea simple que responde a un problema notado.
            narrative_beat: "Zara mira el puente que rechina y dice: '¿y si le ponemos algo suave debajo de la madera?'"
            difficulty: 1
            suggested_families:
              - story
              - choice
          - position: 2
            slug: idea-o-solo-queja
            micro_objective: Distingue, entre 4 frases, cuáles son ideas y cuáles son solo quejas sobre el problema.
            narrative_beat: Rho separa las quejas de los isleños de las primeras ideas para resolverlas.
            difficulty: 1
            suggested_families:
              - choice
          - position: 3
            slug: uno-un-problema-con-su-idea
            micro_objective: Empareja 3 problemas con la idea que podría resolver cada uno.
            narrative_beat: Dino conecta con cordeles cada problema del pizarrón con su posible idea.
            difficulty: 2
            suggested_families:
              - arrange
              - choice
          - position: 4
            slug: mi-idea-para-el-puente
            micro_objective: Propone, sin ayuda, una idea simple para un problema nuevo de la historia.
            narrative_beat: Dina anima a la tripulación a proponer su primera idea para el puente que rechina.
            difficulty: 2
            suggested_families:
              - storyplay
              - story
      - position: 2
        slug: una-idea-ayuda-a-alguien
        title_es: Una idea ayuda a alguien
        concept: Una buena idea de negocio ayuda a una persona real, no solo suena divertida.
        learning_objective: Al final, el niño puede explicar a quién ayudaría una idea propuesta.
        key_vocabulary:
          - ayudar
          - persona real
          - quién
          - útil
        prior_knowledge: Sabe proponer una idea simple (tema anterior).
        fact_refs: []
        parent_check: Pregúntale a {{name}} a quién ayudaría su idea favorita, y si esa persona la necesita de verdad.
        lessons:
          - position: 1
            slug: la-idea-que-si-ayuda
            micro_objective: Reconoce en la historia a la persona concreta que una idea ayuda.
            narrative_beat: Zara propone una sombrilla de tela para la señora que vende fruta bajo el sol.
            difficulty: 1
            suggested_families:
              - story
              - choice
          - position: 2
            slug: idea-util-o-solo-divertida
            micro_objective: Distingue, entre 4 ideas, cuáles ayudan a alguien y cuáles solo son divertidas sin resolver nada.
            narrative_beat: Rho compara una idea que resuelve un problema con otra que solo hace ruido y colores.
            difficulty: 1
            suggested_families:
              - choice
          - position: 3
            slug: quien-recibe-la-ayuda
            micro_objective: Identifica, entre 3 personajes, quién recibiría la ayuda de una idea mostrada.
            narrative_beat: Dino pregunta uno por uno a los isleños quién se beneficiaría de la nueva idea del carrito.
            difficulty: 2
            suggested_families:
              - choice
              - story
          - position: 4
            slug: explico-a-quien-ayuda-mi-idea
            micro_objective: Explica, sin ayuda, a quién ayudaría su propia idea y por qué.
            narrative_beat: Dina cuenta a la tripulación a quién ayudaría su idea antes de seguir explorando.
            difficulty: 2
            suggested_families:
              - storyplay
              - choice
      - position: 3
        slug: muchas-ideas-para-un-problema
        title_es: Muchas ideas para un problema
        concept: Para un mismo problema puedo pensar más de una idea, y eso me da más opciones para elegir.
        learning_objective: Al final, el niño puede generar más de una idea posible para el mismo problema.
        key_vocabulary:
          - varias ideas
          - opciones
          - pensar más
          - elegir
        prior_knowledge: Sabe a quién ayuda una idea (tema anterior).
        fact_refs: []
