schema_version: 1

adventure:
  position: 3
  slug: mesa-del-cliente
  theme: archipelago
  age_tier: tier4
  title:
    en-US: "The Customer Table"
    es-MX: "Mesa del Cliente"
    pt-BR: "Mesa do Cliente"
  description:
    en-US: "Across the Archipelago of Voices, the crew learns to interview real people, find real patterns, and change their product with real signal - not guesses."
    es-MX: "A través del Archipielago de las Voces, el equipo aprende a entrevistar gente real, encontrar patrones reales y cambiar su producto con señal real, no con suposiciónes."
    pt-BR: "Atraves do Arquipelago das Vozes, a equipe aprende a entrevistar pessoas reais, encontrar padroes reais e mudar seu produto com sinal real, nao com suposicoes."
  narrative_arc: "Dina, Liruf, Rho y Zara llegan al Archipielago de las Voces, donde cada isla representa a un grupo distinto de clientes posibles. Ahí aprenden que construir el MVP fue solo el principio: ahora deben sentarse a la mesa del cliente, escuchar de verdad, y resistir la tentación de cambiarlo todo por un solo comentario o de no cambiar nada por miedo a equivocarse. Al final, cada equipo debe presentar ante la Gran Asamblea una decisión de producto respaldada por evidencia real, no por corazonadas."

sagas:
  - position: 1
    slug: preparo-mi-entrevista
    icon: assignment
    title:
      en-US: "Preparing My Interview"
      es-MX: "Preparo mi Entrevista"
      pt-BR: "Preparo minha Entrevista"
    description:
      en-US: "A good interview starts long before the first question - with a clear goal and an honest script."
      es-MX: "Una buena entrevista empieza mucho antes de la primera pregunta: con un objetivo claro y un guion honesto."
      pt-BR: "Uma boa entrevista comeca muito antes da primeira pergunta: com um objetivo claro e um roteiro honesto."
    topics:
        - position: 1
          slug: objetivo-de-la-entrevista
          title_es: "Objetivo de la entrevista"
          concept: "Antes de hablar con nadie, hay que saber exactamente que quieres aprender de esa conversación."
          learning_objective: "El aprendiz redacta un objetivo claro (que quiero aprender) antes de diseñar las preguntas de una entrevista."
          key_vocabulary: [objetivo de entrevista, que quiero aprender, antes de preguntar]
          prior_knowledge: "Completo Prototipo de Garage (aventura anterior): ya tiene un MVP construido."
          fact_refs: []
          parent_check: "Preguntale a {{name}} que es exactamente lo que quiere aprender antes de su próxima entrevista, no solo si le va a ir bien."
          lessons:
            - position: 1
              slug: quiero-vender-o-quiero-aprender
              micro_objective: "Distingue, entre dos objetivos de entrevista, cual busca aprender de verdad y cual solo busca confirmar que le compren."
              narrative_beat: "Liruf quiere entrevistar solo para que le digan que si a su idea; Rho le explica que el objetivo es aprender, no vender."
              difficulty: 1
              suggested_families: [choice, analyze]
            - position: 2
              slug: escribo-que-quiero-aprender
              micro_objective: "Redacta, sin ayuda, el objetivo de aprendizaje de una entrevista sobre su propio MVP."
              narrative_beat: "Zara escribe en su libreta: \"quiero aprender si de verdad usarian mi estuche todos los días, no solo una vez\"."
              difficulty: 2
              suggested_families: [storyplay, choice]
        - position: 2
          slug: preguntas-que-no-dirigen
          title_es: "Preguntas que no dirigen"
          concept: "Una pregunta bien hecha no sugiere la respuesta que quieres escuchar; deja que la persona conteste con sus propias palabras."
          learning_objective: "El aprendiz reescribe una pregunta que dirige la respuesta en una versión abierta y neutral."
          key_vocabulary: [pregunta neutral, dirigir la respuesta, palabras propias]
          prior_knowledge: "Redacta un objetivo de entrevista (tema anterior)."
          fact_refs: []
          parent_check: "Revisa junto a {{name}} una de sus preguntas de entrevista y decidan juntos si empuja la respuesta o de verdad la deja abierta."
          lessons:
            - position: 1
              slug: esta-pregunta-empuja-la-respuesta
              micro_objective: "Detecta, entre 4 preguntas, cuales empujan una respuesta positiva sin querer."
              narrative_beat: "Rho revisa su lista de preguntas y tacha 'no te encanta mi idea?' porque ya empuja la respuesta que quiere escuchar."
              difficulty: 2
              suggested_families: [choice, analyze]
            - position: 2
              slug: reescribo-mi-pregunta
              micro_objective: "Reescribe, sin ayuda, una pregunta dirigida en una versión abierta y neutral."
              narrative_beat: "Dina cambia 'no crees que esto es util?' por 'cuentame de la última vez que tuviste este problema'."
              difficulty: 3
              suggested_families: [storyplay, choice]
        - position: 3
          slug: a-quien-entrevisto-primero
          title_es: "A quien entrevisto primero"
          concept: "No toda persona disponible es la persona correcta para entrevistar; hay que elegir a quien de verdad vive el problema."
          learning_objective: "El aprendiz elige, entre varios candidatos posibles, a los más relevantes para entrevistar primero según el problema investigado."
          key_vocabulary: [candidato de entrevista, segmento relevante, primero]
          prior_knowledge: "Reescribe preguntas dirigidas (tema anterior)."
          fact_refs: []
          parent_check: "Pregunta a {{name}} a quien, entre toda la gente que conoce, le conviene entrevistar primero porque de verdad vive el problema."
          lessons:
            - position: 1
              slug: quien-vive-el-problema-de-verdad
              micro_objective: "Elige, entre 4 personas posibles, las 2 que de verdad viven el problema que investiga."
              narrative_beat: "Zara descarta a su primo, que nunca ha comprado un estuche personalizado, y elige a compañeros que si compran seguido."
              difficulty: 3
              suggested_families: [choice, analyze]
            - position: 2
              slug: ordeno-mi-lista-de-entrevistados
              micro_objective: "Ordena una lista de 5 candidatos del más relevante al menos relevante para entrevistar primero."
              narrative_beat: "Liruf ordena su lista: primero los que ya compraron algo parecido, al final los que nunca lo han considerado."
              difficulty: 3
              suggested_families: [arrange, analyze]
        - position: 4
          slug: cuantas-personas-necesito
          title_es: "Cuantas personas necesito"
          concept: "Una sola conversación no basta para confiar en un patron; varias conversaciones distintas confirman si de verdad se repite."
          learning_objective: "El aprendiz estima cuantas entrevistas distintas necesita antes de confiar en un hallazgo como patron."
          key_vocabulary: [número de entrevistas, confiar en un patron, repetición]
          prior_knowledge: "Elige a quien entrevistar primero (tema anterior)."
          fact_refs: []
          parent_check: "Pregunta a {{name}} a cuantas personas distintas planea entrevistar antes de confiar en lo que escucho de una sola."
          lessons:
            - position: 1
              slug: una-persona-no-basta
              micro_objective: "Reconoce, en un caso, por que la opinion de una sola persona no es suficiente para decidir algo grande."
              narrative_beat: "Rho esta a punto de cambiar todo su plan por el comentario de un solo amigo; Dina le recuerda que uno no es un patron."
              difficulty: 3
              suggested_families: [story, choice]
            - position: 2
              slug: cuantas-entrevistas-planeo
              micro_objective: "Elige, entre 3 planes, el número razonable de entrevistas distintas antes de confiar en un hallazgo."
              narrative_beat: "Zara planea entrevistar al menos a 6 personas distintas de su segmento antes de sacar cualquier conclusión."
              difficulty: 4
              suggested_families: [choice, input]
        - position: 5
          slug: donde-y-como-la-hago
          title_es: "Donde y como la hago"
          concept: "El lugar y el formato de una entrevista (en persona, por chat, por llamada) cambian que tan comoda se siente la otra persona para hablar con honestidad."
          learning_objective: "El aprendiz elige el formato y lugar más adecuado para una entrevista según quien es la persona entrevistada."
          key_vocabulary: [formato de entrevista, lugar adecuado, comodidad]
          prior_knowledge: "Estima cuantas entrevistas necesita (tema anterior)."
          fact_refs: []
          parent_check: "Pregunta a {{name}} donde y de que forma planea hacer su próxima entrevista, y si ese lugar ayuda a que la otra persona sea honesta."
          lessons:
            - position: 1
              slug: en-persona-o-por-chat
              micro_objective: "Elige, entre dos formatos, el más adecuado según la disponibilidad y comodidad de la persona a entrevistar."
              narrative_beat: "Liruf elige entrevistar por chat a un compañero que vive lejos, y en persona a los que ve todos los días en la escuela."
              difficulty: 4
              suggested_families: [choice, analyze]
            - position: 2
              slug: elijo-un-lugar-sin-presion
              micro_objective: "Elige, entre 3 lugares posibles, el que pondria menos presión social a la persona entrevistada para contestar con honestidad."
              narrative_beat: "Rho decide no entrevistar frente a los amigos del entrevistado, para que no conteste solo por quedar bien frente a ellos."
              difficulty: 4
              suggested_families: [choice, story]
        - position: 6
          slug: ensayo-mi-entrevista
          title_es: "Ensayo mi entrevista"
          concept: "Practicar la entrevista con alguien de confianza antes de la real detecta preguntas confusas o demasiado largas."
          learning_objective: "El aprendiz ensaya un guion de entrevista y detecta al menos una pregunta que necesita ajustarse antes de usarla de verdad."
          key_vocabulary: [ensayo, guion de entrevista, ajustar antes]
          prior_knowledge: "Elige formato y lugar (tema anterior)."
          fact_refs: []
          parent_check: "Pidele a {{name}} que ensaye su guion de entrevista contigo antes de usarlo con alguien que no conoce."
          lessons:
            - position: 1
              slug: mi-pregunta-es-confusa
              micro_objective: "Detecta, en un ensayo, cual pregunta de un guion resulto confusa para la persona que la escucho."
              narrative_beat: "Zara ensaya su guion con su hermano, y el se queda callado en la tercera pregunta porque no entendio que le preguntaba."
              difficulty: 4
              suggested_families: [story, choice]
            - position: 2
              slug: ajusto-mi-guion-antes-de-salir
              micro_objective: "Ajusta, sin ayuda, una pregunta confusa detectada en el ensayo antes de usar el guion con un desconocido."
              narrative_beat: "Dina reescribe su tercera pregunta después del ensayo, esta vez más corta y más clara."
              difficulty: 5
              suggested_families: [storyplay, choice]
        - position: 7
          slug: repaso-preparo-mi-entrevista
          kind: review_spaced
          title_es: "Repaso: Preparo mi Entrevista"
          concept: "El equipo repasa como definir un objetivo, escribir preguntas neutrales y elegir a quien entrevistar primero."
          learning_objective: "El aprendiz recuerda y aplica, sin nueva enseñanza, los pasos de preparación de esta saga."
          key_vocabulary: [objetivo, pregunta neutral, candidato]
          prior_knowledge: "Completo los 6 temas de Preparo mi Entrevista."
          fact_refs: []
          review_of:
            - mesa-del-cliente/preparo-mi-entrevista/objetivo-de-la-entrevista
            - mesa-del-cliente/preparo-mi-entrevista/preguntas-que-no-dirigen
            - mesa-del-cliente/preparo-mi-entrevista/a-quien-entrevisto-primero
            - mesa-del-cliente/preparo-mi-entrevista/cuantas-personas-necesito
            - mesa-del-cliente/preparo-mi-entrevista/donde-y-como-la-hago
            - mesa-del-cliente/preparo-mi-entrevista/ensayo-mi-entrevista
          lessons:
            - position: 1
              slug: repaso-escribo-mi-objetivo
              micro_objective: "Recuerda y aplica, sin ayuda, como redactar el objetivo de una entrevista nueva."
              narrative_beat: "El equipo escribe, sin ayuda, el objetivo de una entrevista nueva sobre una idea que todavia no habian explorado."
              difficulty: 3
              suggested_families: [choice, storyplay]
            - position: 2
              slug: repaso-reescribo-una-pregunta
              micro_objective: "Aplica sin ayuda todo lo repasado: reescribe una pregunta dirigida en una versión neutral."
              narrative_beat: "Rho reescribe, sin ayuda de nadie, una pregunta dirigida que encontro en el guion de un compañero."
              difficulty: 4
              suggested_families: [choice, analyze]
        - position: 8
          slug: cruce-entrevista-y-mvp
          kind: review_interleaved
          title_es: "Cruce: Entrevista y MVP"
          concept: "Mezclamos el objetivo de la entrevista con el MVP construido en la aventura anterior para preguntar exactamente lo que hace falta."
          learning_objective: "El aprendiz combina, sin nueva enseñanza, la definición de su MVP con el objetivo de una entrevista que lo ponga a prueba."
          key_vocabulary: [MVP, objetivo de entrevista, poner a prueba]
          prior_knowledge: "Completo el repaso de Preparo mi Entrevista (tema anterior) y Prototipo de Garage (aventura anterior)."
          fact_refs: []
          review_of:
            - mesa-del-cliente/preparo-mi-entrevista/objetivo-de-la-entrevista
            - mesa-del-cliente/preparo-mi-entrevista/a-quien-entrevisto-primero
            - prototipo-de-garage/que-es-un-mvp/mi-mvp-en-una-frase
          lessons:
            - position: 1
              slug: mi-mvp-necesita-que-pregunta
              micro_objective: "Conecta la definición de su MVP con la pregunta clave que una entrevista debería responder sobre el."
              narrative_beat: "Zara revisa la frase de su MVP y se da cuenta de que la pregunta clave es si la gente lo usaria todos los días, no solo una vez."
              difficulty: 4
              suggested_families: [analyze, choice]
            - position: 2
              slug: elijo-a-quien-le-pregunto-sobre-mi-mvp
              micro_objective: "Elige, sin ayuda, a la persona más relevante para preguntarle directamente sobre su MVP ya construido."
              narrative_beat: "Rho elige entrevistar primero a quien ya probo su prototipo en el Demo Day del valle, porque ya tiene experiencia real con el."
              difficulty: 5
              suggested_families: [choice, analyze]
  - position: 2
    slug: la-entrevista-real
    icon: record_voice_over
    title:
      en-US: "The Real Interview"
      es-MX: "La Entrevista Real"
      pt-BR: "A Entrevista Real"
    description:
      en-US: "Break the ice, talk less than they do, and learn to spot a polite lie."
      es-MX: "Rompe el hielo, habla menos que la otra persona, y aprende a detectar una mentira cortes."
      pt-BR: "Quebre o gelo, fale menos que a outra pessoa, e aprenda a detectar uma mentira educada."
    topics:
        - position: 1
          slug: rompo-el-hielo
          title_es: "Rompo el hielo"
          concept: "Unos minutos de conversación informal antes de entrar en materia hacen que la persona entrevistada baje la guardia y hable con más honestidad."
          learning_objective: "El aprendiz abre una entrevista con una conversación breve e informal antes de la primera pregunta clave."
          key_vocabulary: [romper el hielo, bajar la guardia, conversación informal]
          prior_knowledge: "Completo Preparo mi Entrevista (saga anterior)."
          fact_refs: []
          parent_check: "Pregunta a {{name}} como piensa abrir su próxima entrevista antes de lanzar la primera pregunta importante."
          lessons:
            - position: 1
              slug: empiezo-con-una-pregunta-dificil-o-facil
              micro_objective: "Elige, entre dos formas de abrir una entrevista, la que genera más confianza antes de preguntar algo difícil."
              narrative_beat: "Liruf quiere empezar preguntando directo cuanto gastaría; Zara le sugiere primero preguntar como le fue en su semana."
              difficulty: 1
              suggested_families: [choice, story]
            - position: 2
              slug: mi-primera-frase-informal
              micro_objective: "Redacta, sin ayuda, una frase informal para abrir una entrevista antes de la primera pregunta clave."
              narrative_beat: "Rho abre su entrevista comentando algo sobre el clima del día, antes de sacar su libreta de preguntas."
              difficulty: 2
              suggested_families: [storyplay, choice]
        - position: 2
          slug: dejo-que-hable-mas-que-yo
          title_es: "Dejo que hable más que yo"
          concept: "En una buena entrevista, la persona entrevistada habla mucho más que quien pregunta; si hablas tu más de la mitad del tiempo, algo esta mal."
          learning_objective: "El aprendiz reconoce cuando esta hablando demasiado durante una entrevista y cede el espacio a la otra persona."
          key_vocabulary: [escuchar más, ceder espacio, proporción de habla]
          prior_knowledge: "Abre una entrevista con conversación informal (tema anterior)."
          fact_refs: []
          parent_check: "Pregunta a {{name}} si, en su última entrevista, hablo más el o la persona que entrevisto."
          lessons:
            - position: 1
              slug: quien-hablo-mas
              micro_objective: "Reconoce, en una transcripción corta, si quien entrevisto hablo más que la persona entrevistada."
              narrative_beat: "Dina revisa su transcripción y nota, avergonzada, que hablo casi la mitad del tiempo explicando su propia idea."
              difficulty: 2
              suggested_families: [story, choice]
            - position: 2
              slug: me-quedo-callado-y-espero
              micro_objective: "Elige la reacción correcta cuando hay un silencio incomodo después de una pregunta abierta."
              narrative_beat: "Zara hace una pregunta abierta y, aunque el silencio se siente largo, espera sin llenarlo con sus propias palabras."
              difficulty: 3
              suggested_families: [choice, storyplay]
        - position: 3
          slug: profundizo-con-por-que
          title_es: "Profundizo con por que"
          concept: "Cuando una respuesta se queda en la superficie, preguntar \"por que\" una vez más suele revelar la razón de verdad detras de la respuesta."
          learning_objective: "El aprendiz formula una pregunta de seguimiento que profundiza una respuesta superficial ya recibida."
          key_vocabulary: [profundizar, pregunta de seguimiento, razón real]
          prior_knowledge: "Cede el espacio a la otra persona (tema anterior)."
          fact_refs: []
          parent_check: "Anima a {{name}} a preguntar un 'por que' más cuando una respuesta se sienta corta o poco clara."
          lessons:
            - position: 1
              slug: esta-respuesta-se-quedo-corta
              micro_objective: "Reconoce, en un caso, cuando una respuesta recibida se queda en la superficie y necesita profundizarse."
              narrative_beat: "Alguien le dice a Rho 'no me gusto mucho' sobre su prototipo, y Rho anota que esa respuesta todavia no explica por que."
              difficulty: 3
              suggested_families: [story, choice]
            - position: 2
              slug: pregunto-un-por-que-mas
              micro_objective: "Formula, sin ayuda, una pregunta de seguimiento que profundiza una respuesta superficial dada en un caso."
              narrative_beat: "Liruf pregunta 'y por que no te gusto?' después de una respuesta corta, y así descubre el verdadero motivo."
              difficulty: 3
              suggested_families: [storyplay, choice]
        - position: 4
          slug: anoto-frases-textuales
          title_es: "Anoto frases textuales"
          concept: "Anotar las palabras exactas de la persona entrevistada, en vez de resumirlas con tus propias palabras, conserva detalles que después resultan clave."
          learning_objective: "El aprendiz registra una cita textual de una respuesta en vez de parafrasearla con sus propias palabras."
          key_vocabulary: [cita textual, parafrasear, palabras exactas]
          prior_knowledge: "Formula preguntas de seguimiento (tema anterior)."
          fact_refs: []
          parent_check: "Pidele a {{name}} que te lea, entre comillas, una frase exacta que anoto de su última entrevista, no un resumen."
          lessons:
            - position: 1
              slug: resumo-o-anoto-textual
              micro_objective: "Compara una nota resumida y una nota textual de la misma respuesta y elige cual conserva más detalle util."
              narrative_beat: "Zara compara su nota 'le parecio caro' contra la frase textual 'esta bien, pero no pagaría más de $80' - la segunda dice más."
              difficulty: 3
              suggested_families: [choice, analyze]
            - position: 2
              slug: anoto-la-frase-exacta
              micro_objective: "Registra, sin ayuda, la frase textual exacta de una respuesta dada en un caso, entre comillas."
              narrative_beat: "Dina anota entre comillas la frase exacta que le dijo su entrevistado, sin cambiar ni una palabra."
              difficulty: 4
              suggested_families: [input, choice]
        - position: 5
          slug: detecto-cuando-me-esta-dando-el-avion
          title_es: "Detecto cuando me esta dando el avion"
          concept: "A veces la gente contesta lo que cree que quieres escuchar, por quedar bien, en vez de decir la verdad; hay que aprender a notar esa señal."
          learning_objective: "El aprendiz reconoce señales de una respuesta cortes pero poco honesta y busca confirmarla con una pregunta de seguimiento."
          key_vocabulary: [respuesta cortes, quedar bien, confirmar con seguimiento]
          prior_knowledge: "Registra citas textuales (tema anterior)."
          fact_refs: []
          parent_check: "Pregunta a {{name}} si alguna respuesta que recibio sono demasiado amable, y como podría confirmar si era honesta."
          lessons:
            - position: 1
              slug: me-dijo-que-si-pero
              micro_objective: "Reconoce, en una escena, una señal de que alguien esta contestando por quedar bien en vez de decir la verdad."
              narrative_beat: "Alguien le dice a Liruf 'seguro te lo compraría' sin mirarlo a los ojos ni preguntar el precio - Rho nota la señal."
              difficulty: 4
              suggested_families: [story, choice]
            - position: 2
              slug: confirmo-con-una-pregunta-directa
              micro_objective: "Formula una pregunta de seguimiento que pone a prueba una respuesta cortes pero dudosa."
              narrative_beat: "Zara responde a un 'seguro me interesa' con 'genial, cuanto pagarias hoy mismo por el?' para confirmar si es en serio."
              difficulty: 4
              suggested_families: [choice, storyplay]
        - position: 6
          slug: cierro-la-entrevista-bien
          title_es: "Cierro la entrevista bien"
          concept: "Agradecer con sinceridad y dejar la puerta abierta para volver a hablar con esa persona es tan importante como la entrevista misma."
          learning_objective: "El aprendiz cierra una entrevista agradeciendo con sinceridad y dejando abierta la posibilidad de un contacto futuro."
          key_vocabulary: [cerrar bien, agradecer, puerta abierta]
          prior_knowledge: "Detecta respuestas poco honestas (tema anterior)."
          fact_refs: []
          parent_check: "Pregunta a {{name}} como cerro su última entrevista, y si dejo la puerta abierta para volver a hablar con esa persona."
          lessons:
            - position: 1
              slug: me-voy-rapido-o-cierro-bien
              micro_objective: "Elige, entre dos formas de terminar una entrevista, la que deja una mejor impresión y abre la puerta a volver a hablar."
              narrative_beat: "Rho se despide con prisa apenas obtiene su última respuesta; Dina le muestra como cerrar agradeciendo con calma."
              difficulty: 4
              suggested_families: [choice, story]
            - position: 2
              slug: agradezco-y-dejo-la-puerta-abierta
              micro_objective: "Redacta, sin ayuda, un cierre de entrevista que agradece y deja abierta la posibilidad de contactar de nuevo."
              narrative_beat: "Zara cierra su entrevista diciendo: 'gracias por tu tiempo, te aviso cuando tenga la versión final para que la pruebes'."
              difficulty: 5
              suggested_families: [storyplay, choice]
        - position: 7
          slug: repaso-la-entrevista-real
          kind: review_spaced
          title_es: "Repaso: La Entrevista Real"
          concept: "El equipo repasa como escuchar más que hablar, profundizar con preguntas de seguimiento y detectar respuestas poco honestas."
          learning_objective: "El aprendiz recuerda y aplica, sin nueva enseñanza, las técnicas de conducción de entrevista de esta saga."
          key_vocabulary: [escuchar, profundizar, honestidad]
          prior_knowledge: "Completo los 6 temas de La Entrevista Real."
          fact_refs: []
          review_of:
            - mesa-del-cliente/la-entrevista-real/rompo-el-hielo
