  # in adventures 01-04.
  - file: adventures/05-el-reino-de-las-ventas.yaml
  - file: adventures/06-el-taller-del-equipo.yaml
  - file: adventures/07-el-faro-del-buen-negocio.yaml
  - file: adventures/08-el-cosmos-del-founder.yaml
