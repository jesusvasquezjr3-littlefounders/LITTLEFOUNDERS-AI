            segment_types: [voice.mentor-turn.v2, logic.sort-by-rule.v2, logic.rule-checker.v2, story.dialogue-choice.v2]
            situation: "A gaming friend asks Kai for his account PIN 'to move some coins', so Kai sorts what is safe to share (a nickname, a favorite team) from what stays private (password, PIN, address, a photo of a card) and checks three passwords against the rules long, unique and not a birthday."
            tests: "Sorting private from shareable information by one rule, checking a password against written rules, and a dialogue decision to say no and tell an adult."
          - lesson_id: fe-1012-11-money-that-grows
            eligibility: { minimum_age: 11, maximum_age: 12 }
            knowledge_components: [money.simple-interest-peek, money.percent-intro, money.savings-plan-math]
