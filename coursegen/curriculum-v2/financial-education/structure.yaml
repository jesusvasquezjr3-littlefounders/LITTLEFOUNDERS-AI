        lessons:
          - lesson_id: fe-1317-09-laptop-by-december
            eligibility: { minimum_age: 13, maximum_age: 17 }
            knowledge_components: [money.savings-plan-math, life.goal-planning, biz.saving-goal]
            kc_status: { money.savings-plan-math: active, life.goal-planning: draft, biz.saving-goal: active }
            new_concepts: [money.savings-plan-math, life.goal-planning]
            mentor: { character: rho, scene: diorama-a }
            regional: universal
            segment_types: [voice.mentor-turn.v2, math.worked-example.v2, visual.savings-line.v2, plan.schedule-board.v2]
            situation: "Sam sets a goal of a 600 used laptop by December with 120 saved and 60 a month, which needs 8 months when only 6 are left, so he works out the 80 a month he needs and finds the 20 more to plan for."
            tests: "A goal with a size and a date turned into a monthly amount, a plan that does not fit and the gap found, and steps placed on a schedule board; the first plan the teenager builds from the formula."
          - lesson_id: fe-1317-10-interest-year-by-year
            eligibility: { minimum_age: 13, maximum_age: 17 }
            knowledge_components: [money.simple-interest-peek, money.percent-intro]
            kc_status: { money.simple-interest-peek: active, money.percent-intro: active }
            new_concepts: [money.simple-interest-peek]
            mentor: { character: dina, scene: diorama-b }
            regional: scenarios   # illustrative savings rates in each market; never an offer or a promised return
            segment_types: [voice.mentor-turn.v2, math.worked-example.v2, money.running-ledger.v2, reasoning.decide-justify.v2]
            situation: "A savings account that pays 4% a year (an illustrative rate, not an offer) turns 500 into 520, then 540, then 560 after three years of simple interest, and the child compares it with the same 500 kept in a drawer."
            tests: "Interest worked out year by year from a percent, the rate stated as illustrative, and a comparison with money earning nothing; no product, no promise."
          - lesson_id: fe-1317-11-when-the-plan-slips
            eligibility: { minimum_age: 13, maximum_age: 17 }
            knowledge_components: [life.review-and-adjust-plan, life.goal-planning, money.savings-plan-math]
            kc_status: { life.review-and-adjust-plan: draft, life.goal-planning: draft, money.savings-plan-math: active }
