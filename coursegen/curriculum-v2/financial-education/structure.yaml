# Financial Education: v2 catalog structure (2026-10-04).
#
# The full planning record of the course: 4 age pathways, 14 chapters of 4 lessons,
# 56 lessons. It CONTAINS the pilot (`pilot.structure.yaml` stays untouched): the 8 pilot
# lessons keep their lesson_ids, chapter_ids, pathway_ids and fields (only `situation` is
# added) because their plan files already exist in `plans/` and must agree.
#
# Shape: course -> age pathway -> chapter -> lesson -> segment (OD-16, v2). Position in
# this file, not the NN of a lesson_id, is the teaching order. New lessons continue the
# numbering after the pilot's (fe-69-05..., fe-1012-05...).
#
# Knowledge components use the real keys of database/seeds/kc_graph.v1.json. Status is the
# seed's: every life.* KC is `draft` (pathway policy G5, OD-22); money.* and biz.* are active.
#
# Authoring is agentic and zero spend; nothing here publishes, calls a provider or writes
# to Vault. A later wave writes `plans/<lesson_id>.json` from each entry below.

course_id: financial-education
authoring_locale: es-MX
markets: [es-MX, pt-BR, en-US]
status: "catalog-structure-v1 (2026-10-04): planned, plans not yet authored"

assumptions:
  - "Four lessons per chapter and four chapters per child/tween pathway, three per teen/adult pathway, are catalog values to be tested against the pilot rounds (docs/content/FORGE-V2-PILOT-ROUNDS.md)."
  - "Teaching order is file order. The pilot chapters keep their own lessons in their own order; the child pathway opens with a new chapter (coins, things and help, jobs, prices) so the pilot chapter's external prerequisites (count-like-coins, subtract-money) are really taught before it."
  - "The KC graph has the edge add-money -> subtract-money, but the pilot chapter teaches add-money (fe-69-04) after change-making (fe-69-02), which needs subtract-money. subtract-money is therefore taught in the opening chapter, before add-money: one prerequisite-order warning is left deliberately, and the pilot lessons are not reordered."
  - "money.compare-amounts and money.estimate-total are named in pilot lessons (fe-69-04, fe-1012-02) without being new concepts there; they are declared as new concepts in the child pathway, compare-amounts in fe-69-10 and estimate-total in fe-69-11, the first lessons whose single topic is that skill."
  - "Teen and adult pathways revisit money.* and life.* KCs at their own depth (first pay, a first account, a subscription, a phone plan, a rent split, a loan offer, a scam text) and declare them as new concepts of that pathway; they list the tier-1 and tier-2 basics as external prerequisites. No allowance framing, no Liruf at 13+."
  - "Investing is out of scope here and simulation-only everywhere; interest and loan lessons use illustrative rates, never a named product or a promised return, and no lesson gives personal financial advice. money.linear-vs-accelerating-growth belongs to the investing course."
  - "Lessons that name real money, institutions, products, prices or customs are `scenarios` (B.16); lessons that use only LittleFounders coins and invented shops are `universal`."

pathways:
  - pathway_id: financial-6-9
    age_band: "6-9"
    chapters:
      - chapter_id: fe-69-corner-shop
        title: { en-US: The corner shop, es-MX: La tiendita de la esquina, pt-BR: A vendinha da esquina }
        objective: Name coins and count a pile of one coin, tell things from help and needs from wants, meet jobs and prices, and see how many coins are left after paying.
        external_prerequisites: []
        lessons:
          - lesson_id: fe-69-05-name-the-coins
            eligibility: { minimum_age: 6, maximum_age: 9 }
            knowledge_components: [money.coin-recognition, money.count-like-coins]
            kc_status: { money.coin-recognition: active, money.count-like-coins: active }
            new_concepts: [money.coin-recognition, money.count-like-coins]
            mentor: { character: zara, scene: diorama-a }
            regional: universal
            segment_types: [voice.mentor-turn.v2, money.coin-tray.v2, math.cpa-count.v2]
            situation: "In the corner shop's till Zara shows coins worth 1, 5 and 10; the child names each coin by its value, then counts a pile of six 5-coins by skip counting (5, 10, 15, 20, 25, 30)."
            tests: "Naming a coin by its value and skip-counting a pile of identical coins, with no mixed piles yet and the tier-1 vocabulary list."
          - lesson_id: fe-69-06-things-and-help
            eligibility: { minimum_age: 6, maximum_age: 9 }
            knowledge_components: [biz.goods-vs-services, biz.needs-vs-wants]
            kc_status: { biz.goods-vs-services: active, biz.needs-vs-wants: active }
            new_concepts: [biz.goods-vs-services, biz.needs-vs-wants]
            mentor: { character: liruf, scene: diorama-b }
            regional: universal
            segment_types: [voice.mentor-turn.v2, logic.sort-by-rule.v2, money.needs-wants.v2]
            situation: "Four customers come to the corner shop asking for bread, a haircut, a toy and a pony ride, and the child sorts each request first as a thing or help, then as something the family needs today or only wants."
            tests: "Two single-rule sorts over one set of cards (thing or help, need or want), the content gap goods-vs-services, and no price or coin arithmetic at all."
          - lesson_id: fe-69-07-people-who-work
            eligibility: { minimum_age: 6, maximum_age: 9 }
            knowledge_components: [life.effort-and-work, life.jobs-help-others]
            kc_status: { life.effort-and-work: draft, life.jobs-help-others: draft }
            new_concepts: [life.effort-and-work, life.jobs-help-others]
            mentor: { character: rho, scene: diorama-b }
            regional: universal
            segment_types: [voice.mentor-turn.v2, story.branch.v2, logic.euler.v2]
            situation: "At home and at the shop the child sees who does the work (sweeping, baking, cutting hair), notices that every job takes effort and ends with someone getting what they needed, like the baker whose 12 loaves feed the street."
            tests: "A story decision about finishing a chore, a two-circle diagram (jobs inside 'helps someone'), and effort named without any pay or coin yet."
          - lesson_id: fe-69-08-price-and-coins-left
            eligibility: { minimum_age: 6, maximum_age: 9 }
            knowledge_components: [biz.what-is-price, money.subtract-money]
            kc_status: { biz.what-is-price: active, money.subtract-money: active }
            new_concepts: [biz.what-is-price, money.subtract-money]
            mentor: { character: dina, scene: diorama-a }
            regional: universal
            mentor_misjudgment: true   # Dina hands over all 10 coins without asking the price, recovers by counting what she should have kept, says what she does next time
            segment_types: [voice.mentor-turn.v2, voice.mentor-episode.v2, money.coin-tray.v2, math.number-line.whole.v2]
            situation: "The baker's loaf costs 6 coins, so a child holding 10 coins gives 6 (the price is what the buyer gives to get the loaf) and counts the 4 coins left; Dina first hands over all 10."
            tests: "Price as what a buyer gives, subtraction of whole coins within 10 on a number line, and the B.11 episode with judgment without shame."
      - chapter_id: fe-69-coins-and-choices
        title: { en-US: Coins and choices, es-MX: Monedas y decisiones, pt-BR: Moedas e escolhas }
        objective: Count and use coins, give change, tell needs from wants, and add prices at a stall.
        external_prerequisites: [money.count-like-coins, money.subtract-money]
        lessons:
          - lesson_id: fe-69-01-count-coins
            eligibility: { minimum_age: 6, maximum_age: 9 }
            knowledge_components: [money.count-mixed-coins, money.make-amount]
            kc_status: { money.count-mixed-coins: active, money.make-amount: active }
            new_concepts: [money.count-mixed-coins, money.make-amount]
            mentor: { character: dina, scene: diorama-a }
            regional: universal   # LittleFounders coins only
            segment_types: [voice.mentor-turn.v2, money.coin-tray.v2]   # 11 segments: 6 Mentor turns, 5 trays (pre, 2 guided, practice, transfer)
            situation: "Dina counts a mixed pile of 10-, 5- and 1-coins from the biggest coin down, then fills a light pouch with an exact total (13) using the fewest coins."
            tests: "Plain coin counting at ages 6-9 with the tier-1 vocabulary list; fewest-pieces rubric; Copy Budget at its tightest (12-word prompts)."
          - lesson_id: fe-69-02-change-counting-up
            eligibility: { minimum_age: 8, maximum_age: 9 }
            knowledge_components: [money.make-change-counting-up, money.make-amount]
            kc_status: { money.make-change-counting-up: active, money.make-amount: active }
            new_concepts: [money.make-change-counting-up]
            mentor: { character: rho, scene: diorama-a }
            regional: universal
            segment_types: [voice.mentor-turn.v2, money.making-change.v2, money.coin-tray.v2, reasoning.decide-justify.v2]   # 10 segments; decide-justify added by the author
            situation: "Rho runs a fair stall and gives change for Ari's notebook (it costs 35, Ari pays 50) by counting up from the price: 35 to 40, then to 50, which is 15 in change."
            tests: "Change by counting up; the arithmetic gate (change = paid - price); transfer item after practice."
          - lesson_id: fe-69-03-needs-and-wants
            eligibility: { minimum_age: 6, maximum_age: 9 }
            knowledge_components: [life.wants-and-choices]
            kc_status: { life.wants-and-choices: draft }
            new_concepts: [life.wants-and-choices]
            mentor: { character: liruf, scene: diorama-b }
            regional: universal
            mentor_misjudgment: true   # B.11: Liruf spends first, recovers, and says what he will do next time
            segment_types: [voice.mentor-turn.v2, money.needs-wants.v2, voice.mentor-episode.v2, story.branch.v2]   # 11 segments
            situation: "Liruf reaches the market with few coins, buys a toy before the bread and goes without supper, then asks 'can I do without it?' and, with 6 coins, pays for the soup first."
            tests: "The B.11 mentor episode (gate 15), judgment without shame (B.26), a story decision with no wrong-answer red."
          - lesson_id: fe-69-04-market-stall
            eligibility: { minimum_age: 7, maximum_age: 9 }
            knowledge_components: [money.add-money, money.compare-amounts]
            kc_status: { money.add-money: active, money.compare-amounts: active }
            new_concepts: [money.add-money]
            mentor: { character: zara, scene: diorama-b }
            regional: scenarios   # a stall in each market's own setting and currency
            segment_types: [voice.mentor-turn.v2, money.market-stall.v2, money.coin-stack.v2, logic.sort-by-rule.v2]   # 10 segments; sort-by-rule carries money.compare-amounts
            situation: "Zara runs a yard-sale snack table in each market's own currency; the child adds the prices of a basket, stacks coins to reach the total and discovers that more pieces do not always cost more."
            tests: "A Horizonte money piece (money.market-stall.v2) with per-market scenarios, real-currency facts (gate 3) and pt-BR 'R$ N' pricing."
      - chapter_id: fe-69-market-day
        title: { en-US: Market day, es-MX: Día de mercado, pt-BR: Dia de feira }
        objective: Swap and trade at the market, see why everyone agrees to use coins, compare and estimate prices before buying, and pause when an ad says hurry.
        external_prerequisites: []
        lessons:
          - lesson_id: fe-69-09-swap-day
            eligibility: { minimum_age: 6, maximum_age: 9 }
            knowledge_components: [life.barter, biz.trade-and-markets, biz.what-is-price]
            kc_status: { life.barter: draft, biz.trade-and-markets: active, biz.what-is-price: active }
            new_concepts: [life.barter, biz.trade-and-markets]
            mentor: { character: zara, scene: diorama-b }
            regional: universal
            segment_types: [voice.mentor-turn.v2, math.pan-balance.v2, story.branch.v2]
            situation: "On market day Mia has 3 apples and wants a loaf, but the baker only wants pears; she swaps 3 apples for 2 pears with the fruit seller, then the 2 pears for the loaf, and both sides of each swap go home happy."
            tests: "A swap that gets stuck and a two-step swap that unsticks it, a pan balance showing a fair swap, and 'both leave happier' as the test of a trade."
          - lesson_id: fe-69-10-why-coins
            eligibility: { minimum_age: 6, maximum_age: 9 }
            knowledge_components: [life.what-money-is, money.compare-amounts, money.count-mixed-coins]
            kc_status: { life.what-money-is: draft, money.compare-amounts: active, money.count-mixed-coins: active }
            new_concepts: [life.what-money-is, money.compare-amounts]
            mentor: { character: liruf, scene: diorama-a }
            regional: universal
            segment_types: [voice.mentor-turn.v2, money.coin-tray.v2, math.number-line.order.v2, story.dialogue-choice.v2]
            situation: "After shells-for-fish and stones-for-bread swaps get stuck, the friends agree that one coin counts everywhere because everyone trusts it, and the child compares a pouch worth 10+5+1 with a pouch of four 5-coins to see which holds more."
            tests: "Money as something everyone agrees to accept, and comparing two mixed amounts (16 against 20) by counting each first; the first lesson whose single skill is compare-amounts."
          - lesson_id: fe-69-11-which-stall-is-cheaper
            eligibility: { minimum_age: 8, maximum_age: 9 }
            knowledge_components: [life.smart-shopping, money.estimate-total, money.compare-amounts]
            kc_status: { life.smart-shopping: draft, money.estimate-total: active, money.compare-amounts: active }
            new_concepts: [life.smart-shopping, money.estimate-total]
            mentor: { character: dina, scene: diorama-b }
            regional: universal
            segment_types: [voice.mentor-turn.v2, visual.chart.v2, math.number-line.whole.v2, reasoning.decide-justify.v2]
            situation: "With 60 coins Dina must buy a kite and a book: stall A sells them for 28 and 31, stall B for 25 and 33; rounding each price to the nearest ten shows both baskets cost about 60, so the child adds exactly (59 against 58) and picks stall B."
            tests: "Rounding to the nearest ten to check that the money is enough, then an exact comparison across two stalls; a decision with a stated reason."
          - lesson_id: fe-69-12-pause-before-you-buy
            eligibility: { minimum_age: 8, maximum_age: 9 }
            knowledge_components: [life.think-before-buying, life.advertising-literacy, biz.needs-vs-wants]
            kc_status: { life.think-before-buying: draft, life.advertising-literacy: draft, biz.needs-vs-wants: active }
            new_concepts: [life.think-before-buying, life.advertising-literacy]
            mentor: { character: rho, scene: diorama-a }
            regional: universal
            mentor_misjudgment: true   # Rho buys a 15-coin kite from the 20 coins meant for shoes after a 'free toy' banner, then pauses and says what he does next time
            segment_types: [voice.mentor-turn.v2, voice.mentor-episode.v2, logic.sort-by-rule.v2, reasoning.decide-justify.v2]
            situation: "A banner shouts 'Only today! Free toy with every kite' and Rho spends 15 of the 20 coins meant for shoes, then pauses, asks whether it can wait, sees that 'free' needed a purchase, and says what he will do next time."
            tests: "Telling a true description from an exaggeration, 'free' and 'only today' as tactics, and the pause-and-ask habit; a decision justified without shame."
      - chapter_id: fe-69-my-coin-jar
        title: { en-US: My coin jar, es-MX: Mi alcancía, pt-BR: Meu cofrinho }
        objective: Earn coins and write them down, set a goal, wait and keep the jar safe, and split the coins into save, spend and share.
        external_prerequisites: []
        lessons:
          - lesson_id: fe-69-13-earn-and-write-it-down
            eligibility: { minimum_age: 7, maximum_age: 9 }
            knowledge_components: [biz.value-of-work, life.track-earnings, money.add-money]
            kc_status: { biz.value-of-work: active, life.track-earnings: draft, money.add-money: active }
            new_concepts: [biz.value-of-work, life.track-earnings]
            mentor: { character: dina, scene: diorama-a }
            regional: universal
            segment_types: [voice.mentor-turn.v2, money.coin-tray.v2, visual.chart.v2, story.would-you-rather.v2]
            situation: "Dina does chores for three days and earns 5 coins on Monday, none on Tuesday and 10 on Wednesday; she writes each day in a small record, adds them to 15 and notices that earnings change from day to day and that finished work is what earns."
            tests: "A running record of earnings that is not constant (5, 0, 10), adding the days, and work with value as the reason for pay."
          - lesson_id: fe-69-14-goal-jar
            eligibility: { minimum_age: 6, maximum_age: 9 }
            knowledge_components: [biz.saving-goal, life.saving-for-later]
            kc_status: { biz.saving-goal: active, life.saving-for-later: draft }
            new_concepts: [biz.saving-goal, life.saving-for-later]
            mentor: { character: zara, scene: diorama-a }
            regional: universal
            segment_types: [voice.mentor-turn.v2, visual.goal-bullet.v2, math.ten-frame.v2, story.branch.v2]
            situation: "Zara wants a 10-coin kite and sets aside 2 of every 5 coins she gets; each saved coin fills a square of a ten-frame and the kite is hers after five rounds."
            tests: "A goal with a size, a fixed amount kept each time, and each saved coin bringing the goal closer on a ten-frame."
          - lesson_id: fe-69-15-wait-and-keep-safe
            eligibility: { minimum_age: 6, maximum_age: 9 }
            knowledge_components: [life.patience-and-waiting, life.safe-keeping, life.saving-for-later]
            kc_status: { life.patience-and-waiting: draft, life.safe-keeping: draft, life.saving-for-later: draft }
            new_concepts: [life.patience-and-waiting, life.safe-keeping]
            mentor: { character: liruf, scene: diorama-b }
            regional: universal
            mentor_misjudgment: true   # Liruf spends 2 saved coins on a sweet, then learns to keep the rest safe and keep saving after a small loss
            segment_types: [voice.mentor-turn.v2, voice.mentor-episode.v2, story.would-you-rather.v2, story.branch.v2]
            situation: "Liruf has 6 saved coins toward a 12-coin kite; he spends 2 on a sweet, an open jar then loses 1, and he moves the rest to a closed box and keeps saving 3 coins a week."
            tests: "Small now against bigger later as a choice, a safe place for savings, and carrying on after a small loss; no wrong-answer red."
          - lesson_id: fe-69-16-three-jars
            eligibility: { minimum_age: 6, maximum_age: 9 }
            knowledge_components: [life.save-spend-share, money.equal-sharing]
            kc_status: { life.save-spend-share: draft, money.equal-sharing: active }
            new_concepts: [life.save-spend-share, money.equal-sharing]
            mentor: { character: rho, scene: diorama-b }
            regional: universal
            segment_types: [voice.mentor-turn.v2, money.allocation.v2, money.coin-tray.v2, reasoning.decide-justify.v2]
            situation: "Rho receives 12 coins and shares them equally into three jars (save, spend, share) of 4 coins, then chooses a different split and says why; the 4 share coins go equally to two friends, 2 each."
            tests: "Equal sharing with nothing left over, a three-way split chosen and justified, and the first decision between equal and unequal shares."

  - pathway_id: financial-10-12
    age_band: "10-12"
    chapters:
      - chapter_id: fe-1012-smart-spending
        title: { en-US: Smart spending, es-MX: Gasto inteligente, pt-BR: Gasto inteligente }
        objective: Compare prices, plan a budget, build a saving plan and spot a suspicious message.
        external_prerequisites: [money.subtract-money, biz.saving-goal, life.advertising-literacy]   # life.advertising-literacy is draft (G5)
        lessons:
          - lesson_id: fe-1012-01-unit-price
            eligibility: { minimum_age: 10, maximum_age: 12 }
            knowledge_components: [money.unit-price, money.add-money]
            kc_status: { money.unit-price: active, money.add-money: active }
            new_concepts: [money.unit-price]
            mentor: { character: liruf, scene: diorama-b }
            regional: scenarios   # each market's own shop, prices and currency; per-market rubric
            segment_types: [voice.mentor-turn.v2, voice.mentor-episode.v2, math.worked-example.v2, money.unit-price.v2, reasoning.decide-justify.v2]   # 11 segments
            mentor_misjudgment: true   # added by the author: Liruf compares price tags only, then recovers by dividing
            situation: "Liruf buys juice for his friends: a bag of 4 juices costs 24 and a bag of 10 costs 50, he first compares only the price tags, then divides to find 6 against 5 per juice."
            tests: "Per-market answer keys (rubric_by_locale), the unit-price arithmetic gate, the B.12 decide-and-justify step, feedback.met on every graded step (ages 10+)."
          - lesson_id: fe-1012-02-plan-the-budget
            eligibility: { minimum_age: 10, maximum_age: 12 }
            knowledge_components: [money.simple-budget, money.estimate-total]
            kc_status: { money.simple-budget: active, money.estimate-total: active }
            new_concepts: [money.simple-budget]
            mentor: { character: rho, scene: diorama-a }
            regional: universal
            approaches: true   # B.24: round-up-first vs add-exactly-then-compare; both chains practise money.estimate-total
            segment_types: [voice.mentor-turn.v2, math.worked-example.v2, reasoning.decide-justify.v2]   # 11 segments; round 1 also used the opportunity-cost, allocation and running-ledger boards
            situation: "Rho plans a picnic list for Nia's club with 100 coins; the list adds up to 108, so the child checks the total by rounding up first or by adding exactly, then removes one item to fit the money."
            tests: "Autonomy through two equally valid strategy chains; a decision that spends within a budget; every worked step shown before it is asked."
          - lesson_id: fe-1012-03-saving-plan
            eligibility: { minimum_age: 10, maximum_age: 12 }
            knowledge_components: [money.savings-plan-math, money.simple-budget]
            kc_status: { money.savings-plan-math: active, money.simple-budget: active }
            new_concepts: [money.savings-plan-math]
            mentor: { character: zara, scene: diorama-a }
            regional: scenarios
            segment_types: [voice.mentor-turn.v2, math.worked-example.v2, visual.savings-line.v2]   # 10 segments; round 1 also used the goal-bullet board
            situation: "Zara saves for a 90-coin ball with 30 already in the jar and 10 coins put in each week, so she works out the 60 still missing and the 6 weeks it takes, then checks it."
            tests: "A worked example with backward fading, the savings line, a transfer item, and per-market anchors."
          - lesson_id: fe-1012-04-suspicious-messages
            eligibility: { minimum_age: 10, maximum_age: 12 }
            knowledge_components: [life.scam-awareness]
            kc_status: { life.scam-awareness: draft }
            new_concepts: [life.scam-awareness]
            mentor: { character: dina, scene: diorama-b }
            regional: scenarios   # the scam each market's children actually meet (SMS, Pix, texts)
            segment_types: [voice.mentor-turn.v2, voice.mentor-episode.v2, money.scam-check.v2, story.dialogue-choice.v2, reasoning.decide-justify.v2]   # 10 segments
            mentor_misjudgment: true   # added by the author: Dina nearly taps a prize link, then stops and tells an adult
            situation: "Dina nearly taps a link in a message that says she won a prize and must claim it today, then checks who sent it, where the link goes, the rush and what it asks for, and stops and tells an adult."
            tests: "Real adaptation, not translation: different messages per market with the same answer ids; hypothesis-backed problems become Stage 3 review items."
      - chapter_id: fe-1012-sale-season
        title: { en-US: Sale season, es-MX: Temporada de rebajas, pt-BR: Temporada de promoções }
        objective: Find a fraction or a percent of a price, add up a charge that repeats, and name what a bargain takes from your other choices.
        external_prerequisites: [money.equal-sharing, money.subtract-money, money.add-money, money.estimate-total, life.wants-and-choices]
        lessons:
          - lesson_id: fe-1012-05-quarter-off
            eligibility: { minimum_age: 10, maximum_age: 12 }
            knowledge_components: [money.fraction-of-amount, money.equal-sharing, money.subtract-money]
            kc_status: { money.fraction-of-amount: active, money.equal-sharing: active, money.subtract-money: active }
            new_concepts: [money.fraction-of-amount]
            mentor: { character: zara, scene: diorama-b }
            regional: universal
            segment_types: [voice.mentor-turn.v2, math.fraction-wall.v2, math.worked-example.v2, money.allocation.v2]
            situation: "Zara's stall puts an 80-coin jacket on sale at a quarter off: the child splits 80 into 4 equal parts of 20, takes one part off to pay 60, then finds half of a 36-coin cap."
            tests: "A fraction of a whole amount (half, a third, a quarter) built from equal sharing and checked by putting the parts back together; the first lesson that takes a part of a price."
          - lesson_id: fe-1012-06-ten-percent-and-half
            eligibility: { minimum_age: 11, maximum_age: 12 }
            knowledge_components: [money.percent-intro, money.fraction-of-amount]
            kc_status: { money.percent-intro: active, money.fraction-of-amount: active }
            new_concepts: [money.percent-intro]
            mentor: { character: rho, scene: diorama-a }
            regional: universal
            segment_types: [voice.mentor-turn.v2, visual.percent-grid.v2, math.worked-example.v2, reasoning.decide-justify.v2]
            situation: "Two banners hang over a 60-coin sneaker, '10% off' and '50% off': the child finds 10% by dividing by 10 (6 coins), 50% by halving (30 coins), builds 20% as two tens (12) and compares '20% off' with 'a quarter off' (15)."
            tests: "Building any percent from 10% and 50% on a percent grid, and the link back to the fraction of the lesson before; tier 3 from age 11."
          - lesson_id: fe-1012-07-charges-that-repeat
