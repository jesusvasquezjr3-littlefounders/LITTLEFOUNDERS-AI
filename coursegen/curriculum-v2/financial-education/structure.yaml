pathways:
  - pathway_id: financial-6-9
    age_band: 6-9
    chapters:
      - chapter_id: fe-69-corner-shop
        title:
          en-US: The corner shop
          es-MX: La tiendita de la esquina
          pt-BR: A vendinha da esquina
        objective: Name coins and count a pile of one coin, tell things from help and needs from wants, meet jobs and prices, and see how many coins are left after paying.
        external_prerequisites: []
        lessons:
          - lesson_id: fe-69-05-name-the-coins
            eligibility:
              minimum_age: 6
              maximum_age: 9
            knowledge_components:
              - money.coin-recognition
              - money.count-like-coins
            kc_status:
              money.coin-recognition: active
              money.count-like-coins: active
            new_concepts:
              - money.coin-recognition
              - money.count-like-coins
            mentor:
              character: zara
              scene: diorama-a
            regional: universal
            segment_types:
              - voice.mentor-turn.v2
              - money.coin-tray.v2
              - math.cpa-count.v2
            situation: In the corner shop's till Zara shows coins worth 1, 5 and 10; the child names each coin by its value, then counts a pile of six 5-coins by skip counting (5, 10, 15, 20, 25, 30).
            tests: Naming a coin by its value and skip-counting a pile of identical coins, with no mixed piles yet and the tier-1 vocabulary list.
          - lesson_id: fe-69-06-things-and-help
            eligibility:
              minimum_age: 6
              maximum_age: 9
            knowledge_components:
              - biz.goods-vs-services
              - biz.needs-vs-wants
            kc_status:
              biz.goods-vs-services: active
              biz.needs-vs-wants: active
            new_concepts:
              - biz.goods-vs-services
              - biz.needs-vs-wants
            mentor:
              character: liruf
              scene: diorama-b
            regional: universal
            segment_types:
              - voice.mentor-turn.v2
              - logic.sort-by-rule.v2
              - money.needs-wants.v2
            situation: Four customers come to the corner shop asking for bread, a haircut, a toy and a pony ride, and the child sorts each request first as a thing or help, then as something the family needs today or only wants.
            tests: Two single-rule sorts over one set of cards (thing or help, need or want), the content gap goods-vs-services, and no price or coin arithmetic at all.
          - lesson_id: fe-69-07-people-who-work
            eligibility:
              minimum_age: 6
              maximum_age: 9
            knowledge_components:
              - life.effort-and-work
              - life.jobs-help-others
            kc_status:
              life.effort-and-work: draft
              life.jobs-help-others: draft
            new_concepts:
              - life.effort-and-work
              - life.jobs-help-others
            mentor:
              character: rho
              scene: diorama-b
            regional: universal
            segment_types:
              - voice.mentor-turn.v2
              - story.branch.v2
              - logic.euler.v2
            situation: At home and at the shop the child sees who does the work (sweeping, baking, cutting hair), notices that every job takes effort and ends with someone getting what they needed, like the baker whose 12 loaves feed the street.
            tests: A story decision about finishing a chore, a two-circle diagram (jobs inside 'helps someone'), and effort named without any pay or coin yet.
          - lesson_id: fe-69-08-price-and-coins-left
            eligibility:
              minimum_age: 6
              maximum_age: 9
            knowledge_components:
              - biz.what-is-price
              - money.subtract-money
            kc_status:
              biz.what-is-price: active
              money.subtract-money: active
            new_concepts:
              - biz.what-is-price
              - money.subtract-money
            mentor:
              character: dina
              scene: diorama-a
            regional: universal
            mentor_misjudgment: true
            segment_types:
              - voice.mentor-turn.v2
              - voice.mentor-episode.v2
              - money.coin-tray.v2
              - math.number-line.whole.v2
            situation: The baker's loaf costs 6 coins, so a child holding 10 coins gives 6 (the price is what the buyer gives to get the loaf) and counts the 4 coins left; Dina first hands over all 10.
            tests: Price as what a buyer gives, subtraction of whole coins within 10 on a number line, and the B.11 episode with judgment without shame.
      - chapter_id: fe-69-coins-and-choices
        title:
          en-US: Coins and choices
          es-MX: Monedas y decisiones
          pt-BR: Moedas e escolhas
        objective: Count and use coins, give change, tell needs from wants, and add prices at a stall.
        external_prerequisites:
          - money.count-like-coins
          - money.subtract-money
        lessons:
          - lesson_id: fe-69-01-count-coins
            eligibility:
              minimum_age: 6
              maximum_age: 9
            knowledge_components:
              - money.count-mixed-coins
              - money.make-amount
            kc_status:
              money.count-mixed-coins: active
              money.make-amount: active
            new_concepts:
              - money.count-mixed-coins
              - money.make-amount
            mentor:
              character: dina
              scene: diorama-a
            regional: universal
            segment_types:
              - voice.mentor-turn.v2
              - money.coin-tray.v2
            situation: Dina counts a mixed pile of 10-, 5- and 1-coins from the biggest coin down, then fills a light pouch with an exact total (13) using the fewest coins.
            tests: Plain coin counting at ages 6-9 with the tier-1 vocabulary list; fewest-pieces rubric; Copy Budget at its tightest (12-word prompts).
          - lesson_id: fe-69-02-change-counting-up
            eligibility:
              minimum_age: 8
              maximum_age: 9
            knowledge_components:
              - money.make-change-counting-up
              - money.make-amount
            kc_status:
              money.make-change-counting-up: active
              money.make-amount: active
            new_concepts:
              - money.make-change-counting-up
            mentor:
              character: rho
              scene: diorama-a
            regional: universal
            segment_types:
              - voice.mentor-turn.v2
              - money.making-change.v2
              - money.coin-tray.v2
              - reasoning.decide-justify.v2
            situation: "Rho runs a fair stall and gives change for Ari's notebook (it costs 35, Ari pays 50) by counting up from the price: 35 to 40, then to 50, which is 15 in change."
            tests: Change by counting up; the arithmetic gate (change = paid - price); transfer item after practice.
          - lesson_id: fe-69-03-needs-and-wants
            eligibility:
              minimum_age: 6
              maximum_age: 9
            knowledge_components:
              - life.wants-and-choices
            kc_status:
              life.wants-and-choices: draft
            new_concepts:
              - life.wants-and-choices
            mentor:
              character: liruf
              scene: diorama-b
            regional: universal
            mentor_misjudgment: true
            segment_types:
              - voice.mentor-turn.v2
              - money.needs-wants.v2
              - voice.mentor-episode.v2
              - story.branch.v2
            situation: Liruf reaches the market with few coins, buys a toy before the bread and goes without supper, then asks 'can I do without it?' and, with 6 coins, pays for the soup first.
            tests: The B.11 mentor episode (gate 15), judgment without shame (B.26), a story decision with no wrong-answer red.
          - lesson_id: fe-69-04-market-stall
            eligibility:
              minimum_age: 7
              maximum_age: 9
            knowledge_components:
              - money.add-money
              - money.compare-amounts
            kc_status:
              money.add-money: active
              money.compare-amounts: active
            new_concepts:
              - money.add-money
            mentor:
              character: zara
              scene: diorama-b
            regional: scenarios
            segment_types:
              - voice.mentor-turn.v2
              - money.market-stall.v2
              - money.coin-stack.v2
              - logic.sort-by-rule.v2
            situation: Zara runs a yard-sale snack table in each market's own currency; the child adds the prices of a basket, stacks coins to reach the total and discovers that more pieces do not always cost more.
            tests: A Horizonte money piece (money.market-stall.v2) with per-market scenarios, real-currency facts (gate 3) and pt-BR 'R$ N' pricing.
      - chapter_id: fe-69-market-day
        title:
          en-US: Market day
          es-MX: Día de mercado
          pt-BR: Dia de feira
        objective: Swap and trade at the market, see why everyone agrees to use coins, compare and estimate prices before buying, and pause when an ad says hurry.
        external_prerequisites: []
        lessons:
          - lesson_id: fe-69-09-swap-day
            eligibility:
              minimum_age: 6
              maximum_age: 9
            knowledge_components:
              - life.barter
              - biz.trade-and-markets
              - biz.what-is-price
            kc_status:
              life.barter: draft
              biz.trade-and-markets: active
              biz.what-is-price: active
            new_concepts:
              - life.barter
              - biz.trade-and-markets
            mentor:
              character: zara
              scene: diorama-b
            regional: universal
            segment_types:
              - voice.mentor-turn.v2
              - math.pan-balance.v2
              - story.branch.v2
            situation: On market day Mia has 3 apples and wants a loaf, but the baker only wants pears; she swaps 3 apples for 2 pears with the fruit seller, then the 2 pears for the loaf, and both sides of each swap go home happy.
            tests: A swap that gets stuck and a two-step swap that unsticks it, a pan balance showing a fair swap, and 'both leave happier' as the test of a trade.
          - lesson_id: fe-69-10-why-coins
            eligibility:
              minimum_age: 6
              maximum_age: 9
            knowledge_components:
              - life.what-money-is
              - money.compare-amounts
              - money.count-mixed-coins
            kc_status:
              life.what-money-is: draft
              money.compare-amounts: active
              money.count-mixed-coins: active
            new_concepts:
              - life.what-money-is
              - money.compare-amounts
            mentor:
              character: liruf
              scene: diorama-a
            regional: universal
            segment_types:
              - voice.mentor-turn.v2
              - money.coin-tray.v2
              - math.number-line.order.v2
              - story.dialogue-choice.v2
            situation: After shells-for-fish and stones-for-bread swaps get stuck, the friends agree that one coin counts everywhere because everyone trusts it, and the child compares a pouch worth 10+5+1 with a pouch of four 5-coins to see which holds more.
            tests: Money as something everyone agrees to accept, and comparing two mixed amounts (16 against 20) by counting each first; the first lesson whose single skill is compare-amounts.
          - lesson_id: fe-69-11-which-stall-is-cheaper
            eligibility:
              minimum_age: 8
              maximum_age: 9
            knowledge_components:
              - life.smart-shopping
              - money.estimate-total
              - money.compare-amounts
            kc_status:
              life.smart-shopping: draft
              money.estimate-total: active
              money.compare-amounts: active
            new_concepts:
              - life.smart-shopping
              - money.estimate-total
            mentor:
              character: dina
              scene: diorama-b
            regional: universal
            segment_types:
              - voice.mentor-turn.v2
              - visual.chart.v2
              - math.number-line.whole.v2
              - reasoning.decide-justify.v2
            situation: "With 60 coins Dina must buy a kite and a book: stall A sells them for 28 and 31, stall B for 25 and 33; rounding each price to the nearest ten shows both baskets cost about 60, so the child adds exactly (59 against 58) and picks stall B."
            tests: Rounding to the nearest ten to check that the money is enough, then an exact comparison across two stalls; a decision with a stated reason.
          - lesson_id: fe-69-12-pause-before-you-buy
            eligibility:
              minimum_age: 8
              maximum_age: 9
            knowledge_components:
              - life.think-before-buying
              - life.advertising-literacy
              - biz.needs-vs-wants
            kc_status:
              life.think-before-buying: draft
              life.advertising-literacy: draft
              biz.needs-vs-wants: active
            new_concepts:
              - life.think-before-buying
              - life.advertising-literacy
            mentor:
              character: rho
              scene: diorama-a
            regional: universal
            mentor_misjudgment: true
            segment_types:
              - voice.mentor-turn.v2
              - voice.mentor-episode.v2
              - logic.sort-by-rule.v2
              - reasoning.decide-justify.v2
            situation: A banner shouts 'Only today! Free toy with every kite' and Rho spends 15 of the 20 coins meant for shoes, then pauses, asks whether it can wait, sees that 'free' needed a purchase, and says what he will do next time.
            tests: Telling a true description from an exaggeration, 'free' and 'only today' as tactics, and the pause-and-ask habit; a decision justified without shame.
      - chapter_id: fe-69-my-coin-jar
        title:
          en-US: My coin jar
          es-MX: Mi alcancía
          pt-BR: Meu cofrinho
        objective: Earn coins and write them down, set a goal, wait and keep the jar safe, and split the coins into save, spend and share.
        external_prerequisites: []
        lessons:
          - lesson_id: fe-69-13-earn-and-write-it-down
            eligibility:
              minimum_age: 7
              maximum_age: 9
            knowledge_components:
              - biz.value-of-work
              - life.track-earnings
              - money.add-money
            kc_status:
              biz.value-of-work: active
              life.track-earnings: draft
              money.add-money: active
            new_concepts:
              - biz.value-of-work
              - life.track-earnings
            mentor:
              character: dina
              scene: diorama-a
            regional: universal
            segment_types:
              - voice.mentor-turn.v2
              - money.coin-tray.v2
              - visual.chart.v2
              - story.would-you-rather.v2
            situation: Dina does chores for three days and earns 5 coins on Monday, none on Tuesday and 10 on Wednesday; she writes each day in a small record, adds them to 15 and notices that earnings change from day to day and that finished work is what earns.
            tests: A running record of earnings that is not constant (5, 0, 10), adding the days, and work with value as the reason for pay.
          - lesson_id: fe-69-14-goal-jar
            eligibility:
              minimum_age: 6
              maximum_age: 9
            knowledge_components:
              - biz.saving-goal
              - life.saving-for-later
            kc_status:
              biz.saving-goal: active
              life.saving-for-later: draft
            new_concepts:
              - biz.saving-goal
              - life.saving-for-later
            mentor:
              character: zara
              scene: diorama-a
            regional: universal
            segment_types:
              - voice.mentor-turn.v2
              - visual.goal-bullet.v2
              - math.ten-frame.v2
              - story.branch.v2
            situation: Zara wants a 10-coin kite and sets aside 2 of every 5 coins she gets; each saved coin fills a square of a ten-frame and the kite is hers after five rounds.
            tests: A goal with a size, a fixed amount kept each time, and each saved coin bringing the goal closer on a ten-frame.
          - lesson_id: fe-69-15-wait-and-keep-safe
            eligibility:
              minimum_age: 6
              maximum_age: 9
            knowledge_components:
              - life.patience-and-waiting
              - life.safe-keeping
