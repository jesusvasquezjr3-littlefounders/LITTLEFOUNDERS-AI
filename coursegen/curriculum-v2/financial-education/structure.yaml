            segment_types: [voice.mentor-turn.v2, money.allocation.v2, math.worked-example.v2, visual.chart.v2]
            situation: "In Rho's town 40 families each give 5 coins a month, 200 in all, and the town splits it into 100 for street lamps, 60 for the park and 40 for the water tap, so a small share from many pays for what everyone uses."
            tests: "Many small contributions added up and split between shared services on a donut, with each market's own public services named."
          - lesson_id: fe-1012-15-plan-the-project
            eligibility: { minimum_age: 10, maximum_age: 12 }
            knowledge_components: [life.community-projects, life.review-and-adjust-plan, life.goal-planning]
            kc_status: { life.community-projects: draft, life.review-and-adjust-plan: draft, life.goal-planning: draft }
            new_concepts: [life.community-projects, life.review-and-adjust-plan]
            mentor: { character: dina, scene: diorama-a }
            regional: universal
            segment_types: [voice.mentor-turn.v2, visual.goal-bullet.v2, money.running-ledger.v2, reasoning.decide-justify.v2]
            situation: "The class fundraiser aims at 150 coins for 6 garden beds in 5 weeks with the jobs split among 10 pupils; after week 3 it holds 60 instead of 90, so the group raises the weekly target from 30 to 45, thanks the neighbor who lent tools and reviews what it achieved."
            tests: "Splitting tasks and thanking helpers, a plan checked against what really happened and one part adjusted (the amount here), and a review of what the group achieved."
          - lesson_id: fe-1012-16-give-and-explain
            eligibility: { minimum_age: 10, maximum_age: 12 }
            knowledge_components: [life.giving, life.reflect-on-learning, life.save-spend-share]
            kc_status: { life.giving: draft, life.reflect-on-learning: draft, life.save-spend-share: draft }
            new_concepts: [life.giving, life.reflect-on-learning]
            mentor: { character: liruf, scene: diorama-b }
            regional: scenarios   # donation customs and the groups that receive help differ in each market
            segment_types: [voice.mentor-turn.v2, money.allocation.v2, story.would-you-rather.v2, reasoning.decide-justify.v2]
            situation: "After the fundraiser Mia has 40 coins left: she keeps 20, gives 10 to a food bank after checking where it goes and saves 10 for the next project, then explains in her own words three ideas she learned and teaches one to a younger cousin."
            tests: "Giving that expects nothing back with a part kept, a check on where the help goes, and the closing explanation in the learner's own words (a teach-back, not a quiz)."

  - pathway_id: financial-13-17
    age_band: "13-17"
    chapters:
      - chapter_id: fe-1317-first-pay
        title: { en-US: My first pay, es-MX: Mi primer pago, pt-BR: Meu primeiro pagamento }
        objective: Turn the hours of a first job into pay, split it with a plan, see what a phone plan costs over a year and open a first account safely.
        external_prerequisites: [life.effort-and-work, money.add-money, money.subtract-money, money.estimate-total, life.wants-and-choices, biz.needs-vs-wants]
        lessons:
          - lesson_id: fe-1317-01-first-shift
            eligibility: { minimum_age: 13, maximum_age: 17 }
            knowledge_components: [biz.value-of-work, life.track-earnings, life.effort-and-work]
            kc_status: { biz.value-of-work: active, life.track-earnings: draft, life.effort-and-work: draft }
            new_concepts: [biz.value-of-work, life.track-earnings]
            mentor: { character: rho, scene: diorama-a }
            regional: scenarios   # real hourly pay, tips, minimum working age and permits differ in each market
            segment_types: [voice.mentor-turn.v2, math.worked-example.v2, money.running-ledger.v2, story.dialogue-choice.v2]
            situation: "Maya's first weekend job at a bakery stall pays 9 an hour: 6 hours on Saturday and 4 on Sunday make 90, plus 12 in tips, and she logs each shift in a ledger to see 102 in all and to ask what the hour is worth."
            tests: "Hours times a rate plus a variable tip, kept in a ledger the learner fills in, and the pay as the value of the work; per-market wages and rules about age and permits."
          - lesson_id: fe-1317-02-split-the-pay
            eligibility: { minimum_age: 13, maximum_age: 17 }
            knowledge_components: [money.simple-budget, money.percent-intro, money.estimate-total]
            kc_status: { money.simple-budget: active, money.percent-intro: active, money.estimate-total: active }
            new_concepts: [money.simple-budget, money.percent-intro]
            mentor: { character: zara, scene: diorama-b }
            regional: universal
            segment_types: [voice.mentor-turn.v2, math.worked-example.v2, money.allocation.v2, reasoning.decision-grid.v2]
            situation: "Maya's month of shifts brings 100, which she splits as 50% for needs (50), 30% for wants (30) and 20% for saving (20), then she re-plans when a 60 phone bill breaks the needs share."
            tests: "A percent split of a pay amount on a donut, a plan that stays inside the money, and a re-plan that changes one share; percent built from 10% and 50% at teen depth."
          - lesson_id: fe-1317-03-phone-plan-year
            eligibility: { minimum_age: 13, maximum_age: 17 }
            knowledge_components: [life.recurring-costs, life.opportunity-cost, biz.value-of-work]
            kc_status: { life.recurring-costs: draft, life.opportunity-cost: draft, biz.value-of-work: active }
            new_concepts: [life.recurring-costs, life.opportunity-cost]
            mentor: { character: dina, scene: diorama-a }
            regional: scenarios   # real plan prices and hours of work needed differ in each market
            mentor_misjudgment: true   # Dina takes the bigger plan because it is 'only 8 more a month', then adds up a year and weighs the hours of work, and says what she does next time
            segment_types: [voice.mentor-turn.v2, voice.mentor-episode.v2, math.worked-example.v2, money.opportunity-cost.v2]
            situation: "Dina compares a 12-a-month phone plan with a 20-a-month plan with more data: 144 against 240 a year, and the 96 difference is about 11 hours of work at 9 an hour, so she decides whether the extra data is worth that time."
            tests: "A small monthly charge turned into a yearly one, the difference priced in hours of work (opportunity cost with time), and the B.11 episode with judgment without shame."
          - lesson_id: fe-1317-04-first-account
            eligibility: { minimum_age: 13, maximum_age: 17 }
            knowledge_components: [life.safe-keeping, life.banks-and-accounts, life.data-privacy]
            kc_status: { life.safe-keeping: draft, life.banks-and-accounts: draft, life.data-privacy: draft }
            new_concepts: [life.safe-keeping, life.banks-and-accounts, life.data-privacy]
            mentor: { character: rho, scene: diorama-b }
            regional: scenarios   # account types for minors, cards, apps and age rules differ in each market
            segment_types: [voice.mentor-turn.v2, logic.flowchart.v2, logic.rule-checker.v2, story.dialogue-choice.v2]
            situation: "Maya opens a first account for her 100 pay with a parent's help, follows the money from pay to account to card payment, picks a PIN that is not her birthday and turns off an app permission that asks to see her contacts."
            tests: "Where money is kept and how a card draws on it, a PIN or password checked against written rules, and a decision to refuse a permission; each market's account rules for minors."
      - chapter_id: fe-1317-eyes-open
        title: { en-US: Eyes open, es-MX: Ojos abiertos, pt-BR: De olho aberto }
        objective: Say why prices differ, read an ad for what it leaves out, stop a fake deal and learn to wait for what matters most.
        external_prerequisites: [life.wants-and-choices, biz.needs-vs-wants, biz.goods-vs-services, money.compare-amounts, life.saving-for-later]
        lessons:
          - lesson_id: fe-1317-05-why-prices-differ
            eligibility: { minimum_age: 13, maximum_age: 17 }
            knowledge_components: [biz.what-is-price, biz.trade-and-markets, life.smart-shopping]
            kc_status: { biz.what-is-price: active, biz.trade-and-markets: active, life.smart-shopping: draft }
            new_concepts: [biz.what-is-price, biz.trade-and-markets, life.smart-shopping]
            mentor: { character: zara, scene: diorama-a }
            regional: scenarios   # real shops, prices, shipping and second-hand markets differ in each market
            segment_types: [voice.mentor-turn.v2, econ.supply-demand.v2, math.worked-example.v2, reasoning.decide-justify.v2]
            situation: "A limited sneaker drop sells out at 120 while last season's pair sits at 80 and then 50, so the child links price to how many want an item and how many exist, then compares three real offers including 12 for shipping and chooses by what matters to them."
            tests: "Price explained by wanting and scarcity on a supply and demand board, the full cost of an offer (shipping, condition, wait) compared across three sellers, and a justified choice."
          - lesson_id: fe-1317-06-last-chance-ad
            eligibility: { minimum_age: 13, maximum_age: 17 }
            knowledge_components: [life.advertising-literacy, life.think-before-buying]
            kc_status: { life.advertising-literacy: draft, life.think-before-buying: draft }
            new_concepts: [life.advertising-literacy, life.think-before-buying]
            mentor: { character: dina, scene: diorama-b }
            regional: universal
            mentor_misjudgment: true   # Dina buys at once after a 'last chance' video, then lists what the ad left out and sets a wait rule, and says what she does next time
            segment_types: [voice.mentor-turn.v2, voice.mentor-episode.v2, money.spend-decision.v2, reasoning.decision-grid.v2]
            situation: "A creator's video says 'last 5 pairs, 30% off, code ends tonight' for a 60 jacket; Dina buys at once, then lists what the ad left out (who paid for it, how many really remain, the usual price) and sets a 24-hour wait before any purchase over 20."
            tests: "An ad read for who pays, what is claimed and what is missing, a wait rule applied to a spend decision, and judgment without shame in the B.11 episode."
          - lesson_id: fe-1317-07-fake-deal
            eligibility: { minimum_age: 13, maximum_age: 17 }
            knowledge_components: [life.scam-awareness, life.data-privacy, life.banks-and-accounts]
            kc_status: { life.scam-awareness: draft, life.data-privacy: draft, life.banks-and-accounts: draft }
            new_concepts: [life.scam-awareness]
            mentor: { character: rho, scene: diorama-b }
            regional: scenarios   # the scam each market's teenagers actually meet (parcel texts, instant-payment requests, marketplace overpayment)
            segment_types: [voice.mentor-turn.v2, money.scam-check.v2, logic.scam-spotter.v2, story.dialogue-choice.v2, reasoning.decide-justify.v2]
            situation: "Two messages arrive on one evening, a parcel text that asks for 2.50 through a link and a marketplace buyer who overpays by 50 and asks for 40 back; the child marks the signs (rush, odd link, payment outside the app, overpayment) and decides to stop and report."
            tests: "Signs read in two different scams with the same answer ids, per-market messages, and a decision to stop, not pay and report to the platform or an adult."
          - lesson_id: fe-1317-08-wait-and-cushion
            eligibility: { minimum_age: 13, maximum_age: 17 }
            knowledge_components: [life.patience-and-waiting, biz.saving-goal, life.saving-for-later]
            kc_status: { life.patience-and-waiting: draft, biz.saving-goal: active, life.saving-for-later: draft }
            new_concepts: [life.patience-and-waiting, biz.saving-goal]
            mentor: { character: zara, scene: diorama-b }
            regional: universal
            segment_types: [voice.mentor-turn.v2, visual.goal-bullet.v2, logic.savings-rule.v2, reasoning.decide-justify.v2]
            situation: "Jon wants a 240 console and saves 40 a month, which takes 6 months; he adds a 120 cushion for surprises, so the same 40 a month reaches both in 9 months, and he chooses which comes first and why."
            tests: "Two goals with sizes sharing one saving rate, waiting as a choice with a visible cost and benefit, and a justified order of goals."
      - chapter_id: fe-1317-plans-that-grow
        title: { en-US: Plans that grow, es-MX: Planes que crecen, pt-BR: Planos que crescem }
        objective: Work out how long a goal takes, watch interest build it, adjust a plan that slipped and decide what to share.
