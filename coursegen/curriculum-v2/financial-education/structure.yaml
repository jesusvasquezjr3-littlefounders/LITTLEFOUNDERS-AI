            segment_types: [voice.mentor-turn.v2, math.worked-example.v2, visual.savings-line.v2, money.running-ledger.v2]
            situation: "Zara's classroom bank pays 10% of the original deposit each month on 50 coins, so the balance goes 55, 60, 65 after three months, and the child writes down each step and says how long to reach 80."
            tests: "Interest worked out period by period with the 10% of the lesson before, an illustrative rate stated as illustrative, and growth read off a savings line; tier 3 from age 11."
          - lesson_id: fe-1012-12-dream-to-plan
            eligibility: { minimum_age: 10, maximum_age: 12 }
            knowledge_components: [life.goal-planning, biz.saving-goal, money.savings-plan-math]
            kc_status: { life.goal-planning: draft, biz.saving-goal: active, money.savings-plan-math: active }
