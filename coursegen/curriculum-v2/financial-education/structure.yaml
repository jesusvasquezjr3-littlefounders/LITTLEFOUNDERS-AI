            situation: "Lena's payslip shows 2,400 gross, 12% withheld for tax and contributions (288) and 2,112 net; she checks each line, then divides by her 160 hours a month to find that one hour of her work pays 13.20 net."
            tests: "A payslip read line by line, a percent taken off a gross amount, and net pay turned into an hourly value; each market's own withholding lines."
          - lesson_id: fe-adult-02-monthly-budget
            eligibility: { minimum_age: 18, maximum_age: 119 }
            knowledge_components: [money.simple-budget, life.track-earnings, money.estimate-total]
            kc_status: { money.simple-budget: active, life.track-earnings: draft, money.estimate-total: active }
            new_concepts: [money.simple-budget]
            mentor: { character: zara, scene: diorama-b }
            regional: scenarios   # real rent, food and transport costs and the currency of each market
            segment_types: [voice.mentor-turn.v2, money.cash-flow.v2, money.allocation.v2, reasoning.decision-grid.v2]
            situation: "Lena's 2,112 net pays rent 800, food 400, transport 150 and phone and subscriptions 90, which leaves 672; she keeps 200 for saving first and sees that 472 is left to choose freely."
            tests: "Needs paid first from one net amount on a cash-flow board, a saving amount set before the rest, and what remains to choose from; the learner's own figures replace the sample at the transfer step."
          - lesson_id: fe-adult-03-quiet-subscriptions
            eligibility: { minimum_age: 18, maximum_age: 119 }
            knowledge_components: [life.recurring-costs, life.opportunity-cost, biz.value-of-work]
            kc_status: { life.recurring-costs: draft, life.opportunity-cost: draft, biz.value-of-work: active }
            new_concepts: [life.recurring-costs, life.opportunity-cost]
            mentor: { character: dina, scene: diorama-a }
            regional: scenarios   # real services, free-trial renewals and prices differ in each market
            mentor_misjudgment: true   # Dina forgets a free trial and pays for months, then audits every charge and cancels, and says what she does next time
            segment_types: [voice.mentor-turn.v2, voice.mentor-episode.v2, money.running-ledger.v2, money.opportunity-cost.v2]
            situation: "Lena audits seven subscriptions at 9.99, 12, 5, 15, 8, 4.50 and 22.50 a month, 76.99 in all or about 924 a year, which is 70 hours of her 13.20 work, and she keeps the three she used last month."
            tests: "A list of small monthly charges added into a yearly total, the total priced in hours of work, and a keep-or-cancel choice by actual use; the B.11 episode with judgment without shame."
          - lesson_id: fe-adult-04-price-my-time
            eligibility: { minimum_age: 18, maximum_age: 119 }
            knowledge_components: [biz.what-is-price, biz.trade-and-markets, biz.value-of-work]
            kc_status: { biz.what-is-price: active, biz.trade-and-markets: active, biz.value-of-work: active }
            new_concepts: [biz.what-is-price, biz.trade-and-markets]
            mentor: { character: rho, scene: diorama-b }
            regional: scenarios   # what local clients pay, and the rules on self-employed work, differ in each market
            segment_types: [voice.mentor-turn.v2, econ.supply-demand.v2, math.worked-example.v2, reasoning.decide-justify.v2]
            situation: "Lena prices a weekend freelance job after seeing three local ads at 18, 22 and 30 an hour: she picks 22, quotes 8 hours at 176 and finds 154.88 left after the 12% withheld and 134.88 after 20 for materials."
            tests: "A price set by what the market pays and not by what feels fair, the full quote worked through to take-home money, and a justified rate."
      - chapter_id: fe-adult-spend-and-protect
        title: { en-US: "Spend wisely and stay safe", es-MX: Gastar bien y cuidarse, pt-BR: Gastar bem e se proteger }
        objective: Compare purchases by the price of one, read the pitch behind an offer, check an account for fees and stop a scam aimed at your money.
        external_prerequisites: [money.add-money, money.fraction-of-amount, money.compare-amounts, life.wants-and-choices, biz.needs-vs-wants, biz.goods-vs-services]
        lessons:
          - lesson_id: fe-adult-05-price-of-one
            eligibility: { minimum_age: 18, maximum_age: 119 }
            knowledge_components: [money.unit-price, life.smart-shopping, biz.what-is-price]
            kc_status: { money.unit-price: active, life.smart-shopping: draft, biz.what-is-price: active }
            new_concepts: [money.unit-price, life.smart-shopping]
            mentor: { character: zara, scene: diorama-a }
            regional: scenarios   # real shops, pack sizes, prices and currency of each market
            segment_types: [voice.mentor-turn.v2, money.unit-price.v2, math.ratio-table.v2, reasoning.decide-justify.v2]
            situation: "Lena compares two bags of rice, 2 kg for 5.80 and 5 kg for 13.00, finds 2.90 against 2.60 per kilo and checks that the big bag saves 1.50 only if she can store and use all of it."
            tests: "The price of one unit across two pack sizes, a saving that depends on use, and a justified buy; per-market shops and pack sizes."
          - lesson_id: fe-adult-06-read-the-pitch
            eligibility: { minimum_age: 18, maximum_age: 119 }
            knowledge_components: [life.advertising-literacy, life.think-before-buying, money.percent-intro]
            kc_status: { life.advertising-literacy: draft, life.think-before-buying: draft, money.percent-intro: active }
            new_concepts: [life.advertising-literacy, life.think-before-buying]
            mentor: { character: dina, scene: diorama-b }
            regional: scenarios   # real financing offers, 'free' trials and consumer rules differ in each market
            segment_types: [voice.mentor-turn.v2, math.worked-example.v2, money.spend-decision.v2, reasoning.decision-grid.v2]
            situation: "A shop offers a 900 television with nothing down and 12 easy payments of 85, which is 1,020 in all and 120 more than the cash price, and Lena reads what the pitch leaves out before waiting 48 hours to decide."
            tests: "An offer's total cost compared with its cash price, a pitch read for what it hides, and a wait rule applied to a large purchase; no named lender or product."
          - lesson_id: fe-adult-07-fees-and-accounts
            eligibility: { minimum_age: 18, maximum_age: 119 }
            knowledge_components: [life.banks-and-accounts, life.safe-keeping, life.recurring-costs]
            kc_status: { life.banks-and-accounts: draft, life.safe-keeping: draft, life.recurring-costs: draft }
            new_concepts: [life.banks-and-accounts, life.safe-keeping]
            mentor: { character: rho, scene: diorama-a }
            regional: scenarios   # real account types, fees and deposit protection differ in each market
            segment_types: [voice.mentor-turn.v2, logic.flowchart.v2, math.worked-example.v2, reasoning.decide-justify.v2]
            situation: "Lena compares an account with a 4 monthly fee and a free card against one with no fee but 2 per cash withdrawal; with 3 withdrawals a month the first costs 48 a year and the second 72, and she asks what protects her money if a bank fails."
            tests: "Two fee structures priced for the learner's own use, what protects savings in the learner's market, and a justified choice of account."
          - lesson_id: fe-adult-08-stop-the-scam
            eligibility: { minimum_age: 18, maximum_age: 119 }
            knowledge_components: [life.scam-awareness, life.data-privacy, life.banks-and-accounts]
            kc_status: { life.scam-awareness: draft, life.data-privacy: draft, life.banks-and-accounts: draft }
            new_concepts: [life.scam-awareness, life.data-privacy]
            mentor: { character: dina, scene: diorama-b }
            regional: scenarios   # the scams each market's adults actually meet (fake bank calls, instant-payment fraud, investment promises)
            mentor_misjudgment: true   # Dina nearly reads out an SMS code to a caller who sounds like her bank, then hangs up and calls the number on her card, and says what she does next time
            segment_types: [voice.mentor-turn.v2, voice.mentor-episode.v2, money.scam-check.v2, logic.scam-spotter.v2, story.dialogue-choice.v2]
            situation: "A caller who says he is from Lena's bank asks her to move 1,500 to a safe account and read out the code just sent by SMS; she marks the signs (urgency, secrecy, moving money, a code), hangs up and calls the number printed on her card."
            tests: "Signs of a pressure scam read in a live call, codes and passwords kept private, per-market scam scripts with the same answer ids, and judgment without shame in the B.11 episode."
      - chapter_id: fe-adult-plan-ahead
        title: { en-US: Plan what comes next, es-MX: Planear lo que sigue, pt-BR: Planejar o que vem }
        objective: Set goals with numbers and a date, see what a small percent does over time, adjust a plan when life changes and decide what to share.
        external_prerequisites: [life.saving-for-later, life.save-spend-share, life.shared-resources, life.patience-and-waiting, life.wants-and-choices]
        lessons:
          - lesson_id: fe-adult-09-goals-with-a-date
            eligibility: { minimum_age: 18, maximum_age: 119 }
            knowledge_components: [biz.saving-goal, life.goal-planning, money.savings-plan-math]
            kc_status: { biz.saving-goal: active, life.goal-planning: draft, money.savings-plan-math: active }
            new_concepts: [biz.saving-goal, life.goal-planning, money.savings-plan-math]
            mentor: { character: zara, scene: diorama-a }
            regional: scenarios   # the learner's own currency and typical costs
            segment_types: [voice.mentor-turn.v2, math.worked-example.v2, plan.schedule-board.v2, visual.goal-bullet.v2]
            situation: "Lena wants a 6,000 emergency cushion and a 3,000 holiday within 24 months, which needs 375 a month, and her budget leaves 472 free, so she funds both and names the first obstacle, a 600 dental bill."
            tests: "Two goals with sizes and a date turned into one monthly amount, checked against free money from the budget, and an obstacle planned for in advance."
          - lesson_id: fe-adult-10-interest-and-time
            eligibility: { minimum_age: 18, maximum_age: 119 }
            knowledge_components: [money.simple-interest-peek, money.percent-intro, life.opportunity-cost]
            kc_status: { money.simple-interest-peek: active, money.percent-intro: active, life.opportunity-cost: draft }
            new_concepts: [money.simple-interest-peek]
            mentor: { character: dina, scene: diorama-b }
            regional: scenarios   # illustrative rates in each market; never an offer, a named product or a promised return
            segment_types: [voice.mentor-turn.v2, math.worked-example.v2, visual.savings-line.v2, reasoning.decide-justify.v2]
            situation: "Lena compares what an illustrative 3% a year adds to her 6,000 cushion, 180 a year and 540 in three years, with what a 1,000 store credit at an illustrative 2% a month adds to a debt, 20 a month and 240 a year."
            tests: "Simple interest worked out for money earned and for money owed with the same percent skill, rates stated as illustrative, and what waiting costs or earns."
          - lesson_id: fe-adult-11-when-life-changes
            eligibility: { minimum_age: 18, maximum_age: 119 }
            knowledge_components: [life.review-and-adjust-plan, life.goal-planning, money.simple-budget]
            kc_status: { life.review-and-adjust-plan: draft, life.goal-planning: draft, money.simple-budget: active }
            new_concepts: [life.review-and-adjust-plan]
            mentor: { character: rho, scene: diorama-a }
            regional: scenarios   # the learner's own currency and typical costs
            segment_types: [voice.mentor-turn.v2, money.running-ledger.v2, reasoning.decision-grid.v2, plan.schedule-board.v2]
            situation: "Six months in, Lena's rent rises from 800 to 960 and her free money falls from 472 to 312, so the plan needs 22 more months instead of 18, and she keeps the cushion first and moves the holiday four months later."
            tests: "A plan checked against changed numbers, one part adjusted while the rest is held, and the order of goals decided by what matters most."
          - lesson_id: fe-adult-12-share-and-teach
            eligibility: { minimum_age: 18, maximum_age: 119 }
            knowledge_components: [life.common-good, life.giving, life.reflect-on-learning]
            kc_status: { life.common-good: draft, life.giving: draft, life.reflect-on-learning: draft }
            new_concepts: [life.common-good, life.giving, life.reflect-on-learning]
            mentor: { character: zara, scene: diorama-b }
            regional: scenarios   # what withheld contributions pay for, and the groups that receive gifts, differ in each market
            segment_types: [voice.mentor-turn.v2, money.allocation.v2, visual.chart.v2, reasoning.decide-justify.v2]
            situation: "Lena splits a 600 bonus into 300 for the cushion, 180 for herself and 120 to give, then looks at where the 288 withheld from her pay goes in public services, and explains the three ideas she values most to a friend."
            tests: "Where many small contributions go in the learner's market, giving with a part kept and a check on where it goes, and a closing teach-back in the learner's own words (not a quiz)."

