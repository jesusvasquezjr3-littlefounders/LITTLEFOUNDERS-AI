      - chapter_id: fe-1012-first-account
        title: { en-US: My first account, es-MX: Mi primera cuenta, pt-BR: Minha primeira conta }
        objective: See what a bank and an account are for, keep the account and its passwords private, watch savings grow a little each period and turn a wish into a goal with a date.
        external_prerequisites: [life.safe-keeping, biz.saving-goal]
        lessons:
