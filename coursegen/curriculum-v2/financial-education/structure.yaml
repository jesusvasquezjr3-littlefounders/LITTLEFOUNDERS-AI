              - life.safe-keeping
            mentor:
              character: liruf
              scene: diorama-b
            regional: universal
            mentor_misjudgment: true
            segment_types:
              - voice.mentor-turn.v2
              - voice.mentor-episode.v2
              - story.would-you-rather.v2
              - story.branch.v2
            situation: Liruf has 6 saved coins toward a 12-coin kite; he spends 2 on a sweet, an open jar then loses 1, and he moves the rest to a closed box and keeps saving 3 coins a week.
            tests: Small now against bigger later as a choice, a safe place for savings, and carrying on after a small loss; no wrong-answer red.
          - lesson_id: fe-69-16-three-jars
            eligibility:
              minimum_age: 6
              maximum_age: 9
            knowledge_components:
              - life.save-spend-share
              - money.equal-sharing
            kc_status:
              life.save-spend-share: draft
              money.equal-sharing: active
            new_concepts:
              - life.save-spend-share
              - money.equal-sharing
            mentor:
              character: rho
              scene: diorama-b
            regional: universal
            segment_types:
              - voice.mentor-turn.v2
              - money.allocation.v2
              - money.coin-tray.v2
              - reasoning.decide-justify.v2
            situation: Rho receives 12 coins and shares them equally into three jars (save, spend, share) of 4 coins, then chooses a different split and says why; the 4 share coins go equally to two friends, 2 each.
            tests: Equal sharing with nothing left over, a three-way split chosen and justified, and the first decision between equal and unequal shares.
