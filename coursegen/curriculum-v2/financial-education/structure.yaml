            mentor: { character: zara, scene: diorama-a }
            regional: universal
            mentor_misjudgment: true   # Zara drops the plan after a setback, then compares plan with reality and adjusts one part, and says what she does next time
            segment_types: [voice.mentor-turn.v2, voice.mentor-episode.v2, money.running-ledger.v2, reasoning.decision-grid.v2]
            situation: "After 3 months Sam has 240 instead of the planned 300 because a repair cost 60; he sets plan against what happened and adjusts one part, finishing in 9 months instead of 6, rather than giving up."
            tests: "A plan checked against the ledger of what happened, one part adjusted (time, amount or goal) with the others held, and the B.11 episode with judgment without shame."
          - lesson_id: fe-1317-12-share-and-teach
            eligibility: { minimum_age: 13, maximum_age: 17 }
            knowledge_components: [life.save-spend-share, life.giving, life.reflect-on-learning]
            kc_status: { life.save-spend-share: draft, life.giving: draft, life.reflect-on-learning: draft }
            new_concepts: [life.save-spend-share, life.giving, life.reflect-on-learning]
            mentor: { character: dina, scene: diorama-a }
            regional: scenarios   # donation customs and the groups that receive help differ in each market
            segment_types: [voice.mentor-turn.v2, money.allocation.v2, story.would-you-rather.v2, reasoning.decide-justify.v2]
            situation: "Sam splits a pay of 200 into 60% to spend (120), 30% to save (60) and 10% to give (20), gives to a neighborhood group after checking where the money goes, then explains in his own words what he learned about plans and teaches one idea to a younger sibling."
            tests: "A percent split with a share kept for giving, a check on where the help goes, and the closing teach-back in the learner's own words (not a quiz)."

