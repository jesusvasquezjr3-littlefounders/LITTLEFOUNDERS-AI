            situation: "Ana puts 80 coins from the school kiosk into a savings account and follows the balance through a deposit of 30, a cash withdrawal of 20 and a card payment of 15, ending at 75, and sees that the card spends the money already in the account."
            tests: "What a bank and an account are for, how money comes out, and how a card connects to saved money; a balance followed step by step, with each market's own banking setting."
          - lesson_id: fe-1012-10-keep-it-private
