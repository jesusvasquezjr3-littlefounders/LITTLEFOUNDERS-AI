            segment_types: [voice.mentor-turn.v2, visual.goal-bullet.v2, story.branch.v2, reasoning.decide-justify.v2]
            situation: "Mia turns 'I want a bike' into a goal of 120 coins by the end of June, splits it into 12 weekly steps of 10 coins and plans ahead for an obstacle, a birthday gift of 15 coins in week 5."
            tests: "A wish made into a goal with a size and a date, steps, and an obstacle planned for in advance; the plan is written before it is tested."
      - chapter_id: fe-1012-class-garden
        title: { en-US: The class garden, es-MX: El huerto del salón, pt-BR: A horta da turma }
        objective: Care for what the class shares, see how many small contributions pay for what everyone uses, plan and review a group project, and give with care.
        external_prerequisites: [life.save-spend-share]
        lessons:
          - lesson_id: fe-1012-13-share-the-garden
            eligibility: { minimum_age: 10, maximum_age: 12 }
            knowledge_components: [life.shared-resources, money.equal-sharing]
            kc_status: { life.shared-resources: draft, money.equal-sharing: active }
            new_concepts: [life.shared-resources]
            mentor: { character: zara, scene: diorama-a }
            regional: universal
            mentor_misjudgment: true   # Zara skips her watering day and leaves the shared can empty, then fills it, takes the next shift and says what she does next time
            segment_types: [voice.mentor-turn.v2, voice.mentor-episode.v2, story.dialogue-choice.v2, reasoning.decide-justify.v2]
            situation: "The class garden has 1 watering can and 12 pupils, so the group sets a fair rota of 3 pupils a day over 4 days, and Zara, who skipped her day, refills the can and takes the next shift."
            tests: "A fair turn-taking rule that spreads the work, the B.11 episode with judgment without shame, and a decision about an unfair share."
          - lesson_id: fe-1012-14-many-small-shares
            eligibility: { minimum_age: 10, maximum_age: 12 }
            knowledge_components: [life.common-good, life.shared-resources, money.equal-sharing]
