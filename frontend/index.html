<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LittleFounders</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- Icon font uses display=block, NOT swap: the glyphs are ligatures, so
         during the swap period the fallback font paints the raw ligature name
         ("close", "timer", "check_circle") as visible text. block keeps the
         icon slot blank until the font arrives — no literal-word flash. Any
         name that never resolves to a glyph is caught at render by Icon.tsx's
         fallback. Figtree (body text) stays on swap on purpose. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400..700,0..1,0&display=block"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
