<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>LittleFounders share card</title>
<!--
  The share card, as source rather than as a mystery image.

  It is built from assets we own and the rebuilt design system only (Frontend
  Bible 02 D3, D4 and D8: one system for marketing too; rules 2 and 21; 07 §1
  and §3): a solid primary ground (tokens.css --primary #5c55fd), Fredoka and
  Nunito self-hosted from public/fonts, the brand mark (manifest `brand.mark`)
  beside the text wordmark, as in the site shell and the emails, and the four
  Mentors as their manifest-registered real-model renders
  (`mentor.<id>.avatar.light`, 07 §4). No gradient, no shadow, no stock art.

  Until gap-fix round 2 it wore the legacy brand: Inter and Sora from Google
  Fonts, an indigo radial gradient, a gradient rule, drop shadows and the
  raster logo with gradient text and two stock child figures.

  A share card is read at about 500px wide in a feed and often on a phone, so
  everything here is sized to survive being halved: one short line, high
  contrast, no paragraph.

  REGENERATE: `npm run seo:cards` (scripts/seo/render-cards.mjs) serves
  `frontend/`, opens this file per locale and writes public/og/og-card-<en|es|pt>.jpg.
-->
<style>
  @font-face { font-family: Fredoka; font-weight: 300 700; src: url('../../public/fonts/fredoka-latin-v1.woff2') format('woff2'); }
  @font-face { font-family: Nunito; font-weight: 200 1000; src: url('../../public/fonts/nunito-latin-v1.woff2') format('woff2'); }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { width: 1200px; height: 630px; overflow: hidden; }

  body {
    position: relative;
    font-family: Nunito, sans-serif;
    background: #5c55fd; /* --primary */
    color: #ffffff;      /* --on-primary */
  }

  .card { position: relative; height: 100%; padding: 60px 68px 0; }

  .brand { display: flex; align-items: center; gap: 18px; }
  .brand img { width: 64px; height: 64px; display: block; }
  .wordmark { font-family: Fredoka, sans-serif; font-weight: 700; font-size: 46px; letter-spacing: -0.01em; }

  .kicker {
    margin-top: 44px;
    font-size: 26px;
    font-weight: 800;
    color: #eceffe; /* --primary-soft (light) */
  }

  h1 {
    margin-top: 14px;
    max-width: 640px;
    font-family: Fredoka, sans-serif;
    font-weight: 600;
    font-size: 62px;
    line-height: 1.08;
    text-wrap: balance;
  }

  .langs {
    position: absolute;
    left: 68px; bottom: 50px;
    display: flex; gap: 14px; align-items: center;
    font-size: 22px; font-weight: 700; color: #eceffe;
  }

  .domain {
    position: absolute;
    right: 68px; top: 76px;
    font-size: 22px; font-weight: 700; color: #eceffe;
  }

  /* A flat ground the four Mentors stand on, in the primary ridge token: no shadow, no gradient. */
  .stage {
    position: absolute;
    right: 0; bottom: 0;
    width: 720px; height: 84px;
    background: #4438cf; /* --primary-ridge */
    border-top-left-radius: 42px;
  }

  .cast {
    position: absolute;
    right: 44px; bottom: 30px;
    display: flex; align-items: flex-end; gap: 4px;
  }
  .cast img { width: 158px; height: 158px; display: block; object-fit: contain; }
</style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <img src="../../public/rebuild/brand/mark.svg" alt="" />
      <span class="wordmark">LittleFounders</span>
    </div>
    <p class="kicker" id="kicker">Financial learning for families</p>
    <h1 id="line">Kids learn money by deciding, not by watching.</h1>
  </div>

  <p class="domain">littlefounders.ai</p>

  <div class="langs">
    <span>ES</span><span>·</span><span>EN</span><span>·</span><span>PT</span>
  </div>

  <div class="stage"></div>
  <div class="cast">
    <img src="../../public/rebuild/mentor-avatars/zara-light.png" alt="" />
    <img src="../../public/rebuild/mentor-avatars/liruf-light.png" alt="" />
    <img src="../../public/rebuild/mentor-avatars/rho-light.png" alt="" />
    <img src="../../public/rebuild/mentor-avatars/dina-light.png" alt="" />
  </div>

<script type="module">
  // Copy comes from site.mjs so the card and the meta tags can never disagree
  // about what LittleFounders claims to be.
  const { CARD_LINE, CARD_KICKER } = await import('./site.mjs');
  const locale = new URLSearchParams(location.search).get('locale') || 'en-US';
  document.getElementById('line').textContent = CARD_LINE[locale] ?? CARD_LINE['en-US'];
  document.getElementById('kicker').textContent = CARD_KICKER[locale] ?? CARD_KICKER['en-US'];
  document.documentElement.lang = locale;
  await document.fonts.load('600 62px Fredoka');
  await document.fonts.load('800 26px Nunito');
  await Promise.all([...document.images].map((img) => img.decode().catch(() => {})));
  document.body.dataset.ready = 'true';
</script>
</body>
</html>
