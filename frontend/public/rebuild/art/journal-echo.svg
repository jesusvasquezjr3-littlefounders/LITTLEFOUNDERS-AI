<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none" aria-hidden="true">
  <style>*{transform-box:fill-box}
  .r{transform-origin:50% 50%;animation:ripple 3.2s cubic-bezier(.2,.6,.3,1) infinite;opacity:0}
  .r2{animation-delay:.55s}.r3{animation-delay:1.1s}
  .dot{transform-origin:50% 50%;animation:beat 3.2s cubic-bezier(.34,1.56,.64,1) infinite}
  @keyframes ripple{0%{transform:scale(.3);opacity:0}15%{opacity:1}100%{transform:scale(1);opacity:0}}
  @keyframes beat{0%,100%{transform:scale(1)}8%{transform:scale(1.25)}16%{transform:scale(1)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}.r{opacity:1}.r1{transform:scale(.45)}.r2{transform:scale(.72)}.r3{transform:scale(1)}}</style>
  <circle class="r r1" cx="48" cy="48" r="42" stroke="#05A893" stroke-width="5"/>
  <circle class="r r2" cx="48" cy="48" r="42" stroke="#05A893" stroke-width="5"/>
  <circle class="r r3" cx="48" cy="48" r="42" stroke="#C7FEF1" stroke-width="5"/>
  <circle class="dot" cx="48" cy="48" r="9" fill="#018675"/>
</svg>
