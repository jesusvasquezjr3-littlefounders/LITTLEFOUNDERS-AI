<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none" aria-hidden="true">
  <style>*{transform-box:fill-box}
  .bag{transform-origin:50% 0;animation:swing 5.4s cubic-bezier(.34,1.56,.64,1) infinite}
  .handle{animation:lift 5.4s cubic-bezier(.34,1.56,.64,1) infinite}
