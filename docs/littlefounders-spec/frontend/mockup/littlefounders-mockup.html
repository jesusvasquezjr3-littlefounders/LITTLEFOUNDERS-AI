function fxLayer(){ const f=document.getElementById('frame'); let l=f.querySelector('.fx'); if(!l){ l=document.createElement('div'); l.className='fx'; l.setAttribute('aria-hidden','true'); f.appendChild(l);} return l; }
/* Confetti. Celebration budget (02 D7, OD-7): called ONLY for a milestone on the closed list. In this mockup that
   is one place: arriving on the lesson-complete screen, once per completed lesson. Never for a correct answer,
   a coin split or a sign-up. No "+XP" floater exists any more: XP is shown on the lesson-complete screen. */
function burst(origin,{n=26}={}){
  if(REDUCED()||!origin) return;
  const fr=document.getElementById('frame').getBoundingClientRect(), o=origin.getBoundingClientRect();
  const cx=o.left-fr.left+o.width/2, cy=o.top-fr.top+o.height/2, L=fxLayer();
  const cols=['--lf-accent','--lf-reward','--lf-mint','--lf-sky','--lf-berry','--lf-primary'].map(cssv);
  for(let i=0;i<n;i++){
    const p=document.createElement('i'); p.className='p'; const sz=8+Math.random()*8, pill=Math.random()<.4;
    Object.assign(p.style,{width:(pill?sz*1.7:sz)+'px',height:sz+'px',borderRadius:pill?'999px':'50%',background:cols[i%cols.length]});
    L.appendChild(p);
    const a=(-90+(Math.random()-.5)*150)*Math.PI/180, v=150+Math.random()*190, dx=Math.cos(a)*v, dy=Math.sin(a)*v, rot=(Math.random()-.5)*720;
    p.animate([{transform:`translate(${cx}px,${cy}px) rotate(0deg) scale(.4)`,opacity:1},
               {transform:`translate(${cx+dx*.7}px,${cy+dy*.7}px) rotate(${rot*.6}deg) scale(1)`,opacity:1,offset:.45},
               {transform:`translate(${cx+dx}px,${cy+dy+230}px) rotate(${rot}deg) scale(.9)`,opacity:0}],
              {duration:900+Math.random()*450,easing:'cubic-bezier(0,0,.2,1)',fill:'forwards'}).onfinish=()=>p.remove();
  }
}
function ringAt(btn,e){ if(REDUCED()) return; const r=btn.getBoundingClientRect(), d=Math.max(r.width,r.height)*2.2, x=(e.clientX||r.left+r.width/2)-r.left, y=(e.clientY||r.top+r.height/2)-r.top;
  const s=document.createElement('span'); s.className='ring'; Object.assign(s.style,{left:x+'px',top:y+'px',width:d+'px',height:d+'px'}); btn.appendChild(s); setTimeout(()=>s.remove(),600); }

/* Course grid (K39, Text Fit Contract rule 5): a column is never narrower than the longest word of any course
   title. The longest word is measured with the title's live font, weight and letter-spacing (so WCAG 1.4.12
   text-spacing overrides are included) and becomes the grid's minimum column width; below it the grid
   reflows to fewer columns, down to one. No mid-word break, no smaller text. */
function fitCourseGrid(app){
  const g=app.querySelector('.grid-courses'); if(!g) return;
  const titles=[...g.querySelectorAll('.course .t-title')]; if(!titles.length) return;
  const cv=document.createElement('canvas').getContext('2d'); let max=0;
  for(const h of titles){ const cs=getComputedStyle(h); cv.font=`${cs.fontStyle} ${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
    try{ cv.letterSpacing=cs.letterSpacing==='normal'?'0px':cs.letterSpacing; }catch(e){}
    for(const w of h.textContent.split(/\s+/).filter(Boolean)) max=Math.max(max,cv.measureText(w).width); }
  const card=titles[0].closest('.course'), cs=getComputedStyle(card);
  g.style.setProperty('--course-min',Math.ceil(max+parseFloat(cs.paddingLeft)+parseFloat(cs.paddingRight)+4)+'px');
}

function postRender(exOut){
  const app=document.getElementById('app');
  fitCourseGrid(app);
  app.querySelectorAll('.bar>i[data-to]').forEach(i=>{ const to=i.dataset.to+'%'; if(REDUCED()){ i.style.width=to; return; } requestAnimationFrame(()=>requestAnimationFrame(()=>{ i.style.width=to; })); });
  app.querySelectorAll('[data-count]').forEach(el=>{ if(REDUCED()) return; const end=+el.dataset.count, pre=el.dataset.pre||'', suf=el.dataset.suf||'', d0=+el.dataset.delay||0, t0=performance.now()+d0;
    (function tick(now){ const k=Math.min(1,Math.max(0,(now-t0)/700)), e=1-Math.pow(1-k,3); el.textContent=pre+Math.round(end*e)+suf; if(k<1) requestAnimationFrame(tick); })(performance.now()); });
  const fx=S.fx; S.fx=null; S.enter=false; S.arm=false;
  if(fx&&fx.kind==='correct'){ haptic([12,30,12]); }          // bump + check + banner: no confetti, no floater (D7)
  if(fx&&fx.kind==='wrong'){ haptic(30); }
  if(fx&&fx.kind==='ex-advance') exerciseSlide(app,exOut);
  if(fx&&fx.kind==='row-approve'){ approveRowWipe(app,fx.row); setTimeout(()=>{ if(S.justApproved===fx.row) S.justApproved=null; },900); }
  if(fx&&fx.kind==='celebrate'){ setTimeout(()=>burst(app.querySelector('.result .medal'),{n:30}),350); haptic([12,30,12]); }  // milestone: lesson complete
  if(fx&&fx.kind==='focus'){ const el=app.querySelector(fx.sel); if(el) el.focus({preventScroll:true}); }
  if(fx&&fx.kind==='scroll'){ const el=app.querySelector('#'+fx.id); if(el) el.scrollIntoView({behavior:REDUCED()?'auto':'smooth',block:'start'}); }
  { const m=app.querySelector('#mcta'), sc=app.querySelector('.scroller'); if(m&&sc){ const f=()=>m.classList.toggle('on',sc.scrollTop>320||!!S.forceMcta); sc.addEventListener('scroll',f,{passive:true}); f(); } }
  bindNumberLine(app);
  if(S.toast){ clearTimeout(S._tt); S._tt=setTimeout(()=>{ S.toast=null; render(); },4200); }
}

/* ---------------------------- lesson-engine transition ----------------------------
   One exercise replaces another as a single choreographed slide: the outgoing card
   moves out and fades (accelerate/exit easing), the incoming card moves in from the
   opposite side and fades in (decelerate/enter easing), with a brief overlap so the
   two motions read as one continuous handoff rather than two separate cuts; this is
   the "the scene's own elements participate" pattern (a card sliding off as the next
   one slides on), not a generic fade. Distance is a fraction of the track's own width,
   so it scales with container size instead of a fixed pixel jump (keeps the motion
   proportionate on both phone and desktop widths, see 04-MOTION.md §4.1).
   Reduced motion: both cards simply swap with a cross-fade at 1/3 the duration, no
   translation. Every state still happens, only the travel is removed. */
function exerciseSlide(app,exOutClone){
  const track=app.querySelector('[data-ex-track]'), inCard=app.querySelector('[data-ex-key]'), foot=app.querySelector('.lesson-foot .inner');
  if(!track||!inCard) return;
  const w=track.clientWidth||320, reduced=REDUCED();
  const dur=reduced?120:parseFloat(getComputedStyle(document.body).getPropertyValue('--dur-transition'))||380;
  const distIn=reduced?0:w*0.18, distOut=reduced?0:-w*0.14;
  if(exOutClone){
    exOutClone.querySelectorAll('.answer').forEach(a=>{ a.removeAttribute('data-state'); a.querySelector('.mark').innerHTML=''; });
    exOutClone.querySelectorAll('.offer').forEach(o=>o.remove());
    exOutClone.style.cssText='position:absolute;inset:0;pointer-events:none;will-change:transform,opacity';
    track.style.position='relative';
    track.appendChild(exOutClone);
    exOutClone.animate([{transform:'translateX(0)',opacity:1},{transform:`translateX(${distOut}px)`,opacity:0}],
      {duration:dur,easing:'cubic-bezier(.4,0,1,1)',fill:'forwards'}).onfinish=()=>exOutClone.remove();
  }
  inCard.animate([{transform:`translateX(${distIn}px)`,opacity:0},{transform:'translateX(0)',opacity:1}],
    {duration:dur,delay:reduced?0:dur*0.22,easing:'cubic-bezier(0,0,.2,1)',fill:'backwards'});
  if(foot){ foot.animate([{opacity:0},{opacity:1}],{duration:reduced?100:dur*0.7,delay:reduced?0:dur*0.3,easing:'cubic-bezier(0,0,.2,1)',fill:'backwards'}); }
}

/* ---------------------------- success-wipe: the scene's own card participates ----------------------------
   Parent experience only (approving a chore is a parent action, OD-3). A solid success-coloured panel covers
   the row from the top edge, holds briefly with its own check mark and label, then wipes away in the SAME
   direction it arrived, revealing the row already updated underneath. Reduced motion: a short cross-fade. */
function approveRowWipe(app,rowIdx){
  const row=app.querySelector(`.row-card[data-row-key="${rowIdx}"]`);
  if(!row) return;
  const reduced=REDUCED();
  const hold=reduced?90:parseFloat(getComputedStyle(document.body).getPropertyValue('--dur-component'))||250;
  const wipe=reduced?90:parseFloat(getComputedStyle(document.body).getPropertyValue('--dur-micro'))||150;
  row.style.position='relative'; row.style.overflow='hidden';
  const cover=document.createElement('div');
  cover.className='wipe-cover';
  cover.innerHTML=`${ICONS('check')}<span></span>`;
  cover.querySelector('span').textContent=row.querySelector('.mid .t-label')?.textContent||'';
  row.appendChild(cover);
  const kf=reduced?[{opacity:0},{opacity:1,offset:.34},{opacity:1,offset:.66},{opacity:0}]
                  :[{transform:'translateY(-100%)'},{transform:'translateY(0%)',offset:0.28},{transform:'translateY(0%)',offset:0.72},{transform:'translateY(100%)'}];
  cover.animate(kf,{duration:wipe*2+hold,easing:'cubic-bezier(.4,0,.2,1)',fill:'forwards'}).onfinish=()=>{ cover.remove(); row.style.overflow=''; };
  haptic([10,20,10]);
}

/* ---------------------------- helpers ---------------------------- */
const chip=(cls,ic,txt)=>`<span class="chip ${cls}">${ic?ICONS(ic):''}<span>${txt}</span></span>`;
function btn(label,o={}){

  // data-copy-role (06-COPY-BUDGET): the brand line "Become your child's Tutor" (EN/ES/PT) is an approved brand string.
  const role=o.role||(/Tutor/.test(label)?'brand':'');
  const a=`${o.go?` data-go="${o.go}"`:''}${o.act?` data-act="${o.act}"`:''}${role?` data-copy-role="${role}"`:''}${o.attrs?' '+o.attrs:''}${o.dis?' disabled':''}`;
  const inner=`${o.icon?ICONS(o.icon):''}<span>${label}</span>${o.iconR?ICONS(o.iconR):''}`;
  return o.tag==='a'?`<a class="${cls}" href="#"${a}>${inner}</a>`:`<button class="${cls}"${a}>${inner}</button>`;
}

/* ---------------------------- shells: learner, parent and staff ----------------------------
   One design system, three experiences (OD-3, OD-4): the same tokens and components, but each audience has its
   own shell and navigation. Learner: Learn / Mentor (the chosen character) / Tasks / Wallet / Profile, each
   reaching its screen. Parent and staff: their own shells; their nav items jump to the sections of the page. */
const NAV=[['learn','book','home'],['mentor',null,'mentor'],['tasks','tasks','tasks'],['wallet','wallet','wallet'],['me','user','me']];
const activeNav=()=>({home:'learn',lesson:'learn',result:'learn',board:'learn',mentor:'mentor',tasks:'tasks',wallet:'wallet',me:'me'})[S.route];
const navLabel=(t,k)=>k==='mentor'?mentor().name:t.nav[k];
const navIcon=(k,i)=>k==='mentor'?`<span class="tab-av" data-hue="${mentor().h}" aria-hidden="true">${mentor().l}</span>`:ICONS(i);
function tabbar(t){return `<nav class="tabbar" aria-label="Main">${NAV.map(([k,i,g])=>`<button class="tab" ${activeNav()===k?'aria-current="page"':''} data-go="${g}">${navIcon(k,i)}<span class="tab-label">${navLabel(t,k)}</span></button>`).join('')}</nav>`;}
function sidebar(t){return `<aside class="sidebar"><div class="brand-mark"><i>LF</i><span>LittleFounders</span></div>${NAV.map(([k,i,g])=>`<button class="nav-item" ${activeNav()===k?'aria-current="page"':''} data-go="${g}">${navIcon(k,i)}<span>${navLabel(t,k)}</span></button>`).join('')}<div class="push"></div></aside>`;}
const shell=(t,inner)=>`<div class="shell">${sidebar(t)}<main class="scroller">${inner}</main></div>${tabbar(t)}${overlays(t)}`;
/* console shell: parent and staff. items = [[sectionId, icon, label]] */
function consoleShell(t,kind,roleLabel,items,inner){
  const cur=S.cnav&&S.cnav[kind]!==undefined?S.cnav[kind]:0;
  const nav=(cls)=>items.map(([id,ic,l],ix)=>`<button class="${cls}" ${cur===ix?'aria-current="true"':''} data-cnav="${kind}:${ix}:${id}">${ICONS(ic)}<span class="${cls==='tab'?'tab-label':''}">${l}</span></button>`).join('');
  return `<div class="shell console" data-kind="${kind}"><aside class="sidebar"><div class="brand-mark"><i>LF</i><span>LittleFounders</span></div><span class="chip role-chip">${ICONS(kind==='parent'?'users':'shield')}<span>${roleLabel}</span></span>${nav('nav-item')}<div class="push"></div></aside>
   <main class="scroller"><header class="appbar"><span class="brand-mark"><i>LF</i><span>LittleFounders</span></span><span class="chip role-chip">${ICONS(kind==='parent'?'users':'shield')}<span>${roleLabel}</span></span></header>${inner}</main></div>
   <nav class="tabbar" style="grid-template-columns:repeat(${items.length},minmax(0,1fr))" aria-label="${roleLabel}">${nav('tab')}</nav>${overlays(t)}`;
}
function overlays(t){
  let h='';
  if(S.dialog){ const D=t.m.staff; h+=`<div class="scrim"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-t"><h2 class="t-headline" id="dlg-t">${D.dialogT}</h2><p class="t-body">${D.dialogD}</p>
    <div class="field"><label class="lbl" for="dlg-note">${D.note}</label><textarea class="input" id="dlg-note" rows="3" placeholder="${esc(D.notePh)}"></textarea></div>
    <div class="actions">${btn(D.keep,{cls:'secondary',act:'dlg-keep'})}${btn(D.send,{hue:'primary',icon:'arrow-l',act:'dlg-confirm'})}</div></div></div>`; }
  if(S.toast){ h+=`<div class="toast" role="status"><span class="disc">${ICONS('check')}</span><p class="t-label" style="margin:0;align-self:center">${esc(S.toast)}</p></div>`; }
  return h;
}

const GUIDED_REVIEW_AFTER=3;   // consecutive misses on the same exercise (10 B.26 proposed value; OD-1)
function lesson(t){
  const ex=t.exercises[S.exIdx], M=mentor();
  const st=i=>!S.checked?(S.sel===i?'selected':'idle'):(i===S.sel?(i===ex.correctIdx?'correct':'wrong'):'dimmed');
  const ok=S.sel===ex.correctIdx;
  const opts=ex.opts.map((o,i)=>{const s=st(i);const mark=s==='correct'?ICONS('check'):s==='wrong'?ICONS('x'):'';
    const fxc=(S.fx&&S.fx.kind==='select'&&S.fx.i===i)?' fx-bump':(S.fx&&S.fx.kind==='correct'&&i===ex.correctIdx)?' fx-bump':(S.fx&&S.fx.kind==='wrong'&&i===S.sel)?' fx-shake':'';
    return `<button class="answer${fxc}" data-a="${i}" data-state="${s}" ${S.checked?'disabled':''} aria-pressed="${S.sel===i}"><span class="mark" aria-hidden="true">${mark}</span><span>${o}</span></button>`}).join('');
  const feedback=S.checked?`<div class="banner ${ok?'':'wrong'}" role="status"><span class="disc">${ICONS(ok?'check':'x')}</span><div><p class="t-label">${ok?ex.good:ex.bad}</p><p class="t-body">${ok?ex.goodSub:ex.badSub}</p></div></div>`:'';
  const isLast=S.exIdx===t.exercises.length-1;
  const action=S.checked?(ok?`<button class="btn lg block pulse success" data-act="reset">${isLast?t.finishLesson:t.next}</button>`:`<button class="btn lg block inverse" data-act="reset">${t.tryAgain}</button>`)
    :`<button class="btn lg block ${S.arm?'arm pulse':(S.sel!==null?'pulse':'')}" data-act="check" ${S.sel===null?'disabled':''}>${t.check}</button>`;
  // guided review: an offer from the learner's Mentor after 3 consecutive misses; never a penalty, can be declined
  const offer=(S.misses>=GUIDED_REVIEW_AFTER&&!S.reviewDeclined&&!(S.checked&&ok))?`<aside class="offer" aria-labelledby="offer-h">${mAv(M)}<div class="txt"><h2 class="t-title" id="offer-h" style="color:inherit">${t.review.h(M.name)}</h2><p class="t-body" style="color:inherit" data-copy-role="mentor">${t.review.d}</p>
    <div class="offer-acts">${btn(t.review.yes(M.name),{cls:'inverse',act:'review-yes',icon:'chat'})}<button class="lnk on-fill" data-act="review-no">${t.review.no}</button></div></div></aside>`:'';
  const pct=Math.round(((S.exIdx+(S.checked&&ok?1:0))/t.exercises.length)*100);
  return `<div class="scroller"><div class="lesson">
    <div class="lesson-top"><button class="icon-btn" aria-label="${t.close}" data-go="home">${ICONS('x')}</button><span class="bar" role="progressbar" aria-label="${t.lessonProgress}" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${S.enter?Math.round((S.exIdx/t.exercises.length)*100):pct}%" data-to="${pct}"></i></span></div>
    <div class="lesson-body" data-ex-track><div class="ex-slide" data-ex-key="${S.exIdx}"><section class="q"><div class="ask">${mAv(M)}<span class="t-caption">${t.asks(M.name)}</span></div><h1 class="qtext" data-copy-role="prompt">${ex.q}</h1></section><div class="answers" role="group" aria-label="${t.asks(M.name)}">${opts}</div>${offer}</div></div>
    <div class="lesson-foot"><div class="inner">${feedback}${action}</div></div>
  </div></div>`;
}
/* Result: derived from the session that just ended (K32/K33). The lesson has 4 exercises and only advances on a
   correct answer, so the honest measures are "answered on the first try" and first-try accuracy. Opened directly
   (no session), it shows a sample session of 3 of 4 on the first try. Best is never below today. */
const BEST_BEFORE=80, SAMPLE_SESSION={firstTry:[true,true,false,true],ms:200000};
function result(t){
  const ses=(S.session&&S.session.firstTry.length)?S.session:SAMPLE_SESSION;
  const n=ses.firstTry.length, a=ses.firstTry.filter(Boolean).length, acc=Math.round(a/n*100), xp=n*10;
  const sec=Math.max(1,Math.round(ses.ms/1000)), time=`${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}`;
  const best=Math.max(acc,BEST_BEFORE), isNew=acc>BEST_BEFORE;
  const tiles=[['reward','star','+'+xp,t.xpEarned,xp,'+',''],['success','check',acc+'%',t.accuracy,acc,'','%'],['sky','clock',time,t.time,0,'','']].map(([h,i,v,l,nn,pre,suf],ix)=>`<div class="rtile" style="--i:${ix}"><span class="disc">${ICONS(i)}</span><span class="txt"><span class="t-numeral" ${nn?`data-count="${nn}" data-pre="${pre}" data-suf="${suf}" data-delay="${500+ix*130}"`:''}>${v}</span><span class="t-caption">${l}</span></span></div>`).join('');
  return `<div class="scroller"><div class="result ${S.enter?'enter':''}"><div class="top-band">${medalArt}<h1 class="t-display-lg">${t.lessonDone}</h1><p class="t-body-lg" style="color:inherit">${t.score(a,n)}</p></div>
   <div class="sheet"><div class="stat-tiles">${tiles}</div>
   <div class="vs"><div class="vs-head"><h2 class="t-title" style="color:inherit">${t.todayVsBest}</h2>${isNew?`<span class="chip on-accent">${ICONS('star')}<span>${t.newBest}</span></span>`:''}</div>
     <div class="line"><span class="t-caption">${t.today}</span><span class="bar" role="progressbar" aria-label="${t.today}" aria-valuenow="${acc}" aria-valuemin="0" aria-valuemax="100"><i style="width:4%" data-to="${acc}"></i></span><span class="t-label">${acc}%</span></div>
     <div class="line best"><span class="t-caption">${t.best}</span><span class="bar" role="progressbar" aria-label="${t.best}" aria-valuenow="${best}" aria-valuemin="0" aria-valuemax="100"><i style="width:4%" data-to="${best}"></i></span><span class="t-label">${best}%</span></div></div>
   <button class="btn lg block pulse" data-go="home">${t.cont}${ICONS('arrow')}</button></div></div></div>`;
}

/* Mentor screen (K8, K9, K35): character slot, a short conversation, the guided-review offer, and the chooser. */
function mentorScreen(t){
  const M=mentor(), X=t.m.mentor;
  const bubbles=X.chat.map(c=>c.by==='m'?`<div class="bub m">${mAv(M,'sm')}<div class="b"><p class="t-caption muted" style="margin:0">${M.name}</p><p class="t-body" style="margin:0" data-copy-role="mentor">${c.t}</p></div></div>`

/* ======================= TEACHING VISUALS: the board (05-TEACHING-VISUALS.md) =======================
   A lesson screen (full-bleed lesson hue) with ONE neutral board inside it. The Mentor and the prompt sit
   outside the board; the control strip (tap and keyboard alternatives) sits under it; feedback lives in the
   existing lesson foot. Inside the board: series hues sky / mint / berry only, primary only for selection,
   axis in edge, labels in HTML, no celebration. Pure scorers below (05 §1 V1, Appendix P Part 7). */
const LINE_RUBRIC={target:6/8,tolerance:1/16,snap:8};
const scoreLine=(v8,r=LINE_RUBRIC)=>Math.abs(v8/r.snap-r.target)<=r.tolerance-1e-9;
const DISC={price:60,off:0.25};
const discTrue=()=>DISC.price*(1-DISC.off);
const scorePred=v=>Math.abs(v-discTrue())<0.5;
const SCEN=[{p:50,s:20,w:1},{p:5,s:20,w:1},{p:30,s:20,w:0},{p:25,s:30,w:1}];   // item names in T; w=1 want, w=0 need
const RULE_KEY={a:'more',j:'and',b:'want',then:'wait',else:'buy'};                 // hidden reference behaviour
function runRule(r,sc){ const A=r.a==='more'?sc.p>sc.s:sc.p<sc.s, B=r.b==='want'?!!sc.w:!sc.w; const c=r.j==='and'?(A&&B):(A||B); return c?r.then:r.else; }
const ruleComplete=r=>['a','j','b','then','else'].every(k=>r[k]);
const FRAC=['0','1/8','1/4','3/8','1/2','5/8','3/4','7/8','1'];

function board(t){
  const B=t.m.board, d=S.board.demo, M=mentor();
  const body=[bLine,bDisc,bRule][d](t,B);
  const picker=`<div class="bpick" role="tablist" aria-label="${B.pick}">${B.demos.map((x,i)=>`<button class="bp" role="tab" aria-selected="${d===i}" data-bdemo="${i}">${x}</button>`).join('')}</div>`;
  return `<div class="scroller"><div class="lesson board-screen">
   <div class="lesson-top"><button class="icon-btn" aria-label="${t.close}" data-go="home">${ICONS('x')}</button><h1 class="t-headline" style="color:inherit">${B.h}</h1></div>
   <div class="bbody">${picker}
    <section class="q"><div class="ask">${mAv(M)}<span class="t-caption">${t.asks(M.name)}</span></div><h2 class="qtext" data-copy-role="prompt">${body.q}</h2></section>
    <div class="vboard">${body.board}</div>
    <div class="vstrip">${body.strip}</div>
    <p class="sr-only" aria-live="polite">${esc(S.board.live||'')}</p>
   </div>
   <div class="lesson-foot"><div class="inner">${body.foot}</div></div></div></div>`;
}
const bBanner=(ok,h,d)=>`<div class="banner ${ok?'':'wrong'}" role="status"><span class="disc">${ICONS(ok?'check':'x')}</span><div><p class="t-label">${h}</p><p class="t-body">${d}</p></div></div>`;
const vMark=(ok,word)=>`<span class="vmark ${ok?'ok':'no'}">${ICONS(ok?'check':'x')}<span>${word}</span></span>`;

function bLine(t,B){
  const L=B.line, b=S.board, v=b.line, ok=scoreLine(v);
  const ticks=[...Array(9)].map((_,k)=>{ const major=k%4===0; return `<line x1="${k/8*100}%" x2="${k/8*100}%" y1="${major?14:22}" y2="${major?50:42}" class="${major?'ax':'tk'}"/>`; }).join('');
  const labels=[[0,'0'],[4,'½'],[8,'1']].map(([k,s])=>`<span class="nl-lab" style="left:${k/8*100}%">${s}</span>`).join('');
  const state=b.lineChecked?(ok?'ok':'no'):'';
  const handle=`<div class="nl-handle ${state}" role="slider" tabindex="0" aria-label="${L.slider}" aria-valuemin="0" aria-valuemax="1" aria-valuenow="${v/8}" aria-valuetext="${L.spoken[v]}" style="left:${v/8*100}%"><span class="knob">${state?ICONS(ok?'check':'x'):''}</span></div>`;
  const res=b.lineChecked?`<p class="bres">${vMark(ok,ok?B.correct:B.notYet)}<span class="t-body">${L.youPlaced(FRAC[v])}</span></p>`:`<p class="t-caption muted bhint">${L.how}</p>`;
  return {q:L.q,
    board:`<div class="nl"><div class="nl-track" data-nl><svg class="nl-svg" aria-hidden="true" width="100%" height="64"><line x1="0" x2="100%" y1="32" y2="32" class="ax"/>${ticks}</svg>${handle}</div><div class="nl-labels" aria-hidden="true">${labels}</div></div>${res}`,
    strip:`${btn(L.left,{lg:1,cls:'inverse',icon:'arrow-l',attrs:'data-nlstep="-1"'})}${btn(L.right,{lg:1,cls:'inverse',iconR:'arrow',attrs:'data-nlstep="1"'})}${btn(B.reset,{cls:'inverse',icon:'undo',act:'b-reset'})}`,
    foot:b.lineChecked?(ok?bBanner(true,L.good,L.goodSub)+btn(B.cont,{lg:1,block:1,cls:'success',pulse:1,act:'b-next'}):bBanner(false,L.bad,L.badSub)+btn(t.tryAgain,{lg:1,block:1,cls:'inverse',act:'b-retry'}))
      :`<button class="btn lg block ${b.moved?'pulse':''}" data-act="b-check-line" ${b.moved?'':'disabled'}>${t.check}</button>`};
}
function bDisc(t,B){
  const X=B.disc, b=S.board, price=fmtN(DISC.price), off=fmtP(DISC.off), dcoins=DISC.price*DISC.off, pay=discTrue();
  const pv=parseLocaleNumber(b.pred), valid=Number.isFinite(pv)&&pv>=0&&pv<=10000;
  const tag=`<div class="ptag">${coinSvg('coin-sm2')}<div><p class="t-caption muted" style="margin:0">${X.price}</p><p class="t-label" style="margin:0">${price} ${t.coins}</p></div><span class="vtag">${X.off(off)}</span></div>`;
  let boardHtml, strip, foot;
  if(!b.revealed){
    boardHtml=`${tag}<div class="pbar-empty"><p class="t-body muted">${X.hidden}</p></div>`;
    strip=`<div class="field on-fill ${b.predErr?'err':''}"><label class="lbl" for="pred">${X.predL}</label><input class="input" id="pred" inputmode="decimal" placeholder="${esc(X.predPh)}" value="${esc(b.pred)}" autocomplete="off" aria-describedby="pred-m">
      <p class="${b.predErr&&!valid?'errmsg':'hint'}" id="pred-m" aria-live="polite">${b.pred&&valid?X.read(`${fmtN(pv)} ${t.coins}`):b.predErr?`${ICONS('alert')}<span>${X.errPred}</span>`:'&nbsp;'}</p></div>`;
    foot=`<button class="btn lg block ${valid?'pulse':''}" data-act="b-lock" ${valid?'':'disabled'}>${X.lock}</button>`;
  } else {
    const ok=scorePred(pv);
    const axis=[0,.25,.5,.75,1].map(p=>`<line x1="${p*100}%" x2="${p*100}%" y1="0" y2="12" class="ax"/>`).join('');
    const axLab=[0,.25,.5,.75,1].map(p=>`<span class="ax-lab" style="left:${p*100}%">${fmtP(p)}</span>`).join('');
    const steps=[X.s1(off,price,fmtN(dcoins)),`${price} − ${fmtN(dcoins)} = ${fmtN(pay)}`];
    const stepList=steps.map((s,i)=>i<b.dstep?`<li class="${i===b.dstep-1?'active':'done'}"><span class="t-caption">${X.step(i+1)}</span><span class="t-label">${s}</span></li>`:'').join('');
    const table=b.table?`<table class="vtable"><thead><tr>${X.cols.map(c=>`<th scope="col">${c}</th>`).join('')}</tr></thead><tbody>
      ${[[X.full,fmtP(1),price],[X.discount,off,fmtN(dcoins)],[X.pay,fmtP(1-DISC.off),fmtN(pay)]].map(([a,p,c])=>`<tr><th scope="row">${a}</th><td data-label="${esc(X.cols[1])}">${p}</td><td data-label="${esc(X.cols[2])}">${c}</td></tr>`).join('')}</tbody></table>`:'';
    boardHtml=`${tag}

function bRule(t,B){

  const line=(kw,keys)=>`<div class="rline"><span class="kw">${kw}</span><div class="rslots">${keys.map(k=>slot(k)+picker(k)).join('')}</div></div>`;
  let scen='', foot;
  const done=ruleComplete(r);
  if(b.tested){
    const res=SCEN.map(sc=>({got:runRule(r,sc),exp:runRule(RULE_KEY,sc)}));
    const n=res.filter(x=>x.got===x.exp).length, all=n===SCEN.length;
    const actT=k=>X.act.find(o=>o.k===k).t;
    scen=`<ul class="scards">${SCEN.map((sc,i)=>{ const ok=res[i].got===res[i].exp; return `<li class="scard"><p class="t-label">${X.items[i]}</p>

      <p class="t-body"><b>${X.says}:</b> ${actT(res[i].got)}</p>${ok?'':`<p class="t-body"><b>${X.should}:</b> ${actT(res[i].exp)}</p>`}${vMark(ok,ok?X.match:X.noMatch)}</li>`; }).join('')}</ul>`;
    foot=bBanner(all,all?X.good:X.bad(n,SCEN.length),all?X.goodSub:X.badSub)+btn(B.cont,{lg:1,block:1,cls:all?'success':'',pulse:1,act:'b-next'});
  } else foot=`<button class="btn lg block ${done?'pulse':''}" data-act="b-test" ${done?'':'disabled'}>${X.test}</button>`;

/* number line: drag follows the pointer with no easing lag and snaps on release; tapping the track places
   the point; arrows / Page Up / Page Down / Home / End on the focused handle (05 §4). */
function bindNumberLine(app){
  const tr=app.querySelector('[data-nl]'); if(!tr) return;
  const h=tr.querySelector('.nl-handle'); let drag=false;
  const at=e=>{ const r=tr.getBoundingClientRect(); return Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)); };
  const commit=x=>{ const v=Math.round(x*8); setLine(v,false); };
  tr.addEventListener('pointerdown',e=>{ drag=true; try{tr.setPointerCapture(e.pointerId);}catch(x){} h.style.left=at(e)*100+'%'; e.preventDefault(); });
  tr.addEventListener('pointermove',e=>{ if(drag) h.style.left=at(e)*100+'%'; });
  tr.addEventListener('pointerup',e=>{ if(!drag) return; drag=false; commit(at(e)); });
  tr.addEventListener('pointercancel',()=>{ drag=false; render(); });
  h.addEventListener('keydown',e=>{ const v=S.board.line, map={ArrowRight:v+1,ArrowUp:v+1,ArrowLeft:v-1,ArrowDown:v-1,PageUp:v+10,PageDown:v-10,Home:0,End:8};
    if(e.key in map){ e.preventDefault(); setLine(map[e.key],true); } });
}
function setLine(v,keepFocus){
  const b=S.board, L=T[S.lang].m.board.line; b.line=Math.min(8,Math.max(0,v)); b.moved=true; b.lineChecked=false; b.live=L.placed(L.spoken[b.line]);
  if(keepFocus) S.fx={kind:'focus',sel:'.nl-handle'}; render();
}

const Lum=hex=>{const c=[1,3,5].map(i=>parseInt(hex.slice(i,i+2),16)/255).map(v=>v<=.04045?v/12.92:((v+.055)/1.055)**2.4);return .2126*c[0]+.7152*c[1]+.0722*c[2]};
const CR=(a,b)=>{let x=Lum(a),y=Lum(b);if(x<y)[x,y]=[y,x];return (x+.05)/(y+.05)};
function weekStrip(t,resting){

   <section><h2 class="t-headline">${Y.shapesH}</h2><p class="t-body muted sub">${Y.shapesSub}</p><div style="margin-top:var(--s-4)">${shapes}</div></section>
   <section><h2 class="t-headline">${Y.statesH}</h2><p class="t-body muted sub">${Y.statesSub}</p>
     <div class="btn-lab" style="margin-top:var(--s-4)"><div class="cell-b"><button class="btn" tabindex="-1">${sb[0]}</button><span class="t-caption muted">${stg[0]}</span></div><div class="cell-b"><button class="btn is-pressed" tabindex="-1">${sb[1]}</button><span class="t-caption muted">${stg[1]}</span></div><div class="cell-b"><button class="btn pulse" tabindex="-1">${sb[2]}</button><span class="t-caption muted">${stg[2]}</span></div><div class="cell-b"><button class="btn h-success" tabindex="-1">${sb[3]}</button><span class="t-caption muted">${stg[3]}</span></div><div class="cell-b"><button class="btn" disabled>${sb[4]}</button><span class="t-caption muted">${stg[4]}</span></div><div class="cell-b"><button class="btn lg" tabindex="-1">${ICONS('rocket')}<span>${sb[5]}</span></button><span class="t-caption muted">${stg[5]}</span></div></div>
     <div class="callout" style="margin-top:var(--s-4)"><p class="t-label">${Y.budgetH}</p><p class="t-body">${Y.budget}</p></div></section>
   <section><h2 class="t-headline">${Y.formsH}</h2><div style="margin-top:var(--s-4)">${forms}</div></section>
   <section><h2 class="t-headline">${Y.fbH}</h2><div style="margin-top:var(--s-4)">${feedback}</div></section>
   <section><h2 class="t-headline">${Y.chipsH}</h2><div class="state-row" style="margin-top:var(--s-4)">${chip('success','check',Y.chips[0])}${chip('warning','alert',Y.chips[1])}${chip('error','x',Y.chips[2])}${chip('sky','clock',Y.chips[3])}${chip('solid reward','coin','+20')}</div></section>
   <section><h2 class="t-headline">${Y.stressH}</h2><p class="t-body muted sub">${Y.stressSub}</p><div class="stress" style="margin-top:var(--s-4)">${stress}</div></section>
   <section><div class="slot"><span class="t-body">${Y.slot}</span></div></section>
  </div>`);
}

/* ---------------------------- stage bar (NOT part of the design system) ---------------------------- */
function bar(){
  const seg=(items,cur,key)=>`<div class="seg" role="group">${items.map(([v,l])=>`<button aria-pressed="${String(cur)===String(v)}" data-set="${key}:${v}">${l}</button>`).join('')}</div>`;
  const opt=r=>`<option value="${r[0]}" ${S.route===r[0]?'selected':''}>${r[1]}</option>`;
  const grp={site:'Marketing site',app:'Learner app',parent:'Parent',staff:'Staff',ref:'Reference'};
  document.getElementById('bar').innerHTML=
   `<label class="rsel"><span class="sr-only">Route</span><select data-route>${Object.keys(ROUTES).map(g=>`<optgroup label="${grp[g]}">${ROUTES[g].map(opt).join('')}</optgroup>`).join('')}</select></label>`+
   seg([['light','Light'],['dark','Dark']],S.theme,'theme')+seg([['en','EN'],['es','ES'],['pt','PT']],S.lang,'lang')+
   seg([[320,'320'],[375,'375'],[768,'768'],[1280,'1280'],[0,'Fit']],S.w,'w')+seg([['fredoka','Fredoka'],['baloo','Baloo 2']],S.font,'font')+
   seg([[0,'Normal'],[1,'+40% text']],S.stress?1:0,'stress')+seg([[0,'Art off'],[1,'Art slots']],S.slots?1:0,'slots')+
   seg([['family','Child in a family'],['teen','Teen, no parent']],S.acct,'acct');
}
const ROUTE_FN=()=>({landing,how,families,signup,login,notfound,home,lesson,result,board,mentor:mentorScreen,tasks,wallet,me,parent,staff,system});
function render(){
  applyTokens();
  const f=document.getElementById('frame'); f.style.setProperty('--w',S.w?S.w+'px':'100%'); f.style.setProperty('--h',S.w===0?'86vh':(S.w>=768?'860px':'780px'));
  const app=document.getElementById('app'); app.lang=LANGS[S.lang];
  // re-rendering replaces innerHTML, which would otherwise reset scroll position on every state change
  // (opening a dialog, a toast appearing, a form error). Save and restore it, unless a route change asked
  // to jump to the top (S._top).
  const prevScroll=new Map();
  app.querySelectorAll('.scroller').forEach(s=>{ if(s.dataset.scrollKey) prevScroll.set(s.dataset.scrollKey, s.scrollTop); });
  let exOut=null;
  if(S.fx&&S.fx.kind==='ex-advance'){ exOut=app.querySelector('[data-ex-key]'); if(exOut) exOut=exOut.cloneNode(true); }
  const t=str(); app.innerHTML=ROUTE_FN()[S.route](t); bar(); writeHash();
  document.documentElement.lang=LANGS[S.lang];
  app.querySelectorAll('.scroller').forEach((s,i)=>{
    const key=s.dataset.scrollKey||('sc'+i); s.dataset.scrollKey=key;
    if(!S._top && prevScroll.has(key)) s.scrollTop=prevScroll.get(key);
  });
  if(S._top){ app.querySelectorAll('.scroller').forEach(s=>s.scrollTop=0); S._top=false; }
  postRender(exOut);
}
function go(r){
  if(r!==S.route){
    if(r==='lesson'){ S.exIdx=0; S.misses=0; S.reviewDeclined=false; S.firstTry=[]; S.lessonStart=Date.now(); }
    if(r==='signup'&&S.route!=='login') S.su={step:'age',month:'',year:'',via:'',done:false,errs:{}};
    S.route=r; S.enter=true; S.sel=null; S.checked=false; S.errs={}; S.dialog=false; S.demo={sel:null,checked:false}; S._top=true;
  }
  S.menu=false;
}
const validEmail=v=>/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v);
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-set],[data-go],[data-a],[data-act],[data-step],[data-d],[data-tab],[data-role],[data-lang],[data-page],[data-nop],[data-approve-row],[data-mentor],[data-photo],[data-src],[data-cnav],[data-bdemo],[data-nlstep],[data-rslot],[data-ropt]');
  if(!b) return; if(b.tagName==='A') e.preventDefault(); if(b.dataset.nop) return;
  const t=str(); haptic();
  if(b.dataset.set){const [k,v]=b.dataset.set.split(':');S[k]=(k==='w')?+v:(k==='stress'||k==='slots')?v==='1':v; }
  else if(b.dataset.go){ go(b.dataset.go); }
  else if(b.dataset.lang){ S.lang=b.dataset.lang; }
  else if(b.dataset.tab!==undefined){ S.tab=+b.dataset.tab; }
  else if(b.dataset.page){ S.page=+b.dataset.page; }
  else if(b.dataset.mentor){ S.mentor=b.dataset.mentor; }
  else if(b.dataset.photo!==undefined){ const i=+b.dataset.photo; if(!S.photoSent.includes(i)) S.photoSent=[...S.photoSent,i]; S.toast=t.m.tasks.sent; }
  else if(b.dataset.src){ S.teen.src=b.dataset.src; }
  else if(b.dataset.cnav){ const [k,ix,id]=b.dataset.cnav.split(':'); S.cnav=Object.assign({},S.cnav,{[k]:+ix}); S.fx={kind:'scroll',id}; }
  else if(b.dataset.bdemo!==undefined){ S.board=Object.assign(freshBoard(),{demo:+b.dataset.bdemo}); }
  else if(b.dataset.nlstep){ setLine(S.board.line+(+b.dataset.nlstep),false); return; }
  else if(b.dataset.rslot){ const k=b.dataset.rslot; S.board.open=S.board.open===k?null:k; }
  else if(b.dataset.ropt){ const [k,v]=b.dataset.ropt.split(':'); S.board.rule={...S.board.rule,[k]:v}; S.board.open=null; S.board.tested=false; S.fx={kind:'focus',sel:`[data-rslot="${k}"]`}; }
  else if(b.dataset.d!==undefined){ if(!S.demo.checked){ S.arm=(S.demo.sel===null); S.demo.sel=+b.dataset.d; S.fx={kind:'select',i:S.demo.sel}; } }
  else if(b.dataset.a!==undefined){ if(!S.checked){ S.arm=(S.sel===null); S.sel=+b.dataset.a; S.fx={kind:'select',i:S.sel}; } }
  else if(b.dataset.step){ const [ix,d]=b.dataset.step.split(':').map(Number); const total=S.acct==='teen'?S.teen.logged:20; const a=[...S.split]; const o=(ix+1)%3; a[ix]=Math.max(0,a[ix]+d); const tot=a.reduce((x,y)=>x+y,0); if(tot>total) a[o]=Math.max(0,a[o]-(tot-total)); S.split=a; S.splitDone=false; }
  else if(b.dataset.approveRow!==undefined){ const ix=+b.dataset.approveRow; S.justApproved=ix; if(!S.approvedRows.includes(ix)) S.approvedRows=[...S.approvedRows,ix]; S.fx={kind:'row-approve',row:ix}; }
  else if(b.dataset.act){
    const A=b.dataset.act, X=t.m.auth;
    if(A==='theme') S.theme=S.theme==='light'?'dark':'light';
    else if(A==='menu') S.menu=!S.menu; else if(A==='menu-close') S.menu=false;
    else if(A==='demo-check'){ S.demo.checked=true; S.fx={kind:S.demo.sel===1?'correct':'wrong'}; }
    else if(A==='demo-reset'){ S.demo={sel:null,checked:false}; }
    else if(A==='pw') S.showpw=!S.showpw;
    else if(A==='age-submit'){ const su=S.su, y=+su.year, now=new Date().getFullYear(), er={};
      if(!su.month) er.month=1; if(!/^\d{4}$/.test(su.year)||y<1900||y>now) er.year=1; su.errs=er;
      if(!Object.keys(er).length){ const age=ageOf(+su.month,y); su.step=age>=18?'adult':age>=13?'teen':'child'; su.done=false; S.errs={}; S._top=true; } }
    else if(A==='su-back'){ S.su.step='age'; S.su.done=false; S.errs={}; }
    else if(A==='google'){ go('signup'); S.su={step:'age',month:'',year:'',via:'google',done:false,errs:{}}; }
    else if(A==='signup-submit'){ const f=S.form,er={}, g=S.su.via==='google'; if(!f.name.trim()) er.name=1; if(!g&&!validEmail(f.email)) er.email=1; if(!g&&f.pw.length<8) er.pw=1; if(!f.agree) er.agree=1; S.errs=er;
      if(!Object.keys(er).length){ S.toast=X.toast; S.su.done=true; } }       // toast only: sign-up is not a milestone (D7)
    else if(A==='login-submit'){ const f=S.form,er={}; if(!f.ident.trim()) er.ident=1; if(f.pw.length<8) er.pw=1; S.errs=er; if(!Object.keys(er).length){ go('home'); } }
    else if(A==='check'){ const ex=T[S.lang].exercises[S.exIdx], ok=S.sel===ex.correctIdx; S.checked=true;
      if(S.firstTry[S.exIdx]===undefined) S.firstTry[S.exIdx]=ok;
      S.misses=ok?0:S.misses+1; S.fx={kind:ok?'correct':'wrong'}; }
    else if(A==='reset'){
      const exs=T[S.lang].exercises, ok=S.sel===exs[S.exIdx].correctIdx;
      if(ok && S.exIdx>=exs.length-1){ S.session={firstTry:exs.map((_,i)=>S.firstTry[i]!==false),ms:Date.now()-(S.lessonStart||Date.now()-200000)}; S.route='result'; S.enter=true; S._top=true; S.exIdx=0; S.fx={kind:'celebrate'}; }
      else if(ok){ S.exIdx++; S.misses=0; S.reviewDeclined=false; S.fx={kind:'ex-advance'}; }
      S.sel=null; S.checked=false;
    }
    else if(A==='review-yes'){ go('mentor'); }
    else if(A==='review-no'){ S.reviewDeclined=true; }
    else if(A==='mreview-no'){ S.mentorReviewDone=true; }
    else if(A==='split'){ S.splitDone=true; haptic([12,30,12]); }                 // a plain confirmation, no confetti (D7)
    else if(A==='log-income'){ const v=S.teen.amt.trim(); if(/^\d{1,4}$/.test(v)&&+v>0){ const n=+v; S.teen={...S.teen,logged:n,err:false,msg:true,amt:''}; const a=Math.ceil(n/2), bb=Math.floor((n-a)/2); S.split=[a,bb,n-a-bb]; S.splitDone=false; } else S.teen={...S.teen,err:true,msg:false}; }
    else if(A==='dlg-open') S.dialog=true; else if(A==='dlg-keep') S.dialog=false;
    else if(A==='dlg-confirm'){ S.dialog=false; S.toast=t.m.staff.sent; }
    else if(A==='rest-toggle') S.resting=!S.resting;
    else if(A==='b-check-line'){ S.board.lineChecked=true; S.fx={kind:scoreLine(S.board.line)?'correct':'wrong'}; }
    else if(A==='b-retry'){ S.board.lineChecked=false; S.fx={kind:'focus',sel:'.nl-handle'}; }
    else if(A==='b-reset'){ S.board=Object.assign(freshBoard(),{demo:S.board.demo}); }
    else if(A==='b-next'){ S.board=Object.assign(freshBoard(),{demo:(S.board.demo+1)%3}); S._top=true; }
    else if(A==='b-lock'){ const v=parseLocaleNumber(S.board.pred); if(Number.isFinite(v)){ S.board.revealed=true; S.board.dstep=1; } else S.board.predErr=true; }
    else if(A==='b-nextstep'){ S.board.dstep=Math.min(2,S.board.dstep+1); }
    else if(A==='b-prev'){ S.board.dstep=Math.max(1,S.board.dstep-1); }
    else if(A==='b-table'){ S.board.table=!S.board.table; }
    else if(A==='b-test'){ if(ruleComplete(S.board.rule)){ S.board.tested=true; const n=SCEN.filter(sc=>runRule(S.board.rule,sc)===runRule(RULE_KEY,sc)).length; S.board.live=t.m.board.rule.evaluated(n,SCEN.length); } }
  }
  render();
});
document.addEventListener('input',e=>{ const el=e.target;
  if(['name','email','pw','ident'].includes(el.id)) S.form[el.id]=el.value;
  if(el.id==='byear') S.su.year=el.value.trim();
  if(el.id==='tamt') S.teen.amt=el.value;
  if(el.id==='pred'){ S.board.pred=el.value; S.board.predErr=false; const pos=el.selectionStart; render(); const n=document.getElementById('pred'); if(n){ n.focus(); try{n.setSelectionRange(pos,pos);}catch(x){} } }
});
document.addEventListener('change',e=>{ const el=e.target;
  if(el.dataset.agree) S.form.agree=el.checked; if(el.dataset.remember) S.form.remember=el.checked; if(el.dataset.analytics) S.form.analytics=el.checked;
  if(el.dataset.sw!==undefined) S.sw[+el.dataset.sw]=el.checked?1:0;
  if(el.dataset.freeze){ S.frozen=el.checked; render(); }
  if(el.id==='bmonth'){ S.su.month=el.value; }
  if(el.dataset.route!==undefined){ go(el.value); render(); } });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&S.board.open&&S.route==='board'){ const k=S.board.open; S.board.open=null; S.fx={kind:'focus',sel:`[data-rslot="${k}"]`}; render(); } });
document.addEventListener('pointerdown',e=>{ const b=e.target.closest('.btn:not([disabled])'); if(b) ringAt(b,e); });
readHash(); render();

</script>
