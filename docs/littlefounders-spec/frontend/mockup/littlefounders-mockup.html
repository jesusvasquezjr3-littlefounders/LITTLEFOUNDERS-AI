  --dur-celebration:700ms; /* a milestone on the D7 list only (lesson or course complete, savings goal reached, badge earned, streak 7/30/100). Once per moment, never per click. */
  /* easing: named by what enters/exits, not by curve shape, so a reader
     doesn't need to picture the bezier to pick the right one */
  --ease-standard:cubic-bezier(.4,0,.2,1);     /* moves within the screen, starts and ends on-screen */
  --ease-enter:cubic-bezier(0,0,.2,1);          /* decelerate: arriving on screen */
  --ease-exit:cubic-bezier(.4,0,1,1);           /* accelerate: leaving the screen */
  --ease-spring:cubic-bezier(.34,1.56,.64,1);  /* overshoot: ONLY the D7 milestone list, never routine UI */
}

body[data-font="baloo"]{ --font-display:'Baloo 2','Nunito',system-ui,sans-serif; }


*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font-text);background:var(--stage);color:var(--stage-ink);min-height:100vh;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button{font:inherit;color:inherit;padding:0}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* ---------------- stage chrome (NOT part of the design system) ---------------- */
.stage-bar{position:sticky;top:0;z-index:50;background:var(--stage);border-bottom:2px solid var(--stage-line);padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.seg{display:inline-flex;gap:4px;padding:4px;background:var(--stage-well);border-radius:var(--r-full)}
.seg button{border:0;background:transparent;padding:8px 14px;min-height:40px;border-radius:var(--r-full);font-weight:800;font-size:.9rem;cursor:pointer;color:var(--stage-ink)}
.seg button[aria-pressed=true]{background:var(--stage-ink);color:var(--stage)}
.seg button:focus-visible{outline:3px solid var(--lf-primary-strong);outline-offset:2px}
.stage-note{font-size:.9rem;color:var(--stage-muted);max-width:70ch;margin:0}
#stage{padding:20px 12px 40px}
#frame{--w:375px;--h:780px;width:min(var(--w),100%);height:var(--h);margin:0 auto;border-radius:var(--r-lg);overflow:hidden;border:2px solid var(--stage-line);position:relative;background:var(--lf-base);transform:translateZ(0)}
.app{container-type:inline-size;container-name:app;height:100%;display:flex;flex-direction:column;background:var(--lf-base);color:var(--lf-content);font-family:var(--font-text);font-weight:500;font-size:1rem;line-height:1.55;letter-spacing:.008em}
.scroller{overflow-y:auto;overflow-x:hidden;scroll-behavior:smooth}
.app>.scroller{flex:1;min-height:0}
.shell{flex:1;min-height:0}
.shell>.scroller{height:100%}

/* ---------------- type scale (closed) ---------------- */
.t-display-xl{font:700 36px/1.08 var(--font-display);letter-spacing:-.01em;text-wrap:balance;margin:0}
.t-display-lg{font:700 28px/1.12 var(--font-display);letter-spacing:-.005em;text-wrap:balance;margin:0}
.t-headline{font:600 1.5rem/1.25 var(--font-display);text-wrap:balance;margin:0}
.t-title{font:600 1.25rem/1.28 var(--font-display);text-wrap:balance;margin:0}
.t-body-lg{font:500 1.125rem/1.6 var(--font-text);text-wrap:pretty;margin:0}
.t-body{font:500 1rem/1.55 var(--font-text);text-wrap:pretty;margin:0}
.t-label{font:800 1rem/1.25 var(--font-text);margin:0}
.t-caption{font:700 .875rem/1.35 var(--font-text);margin:0}
.t-numeral-xl{font:900 40px/1 var(--font-text);letter-spacing:-.01em}
.t-numeral{font:800 1.5rem/1.1 var(--font-text)}
.muted{color:var(--lf-content-muted)}
p,.t-body,.t-body-lg{hyphens:auto;overflow-wrap:break-word}


.ic{width:1.5em;height:1.5em;flex:none;stroke:currentColor;fill:none;stroke-width:2.25;stroke-linecap:round;stroke-linejoin:round}
.ic.fill{fill:currentColor}

/* ---------------- buttons: flat, size to content, never clip ----------------
   3D is reserved for characters (owner direction). Buttons and other controls
   are flat: colour fill only, no border of any kind. Press: scale .97 in over
   --dur-instant, out over --dur-micro, both --ease-standard (no overshoot). */
.btn{--f:var(--lf-accent);--on:var(--lf-on-accent);
  position:relative;isolation:isolate;min-inline-size:min-content;overflow-wrap:break-word;hyphens:auto;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center;
  min-height:var(--target-base);padding:12px 24px;border:0;border-radius:var(--r-full);
  background:var(--f);color:var(--on);font:600 1rem/1.2 var(--font-display);letter-spacing:.008em;text-wrap:balance;
  transform:scale(1);cursor:pointer;-webkit-tap-highlight-color:transparent;
  transition:transform var(--dur-micro) var(--ease-standard),box-shadow var(--dur-micro) var(--ease-standard),filter var(--dur-micro) var(--ease-standard)}
.btn .ring{position:absolute;z-index:-1;border-radius:50%;background:rgba(255,255,255,.35);transform:translate(-50%,-50%) scale(0);pointer-events:none;animation:ring var(--dur-transition) var(--ease-standard) forwards}
@keyframes ring{to{transform:translate(-50%,-50%) scale(1);opacity:0}}
.btn.pulse{animation:pulseGlow 2.6s ease-in-out 1.2s infinite}
@keyframes pulseGlow{0%,100%{box-shadow:none}50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--f) 30%,transparent)}}
.btn.arm{animation:arm var(--dur-component) var(--ease-standard)}
@keyframes arm{0%{transform:scale(.97)}55%{transform:scale(1.02)}100%{transform:scale(1)}}
.btn.lg{min-height:var(--target-lg);font-size:1.125rem;padding-inline:32px}
.btn.block{width:100%}
.btn:active:not([disabled]),.btn.is-pressed{transform:scale(.97);transition-duration:var(--dur-instant)}
@media (hover:hover){.btn:hover:not([disabled]){filter:brightness(1.05)}}
.btn:focus-visible,.tab:focus-visible,.nav-item:focus-visible,.answer:focus-visible,.choice:focus-visible,.h-focus:focus-visible,.course:focus-visible,.row-card:focus-visible,.icon-btn:focus-visible{outline:3px solid var(--lf-primary-strong);outline-offset:3px}
.btn.secondary{--f:var(--lf-surface);--on:var(--lf-content);box-shadow:0 1px 3px rgba(17,19,42,.14)}
.btn.brand{--f:var(--lf-primary);--on:var(--lf-on-primary)}
.btn.success{--f:var(--lf-success);--on:var(--lf-on-success)}
.btn[disabled]{--f:var(--lf-sunken);--on:var(--lf-content-disabled);cursor:not-allowed}
.icon-btn{width:var(--target-min);height:var(--target-min);flex:none;display:grid;place-items:center;border:0;border-radius:var(--r-full);background:var(--lf-surface);color:var(--lf-content);box-shadow:0 1px 3px rgba(17,19,42,.14);cursor:pointer;transition:transform var(--dur-micro) var(--ease-standard)}
.icon-btn:active{transform:scale(.97);transition-duration:var(--dur-instant)}

/* ---------------- chips: status = SOFT + icon + word; identity/reward = SOLID ---------------- */
.chip{--sf:var(--lf-primary-soft);--st:var(--lf-primary-strong);display:inline-flex;align-items:center;gap:4px;padding:4px 12px;border-radius:var(--r-full);background:var(--sf);color:var(--st);font:800 .875rem/1.25 var(--font-text)}
.chip .ic{width:1.25em;height:1.25em}
.chip.solid{--sf:var(--f);background:var(--f);color:var(--on)}
.chip.reward{--f:var(--lf-reward);--on:var(--lf-on-reward)}
.chip.success{--sf:var(--lf-success-soft);--st:var(--lf-success-strong)}
.chip.warning{--sf:var(--lf-warning-soft);--st:var(--lf-warning-strong)}
.chip.error{--sf:var(--lf-error-soft);--st:var(--lf-error-strong)}
.chip.berry{--sf:var(--lf-berry-soft);--st:var(--lf-berry-strong)}
.chip.sky{--sf:var(--lf-sky-soft);--st:var(--lf-sky-strong)}

/* ---------------- surfaces ---------------- */
.card{background:var(--lf-surface);border-radius:var(--r-lg);box-shadow:0 1px 3px rgba(17,19,42,.08),0 1px 2px rgba(17,19,42,.06);padding:var(--s-5)}
.bar{height:16px;border-radius:var(--r-full);background:var(--lf-sunken);overflow:hidden}
.bar>i{display:block;height:100%;min-width:16px;border-radius:var(--r-full);background:var(--lf-primary);position:relative;transition:width var(--dur-component) var(--ease-standard)}
.bar>i::after{content:"";position:absolute;left:8px;right:8px;top:3px;height:4px;border-radius:var(--r-full);background:rgba(255,255,255,.4)}
.bar.on-fill{background:color-mix(in srgb,var(--on) 22%,transparent);box-shadow:none}
.bar.on-fill>i{background:var(--on)}

/* ---------------- fx layer: confetti for the D7 milestone list only (pointer-transparent, no text) ---------------- */
.fx{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:60}
.fx .p{position:absolute;left:0;top:0;will-change:transform,opacity}

/* ---------------- top area ---------------- */
.page{padding:var(--s-5) var(--s-4) var(--s-8);display:flex;flex-direction:column;gap:var(--s-6)}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:var(--s-3) var(--s-4)}
.who{display:flex;align-items:center;gap:var(--s-3);min-width:0}
.avatar{width:48px;height:48px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--lf-sky);color:var(--lf-on-sky);font:700 1.25rem/1 var(--font-display)}
.stats{display:flex;flex-wrap:wrap;gap:var(--s-2)}

/* hero band */
.hero{--on:var(--lf-on-primary);position:relative;background:var(--lf-primary);color:var(--lf-on-primary);border-radius:var(--r-xl);padding:var(--s-6);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--s-4);align-items:center}
.home-grid{display:flex;flex-direction:column;gap:var(--s-6)}
/* float/flicker/pulseGlow deliberately do NOT use the --dur-* tokens: those tokens
   describe state TRANSITIONS (something changing because of an event). These three
   are idle "the scene is alive" loops with their own slow, organic rhythm — forcing
   them onto a 150-450ms transition scale would make them read as jittery UI feedback
   instead of ambient life. Budget: exactly three things get idle motion at once (the
   hero object, the streak flame, one pulsing CTA per screen) — see 9.4 in FOUNDATIONS. */
.hero .art{width:96px;height:96px;animation:float 5s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-6px) rotate(2deg)}}
.ic.flicker{transform-origin:50% 90%;animation:flicker 2.4s ease-in-out infinite}
@keyframes flicker{0%,100%{transform:scale(1) rotate(0)}30%{transform:scale(1.12,1.06) rotate(-4deg)}60%{transform:scale(.96,1.1) rotate(3deg)}}
.hero .body{display:flex;flex-direction:column;gap:var(--s-3);min-width:0}
.hero .btn{align-self:flex-start}
.hero .meter{display:flex;align-items:center;gap:var(--s-3)}
.hero .meter .bar{flex:1;min-width:64px}

/* course cards: absolute colour + icon + word (never colour alone) */
/* K39: the minimum column is the wider of 160px and the longest title word + card padding (--course-min, measured in fitCourseGrid()); below it the grid reflows to fewer columns, down to one */
.grid-courses{display:grid;gap:var(--s-4);grid-template-columns:repeat(auto-fit,minmax(min(100%,max(160px,var(--course-min,0px))),1fr))}
.course{--f:var(--lf-primary);--on:var(--lf-on-primary);text-align:left;border:0;cursor:pointer;
  background:var(--f);color:var(--on);border-radius:var(--r-lg);padding:var(--s-4);
  display:flex;flex-direction:column;gap:var(--s-3);min-height:var(--target-lg);transition:transform var(--dur-micro) var(--ease-standard),box-shadow var(--dur-micro) var(--ease-standard)}
.course:active{transform:scale(.97);transition-duration:var(--dur-instant)}
.course .disc{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--on) 16%,transparent)}
.course .disc .ic{width:28px;height:28px}
.course .meta{display:flex;align-items:center;gap:var(--s-3)}
.course .meta .bar{flex:1;min-width:48px}
.course .t-caption{font-weight:800}
.course[data-hue=mint]{--f:var(--lf-mint);--on:var(--lf-on-mint)}
.course[data-hue=berry]{--f:var(--lf-berry);--on:var(--lf-on-berry)}
.course[data-hue=sky]{--f:var(--lf-sky);--on:var(--lf-on-sky)}

/* tutor row */
.tutor-av{width:56px;height:56px;background:var(--lf-berry);color:var(--lf-on-berry)}

/* ---------------- navigation ---------------- */
.tabbar{flex:none;margin:0 12px 12px;padding:8px;border-radius:var(--r-xl);background:var(--lf-raised);box-shadow:var(--shadow-float);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;z-index:5}
.tab{border:0;background:transparent;color:var(--lf-content-muted);min-height:var(--target-lg);border-radius:var(--r-lg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px;cursor:pointer;font:800 .875rem/1.15 var(--font-text);text-align:center}
.tab .ic{width:26px;height:26px}
.tab[aria-current=page]{background:var(--lf-primary-soft);color:var(--lf-primary-strong)}
.sidebar{display:none}
.nav-item{display:flex;align-items:center;gap:var(--s-3);min-height:var(--target-base);padding:0 var(--s-4);border:0;border-radius:var(--r-full);background:transparent;color:var(--lf-content-muted);font:800 1rem/1.2 var(--font-text);text-align:left;cursor:pointer;width:100%}
.nav-item[aria-current=page]{background:var(--lf-primary-soft);color:var(--lf-primary-strong)}
.brand-mark{font:700 1.25rem/1.1 var(--font-display);display:flex;align-items:center;gap:8px;padding:var(--s-2) var(--s-4) var(--s-4)}
.brand-mark i{width:32px;height:36px;border-radius:12px;background:var(--lf-primary);display:grid;place-items:center;color:var(--lf-on-primary);font-style:normal;font-size:1rem}

/* very narrow: labels for inactive tabs become accessible-name only (reflow, never truncate) */
@container app (max-width:359px){
  .tab:not([aria-current=page]) .tab-label{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .tabbar{display:flex;gap:2px;margin:0 8px 8px;padding:4px}
  .tab{flex:0 0 48px;min-width:48px}
  .tab[aria-current=page]{flex:1 1 0;min-width:0}
}

/* ---------------- lesson: full-bleed colour screen, matching the reference
   material's "test" screens (a single dominant hue fills the entire view,
   not a coloured card floating on a neutral background). No borders: every
   boundary is a change of fill colour. ---------------- */
.lesson{display:flex;flex-direction:column;min-height:100%;background:var(--lf-primary);color:var(--lf-on-primary)}
.lesson-top{display:flex;align-items:center;gap:var(--s-3);padding:var(--s-4)}
.lesson-top .icon-btn{background:color-mix(in srgb,var(--lf-on-primary) 16%,transparent);color:var(--lf-on-primary);box-shadow:none}
.lesson-top .bar{flex:1;min-width:56px;background:color-mix(in srgb,var(--lf-on-primary) 22%,transparent)}
.lesson-top .bar>i{background:var(--lf-on-primary)}
.lesson-top .chip{--sf:color-mix(in srgb,var(--lf-on-primary) 16%,transparent);--st:var(--lf-on-primary)}
.lesson-body{flex:1;padding:0 var(--s-4) var(--s-6);display:flex;flex-direction:column;gap:var(--s-6);width:100%;max-width:760px;margin:0 auto;overflow:hidden}
.ex-slide{display:flex;flex-direction:column;gap:var(--s-6)}
.q{display:flex;flex-direction:column;gap:var(--s-3)}
.q .ask{display:flex;align-items:center;gap:var(--s-3)}
.q .ask .avatar{width:44px;height:44px;background:color-mix(in srgb,var(--lf-on-primary) 20%,transparent);color:var(--lf-on-primary);box-shadow:none;font-size:1.125rem}
.q .ask .t-caption{color:color-mix(in srgb,var(--lf-on-primary) 78%,transparent)}
.q .qtext{font:700 1.75rem/1.35 var(--font-text);text-wrap:pretty;margin:0;color:var(--lf-on-primary)}
.answers{display:grid;gap:var(--s-3);grid-template-columns:minmax(0,1fr)}
/* .answer lives only inside the full-bleed .lesson screen, so a translucent
   tint of the lesson's own colour is correct there. .choice is used in many
   neutral contexts (pager, role picker, tabs) where that same tint would be
   nearly invisible against a light page background, so it gets its own
   neutral fill with a soft elevation shadow instead. */
.answer,.choice{display:flex;align-items:center;gap:var(--s-3);text-align:left;width:100%;min-height:var(--target-lg);padding:16px 20px;border:0;border-radius:var(--r-md);
  font:800 1.125rem/1.3 var(--font-text);cursor:pointer;
  transition:transform var(--dur-micro) var(--ease-standard),background-color var(--dur-micro) var(--ease-standard)}
.answer{background:color-mix(in srgb,var(--lf-on-primary) 14%,transparent);color:var(--lf-on-primary)}
.choice{background:var(--lf-surface);color:var(--lf-content);box-shadow:0 1px 3px rgba(17,19,42,.08)}
/* .answer-neutral: the same answer-row component used OUTSIDE the full-bleed
   .lesson screen (e.g. the "how it works" state gallery). The .answer
   translucent-on-primary tint above assumes an indigo ancestor and is
   otherwise invisible on a light page background, so this variant gets an
   absolute fill instead. */
.answer.answer-neutral{background:var(--lf-primary-soft);color:var(--lf-content)}
.answer.answer-neutral .mark{background:var(--lf-outline)}
.answer:active:not([disabled]),.choice:active:not([disabled]){transform:scale(.97);transition-duration:var(--dur-instant)}
.answer .mark{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--lf-on-primary) 24%,transparent);color:transparent}
.answer .mark .ic{width:18px;height:18px;stroke-width:3.2}
.answer[data-state=selected]{background:var(--lf-primary);color:var(--lf-on-primary)}
.answer[data-state=selected] .mark{background:color-mix(in srgb,var(--lf-on-primary) 26%,transparent);color:var(--lf-on-primary)}
.answer[data-state=correct]{background:var(--lf-success);color:var(--lf-on-success)}
.answer[data-state=correct] .mark{background:color-mix(in srgb,var(--lf-on-success) 26%,transparent);color:var(--lf-on-success)}
.answer[data-state=wrong]{background:var(--lf-warning);color:var(--lf-on-warning)}
.answer[data-state=wrong] .mark{background:color-mix(in srgb,var(--lf-on-warning) 26%,transparent);color:var(--lf-on-warning)}
.answer.fx-bump{animation:bump var(--dur-component) var(--ease-standard)}
.answer.fx-shake{animation:wobble var(--dur-transition) var(--ease-standard)}
@keyframes bump{0%{transform:scale(.96)}55%{transform:scale(1.035)}100%{transform:scale(1)}}
@keyframes wobble{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(2px)}}
.answer[data-state=dimmed]{opacity:.5;cursor:default}
.lesson-foot{position:sticky;bottom:0;padding:var(--s-4);padding-bottom:max(var(--s-4),env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:var(--s-3)}
.lesson-foot .inner{width:100%;max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:var(--s-3)}
.banner{display:flex;align-items:flex-start;gap:var(--s-3);padding:var(--s-4);border-radius:var(--r-md);background:var(--lf-success);color:var(--lf-on-success)}
.banner .disc{width:36px;height:36px;border-radius:50%;flex:none;display:grid;place-items:center;background:color-mix(in srgb,var(--lf-on-success) 24%,transparent);color:var(--lf-on-success)}
.banner .disc .ic{width:20px;height:20px;stroke-width:3.2}
.banner.wrong{background:var(--lf-warning);color:var(--lf-on-warning)}
.banner.wrong .disc{background:color-mix(in srgb,var(--lf-on-warning) 24%,transparent);color:var(--lf-on-warning)}
.banner .t-label{color:inherit}

/* ---------------- result: full-bleed colour, matching the "YOU WON" reference
   (a single accent hue fills the whole screen; the stat sheet is a lighter
   tint of the SAME hue family, not a jump to a neutral white card). ---------------- */
.result{display:flex;flex-direction:column;min-height:100%;background:var(--lf-accent);color:var(--lf-on-accent)}
.result .top-band{padding:var(--s-8) var(--s-5) var(--s-10);display:flex;flex-direction:column;align-items:center;text-align:center;gap:var(--s-3)}
.medal{width:132px;height:132px}
/* milestone (D7: lesson complete): the one place spring overshoot is allowed */
.medal.pop{animation:pop var(--dur-celebration) var(--ease-spring) both}
.enter .rtile{animation:rise var(--dur-transition) var(--ease-spring) both;animation-delay:calc(var(--i,0)*130ms + 350ms)}
.enter .top-band h1,.enter .top-band p{animation:rise var(--dur-transition) var(--ease-enter) both;animation-delay:.25s}
@keyframes rise{0%{opacity:0;transform:translateY(18px) scale(.94)}100%{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.6) rotate(-8deg);opacity:0}70%{transform:scale(1.06) rotate(2deg);opacity:1}100%{transform:scale(1) rotate(0)}}
.result .sheet{flex:1;background:color-mix(in srgb,var(--lf-on-accent) 12%,transparent);border-radius:var(--r-xl) var(--r-xl) 0 0;padding:var(--s-6) var(--s-4) var(--s-8);display:flex;flex-direction:column;gap:var(--s-5)}
.stat-tiles{display:grid;gap:var(--s-3);grid-template-columns:minmax(0,1fr)}
.stat-tiles .rtile{background:color-mix(in srgb,var(--lf-on-accent) 14%,transparent);color:var(--lf-on-accent);border-radius:var(--r-lg);padding:var(--s-4) var(--s-5);display:flex;align-items:center;gap:var(--s-4)}
.stat-tiles .rtile .disc{width:52px;height:52px;border-radius:50%;flex:none;display:grid;place-items:center;background:color-mix(in srgb,var(--lf-on-accent) 20%,transparent)}
.stat-tiles .rtile .disc .ic{width:28px;height:28px}
.stat-tiles .rtile .txt{display:flex;flex-direction:column;min-width:0}
.vs{display:flex;flex-direction:column;gap:var(--s-3);background:color-mix(in srgb,var(--lf-on-accent) 10%,transparent);border-radius:var(--r-lg);padding:var(--s-5)}
.vs .line{display:grid;grid-template-columns:minmax(0,9ch) minmax(0,1fr) auto;gap:var(--s-3);align-items:center;color:inherit}
.vs .line .bar{background:color-mix(in srgb,var(--lf-on-accent) 20%,transparent)}
.vs .line .bar>i{background:var(--lf-on-accent)}
.vs .line.best .bar>i{background:color-mix(in srgb,var(--lf-on-accent) 55%,transparent)}

/* ---------------- family ---------------- */
.balance{background:var(--lf-primary);color:var(--lf-on-primary);border-radius:var(--r-xl);padding:var(--s-5) var(--s-6);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:var(--s-3)}
.balance .amt{display:flex;align-items:center;gap:var(--s-3)}
.balance .chip{--sf:var(--lf-on-primary);--st:var(--lf-primary-ridge)}
.rows{display:flex;flex-direction:column;gap:var(--s-3)}
.row-card{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:var(--s-4);align-items:center;text-align:left;width:100%;border:0;
  background:var(--lf-surface);color:var(--lf-content);border-radius:var(--r-lg);padding:var(--s-4);min-height:var(--target-lg);
  box-shadow:0 1px 3px rgba(17,19,42,.08);transition:transform var(--dur-instant) var(--ease-standard),box-shadow var(--dur-instant) var(--ease-standard)}
.row-card:active{transform:scale(.97);transition-duration:var(--dur-instant)}
.row-card.approve-row{display:flex;flex-wrap:wrap;align-items:center}
.row-card.approve-row .mid{flex:1 1 12rem;min-width:0}
.row-card.approve-row .btn{flex:1 1 100%;order:3}
@container app (min-width:480px){
  .row-card.approve-row .btn{flex:0 0 auto;order:0}
}
.row-card .disc{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--sf);color:var(--st)}
.row-card .disc .ic{width:28px;height:28px}
.row-card .mid{display:flex;flex-direction:column;gap:var(--s-2);min-width:0;align-items:flex-start}
/* success-wipe cover: a full-bleed success-coloured panel over the row, see
   approveRowWipe() in core.js. Solid fill, no border (section 4.4 rule applies here too). */
.wipe-cover{position:absolute;inset:0;z-index:2;background:var(--lf-success);color:var(--lf-on-success);
  display:flex;align-items:center;justify-content:center;gap:var(--s-3);border-radius:inherit;font:800 1.0625rem/1.2 var(--font-text)}
.wipe-cover .ic{width:26px;height:26px;stroke-width:3}
button.row-card{cursor:pointer}
.split{display:flex;flex-direction:column;gap:var(--s-4)}
.split-bar{display:flex;gap:4px;height:22px}
.split-bar i{display:block;height:100%;border-radius:var(--r-full);min-width:22px}
.pockets{display:grid;gap:var(--s-3);grid-template-columns:minmax(0,1fr)}
.pocket{--f:var(--lf-mint);--on:var(--lf-on-mint);background:var(--f);color:var(--on);border-radius:var(--r-lg);padding:var(--s-4);display:flex;flex-wrap:wrap;align-items:center;gap:var(--s-3)}
.pocket .disc{width:48px;height:48px;border-radius:50%;flex:none;display:grid;place-items:center;background:color-mix(in srgb,var(--on) 16%,transparent)}
.pocket .lbl{flex:1 1 7.5rem;min-width:min-content}
.pocket .stepper{display:flex;align-items:center;justify-content:space-between;gap:var(--s-2);flex:1 1 9rem}
.pocket .stepper .icon-btn{background:var(--lf-surface);color:var(--lf-content);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.pocket .stepper .num{min-width:2.8ch;text-align:center}
.pocket[data-hue=sky]{--f:var(--lf-sky);--on:var(--lf-on-sky)}
.pocket[data-hue=berry]{--f:var(--lf-berry);--on:var(--lf-on-berry)}

/* ---------------- system sheet ---------------- */
.sys{display:flex;flex-direction:column;gap:var(--s-8)}
.sys h2{margin:0}
.sys .sub{margin:4px 0 0}
.swatches{display:grid;gap:var(--s-3);grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
.sw{border-radius:var(--r-lg);overflow:hidden;background:var(--lf-surface);box-shadow:0 1px 3px rgba(17,19,42,.08);display:flex;flex-direction:column}
.sw .fill{padding:var(--s-4);display:flex;flex-direction:column;gap:2px}
.sw .row2{display:grid;grid-template-columns:1fr 1fr;gap:0}
.sw .cell{padding:var(--s-3) var(--s-4);font:800 .875rem/1.3 var(--font-text)}
.sw .meta{padding:var(--s-3) var(--s-4);font:600 .875rem/1.45 var(--font-text);color:var(--lf-content-muted)}
.neus{display:grid;gap:var(--s-2);grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr))}
.nsw{border-radius:var(--r-md);padding:var(--s-3);box-shadow:0 1px 2px rgba(17,19,42,.08);display:flex;flex-direction:column;gap:2px;font:800 .875rem/1.3 var(--font-text)}
.spec{display:flex;flex-direction:column;gap:var(--s-4)}
.spec .line{display:flex;flex-direction:column;gap:2px}
.spec .tag{font:700 .875rem/1.3 var(--font-text);color:var(--lf-content-muted)}
.rulers{display:flex;flex-wrap:wrap;gap:var(--s-4);align-items:flex-end}
.ruler{display:flex;flex-direction:column;gap:var(--s-2);align-items:flex-start}
.ruler .box{background:var(--lf-primary);color:var(--lf-on-primary);border-radius:var(--r-md);display:grid;place-items:center;font:800 .875rem/1 var(--font-text)}
.stress{display:flex;flex-wrap:wrap;gap:var(--s-3)}
.stress .btn{flex:1 1 auto}
.btn-lab{display:flex;flex-wrap:wrap;gap:var(--s-4) var(--s-3);align-items:flex-end}
.cell-b{display:flex;flex-direction:column;gap:var(--s-2);flex:1 1 auto}
.cell-b .btn{width:100%}
.state-row{display:flex;flex-wrap:wrap;gap:var(--s-3);align-items:center}
.callout{border-radius:var(--r-md);padding:var(--s-4);background:var(--lf-sky-soft);color:var(--lf-content)}
.slot{border-radius:var(--r-lg);min-height:150px;display:grid;place-items:center;text-align:center;padding:var(--s-4);background:var(--lf-sunken);border:2px dashed var(--lf-edge);color:var(--lf-content-muted)}

/* ---------------- responsive by CONTAINER (frame width), never by viewport ---------------- */
@container app (max-width:399px){
  .hero{grid-template-columns:minmax(0,1fr)}
  .hero .art{order:-1;width:72px;height:72px}
}
@container app (min-width:480px){
  .stat-tiles{grid-template-columns:repeat(3,minmax(0,1fr))}
  .pockets{grid-template-columns:repeat(3,minmax(0,1fr))}
  .pocket{flex-direction:column;align-items:flex-start;flex-wrap:nowrap}
  .pocket .stepper{align-self:stretch;flex:none}
  .answers{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tile{flex-direction:column;align-items:flex-start}
  .hero .art{width:140px;height:140px}
}
@container app (min-width:840px){
  .shell{display:grid;grid-template-columns:260px minmax(0,1fr);height:100%}
  .sidebar{display:flex;flex-direction:column;gap:var(--s-2);padding:var(--s-5) var(--s-4);background:var(--lf-surface);box-shadow:1px 0 3px rgba(17,19,42,.06);overflow-y:auto}
  .sidebar .push{flex:1}
  .tabbar{display:none}
  .page{padding:var(--s-8) var(--s-8) var(--s-10);gap:var(--s-8)}
  .hero{padding:var(--s-8)}
  .hero .art{width:190px;height:190px}
  .home-grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:var(--s-6);align-items:stretch}
  .home-grid>.row-card{align-self:start}
  .course{padding:var(--s-5)}
  .result{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);min-height:100%}
  .result .top-band{justify-content:center;padding:var(--s-10)}
  .result .sheet{margin-top:0;border-radius:0;justify-content:center;padding:var(--s-10)}
  .lesson-body{padding:var(--s-4) var(--s-8) var(--s-8)}
  .lesson-top{padding:var(--s-6) var(--s-8) var(--s-2);max-width:none}
  .fam-grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:var(--s-6);align-items:start}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

/* =====================================================================
   SITE ADDITIONS: colour buttons, shapes, forms, marketing sections, table, dialog, toast
   ===================================================================== */
:root{--max:1120px}
/* ---- coloured chunky buttons: one class per hue; on-colours come from the verified matrix ---- */
.btn.h-primary,.btn.brand{--f:var(--lf-primary);--on:var(--lf-on-primary)}
.btn.h-success,.btn.success{--f:var(--lf-success);--on:var(--lf-on-success)}
.btn.h-reward{--f:var(--lf-reward);--on:var(--lf-on-reward)}
.btn.h-sky{--f:var(--lf-sky);--on:var(--lf-on-sky)}
.btn.h-mint{--f:var(--lf-mint);--on:var(--lf-on-mint)}
.btn.h-berry{--f:var(--lf-berry);--on:var(--lf-on-berry)}
.btn.h-error{--f:var(--lf-error);--on:var(--lf-on-error)}
/* inverse: for use ON a coloured band or card. A plain surface fill */
.btn.inverse{--f:var(--lf-surface);--on:var(--lf-content)}
.btn[disabled]{--f:var(--lf-sunken);--on:var(--lf-content-disabled)}
.btn .ic{width:1.35em;height:1.35em}
.btn{text-decoration:none}
.btn.sm{min-height:var(--target-min);padding:8px 20px;font-size:1rem}
.tile[data-hue=primary]{--f:var(--lf-primary);--on:var(--lf-on-primary)}
.brand-mark{text-decoration:none;color:var(--lf-content);min-height:var(--target-min)}
.coin-nf{animation:float 6s ease-in-out infinite}
.lnk{display:inline-flex;align-items:center;min-height:var(--target-min);min-width:var(--target-min);font:800 1rem/1.3 var(--font-text);color:var(--lf-primary-strong);text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px;cursor:pointer;background:none;border:0;padding:0;text-align:left}
.lnk:focus-visible{outline:3px solid var(--lf-primary-strong);outline-offset:3px;border-radius:6px}
.lnk.plain{text-decoration:none;color:var(--lf-content)}

/* ---- page structure ---- */
.site{--gutter:16px;--section-y:64px}
.wrap{width:100%;max-width:var(--max);margin-inline:auto;padding-inline:var(--gutter)}
.section{padding-block:var(--section-y)}
.section.tight{padding-block:calc(var(--section-y)*.6)}
.section.alt{background:var(--lf-sunken)}
.sec-head{display:flex;flex-direction:column;gap:var(--s-3);margin-bottom:var(--s-8);max-width:60ch}
.sec-head.center{margin-inline:auto;text-align:center;align-items:center}
.eyebrowless{margin:0}

/* ---- top nav ---- */
.snav{position:sticky;top:0;z-index:30;background:var(--lf-base);box-shadow:0 2px 0 var(--lf-outline)}
.snav .wrap{display:flex;align-items:center;justify-content:space-between;gap:var(--s-3);min-height:72px}
.snav .brand-mark{padding:0;font-size:1.25rem}
.nlinks{display:none;align-items:center;gap:var(--s-1)}
.nlink{display:inline-flex;align-items:center;min-height:var(--target-min);padding:0 var(--s-4);border-radius:var(--r-full);font:800 1rem/1.2 var(--font-text);color:var(--lf-content);background:none;border:0;cursor:pointer;text-align:center}
.nlink[aria-current=page]{background:var(--lf-primary-soft);color:var(--lf-primary-strong)}
.nlink:focus-visible{outline:3px solid var(--lf-primary-strong);outline-offset:2px}
.nacts{display:flex;align-items:center;gap:var(--s-2)}
.hide-sm,.hide-lg{display:none}
.burger{display:grid}
.snav .wrap{flex-wrap:wrap}
.msheet{position:absolute;inset:0;z-index:50;background:var(--lf-base);overflow-y:auto;display:flex;flex-direction:column}
.msheet .top{padding:var(--s-3) var(--gutter,16px);display:flex;justify-content:space-between;align-items:center;min-height:72px;box-shadow:0 2px 0 var(--lf-outline)}
.msheet .list{padding:var(--s-4);display:flex;flex-direction:column;gap:var(--s-2)}
.msheet .list .nlink{justify-content:flex-start;min-height:var(--target-base);font-size:1.125rem}
.msheet .foot-actions{padding:var(--s-4);display:flex;flex-direction:column;gap:var(--s-3);margin-top:auto}

/* ---- hero + art stage ---- */
.hero-site{display:grid;gap:var(--s-8);align-items:center;grid-template-columns:minmax(0,1fr)}
.hero-copy{display:flex;flex-direction:column;gap:var(--s-5);min-width:0}
.cta-row{display:flex;flex-wrap:wrap;gap:var(--s-3)}
.cta-row .btn{flex:1 1 auto}
.art-stage{position:relative;aspect-ratio:1/1;width:100%;max-width:520px;margin-inline:auto;border-radius:var(--r-xl);background:var(--lf-primary-soft);overflow:hidden}
.art-stage .coin-big{position:absolute;left:21%;top:20%;width:58%;animation:float 6s ease-in-out infinite}
.art-stage .medal-sm{position:absolute;right:6%;top:6%;width:26%;transform:rotate(10deg)}
.art-stage .coin-sm{position:absolute;left:8%;top:12%;width:20%;transform:rotate(-12deg)}
.art-stage .bubble{position:absolute;left:5%;right:5%;bottom:5%;display:flex;gap:var(--s-3);align-items:center;padding:var(--s-3) var(--s-4);border-radius:var(--r-lg);background:var(--lf-surface);box-shadow:0 4px 16px rgba(17,19,42,.14)}
.art-stage .bubble .avatar{width:44px;height:44px;font-size:1.125rem}
.art-stage .float-chip{position:absolute}
.art-stage .float-chip.a{right:8%;top:38%}
.art-stage .float-chip.b{left:6%;top:42%}
.slot-tag{display:none;position:absolute;left:12px;top:12px;z-index:5;padding:4px 12px;border-radius:var(--r-full);background:var(--lf-content);color:var(--lf-base);font:800 .75rem/1.3 var(--font-text);max-width:calc(100% - 24px)}
body[data-slots=on] .slot-tag{display:block}
body[data-slots=on] .art-slot{outline:3px dashed var(--lf-accent);outline-offset:-3px}

/* ---- demo ---- */
.demo{display:grid;gap:var(--s-6);grid-template-columns:minmax(0,1fr);align-items:start}
.demo .panel{background:var(--lf-surface);border-radius:var(--r-xl);padding:var(--s-6);box-shadow:0 4px 16px rgba(17,19,42,.10);display:flex;flex-direction:column;gap:var(--s-4)}

/* ---- identity cards ---- */
.feat-grid{display:grid;gap:var(--s-4);grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.idcard{--f:var(--lf-primary);--on:var(--lf-on-primary);display:flex;flex-direction:column;gap:var(--s-3);background:var(--f);color:var(--on);border-radius:var(--r-lg);padding:var(--s-5)}
.idcard .disc{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--on) 16%,transparent)}
.idcard .disc .ic{width:30px;height:30px}
.idcard p{margin:0}
.idcard .btn{margin-top:auto;align-self:flex-start}
.idcard[data-hue=mint]{--f:var(--lf-mint);--on:var(--lf-on-mint)}
.idcard[data-hue=berry]{--f:var(--lf-berry);--on:var(--lf-on-berry)}
.idcard[data-hue=sky]{--f:var(--lf-sky);--on:var(--lf-on-sky)}
.idcard[data-hue=reward]{--f:var(--lf-reward);--on:var(--lf-on-reward)}

/* ---- steps: a real sequence, so numbers are allowed ---- */
.steps{list-style:none;margin:0;padding:0;display:grid;gap:var(--s-5);grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));counter-reset:step}
.steps li{display:flex;flex-direction:column;gap:var(--s-3);min-width:0}
.steps .n{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--lf-primary);color:var(--lf-on-primary);font:700 1.5rem/1 var(--font-display)}

/* ---- badges: hexagon = collectible ---- */
.badges{display:grid;gap:var(--s-4);grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr))}
.badge{display:flex;flex-direction:column;align-items:center;text-align:center;gap:var(--s-2);padding:var(--s-4) var(--s-3);border-radius:var(--r-lg);background:var(--lf-surface);box-shadow:0 1px 3px rgba(17,19,42,.08);min-width:0}
/* Orchestration (stagger): a collection is revealed as a cascade, each item a beat
   behind the last, rather than a static grid that just appears — read together, the
   items feel like one gesture instead of N unrelated pop-ins. Delay is capped so a
   12-badge grid still finishes settling in well under a second; items beyond the cap
   share the last beat instead of trailing indefinitely.
   prefers-reduced-motion: the animation is entirely disabled by the guard below, so
   items render at their final opacity/position immediately — no JS branch needed. */
@media (prefers-reduced-motion:no-preference){
  .stagger-in{animation:staggerIn var(--dur-component) var(--ease-enter) backwards;
    animation-delay:calc(min(var(--i,0),10) * 45ms)}
}
@keyframes staggerIn{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}
.badge svg.hex{width:88px;height:88px}
.badge.locked svg.hex{filter:none}
.badge.locked .t-label,.badge.locked .t-caption{color:var(--lf-content-muted)}

/* ---- tabs (choose a view = rounded rectangle) ---- */
.tabs{display:flex;flex-wrap:wrap;gap:var(--s-3)}
.tab-btn{flex:1 1 auto;width:auto;justify-content:center;min-height:var(--target-base);padding:8px 20px;font:800 1rem/1.2 var(--font-text)}
.choice[aria-selected=true],.choice[aria-checked=true],.choice[aria-pressed=true]{background:var(--ch-strong,var(--lf-primary-strong));color:#fff}
.tabpanel{margin-top:var(--s-5);background:var(--lf-surface);border-radius:var(--r-xl);padding:var(--s-6);box-shadow:0 1px 3px rgba(17,19,42,.08);display:grid;gap:var(--s-5);grid-template-columns:minmax(0,1fr)}
.checklist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:var(--s-3)}
.checklist li{display:flex;gap:var(--s-3);align-items:flex-start}
.checklist .ic{flex:none;color:var(--lf-success-strong);margin-top:.1em}
.tiles3{display:grid;gap:var(--s-3);grid-template-columns:repeat(auto-fit,minmax(min(100%,130px),1fr))}

/* ---- cta band, footer ---- */
.band{--f:var(--lf-primary);--on:var(--lf-on-primary);background:var(--f);color:var(--on);border-radius:var(--r-xl);padding:var(--s-8) var(--s-6);display:flex;flex-direction:column;align-items:flex-start;gap:var(--s-4)}
.foot{background:var(--lf-sunken);padding-block:var(--s-10) var(--s-6);margin-top:var(--section-y)}
.foot .cols{display:grid;gap:var(--s-6);grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr))}
.foot ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.flink{display:inline-flex;align-items:center;min-height:var(--target-min);min-width:var(--target-min);font:700 1rem/1.3 var(--font-text);color:var(--lf-content);text-decoration:none;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.flink:focus-visible{outline:3px solid var(--lf-primary-strong);outline-offset:2px;border-radius:6px}
.foot .base{margin-top:var(--s-8);padding-top:var(--s-5);box-shadow:0 -2px 0 var(--lf-outline);display:flex;flex-wrap:wrap;gap:var(--s-4);align-items:center;justify-content:space-between}
.langsw{display:inline-flex;gap:4px;padding:4px;border-radius:var(--r-full);background:var(--lf-sunken)}
.langsw button{min-width:var(--target-min);min-height:var(--target-min);border:0;border-radius:var(--r-full);background:transparent;color:var(--lf-content);font:800 1rem/1 var(--font-text);cursor:pointer}
.langsw button[aria-pressed=true]{background:var(--lf-primary);color:var(--lf-on-primary)}
.langsw button:focus-visible{outline:3px solid var(--lf-primary-strong);outline-offset:2px}


/* ---- forms ---- */
.form{display:flex;flex-direction:column;gap:var(--s-5)}
.field{display:flex;flex-direction:column;gap:var(--s-2);min-width:0}
.field .lbl{font:800 1rem/1.3 var(--font-text)}
.hint{font:600 .875rem/1.4 var(--font-text);color:var(--lf-content-muted);margin:0}
.input{width:100%;min-height:var(--target-base);padding:16px 20px;border:0;border-radius:var(--r-md);background:var(--lf-sunken);color:var(--lf-content);font:600 1rem/1.3 var(--font-text);transition:box-shadow var(--dur-micro) var(--ease-standard)}
.input::placeholder{color:var(--lf-content-muted);opacity:1}
.input:focus-visible{outline:none;box-shadow:inset 0 0 0 3px var(--lf-primary-strong),0 0 0 5px var(--lf-primary-soft)}
.field.err .input{box-shadow:inset 0 0 0 3px var(--lf-error-strong)}
.field.err .input:focus-visible{box-shadow:inset 0 0 0 3px var(--lf-error-strong),0 0 0 5px var(--lf-error-soft)}
.errmsg{display:flex;gap:var(--s-2);align-items:flex-start;color:var(--lf-error-strong);font:700 1rem/1.4 var(--font-text);margin:0}
.errmsg .ic{flex:none;width:1.3em;height:1.3em}
.pw{display:flex;gap:var(--s-2);align-items:stretch}
.pw .input{flex:1 1 8rem;min-width:0}
.sel{position:relative}
.sel select{appearance:none;-webkit-appearance:none;padding-right:56px;cursor:pointer}
.sel .ic{position:absolute;right:18px;top:50%;transform:translateY(-50%);pointer-events:none}
.check{position:relative;display:flex;gap:var(--s-3);align-items:flex-start;min-height:var(--target-min);padding:var(--s-2) 0;cursor:pointer}
.check input,.switch input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.check .box{flex:none;width:32px;height:32px;border-radius:10px;background:var(--lf-sunken);display:grid;place-items:center;color:transparent;transition:transform var(--dur-micro) var(--ease-standard),background-color var(--dur-micro) var(--ease-standard)}
.check .box .ic{width:20px;height:20px;stroke-width:3.4}
.check input:checked + .box{background:var(--lf-success);color:var(--lf-on-success)}
.check input:focus-visible + .box,.switch input:focus-visible + .track{outline:3px solid var(--lf-primary-strong);outline-offset:3px}
.switch{position:relative;display:inline-flex;align-items:center;min-height:var(--target-min);min-width:72px;flex:none}
.switch .track{width:64px;height:36px;border-radius:var(--r-full);background:var(--lf-sunken);position:relative;transition:background-color var(--dur-micro) var(--ease-standard)}
.switch .knob{position:absolute;left:4px;top:4px;width:28px;height:28px;border-radius:50%;background:var(--lf-surface);box-shadow:0 1px 2px rgba(0,0,0,.18);transition:transform var(--dur-micro) var(--ease-standard)}
.switch input:checked + .track{background:var(--lf-success);box-shadow:none}
.switch input:checked + .track .knob{transform:translateX(28px)}
.roles{display:grid;gap:var(--s-3);grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr))}
.roles .choice{flex-direction:column;justify-content:center;text-align:center;gap:var(--s-2);padding:var(--s-3)}
.roles .choice .disc{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--ch-soft);color:var(--ch-strong)}
.setting{display:flex;flex-wrap:wrap;gap:var(--s-3) var(--s-4);align-items:center;justify-content:space-between;padding:var(--s-4);border-radius:var(--r-lg);background:var(--lf-surface);box-shadow:0 1px 3px rgba(17,19,42,.08)}
.setting .txt{flex:1 1 14rem;min-width:0;display:flex;flex-direction:column;gap:2px}
.auth{display:grid;gap:var(--s-8);grid-template-columns:minmax(0,1fr);align-items:start}
.auth .card{padding:var(--s-6)}

/* ---- toast, dialog ---- */
.toast{position:fixed;left:12px;right:12px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:70;max-width:520px;margin-inline:auto;display:flex;gap:var(--s-3);align-items:flex-start;padding:var(--s-4);border-radius:var(--r-md);background:var(--lf-success);color:var(--lf-on-success);box-shadow:var(--shadow-float);animation:rise var(--dur-component) var(--ease-enter)}
.toast .disc{width:36px;height:36px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--lf-success);color:var(--lf-on-success)}
.toast .disc .ic{width:20px;height:20px;stroke-width:3.2}
.scrim{position:fixed;inset:0;z-index:65;background:rgba(6,7,19,.66);display:flex;align-items:center;justify-content:center;padding:var(--s-4);overflow-y:auto}
.dialog{width:min(100%,480px);max-height:calc(100% - 32px);flex:none;margin:auto;overflow:auto;background:var(--lf-surface);color:var(--lf-content);border-radius:var(--r-xl);padding:var(--s-6);box-shadow:var(--shadow-float);display:flex;flex-direction:column;gap:var(--s-4)}
.dialog .actions{display:flex;flex-wrap:wrap;gap:var(--s-3)}
.dialog .actions .btn{flex:1 1 auto}

/* ---- streak + level ---- */
.strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:var(--s-2)}
.strip .day{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
/* "Wave" entrance: each day in the streak rises in sequence, like a stadium wave
   crossing the row left to right — the scene's own elements (the seven day dots)
   are what perform the motion, not an element flown in from outside. Reserved for
   the streak strip specifically because it is the one place in the product whose
   whole point is "a sequence completed in order" — the wave's direction literally
   matches what the component means, not motion for its own sake. */
@media (prefers-reduced-motion:no-preference){
  .wave-in{animation:waveRise var(--dur-transition) var(--ease-enter) backwards;
    animation-delay:calc(var(--i,0) * 60ms)}
}
@keyframes waveRise{0%{transform:translateY(0)}35%{transform:translateY(-10px)}100%{transform:translateY(0)}}
.strip .dot{width:100%;max-width:48px;aspect-ratio:1/1;border-radius:50%;display:grid;place-items:center;background:var(--lf-sunken);color:var(--lf-content-muted)}
.strip .dot .ic{width:56%;height:56%}
.strip .done .dot{background:var(--lf-reward);color:var(--lf-on-reward)}
.strip .rest .dot{background:var(--lf-sky);color:var(--lf-on-sky)}
.strip .today .dot{outline:3px solid var(--lf-primary-strong);outline-offset:2px;color:var(--lf-primary-strong);background:var(--lf-surface)}
.strip .lab{font:800 .875rem/1.2 var(--font-text);color:var(--lf-content-muted)}
.legend{display:flex;flex-wrap:wrap;gap:var(--s-2)}
.me-grid{display:flex;flex-direction:column;gap:var(--s-5)}
.profile{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s-4)}
.profile .avatar{width:72px;height:72px;font-size:1.75rem}

/* ---- data table: cells wrap, never truncate; stacks into cards on narrow containers ---- */
.tools{display:flex;flex-wrap:wrap;gap:var(--s-3);align-items:flex-end}
.tools .field{flex:1 1 14rem}
.tbl{width:100%;border-collapse:separate;border-spacing:0;background:var(--lf-surface);border-radius:var(--r-lg);box-shadow:0 1px 3px rgba(17,19,42,.08)}
.tbl th{background:var(--lf-sunken);text-align:left;font:800 .875rem/1.3 var(--font-text);color:var(--lf-content-muted);padding:var(--s-3) var(--s-4)}
.tbl th:first-child{border-top-left-radius:var(--r-lg)} .tbl th:last-child{border-top-right-radius:var(--r-lg)}
.tbl td{padding:var(--s-3) var(--s-4);vertical-align:middle;box-shadow:0 -2px 0 var(--lf-outline);font:600 1rem/1.4 var(--font-text);overflow-wrap:break-word}
.tbl td .ugc{display:block}
.pager{display:flex;flex-wrap:wrap;gap:var(--s-2);align-items:center}
.pager .choice{min-height:var(--target-min);min-width:var(--target-min);padding:8px 16px;justify-content:center}
@container app (max-width:839px){
  .tbl,.tbl tbody,.tbl tr,.tbl td{display:block;width:100%}
  .tbl thead{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  .tbl tr{padding:var(--s-3) 0;box-shadow:0 -2px 0 var(--lf-outline)}
  .tbl tr:first-child{box-shadow:none}
  .tbl td{box-shadow:none;display:grid;grid-template-columns:minmax(0,8rem) minmax(0,1fr);gap:var(--s-3);align-items:start;padding:var(--s-2) var(--s-4)}
  .tbl td::before{content:attr(data-label);font:800 .875rem/1.4 var(--font-text);color:var(--lf-content-muted)}
}

/* ---- 404 ---- */
.nf{display:flex;flex-direction:column;align-items:center;text-align:center;gap:var(--s-5);padding-block:var(--section-y)}
.nf .num{font:700 72px/1 var(--font-display);display:flex;align-items:center;gap:var(--s-1)}
.nf .num svg{width:.85em;height:.85em}

/* ---- responsive by container ---- */
@container app (min-width:640px){
  .hide-sm{display:inline-flex}
  .tabpanel.kids{grid-template-columns:repeat(2,minmax(0,1fr))}
  .band{flex-direction:row;align-items:center;justify-content:space-between;flex-wrap:wrap}
}
@container app (min-width:1120px){
  .nlinks{display:flex}
  .burger{display:none}
  .hide-lg{display:inline-flex}
}
@container app (min-width:840px){
  .hero-site{grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:var(--s-10)}
  .demo{grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:var(--s-10);align-items:center}
  .auth{grid-template-columns:minmax(0,1fr) minmax(0,.9fr)}
  .tabpanel{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);align-items:center}
  .me-grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:var(--s-6);align-items:start}
  .me-grid .full{grid-column:1/-1}
  .site .fam-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--s-6);align-items:start}
}

/* ---- system sheet helpers ---- */
.roles-grid{display:grid;gap:var(--s-4);grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.role{display:flex;flex-direction:column;gap:var(--s-3);align-items:flex-start;padding:var(--s-4);border-radius:var(--r-lg);background:var(--lf-surface);box-shadow:0 1px 3px rgba(17,19,42,.08)}
.shapes{display:grid;gap:var(--s-4);grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));align-items:end}
.shp{display:flex;flex-direction:column;gap:var(--s-2);align-items:flex-start;min-width:0}
.coin-static{width:64px;height:64px}
.form-lab,.fb-lab{display:flex;flex-direction:column;gap:var(--s-4);max-width:560px}
.input.is-focus{outline:none;box-shadow:inset 0 0 0 3px var(--lf-primary-strong),0 0 0 5px var(--lf-primary-soft)}
.rsel select{min-height:40px;border-radius:999px;border:2px solid var(--stage-line);background:var(--stage-well);color:var(--stage-ink);font:800 .9rem var(--font-text);padding:0 16px;cursor:pointer}
.rsel select:focus-visible{outline:3px solid var(--lf-primary-strong);outline-offset:2px}
.sys .sw{min-width:0}

.t-display-2xl{font:700 48px/1.04 var(--font-display);letter-spacing:-.015em;text-wrap:balance;margin:0}

.art-stage.grow{aspect-ratio:auto;min-height:320px}
.mini-tiles{display:grid;gap:var(--s-3);grid-template-columns:repeat(auto-fit,minmax(min(100%,140px),1fr))}
.mini{--f:var(--lf-primary);--on:var(--lf-on-primary);display:flex;flex-direction:column;gap:var(--s-2);padding:var(--s-4);border-radius:var(--r-lg);background:var(--f);color:var(--on);min-width:0}
.mini .disc{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--on) 16%,transparent)}
.mini[data-hue=mint]{--f:var(--lf-mint);--on:var(--lf-on-mint)}
.mini[data-hue=berry]{--f:var(--lf-berry);--on:var(--lf-on-berry)}
.mini[data-hue=reward]{--f:var(--lf-reward);--on:var(--lf-on-reward)}

.nlink{text-decoration:none}
.idcard .checklist .ic{color:inherit}
.auth aside.idcard{align-self:start}
.fam-grid{display:flex;flex-direction:column;gap:var(--s-6)}
.rows{display:flex;flex-direction:column;gap:var(--s-3)}
.switch .knob{background:var(--lf-content-muted);box-shadow:none}
.switch input:checked + .track .knob{background:var(--lf-on-success)}
.tile[data-hue=success]{--f:var(--lf-success);--on:var(--lf-on-success)}

/* ===== stepped scale: sizes change at three container widths, never continuously ===== */
@container app (min-width:640px){
  .t-display-2xl{font-size:56px}.t-display-xl{font-size:40px}.t-display-lg{font-size:32px}.t-numeral-xl{font-size:56px}
  .site{--gutter:24px;--section-y:80px}
}
@container app (min-width:1120px){
  .t-display-2xl{font-size:72px}.nf .num{font-size:96px}
  .site{--gutter:32px;--section-y:96px}
}
/* measure: running text never exceeds 66ch (children's text: 45ch) */
/* measured with Nunito: average character = 0.45em, so 30em is about 66 characters; the `ch` unit (a zero, 0.60em) would give about 88 */
p,.t-body,.t-body-lg{max-width:30em}
.kid-text{max-width:20em}
.sec-head p{max-width:28em}

/* =====================================================================
   v3 COMPOSITION: proportions, rhythm, asymmetry, mobile-first patterns
   ===================================================================== */
/* --- section rhythm: three named paddings from the 4px scale, stepped by container width --- */
.site{--sy-tight:48px;--sy:64px;--sy-loose:80px}
.section{padding-block:var(--sy)}
.section.tight{padding-block:var(--sy-tight)}
.section.loose{padding-block:var(--sy-loose)}
@container app (min-width:640px){.site{--sy-tight:56px;--sy:80px;--sy-loose:96px}}
@container app (min-width:1120px){.site{--sy-tight:64px;--sy:96px;--sy-loose:128px}}
/* a section that is a colour block (breaks the light/alt rhythm on purpose) */
.section.block{background:var(--lf-sky);color:var(--lf-on-sky)}
.section.block .muted{color:var(--lf-on-sky)}
mark{-webkit-box-decoration-break:clone;box-decoration-break:clone;background:linear-gradient(transparent 58%,color-mix(in srgb,var(--lf-reward) 42%,transparent) 58%);color:inherit;padding:0 4px;margin:0 -4px;border-radius:4px}

/* --- hero: 7:5, portrait art (4:5) that hangs over the next section --- */
.hero-site .art-stage{aspect-ratio:4/5;max-width:440px}
.hero-site .art-stage .coin-big{top:22%}
.hero-site .art-stage .float-chip.a{top:46%}
.hero-site .art-stage .float-chip.b{top:54%}
@container app (min-width:840px){
  .hero-site{grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:var(--s-12)}
  .hero-site .art-stage{margin:0 0 calc((var(--sy-loose) + var(--s-10))*-1) auto;position:relative;z-index:2}
  .demo{grid-template-columns:minmax(0,5fr) minmax(0,7fr)}
}

/* --- feature composition: 7:5 then 5:7, each card shows a real piece of the product --- */
.bento{display:grid;gap:var(--s-4);grid-template-columns:minmax(0,1fr)}
.fcard{display:grid;gap:var(--s-6);padding:var(--s-6);border-radius:var(--r-xl);align-content:start;grid-template-columns:minmax(0,1fr)}
.fcard .txt{display:flex;flex-direction:column;gap:var(--s-3);min-width:0}
.fcard .txt .btn{margin-top:var(--s-2)}
.fcard .vis{display:flex;flex-direction:column;gap:var(--s-3);min-width:0;justify-content:center}
.fcard .vis .answer{width:100%}
.fcard .vis .row-card{width:100%}
.fc-coin{width:96px;height:96px;align-self:flex-start}
.tag-row{display:flex;flex-wrap:wrap;gap:var(--s-2)}
.tag{--f:var(--lf-surface);--on:var(--lf-content);display:inline-flex;align-items:center;gap:var(--s-2);min-height:40px;padding:0 var(--s-4) 0 var(--s-3);border-radius:var(--r-full);background:var(--f);color:var(--on);font:800 1rem/1.2 var(--font-text)}
.tag .ic{width:20px;height:20px}
.tag[data-hue=reward]{--f:var(--lf-reward);--on:var(--lf-on-reward)}
.tag[data-hue=mint]{--f:var(--lf-mint);--on:var(--lf-on-mint)}
.tag[data-hue=berry]{--f:var(--lf-berry);--on:var(--lf-on-berry)}
.tag[data-hue=sky]{--f:var(--lf-sky);--on:var(--lf-on-sky)}
@container app (min-width:840px){
  .bento{grid-template-columns:repeat(12,minmax(0,1fr));gap:var(--s-6)}
  .fcard.w7{grid-column:span 7;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:center}
  .fcard.w5{grid-column:span 5}
}

/* --- path: a staircase, not a row of numbered cards --- */
.path{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:var(--s-8);position:relative}
.path::before{content:"";position:absolute;left:23px;top:24px;bottom:24px;border-left:3px dotted var(--lf-edge)}
.path li{position:relative;padding-left:calc(48px + var(--s-4));min-height:48px}
.path .n{position:absolute;left:0;top:0;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--lf-primary);color:var(--lf-on-primary);font:700 1.5rem/1 var(--font-display)}
.path h3{margin-bottom:var(--s-1)}
@container app (min-width:840px){
  .path{flex-direction:row;align-items:flex-start;gap:var(--s-6)}
  .path::before{display:none}
  .path li{flex:1 1 0;min-width:0;padding-left:0;padding-top:calc(var(--d) + var(--s-4));margin-top:calc((4 - var(--i))*32px)}
  .path .n{width:var(--d);height:var(--d)}
}

/* --- chapters (families): text and a live piece of UI, alternating sides --- */
.chapters{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:var(--s-12)}
.chapter{display:grid;gap:var(--s-6);grid-template-columns:minmax(0,1fr);align-items:center}
.chapter .txt{display:flex;flex-direction:column;gap:var(--s-3);min-width:0}
.chapter .stage{display:flex;flex-direction:column;gap:var(--s-3);justify-content:center;padding:var(--s-6);border-radius:var(--r-xl);background:var(--lf-primary-soft);min-width:0}
.chapter[data-hue=reward] .stage{background:var(--lf-reward-soft)}
.chapter[data-hue=mint] .stage{background:var(--lf-mint-soft)}
.chapter .photo{aspect-ratio:3/2;border-radius:var(--r-lg);display:grid;place-items:center;background:var(--lf-surface);box-shadow:0 1px 3px rgba(17,19,42,.08);color:var(--lf-content-muted)}
.chapter .photo .ic{width:48px;height:48px}
@container app (min-width:840px){
  .chapter{grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:var(--s-12)}
  .chapter:nth-child(even){grid-template-columns:minmax(0,7fr) minmax(0,5fr)}
  .chapter:nth-child(even) .txt{order:2}
}

/* --- chain (how): an unboxed sequence with arrows --- */
.chain{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:var(--s-6) var(--s-4);align-items:flex-start}
.chain .node{display:flex;gap:var(--s-3);align-items:flex-start;flex:1 1 15rem;min-width:0}
.chain .node .disc{width:48px;height:48px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--f);color:var(--on)}
.chain .node[data-hue=primary]{--f:var(--lf-primary);--on:var(--lf-on-primary)}
.chain .node[data-hue=reward]{--f:var(--lf-reward);--on:var(--lf-on-reward)}
.chain .node[data-hue=sky]{--f:var(--lf-sky);--on:var(--lf-on-sky)}
.chain .node[data-hue=berry]{--f:var(--lf-berry);--on:var(--lf-on-berry)}


/* --- mobile: sticky CTA appears after the first screen; reachable with the thumb --- */
.mcta{display:none}
@container app (max-width:639px){
  .mcta{display:block;position:absolute;left:0;right:0;bottom:0;z-index:25;padding:var(--s-3) var(--s-4) calc(var(--s-3) + env(safe-area-inset-bottom,0px));background:var(--lf-base);box-shadow:0 -2px 0 var(--lf-outline);transform:translateY(100%);transition:transform var(--dur-transition) var(--ease-enter)}
  .mcta.on{transform:none}
  .site .foot{padding-bottom:calc(var(--s-6) + 88px)}
}
@media (prefers-reduced-motion:reduce){.mcta{transition:none}}

/* --- tap spacing: neighbouring targets are at least 8px apart --- */
.nlinks{gap:var(--s-2)}
.foot ul{gap:var(--s-2)}
.langsw{gap:var(--s-2)}
.tabbar{gap:var(--s-2)}

/* table cards on small phones: label above value, so long values keep the full width */
@container app (max-width:479px){
  .tbl td{grid-template-columns:minmax(0,1fr);gap:var(--s-1)}
}

.fcard.w7{align-content:center}
.fcard .vis.row{flex-direction:row;align-items:center;flex-wrap:wrap;gap:var(--s-4)}

@container app (min-width:840px){.tbl .chip{white-space:nowrap}}


/* =====================================================================
   v2 ADDITIONS: Mentor, tasks, wallet, parent and staff shells, sign-up steps, teaching-visual board.
   Same tokens and components as everything above (OD-4): no new colours, radii, sizes or durations.
   ===================================================================== */
/* identity tiles (stat tiles on profile and families): solid fill + icon + word */
.tile{--f:var(--lf-primary);--on:var(--lf-on-primary);background:var(--f);color:var(--on);border-radius:var(--r-lg);padding:var(--s-4);display:flex;align-items:center;gap:var(--s-3);min-width:0}
.tile .disc{width:44px;height:44px;border-radius:50%;flex:none;display:grid;place-items:center;background:color-mix(in srgb,var(--on) 16%,transparent)}
.tile .txt{display:flex;flex-direction:column;min-width:0}
.tile[data-hue=reward]{--f:var(--lf-reward);--on:var(--lf-on-reward)}
.tile[data-hue=mint]{--f:var(--lf-mint);--on:var(--lf-on-mint)}
.tile[data-hue=success]{--f:var(--lf-success);--on:var(--lf-on-success)}
.tile[data-hue=primary]{--f:var(--lf-primary);--on:var(--lf-on-primary)}

/* Mentor avatars: lettered placeholder in the character's identity hue until the 3D asset lands */
.m-av{background:var(--lf-berry);color:var(--lf-on-berry)}
.m-av[data-hue=sky],.tab-av[data-hue=sky]{background:var(--lf-sky);color:var(--lf-on-sky)}
.m-av[data-hue=mint],.tab-av[data-hue=mint]{background:var(--lf-mint);color:var(--lf-on-mint)}
.m-av[data-hue=primary],.tab-av[data-hue=primary]{background:var(--lf-primary);color:var(--lf-on-primary)}
.m-av-lg{width:56px;height:56px}
.m-av.sm{width:40px;height:40px;font-size:1rem}
.tab-av{width:28px;height:28px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--lf-berry);color:var(--lf-on-berry);font:700 .875rem/1 var(--font-display)}
.lesson .avatar.m-av{background:color-mix(in srgb,var(--lf-on-primary) 20%,transparent);color:var(--lf-on-primary);width:44px;height:44px;font-size:1.125rem}
.snav .brand-mark,.appbar .brand-mark{min-height:var(--target-min)}

/* lesson: guided-review offer from the Mentor (an offer, never a penalty) */
.offer{display:flex;gap:var(--s-3);align-items:flex-start;padding:var(--s-4);border-radius:var(--r-md);background:color-mix(in srgb,var(--lf-on-primary) 14%,transparent);color:var(--lf-on-primary)}
.offer .txt{display:flex;flex-direction:column;gap:var(--s-2);min-width:0}
.offer-acts{display:flex;flex-wrap:wrap;gap:var(--s-2) var(--s-4);align-items:center;margin-top:var(--s-2)}
.lnk.on-fill{color:var(--lf-on-primary)}
.lnk .ic{width:1.25em;height:1.25em;margin-right:var(--s-1)}
.result .vs-head{display:flex;flex-wrap:wrap;gap:var(--s-2) var(--s-3);align-items:center;justify-content:space-between}
.chip.on-accent{--sf:color-mix(in srgb,var(--lf-on-accent) 14%,transparent);--st:var(--lf-on-accent)}
.result .bar>i{transition-duration:var(--dur-celebration)}

/* Mentor screen */
.mentor-grid{display:grid;gap:var(--s-5);grid-template-columns:minmax(0,1fr)}
.mslot{aspect-ratio:auto;min-height:220px;max-width:none;display:grid;place-items:center;background:var(--lf-berry-soft)}
.mslot[data-hue=sky]{background:var(--lf-sky-soft)} .mslot[data-hue=mint]{background:var(--lf-mint-soft)} .mslot[data-hue=primary]{background:var(--lf-primary-soft)}
.m-big{width:144px;height:144px;border-radius:50%;display:grid;place-items:center;font:700 72px/1 var(--font-display);background:var(--lf-berry);color:var(--lf-on-berry)}
.mslot[data-hue=sky] .m-big{background:var(--lf-sky);color:var(--lf-on-sky)} .mslot[data-hue=mint] .m-big{background:var(--lf-mint);color:var(--lf-on-mint)} .mslot[data-hue=primary] .m-big{background:var(--lf-primary);color:var(--lf-on-primary)}
.chat{display:flex;flex-direction:column;gap:var(--s-5)}
.bubbles{display:flex;flex-direction:column;gap:var(--s-3)}
.bub{display:flex;gap:var(--s-3);align-items:flex-end;max-width:36em}
.bub .b{padding:var(--s-3) var(--s-4);border-radius:var(--r-md);background:var(--lf-sunken);min-width:0}
.bub.u{align-self:flex-end}
.bub.u .b{background:var(--lf-primary-soft)}
.review-card{display:flex;flex-direction:column;gap:var(--s-3)}
.mchoices{display:grid;gap:var(--s-3);grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.mchoice{flex-wrap:wrap}
.mchoice .mc-txt{display:flex;flex-direction:column;gap:var(--s-1);flex:1 1 10rem;min-width:0}
.mchoice[aria-checked=true]{background:var(--lf-primary-soft);color:var(--lf-content);box-shadow:inset 0 0 0 3px var(--lf-primary-strong)}
.hint .ic,.callout .ic,.state-line .ic{width:1.25em;height:1.25em;vertical-align:-.25em}

/* tasks, wallet */
.lock-card{display:flex;flex-direction:column;gap:var(--s-4);align-items:flex-start}
.lock-card .disc,.done-disc{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--lf-primary-soft);color:var(--lf-primary-strong)}
.done-disc{background:var(--lf-success);color:var(--lf-on-success)}
.confirm-msg{display:flex;gap:var(--s-2);align-items:flex-start;margin:0;padding:var(--s-3) var(--s-4);border-radius:var(--r-md);background:var(--lf-success-soft);color:var(--lf-success-strong);font:800 1rem/1.4 var(--font-text)}
.confirm-msg .ic{flex:none;width:1.25em;height:1.25em}
.goal{display:flex;flex-direction:column;gap:var(--s-3)}
.goal-head{display:flex;gap:var(--s-3);align-items:center}
.goal-head .disc{width:48px;height:48px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--sf);color:var(--st)}
.src-row{display:flex;flex-wrap:wrap;gap:var(--s-2)}
.src-row .choice{flex:1 1 auto;width:auto;min-height:var(--target-base);justify-content:center;padding:8px 16px;font-size:1rem}
.card.form{gap:var(--s-4)}
.chip-row{display:flex;flex-wrap:wrap;gap:var(--s-2)}

/* console shells: parent and staff (own navigation, same components) */
.appbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:var(--s-2) var(--s-3);padding:var(--s-3) var(--s-4);background:var(--lf-surface);box-shadow:0 1px 3px rgba(17,19,42,.08)}
.appbar .brand-mark{padding:0}
.role-chip{align-self:flex-start;margin:0 0 var(--s-2) var(--s-4)}
.appbar .role-chip{margin:0}
.console .nav-item[aria-current=true],.console + .tabbar .tab[aria-current=true]{background:var(--lf-primary-soft);color:var(--lf-primary-strong)}
.parent-grid,.staff-grid{display:flex;flex-direction:column;gap:var(--s-5)}
.story{display:flex;flex-direction:column;gap:var(--s-3)}
.ask-box{display:flex;gap:var(--s-3);align-items:flex-start;padding:var(--s-4);border-radius:var(--r-md);background:var(--lf-primary-soft)}
.ask-box .disc{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--lf-primary);color:var(--lf-on-primary)}
.idcard.tip p{margin:0}
.pcard{background:var(--lf-primary);color:var(--lf-on-primary);border-radius:var(--r-lg);padding:var(--s-5);display:flex;flex-direction:column;gap:var(--s-6);margin-top:var(--s-3)}
.pcard .pc-top{display:flex;flex-wrap:wrap;gap:var(--s-2);align-items:center;justify-content:space-between}
.pcard .brand-mark{padding:0;color:inherit;font-size:1rem;min-height:0}
.pcard .brand-mark i{background:color-mix(in srgb,currentColor 20%,transparent);color:inherit}
.pcard.frozen{background:var(--lf-sunken);color:var(--lf-content)}
.chip.on-card{--sf:var(--lf-on-primary);--st:var(--lf-primary-ridge)}
.setting.flat{box-shadow:none;padding:var(--s-4) 0 0;background:none}
.state-line{display:flex;gap:var(--s-2);align-items:flex-start;margin:0;font:800 1rem/1.4 var(--font-text);color:var(--lf-success-strong)}
.state-line .ic{flex:none}
.state-line.is-frozen{color:var(--lf-primary-strong)}
.pager .choice{width:auto}
.tbl td .chip{justify-self:start;align-self:start}
.msg-row{display:flex;flex-wrap:wrap;gap:var(--s-2)}
.msg-row .input{flex:1 1 14rem;min-width:0}
.msg-row .btn{flex:1 0 auto}
.stack{display:flex;flex-direction:column;gap:var(--s-5)}
.acts{display:flex;flex-wrap:wrap;gap:var(--s-2) var(--s-3);align-items:center}
.acts .np{flex:1 1 12rem;display:flex;gap:var(--s-2);align-items:flex-start}
.acts .np .ic{flex:none}
.perm-list{list-style:none;margin:var(--s-3) 0;padding:0;display:flex;flex-direction:column;gap:var(--s-2)}
.perm-list li{display:flex;gap:var(--s-3);align-items:flex-start}
.perm-list .ic{flex:none;color:var(--lf-success-strong);margin-top:2px}
.perm-list li.no .ic{color:var(--lf-content-muted)}
.audit{margin:var(--s-3) 0 0;padding-left:var(--s-5);display:flex;flex-direction:column;gap:var(--s-3)}
.card>.t-title+.t-body,.card>.t-title+.pcard{margin-top:var(--s-3)}
#p-mentor{display:flex;flex-direction:column;gap:var(--s-3);align-items:flex-start}
#p-card .t-title{margin:0}

/* sign-up steps */
.dob{display:grid;gap:var(--s-4);grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr))}
.nsteps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:var(--s-3)}
.nsteps li{display:flex;gap:var(--s-3);align-items:flex-start}
.nsteps .n{width:32px;height:32px;border-radius:50%;flex:none;display:grid;place-items:center;background:color-mix(in srgb,var(--on) 16%,transparent);font:700 1rem/1 var(--font-display)}
.or{display:flex;align-items:center;gap:var(--s-3)}
.or::before,.or::after{content:"";flex:1;height:2px;background:var(--lf-sunken)}
.g-chip{align-self:flex-start;margin:0}
.callout.prot{display:flex;flex-direction:column;gap:var(--s-3)}
.hero-sub{max-width:24em}
.banner.rest{background:var(--lf-sky-soft);color:var(--lf-content)}
.banner.rest .disc{background:var(--lf-sky);color:var(--lf-on-sky)}
.mentor-row{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s-3);margin-top:var(--s-2);padding-top:var(--s-4);box-shadow:0 -2px 0 var(--lf-sunken)}
.mentor-row .mid{display:flex;flex-direction:column;flex:1 1 8rem;min-width:0}

/* system sheet: ridge shown as a value, not as a relief edge (K24) */
.ridge-val{display:flex;align-items:center;gap:var(--s-2);padding:var(--s-3) var(--s-4) 0}
.rdot{width:20px;height:20px;border-radius:50%;flex:none}
.sys .dialog{box-shadow:var(--shadow-float)}

/* ---------------- teaching-visual board (05-TEACHING-VISUALS.md) ----------------
   Full-bleed lesson hue around ONE neutral board. Series: sky, mint, berry only (fills for bars, -strong for
   strokes); primary only for selection and focus; axis in edge; gridlines in outline; labels are HTML. */
.board-screen .lesson-top h1{margin:0}
.lesson-foot{background:var(--lf-primary)}
.board-screen .lesson-foot{position:static}
.checklist li,.nsteps li,.perm-list li,.vlegend li{max-width:32em}
.bbody{flex:1;width:100%;max-width:760px;margin:0 auto;padding:0 var(--s-4) var(--s-6);display:flex;flex-direction:column;gap:var(--s-5)}
.bpick{display:flex;flex-wrap:wrap;gap:var(--s-2)}
.bp{flex:0 1 auto;min-height:var(--target-min);padding:8px 16px;border:0;border-radius:var(--r-full);background:color-mix(in srgb,var(--lf-on-primary) 14%,transparent);color:var(--lf-on-primary);font:800 1rem/1.2 var(--font-text);cursor:pointer;transition:background-color var(--dur-micro) var(--ease-standard)}
.bp[aria-selected=true]{background:var(--lf-surface);color:var(--lf-primary-strong)}
.bp:focus-visible,.rslot:focus-visible,.nl-handle:focus-visible{outline:3px solid var(--lf-primary-strong);outline-offset:3px}
.board-screen .bp:focus-visible{outline-color:var(--lf-on-primary)}
.vboard{background:var(--lf-surface);color:var(--lf-content);border-radius:var(--r-lg);padding:var(--s-4);display:flex;flex-direction:column;gap:var(--s-4);min-width:0}
.vstrip{display:flex;flex-wrap:wrap;gap:var(--s-3)}
.vstrip>.btn{flex:1 1 auto}
.vstrip .field{flex:1 1 100%}
.field.on-fill .lbl,.field.on-fill .hint,.field.on-fill .errmsg{color:var(--lf-on-primary)}
.bhint{margin:0}
/* number line */
.nl{padding:0 var(--s-8)}
.nl-track{position:relative;height:64px;touch-action:none;cursor:pointer}
.nl-svg{position:absolute;inset:0;overflow:visible}
.nl-svg .ax,.pax .ax{stroke:var(--lf-edge);stroke-width:2}
.nl-svg .tk{stroke:var(--lf-edge);stroke-width:2;opacity:.6}
.nl-labels{position:relative;height:24px}
.nl-lab,.ax-lab{position:absolute;top:0;transform:translateX(-50%);font:800 1rem/1.4 var(--font-text);color:var(--lf-content)}
.nl-handle{position:absolute;top:0;width:64px;height:64px;transform:translateX(-50%);display:grid;place-items:center;border-radius:50%;cursor:grab;touch-action:none;transition:left var(--dur-component) var(--ease-standard)}
.nl-handle .knob{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--lf-primary-strong);color:var(--lf-surface);box-shadow:0 0 0 3px var(--lf-surface),0 0 0 6px var(--lf-primary-strong)}
.nl-handle.ok .knob{background:var(--lf-success-strong);box-shadow:0 0 0 3px var(--lf-surface),0 0 0 6px var(--lf-success-strong)}
.nl-handle.no .knob{background:var(--lf-content);box-shadow:0 0 0 3px var(--lf-surface),0 0 0 6px var(--lf-content)}
.nl-handle .knob .ic{width:20px;height:20px;stroke-width:3.2}
.bres{display:flex;flex-wrap:wrap;gap:var(--s-2) var(--s-3);align-items:center;margin:0}
.vmark{display:inline-flex;align-items:center;gap:var(--s-1);font:800 1rem/1.3 var(--font-text)}
.vmark.ok{color:var(--lf-success-strong)} .vmark.no{color:var(--lf-content)}
.vmark .ic{width:1.25em;height:1.25em;stroke-width:3}
/* discount */
.ptag{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s-3)}
.coin-sm2{width:48px;height:48px;flex:none}
.vtag{display:inline-flex;align-items:center;min-height:32px;padding:4px 12px;border-radius:var(--r-full);background:var(--lf-sunken);color:var(--lf-content);font:800 .875rem/1.25 var(--font-text)}
.pbar-empty{display:grid;place-items:center;min-height:96px;padding:var(--s-4);border-radius:var(--r-md);background:var(--lf-sunken);text-align:center}
.pbar{display:flex;gap:4px;height:40px}
.pbar i,.lsw{display:block;border-radius:var(--r-sm)}
.s1{background:var(--lf-sky)}
.s2{background-color:var(--lf-mint);background-image:repeating-linear-gradient(45deg,rgba(17,19,42,.34) 0 3px,transparent 3px 10px)}
.pax{position:relative}
.pax svg{display:block;overflow:visible}
.pax-labs{position:relative;height:24px}
.ax-lab{font-size:.875rem}
.pax-labs .ax-lab:first-child{transform:none}
.pax-labs .ax-lab:last-child{transform:translateX(-100%)}
.vlegend{list-style:none;margin:var(--s-2) 0 0;padding:0;display:flex;flex-direction:column;gap:var(--s-2)}
.vlegend li{display:flex;gap:var(--s-3);align-items:flex-start}
.lsw{width:24px;height:24px;flex:none}
.wsteps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:var(--s-2)}
.wsteps li{display:flex;flex-direction:column;gap:2px;padding:var(--s-3) var(--s-4);border-radius:var(--r-md)}
.wsteps li.active{background:var(--lf-primary-soft)}
.wsteps li.done{color:var(--lf-content-muted)}
.vtable{width:100%;border-collapse:collapse;font:600 1rem/1.4 var(--font-text)}
.vtable th,.vtable td{text-align:left;padding:var(--s-2) var(--s-3);box-shadow:0 -2px 0 var(--lf-sunken)}
.vtable thead th{box-shadow:none;font:800 .875rem/1.3 var(--font-text);color:var(--lf-content-muted)}
/* rule builder */
.rule{display:flex;flex-direction:column;gap:var(--s-3)}
.rline{display:flex;flex-wrap:wrap;gap:var(--s-2) var(--s-3);align-items:flex-start}
.kw{flex:0 0 auto;min-width:5.5em;min-height:var(--target-base);display:flex;align-items:center;font:700 1rem/1.2 var(--font-display);letter-spacing:.04em;color:var(--lf-content)}
.rslots{flex:1 1 14rem;min-width:0;display:flex;flex-direction:column;gap:var(--s-2)}
.rslot{display:flex;align-items:center;justify-content:space-between;gap:var(--s-2);width:100%;min-height:var(--target-base);padding:12px 16px;border:0;border-radius:var(--r-md);background:var(--lf-sunken);color:var(--lf-content-muted);font:800 1rem/1.3 var(--font-text);text-align:left;cursor:pointer;transition:background-color var(--dur-micro) var(--ease-standard)}
.rslot.filled{color:var(--lf-content)}
.rslot[aria-expanded=true]{box-shadow:inset 0 0 0 3px var(--lf-primary-strong)}
.rslot .ic{flex:none;width:1.25em;height:1.25em}
.ropts{display:flex;flex-direction:column;gap:var(--s-2)}
.ropts .choice{background:var(--lf-surface);box-shadow:0 1px 3px rgba(17,19,42,.14)}
.scards{list-style:none;margin:0;padding:0;display:grid;gap:var(--s-3);grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
.scard{display:flex;flex-direction:column;gap:var(--s-2);padding:var(--s-4);border-radius:var(--r-md);background:var(--lf-sunken);min-width:0}
.scard p{margin:0}
.scard dl{margin:0;display:flex;flex-direction:column;gap:2px}
.scard dl div{display:flex;flex-wrap:wrap;gap:0 var(--s-2)}
.scard dt{font:700 .875rem/1.4 var(--font-text);color:var(--lf-content-muted)}
.scard dt::after{content:":"}
.scard dd{margin:0;font:800 .875rem/1.4 var(--font-text)}

/* a board table reflows to one card per row on narrow containers (05 §3), labels stay visible */
@container app (max-width:479px){
  .vtable,.vtable tbody,.vtable tr,.vtable th,.vtable td{display:block;width:100%}
  .vtable thead{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  .vtable tr{padding:var(--s-2) 0;box-shadow:0 -2px 0 var(--lf-sunken)}
  .vtable th,.vtable td{box-shadow:none;padding:2px var(--s-3)}
  .vtable td::before{content:attr(data-label) ": ";font-weight:700;color:var(--lf-content-muted)}
}
/* pockets size by the space they actually get (a narrow card column included), never by the app width alone */
@container app (min-width:480px){ .pocket .lbl{flex:none} .pockets{grid-template-columns:repeat(auto-fit,minmax(min(100%,176px),1fr))} }
@container app (min-width:840px){
  .fam-grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);align-items:start}
  .mentor-grid{grid-template-columns:minmax(0,5fr) minmax(0,7fr);align-items:start}
  .parent-grid{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:var(--s-6);align-items:start}
  .parent-grid .full{grid-column:1/-1}
  .staff-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--s-6);align-items:start}
  .appbar{display:none}
  .bbody{padding:var(--s-4) var(--s-8) var(--s-8)}
}
@container app (max-width:839px){
  .console .sidebar{display:none}
}
@media (prefers-reduced-motion:reduce){.nl-handle{transition:none}}
/* keep LAST so it wins over .btn (Text Fit Contract rule 8) */
.ugc,.btn.ugc{overflow-wrap:anywhere;hyphens:none;min-inline-size:0}
</style>

/* locale-aware number parser (05 §5): strips the locale's group separator, reads its decimal separator */
function parseLocaleNumber(str){
  const parts=new Intl.NumberFormat(LOC()).formatToParts(12345.6);
  const g=(parts.find(p=>p.type==='group')||{}).value||',', d=(parts.find(p=>p.type==='decimal')||{}).value||'.';
  let s=String(str).trim().replace(/\s/g,''); if(!s) return NaN;
  s=s.split(g).join(''); if(d!=='.') s=s.split(d).join('.');
  return /^-?\d+(\.\d+)?$/.test(s)?Number(s):NaN;
}

function stressify(s){ if(typeof s!=='string') return s; const w=s.split(' '); const n=Math.max(1,Math.ceil(w.length*.4)); return s+' '+w.slice(0,n).join(' '); }
const KEEP=['h','i','s','k','id','by'];
function deepMap(o,f){ if(typeof o==='string') return f(o); if(typeof o==='function') return (...a)=>f(o(...a)); if(Array.isArray(o)) return o.map(x=>deepMap(x,f)); if(o&&typeof o==='object'){const r={};for(const k in o) r[k]=KEEP.includes(k)?o[k]:deepMap(o[k],f);return r;} return o; }

const REDUCED=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
